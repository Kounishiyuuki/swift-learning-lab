eeter { var name: String { get } }\nextension Greeter { func greet() -> String { \"Hello, \\(name)\" } }\nstruct User: Greeter { let name: String }\nstruct Robot: Greeter { let name: String }\nprint(User(name: \"Yuki\").greet(), Robot(name: \"R2\").greet())", "output": "Hello, Yuki Hello, R2", "explanation": "2つの型がどちらも name を持つだけで、同じ greet を共有できています。"}}, "seriesId": "swift-protocol-design", "seriesStep": 2}, {"id": "practice-swift-077", "track": "swift", "lessonId": "swift-generics", "type": "reorder", "difficulty": 4, "title": "ジェネリック関数を並べ替える", "prompt": "どんな型の配列でも先頭2件を返す関数を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["protocols", "collections", "functions"], "content": {"blocks": [{"id": "b1", "code": "    var result: [T] = []"}, {"id": "b2", "code": "func firstTwo<T>(_ items: [T]) -> [T] {"}, {"id": "b3", "code": "    for item in items.prefix(2) {"}, {"id": "b4", "code": "        result.append(item)"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "    return result"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "print(firstTwo([1, 2, 3]))"}]}, "solution": {"order": ["b2", "b1", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["型パラメータ T は関数の宣言行で導入します。それより前に T は使えません。", "結果を入れる配列は、ループの前に用意します。", "宣言 → 結果の初期化 → ループ → 追加 → ループを閉じる → return → 関数を閉じる → 呼び出し、の順です。"], "explanation": "`<T>` は関数の宣言行で型パラメータを導入する記法で、それ以降の引数・戻り値・本体で T を使えます。結果を入れる `var result: [T] = []` は T が導入されたあと、かつループの前に置きます。`prefix(2)` は要素が2件未満でも安全に動き、その場合はあるだけを返します。呼び出し `firstTwo([1, 2, 3])` では T が Int と推論され、[1, 2] が出力されます。", "detail": {"concept": "ジェネリクスは「型を後から決める」仕組みです。呼び出し側の引数から型が推論されるため、Int でも String でも同じ実装を使い回せます。", "steps": ["`func firstTwo<T>(_ items: [T]) -> [T] {` … T を導入し、引数と戻り値の型に使う。", "`var result: [T] = []` … T の配列として初期化する。", "`items.prefix(2)` … 先頭2件（足りなければあるだけ）を返す。", "`result.append(item)` で詰め、ループの外で return する。", "呼び出し時に T = Int と推論され、[1, 2] が返る。"], "whyCorrect": "T の導入が宣言行にあり、以降の行だけが T を参照しているため、スコープの前後関係が正しく成立します。prefix によって件数不足でも安全です。", "commonMistakes": ["`items[0]` と `items[1]` で直接取り出す実装は、要素が1件のときにクラッシュします。prefix なら件数を気にせずに済みます。", "T に制約を付けずに `>` などの演算子を使おうとするとコンパイルエラーになります。比較が必要なら `<T: Comparable>` の制約が要ります。"], "takeaway": "型パラメータは宣言行で導入。件数に依存する処理は prefix / dropFirst で安全に書く。", "example": {"code": "func firstTwo<T>(_ items: [T]) -> [T] { Array(items.prefix(2)) }\nprint(firstTwo([1, 2, 3]), firstTwo([\"a\"]), firstTwo([Int]()))", "output": "[1, 2] [\"a\"] []", "explanation": "同じ関数が Int でも String でも動き、要素数が足りない場合も落ちません。"}}, "seriesId": "swift-generic-basics", "seriesStep": 1}, {"id": "practice-swift-078", "track": "swift", "lessonId": "swift-generics", "type": "buildFunction", "difficulty": 4, "title": "比較できる型に限定した関数を組み立てる", "prompt": "配列の最大値を返す関数を作ります。空配列では nil を返します。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["protocols", "collections", "optional"], "content": {"blocks": [{"id": "b1", "code": "func maxValue<T: Comparable>(_ items: [T]) -> T? {"}, {"id": "b2", "code": "    guard var best = items.first else { return nil }"}, {"id": "b3", "code": "    for item in items.dropFirst() where item > best {"}, {"id": "b4", "code": "        best = item"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "    return best"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "func maxValue<T>(_ items: [T]) -> T? {"}, {"id": "b9", "code": "    return items.first"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7"]}, "hints": ["`>` で比較するには、その型が比較可能であるという制約が必要です。制約のない T では書けません。", "空配列のときに返す値がないので、戻り値は Optional です。最初の要素を取り出せるかで判定できます。", "宣言（制約付き）→ 最初の要素を取り出す guard → 残りを比較するループ → 更新 → ループを閉じる → return → 関数を閉じる、の7行です。"], "explanation": "`<T: Comparable>` は「T は比較可能な型に限る」という制約で、これがないと `item > best` が 'Binary operator > cannot be applied to two T operands' になります。空配列では first が nil なので guard で早期に nil を返し、そうでなければ最初の要素を暫定の最大値として残りと比較します。`items.first` をそのまま返す実装は最大値ではなく先頭要素を返すだけで、要件を満たしません。", "detail": {"concept": "ジェネリクスの制約は「この型に何ができるか」をコンパイラに伝えるものです。制約がなければ、その型に対してできることは代入と受け渡しだけになります。", "steps": ["`<T: Comparable>` … T に比較演算子が使えることを保証する。", "`guard var best = items.first else { return nil }` … 空配列を先に処理し、以降は要素があると保証される。", "`items.dropFirst()` … 先頭は既に best なので、2件目以降だけを見る。", "`where item > best` … 条件を満たすときだけ本体が実行される。", "ループ後に best を返す。"], "whyCorrect": "制約により比較が可能になり、guard により空配列が除外されるため、ループ内では常に有効な best が存在します。境界（空配列・1要素）でも破綻しません。", "commonMistakes": ["制約を付け忘れて比較演算子が使えず、原因が分からないまま実装を変えてしまう間違いです。エラーメッセージは型パラメータ名で出るため読みにくく感じます。", "空配列で `items[0]` にアクセスする実装はクラッシュします。Optional を返す設計にすると、呼び出し側に判断を委ねられます。"], "takeaway": "型パラメータにできることは制約で決まる。比較したいなら Comparable。", "example": {"code": "func maxValue<T: Comparable>(_ items: [T]) -> T? {\n    guard var best = items.first else { return nil }\n    for item in items.dropFirst() where item > best { best = item }\n    return best\n}\nprint(maxValue([3, 9, 1]) ?? -1, maxValue([\"a\", \"z\"]) ?? \"-\", maxValue([Int]()) ?? -1)", "output": "9 z -1", "explanation": "数値でも文字列でも動き、空配列では nil が返って既定値が使われます。"}}, "seriesId": "swift-generic-basics", "seriesStep": 2}, {"id": "practice-swift-079", "track": "swift", "lessonId": "swift-any-some", "type": "chooseBlocks", "difficulty": 4, "title": "異なる型を1つの配列に入れる行だけ選ぶ", "prompt": "Circle と Square を同じ配列に入れて面積を並べます。必要な行だけを選び、正しい順に並べてください。", "skills": ["protocols", "types", "collections"], "content": {"blocks": [{"id": "b1", "code": "protocol Shape { var area: Double { get } }"}, {"id": "b2", "code": "struct Circle: Shape { let r: Double; var area: Double { 3.14 * r * r } }"}, {"id": "b3", "code": "struct Square: Shape { let s: Double; var area: Double { s * s } }"}, {"id": "b4", "code": "let shapes: [any Shape] = [Circle(r: 1), Square(s: 2)]"}, {"id": "b5", "code": "print(shapes.map(\\.area))"}, {"id": "b6", "code": "let shapes: [some Shape] = [Circle(r: 1), Square(s: 2)]"}, {"id": "b7", "code": "let shapes: [Shape.Type] = [Circle.self, Square.self]"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5"], "order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["配列の要素は Circle と Square という異なる具体型です。1つの型に固定できません。", "some は「隠れているが常に同じ1つの型」を意味するので、異なる型を混ぜられません。", "実行時に異なる具体型を保持できるほうの記法を選びます。型そのものを並べる書き方では面積を取れません。"], "explanation": "`[any Shape]` は存在型の配列で、Shape に準拠していれば異なる具体型を混ぜて保持できます。`[some Shape]` は不透明型で「1つの具体型に固定される」という意味なので、Circle と Square を同じ配列に入れることはできずコンパイルエラーになります。`[Shape.Type]` は型そのもの（メタタイプ）の配列で、インスタンスではないため area を参照できません。`shapes.map(\\.area)` は keyPath を使った書き方で、出力は [3.14, 4.0] です。", "detail": {"concept": "any（存在型）は「実行時に具体型が変わりうる箱」、some（不透明型）は「呼び出し側からは隠れているが1つに決まっている型」です。混在させたいのか、隠したいだけなのかで選びます。", "steps": ["Circle と Square はどちらも Shape に準拠している。", "配列に混ぜるということは、要素の具体型が一意に決まらないということ。", "したがって要素の型は `any Shape` になる。", "`map(\\.area)` は各要素の area を取り出し、[3.14, 4.0] を作る。"], "whyCorrect": "any Shape は具体型を実行時に保持できるため、異なる型の混在が成立します。プロトコルの要求である area は、どの具体型でも呼び出せることが保証されています。", "commonMistakes": ["some を「any の新しい書き方」と誤解して混在させようとする間違いです。some は同一性の保証がある分、混在ができません。", "any は実行時のボックス化と動的ディスパッチを伴うため、性能が重要な場面では some やジェネリクスを検討します。混ぜる必要がないなら any は不要です。"], "takeaway": "混ぜたいなら any、隠したいだけなら some。目的が違う。", "example": {"code": "protocol Shape { var area: Double { get } }\nstruct Circle: Shape { let r: Double; var area: Double { 3.14 * r * r } }\nstruct Square: Shape { let s: Double; var area: Double { s * s } }\nlet shapes: [any Shape] = [Circle(r: 1), Square(s: 2)]\nprint(shapes.map(\\.area))", "output": "[3.14, 4.0]", "explanation": "異なる具体型が1つの配列に入り、共通の要求である area を通して扱えています。"}}}, {"id": "practice-swift-080", "track": "swift", "lessonId": "swift-type-casting", "type": "repair", "difficulty": 4, "title": "[Any]から数値だけを安全に取り出す", "prompt": "[Any] から Int だけを合計したいのですが、3行目がビルドできません。2行目の修正として最も適切なものを選んでください。", "skills": ["types", "collections", "debugging"], "content": {"code": "let values: [Any] = [1, \"two\", 3]\nlet numbers = values.filter { $0 is Int }\nlet total = numbers.reduce(0, +)\nprint(total)", "options": [{"id": "o1", "code": "let numbers = values.compactMap { $0 as? Int }"}, {"id": "o2", "code": "let numbers = values.map { $0 as! Int }"}, {"id": "o3", "code": "let numbers = values as? [Int]"}, {"id": "o4", "code": "let numbers = values.filter { $0 as? Int != nil }"}]}, "solution": {"optionId": "o1", "fixedCode": "let values: [Any] = [1, \"two\", 3]\nlet numbers = values.compactMap { $0 as? Int }\nlet total = numbers.reduce(0, +)\nprint(total)"}, "hints": ["filter は要素を絞るだけで、型は変えません。絞ったあとも要素の型は Any のままです。", "型を変えるには変換が必要です。失敗しうる変換なので、結果は Optional になります。", "変換と nil の除去を同時に行うメソッドがあります。強制キャストは文字列要素でクラッシュします。"], "explanation": "バグは2行目です。`filter { $0 is Int }` は条件に合う要素を残すだけで型は [Any] のままなので、3行目の `reduce(0, +)` が Any に対する加算となりコンパイルエラーになります。修正は `compactMap { $0 as? Int }` で、条件付きキャストに成功した要素だけを Int として取り出します（結果は [1, 3]、合計4）。`as!` を使う版はビルドが通っても \"two\" のキャストで実行時クラッシュし、`values as? [Int]` は配列全体のキャストなので Int 以外が混じる時点で nil になり、さらに Optional のまま reduce できません。filter を条件式だけ変えても型は Any のままです。", "detail": {"concept": "`is` は判定、`as?` は失敗しうる変換、`as!` は失敗したら停止する変換です。コレクションから特定の型だけを取り出す場面では、判定ではなく変換が必要になります。", "steps": ["`values` の要素の静的な型は Any。", "filter は述語で絞るだけなので、結果も [Any]。", "`compactMap { $0 as? Int }` は各要素を Int? に変換し、nil を除いて [Int] を返す。", "[Int] になったので reduce(0, +) が使え、1 + 3 = 4 になる。"], "whyCorrect": "compactMap が判定と変換と除去を一度に行うため、後続の処理が静的に Int として扱えます。実行時の失敗経路も残りません。", "commonMistakes": ["`is` で確認したあとに `as!` で取り出す2段構えは、確認と変換が離れるほど壊れやすくなります。`as?` + compactMap のほうが安全です。", "配列全体を `as? [Int]` でキャストしようとする間違いです。1つでも型が違えば全体が nil になります。"], "takeaway": "特定の型だけ集めるなら compactMap + as?。filter は型を変えない。", "example": {"code": "let values: [Any] = [1, \"two\", 3]\nprint(values.compactMap { $0 as? Int })\nprint(values.compactMap { $0 as? String })", "output": "[1, 3]\n[\"two\"]", "explanation": "同じ配列から、キャスト先の型を変えるだけで別の要素群を取り出せます。"}}}, {"id": "practice-swift-081", "track": "swift", "lessonId": "swift-access-control", "type": "shortCode", "difficulty": 4, "title": "外から読めて書けないプロパティを宣言する", "prompt": "Token の value を「外からは読めるが、書き換えは型の内部だけ」にしたいです。宣言の1行を書いてください。型は String、初期値は空文字です。", "skills": ["architecture", "types"], "content": {"context": "struct Token {\n    // ここに1行書く（外からは読み取り専用にする）\n    mutating func set(_ v: String) { value = v }\n}", "contextRun": "struct Token {\n{{answer}}\n    mutating func set(_ v: String) { value = v }\n}\nvar t = Token()\nt.set(\"abc\")\nprint(t.value)", "placeholder": "例: 修飾子 var 名前 = 初期値"}, "solution": {"accepted": ["private(set) var value = \"\"", "private(set) var value: String = \"\""]}, "hints": ["読み取りと書き込みで別々のアクセスレベルを指定できる書き方があります。", "書き込み側だけを制限するので、修飾子のあとにかっこで対象を指定します。", "内部限定を表すキーワードのあとに (set) を続け、通常どおり var の宣言を書きます。"], "explanation": "`private(set) var value = \"\"` と書きます。`private(set)` は「取得は既定のアクセスレベル、設定は private」という指定で、外部からは読めても代入できません。型の内部にある set(_:) からは書き換えられるため、値の変更経路をメソッドに限定できます。`private var value` にすると外部から読むこともできなくなり、要件を満たしません。型注釈を明示した `private(set) var value: String = \"\"` も同じ意味で、こちらも正解として受け付けます。", "detail": {"concept": "アクセス制御は「どこから触れるか」を型の設計として宣言する仕組みです。読み取りと書き込みを別々に制御できるため、外部に見せつつ不変条件を守れます。", "steps": ["`private(set)` の (set) は、設定側だけにアクセスレベルを適用する指定。", "取得側は宣言の既定（この場合 internal）のままなので、外部から読める。", "設定側は private なので、同じファイル内の型の実装からしか書けない。", "`t.value = \"x\"` は 'Cannot assign to property: value setter is inaccessible' になる。"], "whyCorrect": "要件が「読める・書けない・内部からは書ける」の3点であり、private(set) はまさにその組み合わせを1つの修飾子で表現します。", "commonMistakes": ["`let` にすると内部からも書き換えられなくなり、set(_:) が成立しません。", "`private var` にすると外部から読めなくなるため、別途 getter を書く羽目になります。private(set) ならその手間が不要です。"], "takeaway": "読めるが書けない、は private(set)。値の変更経路をメソッドに絞れる。", "example": {"code": "struct Token {\n    private(set) var value = \"\"\n    mutating func set(_ v: String) { value = v }\n}\nvar t = Token()\nt.set(\"abc\")\nprint(t.value)", "output": "abc", "explanation": "外部からは読み取りだけができ、変更は set(_:) を通してのみ行えます。"}}}, {"id": "practice-swift-082", "track": "swift", "lessonId": "swift-keypath-wrappers-builders", "type": "reorder", "difficulty": 4, "title": "キーパスで取り出す手順を並べる", "prompt": "Person の配列から名前の配列と年齢の配列を作って表示します。ブロックを正しい順に並べ替えてください。", "skills": ["collections", "types"], "content": {"blocks": [{"id": "b1", "code": "let names = people.map(\\.name)"}, {"id": "b2", "code": "struct Person { let name: String; let age: Int }"}, {"id": "b3", "code": "let people = [Person(name: \"Yuki\", age: 24), Person(name: \"Ken\", age: 15)]"}, {"id": "b4", "code": "let ages = people.map(\\.age)"}, {"id": "b5", "code": "print(names, ages)"}]}, "solution": {"order": ["b2", "b3", "b1", "b4", "b5"]}, "hints": ["型の定義がなければインスタンスは作れません。", "配列がなければ map は書けません。", "型 → 配列 → names → ages → 表示、の順です。"], "explanation": "`\\.name` はキーパス式で、`{ $0.name }` と同じ意味を短く書けます。map がキーパスを直接受け取れるため、単純なプロパティの取り出しではクロージャを書かずに済みます。実行順としては型の定義、配列の生成、2つの map、表示の順になります。出力は [\"Yuki\", \"Ken\"] と [24, 15] です。", "detail": {"concept": "キーパスは「どのプロパティを指すか」を値として表したものです。実行時に取り出す処理を渡せるため、map やソートの条件指定を簡潔に書けます。", "steps": ["`struct Person` … name と age を持つ型を定義する。", "`let people = [...]` … インスタンスの配列を作る。", "`people.map(\\.name)` … 各要素の name を取り出して [String] を作る。", "`people.map(\\.age)` … 同様に [Int] を作る。", "print で両方を表示する。"], "whyCorrect": "各行が必要とする定義がその前に存在するためです。キーパスは Person 型に対して解決されるので、型の定義が先にある必要があります。", "commonMistakes": ["`\\.name` の先頭のバックスラッシュを忘れると、単なるメンバーアクセスと解釈されてコンパイルエラーになります。", "キーパスは単純なプロパティ取得にだけ使えます。`\\.name.count` のような連結は書けますが、計算や条件分岐を含む処理はクロージャが必要です。"], "takeaway": "プロパティを取り出すだけの map はキーパスで書ける。", "example": {"code": "struct Person { let name: String; let age: Int }\nlet people = [Person(name: \"Yuki\", age: 24), Person(name: \"Ken\", age: 15)]\nprint(people.map(\\.name))\nprint(people.sorted { $0.age < $1.age }.map(\\.age))", "output": "[\"Yuki\", \"Ken\"]\n[15, 24]", "explanation": "取り出しはキーパス、比較を伴う並べ替えはクロージャ、という使い分けが確認できます。"}}}, {"id": "practice-swift-083", "track": "swift", "lessonId": "swift-advanced-operators", "type": "testReasoning", "difficulty": 4, "title": "境界値のテストが落ちた原因を読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "debugging", "controlFlow"], "content": {"requirement": "applyDiscount(price:percent:) は percent が 0〜100 のとき割引後の価格を返し、範囲外のときは元の価格をそのまま返す。percent が 100 のときは 0 円になる。", "code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    guard percent >= 0, percent < 100 else { return price }\n    return price - price * percent / 100\n}", "tests": [{"name": "通常の割引", "input": "price: 1000, percent: 20", "expected": "800", "result": "成功"}, {"name": "上限の境界", "input": "price: 1000, percent: 100", "expected": "0", "result": "失敗（1000が返った）"}, {"name": "範囲外の負値", "input": "price: 1000, percent: -10", "expected": "1000", "result": "成功"}], "options": [{"id": "o1", "label": "上限の判定に < を使っているため、percent が 100 のときだけ範囲外と見なされて割引が適用されない"}, {"id": "o2", "label": "整数除算によって端数が切り捨てられ、割引額が1円ずれている"}, {"id": "o3", "label": "負の割引率を弾いていないため、価格が増えてしまっている"}, {"id": "o4", "label": "price が 0 のときに 0 除算が発生する"}]}, "solution": {"optionId": "o1"}, "hints": ["成功したテストと失敗したテストの入力の違いを見てください。違いは percent の値だけです。", "要件は「100 のとき 0 円」なので、100 は有効な範囲に含まれます。実装の条件はどうなっているでしょうか。", "guard の2つめの条件が percent < 100 なので、percent = 100 は else に落ちて元の価格がそのまま返ります。"], "explanation": "失敗したテストが表しているのは「percent が上限の 100 のとき、割引後の価格は 0 円になる」という要件です。入力は境界値そのもの（percent = 100）で、境界を含むかどうかだけを検証しています。実装の guard は `percent < 100` と上限を含めていないため、percent = 100 は条件を満たさず else 側の `return price` が実行され、1000 が返ります。これが期待値 0 と食い違うため失敗します。通常の割引（20%）と負値（-10）は条件の内側・外側として正しく扱われるので成功しており、失敗が上限の境界に限定されていること自体が原因の位置を示しています。修正は `percent <= 100` とすることです。", "detail": {"concept": "境界値テストは「仕様の端」を狙って書きます。1つの比較演算子の違いはコード上ほとんど見えませんが、境界の入力だけが落ちるという形で明確に現れます。", "steps": ["要件は 0〜100 を有効とし、100 のときは 0 円。つまり上限は範囲に含まれる。", "実装は `percent >= 0, percent < 100` なので、有効範囲は 0〜99。", "percent = 100 は guard を満たさず、else の return price が実行される。", "期待値 0 に対して 1000 が返るため、このテストだけが失敗する。"], "whyCorrect": "失敗しているのは上限の境界だけであり、他の入力はすべて期待どおりです。範囲の下限や除算の丸めが原因なら、20% や負値のテストにも影響が出るはずですが、そうなっていません。", "commonMistakes": ["整数除算の丸めを疑う間違いです。1000 * 20 / 100 は 200 で割り切れており、20% のテストが成功していることからも丸めは無関係と分かります。", "「1件だけ失敗しているのだから軽微」と判断して境界を直さないまま進める間違いです。境界の誤りは仕様の誤りそのものです。", "テストの期待値のほうを 1000 に書き換えて通す対応です。仕様に反する実装を固定してしまいます。"], "takeaway": "境界だけが落ちるなら、疑うのは比較演算子の等号の有無。", "example": {"code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    guard percent >= 0, percent <= 100 else { return price }\n    return price - price * percent / 100\n}\nprint(applyDiscount(price: 1000, percent: 20))\nprint(applyDiscount(price: 1000, percent: 100))\nprint(applyDiscount(price: 1000, percent: -10))", "output": "800\n0\n1000", "explanation": "上限を含めるように直すと、3つのケースすべてが要件どおりになります。"}}, "seriesId": "swift-test-reading", "seriesStep": 1}, {"id": "practice-swift-084", "track": "swift", "lessonId": "swift-memory-safety", "type": "testReasoning", "difficulty": 4, "title": "非破壊であるべき関数のテストを読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "memory", "debugging"], "content": {"requirement": "doubled(_:) は各要素を2倍にした新しい配列を返す。呼び出し元が渡した配列そのものは変更しない（非破壊）。", "code": "func doubled(_ items: inout [Int]) -> [Int] {\n    for i in items.indices { items[i] *= 2 }\n    return items\n}", "tests": [{"name": "戻り値が2倍になっている", "input": "[1, 2]", "expected": "[2, 4]", "result": "成功"}, {"name": "呼び出し元の配列が変わらない", "input": "[1, 2] を渡したあとの元の配列", "expected": "[1, 2]", "result": "失敗（[2, 4] になった）"}], "options": [{"id": "o1", "label": "inout で受け取り元の配列を直接書き換えているため、非破壊という要件に反している"}, {"id": "o2", "label": "indices が空配列で範囲外アクセスになり、配列が壊れている"}, {"id": "o3", "label": "戻り値の型が [Int] ではなく Void になっている"}, {"id": "o4", "label": "*= 演算子が Int の配列要素には使えないため、値が更新されていない"}]}, "solution": {"optionId": "o1"}, "hints": ["2つのテストは別々の性質を見ています。片方は戻り値、もう片方は呼び出し元の状態です。", "引数の宣言に付いている修飾子が、呼び出し元にどう影響するかを考えてください。", "inout は関数内での変更を呼び出し元へ書き戻します。元の配列を保つという要件と両立しません。"], "explanation": "失敗したテストが表しているのは「この関数は非破壊である」という要件です。検証している入力は普通の2要素配列で、特別な境界ではなく、関数呼び出しの前後で元の配列が同一かどうかだけを見ています。実装は引数を `inout [Int]` で受け取り、`items[i] *= 2` で直接書き換えているため、その変更が呼び出し元の変数へ書き戻され、元の配列も [2, 4] になります。戻り値のテストが成功しているのは、書き換えた配列をそのまま返しているためで、戻り値だけを見ていると問題に気づけません。修正は inout をやめて `func doubled(_ items: [Int]) -> [Int] { items.map { $0 * 2 } }` のように新しい配列を作って返すことです。", "detail": {"concept": "「値を返すこと」と「元を変えないこと」は別の性質です。関数のシグネチャに inout があるかどうかは、この性質を型として表明しています。", "steps": ["要件は2つ: 戻り値が2倍であること、元の配列が変わらないこと。", "`inout [Int]` は呼び出し元の変数と結び付き、変更が書き戻される。", "`items[i] *= 2` は呼び出し元の配列そのものを更新する。", "結果として戻り値のテストは通り、非破壊のテストだけが失敗する。"], "whyCorrect": "失敗しているのは呼び出し元の状態を見るテストだけで、戻り値は正しい値です。範囲外や型の誤りが原因なら、1つめのテストも失敗するか、そもそもコンパイルできません。", "commonMistakes": ["戻り値が正しいことをもって「実装は正しい」と判断する間違いです。副作用は戻り値のテストでは検出できません。", "inout を「引数を効率よく渡す方法」と考える間違いです。inout は意味論の宣言であり、性能のための指定ではありません。", "テスト側で毎回配列をコピーして渡すようにして通す対応です。呼び出し側全員に注意を要求する設計になり、事故が再発します。"], "takeaway": "非破壊を要件にするなら inout を使わない。副作用は戻り値のテストでは見えない。", "example": {"code": "func doubled(_ items: [Int]) -> [Int] { items.map { $0 * 2 } }\nlet original = [1, 2]\nlet result = doubled(original)\nprint(result, original)", "output": "[2, 4] [1, 2]", "explanation": "新しい配列を作って返す実装では、呼び出し元の配列がそのまま保たれます。"}}, "seriesId": "swift-test-reading", "seriesStep": 2}, {"id": "practice-foundation-001", "track": "foundation", "lessonId": "foundation-standard-protocols", "type": "matching", "difficulty": 1, "title": "標準プロトコルの役割を対応づける", "prompt": "よく使う標準プロトコルと、それに準拠すると何ができるようになるかを対応させてください。", "skills": ["protocols", "foundation"], "content": {"left": [{"id": "l1", "label": "Equatable"}, {"id": "l2", "label": "Hashable"}, {"id": "l3", "label": "Comparable"}, {"id": "l4", "label": "CustomStringConvertible"}], "right": [{"id": "r1", "label": "== で等しいかどうかを比較できるようになる"}, {"id": "r2", "label": "Set の要素や Dictionary のキーとして使えるようになる"}, {"id": "r3", "label": "< による大小比較ができ、sorted() が引数なしで使えるようになる"}, {"id": "r4", "label": "print したときの表示内容を自分で決められるようになる"}, {"id": "r5", "label": "JSON との相互変換ができるようになる"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["等しさを比べるものと、大小を比べるものは別のプロトコルです。", "ハッシュ値を持つと、集合や辞書のキーとして高速に扱えるようになります。", "r5 は Codable の説明なので、この4つとは対応しません。"], "explanation": "Equatable は == による等値比較、Comparable はさらに < による順序比較を提供します（Comparable は Equatable を継承しています）。Hashable はハッシュ値を持つことで Set の要素や Dictionary のキーになれます。CustomStringConvertible は description を実装することで print の表示を制御します。r5 は Codable の説明であり、この中には対応するものがありません。", "detail": {"concept": "標準プロトコルは「その型に何ができるか」を宣言する共通の語彙です。準拠するだけで標準ライブラリの膨大な機能（sorted、Set、辞書のキーなど）が使えるようになります。", "steps": ["Equatable … == を提供する。struct なら多くの場合コンパイラが自動生成する。", "Hashable … Equatable を含み、さらにハッシュ値を持つ。Set や辞書のキーに必要。", "Comparable … Equatable を含み、< を提供する。sorted() や min()/max() が使える。", "CustomStringConvertible … description プロパティで表示を定義する。"], "whyCorrect": "4つのプロトコルはそれぞれ等値・ハッシュ・順序・表示という別の能力を与えます。能力と説明文が1対1で対応するため、迷う余地がありません。", "commonMistakes": ["Comparable に準拠すれば Equatable は不要だと考える間違いです。Comparable は Equatable を継承しているので、== の実装（または自動生成）も必要です。", "print の表示を変えたいときに description ではなく別のメソッドを定義する間違いです。CustomStringConvertible が要求するのは description という名前のプロパティです。"], "takeaway": "準拠は「できること」の宣言。必要な能力から逆算してプロトコルを選ぶ。", "example": {"code": "struct Tag: Hashable, CustomStringConvertible {\n    let name: String\n    var description: String { \"#\\(name)\" }\n}\nlet tags: Set<Tag> = [Tag(name: \"swift\"), Tag(name: \"swift\")]\nprint(tags.count, tags.first!)", "output": "1 #swift", "explanation": "Hashable のおかげで Set の重複が排除され、description のおかげで表示が #swift になっています。"}}, "seriesId": "foundation-protocol-basics", "seriesStep": 1}, {"id": "practice-foundation-002", "track": "foundation", "lessonId": "foundation-standard-protocols", "type": "fillBlank", "difficulty": 2, "title": "Setの要素にできる型を作る", "prompt": "Point を Set の要素として使えるようにします。空欄を埋めてください。", "skills": ["protocols", "collections"], "content": {"template": "struct Point: {{1}} {\n    let x: Int\n    let y: Int\n}\nlet set: Set<Point> = [Point(x: 1, y: 2), Point(x: 1, y: 2)]\nprint(set.{{2}})", "blanks": [{"id": "1", "options": ["Hashable", "Equatable", "Comparable", "Codable"]}, {"id": "2", "options": ["count", "size", "length", "total"]}]}, "solution": {"answers": {"1": "Hashable", "2": "count"}}, "hints": ["Set は要素をハッシュ値で管理するため、要素の型にはハッシュ値が必要です。", "等値比較だけでは足りません。Set に入れるにはもう一段の能力が要ります。", "要素数を返すのはメソッドではなくプロパティで、コレクション共通の名前です。"], "explanation": "Set は要素をハッシュ値で分類して高速に検索するため、要素の型は Hashable でなければなりません。すべての格納プロパティが Hashable なら、`: Hashable` と書くだけでコンパイラが実装を自動生成します。Equatable だけでは 'Type Point does not conform to protocol Hashable' になります。要素数は count プロパティで、同じ値の Point は1つにまとめられるため出力は1です。", "detail": {"concept": "Hashable は「同じ値なら同じハッシュ値になる」ことを保証します。この保証があるからこそ、Set や Dictionary は要素数に関わらず高速に検索できます。", "steps": ["`struct Point: Hashable` と書くと、x と y から == と hash(into:) が自動生成される。", "Set のリテラルに同じ値の Point を2つ入れる。", "ハッシュ値が同じで == も真なので、2つは同一の要素とみなされる。", "結果として set.count は 1 になる。"], "whyCorrect": "Hashable の自動生成は、全プロパティが Hashable のときに使えます。Int は Hashable なので Point も条件を満たし、宣言だけで実装が得られます。", "commonMistakes": ["Equatable を書けば Set に入れられると考える間違いです。Set はハッシュ値を必要とするため Hashable が要ります。", "== と hash(into:) の実装が食い違うと、等しい値が Set の中で重複します。自動生成に任せられる場合は任せるのが安全です。"], "takeaway": "Set や辞書のキーにするなら Hashable。全プロパティが Hashable なら宣言だけでよい。", "example": {"code": "struct Point: Hashable { let x: Int; let y: Int }\nvar set: Set<Point> = []\nprint(set.insert(Point(x: 1, y: 2)).inserted)\nprint(set.insert(Point(x: 1, y: 2)).inserted)\nprint(set.count)", "output": "true\nfalse\n1", "explanation": "同じ値の Point は2回目の挿入で拒否され、要素数は1のままです。"}}, "seriesId": "foundation-protocol-basics", "seriesStep": 2}, {"id": "practice-foundation-003", "track": "foundation", "lessonId": "foundation-standard-protocols", "type": "bugHunt", "difficulty": 3, "title": "準拠を宣言しただけの型を見つける", "prompt": "このコードはビルドできません。原因になっている行を選んでください。", "skills": ["protocols", "debugging"], "content": {"lines": [{"id": "l1", "code": "struct Version: Comparable {"}, {"id": "l2", "code": "    let major: Int"}, {"id": "l3", "code": "}"}, {"id": "l4", "code": "print([Version(major: 2), Version(major: 1)].sorted().first!)"}]}, "solution": {"optionId": "l1", "fixedCode": "struct Version: Comparable {\n    let major: Int\n    static func < (a: Version, b: Version) -> Bool { a.major < b.major }\n}\nprint([Version(major: 2), Version(major: 1)].sorted().first!)"}, "hints": ["準拠を宣言すると、そのプロトコルが要求するものをすべて実装する義務が生じます。", "Equatable と違い、Comparable の要求は自動生成されません。", "Comparable が要求しているのは `<` の実装です。型の宣言だけがあって実装がありません。"], "explanation": "バグは1行目の準拠宣言です。Comparable は `static func <` の実装を要求しますが、この型はそれを持たないため 'Type Version does not conform to protocol Comparable' というコンパイルエラーになります。Equatable や Hashable は条件を満たせばコンパイラが自動生成しますが、Comparable の `<` は「何を基準に大小を決めるか」を型が決められないため自動生成されません。ビルドが止まるだけで実行時の問題ではありません。修正は `static func < (a: Version, b: Version) -> Bool { a.major < b.major }` を追加することです。追加すれば sorted() が使えるようになり、最小の Version が表示されます。", "detail": {"concept": "準拠の宣言は約束であり、実装はその履行です。自動生成が効くプロトコルと効かないプロトコルの違いを知っておくと、エラーの意味が読み取れます。", "steps": ["`: Comparable` により、この型は < を提供すると約束する。", "型の本体に < の実装がないため、約束が果たされていない。", "コンパイラは準拠エラーとして宣言行を指摘する。", "< を実装すると、== は Equatable の自動生成で補われ、sorted() も使えるようになる。"], "whyCorrect": "エラーの原因は「実装がないのに準拠を宣言した」ことなので、責任の所在は宣言行にあります。4行目の sorted() 呼び出しは、準拠さえ成立していれば正しいコードです。", "commonMistakes": ["sorted() の呼び出し方が悪いと考えて呼び出し側を書き換える間違いです。原因は型側の実装不足です。", "< だけでなく <= や > も実装しなければならないと考える間違いです。Comparable は < さえあれば、残りを既定実装で導出します。"], "takeaway": "Comparable の < は自動生成されない。準拠宣言と実装はセット。", "example": {"code": "struct Version: Comparable {\n    let major: Int\n    static func < (a: Version, b: Version) -> Bool { a.major < b.major }\n}\nlet vs = [Version(major: 2), Version(major: 1)]\nprint(vs.sorted().map(\\.major), vs.max()!.major)", "output": "[1, 2] 2", "explanation": "< を1つ実装するだけで、sorted も max も使えるようになります。"}}, "seriesId": "foundation-protocol-basics", "seriesStep": 3}, {"id": "practice-foundation-004", "track": "foundation", "lessonId": "foundation-standard-protocols", "type": "buildFunction", "difficulty": 3, "title": "比較と表示を自前で持つ型を組み立てる", "prompt": "major で大小を比較でき、print すると v1 のように表示される型を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["protocols", "types"], "content": {"blocks": [{"id": "b1", "code": "struct Version: Comparable, CustomStringConvertible {"}, {"id": "b2", "code": "    let major: Int"}, {"id": "b3", "code": "    var description: String { \"v\\(major)\" }"}, {"id": "b4", "code": "    static func < (a: Version, b: Version) -> Bool { a.major < b.major }"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "    func description() -> String { \"v\\(major)\" }"}, {"id": "b7", "code": "    static func compare(a: Version, b: Version) -> Bool { a.major < b.major }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["CustomStringConvertible が要求するのはメソッドではなくプロパティです。名前も決まっています。", "Comparable が要求するのも名前が決まった演算子の実装です。自分で名前を決めたメソッドでは準拠できません。", "型の宣言 → プロパティ → description → < の実装 → 型を閉じる、の5行です。"], "explanation": "CustomStringConvertible の要求は `var description: String { get }` というプロパティなので、`func description() -> String` というメソッドでは準拠できません。Comparable の要求も `static func <` という決まった名前と形なので、`compare(a:b:)` のような独自名では満たせません。プロトコル準拠は「名前と型が一致すること」で判定されるため、意味が同じでも形が違えばエラーになります。この5行で、sorted() も print も期待どおりに動きます。", "detail": {"concept": "プロトコル準拠はダックタイピングではなく、宣言された名前・型・種別（プロパティかメソッドか）の厳密な一致で判定されます。だからこそコンパイル時に検証できます。", "steps": ["`: Comparable, CustomStringConvertible` で2つの約束をする。", "`var description: String { ... }` … 計算プロパティとして実装する。", "`static func < (a:b:) -> Bool` … 型メソッドとして演算子を実装する。", "この2つで両方の要求が満たされ、準拠が成立する。"], "whyCorrect": "要求されている形（プロパティか、静的な演算子か）と実装の形が一致しているためです。名前が1文字違うだけでも準拠は成立しません。", "commonMistakes": ["description をメソッドとして実装し、'does not conform' の理由が分からず悩む間違いです。エラーメッセージの「Candidate has non-matching type」に注目します。", "print の表示を変えるために toString() のような独自メソッドを作る間違いです。標準の print に反映させるには description が必要です。"], "takeaway": "準拠は名前と形の完全一致。要求の定義（プロパティかメソッドか）を確認する。", "example": {"code": "struct Version: Comparable, CustomStringConvertible {\n    let major: Int\n    var description: String { \"v\\(major)\" }\n    static func < (a: Version, b: Version) -> Bool { a.major < b.major }\n}\nprint([Version(major: 2), Version(major: 1)].sorted())", "output": "[v1, v2]", "explanation": "sorted() で並び替えられ、配列の表示にも description が使われていることが分かります。"}}, "seriesId": "foundation-protocol-basics", "seriesStep": 4}, {"id": "practice-foundation-005", "track": "foundation", "lessonId": "foundation-codable", "type": "fillBlank", "difficulty": 2, "title": "JSONから型へデコードする", "prompt": "JSON文字列を User にデコードして名前を表示します。空欄を埋めてください。", "skills": ["foundation", "types"], "content": {"template": "import Foundation\nstruct User: {{1}} {\n    let id: Int\n    let name: String\n}\nlet json = #\"{\"id\": 1, \"name\": \"Yuki\"}\"#\ndo {\n    let user = try JSONDecoder().{{2}}(User.self, from: Data(json.utf8))\n    print(user.name)\n} catch {\n    print(\"失敗\")\n}", "blanks": [{"id": "1", "options": ["Codable", "Equatable", "Hashable", "Identifiable"]}, {"id": "2", "options": ["decode", "encode", "parse", "convert"]}]}, "solution": {"answers": {"1": "Codable", "2": "decode"}}, "hints": ["JSONとの相互変換を可能にするプロトコルがあります。エンコードとデコードの両方をまとめた別名です。", "JSONDecoder が行うのは、データから型への変換です。", "1つめは Encodable と Decodable をまとめた別名、2つめは「型情報とデータを渡して値を得る」メソッドです。"], "explanation": "`Codable` は Encodable と Decodable をまとめた typealias で、準拠するとコンパイラが変換処理を自動生成します。`JSONDecoder().decode(_:from:)` は「復元したい型」と「Data」を渡して値を得るメソッドです。プロパティ名と JSON のキーが一致しているため追加の設定は不要で、\"Yuki\" が表示されます。decode は失敗しうるので throws であり、do-catch か try? で扱う必要があります。", "detail": {"concept": "Codable は「型の構造から変換コードを自動生成する」仕組みです。手書きのパース処理を書かずに済むぶん、キー名の不一致や型の食い違いはデコード時の実行時エラーとして現れます。", "steps": ["`struct User: Codable` により、id と name の変換コードが自動生成される。", "`Data(json.utf8)` で String を Data に変換する。", "`decode(User.self, from:)` で Data から User を復元する。", "失敗すると throws するため、do-catch で受け止めている。"], "whyCorrect": "Codable 準拠によって decode の要求（Decodable）が満たされ、キー名がプロパティ名と一致しているため既定の設定のまま変換できます。", "commonMistakes": ["`decode(User.self, from:)` の第1引数に `User()` のようなインスタンスを渡す間違いです。渡すのは型そのもの（メタタイプ）です。", "デコードの失敗を try? で握りつぶすと、キー名の誤りなのか型の誤りなのか分からなくなります。開発中は do-catch で error を出力するほうが早く直せます。"], "takeaway": "Codable 準拠 + decode(型.self, from: Data) が基本形。失敗は必ず扱う。", "example": {"code": "import Foundation\nstruct User: Codable { let id: Int; let name: String }\nlet json = #\"{\"id\": 1, \"name\": \"Yuki\"}\"#\nlet user = try? JSONDecoder().decode(User.self, from: Data(json.utf8))\nprint(user?.name ?? \"失敗\")", "output": "Yuki", "explanation": "try? を使うと失敗が nil になります。手軽ですが、失敗の理由は失われます。"}}, "seriesId": "foundation-codable-flow", "seriesStep": 1}, {"id": "practice-foundation-006", "track": "foundation", "lessonId": "foundation-codable", "type": "reorder", "difficulty": 2, "title": "エンコードの手順を並べ替える", "prompt": "User を JSON 文字列に変換する関数を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["foundation", "functions"], "content": {"blocks": [{"id": "b1", "code": "func makeJSON(_ user: User) throws -> String {"}, {"id": "b2", "code": "import Foundation"}, {"id": "b3", "code": "    let data = try encoder.encode(user)"}, {"id": "b4", "code": "struct User: Codable { let id: Int; let name: String }"}, {"id": "b5", "code": "    let encoder = JSONEncoder()"}, {"id": "b6", "code": "    return String(decoding: data, as: UTF8.self)"}, {"id": "b7", "code": "    encoder.outputFormatting = .sortedKeys"}, {"id": "b8", "code": "}"}]}, "solution": {"order": ["b2", "b4", "b1", "b5", "b7", "b3", "b6", "b8"]}, "hints": ["import は最初、型の定義は関数より前に必要です。", "エンコーダの設定は、encode を呼ぶ前に済ませなければ反映されません。", "import → 型 → 関数の宣言 → エンコーダ生成 → 設定 → encode → String へ変換 → 関数を閉じる、の順です。"], "explanation": "JSONEncoder は生成してから設定し、その後 encode を呼びます。設定を encode のあとに書いても、すでに変換は終わっているため反映されません。`outputFormatting = .sortedKeys` はキーを名前順に並べる設定で、出力が実行のたびに変わらなくなるためテストとの比較に役立ちます。`String(decoding:as:)` は Data を UTF-8 として文字列に変換する、失敗しない初期化子です。", "detail": {"concept": "エンコーダやデコーダは設定を持つオブジェクトです。「生成 → 設定 → 実行」という順序は、日付形式やキー変換など他の設定でも共通します。", "steps": ["`import Foundation` … JSONEncoder は Foundation にある。", "`struct User: Codable` … 変換対象の型を先に定義する。", "`let encoder = JSONEncoder()` のあとに `outputFormatting` を設定する。", "`try encoder.encode(user)` が Data を返す。", "`String(decoding: data, as: UTF8.self)` で JSON 文字列にする。"], "whyCorrect": "設定が encode より前にあるため、出力形式が確実に適用されます。また import と型定義が関数より前にあるので、名前解決も成立します。", "commonMistakes": ["sortedKeys を指定しないと、辞書のキー順序が保証されず、出力文字列がテストと一致しないことがあります。", "`String(data: data, encoding: .utf8)!` を使うと Optional の強制アンラップになります。`String(decoding:as:)` なら失敗しません。"], "takeaway": "エンコーダは「生成 → 設定 → 実行」。設定を後に書いても効かない。", "example": {"code": "import Foundation\nstruct User: Codable { let id: Int; let name: String }\nlet encoder = JSONEncoder()\nencoder.outputFormatting = .sortedKeys\nlet data = try! encoder.encode(User(id: 1, name: \"Yuki\"))\nprint(String(decoding: data, as: UTF8.self))", "output": "{\"id\":1,\"name\":\"Yuki\"}", "explanation": "sortedKeys によってキーが名前順に並び、出力が毎回同じになります。"}}, "seriesId": "foundation-codable-flow", "seriesStep": 2}, {"id": "practice-foundation-007", "track": "foundation", "lessonId": "foundation-codable", "type": "bugHunt", "difficulty": 3, "title": "キー名が合わずデコードできない原因を見つける", "prompt": "「デコード失敗」と表示されます。原因になっている行を選んでください。", "skills": ["foundation", "debugging"], "content": {"lines": [{"id": "l1", "code": "struct User: Codable {"}, {"id": "l2", "code": "    let userName: String"}, {"id": "l3", "code": "}"}, {"id": "l4", "code": "let json = #\"{\"user_name\": \"Yuki\"}\"#"}, {"id": "l5", "code": "let user = try? JSONDecoder().decode(User.self, from: Data(json.utf8))"}, {"id": "l6", "code": "print(user?.userName ?? \"デコード失敗\")"}]}, "solution": {"optionId": "l2", "fixedCode": "import Foundation\nstruct User: Codable {\n    let userName: String\n}\nlet json = #\"{\"user_name\": \"Yuki\"}\"#\nlet decoder = JSONDecoder()\ndecoder.keyDecodingStrategy = .convertFromSnakeCase\nlet user = try? decoder.decode(User.self, from: Data(json.utf8))\nprint(user?.userName ?? \"デコード失敗\")"}, "hints": ["JSON のキーと、構造体のプロパティ名を見比べてください。", "Codable は既定でプロパティ名とキー名が同じであることを前提にします。", "JSON 側は user_name、プロパティ側は userName です。この不一致でキーが見つからず失敗しています。"], "explanation": "バグの位置はプロパティ名（2行目）と JSON のキー名の対応です。Codable の自動生成は「プロパティ名 = JSONのキー名」を前提とするため、JSON の user_name に対して userName というプロパティは見つからず、keyNotFound エラーで decode が throws します。try? がそれを nil に変えるため、画面には「デコード失敗」とだけ出て理由が見えません。修正方法は2つあり、デコーダに `keyDecodingStrategy = .convertFromSnakeCase` を設定してスネークケースを自動変換するか、CodingKeys を定義して明示的に対応付けます。サーバ側の命名規則が全体で統一されているなら、前者のほうが変更が1か所で済みます。", "detail": {"concept": "Codable の自動生成は「名前が一致している」ことに強く依存します。外部APIの命名規則が Swift の慣習と違う場合、その差を埋める設定が必要になります。", "steps": ["JSON のキーは user_name（スネークケース）。", "プロパティ名は userName（キャメルケース）。", "既定の対応付けでは user_name というキーを探しに行かないため keyNotFound になる。", "convertFromSnakeCase を設定すると、user_name が userName に変換されてから照合される。"], "whyCorrect": "失敗の原因は decode の呼び出し方ではなく、型のプロパティ名と外部データのキー名の対応です。5行目・6行目のコードは、対応さえ取れていれば正しく動きます。", "commonMistakes": ["try? のまま原因を探そうとして時間を使う間違いです。まず do-catch にして error を出力すると keyNotFound と鍵名がすぐ分かります。", "プロパティ名を user_name に変えて解決する対応です。Swift 側の命名規則が崩れ、以降のコードすべてが読みにくくなります。"], "takeaway": "デコード失敗はまずキー名の対応を疑う。原因表示は do-catch で得る。", "example": {"code": "import Foundation\nstruct User: Codable { let userName: String }\nlet json = #\"{\"user_name\": \"Yuki\"}\"#\nlet decoder = JSONDecoder()\ndecoder.keyDecodingStrategy = .convertFromSnakeCase\nprint((try? decoder.decode(User.self, from: Data(json.utf8)))?.userName ?? \"デコード失敗\")", "output": "Yuki", "explanation": "キー変換の設定を1行足すだけで、プロパティ名を変えずにデコードできます。"}}, "seriesId": "foundation-codable-flow", "seriesStep": 3}, {"id": "practice-foundation-008", "track": "foundation", "lessonId": "foundation-codable", "type": "repair", "difficulty": 3, "title": "失敗の理由が分かるデコードに直す", "prompt": "デコードに失敗していますが、理由が分かりません。4〜5行目を書き換えて、失敗の内容が確認できるようにします。適切なものを選んでください。", "skills": ["foundation", "errors", "debugging"], "content": {"code": "import Foundation\nstruct User: Codable { let id: Int }\nlet json = #\"{\"id\": \"one\"}\"#\nlet user = try? JSONDecoder().decode(User.self, from: Data(json.utf8))\nprint(user?.id ?? -1)", "options": [{"id": "o1", "code": "do {\n    let user = try JSONDecoder().decode(User.self, from: Data(json.utf8))\n    print(user.id)\n} catch {\n    print(\"デコード失敗: \\(error)\")\n}"}, {"id": "o2", "code": "let user = try! JSONDecoder().decode(User.self, from: Data(json.utf8))\nprint(user.id)"}, {"id": "o3", "code": "let user = try? JSONDecoder().decode(User.self, from: Data(json.utf8))\nprint(user as Any)"}, {"id": "o4", "code": "let user = (try? JSONDecoder().decode(User.self, from: Data(json.utf8))) ?? User(id: -1)\nprint(user.id)"}]}, "solution": {"optionId": "o1", "fixedCode": "import Foundation\nstruct User: Codable { let id: Int }\nlet json = #\"{\"id\": \"one\"}\"#\ndo {\n    let user = try JSONDecoder().decode(User.self, from: Data(json.utf8))\n    print(user.id)\n} catch {\n    print(\"デコード失敗: \\(error)\")\n}"}, "hints": ["try? は失敗の情報を nil に潰してしまいます。理由を残す書き方が必要です。", "エラーの値を受け取れるのは、例外を捕まえる構文だけです。", "強制アンラップやクラッシュではなく、失敗しても実行を続けたうえで理由を表示する形にします。"], "explanation": "問題は4行目の try? で、デコードが投げたエラーを nil に潰しているため「なぜ失敗したか」が失われます。この JSON は id が文字列 \"one\" なので、実際には typeMismatch エラーが起きています。do-catch に書き換えると catch 節で error を受け取れ、期待した型と実際の型、どのキーで起きたかまで出力されます。try! はビルドは通りますが失敗した瞬間にクラッシュし、原因調査どころか実行が止まります。`print(user as Any)` は nil と表示されるだけで理由は分からず、既定値で埋める選択肢は失敗を隠したまま処理を続けてしまいます。", "detail": {"concept": "エラーハンドリングの選択は「失敗したときに何を知りたいか」で決まります。開発中は理由が必要、本番では回復手段が必要、という違いを意識します。", "steps": ["`{\"id\": \"one\"}` の id は文字列だが、User.id は Int。", "デコード時に typeMismatch エラーが投げられる。", "try? はそれを nil に変換するため、エラーの中身が失われる。", "do-catch なら error をそのまま出力でき、原因のキーと型が分かる。"], "whyCorrect": "catch 節はエラー値そのものを受け取れる唯一の構文です。DecodingError は原因のキーや期待した型を含むため、そのまま出力するだけで調査に十分な情報が得られます。", "commonMistakes": ["try? を既定の書き方として使い続ける間違いです。失敗が起きない前提が崩れたときに、原因が一切残りません。", "catch でエラーを握りつぶして固定メッセージだけ出す実装も、同じ理由で調査を難しくします。error の内容を含めるべきです。"], "takeaway": "try? は理由を捨てる。原因を知りたいなら do-catch で error を出す。", "example": {"code": "import Foundation\nstruct User: Codable { let id: Int }\nlet json = #\"{\"id\": \"one\"}\"#\ndo {\n    _ = try JSONDecoder().decode(User.self, from: Data(json.utf8))\n} catch let DecodingError.typeMismatch(type, context) {\n    print(\"型の不一致:\", type, context.codingPath.map(\\.stringValue))\n} catch {\n    print(\"その他:\", error)\n}", "output": "型の不一致: Int [\"id\"]", "explanation": "DecodingError をパターンマッチすると、どのキーでどの型を期待したのかまで取り出せます。"}}, "seriesId": "foundation-codable-flow", "seriesStep": 4}, {"id": "practice-foundation-009", "track": "foundation", "lessonId": "foundation-codable-custom", "type": "fillBlank", "difficulty": 3, "title": "CodingKeysでキー名を対応づける", "prompt": "JSON の user_name を userName プロパティに対応させます。空欄を埋めてください。", "skills": ["foundation", "types"], "content": {"template": "import Foundation\nstruct User: Codable {\n    let userName: String\n    enum {{1}}: String, CodingKey {\n        case userName = {{2}}\n    }\n}\nlet json = #\"{\"user_name\": \"Yuki\"}\"#\nlet user = try? JSONDecoder().decode(User.self, from: Data(json.utf8))\nprint(user?.userName ?? \"失敗\")", "blanks": [{"id": "1", "options": ["CodingKeys", "Keys", "JSONKeys", "CodingKey"]}, {"id": "2", "options": ["\"user_name\"", "\"userName\"", "user_name", "\"name\""]}]}, "solution": {"answers": {"1": "CodingKeys", "2": "\"user_name\""}}, "hints": ["Codable が探しに来る入れ子の enum は、名前が決まっています。単数形ではありません。", "rawValue には、実際のJSONに書かれている文字列を指定します。", "ケース名は Swift のプロパティ名、rawValue は JSON 側のキー名です。文字列なので引用符が必要です。"], "explanation": "Codable の自動生成は `CodingKeys` という名前の入れ子 enum を探します（この名前でなければ認識されません）。ケース名は Swift のプロパティ名と一致させ、rawValue に JSON 側のキー名 \"user_name\" を書くことで対応付けが成立します。CodingKey はプロトコル名であり、enum の名前として使うものではありません。設定後は \"Yuki\" が正しくデコードされます。", "detail": {"concept": "CodingKeys は「Swift の名前」と「外部データの名前」の対応表です。プロパティ単位で個別に指定できるため、一部のキーだけ命名規則が違う場合にも対応できます。", "steps": ["`enum CodingKeys: String, CodingKey` … この名前と準拠が認識の条件。", "`case userName = \"user_name\"` … 左がプロパティ名、右が JSON のキー名。", "デコード時、userName を探す代わりに user_name を探すようになる。", "値が見つかるので userName に \"Yuki\" が入る。"], "whyCorrect": "自動生成される変換コードは CodingKeys の定義を優先して使います。ケース名がプロパティ名と一致しているため、どのプロパティの対応かも一意に決まります。", "commonMistakes": ["enum の名前を CodingKey や Keys にしてしまうと、自動生成に無視され、既定のキー名のままデコードが失敗します。", "CodingKeys を定義すると、そこに書かなかったプロパティはエンコード/デコードの対象から外れます。全プロパティを列挙する必要があります。"], "takeaway": "対応表は enum CodingKeys: String, CodingKey。名前が違うと認識されない。", "example": {"code": "import Foundation\nstruct User: Codable {\n    let userName: String\n    enum CodingKeys: String, CodingKey { case userName = \"user_name\" }\n}\nlet encoder = JSONEncoder()\nlet data = try! encoder.encode(User(userName: \"Yuki\"))\nprint(String(decoding: data, as: UTF8.self))", "output": "{\"user_name\":\"Yuki\"}", "explanation": "CodingKeys はエンコード時にも使われるため、出力される JSON のキーも user_name になります。"}}, "seriesId": "foundation-codable-custom", "seriesStep": 1}, {"id": "practice-foundation-010", "track": "foundation", "lessonId": "foundation-codable-custom", "type": "chooseBlocks", "difficulty": 3, "title": "キー変換の設定に必要な行だけ選ぶ", "prompt": "CodingKeys を書かずに、スネークケースのJSONをデコードします。必要な行だけを選び、正しい順に並べてください。", "skills": ["foundation"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "struct User: Codable { let userName: String }"}, {"id": "b3", "code": "let decoder = JSONDecoder()"}, {"id": "b4", "code": "decoder.keyDecodingStrategy = .convertFromSnakeCase"}, {"id": "b5", "code": "let json = #\"{\"user_name\": \"Yuki\"}\"#"}, {"id": "b6", "code": "print((try? decoder.decode(User.self, from: Data(json.utf8)))?.userName ?? \"失敗\")"}, {"id": "b7", "code": "decoder.dateDecodingStrategy = .iso8601"}, {"id": "b8", "code": "let decoder = JSONEncoder()"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5", "b6"], "order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["デコードするので、必要なのはデコーダです。エンコーダではありません。", "設定は decode を呼ぶ前に行う必要があります。", "日付の設定はこのJSONに日付が含まれないため不要です。キー変換の設定だけを選びます。"], "explanation": "`keyDecodingStrategy = .convertFromSnakeCase` を設定すると、JSON のスネークケースのキーがキャメルケースに変換されてからプロパティと照合されます。CodingKeys を書かずに済むため、キーが多い型では記述量が大きく減ります。JSONEncoder はエンコード用なので decode を持たず、dateDecodingStrategy はこのJSONに日付が含まれないため意味がありません。設定は必ず decode より前に行います。", "detail": {"concept": "デコーダの各種 strategy は、外部データの表現と Swift の型の間の変換ルールです。個別の型に散らばる設定を1か所にまとめられるのが利点です。", "steps": ["`JSONDecoder()` を生成する。", "`keyDecodingStrategy = .convertFromSnakeCase` を設定する。", "user_name → userName という変換が適用されるようになる。", "decode するとプロパティ名と一致し、\"Yuki\" が得られる。"], "whyCorrect": "設定がデコーダ側にあるため、対象の型を変更せずに命名規則の差を吸収できます。API全体が同じ規則なら、この1行がすべての型に効きます。", "commonMistakes": ["設定を decode のあとに書いてしまう間違いです。すでに変換が終わっているため効果がありません。", "一部のキーだけ規則が違う場合、convertFromSnakeCase では対応できません。その型だけ CodingKeys を併用します。"], "takeaway": "命名規則の差はデコーダの strategy で吸収できる。設定は decode より前。", "example": {"code": "import Foundation\nstruct User: Codable { let userName: String; let isActive: Bool }\nlet decoder = JSONDecoder()\ndecoder.keyDecodingStrategy = .convertFromSnakeCase\nlet json = #\"{\"user_name\": \"Yuki\", \"is_active\": true}\"#\nlet user = try? decoder.decode(User.self, from: Data(json.utf8))\nprint(user?.userName ?? \"失敗\", user?.isActive ?? false)", "output": "Yuki true", "explanation": "設定は1行のまま、複数のキーすべてに適用されます。"}}, "seriesId": "foundation-codable-custom", "seriesStep": 2}, {"id": "practice-foundation-011", "track": "foundation", "lessonId": "foundation-codable-custom", "type": "buildFunction", "difficulty": 4, "title": "日付形式を指定するデコード関数を組み立てる", "prompt": "ISO8601形式の日付を含むJSONをデコードする関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["foundation", "functions", "errors"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "struct Log: Codable { let at: Date }"}, {"id": "b3", "code": "func decodeLog(_ json: String) throws -> Log {"}, {"id": "b4", "code": "    let decoder = JSONDecoder()"}, {"id": "b5", "code": "    decoder.dateDecodingStrategy = .iso8601"}, {"id": "b6", "code": "    return try decoder.decode(Log.self, from: Data(json.utf8))"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "    decoder.keyDecodingStrategy = .convertFromSnakeCase"}, {"id": "b9", "code": "    return try JSONDecoder().decode(Log.self, from: Data(json.utf8))"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7"]}, "hints": ["Date の既定のデコード方式は ISO8601 ではありません。明示的な指定が必要です。", "設定したデコーダを使って decode しなければ、設定は意味を持ちません。", "import → 型 → 関数宣言 → デコーダ生成 → 日付形式の指定 → 設定したデコーダで decode → 関数を閉じる、の7行です。"], "explanation": "JSONDecoder の dateDecodingStrategy は既定で `.deferredToDate`（Appleの基準時刻からの秒数）なので、\"2026-01-01T00:00:00Z\" のような文字列は解釈できずデコードに失敗します。`.iso8601` を指定して初めて正しく Date になります。b9 のように新しい JSONDecoder を作って decode すると、せっかく設定したデコーダが使われないため設定が無効になります。キー変換の設定はこの型に必要ないため不要です。", "detail": {"concept": "Date は表現方法が多数あるため、Codable は既定の解釈を1つ決めています。実際のAPIはISO8601やUnix時刻などを使うため、ほぼ必ず戦略の指定が必要になります。", "steps": ["`let decoder = JSONDecoder()` … 設定を保持するインスタンスを作る。", "`decoder.dateDecodingStrategy = .iso8601` … 文字列形式の日付を解釈できるようにする。", "`try decoder.decode(...)` … 設定済みのインスタンスを使うことが重要。", "throws にすることで、失敗の理由を呼び出し側に伝えられる。"], "whyCorrect": "設定を持つインスタンスをそのまま decode に使っているため、日付戦略が実際に適用されます。関数を throws にしたことで、失敗を握りつぶさずに呼び出し側へ渡せます。", "commonMistakes": ["設定したデコーダとは別に `JSONDecoder()` を作って decode してしまい、「設定したのに効かない」と悩む間違いです。", "日付の形式が合わないときのエラーは dataCorrupted として現れます。keyNotFound ではないため、キー名を疑って時間を使いがちです。"], "takeaway": "Date のデコードは戦略の指定が前提。設定したインスタンスで decode する。", "example": {"code": "import Foundation\nstruct Log: Codable { let at: Date }\nlet decoder = JSONDecoder()\ndecoder.dateDecodingStrategy = .iso8601\nlet json = #\"{\"at\": \"2026-01-01T00:00:00Z\"}\"#\nlet log = try! decoder.decode(Log.self, from: Data(json.utf8))\nprint(log.at.timeIntervalSince1970)", "output": "1767225600.0", "explanation": "ISO8601 の文字列が Date に変換され、Unix時刻として確認できます。"}}, "seriesId": "foundation-codable-custom", "seriesStep": 3}, {"id": "practice-foundation-012", "track": "foundation", "lessonId": "foundation-data-json", "type": "trace", "difficulty": 3, "title": "エンコード結果の文字列を追う", "prompt": "次のコードを実行したとき、表示される内容を選んでください。", "skills": ["foundation", "debugging"], "content": {"code": "import Foundation\nstruct User: Codable { let id: Int; let name: String }\nlet encoder = JSONEncoder()\nencoder.outputFormatting = .sortedKeys\nlet data = try! encoder.encode(User(id: 1, name: \"Yuki\"))\nprint(String(decoding: data, as: UTF8.self))", "options": [{"id": "o1", "label": "{\"id\":1,\"name\":\"Yuki\"}"}, {"id": "o2", "label": "{\"name\":\"Yuki\",\"id\":1}"}, {"id": "o3", "label": "{ \"id\" : 1, \"name\" : \"Yuki\" }"}, {"id": "o4", "label": "User(id: 1, name: \"Yuki\")"}]}, "solution": {"optionId": "o1"}, "hints": ["sortedKeys はキーをどう並べる設定でしょうか。", "prettyPrinted を指定していないので、余分な空白や改行は入りません。", "キーはアルファベット順に並び、区切りの空白もありません。id が name より先に来ます。"], "explanation": "`.sortedKeys` はキーをアルファベット順に並べる指定なので、id が name より先になります。`.prettyPrinted` を指定していないため空白や改行は挿入されず、`{\"id\":1,\"name\":\"Yuki\"}` という詰まった形式になります。print しているのは encode 結果の Data を UTF-8 文字列に変換したもので、Swift の構造体の表示ではありません。sortedKeys を付けない場合、キーの順序は保証されないため、出力を文字列比較するテストは不安定になります。", "detail": {"concept": "JSONEncoder の outputFormatting は出力の見た目を制御します。テストで文字列比較する場合は、順序を固定する sortedKeys が事実上必須です。", "steps": ["`.sortedKeys` … キーを名前順に並べる。id → name。", "`.prettyPrinted` は指定していないので、整形用の空白・改行は入らない。", "encode は Data を返す。", "`String(decoding:as:)` で UTF-8 として文字列化し、そのまま出力される。"], "whyCorrect": "指定した2つの条件（キー順の固定、整形なし）だけで出力形式が一意に決まります。構造体の description ではなく JSON 文字列が表示される点も、encode を経ているためです。", "commonMistakes": ["sortedKeys がないときの出力順を「宣言順になる」と考える間違いです。順序は未定義で、実行環境やバージョンによって変わり得ます。", "prettyPrinted を付けたまま文字列比較のテストを書くと、改行やインデントの差で失敗しやすくなります。"], "takeaway": "JSON文字列を比較するなら sortedKeys。整形は人が読むときだけ。", "example": {"code": "import Foundation\nstruct User: Codable { let id: Int; let name: String }\nlet encoder = JSONEncoder()\nencoder.outputFormatting = [.sortedKeys, .prettyPrinted]\nlet data = try! encoder.encode(User(id: 1, name: \"Yuki\"))\nprint(String(decoding: data, as: UTF8.self))", "output": "{\n  \"id\" : 1,\n  \"name\" : \"Yuki\"\n}", "explanation": "prettyPrinted を足すと人が読みやすい形になりますが、文字列比較には向かなくなります。"}}, "seriesId": "foundation-json-io", "seriesStep": 1}, {"id": "practice-foundation-013", "track": "foundation", "lessonId": "foundation-data-json", "type": "repair", "difficulty": 3, "title": "DataをStringに戻す書き方に直す", "prompt": "3行目がビルドできません。修正として最も適切なものを選んでください。", "skills": ["foundation", "types", "debugging"], "content": {"code": "import Foundation\nlet data = Data(\"Hello\".utf8)\nlet text = String(data)\nprint(text)", "options": [{"id": "o1", "code": "let text = String(decoding: data, as: UTF8.self)"}, {"id": "o2", "code": "let text = String(data: data)"}, {"id": "o3", "code": "let text = data.description"}, {"id": "o4", "code": "let text = String(data, encoding: .utf8)"}]}, "solution": {"optionId": "o1", "fixedCode": "import Foundation\nlet data = Data(\"Hello\".utf8)\nlet text = String(decoding: data, as: UTF8.self)\nprint(text)"}, "hints": ["Data は「バイトの並び」なので、文字列に戻すには文字コードの指定が必要です。", "文字コードを引数として渡す初期化子を探します。ラベルの形が決まっています。", "失敗しない書き方は、デコード方式を型として渡す形です。不正なバイトは置換文字になります。"], "explanation": "バグは3行目で、String には Data だけを受け取る初期化子が存在しないため 'No exact matches in call to initializer' になります。ビルド時のエラーで、実行には至りません。修正は `String(decoding: data, as: UTF8.self)` で、これは不正なバイト列があっても置換文字に変換して必ず String を返すため Optional になりません。`String(data:encoding:)` は正しい API ですが引数が2つ必要で、しかも Optional を返します。`data.description` は「5 bytes」のような説明文字列になり内容ではありません。", "detail": {"concept": "Data はバイト列であり、テキストとして解釈するには文字エンコーディングの指定が必要です。指定方法によって、失敗しうる API と失敗しない API に分かれます。", "steps": ["`Data(\"Hello\".utf8)` … 文字列を UTF-8 のバイト列にする。", "`String(decoding: data, as: UTF8.self)` … バイト列を UTF-8 として解釈する。", "不正なバイトがあっても置換文字に変えるため、戻り値は非Optional。", "結果として Hello が出力される。"], "whyCorrect": "decoding:as: 版は仕様上失敗しないため、Optional の扱いが不要になります。ログ出力やデバッグ表示では、この単純さが実用上有利です。", "commonMistakes": ["`String(data: data, encoding: .utf8)!` と強制アンラップする書き方は、不正なバイト列が来たときにクラッシュします。", "`data.description` を内容だと思い込む間違いです。表示されるのはバイト数などの説明で、テキストではありません。"], "takeaway": "Data → String は decoding:as: が既定の選択。失敗しないぶん扱いやすい。", "example": {"code": "import Foundation\nlet data = Data(\"Hello\".utf8)\nprint(String(decoding: data, as: UTF8.self))\nprint(String(data: data, encoding: .utf8) ?? \"変換失敗\")", "output": "Hello\nHello", "explanation": "どちらも同じ結果になりますが、下は Optional なので既定値の指定が必要です。"}}, "seriesId": "foundation-json-io", "seriesStep": 2}, {"id": "practice-foundation-014", "track": "foundation", "lessonId": "foundation-data-json", "type": "testReasoning", "difficulty": 4, "title": "クラッシュするデコード関数のテストを読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "foundation", "debugging"], "noRunSolution": true, "content": {"requirement": "decodeUser(_:) は正しいJSONなら User を返し、不正なJSONなら nil を返す。どんな入力でもクラッシュしてはならない。", "code": "func decodeUser(_ json: String) -> User? {\n    try! JSONDecoder().decode(User.self, from: Data(json.utf8))\n}", "tests": [{"name": "正しいJSON", "input": "{\"id\": 1}", "expected": "User(id: 1)", "result": "成功"}, {"name": "壊れたJSON", "input": "{\"id\":", "expected": "nil", "result": "失敗（クラッシュして以降のテストが実行されない）"}], "options": [{"id": "o1", "label": "try! を使っているため、デコードに失敗した時点で nil を返さずにプロセスが停止する"}, {"id": "o2", "label": "戻り値の型が User? ではないため nil を返せない"}, {"id": "o3", "label": "Data(json.utf8) が不正な文字列に対してエラーを投げている"}, {"id": "o4", "label": "JSONDecoder を毎回生成しているため状態が壊れている"}]}, "solution": {"optionId": "o1"}, "hints": ["失敗したテストは、壊れた入力に対する動作を検証しています。", "戻り値の型は User? なので、nil を返す経路自体は用意されています。問題は返す前に何が起きるかです。", "try! は失敗したときにエラーを伝えるのではなく、その場で実行を止めます。"], "explanation": "失敗したテストが表しているのは「不正な入力でも落ちずに nil を返す」という頑健性の要件です。入力はJSONとして閉じていない壊れた文字列で、パースが必ず失敗するケースを狙っています。実装は `try!` を使っているため、decode がエラーを投げた瞬間に 'Fatal error' でプロセスが停止し、nil を返す機会そのものがありません。戻り値の型は User? なので nil を返す経路は用意されており、型の問題ではありません。また `Data(json.utf8)` はどんな String でも成功するためエラーを投げず、JSONDecoder の生成もエラーの原因ではありません。修正は `try?` を使うか、do-catch で失敗時に nil を返すことです。クラッシュがテストランナー全体を止めてしまうため、この失敗は他のテストの信頼性も損ないます。", "detail": {"concept": "「エラーを返す」と「クラッシュする」は根本的に違います。前者は呼び出し側が対処できますが、後者はプロセスごと終了するため、回復も記録もできません。", "steps": ["要件は「不正な入力では nil」。つまりエラーは想定内の事象。", "`try!` は「ここでは絶対に失敗しない」という宣言。", "壊れたJSONでは decode が dataCorrupted を投げ、try! がそれを致命的エラーに変える。", "`try?` に変えると、同じ経路で nil が返り、要件を満たす。"], "whyCorrect": "正しいJSONのテストが成功していることから、デコード処理自体と戻り値の型は正しいと分かります。差が出ているのは失敗時の扱いだけで、それを決めているのが try! です。", "commonMistakes": ["try! を「短く書ける try?」と考える間違いです。失敗時の挙動がまったく違います。", "テスト側で壊れた入力を渡さないようにして通す対応です。実際のAPIやファイルは壊れた入力を返し得るため、問題は本番に残ります。", "この関数では nil しか返せないため、失敗の理由は呼び出し側に伝わりません。理由が必要なら Result や throws を返す設計にします。"], "takeaway": "想定内の失敗に try! を使わない。クラッシュは回復も記録もできない。", "example": {"code": "import Foundation\nstruct User: Codable { let id: Int }\nfunc decodeUser(_ json: String) -> User? {\n    try? JSONDecoder().decode(User.self, from: Data(json.utf8))\n}\nprint(decodeUser(#\"{\"id\": 1}\"#)?.id ?? -1)\nprint(decodeUser(\"{\\\"id\\\":\")?.id ?? -1)", "output": "1\n-1", "explanation": "try? に変えると、壊れた入力でもクラッシュせずに nil が返ります。"}}, "seriesId": "foundation-json-io", "seriesStep": 3}, {"id": "practice-foundation-015", "track": "foundation", "lessonId": "foundation-date-calendar", "type": "matching", "difficulty": 1, "title": "日付まわりの型の役割を対応づける", "prompt": "日付を扱う型と、その役割を対応させてください。", "skills": ["foundation"], "content": {"left": [{"id": "l1", "label": "Date"}, {"id": "l2", "label": "Calendar"}, {"id": "l3", "label": "DateComponents"}, {"id": "l4", "label": "TimeZone"}], "right": [{"id": "r1", "label": "時間軸上の一点。暦や表示形式の情報は持たない"}, {"id": "r2", "label": "暦そのもの。日付の加算や差分の計算を担当する"}, {"id": "r3", "label": "年・月・日などの部品の集合。日付の分解と組み立てに使う"}, {"id": "r4", "label": "地域ごとの時差。同じ瞬間でも表示される日時が変わる原因になる"}, {"id": "r5", "label": "日付を人が読む文字列に変換する設定を持つオブジェクト"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["Date そのものは「何年何月」という情報を持っていません。ただの時刻です。", "「3日後」を求めるには暦の知識が必要です。それを担当する型があります。", "r5 は DateFormatter の説明なので、この4つとは対応しません。"], "explanation": "Date は時間軸上の一点（基準時刻からの経過秒数）にすぎず、年月日や表示形式の概念を持ちません。年月日への分解や「3日後」の計算は Calendar が行い、その結果の部品を表すのが DateComponents です。TimeZone は同じ Date が地域によって別の日時として見える理由そのものです。r5 は DateFormatter の説明で、この中には対応するものがありません。", "detail": {"concept": "日付処理のバグの多くは「Date に暦の情報が入っている」という誤解から生まれます。Date は瞬間、Calendar は解釈、TimeZone は見え方、と役割を分けて考えると整理できます。", "steps": ["Date … 1970年からの経過秒数として表される一点。どこで見ても同じ瞬間。", "Calendar … その瞬間を年月日に分解したり、日単位で加算したりする。", "DateComponents … 分解した結果、あるいは組み立てるための材料。", "TimeZone … 同じ Date を東京で見るかロンドンで見るかで、日付すら変わり得る。"], "whyCorrect": "4つの型は「点・暦・部品・地域差」という別々の関心事を担当しており、説明と1対1で対応します。表示（フォーマット）だけは別の型の役割です。", "commonMistakes": ["Date を文字列として保存・比較する間違いです。表示のための変換と、値としての保持は分けるべきです。", "TimeZone を指定せずに日付の境界（その日の始まり）を計算すると、実行環境によって結果が変わります。"], "takeaway": "Date は瞬間、Calendar は解釈、TimeZone は見え方。混ぜない。", "example": {"code": "import Foundation\nvar cal = Calendar(identifier: .gregorian)\ncal.timeZone = TimeZone(identifier: \"UTC\")!\nlet base = Date(timeIntervalSince1970: 0)\nprint(cal.component(.year, from: base), cal.component(.day, from: base))", "output": "1970 1", "explanation": "同じ Date でも、Calendar と TimeZone を与えて初めて「何年何日か」が決まります。"}}, "seriesId": "foundation-date-basics", "seriesStep": 1}, {"id": "practice-foundation-016", "track": "foundation", "lessonId": "foundation-date-calendar", "type": "fillBlank", "difficulty": 2, "title": "暦を使って3日後を求める", "prompt": "基準日の3日後を求めて、経過秒数を表示します。空欄を埋めてください。", "skills": ["foundation"], "content": {"template": "import Foundation\nvar cal = Calendar(identifier: .gregorian)\ncal.timeZone = TimeZone(identifier: \"UTC\")!\nlet base = Date(timeIntervalSince1970: 0)\nlet next = cal.date({{1}}: .day, value: 3, to: base)!\nprint(next.{{2}}Since1970)", "blanks": [{"id": "1", "options": ["byAdding", "adding", "add", "byComponent"]}, {"id": "2", "options": ["timeInterval", "interval", "time", "distance"]}]}, "solution": {"answers": {"1": "byAdding", "2": "timeInterval"}}, "hints": ["Calendar のメソッドは「何を足すか」を外部ラベルで表します。", "Date から1970年以降の経過秒数を得るプロパティの名前を思い出してください。", "1つめは「加算によって」を意味する外部ラベル、2つめは「時間の間隔」を表す語です。"], "explanation": "`Calendar.date(byAdding:value:to:)` は、暦の単位（ここでは .day）を指定して日付を加算します。単純に86400秒を足すのと違い、夏時間や暦の切り替わりを考慮した「3日後」になります。`timeIntervalSince1970` は Date から基準時刻以降の経過秒数を返すプロパティです。UTC では夏時間がないため 3日 = 259200.0 秒がそのまま表示されます。", "detail": {"concept": "「3日後」は物理的な秒数ではなく暦の概念です。Calendar を経由することで、地域の時制の特例を自動的に扱えます。", "steps": ["`Calendar(identifier: .gregorian)` … 使う暦を明示する。", "`cal.timeZone = TimeZone(identifier: \"UTC\")!` … 地域差を固定して結果を安定させる。", "`cal.date(byAdding: .day, value: 3, to: base)` … 暦のうえで3日進める。戻り値は Optional。", "`timeIntervalSince1970` で経過秒数を確認すると 259200.0。"], "whyCorrect": "byAdding は加算する単位、value は個数、to は基準日という3つの情報を過不足なく渡す設計です。UTC を指定したことで、実行環境に依存しない結果になります。", "commonMistakes": ["`base.addingTimeInterval(86400 * 3)` で代用する間違いです。夏時間のある地域では時刻がずれます。", "Calendar.current を使ったまま結果をテストと比較すると、実行環境のタイムゾーン次第で失敗します。テストでは固定した Calendar を使います。"], "takeaway": "日付の加算は Calendar.date(byAdding:value:to:)。秒数の足し算で代用しない。", "example": {"code": "import Foundation\nvar cal = Calendar(identifier: .gregorian)\ncal.timeZone = TimeZone(identifier: \"UTC\")!\nlet base = Date(timeIntervalSince1970: 0)\nprint(cal.date(byAdding: .day, value: 3, to: base)!.timeIntervalSince1970)\nprint(cal.date(byAdding: .month, value: 1, to: base)!.timeIntervalSince1970)", "output": "259200.0\n2678400.0", "explanation": "1か月は31日（1月）として計算されており、固定秒数では表せないことが分かります。"}}, "seriesId": "foundation-date-basics", "seriesStep": 2}, {"id": "practice-foundation-017", "track": "foundation", "lessonId": "foundation-date-calendar", "type": "bugHunt", "difficulty": 3, "title": "秒数を足して翌日にしている行を見つける", "prompt": "夏時間のある地域で、翌日にならないことがあります。原因になっている行を選んでください。", "skills": ["foundation", "debugging"], "content": {"lines": [{"id": "l1", "code": "import Foundation"}, {"id": "l2", "code": "let cal = Calendar.current"}, {"id": "l3", "code": "let tomorrow = Date().addingTimeInterval(86400)"}, {"id": "l4", "code": "print(cal.isDateInTomorrow(tomorrow))"}]}, "solution": {"optionId": "l3", "fixedCode": "import Foundation\nlet cal = Calendar.current\nlet tomorrow = cal.date(byAdding: .day, value: 1, to: Date())!\nprint(cal.isDateInTomorrow(tomorrow))"}, "hints": ["1日は常に86400秒でしょうか。夏時間の切り替え日を思い出してください。", "暦の上での「1日後」と、物理的な86400秒後は同じとは限りません。", "秒数を直接足している行が、暦の特例を無視しています。"], "explanation": "バグは3行目です。`addingTimeInterval(86400)` は物理的に86400秒進めるだけなので、夏時間が始まる日（1日が23時間になる日）では翌日の1時に、終わる日（25時間になる日）では当日の23時に着地します。挙動としてはクラッシュせず、年に数日だけ判定がずれるという形で現れるため、再現も発見も難しいバグです。修正は `cal.date(byAdding: .day, value: 1, to: Date())` を使い、暦に日付を進めさせることです。これなら地域の時制に関わらず、常に翌日の同じ時刻になります。", "detail": {"concept": "カレンダー上の単位（日・月・年）は可変長です。夏時間、うるう年、うるう秒などの特例があるため、固定の秒数に換算した時点で正しさが失われます。", "steps": ["夏時間開始日は現地時間で1日が23時間しかない。", "そこに86400秒を足すと、翌日の同時刻を1時間超える。", "終了日は25時間あるため、86400秒では当日中に留まる。", "Calendar.date(byAdding:) は暦の規則を適用するため、常に翌日の同時刻になる。"], "whyCorrect": "原因は日付を進めている3行目にあります。4行目の判定は与えられた Date を正しく評価しているだけで、入力がずれていることが問題です。", "commonMistakes": ["テスト環境が夏時間のない地域（日本など）だと再現しないため、「動いている」と判断してしまう間違いです。", "`86400 * 30` で1か月を表す間違いも同種です。月の長さは28〜31日で変わります。"], "takeaway": "日・月・年は可変長。秒数に換算した時点でバグの種になる。", "example": {"code": "import Foundation\nvar cal = Calendar(identifier: .gregorian)\ncal.timeZone = TimeZone(identifier: \"America/Los_Angeles\")!\nvar c = DateComponents(); c.year = 2026; c.month = 3; c.day = 8; c.hour = 0\nlet base = cal.date(from: c)!\nlet f = DateFormatter()\nf.dateFormat = \"yyyy-MM-dd HH:mm\"\nf.timeZone = cal.timeZone\nf.locale = Locale(identifier: \"en_US_POSIX\")\nprint(f.string(from: cal.date(byAdding: .day, value: 1, to: base)!))\nprint(f.string(from: base.addingTimeInterval(86400)))", "output": "2026-03-09 00:00\n2026-03-09 01:00", "explanation": "夏時間が始まる日をまたぐと、暦による加算と秒数の加算で1時間ずれることが実際に確認できます。"}}, "seriesId": "foundation-date-basics", "seriesStep": 3}, {"id": "practice-foundation-018", "track": "foundation", "lessonId": "foundation-formatting", "type": "repair", "difficulty": 3, "title": "端末によって変わる日付表示を固定する", "prompt": "どの端末でも UTC の 1970/01/01 と表示させたいです。3行目のあとに追加する設定として最も適切なものを選んでください。", "skills": ["foundation", "debugging"], "content": {"code": "import Foundation\nlet f = DateFormatter()\nf.dateFormat = \"yyyy/MM/dd\"\nlet date = Date(timeIntervalSince1970: 0)\nprint(f.string(from: date))", "options": [{"id": "o1", "code": "f.timeZone = TimeZone(identifier: \"UTC\")\nf.locale = Locale(identifier: \"en_US_POSIX\")"}, {"id": "o2", "code": "f.dateStyle = .short"}, {"id": "o3", "code": "f.locale = Locale.current"}, {"id": "o4", "code": "f.calendar = Calendar.autoupdatingCurrent"}]}, "solution": {"optionId": "o1", "fixedCode": "import Foundation\nlet f = DateFormatter()\nf.dateFormat = \"yyyy/MM/dd\"\nf.timeZone = TimeZone(identifier: \"UTC\")\nf.locale = Locale(identifier: \"en_US_POSIX\")\nlet date = Date(timeIntervalSince1970: 0)\nprint(f.string(from: date))"}, "hints": ["同じ Date でも、地域によって日付そのものが変わります。", "端末の暦設定が和暦などになっていると、yyyy が想定外の年になります。", "固定の書式で機械的に出力したいときは、タイムゾーンと固定ロケールの両方を明示します。"], "explanation": "バグは設定不足です。DateFormatter は既定で端末の TimeZone と Locale を使うため、同じ Date でも実行環境によって日付や年号が変わります（和暦設定では 0045/01/01 のようになり得ます）。挙動としてはクラッシュせず、一部の端末でだけ表示が違うという形で現れます。修正は timeZone を UTC に固定し、locale を en_US_POSIX にすることです。en_US_POSIX は「ユーザー設定の影響を受けない固定ロケール」として用意されており、機械可読な固定書式には必ずこれを使います。dateStyle は独自の書式を上書きしてしまい、Locale.current や autoupdatingCurrent はむしろ環境依存を強めます。", "detail": {"concept": "日付の文字列化には「人に見せる表示」と「機械が読む固定書式」の2種類があります。前者は端末設定に従うべきで、後者は必ず固定しなければなりません。", "steps": ["`dateFormat` を自分で指定する時点で、これは機械可読な固定書式。", "既定の timeZone は端末の地域なので、UTC の0時が前日になる地域がある。", "既定の locale は端末設定なので、暦や数字の表記が変わり得る。", "UTC + en_US_POSIX を指定すると、どの端末でも同じ文字列になる。"], "whyCorrect": "表示のばらつきの原因は timeZone（どの地域の日付か）と locale（どの暦・表記か）の2つです。両方を固定して初めて出力が一意に決まります。", "commonMistakes": ["locale だけを固定して timeZone を忘れる間違いです。日付が1日ずれる地域が残ります。", "固定書式に Locale.current を使う間違いです。和暦やアラビア数字以外の表記になると、パース側と食い違います。", "DateFormatter は生成コストが高いため、ループの中で毎回作るのは避けます。"], "takeaway": "固定書式には UTC + en_US_POSIX。人に見せる表示だけ端末設定に従わせる。", "example": {"code": "import Foundation\nlet f = DateFormatter()\nf.dateFormat = \"yyyy/MM/dd HH:mm\"\nf.timeZone = TimeZone(identifier: \"UTC\")\nf.locale = Locale(identifier: \"en_US_POSIX\")\nprint(f.string(from: Date(timeIntervalSince1970: 0)))\nf.timeZone = TimeZone(identifier: \"Asia/Tokyo\")\nprint(f.string(from: Date(timeIntervalSince1970: 0)))", "output": "1970/01/01 00:00\n1970/01/01 09:00", "explanation": "同じ Date でも timeZone を変えるだけで表示が9時間ずれます。日付が変わる時刻なら日付自体もずれます。"}}, "seriesId": "foundation-formatting", "seriesStep": 1}, {"id": "practice-foundation-019", "track": "foundation", "lessonId": "foundation-formatting", "type": "testReasoning", "difficulty": 3, "title": "金額表示のテストが落ちた原因を読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "foundation", "debugging"], "content": {"requirement": "priceText(_:) は金額を必ず小数第2位まで表示した文字列を返す（例: 12.34 → \"12.34\"、1234.5 → \"1234.50\"）。", "code": "func priceText(_ value: Double) -> String {\n    \"\\(value)\"\n}", "tests": [{"name": "小数が2桁ある", "input": "12.34", "expected": "\"12.34\"", "result": "成功"}, {"name": "小数が1桁しかない", "input": "1234.5", "expected": "\"1234.50\"", "result": "失敗（\"1234.5\" が返った）"}], "options": [{"id": "o1", "label": "文字列補間は Double を最短の表現で文字列化するため、末尾の0が省かれて桁数が固定されない"}, {"id": "o2", "label": "Double の丸め誤差によって値そのものが 1234.5 から変化している"}, {"id": "o3", "label": "3桁区切りのカンマが挿入されてしまっている"}, {"id": "o4", "label": "戻り値が Optional になっているため比較に失敗している"}]}, "solution": {"optionId": "o1"}, "hints": ["成功したテストと失敗したテストの違いは、小数部の桁数だけです。", "12.34 はたまたま2桁だったので通っています。桁数を固定する処理はどこにもありません。", "文字列補間は「その値を表す最短の文字列」を作ります。1234.50 の末尾の0は情報として不要なので消えます。"], "explanation": "失敗したテストが表しているのは「表示桁数を常に2桁に固定する」という要件です。検証している入力 1234.5 は小数部が1桁しかない値で、桁を補う処理が必要になる代表的なケースです。実装は `\"\\(value)\"` という文字列補間だけで、Double を最短表現に変換するため 1234.5 のまま出力されます。成功している 12.34 は、たまたま最短表現が要件と一致しただけで、桁数を固定できている証拠にはなりません。丸め誤差やカンマ区切りは発生しておらず、戻り値も String なので、原因は補間による表現方法だけです。修正は `String(format: \"%.2f\", value)` などで桁数を明示することです。", "detail": {"concept": "数値の「値」と「表示」は別物です。表示桁数を要件にするなら、必ず書式指定を通す必要があります。補間は開発中の確認用であり、仕様を満たす整形手段ではありません。", "steps": ["要件は小数第2位までの固定表示。", "`\"\\(value)\"` は Double の最短表現を返す。", "1234.5 の最短表現は \"1234.5\" なので、桁が足りない。", "`String(format: \"%.2f\", value)` なら常に2桁になり、\"1234.50\" が得られる。"], "whyCorrect": "失敗しているのは小数部が2桁未満の入力だけで、2桁ちょうどの入力は通っています。この分かれ方は「桁を補う処理がない」ことを正確に示しています。", "commonMistakes": ["1件しか落ちていないことを理由に、テストの期待値を \"1234.5\" に書き換える対応です。仕様のほうを壊しています。", "通貨表示が必要な場合は %.2f ではなく NumberFormatter の currency スタイルを使います。地域ごとの記号や区切りが必要になるためです。"], "takeaway": "表示桁数が仕様なら書式指定が必須。補間は最短表現を返すだけ。", "example": {"code": "import Foundation\nprint(\"\\(1234.5)\")\nprint(String(format: \"%.2f\", 1234.5))\nprint(String(format: \"%.2f\", 12.345))", "output": "1234.5\n1234.50\n12.35", "explanation": "%.2f は桁を補うだけでなく、必要に応じて四捨五入も行います。"}}, "seriesId": "foundation-formatting", "seriesStep": 2}, {"id": "practice-foundation-020", "track": "foundation", "lessonId": "foundation-url-components", "type": "reorder", "difficulty": 3, "title": "クエリ付きURLを組み立てる順に並べる", "prompt": "検索語をクエリに載せたURLを作って表示します。ブロックを正しい順に並べ替えてください。", "skills": ["foundation"], "content": {"blocks": [{"id": "b1", "code": "components.queryItems = [URLQueryItem(name: \"q\", value: \"swift lang\")]"}, {"id": "b2", "code": "import Foundation"}, {"id": "b3", "code": "var components = URLComponents(string: \"https://example.com/search\")!"}, {"id": "b4", "code": "let url = components.url!"}, {"id": "b5", "code": "print(url.absoluteString)"}]}, "solution": {"order": ["b2", "b3", "b1", "b4", "b5"]}, "hints": ["URLComponents を作ってから、クエリを設定します。", "url プロパティは、その時点の components の内容から URL を組み立てます。設定より前に取り出すとクエリが入りません。", "import → components 生成 → queryItems 設定 → url 取り出し → 表示、の順です。"], "explanation": "URLComponents は URL を部品ごとに保持する可変の構造体で、`url` プロパティはその時点の内容から URL を組み立てて返します。したがって queryItems の設定は `components.url` を取り出す前に行う必要があります。URLQueryItem を使うと値のパーセントエンコードが自動で行われ、半角スペースは %20 になります。出力は https://example.com/search?q=swift%20lang です。", "detail": {"concept": "URL は文字列に見えますが、実際にはスキーム・ホスト・パス・クエリという構造を持ちます。構造として組み立てると、エンコード漏れという典型的なバグが原理的に起きません。", "steps": ["`URLComponents(string:)` でベースとなるURLを分解する。", "`queryItems` に名前と値の組を設定する。値はそのまま書いてよい。", "`components.url` が、その内容から正しくエンコードされた URL を組み立てる。", "スペースは %20 に変換されて出力される。"], "whyCorrect": "url プロパティは呼び出し時点の状態から組み立てるため、設定 → 取り出しの順序が必要です。この順序が守られていれば、エンコードは自動的に正しく行われます。", "commonMistakes": ["`components.url` を先に取り出してから queryItems を設定しても、すでに作られた URL には反映されません。", "文字列連結で `?q=\\(query)` と書くと、スペースや & がエンコードされず、URL が壊れたり値が途中で切れたりします。"], "takeaway": "URLは組み立てる。文字列連結はエンコード事故のもと。", "example": {"code": "import Foundation\nvar components = URLComponents(string: \"https://example.com/search\")!\ncomponents.queryItems = [URLQueryItem(name: \"q\", value: \"swift lang\")]\nprint(components.url!.absoluteString)", "output": "https://example.com/search?q=swift%20lang", "explanation": "値に含まれるスペースが自動的に %20 へエンコードされています。"}}, "seriesId": "foundation-url-build", "seriesStep": 1}, {"id": "practice-foundation-021", "track": "foundation", "lessonId": "foundation-url-components", "type": "chooseBlocks", "difficulty": 3, "title": "記号を含む検索語を安全に載せる", "prompt": "検索語 a&b をクエリの値として正しく載せます。必要な行だけを選び、正しい順に並べてください。", "skills": ["foundation"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "var components = URLComponents(string: \"https://example.com/search\")!"}, {"id": "b3", "code": "components.queryItems = [URLQueryItem(name: \"q\", value: \"a&b\")]"}, {"id": "b4", "code": "print(components.url!.absoluteString)"}, {"id": "b5", "code": "let url = URL(string: \"https://example.com/search?q=a&b\")!"}, {"id": "b6", "code": "print(url.absoluteString)"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["& はクエリで「次の項目との区切り」を意味する予約文字です。", "文字列に直接書くと、値の一部ではなく区切りとして解釈されてしまいます。", "値をそのまま渡してエンコードを任せられる型を使います。"], "explanation": "URLQueryItem に値を渡すと、& のような予約文字が %26 にエンコードされ、`?q=a%26b` という「q の値が a&b である」正しいURLになります。一方 `URL(string: \"...?q=a&b\")` は文字列としては有効なURLですが、クエリとしては q=a と b という2つの項目に分かれて解釈されるため、サーバには q=a としか届きません。クラッシュもエラーも起きず、値が静かに欠けるのが厄介な点です。", "detail": {"concept": "URL の予約文字（& = ? # + など）は、値として使うときは必ずエンコードが必要です。エンコードの要否を人が判断するのではなく、構造として組み立てて機械に任せます。", "steps": ["`URLQueryItem(name: \"q\", value: \"a&b\")` … 値をそのまま渡す。", "`components.url` が組み立てる際に & を %26 に変換する。", "結果は https://example.com/search?q=a%26b。", "受け取り側でデコードすると、値は a&b として1つに戻る。"], "whyCorrect": "エンコードの責任を URLComponents に委ねているため、値にどんな文字が含まれていても構造が壊れません。検索語のようなユーザー入力では、これが必須の前提になります。", "commonMistakes": ["テストデータに記号を含めず「動いている」と判断する間違いです。記号入りの入力で初めて壊れます。", "自前で replacingOccurrences を使ってエンコードする間違いです。対象文字の抜けや二重エンコードが起きます。"], "takeaway": "クエリ値は URLQueryItem に任せる。文字列連結では予約文字が壊れる。", "example": {"code": "import Foundation\nlet bad = URL(string: \"https://example.com/search?q=a&b\")!\nprint(URLComponents(url: bad, resolvingAgainstBaseURL: false)!.queryItems!)\nvar good = URLComponents(string: \"https://example.com/search\")!\ngood.queryItems = [URLQueryItem(name: \"q\", value: \"a&b\")]\nprint(URLComponents(url: good.url!, resolvingAgainstBaseURL: false)!.queryItems!)", "output": "[q=a, b]\n[q=a&b]", "explanation": "文字列で書いた側は2つの項目に割れており、q の値が a だけになっていることが確認できます。"}}, "seriesId": "foundation-url-build", "seriesStep": 2}, {"id": "practice-foundation-022", "track": "foundation", "lessonId": "foundation-url-components", "type": "buildFunction", "difficulty": 3, "title": "検索URLを作る関数を組み立てる", "prompt": "検索語からURLを作る関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["foundation", "functions", "optional"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "func searchURL(query: String) -> URL? {"}, {"id": "b3", "code": "    var components = URLComponents(string: \"https://example.com/search\")"}, {"id": "b4", "code": "    components?.queryItems = [URLQueryItem(name: \"q\", value: query)]"}, {"id": "b5", "code": "    return components?.url"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    return URL(string: \"https://example.com/search?q=\\(query)\")"}, {"id": "b8", "code": "    components?.path = query"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["検索語はクエリに載せます。パスに入れると意味が変わります。", "文字列補間でURLを作ると、記号を含む検索語で構造が壊れます。", "import → 関数宣言 → components 生成 → queryItems 設定 → url を返す → 関数を閉じる、の6行です。"], "explanation": "URLComponents を使って組み立てると、検索語に含まれる記号が自動的にエンコードされます。`URLComponents(string:)` は失敗しうるので Optional となり、`components?.url` も Optional のまま返せるため、戻り値の型 URL? と自然に一致します。文字列補間で組み立てる b7 は、& や # を含む検索語で値が壊れます。b8 は検索語をパスに入れており、`/search/a&b` のようなまったく別のURLになってしまいます。", "detail": {"concept": "URL を作る関数は、外部入力を受け取る境界です。境界でエンコードを保証しておくと、以降のコードは安全な URL しか扱わなくて済みます。", "steps": ["`URLComponents(string:)` … 不正な文字列なら nil。だから Optional。", "`components?.queryItems = ...` … Optional chaining で設定する。", "`return components?.url` … 組み立てに失敗すれば nil がそのまま返る。", "呼び出し側は URL? を受け取り、nil のときの扱いを決める。"], "whyCorrect": "Optional のまま処理を進めることで、途中の失敗を握りつぶさずに呼び出し側へ伝えられます。エンコードは URLComponents が保証します。", "commonMistakes": ["`URLComponents(string:)!` と強制アンラップする間違いです。定数のURLなら実害は小さいものの、ベースURLを設定から読むようになった途端に落ちます。", "パスとクエリを取り違える間違いです。検索語はリソースの位置ではなく条件なので、クエリに載せます。"], "takeaway": "URLを作る関数は Optional を返し、エンコードは URLComponents に任せる。", "example": {"code": "import Foundation\nfunc searchURL(query: String) -> URL? {\n    var components = URLComponents(string: \"https://example.com/search\")\n    components?.queryItems = [URLQueryItem(name: \"q\", value: query)]\n    return components?.url\n}\nprint(searchURL(query: \"a&b\")?.absoluteString ?? \"作れません\")", "output": "https://example.com/search?q=a%26b", "explanation": "記号を含む検索語でも、値として正しくエンコードされた URL が得られます。"}}, "seriesId": "foundation-url-build", "seriesStep": 3}, {"id": "practice-foundation-023", "track": "foundation", "lessonId": "foundation-http-request", "type": "fillBlank", "difficulty": 3, "title": "POSTリクエストを組み立てる", "prompt": "JSONを送るPOSTリクエストを作ります。空欄を埋めてください。", "skills": ["foundation"], "content": {"template": "import Foundation\nvar request = URLRequest(url: URL(string: \"https://example.com/items\")!)\nrequest.{{1}} = \"POST\"\nrequest.setValue(\"application/json\", forHTTPHeaderField: {{2}})\nrequest.httpBody = Data(#\"{\"name\":\"a\"}\"#.utf8)\nprint(request.httpMethod ?? \"-\", request.value(forHTTPHeaderField: \"Content-Type\") ?? \"-\")", "blanks": [{"id": "1", "options": ["httpMethod", "method", "verb", "httpVerb"]}, {"id": "2", "options": ["\"Content-Type\"", "\"content\"", "\"Accept\"", "\"Body-Type\""]}]}, "solution": {"answers": {"1": "httpMethod", "2": "\"Content-Type\""}}, "hints": ["最後の print で読み出しているプロパティ名が、設定側の名前のヒントになります。", "「送る本文がどんな形式か」を伝えるヘッダーと、「受け取りたい形式」を伝えるヘッダーは別物です。", "1つめは HTTP のメソッドを表すプロパティ、2つめは本文の形式を宣言する標準ヘッダー名です。"], "explanation": "`httpMethod` に \"POST\" を設定し、`Content-Type` ヘッダーで本文が JSON であることをサーバに伝えます。Content-Type は「これから送る本文の形式」、Accept は「返してほしい形式」を意味するため、送信側の宣言には Content-Type を使います。ヘッダー名を間違えるとサーバ側でパースに失敗しますが、クライアント側ではエラーにならないため、レスポンスを見るまで気づけません。出力は「POST application/json」です。", "detail": {"concept": "URLRequest は「何を・どこへ・どうやって送るか」を保持する値です。メソッド・ヘッダー・本文の3つが揃って初めて、サーバが解釈できるリクエストになります。", "steps": ["`URLRequest(url:)` … 送り先を決める。既定のメソッドは GET。", "`httpMethod = \"POST\"` … 送信の種類を変更する。", "`setValue(_:forHTTPHeaderField:)` … 本文の形式を宣言する。", "`httpBody` … 実際に送るバイト列を設定する。"], "whyCorrect": "httpMethod と Content-Type はどちらも標準で決まった名前です。read 側の `request.httpMethod` と `value(forHTTPHeaderField: \"Content-Type\")` が同じものを指しているため、設定が正しかったことを出力で確認できます。", "commonMistakes": ["httpBody を設定したのに Content-Type を付け忘れる間違いです。サーバが本文の形式を判断できず、400系のエラーになります。", "GET リクエストに httpBody を設定する間違いです。仕様上意味を持たず、無視されるか拒否されます。"], "takeaway": "POST は method・Content-Type・body の3点セット。Accept とは役割が違う。", "example": {"code": "import Foundation\nvar request = URLRequest(url: URL(string: \"https://example.com/items\")!)\nrequest.httpMethod = \"POST\"\nrequest.setValue(\"application/json\", forHTTPHeaderField: \"Content-Type\")\nrequest.httpBody = Data(#\"{\"name\":\"a\"}\"#.utf8)\nprint(request.httpMethod ?? \"-\", request.httpBody?.count ?? 0)", "output": "POST 12", "explanation": "本文が12バイトのJSONとして設定されていることが確認できます。"}}, "seriesId": "foundation-request", "seriesStep": 1}, {"id": "practice-foundation-024", "track": "foundation", "lessonId": "foundation-http-request", "type": "reorder", "difficulty": 3, "title": "リクエスト組み立ての順に並べる", "prompt": "POSTリクエストを組み立てて内容を確認します。ブロックを正しい順に並べ替えてください。", "skills": ["foundation"], "content": {"blocks": [{"id": "b1", "code": "request.httpMethod = \"POST\""}, {"id": "b2", "code": "import Foundation"}, {"id": "b3", "code": "var request = URLRequest(url: url)"}, {"id": "b4", "code": "let url = URL(string: \"https://example.com/items\")!"}, {"id": "b5", "code": "request.httpBody = Data(#\"{\"name\":\"a\"}\"#.utf8)"}, {"id": "b6", "code": "print(request.httpMethod ?? \"-\", request.httpBody?.count ?? 0)"}]}, "solution": {"order": ["b2", "b4", "b3", "b1", "b5", "b6"]}, "hints": ["URLRequest を作るには、先に URL が必要です。", "プロパティの設定は、リクエストを作ったあとに行います。", "import → URL → URLRequest → メソッド → 本文 → 確認、の順です。"], "explanation": "URLRequest の初期化には URL が必要なので、URL を先に作ります。httpMethod や httpBody は URLRequest のプロパティなので、インスタンスを作ったあとに設定します。URLRequest は struct（値型）なので、設定するには var で保持する必要があります。最後の行で、メソッドが POST、本文が12バイトであることを確認できます。", "detail": {"concept": "リクエストの組み立ては「送り先を決める → 器を作る → 中身を詰める」という段階になります。各段階で必要な材料が前の段階の成果物です。", "steps": ["`URL(string:)` … 送り先。ここが nil なら以降は成立しない。", "`URLRequest(url: url)` … URL を持つ器を作る。既定は GET。", "`httpMethod` と `httpBody` を設定する。値型なので var が必要。", "設定結果を読み出して確認する。"], "whyCorrect": "各行が必要とする値が、必ず前の行で用意されています。URLRequest が値型であることから、let で受けると以降の設定がすべてコンパイルエラーになる点も順序と同じくらい重要です。", "commonMistakes": ["`let request = URLRequest(url: url)` としてしまい、'Cannot assign to property' で悩む間違いです。値型なので var が必要です。", "本文を設定してからメソッドを GET のままにする間違いです。設定の順序自体は自由ですが、メソッドの設定漏れはサーバ側で気づくことになります。"], "takeaway": "URL → URLRequest → プロパティ設定。URLRequest は値型なので var で持つ。", "example": {"code": "import Foundation\nlet url = URL(string: \"https://example.com/items\")!\nvar request = URLRequest(url: url)\nrequest.httpMethod = \"POST\"\nrequest.httpBody = Data(#\"{\"name\":\"a\"}\"#.utf8)\nprint(request.httpMethod ?? \"-\", request.httpBody?.count ?? 0, request.url?.path ?? \"-\")", "output": "POST 12 /items", "explanation": "組み立てたリクエストの各要素を、送信前に確認できます。"}}, "seriesId": "foundation-request", "seriesStep": 2}, {"id": "practice-foundation-025", "track": "foundation", "lessonId": "foundation-urlsession", "type": "bugHunt", "difficulty": 4, "title": "レスポンスを強制キャストしている行を見つける", "prompt": "この関数は特定の条件でクラッシュします。原因になっている行を選んでください。", "skills": ["foundation", "debugging", "errors"], "noRunSolution": true, "content": {"lines": [{"id": "l1", "code": "func load(from url: URL) async throws -> [Item] {"}, {"id": "l2", "code": "    let (data, response) = try await URLSession.shared.data(from: url)"}, {"id": "l3", "code": "    print((response as! HTTPURLResponse).statusCode)"}, {"id": "l4", "code": "    return try JSONDecoder().decode([Item].self, from: data)"}, {"id": "l5", "code": "}"}]}, "solution": {"optionId": "l3", "fixedCode": "func load(from url: URL) async throws -> [Item] {\n    let (data, response) = try await URLSession.shared.data(from: url)\n    guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {\n        throw URLError(.badServerResponse)\n    }\n    return try JSONDecoder().decode([Item].self, from: data)\n}"}, "hints": ["URLResponse は必ず HTTPURLResponse だと言い切れるでしょうか。", "file:// のようなHTTP以外のURLを渡された場合、レスポンスは HTTPURLResponse ではありません。", "失敗しうる変換に `as!` を使っている行が、その場合にプロセスを止めます。"], "explanation": "バグは3行目です。`URLSession.shared.data(from:)` が返す response の型は URLResponse であり、HTTP通信のときだけ HTTPURLResponse になります。file:// スキームのURLなどを渡されると HTTPURLResponse ではないため、`as!` による強制キャストが失敗して 'Could not cast value' でプロセスが停止します。挙動としては、HTTPのURLでテストしている限り再現せず、想定外のURLが来たときにだけクラッシュします。修正は `as?` による条件付きキャストにし、さらにステータスコードの検査も同じ guard にまとめてエラーを throw することです。こうすると呼び出し側がエラーとして扱えます。", "detail": {"concept": "ネットワーク層は外部からの入力が最も多い場所です。「必ずこうなるはず」という前提を `as!` や `!` で書くと、想定外の入力がそのままクラッシュになります。", "steps": ["`data(from:)` の戻り値の型は (Data, URLResponse)。", "HTTPURLResponse はその具体型のひとつに過ぎない。", "非HTTPのURLでは別の型が返り、`as!` が失敗する。", "`as?` + guard にすると、失敗をエラーとして扱えるようになる。"], "whyCorrect": "クラッシュするのは強制キャストを書いた3行目です。2行目の通信も4行目のデコードも throws なので、失敗しても呼び出し側に伝わるだけで停止しません。", "commonMistakes": ["ステータスコードを表示するだけで検査していない実装も問題です。404 のエラーページをそのままデコードしようとして、分かりにくいデコードエラーになります。", "`as?` に変えただけで検査を省くと、異常なレスポンスをそのまま処理してしまいます。キャストと検査はセットで行います。"], "takeaway": "レスポンスは URLResponse。HTTPURLResponse への変換は as? + ステータス検査。", "example": {"code": "import Foundation\nfunc check(_ response: URLResponse) throws -> Int {\n    guard let http = response as? HTTPURLResponse else { throw URLError(.badServerResponse) }\n    guard (200..<300).contains(http.statusCode) else { throw URLError(.badServerResponse) }\n    return http.statusCode\n}\nlet ok = HTTPURLResponse(url: URL(string: \"https://example.com\")!, statusCode: 200, httpVersion: nil, headerFields: nil)!\nprint(try check(ok))", "output": "200", "explanation": "キャストとステータス検査を1か所にまとめると、呼び出し側は成功したステータスだけを受け取れます。"}}, "seriesId": "foundation-network-safety", "seriesStep": 1}, {"id": "practice-foundation-026", "track": "foundation", "lessonId": "foundation-urlsession", "type": "repair", "difficulty": 4, "title": "エラー応答を見逃す通信処理を直す", "prompt": "404 が返ってきてもエラーページの本文をそのまま返してしまいます。関数の中に追加する処理として最も適切なものを選んでください。", "skills": ["foundation", "errors", "debugging"], "content": {"code": "import Foundation\nfunc load(from url: URL) async throws -> Data {\n    let (data, _) = try await URLSession.shared.data(from: url)\n    return data\n}", "options": [{"id": "o1", "code": "guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {\n    throw URLError(.badServerResponse)\n}"}, {"id": "o2", "code": "guard !data.isEmpty else { throw URLError(.zeroByteResource) }"}, {"id": "o3", "code": "guard url.scheme == \"https\" else { throw URLError(.badURL) }"}, {"id": "o4", "code": "try await Task.sleep(nanoseconds: 1_000_000_000)"}]}, "solution": {"optionId": "o1", "fixedCode": "import Foundation\nfunc load(from url: URL) async throws -> Data {\n    let (data, response) = try await URLSession.shared.data(from: url)\n    guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {\n        throw URLError(.badServerResponse)\n    }\n    return data\n}"}, "hints": ["URLSession は 404 を「通信の失敗」とは見なしません。通信自体は成功しているためです。", "成功か失敗かを判断する情報は、捨てているほうの戻り値に入っています。", "レスポンスを受け取り、ステータスコードが成功の範囲かどうかを確認する必要があります。"], "explanation": "バグは、レスポンスを `_` で捨てていることです。URLSession は 404 や 500 でもエラーを投げません（サーバから応答が返ってきた時点で通信としては成功しているため）。そのためエラーページのHTMLがそのまま Data として返り、呼び出し側でデコードに失敗して「JSONが壊れている」という誤った診断につながります。修正は response を受け取り、HTTPURLResponse にキャストしたうえでステータスコードが 200番台かを確認し、そうでなければ throw することです。本文が空かどうかの検査（o2）はエラーページに本文があるため無意味で、スキームの検査（o3）やスリープ（o4）は問題と無関係です。", "detail": {"concept":
