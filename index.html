ait は中断されうる地点。スレッド生成ではない。"}}, {"id": "q-concurrency-010", "difficulty": "Basic", "prompt": "async throwsの呼び出しは？", "code": "func load() async throws -> Data", "choices": ["try await load()", "await?だけ", "weak load()", "load!()"], "answer": 0, "explanation": "throwとasyncの両方を扱う。", "detail": {"concept": "`async throws` は「非同期であり、かつ失敗しうる」関数です。呼ぶ側は両方の性質を明示する必要があり、`try await` と 2 つ並べて書きます。順序は try が先、await が後です。", "whyCorrect": "await が中断されうる地点、try が失敗しうる呼び出しを示します。両方の性質があるため、両方を書きます。", "otherChoices": [{"choice": "await?だけ", "reason": "エラーを扱う指定が抜けています。throws である以上 try が必要です。また `await?` という記法はありません。"}, {"choice": "weak load()", "reason": "weak はメモリ管理の指定で、関数呼び出しには使いません。"}, {"choice": "load!()", "reason": "`!` は Optional の強制アンラップなどに使う記号で、非同期やエラーの扱いとは無関係です。"}], "takeaway": "`async throws` の呼び出しは `try await`。"}}]}, {"id": "concurrency-async-let", "level": "Intermediate", "title": "async let・Structured Concurrency", "summary": "独立した複数処理を並行に進め、親子Task構造を保つ。", "mental": "独立して待てる処理は同時開始し最後にまとめてawaitできる。", "points": ["async letでchild task開始。", "親scopeとchild lifetimeが結び付く。", "latencyを重ねられる。", "依存処理を無理に並行化しない。"], "code": "async let user=api.fetchUser()\nasync let posts=api.fetchPosts()\nlet result=try await (user,posts)", "why": "複数APIや画像loadで待ち時間を短縮できる。", "pitfall": "同じmutable stateを複数childから変更しない。", "questions": [{"id": "q-concurrency-011", "difficulty": "Intermediate", "prompt": "async letが向くのは？", "code": "async let a=loadA()\nasync let b=loadB()", "choices": ["互いに独立した非同期処理", "順番依存処理", "同期定数だけ", "Auto Layout"], "answer": 0, "explanation": "独立処理を並行開始できる。", "detail": {"concept": "`async let` は非同期処理を「開始だけしておき、結果は後で受け取る」書き方です。2 つ書けば両方が同時に走り始めます。ただし互いの結果に依存する処理には使えません。前の結果を次に使う場合は、素直に `await` で順番に待ちます。", "steps": ["`async let a = loadA()` で loadA が走り始める（ここでは待たない）。", "続けて `async let b = loadB()` も走り始める。", "後で `await a` や `await b` と書いた時点で結果を受け取る。", "2 つが独立しているため、合計時間は「両方の合計」ではなく「遅いほう」に近づく。"], "whyCorrect": "独立した処理を同時に進めることが目的なので、依存関係の無い処理に向いています。", "otherChoices": [{"choice": "順番依存処理", "reason": "前の結果を次で使う処理は同時に始められません。順番に await します。"}, {"choice": "同期定数だけ", "reason": "同期的な定数の計算に非同期の仕組みは不要です。"}, {"choice": "Auto Layout", "reason": "画面のレイアウトとは無関係です。"}], "example": {"code": "func load(_ name: String) async -> String { name }\n\nasync let first = load(\"A\")\nasync let second = load(\"B\")\nlet results = await [first, second]\nprint(results)", "output": "[\"A\", \"B\"]", "explanation": "2 つの処理は同時に開始され、await した時点で結果を受け取ります。受け取る順番はこちらが決めるため、結果の並びは安定します。"}, "takeaway": "async let は独立した処理を同時に開始する。"}}, {"id": "q-concurrency-012", "difficulty": "Intermediate", "prompt": "Structured Concurrencyの利点は？", "code": "withTaskGroup{...}", "choices": ["Task lifetimeが親子構造で管理", "Taskが永久に残る", "ARC不要", "HTTP不要"], "answer": 0, "explanation": "child taskがscopeに構造化される。", "detail": {"concept": "Structured Concurrency は、非同期処理を親子関係のある構造として管理する考え方です。親のスコープを抜けるときには、その中で始めた子の処理がすべて完了（またはキャンセル）していることが保証されます。処理が迷子になって残り続けることを防げます。", "whyCorrect": "スコープと寿命が対応するため、「どこで始まり、どこで終わるか」がコードの形から読み取れます。エラーやキャンセルも親子をたどって伝わります。", "otherChoices": [{"choice": "Taskが永久に残る", "reason": "むしろ逆で、スコープを抜けるときに残らないことが保証されます。構造の外で独立して走らせたい場合は非構造の Task を使います。"}, {"choice": "ARC不要", "reason": "メモリ管理の仕組みは引き続き必要です。"}, {"choice": "HTTP不要", "reason": "通信の有無とは無関係です。"}], "takeaway": "子タスクの寿命が親のスコープに収まる。"}}]}, {"id": "concurrency-task-cancel", "level": "Intermediate", "title": "Task・Priority・Cancellation", "summary": "Taskを開始し、キャンセル可能な処理として扱う。", "mental": "Cancellationは強制停止ではなく『もう結果が不要』という協調的signal。", "points": ["Task{}で新task。", "Task.isCancelled / checkCancellation()。", "一部async APIはcancelをthrow。", "画面消失時など不要処理をcancel。"], "code": "let task=Task{\n try Task.checkCancellation()\n return try await load()\n}\ntask.cancel()", "why": "検索、画像load、画面遷移で古いrequestを捨てる時に重要。", "pitfall": "cancel()で任意codeが即停止するわけではない。", "questions": [{"id": "q-concurrency-013", "difficulty": "Intermediate", "prompt": "Task cancellationの性質は？", "code": "task.cancel()", "choices": ["協調的signal", "任意命令を即強制終了", "app終了", "thread kill保証"], "answer": 0, "explanation": "処理側が確認/反応する。", "detail": {"concept": "`task.cancel()` は「もうこの処理は不要になった」という合図を立てるだけで、実行中の処理を強制的に止めるものではありません。処理側が `Task.isCancelled` を確認したり `try Task.checkCancellation()` を呼んだりして、自分から中断する必要があります。これを協調的キャンセルと呼びます。", "steps": ["cancel() が呼ばれ、そのタスクにキャンセル済みの印が付く。", "実行中の処理はそのまま動き続ける。", "処理側が確認する地点に来たときに初めて中断される。", "確認する箇所が無ければ、最後まで実行されてしまう。"], "whyCorrect": "強制停止だと、途中の状態が壊れたまま放置される危険があります。処理側が安全な地点で自ら止まる設計になっています。", "otherChoices": [{"choice": "任意命令を即強制終了", "reason": "任意の地点で強制的に打ち切ることはできません。確認する箇所が無ければ止まりません。"}, {"choice": "app終了", "reason": "アプリ全体が終了することはありません。対象のタスクだけの話です。"}, {"choice": "thread kill保証", "reason": "スレッドを強制終了する保証はありません。そもそもタスクとスレッドは 1 対 1 ではありません。"}], "takeaway": "cancel は「お願い」。処理側が確認しないと止まらない。"}}, {"id": "q-concurrency-014", "difficulty": "Intermediate", "prompt": "cancelをthrowとして確認するAPIは？", "code": "try Task.checkCancellation()", "choices": ["CancellationErrorをthrow可能", "Boolだけ", "UIを閉じる", "Git reset"], "answer": 0, "explanation": "cancel済みならErrorをthrowする。", "detail": {"concept": "`try Task.checkCancellation()` は、キャンセル済みなら CancellationError を throw し、そうでなければ何もせずに次へ進むメソッドです。長い処理の途中に挟むことで、キャンセルへの反応点を作れます。", "whyCorrect": "throw によって以降の処理が飛ばされ、呼び出し元まで一気に抜けられます。エラー処理の仕組みにそのまま乗るため、後始末も do-catch や defer で書けます。", "otherChoices": [{"choice": "Boolだけ", "reason": "真偽値だけを見たい場合は `Task.isCancelled` を使います。checkCancellation は throw する点が異なります。"}, {"choice": "UIを閉じる", "reason": "画面操作とは無関係です。"}, {"choice": "Git reset", "reason": "バージョン管理の操作とは無関係です。"}], "takeaway": "isCancelled は判定、checkCancellation は throw。"}}]}, {"id": "concurrency-taskgroup", "level": "Intermediate", "title": "TaskGroup", "summary": "動的な数のchild taskを並行実行し、結果を集約する。", "mental": "async letが固定個数ならTaskGroupは実行時に増減する仕事の集合。", "points": ["withTaskGroup / withThrowingTaskGroup。", "group.addTaskで追加。", "結果は完了順に取得され得る。", "親scopeでchild終了を管理。"], "code": "let values=await withTaskGroup(of:Int.self){group in\n for n in 1...3{group.addTask{n*2}}\n return await group.reduce(into:[]){$0.append($1)}\n}", "why": "複数画像や複数endpointなど動的並行処理に使う。", "pitfall": "入力順と完了順は一致しないことがある。", "questions": [{"id": "q-concurrency-015", "difficulty": "Intermediate", "prompt": "TaskGroup結果順について正しいのは？", "code": "for await value in group { }", "choices": ["完了順になり得る", "必ず追加順", "必ず逆順", "取得不可"], "answer": 0, "explanation": "taskは並行実行される。", "detail": {"concept": "TaskGroup に追加した子タスクは同時に走るため、終わる順番は処理内容や実行環境によって変わります。`for await value in group` で受け取れるのは、追加した順ではなく完了した順です。", "whyCorrect": "並行に走る以上、どれが先に終わるかは保証できません。順序が重要なら、結果に索引や識別子を持たせて後から並べ替えるか、Dictionary に集めます。", "otherChoices": [{"choice": "必ず追加順", "reason": "追加順は保証されません。速く終わったものから届きます。"}, {"choice": "必ず逆順", "reason": "逆順になる保証もありません。順序は不定です。"}, {"choice": "取得不可", "reason": "結果は受け取れます。順序が保証されないだけです。"}], "takeaway": "TaskGroup の結果は完了順。順序が要るなら自分で並べ替える。"}}, {"id": "q-concurrency-016", "difficulty": "Intermediate", "prompt": "TaskGroupが向くのは？", "code": "for url in urls{group.addTask{...}}", "choices": ["動的個数の並行task", "1個の同期計算だけ", "Auto Layout", "ARC解放"], "answer": 0, "explanation": "runtimeで数が決まる並行処理。", "detail": {"concept": "`async let` は書いた数だけ処理を開始する固定的な書き方です。対して TaskGroup は、実行時に決まる個数の処理をループで追加できます。URL の配列を受け取って全件取得する、といった場面に向いています。", "whyCorrect": "個数が実行時にしか分からない場合、`async let` では書き表せません。TaskGroup なら addTask をループで呼べます。", "otherChoices": [{"choice": "1個の同期計算だけ", "reason": "1 つの同期的な計算に並行処理の仕組みは不要です。そのまま書くほうが単純です。"}, {"choice": "Auto Layout", "reason": "画面のレイアウトとは無関係です。"}, {"choice": "ARC解放", "reason": "メモリの解放処理とは無関係です。"}], "takeaway": "個数が固定なら async let、可変なら TaskGroup。"}}]}, {"id": "concurrency-actor", "level": "Intermediate", "title": "Actor・Isolation", "summary": "共有mutable stateをactor isolationで保護する。", "mental": "actorは『この状態を触る入口を1列にする』イメージ。", "points": ["actorは参照型だがstate accessが制御される。", "外部からawaitが必要な場合。", "data raceを防ぐ。", "await中のreentrancyに注意。"], "code": "actor Counter{\n private var value=0\n func increment(){value+=1}\n func current()->Int{value}\n}", "why": "cache、共有service、並行更新で重要。", "pitfall": "actor内の処理全体がtransactionになるわけではない。", "questions": [{"id": "q-concurrency-017", "difficulty": "Intermediate", "prompt": "actorの主目的は？", "code": "actor Store{var items:[Item]=[]}", "choices": ["共有mutable stateをisolationで保護", "UI描画", "JSON encode", "class継承"], "answer": 0, "explanation": "並行accessから内部stateを隔離する。", "detail": {"concept": "複数の処理が同時に同じ可変データを読み書きすると、結果が壊れることがあります（データ競合）。actor は自分が持つ状態への出入り口を 1 つに絞り、同時に 1 つの処理しか中へ入れないようにします。この仕組みを isolation（隔離）と呼びます。", "whyCorrect": "ロックを自分で書く代わりに、型の性質として安全性を確保できます。内部の状態は外から直接触れず、必ず actor のメソッド経由になります。", "otherChoices": [{"choice": "UI描画", "reason": "画面描画そのものを担う型ではありません。UI に関わるのは MainActor という特定の actor です。"}, {"choice": "JSON encode", "reason": "データ変換は Codable の役割です。"}, {"choice": "class継承", "reason": "actor は継承のための仕組みではありません。"}], "example": {"code": "actor Counter {\n    private var value = 0\n    func increment() { value += 1 }\n    func current() -> Int { value }\n}\n\nlet counter = Counter()\nawait counter.increment()\nawait counter.increment()\nprint(await counter.current())", "output": "2", "explanation": "value は actor の外から直接触れません。increment も current も actor の中で 1 つずつ実行されるため、同時に呼ばれても値が壊れません。"}, "takeaway": "actor は可変状態への同時アクセスを 1 つに絞る。"}}, {"id": "q-concurrency-018", "difficulty": "Intermediate", "prompt": "actor外からisolated methodを呼ぶ時一般に必要なのは？", "code": "let v=/* ? */ counter.current()", "choices": ["await", "weak", "override", "mutating"], "answer": 0, "explanation": "actor境界を越えるためawaitが必要な場合が多い。", "detail": {"concept": "actor の外からそのメソッドを呼ぶときは、actor の中に入る順番を待つ可能性があります。待ちが発生しうる以上、呼び出しは中断されうる地点になるため await が必要です。actor の内部から自分のメソッドを呼ぶ場合は、すでに中にいるので await は不要です。", "whyCorrect": "境界を越える呼び出しは待つ可能性があるからです。await が付くことで、読み手にも「ここで他の処理に譲る可能性がある」と伝わります。", "otherChoices": [{"choice": "weak", "reason": "weak はメモリ管理の指定で、呼び出しには使いません。"}, {"choice": "override", "reason": "override は継承したメソッドの上書きです。"}, {"choice": "mutating", "reason": "mutating は struct のメソッドが自身を変更する指定です。actor には使いません。"}], "takeaway": "actor の外からの呼び出しには await。"}}]}, {"id": "concurrency-mainactor", "level": "Intermediate", "title": "MainActor・UI Isolation", "summary": "UI関連stateをMainActorへ隔離する考え方を理解する。", "mental": "MainActorはUIに関係する仕事を同じactor境界へまとめる。", "points": ["@MainActorで型/関数/propertyを隔離。", "SwiftUI/UIKitのUI更新と関係。", "重いwork全部をMainActorで行わない。", "MainActor.runを使う場合も。"], "code": "@MainActor\nfinal class ViewModel{\n var title=\"\"\n func update(_ v:String){title=v}\n}", "why": "Swift 6 strict concurrencyでUI state更新errorを理解するために必須。", "pitfall": "MainActorをmain threadという低level概念だけで覚えない。", "questions": [{"id": "q-concurrency-019", "difficulty": "Intermediate", "prompt": "@MainActorの意味は？", "code": "@MainActor final class VM{var state=0}", "choices": ["MainActorへisolate", "new thread固定", "ARC停止", "Optional化"], "answer": 0, "explanation": "MainActor isolationを付ける。", "detail": {"concept": "MainActor は「メインスレッドで実行される」特別な actor です。型やメソッドに `@MainActor` を付けると、その中の処理はメインスレッド上で行われることが保証されます。UI の更新はメインスレッドから行う必要があるため、画面に関わる型でよく使われます。", "whyCorrect": "@MainActor は隔離先を MainActor に指定する印です。付けた型のプロパティやメソッドへは、外部から await 付きでアクセスすることになります。", "otherChoices": [{"choice": "new thread固定", "reason": "新しいスレッドを作る指定ではありません。既存のメインスレッドで動かす指定です。"}, {"choice": "ARC停止", "reason": "メモリ管理は通常どおり働きます。"}, {"choice": "Optional化", "reason": "値の有無を表す Optional とは無関係です。"}], "takeaway": "@MainActor はメインスレッドでの実行を保証する。"}}, {"id": "q-concurrency-020", "difficulty": "Intermediate", "prompt": "重いCPU処理をMainActorで行う問題は？", "code": "@MainActor func heavy(){...}", "choices": ["UI responsiveness悪化", "必ず高速化", "通信暗号化", "問題なし"], "answer": 0, "explanation": "MainActorを長時間占有する。", "detail": {"concept": "メインスレッドは画面の描画とユーザー操作の受け付けを担当します。ここで時間のかかる計算を行うと、その間は描画も入力処理も進まず、画面が固まったように見えます。重い処理は MainActor の外へ出し、結果を受け取るときだけメインに戻すのが基本です。", "whyCorrect": "MainActor を長時間占有すると、UI の応答性が損なわれます。計算そのものが速くなるわけでもありません。", "otherChoices": [{"choice": "必ず高速化", "reason": "実行場所を変えても計算量は変わりません。むしろ他の作業を止めてしまいます。"}, {"choice": "通信暗号化", "reason": "通信の保護とは無関係です。"}, {"choice": "問題なし", "reason": "応答性の低下という明確な問題があります。"}], "takeaway": "重い処理をメインで回すと画面が固まる。"}}]}, {"id": "concurrency-sendable", "level": "Intermediate", "title": "Sendable・Strict Concurrency", "summary": "並行境界を越えて安全に渡せる値を型で表す。", "mental": "Sendableは『別のConcurrency contextへ渡しても安全か』の契約。", "points": ["値型は構成要素次第でSendableになりやすい。", "mutable classは設計が難しい。", "@Sendable closureでcapture安全性を検査。", "Swift 6 modeでdata race診断が強化。"], "code": "struct User:Sendable{\n let id:Int\n let name:String\n}", "why": "actor/Task境界のcompiler errorを理解するために必要。", "pitfall": "@unchecked Sendableをerror消し目的で使わない。", "questions": [{"id": "q-concurrency-021", "difficulty": "Intermediate", "prompt": "Sendableが表すものは？", "code": "struct Value:Sendable{}", "choices": ["並行境界を安全に渡せる契約", "JSON保存", "View描画", "Hashable同義"], "answer": 0, "explanation": "Concurrency domain間のtransfer safety。", "detail": {"concept": "Sendable は「この型の値は、並行処理の境界を越えて別の実行文脈へ安全に渡せる」ことを表す契約です。値型で中身もすべて Sendable なら安全に渡せます。可変な状態を持つクラスは、そのままでは安全とは言えません。", "whyCorrect": "コンパイラはこの契約をもとに、危険な受け渡しを警告やエラーとして指摘します。実行してみるまで分からなかったデータ競合を、ビルド時に見つけられるようになります。", "otherChoices": [{"choice": "JSON保存", "reason": "データの保存や変換とは無関係です。それは Codable の役割です。"}, {"choice": "View描画", "reason": "画面表示とは無関係です。"}, {"choice": "Hashable同義", "reason": "Hashable は hash 値と等価比較の契約で、目的がまったく異なります。"}], "takeaway": "Sendable は「並行の境界を越えて渡して安全」の証明。"}}, {"id": "q-concurrency-022", "difficulty": "Intermediate", "prompt": "@unchecked Sendableを慎重にする理由は？", "code": "final class Box:@unchecked Sendable{}", "choices": ["安全性保証を自分で引き受ける", "compile不可", "UIKit専用", "遅い"], "answer": 0, "explanation": "compilerの一部確認を開発者責任で迂回する。", "detail": {"concept": "`@unchecked Sendable` は「コンパイラの検査は通らないが、安全であることは自分が保証する」という宣言です。内部でロックを使って保護しているなど、コンパイラには読み取れない事情があるときに使います。裏を返せば、検査を外した分の責任が開発者側に移ります。", "whyCorrect": "保証が誤っていても、コンパイラは警告してくれません。データ競合は再現しにくく発見が難しいため、安易に付けると原因究明が困難な不具合につながります。", "otherChoices": [{"choice": "compile不可", "reason": "コンパイル自体は通ります。通ってしまうことこそが注意すべき点です。"}, {"choice": "UIKit専用", "reason": "特定の UI フレームワーク専用の仕組みではありません。"}, {"choice": "遅い", "reason": "実行速度が落ちる指定ではありません。"}], "takeaway": "@unchecked は検査の免除。安全性の責任を自分で負う。"}}]}, {"id": "concurrency-continuation", "level": "Intermediate", "title": "Continuation・Callback Bridge", "summary": "completion handler型APIをasync/awaitへ橋渡しする。", "mental": "Continuationは『後でここからasync関数を再開する』ための橋。", "points": ["withCheckedContinuation系。", "resumeは原則1回。", "returning/throwingで結果返却。", "既にasync APIがあるなら無理にwrapしない。"], "code": "func load() async throws -> Data{\n try await withCheckedThrowingContinuation{c in\n  legacyLoad{result in c.resume(with:result)}\n }\n}", "why": "古いUIKit/SDKのcallback APIとmodern Concurrencyをつなぐ。", "pitfall": "resume漏れや複数resumeは重大bug。", "questions": [{"id": "q-concurrency-023", "difficulty": "Intermediate", "prompt": "Continuationの代表用途は？", "code": "withCheckedContinuation{c in ...}", "choices": ["callback APIをasyncへbridge", "Array sort", "Auto Layout", "Codable合成"], "answer": 0, "explanation": "callback形式をasyncへ変換する。", "detail": {"concept": "既存の API には、完了時にクロージャを呼び出す形式（コールバック）のものが数多くあります。Continuation は、そうした API を async/await の形へ橋渡しする仕組みです。`withCheckedContinuation` の中でコールバックを受け取り、`resume` で結果を返すと、呼び出し側は普通の await として書けます。", "whyCorrect": "古い形式の API を、新しい非同期の書き方の中へ自然に取り込めます。呼び出し側のコードをコールバックの入れ子にせずに済みます。", "otherChoices": [{"choice": "Array sort", "reason": "並べ替えとは無関係です。"}, {"choice": "Auto Layout", "reason": "画面のレイアウトとは無関係です。"}, {"choice": "Codable合成", "reason": "データ変換の自動生成とは無関係です。"}], "takeaway": "Continuation はコールバック API を await の形に変換する。"}}, {"id": "q-concurrency-024", "difficulty": "Intermediate", "prompt": "resumeの重要ruleは？", "code": "c.resume(returning:value)", "choices": ["原則ちょうど1回", "何回でも", "呼ばなくてよい", "main thread限定"], "answer": 0, "explanation": "async処理を正しく完了させるため1回resumeする。", "detail": {"concept": "resume は「待っていた処理を再開させる」呼び出しです。再開は 1 回きりの出来事なので、ちょうど 1 回だけ呼ぶ必要があります。1 度も呼ばないと処理が永久に再開されず、2 回以上呼ぶと不正な状態になります。", "steps": ["await している処理が、Continuation を受け取って中断する。", "コールバックが呼ばれたら resume で結果を渡し、処理を再開させる。", "resume を呼ばないと、その処理はいつまでも再開されない。", "2 回呼ぶと、すでに再開済みの処理をもう一度再開しようとして不正になる。"], "whyCorrect": "`withCheckedContinuation` の checked は、この規則の違反を実行時に検出してくれることを意味します。コールバックが複数回呼ばれる API を橋渡しするときは特に注意が必要です。", "otherChoices": [{"choice": "何回でも", "reason": "複数回の呼び出しは規則違反です。checked 版では実行時に検出されます。"}, {"choice": "呼ばなくてよい", "reason": "呼ばなければ再開されず、処理が止まったままになります。"}, {"choice": "main thread限定", "reason": "特定のスレッドからの呼び出しに限定されてはいません。"}], "takeaway": "resume はちょうど 1 回。0 回でも 2 回でも壊れる。"}}]}]}, {"id": "development", "name": "Development Essentials", "subtitle": "実際にアプリを作り、検証し、配布する", "description": "Xcode、SwiftPM、Debug、Logging、Instruments、Testing、DI、Networking設計、SwiftData、Signing、Git、安全性まで実務の基礎を学ぶ。", "lessons": [{"id": "dev-xcode-structure", "level": "Beginner", "title": "Xcode：Project・Target・Scheme・Build Configuration", "summary": "Xcodeの設定単位を区別し、どこを変更しているのか理解する。", "mental": "Projectは入れ物、Targetは製品、Schemeは実行/テストの組み合わせ、ConfigurationはDebug/Release等の設定set。", "points": ["Projectは複数Targetを含められる。", "TargetごとにBundle ID/Build Settings/Capabilities。", "SchemeでRun/Test/Profileを構成。", "Debug/Releaseで設定や最適化を分ける。"], "code": "// Project -> Target -> Build Settings\n// Scheme -> Run / Test / Profile -> Configuration", "why": "Xcode errorの多くは『どのTarget/Schemeか』を理解すると追いやすい。", "pitfall": "ProjectとTargetを混同すると変更が反映されない原因になる。", "questions": [{"id": "q-dev-001", "difficulty": "Beginner", "prompt": "Bundle Identifierを主に持つ単位は？", "code": "Project -> Target -> General", "choices": ["Target", "Git branch", "Function", "Array"], "answer": 0, "explanation": "app Targetごとに製品設定を持つ。", "detail": {"concept": "Xcode の Project は入れ物で、その中の Target が「実際に作られる 1 つの成果物」（アプリ本体、テスト、拡張機能など）を表します。Bundle Identifier は成果物を一意に識別する文字列なので、Target 単位で持ちます。", "whyCorrect": "アプリ本体とテストとウィジェットは別々の成果物なので、それぞれ別の Bundle Identifier を持ちます。設定は Target ごとに管理されます。", "otherChoices": [{"choice": "Git branch", "reason": "ソースコードの履歴を分ける仕組みで、成果物の設定とは無関係です。"}, {"choice": "Function", "reason": "コードの中の処理の単位で、アプリの識別子とは関係ありません。"}, {"choice": "Array", "reason": "値を並べて持つデータ型です。"}], "takeaway": "成果物の単位が Target。識別子は Target ごと。"}}, {"id": "q-dev-002", "difficulty": "Beginner", "prompt": "Schemeが主に決めるものは？", "code": "Run / Test / Profile", "choices": ["どのTarget/Configurationで実行するか", "JSON key", "継承", "HTTP status"], "answer": 0, "explanation": "Run/Test/Profile等のactionを構成する。", "detail": {"concept": "Scheme は「何を、どの設定で、どう動かすか」をまとめた実行手順です。どの Target をビルドするか、Debug と Release のどちらの Build Configuration を使うか、Run / Test / Profile それぞれで何をするかを持ちます。", "whyCorrect": "Target が成果物、Configuration が設定の組、Scheme がその組み合わせと実行方法を束ねる、という役割分担です。", "otherChoices": [{"choice": "JSON key", "reason": "データ形式のキー名で、ビルド設定とは無関係です。"}, {"choice": "継承", "reason": "型どうしの関係であり、ビルドの構成とは別です。"}, {"choice": "HTTP status", "reason": "通信の応答を表す番号です。"}], "takeaway": "Scheme は「どの Target をどの設定で動かすか」の束。"}}]}, {"id": "dev-build-errors", "level": "Beginner", "title": "Compiler Error・Warning・Fix-it", "summary": "error messageを修正指示ではなく、型と文脈の手掛かりとして読む。", "mental": "最初のerrorが原因で後続errorが大量に出ることがある。", "points": ["errorとwarningを区別。", "最初の意味あるerrorから確認。", "expected/found type、scope、access levelを見る。", "Fix-itは意味を理解して適用。"], "code": "let count:Int=\"3\"\n// Cannot convert value of type String to specified type Int", "why": "AIに丸投げせず原因を限定できる基礎。", "pitfall": "error文を読まずにrandom修正しない。", "questions": [{"id": "q-dev-003", "difficulty": "Beginner", "prompt": "大量error時まず見る候補は？", "code": "// 20 errors", "choices": ["最初の根本error", "最後のwarningだけ", "全部無視", "Cleanだけ"], "answer": 0, "explanation": "1つのsyntax/type errorが後続解析を崩す場合がある。", "detail": {"concept": "コンパイラは 1 つの誤りを見つけた後も解析を続けようとするため、根本原因から派生した二次的なエラーが大量に出ることがあります。特に括弧の閉じ忘れや型の食い違いは、以降の解釈をすべて狂わせます。", "whyCorrect": "最初のエラーが根本原因であることが多く、それを直すと後続のエラーがまとめて消えることがよくあります。上から順に、1 つ直しては再ビルドするのが速い進め方です。", "otherChoices": [{"choice": "最後のwarningだけ", "reason": "警告は重要な手がかりになることもありますが、ビルドを止めているのはエラーです。まずエラーを解消します。"}, {"choice": "全部無視", "reason": "エラーを無視するとビルド自体が完了しません。"}, {"choice": "Cleanだけ", "reason": "クリーンビルドが有効な場面もありますが、書いたコード自体の誤りは消えません。"}], "takeaway": "エラーは上から 1 つずつ。根本原因が派生エラーを量産する。"}}, {"id": "q-dev-004", "difficulty": "Beginner", "prompt": "Fix-itの扱いは？", "code": "// Xcode suggests a fix", "choices": ["意味を理解して適用", "必ず全部適用", "絶対使わない", "Git削除"], "answer": 0, "explanation": "候補なので意図を理解して使う。", "detail": {"concept": "Fix-it はコンパイラが提案する修正候補です。多くの場合は妥当ですが、あくまで「型の辻褄を合わせる」提案であり、書き手の意図まで理解しているわけではありません。", "whyCorrect": "たとえば Optional の扱いで `!` を付ける提案が出ることがありますが、それは型を通すだけで、nil のときに停止する危険は残ります。提案の意味を理解してから適用します。", "otherChoices": [{"choice": "必ず全部適用", "reason": "無条件に適用すると、意図と違う修正が入り、別の不具合の原因になります。"}, {"choice": "絶対使わない", "reason": "有用な提案も多いため、使わないと決める必要はありません。"}, {"choice": "Git削除", "reason": "バージョン管理の操作とは無関係です。"}], "takeaway": "Fix-it は提案。意味を理解してから適用する。"}}]}, {"id": "dev-modules-files", "level": "Basic", "title": "Module・import・File Organization", "summary": "Swift codeの可視性とFile/Module境界を理解する。", "mental": "Fileは整理単位、Moduleはcompile/import境界。", "points": ["importで他Moduleの公開API利用。", "同一Target内は通常同一Module。", "型/責務ごとにFile分割。", "Access ControlはModule境界と関係。"], "code": "import Foundation\nimport SwiftUI", "why": "Package分割やtest Targetで『見える/見えない』を理解できる。", "pitfall": "Fileを分けただけでは別Moduleにならない。", "questions": [{"id": "q-dev-005", "difficulty": "Basic", "prompt": "同一app Target内のSwift Fileは通常？", "code": "// App target", "choices": ["同じModule", "必ず別Module", "同じclass", "Git submodule"], "answer": 0, "explanation": "通常Targetがcompile module単位。", "detail": {"concept": "Module はコンパイルとアクセス制御の単位です。通常は 1 つの Target が 1 つの Module になり、その中の Swift ファイルどうしは import なしで互いを参照できます（既定の internal で見えるため）。", "whyCorrect": "同じ Target のファイルは同じ Module に属するため、他のファイルで定義した型をそのまま使えます。別 Module のものを使うときだけ import が必要です。", "otherChoices": [{"choice": "必ず別Module", "reason": "ファイルごとに Module が分かれることはありません。"}, {"choice": "同じclass", "reason": "ファイルと型は別の概念です。1 ファイルに複数の型を書けます。"}, {"choice": "Git submodule", "reason": "バージョン管理上の仕組みで、コンパイル単位とは別です。"}], "takeaway": "通常は Target = Module。同じ Module 内は import 不要。"}}, {"id": "q-dev-006", "difficulty": "Basic", "prompt": "importの目的は？", "code": "import Foundation", "choices": ["他Moduleの公開APIを利用", "Git commit", "DB migration", "UI layout"], "answer": 0, "explanation": "Moduleの公開宣言を使えるようにする。", "detail": {"concept": "import は「別の Module が公開している API を、このファイルから使えるようにする」宣言です。公開されていない（internal 以下の）宣言は import しても見えません。", "whyCorrect": "Foundation や SwiftUI のような外部 Module の機能を使うには import が必要です。逆に言えば、import 行を見ればそのファイルが何に依存しているかが分かります。", "otherChoices": [{"choice": "Git commit", "reason": "バージョン管理の操作とは無関係です。"}, {"choice": "DB migration", "reason": "データベースの構造変更とは無関係です。"}, {"choice": "UI layout", "reason": "画面配置とは無関係です。"}], "takeaway": "import は他 Module の公開 API を使うための宣言。"}}]}, {"id": "dev-spm", "level": "Basic", "title": "Swift Package Manager・Package.swift", "summary": "外部依存と自作ModuleをPackageとして管理する。", "mental": "Packageはcodeを再利用可能なModuleとして切り出し、依存を明示する仕組み。", "points": ["Package.swiftにproduct/target/dependency。", "Library/Executable等product。", "Target間依存を明示。", "XcodeからPackage Dependency追加可能。"], "code": "// Package.swift\nlet package = Package(\n name:\"CoreKit\",\n products:[.library(name:\"CoreKit\",targets:[\"CoreKit\"])],\n targets:[.target(name:\"CoreKit\"),.testTarget(name:\"CoreKitTests\",dependencies:[\"CoreKit\"])]\n)", "why": "library導入、自作共通層、test可能なModule分割で必須。", "pitfall": "依存を増やしすぎると更新/security/build costが増える。", "questions": [{"id": "q-dev-007", "difficulty": "Basic", "prompt": "SwiftPM manifestは？", "code": "// package definition", "choices": ["Package.swift", "Podfileだけ", "Info.plist", "README"], "answer": 0, "explanation": "Package.swiftでpackage構成を定義。", "detail": {"concept": "Swift Package Manager では、パッケージの構成を Package.swift というファイルに Swift のコードとして書きます。名前、対応プラットフォーム、依存パッケージ、Target の構成などをここで宣言します。", "whyCorrect": "設定ファイルが Swift コードなので、型チェックが効き、補完も使えます。この 1 ファイルがパッケージの定義そのものです。", "otherChoices": [{"choice": "Podfileだけ", "reason": "別の依存管理ツールで使う設定ファイルです。SwiftPM の manifest ではありません。"}, {"choice": "Info.plist", "reason": "アプリの実行時設定を書くファイルで、パッケージ構成の定義ではありません。"}, {"choice": "README", "reason": "人向けの説明文書であり、ビルドには使われません。"}], "takeaway": "SwiftPM の設定は Package.swift。"}}, {"id": "q-dev-008", "difficulty": "Basic", "prompt": "testTargetのdependency例は？", "code": ".testTarget(name:\"CoreTests\",dependencies:[\"Core\"])", "choices": ["test対象Target", "Git remote", "Simulator", "Bundle IDだけ"], "answer": 0, "explanation": "test対象moduleをdependencyにする。", "detail": {"concept": "テスト用の Target は、検証したいコードを import して使う必要があります。そのため Package.swift の testTarget では、テスト対象の Target を dependencies に指定します。", "whyCorrect": "依存として宣言することで、テストコードから対象 Module の公開 API を呼べるようになります。宣言しなければ import できません。", "otherChoices": [{"choice": "Git remote", "reason": "コードの置き場所の話であり、ビルド時の依存関係ではありません。"}, {"choice": "Simulator", "reason": "実行環境であって、ビルドの依存対象ではありません。"}, {"choice": "Bundle IDだけ", "reason": "成果物の識別子であり、依存関係の指定ではありません。"}], "takeaway": "testTarget はテスト対象 Target に依存させる。"}}]}, {"id": "dev-dependencies", "level": "Intermediate", "title": "Dependency Version・Lock・Supply Chain", "summary": "外部Packageを安全に導入・更新する考え方を学ぶ。", "mental": "依存追加は、その更新・脆弱性・互換性も引き受けること。", "points": ["version requirementを理解。", "Package.resolvedで解決versionを再現。", "repository/maintainer/licenseを確認。", "必要性が低い依存を増やさない。"], "code": "// Review repository, version rule, license, maintenance", "why": "実務ではlibrary選定自体が設計判断。", "pitfall": "人気だけで安全とは限らない。", "questions": [{"id": "q-dev-009", "difficulty": "Intermediate", "prompt": "Package.resolvedの主目的は？", "code": "Package.resolved", "choices": ["依存versionの再現性", "UI色", "Keychain保存", "HTTP body"], "answer": 0, "explanation": "解決versionを記録する。", "detail": {"concept": "Package.swift には「1.2.0 以上」のような範囲で依存を書くことが多いため、解決される実際のバージョンは時期によって変わり得ます。Package.resolved は、実際に選ばれたバージョンを記録しておくファイルです。", "whyCorrect": "これをリポジトリに含めておくと、他の開発者や CI がまったく同じバージョンでビルドできます。「自分の環境では動く」という食い違いを防げます。", "otherChoices": [{"choice": "UI色", "reason": "見た目の設定とは無関係です。"}, {"choice": "Keychain保存", "reason": "資格情報の保存とは無関係です。"}, {"choice": "HTTP body", "reason": "通信内容とは無関係です。"}], "takeaway": "Package.resolved は解決済みバージョンの記録＝再現性。"}}, {"id": "q-dev-010", "difficulty": "Intermediate", "prompt": "外部Package導入時に見るべきものは？", "code": "// dependency review", "choices": ["必要性・更新状況・license・security", "星数だけ", "README色", "作者icon"], "answer": 0, "explanation": "保守/security costも評価する。", "detail": {"concept": "外部パッケージの導入は、機能を得る代わりに保守の負担とリスクも引き受ける決定です。更新が止まっていないか、ライセンスが自分の用途に合うか、脆弱性への対応があるか、そもそも自分で書けない規模かを検討します。", "whyCorrect": "依存は増えるほど、ビルド時間・アップデート追従・セキュリティ対応の負担が増えます。人気だけでは判断材料になりません。", "otherChoices": [{"choice": "星数だけ", "reason": "人気の指標にはなりますが、更新状況やライセンス適合を保証しません。"}, {"choice": "README色", "reason": "見た目は品質と無関係です。"}, {"choice": "作者icon", "reason": "作者の見た目は判断材料になりません。"}], "takeaway": "依存は資産でなく負債にもなる。必要性・保守・ライセンス・安全性で判断。"}}]}, {"id": "dev-debugger", "level": "Basic", "title": "Breakpoint・LLDB・Step実行", "summary": "実行中の状態を止めて観察し、原因を推測ではなく確認する。", "mental": "Debuggerは『その瞬間の真実を見る』道具。", "points": ["breakpointで停止。", "step over/into/out。", "Variables Viewで値確認。", "LLDBのpo/pで式評価。"], "code": "// Breakpoint\n// po user\n// p count", "why": "bug解析をprintだけに依存しないための基本。", "pitfall": "breakpointを置く前に何の仮説を確認するか考える。", "questions": [{"id": "q-dev-011", "difficulty": "Basic", "prompt": "Step Intoの意味は？", "code": "someFunction()", "choices": ["関数内部へ入る", "次行だけ", "app終了", "Git push"], "answer": 0, "explanation": "呼び出し先内部へ進む。", "detail": {"concept": "デバッガの実行制御には、Step Over（現在の行を実行して次の行へ）、Step Into（その行で呼んでいる関数の中へ入る）、Step Out（今の関数を抜けるまで進む）があります。", "whyCorrect": "Step Into は呼び出し先の内部で何が起きているかを追うための操作です。原因が自分の書いた関数の中にあるときに使います。", "otherChoices": [{"choice": "次行だけ", "reason": "現在の行を実行して次の行へ進むのは Step Over です。呼び出し先の中には入りません。"}, {"choice": "app終了", "reason": "実行を終了する操作ではありません。"}, {"choice": "Git push", "reason": "バージョン管理の操作とは無関係です。"}], "takeaway": "Step Into は呼び出し先の内部へ。Step Over は入らない。"}}, {"id": "q-dev-012", "difficulty": "Basic", "prompt": "LLDBのpoでよくすることは？", "code": "po object", "choices": ["object情報を表示", "package更新", "署名", "Auto Layout"], "answer": 0, "explanation": "停止中の値を確認する。", "detail": {"concept": "LLDB はデバッガで、ブレークポイントで停止しているときにコマンドを打てます。`po`（print object）は式を評価して、その値の説明を表示します。停止している時点の実際の値を確認できます。", "whyCorrect": "print を仕込んで再ビルドしなくても、止まっている場所で値を調べられます。仮説の検証を素早く回せます。", "otherChoices": [{"choice": "package更新", "reason": "依存パッケージの更新はビルド設定側の操作です。"}, {"choice": "署名", "reason": "配布のための署名とは無関係です。"}, {"choice": "Auto Layout", "reason": "画面配置の調整とは無関係です。"}], "takeaway": "po は停止中の値を確認するコマンド。"}}]}, {"id": "dev-logging", "level": "Basic", "title": "Logger・OSLog・Debug Print", "summary": "診断情報を適切なlevelとprivacyで記録する。", "mental": "Logは後で何が起きたか再現する観測点。", "points": ["Loggerでcategory/subsystem。", "debug/info/notice/error/fault等。", "secret/個人情報をlogしない。", "productionで必要な観測点を設計。"], "code": "import OSLog\nlet logger=Logger(subsystem:\"com.example.app\",category:\"network\")\nlogger.info(\"Request completed\")", "why": "実機だけの問題や非同期bug解析に役立つ。", "pitfall": "token/password/個人情報をlogしない。", "questions": [{"id": "q-dev-013", "difficulty": "Basic", "prompt": "Loggerのcategoryを分ける利点は？", "code": "Logger(subsystem:\"...\",category:\"network\")", "choices": ["機能別に検索しやすい", "必ず高速", "ARC制御", "JSON encode"], "answer": 0, "explanation": "network/database等で分類できる。", "detail": {"concept": "Logger は subsystem（どのアプリ・コンポーネントか）と category（どの機能か）でログを分類できます。分類しておくと、大量のログの中から目的の領域だけを絞り込めます。", "whyCorrect": "network、database、ui のように category を分けておくと、不具合の調査時に該当領域のログだけを追えます。print と違い、後から絞り込める点が実務では効きます。", "otherChoices": [{"choice": "必ず高速", "reason": "分類は検索性のためであり、実行速度のためではありません。"}, {"choice": "ARC制御", "reason": "メモリ管理とは無関係です。"}, {"choice": "JSON encode", "reason": "データ変換とは無関係です。"}], "takeaway": "category はログを後から絞り込むための分類。"}}, {"id": "q-dev-014", "difficulty": "Basic", "prompt": "logへ出してはいけない代表例は？", "code": "logger.debug(\"token=...\")", "choices": ["認証token/password", "処理開始", "error種別", "件数"], "answer": 0, "explanation": "秘密情報漏洩につながる。", "detail": {"concept": "ログは端末に残り、クラッシュレポートや解析基盤へ送られることもあります。開発中に見たい情報と、外部に出てはいけない情報は区別する必要があります。認証情報や個人情報はログに残すべきではありません。", "whyCorrect": "トークンやパスワードがログに出ると、端末を調べられた場合やレポート経由で漏れる可能性があります。開発者向けのログと、利用者に見せるエラーメッセージも別物として設計します。利用者には次の行動が分かる表現を、開発者向けには原因究明に必要な情報を残します。", "otherChoices": [{"choice": "処理開始", "reason": "処理の開始・終了は流れを追うのに有用で、秘密情報ではありません。"}, {"choice": "error種別", "reason": "エラーの種類は原因究明に必要な情報です。"}, {"choice": "件数", "reason": "件数のような統計値は通常問題ありません。"}], "takeaway": "資格情報はログに出さない。開発用ログと利用者向け表示は別物。"}}]}, {"id": "dev-instruments", "level": "Intermediate", "title": "Instruments・Memory Graph・Sanitizer", "summary": "性能・memory・競合を専用toolで測定する。", "mental": "『遅い気がする』ではなく、計測してbottleneckを特定する。", "points": ["Time ProfilerでCPU。", "Allocations/Leaksでmemory。", "Memory Graphで参照循環。", "Thread Sanitizerでdata race検出を支援。"], "code": "// Product > Profile\n// Time Profiler / Allocations / Leaks / Memory Graph", "why": "中級以降は実行特性を測れることが重要。", "pitfall": "最適化前に計測する。", "questions": [{"id": "q-dev-015", "difficulty": "Intermediate", "prompt": "CPU bottleneck調査の代表toolは？", "code": "Instruments", "choices": ["Time Profiler", "Calendar", "JSONDecoder", "Git blame"], "answer": 0, "explanation": "CPU時間を分析する。", "detail": {"concept": "Instruments は実行中のアプリを計測するツール群です。Time Profiler は一定間隔で実行中の位置を記録し、どの関数に CPU 時間が集中しているかを示します。推測ではなく計測で原因を特定するための道具です。", "whyCorrect": "「遅い気がする」ではなく、実際に時間を使っている箇所を数値で確認できます。最適化はここで根拠を得てから行います。", "otherChoices": [{"choice": "Calendar", "reason": "暦の計算を扱う型で、計測ツールではありません。"}, {"choice": "JSONDecoder", "reason": "データ変換を行う型です。"}, {"choice": "Git blame", "reason": "行ごとの変更履歴を見るコマンドで、実行時の性能は分かりません。"}], "takeaway": "遅さの原因は Time Profiler で計測してから直す。"}}, {"id": "q-dev-016", "difficulty": "Intermediate", "prompt": "参照循環確認に役立つのは？", "code": "Debug Memory Graph", "choices": ["Memory Graph", "URLComponents", "Package.resolved", "FormatStyle"], "answer": 0, "explanation": "object graphを可視化する。", "detail": {"concept": "Memory Graph Debugger は、その時点で存在しているオブジェクトと、それらの参照関係を図として表示します。解放されるはずのオブジェクトが残っている場合、どこから参照されているかを辿れます。", "whyCorrect": "強参照循環はコードを読むだけでは見つけにくいため、実際の参照関係を可視化して確認します。", "otherChoices": [{"choice": "URLComponents", "reason": "URL を組み立てる型で、メモリの調査には使えません。"}, {"choice": "Package.resolved", "reason": "依存バージョンの記録ファイルです。"}, {"choice": "FormatStyle", "reason": "表示用の整形を行う仕組みです。"}], "takeaway": "参照循環の調査は Memory Graph。"}}]}, {"id": "dev-swift-testing", "level": "Basic", "title": "Swift Testing：@Test・#expect・#require", "summary": "Swift Testingで小さな単体testを書く。", "mental": "testは入力と期待結果を実行可能な仕様にする。", "points": ["@Testでtest function。", "#expectで期待条件。", "#requireで後続に必要な前提。", "async/throwsと自然に統合。"], "code": "import Testing\n@Test func totalPrice(){\n #expect(total(price:500,count:3) == 1500)\n}", "why": "refactor、安全なAI開発、regression防止の基礎。", "pitfall": "内部実装の細部だけをtestすると変更に弱い。", "questions": [{"id": "q-dev-017", "difficulty": "Basic", "prompt": "Swift Testingの期待Macroは？", "code": "#expect(value == 3)", "choices": ["#expect", "#if", "#selector", "#available"], "answer": 0, "explanation": "#expectで条件を検証。", "detail": {"concept": "Swift Testing では `@Test` を付けた関数がテストになり、`#expect(条件)` で条件の成立を検証します。#expect は macro なので、失敗時に式の中身を分解して「何が何と等しくなかったか」を示せます。", "whyCorrect": "検証の中心となる記法が #expect です。失敗しても以降の行は続けて実行されるため、1 回の実行で複数の問題を見つけられます。", "otherChoices": [{"choice": "#if", "reason": "コンパイル時に条件でコードを切り替える指示で、テストの検証ではありません。"}, {"choice": "#selector", "reason": "メソッドを実行時に指定する仕組みで、テスト専用ではありません。"}, {"choice": "#available", "reason": "実行環境の対応状況を判定する条件で、テストの検証とは別です。"}], "takeaway": "検証は #expect。"}}, {"id": "q-dev-018", "difficulty": "Basic", "prompt": "#requireの用途は？", "code": "let user=try #require(findUser())", "choices": ["後続に必要な前提を要求", "通信開始", "UI layout", "ARC retain"], "answer": 0, "explanation": "必要値がない場合testをそこで失敗させられる。", "detail": {"concept": "`#require` は「これが満たされなければ、この先を続けても意味がない」という前提を表します。失敗するとその時点でテストを終了させます。Optional の中身を取り出しつつ、取り出せなければ失敗にする、という使い方が典型です。", "whyCorrect": "前提が崩れた状態で続けると、無関係な失敗が大量に出て原因が分かりにくくなります。#expect が「記録して続行」、#require が「そこで打ち切り」と使い分けます。", "otherChoices": [{"choice": "通信開始", "reason": "通信の開始とは無関係です。"}, {"choice": "UI layout", "reason": "画面配置とは無関係です。"}, {"choice": "ARC retain", "reason": "メモリ管理とは無関係です。"}], "takeaway": "#expect は続行、#require は前提が崩れたら打ち切り。"}}]}, {"id": "dev-testing-parameterized", "level": "Intermediate", "title": "Parameterized Test・Tags・Test Design", "summary": "同じ性質を複数入力へ効率よく検証し、testを整理する。", "mental": "1caseだけでなく境界値でもruleが成立するかを見る。", "points": ["@Test(arguments:)で複数input。", "境界値/異常系/nil/空配列。", "tagで分類。", "testは独立・再現可能に。"], "code": "@Test(arguments:[0,1,10])\nfunc nonNegative(value:Int){#expect(value>=0)}", "why": "少ないcodeで境界条件を増やせる。", "pitfall": "test同士がshared mutable stateに依存すると不安定。", "questions": [{"id": "q-dev-019", "difficulty": "Intermediate", "prompt": "Parameterized Testの利点は？", "code": "@Test(arguments:[1,2,3])", "choices": ["同じbehaviorを複数inputで検証", "UI自動生成", "必ずserial", "Network不要"], "answer": 0, "explanation": "同じtest logicを複数dataへ適用。", "detail": {"concept": "Parameterized Test は、同じテストロジックに複数の入力を順に適用する仕組みです。入力ごとにテスト関数をコピーする必要がなく、どの入力で失敗したかも個別に報告されます。", "whyCorrect": "1 つの振る舞いを多くの入力で確かめたいとき、記述量を増やさずに網羅性を上げられます。", "otherChoices": [{"choice": "UI自動生成", "reason": "画面が自動生成されることはありません。"}, {"choice": "必ずserial", "reason": "順番に実行されると決まっているわけではありません。"}, {"choice": "Network不要", "reason": "通信の要否とは無関係です。"}], "takeaway": "同じ検証を複数の入力で回すのが Parameterized Test。"}}, {"id": "q-dev-020", "difficulty": "Intermediate", "prompt": "良いtest dataに含めたいものは？", "code": "// cases", "choices": ["正常値と境界/異常系", "正常値1個だけ", "randomだけ", "本番DBだけ"], "answer": 0, "explanation": "境界/失敗条件も含める。", "detail": {"concept": "不具合は「ちょうど 0 件」「上限ちょうど」「空」「想定外の入力」といった境界付近で起きやすいものです。正常な値だけを試すテストは、最も壊れやすい部分を素通りします。", "whyCorrect": "正常系に加えて境界値と異常系を含めることで、実際に起きる不具合を捕まえられます。", "otherChoices": [{"choice": "正常値1個だけ", "reason": "正常値だけでは、境界での取りこぼしを検出できません。"}, {"choice": "randomだけ", "reason": "毎回結果が変わると、失敗の再現ができません。乱数を使うなら種を固定します。"}, {"choice": "本番DBだけ", "reason": "本番データを使うと、テストが外部状態に依存し、結果が安定しません。個人情報の扱いの問題もあります。"}], "takeaway": "正常値 + 境界 + 異常系。"}}]}, {"id": "dev-xctest-ui", "level": "Intermediate", "title": "XCTest・UI Test", "summary": "既存XCTestと、実際のapp UIを操作するUI Testの役割を知る。", "mental": "Unit Testは小さいlogic、UI Testは主要user flowを外側から検証。", "points": ["XCTestは既存projectで広く利用。", "XCUITestでlaunch/tap/input。", "accessibilityIdentifierで要素特定。", "UI Testは重要導線へ絞る。"], "code": "let app=XCUIApplication()\napp.launch()\napp.buttons[\"saveButton\"].tap()", "why": "legacy testやE2E QAで必要。", "pitfall": "表示文字だけに依存したselectorはlocalizationで壊れやすい。", "questions": [{"id": "q-dev-021", "difficulty": "Intermediate", "prompt": "UI Testで安定した要素特定に使えるのは？", "code": "view.accessibilityIdentifier=\"saveButton\"", "choices": ["accessibilityIdentifier", "memory address", "array indexだけ", "log文字列"], "answer": 0, "explanation": "test用に安定したidentifierを付けられる。", "detail": {"concept": "UI テストは画面の要素を探して操作します。表示中の文言で探すと、文言の変更や多言語対応で壊れます。accessibilityIdentifier はテスト用に付ける安定した識別子で、表示テキストとは独立しています。", "whyCorrect": "識別子は利用者には見えず、翻訳や文言変更の影響も受けないため、テストが壊れにくくなります。", "otherChoices": [{"choice": "memory address", "reason": "実行のたびに変わる値であり、要素の指定には使えません。"}, {"choice": "array indexだけ", "reason": "並び順が変わると別の要素を指してしまいます。"}, {"choice": "log文字列", "reason": "ログは画面要素の指定手段ではありません。"}], "takeaway": "UI テストの要素指定は accessibilityIdentifier。"}}, {"id": "q-dev-022", "difficulty": "Intermediate", "prompt": "全logicをUI Testにしない理由は？", "code": "XCUIApplication()", "choices": ["Unit Testより実行costが高い", "SwiftではUI Test不可", "JSON不可", "ARC問題"], "answer": 0, "explanation": "起動/操作が必要で遅い。", "detail": {"concept": "UI テストはアプリを実際に起動し、画面遷移や操作を経て検証します。1 件あたりの実行時間が長く、アニメーションや通信の影響で結果が不安定にもなりやすい形式です。Unit Test は対象を直接呼ぶため高速で安定します。", "whyCorrect": "細かいロジックの検証は Unit Test に任せ、UI テストは主要な導線の確認に絞るのが現実的です。テスト全体の実行時間と安定性が変わります。", "otherChoices": [{"choice": "SwiftではUI Test不可", "reason": "UI テストは実施可能です。標準の仕組みが用意されています。"}, {"choice": "JSON不可", "reason": "データ形式の扱いとは無関係です。"}, {"choice": "ARC問題", "reason": "メモリ管理の問題ではありません。"}], "takeaway": "UI テストは遅く不安定。ロジックは Unit Test へ。"}}]}, {"id": "dev-di", "level": "Intermediate", "title": "Dependency Injection・Test Double", "summary": "外部依存を差し替え可能にし、testしやすい設計を作る。", "mental": "依存を内部で勝手に生成せず外から渡すと、何に依存するかが見える。", "points": ["initializer injectionがsimple。", "Protocolでservice境界を表す場合。", "Stub/Fake/Mock等。", "global singleton依存を減らす。"], "code": "protocol UserRepository{func load() async throws -> User}\nfinal class VM{\n let repo:any UserRepository\n init(repo:any UserRepository){self.repo=repo}\n}", "why": "networkなしでlogicをtestし実装交換を容易にする。", "pitfall": "Protocolを作ること自体がDIではない。", "questions": [{"id": "q-dev-023", "difficulty": "Intermediate", "prompt": "Initializer Injectionの利点は？", "code": "init(repository:UserRepository)", "choices": ["依存が明示され差し替えやすい", "必ずSingleton", "UI自動生成", "ARC不要"], "answer": 0, "explanation": "test doubleへ置換しやすい。", "detail": {"concept": "Dependency Injection は、必要なものを内部で自分で作るのではなく、外から渡してもらう設計です。イニシャライザで受け取る形（Initializer Injection）にすると、その型が何に依存しているかが宣言を見るだけで分かります。", "whyCorrect": "依存が引数として現れるため、テスト時には本物の代わりに制御可能な実装を渡せます。内部で直接 URLSession を作っていると差し替えられません。", "otherChoices": [{"choice": "必ずSingleton", "reason": "むしろ共有インスタンスへの直接依存を避ける手段です。Singleton を強制しません。"}, {"choice": "UI自動生成", "reason": "画面が自動生成されることはありません。"}, {"choice": "ARC不要", "reason": "メモリ管理は通常どおり必要です。"}], "example": {"code": "protocol UserLoading {\n    func load() -> String\n}\nstruct APIUserLoader: UserLoading {\n    func load() -> String { \"from API\" }\n}\nstruct StubUserLoader: UserLoading {\n    func load() -> String { \"stub\" }\n}\nstruct ViewModel {\n    let loader: UserLoading\n    func title() -> String { \"User: \\(loader.load())\" }\n}\nprint(ViewModel(loader: APIUserLoader()).title())\nprint(ViewModel(loader: StubUserLoader()).title())", "output": "User: from API\nUser: stub", "explanation": "ViewModel のコードは一切変えずに、渡す実装だけを差し替えています。テストでは StubUserLoader を渡せば、通信なしで結果を固定できます。"}, "takeaway": "依存は外から渡す。差し替えられることがテスト容易性になる。"}}, {"id": "q-dev-024", "difficulty": "Intermediate", "prompt": "Test Doubleの目的は？", "code": "FakeUserRepository()", "choices": ["外部依存を制御可能な代替へ置換", "production APIを必ず呼ぶ", "Git操作", "署名"], "answer": 0, "explanation": "testでnetwork/DBの不確定要素を制御する。", "detail": {"concept": "Test Double は、テスト中に本物の代わりに使う代替実装の総称です（Stub、Mock、Fake など）。通信・データベース・時刻のように、結果が外部要因で変わるものを固定し、テストの結果を安定させます。", "whyCorrect": "本物の API を呼ぶと、ネットワーク状況やサーバー側のデータで結果が変わり、失敗の原因がコードなのか環境なのか判別できません。代替に差し替えれば、検証したい条件だけを再現できます。", "otherChoices": [{"choice": "production APIを必ず呼ぶ", "reason": "本番 API を呼ぶと、結果が不安定になるうえ、実際のデータに影響を与える危険もあります。"}, {"choice": "Git操作", "reason": "バージョン管理の操作とは無関係です。"}, {"choice": "署名", "reason": "配布時の署名とは無関係です。"}], "takeaway": "外部要因を固定し、検証したい条件を再現するための代替実装。"}}]}, {"id": "dev-network-architecture", "level": "Intermediate", "title": "API Client・Service・Repository・DTO", "summary": "network処理を層へ分け、責務を明確にする。", "mental": "URLSessionは通信手段、Repositoryはappが必要なdata取得契約。", "points": ["API Client:transport。", "DTO:外部data形式。", "Repository:data取得/保存interface。", "ViewからURLSession詳細を隠す。"], "code": "ViewModel -> UserRepository -> APIClient -> URLSession\n                     -> UserDTO -> User", "why": "中規模appでtest・変更容易性を改善する。", "pitfall": "層を増やしすぎてsimple appを複雑にしない。", "questions": [{"id": "q-dev-025", "difficulty": "Intermediate", "prompt": "URLSession詳細をViewから隠す利点は？", "code": "View -> Repository -> APIClient", "choices": ["UIと通信実装を分離", "通信無料", "SwiftUI不要", "JSON禁止"], "answer": 0, "explanation": "test/変更しやすい。", "detail": {"concept": "画面のコードが直接 URLSession を呼ぶと、UI の都合と通信の都合が 1 か所に混ざります。API クライアント層を挟むと、画面は「データを取得する」という関心だけを持ち、通信方式やエンドポイントの詳細は隠れます。", "whyCorrect": "通信の実装を差し替えてもテストできるようになり、エンドポイントの変更が画面側へ波及しません。責務の境界を作るのが目的です。", "otherChoices": [{"choice": "通信無料", "reason": "通信の費用や速度は変わりません。構造の話です。"}, {"choice": "SwiftUI不要", "reason": "特定の UI フレームワークが不要になるわけではありません。"}, {"choice": "JSON禁止", "reason": "データ形式が禁止されることはありません。"}], "takeaway": "画面は「何が欲しいか」だけを知る。通信の詳細は隠す。"}}, {"id": "q-dev-026", "difficulty": "Intermediate", "prompt": "DTOの責務は？", "code": "struct UserDTO:Decodable", "choices": ["外部通信/保存形式", "UI layout", "ARC管理", "Git branch"], "answer": 0, "explanation": "外部data構造との境界。", "detail": {"concept": "DTO は外部とやり取りする形をそのまま表す型です。API のレスポンスや保存形式に合わせた構造を持ち、アプリ内部で扱いやすい形（Domain Model）へは変換して渡します。", "whyCorrect": "外部形式の都合を DTO に閉じ込めることで、API 仕様が変わっても影響が変換部分に留まります。", "otherChoices": [{"choice": "UI layout", "reason": "画面配置は UI 層の責務です。"}, {"choice": "ARC管理", "reason": "メモリ管理は言語の仕組みが担います。"}, {"choice": "Git branch", "reason": "バージョン管理とは無関係です。"}], "takeaway": "DTO は外部形式との境界にある型。"}}]}, {"id": "dev-persistence-choice", "level": "Basic", "title": "保存方法の選び方：UserDefaults・File・SwiftData・Keychain", "summary": "data特性に応じて永続化手段を選ぶ。", "mental": "保存手段はdata量・query・秘密性・関係性で選ぶ。", "points": ["UserDefaults:小さな設定。", "File:document/blob/cache。", "SwiftData:構造化model/query/relationship。", "Keychain:credential/secret。"], "code": "Settings -> UserDefaults\nModels -> SwiftData\nToken -> Keychain\nExport JSON -> File", "why": "適切な保存層を選ぶだけで多くの設計事故を防げる。", "pitfall": "tokenをUserDefaults、大量dataをUserDefaults等の用途違いを避ける。", "questions": [{"id": "q-dev-027", "difficulty": "Basic", "prompt": "認証tokenの保存候補は？", "code": "authToken", "choices": ["Keychain", "UserDefaults平文", "console log", "README"], "answer": 0, "explanation": "credentialはKeychain等へ。", "detail": {"concept": "認証トークンは「利用者が本人であることを示した結果」を持ち歩くための値です（本人確認が認証、その人に何を許すかが認可）。漏れると他人がなりすませるため、暗号化された保護領域である Keychain に保存します。", "whyCorrect": "Keychain は OS が保護する保存領域で、他アプリや単純な閲覧から守られます。なお、端末上に置いた値は解析され得るため、「クライアントに置けば完全に秘密にできる」とは考えません。重要な判断はサーバー側で行います。", "otherChoices": [{"choice": "UserDefaults平文", "reason": "保護されない領域なので、資格情報の保存先としては不適切です。"}, {"choice": "console log", "reason": "ログは端末やレポートに残るため、トークンを出力してはいけません。"}, {"choice": "README", "reason": "リポジトリに書けば履歴として残り、共有されてしまいます。"}], "takeaway": "資格情報は Keychain。端末側の値は完全には秘匿できない。"}}, {"id": "q-dev-028", "difficulty": "Basic", "prompt": "query/relationship付きmodel保存の候補は？", "code": "User -> Posts", "choices": ["SwiftData", "print", "Setだけ", "URLComponents"], "answer": 0, "explanation": "構造化永続dataに向く。", "detail": {"concept": "条件を指定した検索や、モデル同士の関連（1 対多など）を扱いたい場合、単純な key-value 保存では足りません。SwiftData のような永続化の仕組みは、モデル定義・検索条件・関連をまとめて扱えます。", "whyCorrect": "構造化されたデータを、条件付きで取り出したり関連をたどったりする用途に向いています。設定値 1 つの保存とは要求が異なります。", "otherChoices": [{"choice": "print", "reason": "画面やコンソールへの出力であり、保存の手段ではありません。"}, {"choice": "Setだけ", "reason": "重複のない集合を表すメモリ上のデータ型で、永続化はしません。"}, {"choice": "URLComponents", "reason": "URL を組み立てる型です。"}], "takeaway": "検索や関連が要るなら key-value でなく永続化フレームワーク。"}}]}, {"id": "dev-swiftdata-basics", "level": "Basic", "title": "SwiftData：@Model・ModelContainer・ModelContext", "summary": "AppleのSwift-native persistenceの基本構成を理解する。", "mental": "Modelは保存対象、Containerはstore全体、Contextはfetch/insert/delete/saveの作業窓口。", "points": ["@Modelでpersistent model。", "ModelContainerがschema/storeを管理。", "ModelContextでinsert/delete/fetch。", "SwiftUIとEnvironmentで統合。"], "code": "import SwiftData\n@Model final class Item{\n var name:String\n init(name:String){self.name=name}\n}\nmodelContext.insert(Item(name:\"Swift\"))", "why": "local-first appで実用的なdata保存手段。", "pitfall": "@Model classは通常のDTO structと同じ性質ではない。", "questions": [{"id": "q-dev-029", "difficulty": "Basic", "prompt": "SwiftData保存対象classへ付けるMacroは？", "code": "@Model final class Item{}", "choices": ["@Model", "@State", "@Test", "@objc"], "answer": 0, "explanation": "@ModelがPersistentModel準拠等を生成する。", "detail": {"concept": "`@Model` は SwiftData のマクロで、付けたクラスを永続化の対象にします。コンパイル時に、保存に必要な準拠や内部処理が展開されます。手書きすると多くなる定型コードを自動生成する仕組みです。", "whyCorrect": "クラス定義に @Model を付けるだけで、保存対象のモデルとして扱えるようになります。", "otherChoices": [{"choice": "@State", "reason": "SwiftUI で画面が持つ一時的な状態を表す仕組みで、永続化とは別です。"}, {"choice": "@Test", "reason": "テスト関数を示す属性です。"}, {"choice": "@objc", "reason": "Objective-C から見えるようにする指定で、永続化とは無関係です。"}], "takeaway": "SwiftData の保存対象は @Model。"}}, {"id": "q-dev-030", "difficulty": "Basic", "prompt": "insert/delete/fetchの作業窓口は？", "code": "@Environment(\\.modelContext) var modelContext", "choices": ["ModelContext", "URLSession", "Calendar", "Logger"], "answer": 0, "explanation": "ModelContextがmodel操作context。", "detail": {"concept": "ModelContainer が保存領域そのもの、ModelContext がその領域に対する作業単位です。追加・削除・取得といった操作は ModelContext を通して行い、変更をまとめて保存します。", "whyCorrect": "insert / delete / fetch はいずれも ModelContext のメソッドです。変更をいったん context に溜めて保存する流れになっています。", "otherChoices": [{"choice": "URLSession", "reason": "通信を行う型であり、永続化の操作窓口ではありません。"}, {"choice": "Calendar", "reason": "暦の計算を扱う型です。"}, {"choice": "Logger", "reason": "ログ出力の仕組みです。"}], "takeaway": "保存操作の窓口は ModelContext。"}}]}, {"id": "dev-swiftdata-query", "level": "Intermediate", "title": "SwiftData：@Query・FetchDescriptor・Predicate・Relationship", "summary": "保存済みmodelを条件付きで取得し、関係を設計する。", "mental": "DB操作も全件取得後filterではなく、必要条件をqueryとして表現する。", "points": ["@QueryでSwiftUIと同期fetch。", "FetchDescriptorでview外からfetch。", "#Predicateで条件。", "@Relationshipでdelete rule/inverse等。"], "code": "@Query(sort:\\Item.createdAt,order:.reverse) var items:[Item]\nlet d=FetchDescriptor<Item>(predicate:#Predicate{$0.isDone == false})", "why": "data量が増えても効率的に扱うため必要。", "pitfall": "UI filterごとに全件loadする設計はscaleしにくい。", "questions": [{"id": "q-dev-031", "difficulty": "Intermediate", "prompt": "SwiftUIでSwiftData結果を同期取得するWrapperは？", "code": "@Query var items:[Item]", "choices": ["@Query", "@Binding", "@AppStorageだけ", "@Published"], "answer": 0, "explanation": "@Queryがpersistent modelをfetchし変更と同期する。", "detail": {"concept": "`@Query` は SwiftUI のビューの中で、保存済みモデルを取得するための Property Wrapper です。単に一度取得するだけでなく、データが変わると画面が自動的に更新されます。", "whyCorrect": "取得と変更の追従が結び付いているため、保存後に自分で再取得して画面を更新する処理を書かずに済みます。", "otherChoices": [{"choice": "@Binding", "reason": "他が持つ状態への読み書きの通り道を表す仕組みで、データの取得は行いません。"}, {"choice": "@AppStorageだけ", "reason": "小さな設定値をキー指定で読み書きする仕組みで、モデルの検索はできません。"}, {"choice": "@Published", "reason": "変更を通知するための仕組みですが、保存済みモデルの取得を担うものではありません。"}], "takeaway": "@Query は取得と画面更新の追従をまとめて担う。"}}, {"id": "q-dev-032", "difficulty": "Intermediate", "prompt": "#Predicateの役割は？", "code": "#Predicate<Item>{$0.isDone == false}", "choices": ["fetch条件を型安全に表す", "JSON encode", "animation", "Git filter"], "answer": 0, "explanation": "query条件を表すMacro。", "detail": {"concept": "`#Predicate` は取得条件を Swift の式として書けるマクロです。文字列で条件を書く方式と違い、プロパティ名の誤りや型の食い違いをコンパイル時に検出できます。", "whyCorrect": "条件を型安全に表現できる点が要点です。実行してみるまで気づけない綴り間違いを、ビルド時に防げます。", "otherChoices": [{"choice": "JSON encode", "reason": "データ形式への変換とは無関係です。"}, {"choice": "animation", "reason": "画面の動きの表現とは無関係です。"}, {"choice": "Git filter", "reason": "バージョン管理の絞り込みとは無関係です。"}], "takeaway": "#Predicate は取得条件を型安全に書くための仕組み。"}}]}, {"id": "dev-swiftdata-migration", "level": "Intermediate", "title": "SwiftData：Schema・Migration・Data Evolution", "summary": "release後にdata modelを変更する責任を理解する。", "mental": "schema変更はcode変更だけでなく、既存user dataを新しい形へ移す問題。", "points": ["property rename/type change/deleteはmigration影響。", "VersionedSchema等を使う場面。", "軽量migrationで済む変更も。", "本番dataを壊さないtestが必要。"], "code": "// v1: name\n// v2: displayName\n// existing store must remain readable", "why": "永続化appを継続運用するなら必須。", "pitfall": "開発中のstore削除を本番migration代わりにしない。", "questions": [{"id": "q-dev-033", "difficulty": "Intermediate", "prompt": "release後のschema変更で最重要なのは？", "code": "// existing user data", "choices": ["既存dataをどう移行するか", "Xcode theme", "Git username", "UI色"], "answer": 0, "explanation": "既存storeの安全なmigrationが必要。", "detail": {"concept": "リリース後は、利用者の端末に既存のデータが存在します。モデルの構造（schema）を変えると、古い形式で保存されたデータをどう読み替えるかを決めておかなければ、アプリが起動できなくなったりデータを失ったりします。", "whyCorrect": "設計時に考えるべきは「新しい形をどう定義するか」だけでなく「既存データをどう移行するか」です。移行の道筋が無い変更は利用者のデータを壊します。", "otherChoices": [{"choice": "Xcode theme", "reason": "開発環境の見た目の設定であり、利用者のデータとは無関係です。"}, {"choice": "Git username", "reason": "バージョン管理の設定であり、無関係です。"}, {"choice": "UI色", "reason": "画面の配色であり、データ移行とは無関係です。"}], "takeaway": "schema 変更の主題は既存データの移行。"}}, {"id": "q-dev-034", "difficulty": "Intermediate", "prompt": "store削除が本番migrationの代わりになる？", "code": "// delete app data", "choices": ["ならない", "完全に同じ", "必ず推奨", "SwiftDataはmigration不要"], "answer": 0, "explanation": "user dataを消せないためmigration設計が必要。", "detail": {"concept": "開発中は、保存領域を削除して作り直せば新しい schema で動きます。しかし本番では、その操作は利用者のデータを消すことに直結します。移行処理を設計して、既存データを新しい形へ変換する必要があります。", "whyCorrect": "利用者のデータは失われてはいけないものなので、削除は代替になりません。開発中の手段をそのまま本番に持ち込まないことが重要です。", "otherChoices": [{"choice": "完全に同じ", "reason": "結果はまったく異なります。片方はデータを保ち、片方は失います。"}, {"choice": "必ず推奨", "reason": "本番では推奨されません。"}, {"choice": "SwiftDataはmigration不要", "reason": "移行は必要です。不要になることはありません。"}], "takeaway": "本番で store 削除は移行の代わりにならない。"}}]}, {"id": "dev-lifecycle-config", "level": "Basic", "title": "App Lifecycle・Info.plist・Permissions", "summary": "appの起動状態、設定値、権限要求の基本を理解する。", "mental": "codeだけでなくOSへ『このappが何を使うか』を宣言する設定がある。", "points": ["scenePhaseでactive/inactive/background。", "Info.plistにusage description等。", "権限は必要なtimingで要求。", "background前後の保存/処理を設計。"], "code": "@Environment(\\.scenePhase) private var scenePhase\n.onChange(of:scenePhase){_,phase in\n if phase == .background { save() }\n}", "why": "Camera/Photo/Location等を使うappで必須。", "pitfall": "権限説明keyがないままprotected resourceへaccessしない。", "questions": [{"id": "q-dev-035", "difficulty": "Basic", "prompt": "scenePhaseの代表状態は？", "code": "scenePhase", "choices": ["active/inactive/background", "GET/POST", "success/failureだけ", "public/private"], "answer": 0, "explanation": "sceneのlifecycle state。", "detail": {"concept": "scenePhase は画面（scene）の状態を表します。active は前面で操作できる状態、inactive は前面だが一時的に操作を受け付けない状態（通知の表示中など）、background は背面へ回った状態です。", "whyCorrect": "この 3 つの状態を見て、背面へ回るときに保存する、前面に戻ったら再取得する、といった処理を書きます。", "otherChoices": [{"choice": "GET/POST", "reason": "通信の要求方法を表すもので、画面の状態ではありません。"}, {"choice": "success/failureだけ", "reason": "処理の成否を表す区分で、画面の状態ではありません。"}, {"choice": "public/private", "reason": "アクセス範囲を表す指定で、画面の状態ではありません。"}], "takeaway": "scenePhase は active / inactive / background。"}}, {"id": "q-dev-036", "difficulty": "Basic", "prompt": "Camera等の権限で必要になるものは？", "code": "Info.plist usage description", "choices": ["利用理由のdescription", "Package.resolved", "Hashable", "Tuple"], "answer": 0, "explanation": "対応するusage descriptionが必要。", "detail": {"concept": "カメラや位置情報のような、利用者のプライバシーに関わる機能を使うには、Info.plist に「なぜ必要か」を説明する文言を書く必要があります。この文言は許可を求めるダイアログにそのまま表示されます。", "whyCorrect": "説明が無いと、要求した時点でアプリが停止します。利用者が判断できるように理由を示すことが求められています。", "otherChoices": [{"choice": "Package.resolved", "reason": "依存バージョンの記録であり、権限とは無関係です。"}, {"choice": "Hashable", "reason": "データ構造の契約であり、権限とは無関係です。"}, {"choice": "Tuple", "reason": "複数の値の組であり、権限とは無関係です。"}], "takeaway": "プライバシー機能には利用理由の説明文が必須。"}}]}, {"id": "dev-capabilities-release", "level": "Intermediate", "title": "Capabilities・Entitlements・Signing・TestFlight", "summary": "OS機能と署名設定、配布buildの関係を理解する。", "mental": "Capabilityはcodeだけで有効にならず、App ID/entitlement/signingとOSの許可がつながる。", "points": ["Team/Certificate/Provisioning。", "Capability追加でentitlement。", "Bundle ID/App ID整合。", "Archive→App Store Connect→TestFlight。"], "code": "// Signing & Capabilities\n// Scheme -> Archive -> App Store Connect -> TestFlight", "why": "実機buildから配布まで詰まりやすい領域。", "pitfall": "Debugで動いてもRelease/実機/entitlement差で問題が出る。", "questions": [{"id": "q-dev-037", "difficulty": "Intermediate", "prompt": "Push/iCloud等の設定場所の代表は？", "code": "Signing & Capabilities", "choices": ["Signing & Capabilities", "Array initializer", "LLDBだけ", "JSONDecoder"], "answer": 0, "explanation": "Targetのcapability/entitlementを設定する。", "detail": {"concept": "Push 通知や iCloud のような OS の機能を使うには、アプリにその権限（entitlement）が付与されている必要があります。Xcode では Target の Signing & Capabilities で追加すると、必要な設定と証明書側の対応がまとめて行われます。", "whyCorrect": "コード上で有効にできるものではなく、成果物に紐づく設定として宣言する必要があります。", "otherChoices": [{"choice": "Array initializer", "reason": "コード上のデータ作成であり、権限の設定ではありません。"}, {"choice": "LLDBだけ", "reason": "デバッガであり、権限の設定は行いません。"}, {"choice": "JSONDecoder", "reason": "データ変換を行う型です。"}], "takeaway": "OS 機能の利用は Signing & Capabilities で宣言する。"}}, {"id": "q-dev-038", "difficulty": "Intermediate", "prompt": "TestFlightの主用途は？", "code": "Archive -> TestFlight", "choices": ["公開前のbeta配布test", "syntax checkだけ", "Git hosting", "DB専用"], "answer": 0, "explanation": "App Store Connect経由でbeta buildを配布する。", "detail": {"concept": "TestFlight は、公開前のビルドを限られた対象者へ配布して試してもらう仕組みです。実際の端末・実際の利用状況で、公開前に問題を見つけられます。", "whyCorrect": "手元やシミュレータでは再現しない問題を、配布前の段階で確認できます。審査を経て多数の利用者へ届く前の安全網です。", "otherChoices": [{"choice": "syntax checkだけ", "reason": "コードの文法確認はビルド時に行われます。配布の仕組みとは別です。"}, {"choice": "Git hosting", "reason": "ソースコードの保管場所を提供する仕組みではありません。"}, {"choice": "DB専用", "reason": "データ保存の仕組みではありません。"}], "takeaway": "TestFlight は公開前のベータ配布。"}}]}, {"id": "dev-architecture-security-git", "level": "Intermediate", "title": "Architecture・Git・Security・API Design", "summary": "責務分離、変更管理、安全性を実装と同じレベルで扱う。", "mental": "良い開発は『動くcode』だけでなく、変更可能・検証可能・安全な境界を作る。", "points": ["View→ViewModel→Repository等で責務分離。", "git status/diff/小さなcommit/PR。", "secret/tokenをcommitしない。", "API名とdocumentationで意図を明確にする。"], "code": "View -> ViewModel -> Repository -> API / DB\n\ngit status\ngit diff\n// Never commit secrets", "why": "個人開発でも規模が増えるほど差が出る。", "pitfall": "pattern名を守ることより、責務・依存方向・安全境界が明確かを見る。", "questions": [{"id": "q-dev-039", "difficulty": "Intermediate", "prompt": "責務分離の目的は？", "code": "View -> ViewModel -> Repository", "choices": ["変更影響を局所化しtestしやすくする", "file数を増やすだけ", "必ず高速", "Protocol最大化"], "answer": 0, "explanation": "依存方向と責務を整理する。", "detail": {"concept": "責務分離は、それぞれの部分が「1 つのことだけを担当する」ように分ける設計です。画面表示、データ取得、業務ロジックが混ざっていると、1 か所の変更が全体に波及し、テストも全体を起動しないと書けません。", "whyCorrect": "境界を引くと、変更の影響がその内側に留まり、依存を差し替えて部分だけをテストできるようになります。ファイル数は結果として増えることもありますが、それ自体は目的ではありません。", "otherChoices": [{"choice": "file数を増やすだけ", "reason": "分割はファイル数を増やすこと自体が目的ではありません。増えても整理されていなければ意味がありません。"}, {"choice": "必ず高速", "reason": "速度が上がる保証はありません。目的は変更のしやすさです。"}, {"choice": "Protocol最大化", "reason": "抽象化は必要な箇所に絞るべきで、増やすほど良いわけではありません。過剰な抽象化は読みにくさを生みます。"}], "takeaway": "境界を引く目的は、影響の局所化とテスト容易性。"}}, {"id": "q-dev-040", "difficulty": "Intermediate", "prompt": "repositoryへcommitしてはいけないものは？", "code": "API_SECRET=...", "choices": ["secret/token/private key", "README", "test名", "public model"], "answer": 0, "explanation": "履歴に残るためsecretをcommitしない。", "detail": {"concept": "commit はローカルの履歴に変更を記録する操作、push はその履歴をリモートへ公開する操作です。重要なのは、commit した時点でその内容が履歴に残るという点で、後のコミットで削除しても過去の履歴からは取り出せてしまいます。", "steps": ["秘密情報を含むファイルを commit すると、その内容が履歴として残る。", "後で削除して commit しても、削除前のコミットには内容が残っている。", "push すると、その履歴ごとリモートへ共有される。", "取り除くには履歴の書き換えが必要になり、共有済みなら流出は取り消せない。"], "whyCorrect": "履歴に残る性質があるため、そもそも入れないことが唯一確実な対策です。設定ファイルは .gitignore で除外し、値は環境変数や安全な保管先から与えます。漏れてしまった場合は、削除より先に該当する資格情報を無効化して差し替えます。", "otherChoices": [{"choice": "README", "reason": "説明文書はリポジトリに含めるべきものです。"}, {"choice": "test名", "reason": "テストコードは共有して価値のあるものです。"}, {"choice": "public model", "reason": "公開してよいモデル定義は通常のソースコードです。"}], "takeaway": "commit した時点で履歴に残る。秘密情報は最初から入れない。"}}]}]}, {"id": "swiftui", "name": "SwiftUI", "subtitle": "宣言的UIを理解する", "description": "Swiftとは別レイヤーとして、View、状態、データフロー、Navigationを学ぶ。", "lessons": [{"id": "swiftui-view-declarative", "level": "Beginner", "title": "View・宣言的UI", "summary": "SwiftUIでは「どう変更するか」ではなく「今どう見えるべきか」を記述する。", "mental": "View は画面そのものではなく、現在の状態からUIを説明する値。", "points": ["View は protocol。", "body は現在のUI構造を返す。", "状態が変わると SwiftUI が必要な差分を反映する。", "View は小さな部品に分割して合成する。"], "code": "struct CounterView: View {\n    var count: Int\n\n    var body: some View {\n        Text(\"Count: \\(count)\")\n    }\n}", "why": "UIKit の命令的更新との最大の違い。SwiftUIを理解する中心概念。", "pitfall": "body を『一度だけ作られる画面』と考えない。状態に応じて評価されるUI記述。", "questions": [{"id": "q-swiftui-001", "difficulty": "Beginner", "prompt": "SwiftUIの宣言的UIの説明として最も近いものは？", "code": "Text(\"Hello\")", "choices": ["ピクセルを直接描く", "現在どう見えるべきかを記述する", "UIViewを必ず継承する", "SQLでUIを作る"], "answer": 1, "explanation": "SwiftUIは状態から『UIがどうあるべきか』を宣言し、実際の更新はフレームワーク側が処理する。", "detail": {"concept": "宣言的 UI とは、「今の状態のとき画面はこう見えるべきだ」を書く方式です。命令的 UI（UIKit など）では「ラベルの文字を書き換える」「行を挿入する」といった手順を自分で書きますが、SwiftUI では状態と見た目の対応だけを書き、状態が変わったときの差分更新はフレームワークが担当します。", "steps": ["状態（@State などの値）が変化する。", "SwiftUI がその View の body を再度評価し、新しい「あるべき姿」を得る。", "前回の結果と比較し、実際に変わった部分だけを画面へ反映する。"], "whyCorrect": "body は「現在の状態に対応する画面の記述」であり、毎回どこをどう書き換えるかを指示するものではありません。状態と見た目の対応が 1 か所に集まるため、更新漏れによる表示の食い違いが起きにくくなります。", "otherChoices": [{"choice": "ピクセルを直接描く", "reason": "描画そのものを自分で行う低レベルな方式です。SwiftUI はその層を隠します。"}, {"choice": "UIViewを必ず継承する", "reason": "UIKit のクラス階層に基づく方式で、SwiftUI の View は struct として定義する protocol です。"}, {"choice": "SQLでUIを作る", "reason": "データベースの問い合わせ言語であり、UI の記述とは無関係です。"}], "takeaway": "「どう変えるか」ではなく「今どう見えるべきか」を書く。"}}, {"id": "q-swiftui-002", "difficulty": "Basic", "prompt": "`some View` の役割として近いものは？", "code": "var body: some View { Text(\"Hi\") }", "choices": ["Viewに準拠する具体型を隠して返す", "必ずAnyViewに変換する", "UIKit専用", "Optional Viewを表す"], "answer": 0, "explanation": "`some View` は opaque result type。View に準拠する具体的な型をコンパイラが把握しつつ、呼び出し側には抽象化して示す。", "detail": {"concept": "`some View` は opaque result type（不透明な戻り値の型）です。VStack や Text を組み合わせると型は入れ子になって非常に長くなりますが、`some View` と書けば「View に準拠した何か 1 つの具体型」とだけ示せます。コンパイラは具体型を把握しているため、型チェックや最適化は通常どおり働きます。", "whyCorrect": "書き手は複雑な型名を書かずに済み、呼び出し側は中身の型に依存しなくなります。それでいて具体型は 1 つに定まっています。", "otherChoices": [{"choice": "必ずAnyViewに変換する", "reason": "AnyView は型を実行時に包んで消す仕組みで、差分更新の効率が落ちることがあります。some View は型を保ったまま隠すだけで、変換は行いません。"}, {"choice": "UIKit専用", "reason": "SwiftUI の機能であり、UIKit のための構文ではありません。"}, {"choice": "Optional Viewを表す", "reason": "値の有無を表す Optional とは無関係です。"}], "example": {"code": "import SwiftUI\n\nstruct TitleView: View {\n    var body: some View {\n        VStack {\n            Text(\"Workout\")\n            Text(\"today\")\n        }\n    }\n}", "explanation": "body の実際の型は VStack<TupleView<(Text, Text)>> のような入れ子ですが、some View と書くことでその複雑さを表に出さずに済みます。"}, "takeaway": "some View は「型名は隠すが具体型は 1 つ」。AnyView とは違う。"}}]}, {"id": "swiftui-layout-modifiers", "level": "Basic", "title": "Stack・Modifier・Layout", "summary": "VStack / HStack / ZStack と Modifier の合成を理解する。", "mental": "modifier は元Viewを直接書き換えるというより、修飾された新しいViewを返す連鎖として読む。", "points": ["VStack は縦、HStack は横、ZStack は重ねる。", "modifier の順序で結果が変わることがある。", "padding / frame / background の適用順を意識する。", "Spacer で余白を柔軟に配分する。"], "code": "Text(\"Swift\")\n    .padding()\n    .background(.blue)\n    .clipShape(.capsule)", "why": "SwiftUIコードの大半はViewの合成。修飾順序を読めるとレイアウトの原因を追いやすい。", "pitfall": "`background().padding()` と `padding().background()` は見た目が異なる。", "questions": [{"id": "q-swiftui-003", "difficulty": "Basic", "prompt": "縦方向にViewを並べるのは？", "code": "// A ? { Text(\"A\"); Text(\"B\") }", "choices": ["HStack", "VStack", "ZStack", "ListRow"], "answer": 1, "explanation": "VStack は Vertical Stack。子Viewを縦方向に配置する。", "detail": {"concept": "Stack は子 View を並べるコンテナです。VStack は Vertical（縦）方向、HStack は Horizontal（横）方向、ZStack は奥行き方向に重ねて配置します。", "whyCorrect": "縦に並べたいので VStack です。名前の頭文字が方向を表しています。", "otherChoices": [{"choice": "HStack", "reason": "Horizontal Stack で、子 View を横方向に並べます。"}, {"choice": "ZStack", "reason": "手前と奥に重ねて配置します。背景の上に文字を乗せるときなどに使います。"}, {"choice": "ListRow", "reason": "そのような標準のコンテナはありません。行を並べたい場合は List を使います。"}], "takeaway": "V は縦、H は横、Z は重ね。"}}, {"id": "q-swiftui-004", "difficulty": "Basic", "prompt": "modifier の順序について正しいものは？", "code": "Text(\"Hi\").padding().background(.blue)", "choices": ["順序は常に無関係", "順序によって結果が変わることがある", "modifier は1つだけ使える", "background はUIKit専用"], "answer": 1, "explanation": "各 modifier は新しい View を返すため、どの段階に padding や background を適用するかで見た目が変わる。", "detail": {"concept": "modifier は「View を受け取って、新しい View を返す」仕組みです。`.padding().background(.blue)` は「余白を足した View に背景を敷く」という順で適用されるため、背景は余白を含む範囲に広がります。順序を逆にすると、背景を敷いた View の外側に余白が付きます。", "steps": ["Text(\"Hi\") がある。", "`.padding()` が、その周囲に余白を加えた新しい View を返す。", "`.background(.blue)` が、その（余白込みの）View の背後に色を敷く。", "結果として、余白部分まで青くなる。"], "whyCorrect": "各段階で対象となる View が変わるため、適用順によって見た目が変わります。modifier は設定項目の羅列ではなく、包む順序を表しています。", "otherChoices": [{"choice": "順序は常に無関係", "reason": "順序が影響しない modifier もありますが、padding と background のように影響するものが多くあります。"}, {"choice": "modifier は1つだけ使える", "reason": "modifier はいくつでも連ねられます。"}, {"choice": "background はUIKit専用", "reason": "background は SwiftUI の modifier です。"}], "takeaway": "modifier は包む順序。padding → background で余白まで色が付く。"}}]}, {"id": "swiftui-state-binding", "level": "Basic", "title": "@State・@Binding", "summary": "画面内の状態と、親子View間で共有する状態の入口。", "mental": "@State はViewが所有する状態、@Binding は他の場所が所有する状態への読み書き可能な窓。", "points": ["@State はローカルなUI状態の所有に使う。", "@Binding は状態を所有せず参照する。", "状態変更により関連Viewが更新される。", "データの所有者を曖昧にしない。"], "code": "struct ToggleRow: View {\n    @Binding var isOn: Bool\n\n    var body: some View {\n        Toggle(\"Enabled\", isOn: $isOn)\n    }\n}", "why": "SwiftUIのバグは状態の所有場所が曖昧なときに起きやすい。誰がsource of truthかを決める。", "pitfall": "@Binding は値のコピーではない。親などが所有する状態への接続。", "questions": [{"id": "q-swiftui-005", "difficulty": "Basic", "prompt": "@State が最も向いているのは？", "code": "struct Screen: View {\n    // ? var isPresented = false\n}", "choices": ["画面内だけで所有する表示状態", "グローバルDB接続", "UIViewControllerの継承", "定数"], "answer": 0, "explanation": "@State はViewが所有するローカル状態に適する。例えばシート表示やトグル状態。", "detail": {"concept": "Property Wrapper とは、プロパティに共通の振る舞いを付け足す仕組みで、`@` を頭に付けて書きます。@State はその 1 つで、「この View が所有する、変化したら画面を更新すべき値」を表します。View は struct（値型）で再生成されますが、@State の値は SwiftUI 側で保持されるため、再生成をまたいで残ります。", "whyCorrect": "シートの表示有無やトグルの状態のように、その画面の中だけで完結し、その画面が持ち主である状態に向いています。", "otherChoices": [{"choice": "グローバルDB接続", "reason": "アプリ全体で共有する資源を View が所有するのは適切ではありません。外部から渡すか、専用の仕組みで管理します。"}, {"choice": "UIViewControllerの継承", "reason": "UIKit のクラスであり、SwiftUI の状態管理とは別の話です。"}, {"choice": "定数", "reason": "変化しない値に @State は不要です。単なる let で十分です。"}], "takeaway": "@State は「その View が持ち主である、変化する値」。"}}, {"id": "q-swiftui-006", "difficulty": "Basic", "prompt": "$isOn が意味するものは？", "code": "@State private var isOn = false\nToggle(\"On\", isOn: $isOn)", "choices": ["Boolの反転", "Binding<Bool>", "String化", "Optional化"], "answer": 1, "explanation": "$ を付けることで @State が提供する Binding を取り出し、Toggle が読み書きできる。", "detail": {"concept": "@State は 2 つの値を公開します。1 つは本来の値（wrappedValue）で `isOn` と書くと得られます。もう 1 つが projectedValue で、`$isOn` と書くと得られる Binding<Bool> です。Binding は「読み取りと書き込みの両方ができる通り道」で、値そのもののコピーではありません。", "whyCorrect": "Toggle は利用者の操作に応じて値を書き換える必要があります。値のコピーを渡しても元に反映されないため、書き込みもできる Binding を `$` で渡します。", "otherChoices": [{"choice": "Boolの反転", "reason": "`$` は値を反転しません。真偽を反転するのは `!` です。"}, {"choice": "String化", "reason": "文字列への変換とは無関係です。"}, {"choice": "Optional化", "reason": "値の有無を表す Optional とは無関係です。"}], "takeaway": "`$` は Binding（読み書きの通り道）を取り出す記号。"}}]}, {"id": "swiftui-observation", "level": "Intermediate", "title": "Observation・モデルと状態", "summary": "複数Viewで扱うモデルをUI更新と結び付ける。", "mental": "画面に必要な状態をモデルに集め、Viewはその状態から表示を導出する。", "points": ["Observation を使うとモデルの変更をSwiftUIが追跡できる。", "Viewにロジックを詰め込みすぎず、モデルやサービスへ分離する。", "派生値は保存せず計算できる場合が多い。", "依存関係の所有範囲を意識する。"], "code": "@Observable\nfinal class CounterModel {\n    var count = 0\n}", "why": "中規模以上では状態管理が設計品質を大きく左右する。", "pitfall": "何でもグローバル共有すると依存関係が見えなくなり、テストもしにくくなる。", "questions": [{"id": "q-swiftui-007", "difficulty": "Intermediate", "prompt": "状態モデルを分離する主な利点は？", "code": "@Observable final class Model { var count = 0 }", "choices": ["必ず通信が速くなる", "状態とUIの責務を分けやすい", "Viewが不要になる", "UIKitに変換される"], "answer": 1, "explanation": "状態・ロジックとUI記述を分けることで責務が明確になり、テストや再利用がしやすくなる。", "detail": {"concept": "画面の記述と、状態やロジックを別の型に分けると、それぞれの責務がはっきりします。@Observable を付けたクラスは、プロパティの変化が観測され、参照している View が自動的に更新されます。", "whyCorrect": "状態とロジックが View から独立するため、UI を起動せずにロジックだけをテストでき、同じ状態を複数の View から使い回せます。", "otherChoices": [{"choice": "必ず通信が速くなる", "reason": "通信の速さは変わりません。構造の話です。"}, {"choice": "Viewが不要になる", "reason": "View は引き続き必要です。役割が分かれるだけです。"}, {"choice": "UIKitに変換される", "reason": "別のフレームワークへ変換される仕組みではありません。"}], "takeaway": "状態・ロジックと画面記述を分けると、テストしやすくなる。"}}, {"id": "q-swiftui-008", "difficulty": "Intermediate", "prompt": "派生値の扱いとして良い設計は？", "code": "var firstName = \"Yuki\"\nvar lastName = \"K\"\n// fullName は？", "choices": ["必ず別の保存状態にする", "必要なら計算プロパティで導出する", "UserDefaultsだけに置く", "常にglobalにする"], "answer": 1, "explanation": "元データから必ず計算できる値は重複保存すると不整合が起きやすい。計算プロパティなどで導出する方が安全。", "detail": {"concept": "他の値から必ず計算できる値を、別途保存してしまうと、元の値が変わったときに更新し忘れて食い違いが生じます。計算プロパティとして導出すれば、常に元の値と一致します。", "whyCorrect": "fullName は firstName と lastName から必ず求まります。保存せず計算にすれば、どちらかを変えても自動的に正しい結果になります。", "otherChoices": [{"choice": "必ず別の保存状態にする", "reason": "保存すると二重管理になり、更新漏れによる不整合の原因になります。"}, {"choice": "UserDefaultsだけに置く", "reason": "永続化の場所の話であり、導出の是非とは別です。しかも同じ二重管理の問題が残ります。"}, {"choice": "常にglobalにする", "reason": "どこからでも触れる値にすると、変更元が追えなくなります。"}], "example": {"code": "struct User {\n    var firstName = \"Yuki\"\n    var lastName = \"K\"\n    var fullName: String { firstName + \" \" + lastName }\n}\nvar user = User()\nprint(user.fullName)\nuser.lastName = \"Kounishi\"\nprint(user.fullName)", "output": "Yuki K\nYuki Kounishi", "explanation": "fullName を保存していないため、lastName を変えるだけで結果が追随します。保存していたら、更新処理を書き忘れた瞬間に古い値が残ります。"}, "takeaway": "導出できる値は保存しない。計算プロパティにする。"}}]}, {"id": "swiftui-list-navigation", "level": "Intermediate", "title": "List・ForEach・NavigationStack", "summary": "データの一覧表示と画面遷移を組み立てる。", "mental": "一覧はデータのIdentity、Navigationは遷移先を表す値を意識する。", "points": ["ForEach は各要素の安定した識別子が重要。", "Identifiable で id を型に持たせられる。", "NavigationStack は値ベースのNavigationを構成できる。", "画面遷移とデータ選択を分離して考える。"], "code": "NavigationStack {\n    List(items) { item in\n        NavigationLink(value: item) {\n            Text(item.name)\n        }\n    }\n}", "why": "実アプリの基本構造。IDが不安定だとアニメーションや更新差分で問題が出る。", "pitfall": "配列indexを恒久的IDとして使うと、並べ替え・削除時にIdentityがずれることがある。", "questions": [{"id": "q-swiftui-009", "difficulty": "Intermediate", "prompt": "ForEachで安定したidが重要な理由は？", "code": "ForEach(items) { item in Text(item.name) }", "choices": ["文字色を決めるため", "要素の同一性と差分更新を追跡するため", "ネット通信のため", "Optionalをなくすため"], "answer": 1, "explanation": "SwiftUIはidを使って前後の要素を対応付け、挿入・削除・更新を判断する。", "detail": {"concept": "SwiftUI は再評価のたびに「前回の要素」と「今回の要素」を突き合わせ、どれが追加・削除・移動されたかを判断します。その対応付けに使うのが id です。id が安定していないと、同じ要素を別物と見なして作り直してしまい、状態やアニメーションが崩れます。", "whyCorrect": "id は要素の同一性を示す情報です。並び順が変わっても、同じ id の要素は同じものとして追跡されます。", "otherChoices": [{"choice": "文字色を決めるため", "reason": "見た目の指定とは無関係です。"}, {"choice": "ネット通信のため", "reason": "通信とは無関係です。"}, {"choice": "Optionalをなくすため", "reason": "値の有無を表す Optional とは無関係です。"}], "takeaway": "id は要素の同一性。差分更新の土台になる。"}}, {"id": "q-swiftui-010", "difficulty": "Intermediate", "prompt": "NavigationStackの役割は？", "code": "NavigationStack { ContentView() }", "choices": ["画面遷移のスタックを管理する", "Auto Layoutを有効化する", "JSONを解析する", "ARCを無効化する"], "answer": 0, "explanation": "NavigationStack は階層的な画面遷移とnavigation pathを管理するコンテナ。", "detail": {"concept": "NavigationStack は、画面を積み重ねて進み、戻ると取り除かれるという遷移の履歴を管理するコンテナです。積まれている経路（path）を値として扱えるため、コードから特定の画面へ遷移したり、まとめて戻したりできます。", "whyCorrect": "遷移の履歴をスタックとして持つのが役割です。個々の画面の中身とは独立しています。", "otherChoices": [{"choice": "Auto Layoutを有効化する", "reason": "制約による配置は UIKit の仕組みで、SwiftUI では別のレイアウト方式を使います。"}, {"choice": "JSONを解析する", "reason": "データの解析とは無関係です。"}, {"choice": "ARCを無効化する", "reason": "メモリ管理は通常どおり働きます。"}], "takeaway": "NavigationStack は遷移の履歴（積み重ね）を管理する。"}}]}, {"id": "swiftui-task-concurrency", "level": "Intermediate", "title": ".task・非同期処理・MainActor", "summary": "Viewのライフサイクルに合わせて非同期処理を開始し、UI状態を安全に更新する。", "mental": "通信処理そのものと、通信結果を画面状態へ反映する処理を分けて読む。", "points": [".task でViewに関連した非同期処理を開始できる。", "Taskはキャンセルされる可能性を考慮する。", "UIに関係する状態はMainActorとの関係を理解する。", "通信ロジックをViewへ直接詰め込みすぎない。"], "code": ".task {\n    do {\n        items = try await repository.fetchItems()\n    } catch {\n        errorMessage = error.localizedDescription\n    }\n}", "why": "現代のアプリは非同期処理が前提。Swift ConcurrencyとSwiftUIを接続する重要部分。", "pitfall": "View表示のたびに重い処理を無条件で走らせると、重複リクエストなどが起きる可能性がある。", "questions": [{"id": "q-swiftui-011", "difficulty": "Intermediate", "prompt": ".task の用途として近いものは？", "code": "Text(\"Loading\").task { await load() }", "choices": ["Viewに関連した非同期処理を開始する", "Auto Layout制約を作る", "Storyboardを開く", "classをstructへ変換する"], "answer": 0, "explanation": ".task はViewのライフサイクルに関連付いた非同期処理を実行するために使える。", "detail": {"concept": "`.task` は View が表示されるときに非同期処理を開始し、その View が消えるときに自動でキャンセルする modifier です。View のライフサイクルと処理の寿命が結び付くため、消えた画面のための処理が残り続けません。", "whyCorrect": "画面表示に合わせたデータ取得のような処理に向いています。自分で Task を作って管理する場合と違い、キャンセルの後始末を書かずに済みます。", "otherChoices": [{"choice": "Auto Layout制約を作る", "reason": "制約の作成は UIKit のレイアウトの話です。"}, {"choice": "Storyboardを開く", "reason": "画面定義ファイルを開く操作ではありません。"}, {"choice": "classをstructへ変換する", "reason": "型の種類を変換する仕組みではありません。"}], "takeaway": ".task は表示に合わせて開始し、消えたらキャンセルされる。"}}, {"id": "q-swiftui-012", "difficulty": "Intermediate", "prompt": "非同期ロード設計で重要なのは？", "code": "let items = try await api.fetchItems()", "choices": ["必ずsleepする", "失敗・キャンセル・状態更新を考慮する", "全処理を同期化する", "Optionalを禁止する"], "answer": 1, "explanation": "ネットワーク処理は失敗やキャンセルがあり得る。loading / success / error などの状態を設計する。", "detail": {"concept": "ネットワークからの読み込みは、成功だけでなく失敗もキャンセルも起こります。「読み込み中」「成功（データあり）」「失敗（理由あり）」といった状態を型で表し、それぞれに対応する画面を用意しておくと、表示の抜けが生じません。", "whyCorrect": "失敗時に何も出ない、読み込み中と空データが区別できない、といった問題は状態設計の不足から起きます。enum で状態を表せば、switch で扱い漏れを防げます。", "otherChoices": [{"choice": "必ずsleepする", "reason": "待ち時間を入れても問題は解決しません。"}, {"choice": "全処理を同期化する", "reason": "同期化すると、その間 UI が固まります。"}, {"choice": "Optionalを禁止する", "reason": "値が無い可能性は実際に存在するため、表現を禁止しても解決しません。"}], "takeaway": "loading / success / failure を状態として設計する。"}}]}]}, {"id": "uikit", "name": "UIKit", "subtitle": "命令的UIとライフサイクルを理解する", "description": "UIView / UIViewController / Auto Layout / Delegateなど、UIKit特有の考え方をSwiftと分けて学ぶ。", "lessons": [{"id": "uikit-view-controller", "level": "Beginner", "title": "UIView・UIViewController", "summary": "UIKitの主要な責務分担を理解する。", "mental": "UIViewは見た目と描画、UIViewControllerは画面のライフサイクルやView群の管理を担う。", "points": ["UIView は画面部品の基本クラス。", "UIViewController は画面単位の管理を担う。", "UIKit はclassと参照セマンティクスが中心。", "コードベースUIではViewを生成して階層へ追加する。"], "code": "final class ProfileViewController: UIViewController {\n    override func viewDidLoad() {\n        super.viewDidLoad()\n        view.backgroundColor = .systemBackground\n    }\n}", "why": "UIKitコードを読むとき、Swiftのclass機能とUIKitのフレームワーク機能を分離して理解する必要がある。", "pitfall": "`override` はUIKit専用構文ではなくSwiftの継承機能。", "questions": [{"id": "q-uikit-001", "difficulty": "Beginner", "prompt": "UIViewControllerの主な役割は？", "code": "final class ScreenVC: UIViewController {}", "choices": ["データベースだけを管理", "画面とView群のライフサイクルを管理", "Swiftコンパイラを実行", "Gitを管理"], "answer": 1, "explanation": "UIViewControllerは画面に関するView階層や表示ライフサイクルなどを管理する中心クラス。", "detail": {"concept": "UIKit は命令的（imperative）で、出来事に応じて処理を書くイベント駆動の枠組みです。UIViewController は 1 つの画面分の View 階層を持ち、表示・非表示に伴う節目（ライフサイクル）で呼ばれるメソッドを提供します。View の組み立てと、表示に応じた準備・後始末をまとめる場所です。", "whyCorrect": "担当するのは画面まわりの View 階層と、その表示に伴う節目の処理です。ここに業務ロジックや通信処理まで詰め込むと肥大化するため、別の型へ分けるのが一般的な設計です。", "otherChoices": [{"choice": "データベースだけを管理", "reason": "データ保存を担当する型ではありません。分離して別の層に置きます。"}, {"choice": "Swiftコンパイラを実行", "reason": "ビルドの仕組みとは無関係です。"}, {"choice": "Gitを管理", "reason": "バージョン管理とは無関係です。"}], "takeaway": "画面の View 階層と表示ライフサイクルの担当。ロジックは別に置く。"}}, {"id": "q-uikit-002", "difficulty": "Basic", "prompt": "`override` は何を表す？", "code": "override func viewDidLoad() { }", "choices": ["親クラスのメソッドを上書きする", "Optionalにする", "非同期化する", "Protocolを作る"], "answer": 0, "explanation": "UIViewControllerが持つviewDidLoadをサブクラスでオーバーライドして独自処理を追加している。", "detail": {"concept": "override は、親クラスが用意しているメソッドを子クラスで置き換える指定です。UIViewController は viewDidLoad のような節目のメソッドを持っており、それを自分のクラスで上書きして独自の処理を書きます。多くの場合、`super.viewDidLoad()` を呼んで親の処理も実行します。", "whyCorrect": "呼ばれるタイミングは UIKit 側が決めており、こちらは中身だけを差し替えます。これがイベント駆動の基本的な形です。", "otherChoices": [{"choice": "Optionalにする", "reason": "値の有無を表す Optional とは無関係です。"}, {"choice": "非同期化する", "reason": "非同期の指定は async です。"}, {"choice": "Protocolを作る", "reason": "protocol を定義する構文とは別です。"}], "takeaway": "override は親のメソッドを置き換える。呼ぶのは UIKit 側。"}}]}, {"id": "uikit-lifecycle", "level": "Basic", "title": "ViewController Lifecycle", "summary": "画面が生成・表示・非表示になるタイミングを読む。", "mental": "『一度だけ準備したい処理』と『表示されるたびに必要な処理』を分ける。", "points": ["viewDidLoad はViewロード後に初期設定を行う代表的な場所。", "viewWillAppear は表示直前。", "viewDidAppear は表示完了後。", "viewWillDisappear / viewDidDisappear も存在する。"], "code": "override func viewWillAppear(_ animated: Bool) {\n    super.viewWillAppear(animated)\n    reloadData()\n}", "why": "処理を置く場所を間違えると、更新されない・毎回重い処理が走るなどのバグになる。", "pitfall": "viewDidLoad が「画面が表示されるたび」に呼ばれるとは限らない。", "questions": [{"id": "q-uikit-003", "difficulty": "Basic", "prompt": "表示される直前に毎回更新したい処理の候補は？", "code": "// override func ?(_ animated: Bool)", "choices": ["viewDidLoad", "viewWillAppear", "deinit", "init(coder:)"], "answer": 1, "explanation": "viewWillAppearは画面が表示される直前に呼ばれる。戻ってきた際の更新などに使われることが多い。", "detail": {"concept": "ライフサイクルのメソッドは呼ばれる回数が違います。viewDidLoad は View が読み込まれた後の 1 回だけ、viewWillAppear は画面が表示されるたびに毎回呼ばれます。他の画面から戻ってきたときにも呼ばれます。", "whyCorrect": "「表示されるたびに最新化したい」処理は、毎回呼ばれる viewWillAppear に置きます。viewDidLoad に書くと、戻ってきたときに更新されません。", "otherChoices": [{"choice": "viewDidLoad", "reason": "最初の 1 回しか呼ばれないため、再表示時の更新には使えません。初期設定向けです。"}, {"choice": "deinit", "reason": "破棄される直前の後始末で、表示のたびには呼ばれません。"}, {"choice": "init(coder:)", "reason": "生成時の初期化であり、表示のたびには呼ばれません。"}], "takeaway": "viewDidLoad は 1 回、viewWillAppear は表示のたび。"}}, {"id": "q-uikit-004", "difficulty": "Basic", "prompt": "viewDidLoadについて正しいものは？", "code": "override func viewDidLoad() {\n    super.viewDidLoad()\n}", "choices": ["画面表示のたび必ず呼ばれる", "Viewがロードされた後の初期設定でよく使う", "アプリ終了時だけ呼ばれる", "Auto Layoutを無効にする"], "answer": 1, "explanation": "viewDidLoadはViewロード完了後の初期セットアップに使われる。表示のたびに呼ばれる前提にはしない。", "detail": {"concept": "viewDidLoad は、View 階層が読み込まれた直後に 1 度だけ呼ばれます。サブビューの追加や制約の設定、変化しない初期設定など、1 回で済む準備に適しています。", "whyCorrect": "1 回だけという性質があるため、初期構築に向いています。ここに毎回更新したい処理を書くと、再表示時に反映されません。", "otherChoices": [{"choice": "画面表示のたび必ず呼ばれる", "reason": "表示のたびに呼ばれるのは viewWillAppear です。viewDidLoad は 1 回だけです。"}, {"choice": "アプリ終了時だけ呼ばれる", "reason": "終了時のメソッドではありません。"}, {"choice": "Auto Layoutを無効にする", "reason": "レイアウトの仕組みを無効化するものではありません。"}], "takeaway": "viewDidLoad は 1 回きりの初期設定用。"}}]}, {"id": "uikit-autolayout", "level": "Basic", "title": "Auto Layout・Constraints", "summary": "固定座標ではなくView同士の関係でレイアウトを定義する。", "mental": "Constraintは『位置』ではなく『関係式』。leadingが親のleadingから16pt、など。", "points": ["translatesAutoresizingMaskIntoConstraints = false をコードレイアウトで使う。", "NSLayoutConstraint.activate で複数制約を有効化。", "Safe Area を基準にする場合が多い。", "不足・矛盾した制約をデバッグできるようにする。"], "code": "label.translatesAutoresizingMaskIntoConstraints = false\nNSLayoutConstraint.activate([\n    label.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 16),\n    label.centerYAnchor.constraint(equalTo: view.centerYAnchor)\n])", "why": "画面サイズ・Dynamic Type・回転などに適応するUIKitの基本。", "pitfall": "制約を増やせば良いわけではない。必要十分で矛盾しない関係を作る。", "questions": [{"id": "q-uikit-005", "difficulty": "Basic", "prompt": "コードでAuto Layout制約を張る際によく行う設定は？", "code": "label.________ = false", "choices": ["isHidden", "translatesAutoresizingMaskIntoConstraints", "clipsToBounds", "isUserInteractionEnabled"], "answer": 1, "explanation": "Autoresizing Maskから自動生成される制約との競合を避けるため false にするのが基本。", "detail": {"concept": "UIKit の View は、既定では自身の frame（位置と大きさの直接指定）から自動的に制約が生成される設定になっています。コードで Auto Layout の制約を張る場合、この自動生成が競合するため、`translatesAutoresizingMaskIntoConstraints` を false にして無効化します。", "whyCorrect": "無効化しないと、自動生成された制約と自分で書いた制約が両立せず、レイアウトが壊れたり警告が出たりします。コードで制約を書くときの定型です。", "otherChoices": [{"choice": "isHidden", "reason": "表示・非表示の切り替えで、制約とは無関係です。"}, {"choice": "clipsToBounds", "reason": "はみ出した部分を切り取る設定で、制約とは無関係です。"}, {"choice": "isUserInteractionEnabled", "reason": "操作を受け付けるかどうかの設定です。"}], "takeaway": "コードで制約を張るなら translatesAutoresizingMaskIntoConstraints = false。"}}, {"id": "q-uikit-006", "difficulty": "Intermediate", "prompt": "この制約が表すものは？", "code": "label.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 16)", "choices": ["labelの幅を16にする", "label左端を親View左端から16ptにする", "labelを中央にする", "高さを16にする"], "answer": 1, "explanation": "leadingAnchor同士の関係にconstant 16を設定しているため、親Viewのleadingから16pt離す。", "detail": {"concept": "Auto Layout の制約は、単独の値ではなく「2 つのアンカー（基準点）どうしの関係」を表します。`label.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 16)` は「label の先頭側の端を、view の先頭側の端から 16pt 離した位置に合わせる」という関係です。", "steps": ["基準にするのは label の leadingAnchor（先頭側の端）。", "相手は view の leadingAnchor（親の先頭側の端）。", "equalTo なので両者を一致させるが、constant で 16pt ずらす。", "結果として、label の先頭が親の先頭から 16pt 内側に置かれる。"], "whyCorrect": "制約は位置や大きさを直接指定するのではなく、関係として表現します。だから画面サイズが変わっても関係が保たれます。", "otherChoices": [{"choice": "labelの幅を16にする", "reason": "幅を決めるのは widthAnchor です。leadingAnchor は水平方向の位置の基準です。"}, {"choice": "labelを中央にする", "reason": "中央に置くには centerXAnchor どうしを合わせます。"}, {"choice": "高さを16にする", "reason": "高さを決めるのは heightAnchor です。"}], "takeaway": "制約は「どのアンカーとどのアンカーの関係か」で読む。"}}]}, {"id": "uikit-events-delegate", "level": "Intermediate", "title": "Target-Action・Delegate", "summary": "UIKitでイベントや責務を別オブジェクトへ伝える代表的パターン。", "mental": "Target-Actionはイベント→処理、Delegateは『判断や処理を別オブジェクトに任せる』契約。", "points": ["UIButtonなどはTarget-Actionでイベントを処理できる。", "Delegateはprotocolで契約を表すことが多い。", "delegateはweak参照になる設計が多い。", "UIKitの多くのAPIでDataSource / Delegateが使われる。"], "code": "button.addTarget(self, action: #selector(didTapButton), for: .touchUpInside)", "why": "UIKit既存コードを読むと必ず遭遇する。SwiftのProtocolとUIKitのDelegateパターンを結び付ける。", "pitfall": "DelegateとNotification、Closureはすべて同じではない。依存方向や1対1/1対多などの性質が違う。", "questions": [{"id": "q-uikit-007", "difficulty": "Intermediate", "prompt": "Delegateパターンの説明として最も近いものは？", "code": "weak var delegate: FormViewDelegate?", "choices": ["処理の一部を別オブジェクトへ委譲する", "必ず配列を作る", "画面を自動保存する", "SwiftUIへ変換する"], "answer": 0, "explanation": "Delegateはprotocolなどで定義した契約を通じ、イベントや判断を別オブジェクトへ委譲する設計。", "detail": {"concept": "Delegate は、ある処理や判断を別のオブジェクトに任せる設計です。任せる側は protocol で「こういう場面で、こう尋ねる／知らせる」という契約だけを定め、実際の中身は任された側が書きます。UIKit の多くの部品がこの形で拡張点を提供しています。", "whyCorrect": "部品側は誰が担当するかを知らずに済み、担当側は必要なメソッドだけを実装すれば済みます。`weak var delegate` になっているのは、部品と担当が互いを強く参照して解放されなくなるのを防ぐためです。", "otherChoices": [{"choice": "必ず配列を作る", "reason": "データ構造とは無関係な設計の話です。"}, {"choice": "画面を自動保存する", "reason": "保存機能を提供する仕組みではありません。"}, {"choice": "SwiftUIへ変換する", "reason": "別のフレームワークへの変換とは無関係です。"}], "example": {"code": "protocol FormViewDelegate: AnyObject {\n    func formDidSubmit(_ text: String)\n}\nfinal class FormView {\n    weak var delegate: FormViewDelegate?\n    func submit(_ text: String) { delegate?.formDidSubmit(text) }\n}\nfinal class ScreenVC: FormViewDelegate {\n    func formDidSubmit(_ text: String) { print(\"received \\(text)\") }\n}\nlet screen = ScreenVC()\nlet form = FormView()\nform.delegate = screen\nform.submit(\"leg day\")", "output": "received leg day", "explanation": "FormView は誰が受け取るかを知らず、契約どおり delegate に知らせるだけです。受け手を差し替えても FormView のコードは変わりません。"}, "takeaway": "
