<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Swift Learning Lab v0.4</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#ffffff;--panel-2:#f0f2f7;--text:#151821;--muted:#697080;
  --line:#e1e5ee;--accent:#4b61ff;--accent-soft:#eef0ff;--good:#17834a;--good-bg:#e9f8ef;
  --bad:#c63535;--bad-bg:#fff0f0;--code:#11141b;--code-text:#ecf1ff;--shadow:0 12px 34px rgba(25,32,56,.08);
  --radius:18px;--sidebar:276px;
}
[data-theme="dark"]{
  --bg:#0b0d12;--panel:#12151c;--panel-2:#191d26;--text:#f3f5fa;--muted:#a0a7b6;
  --line:#272d3a;--accent:#7c8cff;--accent-soft:#1b2140;--good:#65d994;--good-bg:#132c20;
  --bad:#ff8484;--bad-bg:#341a1a;--code:#07090d;--code-text:#edf1fb;--shadow:0 12px 34px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{min-height:100dvh}
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:14px;padding:0 max(18px,env(safe-area-inset-left));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#8f59ff);color:white;font-weight:900}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100dvh - 64px)}
.sidebar{position:sticky;top:64px;height:calc(100dvh - 64px);padding:20px 16px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.side-label{margin:15px 10px 7px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.track-btn,.mode-btn,.lesson-btn{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:13px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.track-btn:hover,.mode-btn:hover,.lesson-btn:hover{background:var(--panel-2)}
.track-btn.active,.mode-btn.active,.lesson-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:750}
.badge{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-size:11px}
.main{min-width:0;padding:34px clamp(18px,4vw,56px) 110px}
.container{max-width:1020px;margin:0 auto}
.hero{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
h1{margin:4px 0 7px;font-size:clamp(29px,4vw,46px);line-height:1.08;letter-spacing:-.04em}
.hero p{margin:0;color:var(--muted);max-width:720px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3vw,28px);margin-bottom:18px}
.lesson-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.level{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800}
h2{margin:8px 0 7px;font-size:clamp(23px,3vw,31px);letter-spacing:-.03em}
h3{font-size:16px;margin:22px 0 8px}
.muted{color:var(--muted)}
.mental{border-left:4px solid var(--accent);padding:12px 14px;background:var(--accent-soft);border-radius:0 12px 12px 0;margin:18px 0}
.points{padding-left:20px}
.points li{margin:7px 0}
pre{position:relative;margin:14px 0 0;padding:18px;border-radius:15px;background:var(--code);color:var(--code-text);overflow:auto;line-height:1.55;font:13.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;-webkit-overflow-scrolling:touch}
.copy-btn{position:absolute;top:9px;right:9px;border:1px solid #2c3340;background:#1b202b;color:#cbd3e5;border-radius:9px;padding:5px 8px;font-size:11px}
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.note{padding:14px;border-radius:13px;background:var(--panel-2)}
.note strong{display:block;margin-bottom:4px;font-size:12px}
.warning{border:1px solid color-mix(in srgb,var(--bad) 25%,var(--line))}
.lesson-actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800}
.btn.primary{background:var(--accent);color:white}
.btn.secondary{background:var(--panel-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px 13px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px 12px}
.quiz-card{max-width:850px;margin:0 auto}
.quiz-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.quiz-code{margin-top:18px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:14px 15px;border-radius:14px;min-height:54px;transition:.15s transform,.15s border-color,.15s background}
.choice:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.choice-key{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:var(--panel-2);font-weight:850;font-size:12px}
.choice.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice.dim{opacity:.6}
.feedback{margin-top:16px;padding:15px;border-radius:14px;display:none}
.feedback.show{display:block}
.feedback.correct{background:var(--good-bg);color:var(--good)}
.feedback.wrong{background:var(--bad-bg);color:var(--bad)}
.feedback strong{display:block;margin-bottom:4px}
.detail-toggle{margin-top:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:750}
.detail-toggle:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.detail-panel{display:none;margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);overflow-wrap:anywhere}
.detail-panel.show{display:block}
.detail-panel h4{margin:18px 0 6px;font-size:12px;font-weight:850;letter-spacing:.06em;color:var(--accent)}
.detail-panel h4:first-child{margin-top:0}
.detail-panel p{margin:0}
.detail-panel ol{margin:0;padding-left:20px}
.detail-panel li{margin:6px 0}
.detail-choice{margin-top:8px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.detail-choice strong{display:block;margin-bottom:3px;font-size:12px}
.detail-output{margin-top:8px;color:var(--muted);font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.detail-takeaway{margin-top:18px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
.quiz-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 24px}
.stat{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}
.stat-value{font-size:28px;font-weight:900;letter-spacing:-.04em}
.stat-label{font-size:12px;color:var(--muted)}
.progressbar{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:8px}
.progressbar>div{height:100%;background:var(--accent);border-radius:inherit}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.mobile-tabs{display:none}
.kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:2px 5px;color:var(--muted)}
.footer-note{margin-top:30px;color:var(--muted);font-size:12px}
@media (max-width:820px){
  .top-progress span{display:none}
  .shell{display:block}
  .sidebar{display:none}
  .main{padding:22px 14px calc(96px + env(safe-area-inset-bottom))}
  .hero{display:block}
  .note-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:13px 11px}
  .stat-value{font-size:22px}
  .mobile-tabs{position:fixed;z-index:60;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
  .mobile-tab{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 4px;font-size:12px;font-weight:750}
  .mobile-tab.active{background:var(--accent-soft);color:var(--accent)}
  .toolbar{position:sticky;top:74px;z-index:20;background:var(--bg);padding:5px 0}
  .choice{min-height:58px}
}
@media (max-width:480px){
  .brand .brand-text{display:none}
  .topbar{padding:0 12px}
  h1{font-size:31px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1/-1}
  pre{font-size:12.5px;padding:15px}
}

.mobile-learn-nav{display:none;gap:8px;margin-bottom:14px}
.track-progress-list{display:grid;gap:10px}
.track-progress-row{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.track-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.danger-btn{border:1px solid color-mix(in srgb,var(--bad) 55%,var(--line));background:transparent;color:var(--bad)}
@media (max-width:820px){
  .mobile-learn-nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mobile-learn-nav .select{min-width:0;width:100%}
}

/* ---------- 実装練習 ---------- */
.pfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.pfilters .select{width:100%;min-width:0}
.psummary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
@media (max-width:640px){.psummary{grid-template-columns:1fr 1fr}}
.pcard-list{display:grid;gap:10px}
.pcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:14px 15px;display:grid;gap:7px}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pcard-title{font-weight:800;letter-spacing:-.01em}
.pcard-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptag{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.ptag.lv1{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ptag.lv2{background:#e8f1ff;color:#2563b8;border-color:transparent}
.ptag.lv3{background:#fff2e0;color:#a35a00;border-color:transparent}
.ptag.lv4{background:#ffe9ef;color:#b32a51;border-color:transparent}
[data-theme="dark"] .ptag.lv2{background:#132339;color:#8bb8ff}
[data-theme="dark"] .ptag.lv3{background:#2f2312;color:#f0b769}
[data-theme="dark"] .ptag.lv4{background:#331824;color:#ff9fbb}
.ptag.solved{background:var(--good-bg);color:var(--good);border-color:transparent}
.ptag.review{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pnext{border:1px solid var(--accent);background:var(--accent-soft);border-radius:15px;padding:15px;margin-bottom:16px;display:grid;gap:8px}
.pblock-list{display:grid;gap:8px;margin:12px 0}
.pblock{display:flex;gap:10px;align-items:stretch;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:9px 10px}
.pblock.picked{border-color:var(--accent);background:var(--accent-soft)}
.pblock.dragging{opacity:.45}
.pblock.dropover{border-color:var(--accent);border-style:dashed}
.pblock-index{flex:0 0 26px;display:grid;place-items:center;height:26px;border-radius:8px;background:var(--panel-2);font:800 12px/1 ui-monospace,monospace;color:var(--muted)}
.pblock-code{flex:1;min-width:0;overflow-x:auto;white-space:pre;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;-webkit-overflow-scrolling:touch}
.pblock-actions{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.picon{width:34px;height:34px;min-width:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);display:grid;place-items:center;font-size:13px;line-height:1}
.picon:hover{border-color:var(--accent);color:var(--accent)}
.picon:disabled{opacity:.35;cursor:not-allowed}
.picon:focus-visible,.pcard:focus-visible,.pline:focus-visible,.pchoice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pslot-label{font-size:12px;font-weight:800;color:var(--muted);margin-top:14px}
.pempty-slot{border:1px dashed var(--line);border-radius:13px;padding:14px;color:var(--muted);font-size:13px;text-align:center}
.pline{display:flex;gap:10px;width:100%;text-align:left;border:1px solid transparent;border-bottom:1px solid var(--line);background:transparent;color:var(--code-text);padding:6px 8px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;border-radius:8px}
.pline:last-child{border-bottom:0}
.pline-no{flex:0 0 26px;color:#8b93a7;text-align:right}
.pline-code{flex:1;min-width:0;overflow-x:auto;white-space:pre}
.pline.picked{background:#26304a;border-color:var(--accent)}
.pline.correct{background:#123a26;border-color:var(--good)}
.pline.wrong{background:#3a1a1a;border-color:var(--bad)}
.pcode-frame{margin:12px 0 0;padding:14px 10px;border-radius:15px;background:var(--code);overflow:auto}
.pchoice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 13px;border-radius:13px;min-height:52px}
.pchoice:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pchoice.picked{border-color:var(--accent);background:var(--accent-soft)}
.pchoice.correct{background:var(--good-bg);border-color:var(--good)}
.pchoice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.pchoice-key{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--panel-2);font-weight:850;font-size:12px}
.pchoice-body{flex:1;min-width:0}
.pchoice-code{overflow-x:auto;white-space:pre;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.pblank-line{display:block}
.blank-select{display:inline-block;max-width:min(100%,320px);border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--text);padding:3px 6px;font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;vertical-align:baseline}
.blank-select.filled{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pmatch-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pmatch-row:last-child{border-bottom:0}
.pmatch-row .select{width:100%;min-width:0}
@media (max-width:560px){.pmatch-row{grid-template-columns:1fr;gap:6px}}
.pshort{width:100%;min-height:90px;border:1px solid var(--line);border-radius:13px;background:var(--panel-2);color:var(--text);padding:12px;font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;resize:vertical}
.pshort:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ptests{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;display:block;overflow-x:auto;white-space:nowrap}
.ptests th,.ptests td{border:1px solid var(--line);padding:7px 10px;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.ptests th{background:var(--panel-2);font-size:12px}
.phints{display:grid;gap:8px;margin-top:14px}
.phint{padding:12px 14px;border-radius:13px;background:var(--panel-2);border-left:4px solid var(--accent)}
.phint strong{display:block;font-size:12px;margin-bottom:3px;color:var(--accent)}
.pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pactions .btn{flex:0 0 auto}
.pmeta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pskill-list{display:grid;gap:9px}
.pskill-row{display:grid;gap:5px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.pskill-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px}
.pnote{margin-top:12px;font-size:12px;color:var(--muted)}
.psolution{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}
.psolution h4{margin:16px 0 6px;font-size:12px;font-weight:850;letter-spacing:.06em;color:var(--accent)}
.psolution h4:first-child{margin-top:0}
.psolution ol,.psolution ul{margin:0;padding-left:20px}
.psolution li{margin:6px 0}
.psolution p{margin:0;overflow-wrap:anywhere}
@media (max-width:820px){
  .mobile-tabs{grid-template-columns:repeat(5,1fr)}
  .mobile-tab{font-size:11px;padding:8px 2px}
  .pblock-code,.pline-code,.pchoice-code{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">S</div><span class="brand-text">Swift Learning Lab <small style="color:var(--muted)">v0.4</small></span></div>
    <div class="top-progress"><span id="topProgressText">0問回答</span><strong id="topAccuracy">—</strong></div>
    <button class="icon-btn" id="themeBtn" aria-label="テーマ切替">◐</button>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Mode</div>
      <button class="mode-btn active" data-mode="learn">📘 <span>学ぶ</span></button>
      <button class="mode-btn" data-mode="quiz">⚡ <span>問題を解く</span><span class="badge" id="quizCountBadge"></span></button>
      <button class="mode-btn" data-mode="practice">🛠 <span>実装練習</span><span class="badge" id="practiceCountBadge"></span></button>
      <button class="mode-btn" data-mode="review">↻ <span>間違い復習</span><span class="badge" id="wrongBadge">0</span></button>
      <button class="mode-btn" data-mode="progress">▦ <span>進捗</span></button>

      <div class="side-label">Track</div>
      <div id="trackNav"></div>

      <div class="side-label" id="lessonLabel">Lessons</div>
      <div id="lessonNav"></div>
    </aside>

    <main class="main">
      <div class="container" id="content"></div>
    </main>
  </div>

  <nav class="mobile-tabs" aria-label="モバイルナビゲーション">
    <button class="mobile-tab active" data-mode="learn">📘<br>学ぶ</button>
    <button class="mobile-tab" data-mode="quiz">⚡<br>問題</button>
    <button class="mobile-tab" data-mode="practice">🛠<br>実装</button>
    <button class="mobile-tab" data-mode="review">↻<br>復習</button>
    <button class="mobile-tab" data-mode="progress">▦<br>進捗</button>
  </nav>
</div>

<script>

。", "評価とは、式を計算して1つの値にすること。", "+ 足す、- 引く、* かける、/ わる。* と / が + と - より先に計算される。", "評価結果は名前に入れたり、print で表示したりできる。"], "code": "let sets = 3\nlet reps = 10\nlet total = sets * reps\nprint(total)", "why": "画面に出す数値のほとんどは、その場で計算された評価結果。式のどこが先に計算されるかを読めれば、数値がずれる原因を追える。", "pitfall": "* と / は + と - より先に計算される。順番を変えたいときは ( ) でまとめる。", "questions": [{"id": "q-starter-022", "difficulty": "Starter", "prompt": "このコードの出力はどれですか？", "code": "print(2 + 3 * 4)", "choices": ["20", "14", "24", "9"], "answer": 1, "explanation": "* が + より先に計算されます。3 * 4 = 12、それに 2 を足して 14 になります。", "detail": {"concept": "式とは、計算されて1つの値になる書き方のことです。計算されて1つの値に決まることを「評価」と呼びます。* と / は + と - より先に計算されます（算数と同じ順番です）。", "steps": ["まず 3 * 4 が計算されて 12 になる。", "次に 2 + 12 が計算されて 14 になる。", "print はその結果 14 を表示する。"], "whyCorrect": "掛け算が先に計算されるため、答えは 14 になります。", "otherChoices": [{"choice": "20", "reason": "左から順に 2 + 3 = 5、5 * 4 = 20 と計算すると出る答えです。書かれた順ではなく、* が先というきまりがあります。"}, {"choice": "24", "reason": "2 * 3 * 4 と考えると出る答えですが、最初の記号は + です。"}, {"choice": "9", "reason": "2 + 3 + 4 と考えると出る答えですが、2つ目の記号は * です。"}], "example": {"code": "print((2 + 3) * 4)", "output": "20", "explanation": "( ) で囲むと、その中が先に計算されます。順番を変えたいときに使います。"}, "takeaway": "* と / が先。順番を変えたいときは ( )。"}}, {"id": "q-starter-023", "difficulty": "Starter", "prompt": "このコードの出力はどれですか？", "code": "let sets = 3\nlet reps = 10\nprint(sets * reps)", "choices": ["3", "10", "30", "310"], "answer": 2, "explanation": "sets には 3、reps には 10 が入っています。sets * reps は 3 * 10 と評価され 30 になります。", "detail": {"concept": "名前を付けた値は、その名前を書くだけで計算に使えます。計算のときは、名前がその中身の値に置き換わってから計算されます。", "steps": ["1行目で sets に 3 が入る。", "2行目で reps に 10 が入る。", "3行目で sets * reps が 3 * 10 として計算され、30 になる。", "print はその結果 30 を表示する。"], "whyCorrect": "sets の中身は 3、reps の中身は 10 なので、掛け合わせると 30 になります。", "otherChoices": [{"choice": "3", "reason": "sets の中身だけが表示されると考えると出る答えですが、print の中身は sets * reps という計算です。"}, {"choice": "10", "reason": "同じく reps の中身だけを見た場合の答えです。"}, {"choice": "310", "reason": "3 と 10 が文字としてつながると考えると出る答えですが、どちらも数の値なので掛け算になりま う機能として覚えるとキリがない。「文脈で意味が決まる」と分かれば、初めて見る書き方でも前後から意味を推測できる。", "pitfall": "記号を1つの意味だけで覚えると、別の文脈で出てきたときに読めなくなる。まず前後の行を見る。", "questions": [{"id": "q-starter-058", "difficulty": "Starter", "prompt": "1行目の let と2行目の let の違いの説明として正しいのはどれですか？", "code": "let base: Int? = 3\nif let value = base {\n  print(value)\n}", "choices": ["どちらも新しい名前に値を入れる宣言だが、2行目は Optional の中身を取り出す形", "どちらもまったく同じ意味", "1行目は取り出し、2行目は宣言", "2行目の let は書かなくてもよい"], "answer": 0, "explanation": "1行目は値に名前を付ける普通の宣言です。2行目の if let は Optional の中身がある場合だけ取り出して名前を付ける形で、役割が違います。", "detail": {"concept": "同じ let でも、書かれる場所によって役割が変わります。1行目の let は「新しい名前を作って値を入れる」宣言です。2行目の if let は「中身があれば取り出して、新しい名前に入れる」という取り出しの形で、失敗することもあります。", "steps": ["1行目: base という名前が作られ、Int?（数が入っているか nil）として 3 が入る。", "2行目: if let が base の中身を取り出そうとする。", "取り出せたので value という名前に 3 が入り、{ } の中が実行される。"], "whyCorrect": "どちらも「新しい名前に値を入れる」点は共通ですが、2行目は Optional から中身を取り出し、取り出せたときだけ先に進むという条件付きの動きが加わっています。", "otherChoices": [{"choice": "どちらもまったく同じ意味", "reason": "1行目は必ず成功しますが、2行目は中身が nil なら取り出せず { } が実行されません。この違いがあります。"}, {"choice": "1行目は取り出し、2行目は宣言", "reason": "説明が逆になっています。"}, {"choice": "2行目の let は書かなくてもよい", "reason": "let を書かないと「取り出して新しい名前に入れる」形になりません。"}], "example": {"code": "let base: Int? = nil\nif let value = base {\n  print(value)\n} else {\n  print(\"値なし\")\n}", "output": "値なし", "explanation": "同じ if let でも、中身が nil なら取り出しに失敗します。普通の let 宣言は必ず成功するので、ここが大きな違いです。"}, "takeaway": "let は場所によって「作る」と「取り出す」に変わる。"}}, {"id": "q-starter-059", "difficulty": "Starter", "prompt": "このコードの ( ) のうち、value + 1 を囲んでいるものの役割はどれですか？", "code": "let value = 3\nprint((value + 1) * 2)", "choices": ["関数の呼び出し", "引数リストの宣言", "計算の順番をまとめる", "Optional を表す"], "answer": 2, "explanation": "( ) は文脈で役割が変わります。ここでは先に value + 1 を計算させるためのまとまりで、結果 4 * 2 = 8 が表示されます。", "detail": {"concept": "( ) も場所によって役割が変わります。関数の定義では受け取る値を並べる場所、関数の呼び出しでは「実行して」の合図、計算の中では「ここを先に計算する」というまとまりを表します。", "steps": ["内側の (value + 1) が先に計算され、3 + 1 で 4 になる。", "次に 4 * 2 が計算され、8 になる。", "外側の ( ) は print を呼び出す合図で、計算のまとまりではない。", "print が 8 を表示する。"], "whyCorrect": "内側の ( ) は、掛け算より先に足し算をさせるためのまとまりです。同じ1行の中で、外側と内側の ( ) が別々の役割を持っています。", "otherChoices": [{"choice": "関数の呼び出し", "reason": "それは print の直後にある外側の ( ) の役割です。同じ行に両方の使い方が出てきています。"}, {"choice": "引数リストの宣言", "reason": "それは func で関数を定義するときの ( ) の役割です。ここは定義ではありません。"}, {"choice": "Optional を表す", "reason": "Optional を表すのは型名の後ろの ? です。( ) とは別の記号です。"}], "takeaway": "( ) は場所しだいで、呼び出し・引数・計算のまとまりに変わる。"}}, {"id": "q-starter-060", "difficulty": "Starter", "prompt": "{ } の意味の説明として正しいのはどれですか？", "code": "let isMember = true\nlet counts = [2, 3, 1]\nif isMember {\n  print(\"会員\")\n}\nfor count in counts {\n  print(count)\n}", "choices": ["if では条件、for では配列を表す", "どちらも処理のまとまりと有効範囲を表し、何の範囲かは直前の行で決まる", "if の { } だけが処理のまとまり", "{ } は飾りで意味はない"], "answer": 1, "explanation": "{ } はいつでも「処理のまとまりとその中で有効な名前の範囲」を表します。それが条件付き実行なのか繰り返しなのかは、直前の if や for が決めます。", "detail": {"concept": "{ } はどこに出てきても「処理のまとまりと、その中で有効な名前の範囲」を表します。ただし、そのまとまりが「条件付きで1回だけ実行される」のか「繰り返し実行される」のかは、直前に書かれた if や for が決めます。", "steps": ["if isMember { ... } は、条件が true のときに中を1回だけ実行する。", "for count in counts { ... } は、要素の数だけ中を繰り返し実行する。", "どちらの { } も、中で作った名前は外から使えないという点は共通している。"], "whyCorrect": "{ } 自体の意味は変わりません。変わるのは「どういうときに、何回実行されるか」で、それを決めているのは直前の行です。記号の意味を1つに決めつけず、前後を見て読むことが大切です。", "otherChoices": [{"choice": "if では条件、for では配列を表す", "reason": "条件は if の後ろ、配列は in の後ろに書かれていて、どちらも { } の外側です。{ } はその後ろのまとまりを表します。"}, {"choice": "if の { } だけが処理のまとまり", "reason": "for や func の { } も同じくまとまりです。同じ記号が同じ役割で使われています。"}, {"choice": "{ } は飾りで意味はない", "reason": "{ } を消すと、どこまでが条件や繰り返しの対象なのか分からなくなります。範囲を示す大切な記号です。"}], "takeaway": "{ } は常に「まとまり」。回数や条件は直前の行が決める。"}}]}]}, {"id": "swift", "name": "Swift Language", "subtitle": "言語そのものを理解する", "description": "完全初学者から中級まで。データ型・制御フロー・型設計・Protocol・Generics・Macro・Memory Safetyまで、Swift言語を体系的に学ぶ。", "lessons": [{"id": "swift-values-types", "level": "Beginner", "title": "値・let / var・型・型推論", "summary": "Swiftの土台。値に名前を付け、型で安全性を確保する仕組みを理解する。", "mental": "変数は「箱」よりも、「値に付けた名前」と考えると後で理解しやすい。let は再代入できない名前、var は再代入できる名前。", "points": ["let は再代入不可、var は再代入可能。", "Int / Double / String / Bool は代表的な基本型。", "型推論により、明示しなくても Swift が型を判断できる。", "Swift は型安全で、意味の合わない値の操作をコンパイル時に多く検出する。"], "code": "let userName = \"Yuki\"\nvar score = 10\nscore += 5\n\nlet isPassed = score >= 12\nprint(\"\\(userName): \\(score), \\(isPassed)\")", "why": "アプリが大きくなるほど、「この値は変化するのか」「何型なのか」が設計そのものになる。SwiftUI の状態管理や API モデルでもこの基礎がそのまま使われる。", "pitfall": "プログラミングの = は「等しい」ではなく、右辺を評価して左辺へ代入する演算。", "questions": [{"id": "q-swift-001", "difficulty": "Beginner", "prompt": "このコードの出力は？", "code": "var score = 10\nscore += 5\nprint(score)", "choices": ["5", "10", "15", "コンパイルエラー"], "answer": 2, "explanation": "score は var なので変更可能。`score += 5` は `score = score + 5` と同じ意味で、10 + 5 = 15。", "detail": {"concept": "var は後から中身を入れ替えられる名前を作ります。`+=` は複合代入演算子と呼ばれ、`score += 5` は `score = score + 5` の短い書き方です。左の名前の今の値に右の値を足して、その結果を同じ名前に入れ直します。", "steps": ["1行目で score に 10 が入る。", "2行目の score += 5 は score = score + 5 と同じで、10 + 5 = 15 が score に入り直る。", "3行目の print はその時点の値 15 を表示する。"], "whyCorrect": "`+=` は「足してから入れ直す」操作なので、print の時点で score は 15 になっています。", "otherChoices": [{"choice": "5", "reason": "足す側の 5 だけを見た場合の答えです。`+=` の結果は「元の値 + 5」なので 5 単独にはなりません。"}, {"choice": "10", "reason": "`+=` の行が無かった場合の値です。この行は score 自身を書き換えるので、10 のままにはなりません。"}, {"choice": "コンパイルエラー", "reason": "score は var なので書き換えは正しい操作です。let で宣言していれば、この 2 行目がコンパイルエラーになります。"}], "takeaway": "`x += n` は `x = x + n` の短縮形。"}}, {"id": "q-swift-002", "difficulty": "Beginner", "prompt": "コンパイルエラーになるものは？", "code": "let name = \"Swift\"\n// 次のうち name に対して不可能なのは？", "choices": ["print(name)", "let copy = name", "name = \"UIKit\"", "print(\"\\(name)!\")"], "answer": 2, "explanation": "`let` で宣言した name には再代入できない。読み取りや別の定数への代入は可能。", "detail": {"concept": "let で宣言した名前は「一度決めたら変えない」という約束付きです。読み取り・コピー・文字列への埋め込みはいくらでもできますが、その名前自体に別の値を入れ直すことだけができません。`\\(...)` は文字列補間で、文字列の中に値を差し込む書き方です。", "whyCorrect": "再代入だけが let の約束を破ります。Swift はこれをコンパイル時（プログラムを動かす前）に検出するので、実行以前にビルドが失敗します。", "otherChoices": [{"choice": "print(name)", "reason": "値を読み取って表示するだけの操作です。let は読み取りを禁止しません。"}, {"choice": "let copy = name", "reason": "name の値を別の定数へコピーしています。元の name は変わらないため問題ありません。"}, {"choice": "print(\"\\(name)!\")", "reason": "文字列補間で name の中身を文字列に差し込んでいるだけで、name 自体は書き換えていません。"}], "example": {"code": "var name = \"Swift\"\nname = \"UIKit\"\nprint(name)", "output": "UIKit", "explanation": "書き換える予定があるなら var を使います。逆に書き換えない値を let にしておくと、意図しない変更をコンパイル時に止められます。"}, "takeaway": "let は再代入だけを禁止する。読み取りとコピーは自由。"}}]}, {"id": "swift-numbers-conversion", "level": "Beginner", "title": "数値型・型変換・オーバーフロー", "summary": "Int / UInt / Double / Float の違いと、安全な型変換を理解する。", "mental": "同じ『数字』でも型が違えば別物。Swiftは暗黙変換を控えめにして、意図しない計算を防ぐ。", "points": ["Intは一般的な整数、UIntは負数を持たない整数。", "Doubleは通常の小数計算で第一候補。", "異なる数値型同士は明示変換が必要な場合が多い。", "整数演算は範囲外になるとオーバーフローする。"], "code": "let count: Int = 3\nlet price: Double = 120.5\nlet total = Double(count) * price", "why": "API値、JSON、画面入力、計算結果で型がずれることは多い。変換の意味を理解するとバグを減らせる。", "pitfall": "`Int(3.9)` は丸めではなく小数部分を切り捨てる。", "questions": [{"id": "q-swift-025", "difficulty": "Beginner", "prompt": "result の型と値は？", "code": "let a = 3\nlet b = 2.5\nlet result = Double(a) + b", "choices": ["Intの5", "Doubleの5.5", "Floatの5.5", "コンパイルエラー"], "answer": 1, "explanation": "aをDoubleへ明示変換しているため5.5。", "detail": {"concept": "Swift は数値型どうしを自動では変換しません。Int と Double を混ぜて計算したいときは、`Double(a)` のように書いて明示的に変換します。これは「Int の a から Double の値を新しく作る」という意味です。", "steps": ["a は 3（Int）、b は 2.5（Double）。", "Double(a) で 3 から 3.0（Double）が作られる。", "3.0 + 2.5 は Double どうしの足し算なので 5.5（Double）になる。", "result は型を書いていないので、右辺の型から Double と推論される。"], "whyCorrect": "両辺が Double に揃ってから計算されるため、結果は Double の 5.5 です。", "otherChoices": [{"choice": "Intの5", "reason": "整数に丸められた場合の答えです。Double どうしの計算結果は小数部分を保ったままになります。"}, {"choice": "Floatの5.5", "reason": "Float も小数を扱う型ですが、Swift が小数リテラルから推論する既定の型は Double です。Float にしたいときは明示的に指定します。"}, {"choice": "コンパイルエラー", "reason": "`Double(a) + b` は型が揃っているため正しいコードです。`a + b` と書いた場合は Int と Double が混在してコンパイルエラーになります。"}], "takeaway": "型が違う数値は、計算前に明示変換で揃える。"}}, {"id": "q-swift-026", "difficulty": "Basic", "prompt": "Int(3.9) の結果は？", "code": "let value = Int(3.9)", "choices": ["3", "4", "3.9", "nil"], "answer": 0, "explanation": "小数部分が切り捨てられて3になる。", "detail": {"concept": "`Int(3.9)` は Double から Int を作る変換です。この変換は四捨五入ではなく、小数点以下を捨てて 0 に近づける「切り捨て」を行います。", "whyCorrect": "3.9 の小数部分 0.9 が捨てられ、整数部分の 3 だけが残ります。", "otherChoices": [{"choice": "4", "reason": "四捨五入だと考えると出る答えです。四捨五入したい場合は `Int(3.9.rounded())` のように、丸めてから変換します。"}, {"choice": "3.9", "reason": "Int は整数専用の型なので、3.9 のまま保持することはできません。"}, {"choice": "nil", "reason": "文字列から数値へ変換する `Int(\"abc\")` は失敗して nil になりますが、Double からの変換は必ず成功するため nil にはなりません。"}], "example": {"code": "print(Int(3.9))\nprint(Int(-3.9))\nprint(Int(3.9.rounded()))", "output": "3\n-3\n4", "explanation": "切り捨ては「小さいほうへ」ではなく「0 に近づく方向」です。負の数では -3.9 が -3 になります。四捨五入したいときは rounded() を挟みます。"}, "takeaway": "Int(小数) は四捨五入ではなく 0 方向への切り捨て。"}}]}, {"id": "swift-tuples-typealias", "level": "Beginner", "title": "Tuple・Typealias", "summary": "複数値を一時的にまとめるTupleと、型へ分かりやすい別名を付けるTypealiasを学ぶ。", "mental": "Tupleは『小さな一時セット』。長く意味を持つデータならstructを検討する。", "points": ["Tupleは複数値を1つにまとめる。", "要素へ名前を付けられる。", "分解代入ができる。", "typealiasは既存型へ意味のある別名を付ける。"], "code": "let user = (name: \"Yuki\", score: 90)\ntypealias UserID = String\nlet id: UserID = \"u-001\"", "why": "関数から複数値を返すときや複雑な型を読みやすくするときに使う。", "pitfall": "Tupleが大きくなったらstructへ移す方が保守しやすい。", "questions": [{"id": "q-swift-027", "difficulty": "Beginner", "prompt": "出力は？", "code": "let point = (x: 2, y: 5)\nprint(point.y)", "choices": ["2", "5", "x", "コンパイルエラー"], "answer": 1, "explanation": "名前付きTupleのy要素は5。", "detail": {"concept": "Tuple は複数の値を1つにまとめた軽量な入れ物です。`(x: 2, y: 5)` のように要素へ名前を付けると、`point.y` のように名前で取り出せます。型を新しく定義するほどではない、その場限りの組み合わせに向いています。", "steps": ["point には x = 2、y = 5 の 2 要素が入る。", "point.y は名前 y の要素、つまり 5 を取り出す。", "print が 5 を表示する。"], "whyCorrect": "`.y` は名前による取り出しなので、y に対応する 5 が表示されます。", "otherChoices": [{"choice": "2", "reason": "x 側の値です。`point.x` と書いた場合にこちらが取り出されます。"}, {"choice": "x", "reason": "x は要素の名前であって値ではありません。名前がそのまま表示されることはありません。"}, {"choice": "コンパイルエラー", "reason": "名前付き Tuple への `.y` アクセスは正しい書き方です。"}], "takeaway": "名前付き Tuple は `.名前` で取り出せる。"}}, {"id": "q-swift-028", "difficulty": "Basic", "prompt": "typealias の説明として正しいものは？", "code": "typealias UserID = String", "choices": ["新しい実行時型を作る", "StringにUserIDという別名を付ける", "Stringを継承する", "Optionalに変換する"], "answer": 1, "explanation": "typealiasは既存型の別名。", "detail": {"concept": "typealias は既存の型に別名を付ける機能です。`typealias UserID = String` と書くと、以降 UserID と書いても String と書いても同じ型を指します。新しい型が生まれるわけではなく、コードの意図を読み取りやすくするための仕組みです。", "whyCorrect": "UserID は String の言い換えにすぎません。関数の引数に `UserID` と書けば「単なる文字列ではなく利用者の識別子だ」と読み手に伝わります。", "otherChoices": [{"choice": "新しい実行時型を作る", "reason": "実行時に別の型として区別されることはありません。UserID と String は完全に同じ型として扱われ、互いに代入できます。区別したいなら struct でラップします。"}, {"choice": "Stringを継承する", "reason": "String は struct なので継承できません。typealias は継承とは無関係です。"}, {"choice": "Optionalに変換する", "reason": "Optional にするのは型名の後ろの `?` です。typealias 自体は値の有無を変えません。"}], "takeaway": "typealias は別名。型が増えるわけではない。"}}]}, {"id": "swift-operators-strings", "level": "Beginner", "title": "演算子・比較・論理式", "summary": "算術・比較・論理演算子を組み合わせ、条件や計算結果を作る。", "mental": "式は「値を生み出すもの」。`score >= 60` も Bool という値を生み出す式。", "points": ["+ - * / % で算術演算。", "== != > < >= <= は Bool を返す。", "&& は AND、|| は OR、! は NOT。", "文字列補間 `\\(value)` で値を String に埋め込める。"], "code": "let price = 1200\nlet count = 3\nlet total = price * count\nlet message = \"合計は\\(total)円です\"\nprint(message)", "why": "if や guard の条件も最終的には Bool を作る式。比較演算を理解すると制御フローが自然に読める。", "pitfall": "`=` は代入、`==` は比較。混同しない。", "questions": [{"id": "q-swift-003", "difficulty": "Beginner", "prompt": "result の値は？", "code": "let a = 10\nlet b = 3\nlet result = a % b\nprint(result)", "choices": ["0", "1", "3", "3.333..."], "answer": 1, "explanation": "`%` は剰余（余り）。10 ÷ 3 の余りは 1。", "detail": {"concept": "`%` は剰余演算子で、割り算の「余り」を求めます。Int どうしの `/` が商（小数切り捨て）を返すのに対し、`%` は割り切れずに残った分を返します。", "steps": ["a は 10、b は 3。", "10 ÷ 3 は商が 3、余りが 1。", "`a % b` は余りの側なので 1 になり、print が 1 を表示する。"], "whyCorrect": "10 = 3 × 3 + 1 なので、余りは 1 です。偶数判定（`n % 2 == 0`）など実務でもよく使います。", "otherChoices": [{"choice": "0", "reason": "割り切れる場合の余りです。10 は 3 で割り切れません。"}, {"choice": "3", "reason": "`a / b` の商が 3 です。`%` は商ではなく余りを返します。"}, {"choice": "3.333...", "reason": "小数で割った結果です。Int どうしの計算に小数は現れず、`%` は常に整数の余りを返します。"}], "takeaway": "`/` は商、`%` は余り。"}}, {"id": "q-swift-004", "difficulty": "Beginner", "prompt": "isValid は最終的に何になる？", "code": "let age = 20\nlet hasTicket = false\nlet isValid = age >= 18 && hasTicket", "choices": ["true", "false", "nil", "コンパイルエラー"], "answer": 1, "explanation": "`&&` は両方が true のときだけ true。年齢条件は true だが hasTicket が false なので false。", "detail": {"concept": "`&&` は論理積で、左右の両方が true のときだけ true になります。`>=` の比較結果は Bool なので、比較と `&&` を組み合わせて複数条件をまとめられます。", "steps": ["age >= 18 は 20 >= 18 なので true。", "hasTicket は false。", "true && false は、片方が false なので全体が false。", "isValid には false が入る。"], "whyCorrect": "`&&` は「かつ」です。年齢条件を満たしていてもチケットが無いため、両方を満たす必要のある条件は成立しません。", "otherChoices": [{"choice": "true", "reason": "`||`（または）だった場合の結果です。どちらか一方でも true なら true になる演算子は `||` です。"}, {"choice": "nil", "reason": "Bool どうしの計算結果は必ず true か false になり、nil にはなりません。nil が現れるのは Optional を扱うときです。"}, {"choice": "コンパイルエラー", "reason": "比較結果は Bool なので `&&` にそのまま渡せます。型は合っています。"}], "takeaway": "`&&` は両方 true のときだけ true。"}}]}, {"id": "swift-strings-unicode", "level": "Basic", "title": "String・Character・Unicode", "summary": "Swiftの文字列がUnicodeを正しく扱うことと、文字列indexが整数ではない理由を理解する。", "mental": "見た目の1文字は内部で複数のUnicode scalarから構成されることがある。", "points": ["StringはUnicode対応。", "Characterは人が認識する1文字に近い単位。", "String.Indexを使って安全に位置へアクセスする。", "prefix / suffix / splitなど実用操作を覚える。"], "code": "let text = \"Swift🍎\"\nprint(text.count)\nprint(text.prefix(5))", "why": "ユーザー入力、検索、表示名、API文字列など、文字列処理はどのアプリでも必須。", "pitfall": "`text[0]` のようなInt添字アクセスはできない。", "questions": [{"id": "q-swift-029", "difficulty": "Basic", "prompt": "先頭1文字を安全に取得する代表的な方法は？", "code": "let text = \"Swift\"", "choices": ["text[0]", "text.first", "text[Int(0)]", "text.byte(0)"], "answer": 1, "explanation": "firstはCharacter?を返す。", "detail": {"concept": "Swift の String は「1文字が必ず同じバイト数」ではないため、`text[0]` のような整数の添字アクセスができません。代わりに `first` を使います。first は空文字列の場合を考慮して Character? （Character か nil）を返します。", "whyCorrect": "`text.first` は空文字列でも安全に nil を返すため、範囲外アクセスでプログラムが止まる心配がありません。取り出した後は if let などで中身を確認して使います。", "otherChoices": [{"choice": "text[0]", "reason": "String は Int の添字に対応していないため、この書き方はコンパイルエラーになります。Swift では String.Index という専用の位置指定を使います。"}, {"choice": "text[Int(0)]", "reason": "Int(0) と書いても中身は Int のままなので、同じくコンパイルエラーです。"}, {"choice": "text.byte(0)", "reason": "byte(0) という API は String に用意されていません。バイト列として扱いたい場合は `text.utf8` を使います。"}], "example": {"code": "let text = \"Swift\"\nif let head = text.first {\n    print(head)\n}\nprint(\"\".first == nil)", "output": "S\ntrue", "explanation": "first は Character? を返すので if let で取り出します。空文字列では nil になり、クラッシュせずに「空だった」と判断できます。"}, "takeaway": "String に整数の添字は使えない。先頭は first。"}}, {"id": "q-swift-030", "difficulty": "Basic", "prompt": "text.count が数えるものとして最も近いのは？", "code": "let text = \"A🍎\"", "choices": ["UTF-8バイト数", "Characterとしての文字数", "メモリ容量", "ASCIIコード"], "answer": 1, "explanation": "String.countはCharacter単位の数を返す。", "detail": {"concept": "Swift の Character は「人が1文字と感じるまとまり」を表します。絵文字や結合文字は内部的に複数バイトでも 1 Character として数えられます。String.count はこの Character の個数を返します。", "whyCorrect": "\"A🍎\" は A と 🍎 の 2 Character なので count は 2 です。内部のバイト数とは一致しません。", "otherChoices": [{"choice": "UTF-8バイト数", "reason": "UTF-8 のバイト数を知りたい場合は `text.utf8.count` を使います。\"A🍎\" では A が 1 バイト、🍎 が 4 バイトで合計 5 になり、count の値とは異なります。"}, {"choice": "メモリ容量", "reason": "count は文字の個数であって、メモリ使用量を表す値ではありません。"}, {"choice": "ASCIIコード", "reason": "ASCII コードは1文字を表す数値であり、個数とは別の概念です。"}], "example": {"code": "let text = \"A🍎\"\nprint(text.count)\nprint(text.utf8.count)", "output": "2\n5", "explanation": "同じ文字列でも、Character 単位では 2、UTF-8 バイト単位では 5 です。文字数を扱うときはどちらの単位かを意識します。"}, "takeaway": "count は Character の個数。バイト数は utf8.count。"}}]}, {"id": "swift-control-flow", "level": "Beginner", "title": "if・switch・guard", "summary": "条件によって実行するコードを変える。", "mental": "制御フローは「次にどの道を通るか」を決める仕組み。条件式そのものは Bool。", "points": ["if / else if / else で条件分岐。", "switch は複数パターンを網羅的に扱うのが得意。", "guard は「条件を満たさないなら早く抜ける」ために使う。", "Swift の switch は原則としてすべてのケースを扱う必要がある。"], "code": "let score = 82\n\nswitch score {\ncase 90...100: print(\"A\")\ncase 70..<90: print(\"B\")\ndefault: print(\"C\")\n}", "why": "読みやすい分岐はバグを減らす。guard で異常系を先に処理すると、正常系のネストが浅くなる。", "pitfall": "switch の `case 70..<90` は 70 以上 90 未満。`...` と `..<` の違いに注意。", "questions": [{"id": "q-swift-005", "difficulty": "Beginner", "prompt": "出力は？", "code": "let score = 75\nif score >= 80 {\n    print(\"A\")\n} else if score >= 60 {\n    print(\"B\")\n} else {\n    print(\"C\")\n}", "choices": ["A", "B", "C", "何も出ない"], "answer": 1, "explanation": "75 >= 80 は false。次の 75 >= 60 が true なので B が出力され、その後の else は評価されない。", "detail": {"concept": "`else if` は上から順に条件を試し、最初に true になった枝だけを実行します。どれか1つが実行された時点で、残りの条件は調べられません。", "steps": ["score は 75。", "1つ目の条件 75 >= 80 は false なので A の枝は実行されない。", "2つ目の条件 75 >= 60 は true なので B が出力される。", "1つ実行されたので、最後の else は調べられず実行されない。"], "whyCorrect": "上から順に評価して最初に成立するのが 2 つ目の条件だからです。条件の順番を入れ替えると結果が変わる点に注意します。", "otherChoices": [{"choice": "A", "reason": "score が 80 以上のときの出力です。75 は届いていません。"}, {"choice": "C", "reason": "どの条件も false のときに実行される枝です。ここでは 2 つ目が成立しています。"}, {"choice": "何も出ない", "reason": "else があるため、必ずどれか 1 つの枝が実行されます。"}], "takeaway": "else if は上から順、最初に true の枝だけ実行。"}}, {"id": "q-swift-006", "difficulty": "Basic", "prompt": "この guard の役割として最も近いものは？", "code": "func greet(name: String?) {\n    guard let name else { return }\n    print(\"Hello, \\(name)\")\n}", "choices": ["name を必ず nil にする", "nil なら関数を早期終了する", "name をグローバル変数にする", "例外を投げる"], "answer": 1, "explanation": "guard let で Optional をアンラップし、nil なら return。以降では name を非 Optional として使える。", "detail": {"concept": "guard は「条件を満たさないなら、この先へ進まない」を表す書き方です。`guard let name else { return }` は Optional の中身を取り出し、取り出せなければ else の中で関数を抜けます。if let と違い、取り出した値は guard の後ろの行でもそのまま使えます。", "steps": ["引数 name は String?（文字列か nil）。", "guard let が中身を取り出そうとする。", "nil なら else の return が実行され、関数はここで終了する。", "取り出せた場合だけ次の行へ進み、name を非 Optional の String として使える。"], "whyCorrect": "guard の役割は「前提を満たさない場合に早めに抜ける」ことです。これにより、本筋の処理を深いネストにせず素直に書けます。", "otherChoices": [{"choice": "name を必ず nil にする", "reason": "guard let は nil を代入するのではなく、nil でないことを確認して中身を取り出します。"}, {"choice": "name をグローバル変数にする", "reason": "guard は変数の有効範囲を広げますが、関数の外から使えるグローバル変数を作るわけではありません。取り出した name が使えるのはこの関数の中だけです。"}, {"choice": "例外を投げる", "reason": "Swift の例外的な処理は throw / try で書きます。guard の else では return や throw などで確実に抜ければよく、必ず throw する必要はありません。"}], "takeaway": "guard は「ダメなら先に抜ける」。取り出した値は後の行でも使える。"}}]}, {"id": "swift-pattern-matching", "level": "Basic", "title": "Pattern Matching・where・if case", "summary": "switchを強力にするPattern Matchingを理解する。", "mental": "switchは『値が一致するか』だけでなく『形が一致するか』を判定できる。", "points": ["Range、Tuple、Enumのassociated valueを分解できる。", "whereでcaseへ追加条件を書ける。", "if case / guard caseで1patternだけ判定できる。", "Optionalもpattern matchingできる。"], "code": "let value = (200, \"OK\")\nswitch value {\ncase (200, let body): print(body)\ndefault: break\n}", "why": "enum中心の状態設計やレスポンス分岐で読みやすいコードを書くために重要。", "pitfall": "caseの順序で広いpatternが先に一致すると後ろへ到達しない。", "questions": [{"id": "q-swift-031", "difficulty": "Basic", "prompt": "body は何になる？", "code": "let value=(200,\"OK\")\nswitch value { case (200, let body): print(body); default: break }", "choices": ["200", "OK", "Tuple全体", "nil"], "answer": 1, "explanation": "2要素目をlet bodyで取り出す。", "detail": {"concept": "switch は値の形（パターン）に照らして分岐します。`case (200, let body)` は「1 つ目が 200 で、2 つ目は何でもよい。その 2 つ目を body という名前で取り出す」という意味です。この let をパターン内の値取り出しと呼びます。", "steps": ["value は (200, \"OK\") という 2 要素の Tuple。", "case (200, let body) と照合すると、1 つ目の 200 が一致する。", "2 つ目の \"OK\" が body という名前に取り出される。", "print(body) が OK を表示する。"], "whyCorrect": "パターンの中の `let body` は照合した値そのものを受け取る仕組みなので、body には 2 番目の要素 \"OK\" が入ります。", "otherChoices": [{"choice": "200", "reason": "1 つ目の要素はパターン側にリテラル 200 として書かれており、照合条件として使われています。body に入るのは 2 つ目です。"}, {"choice": "Tuple全体", "reason": "Tuple 全体を受け取りたい場合は `case let pair` のように書きます。ここでは要素ごとに分解しています。"}, {"choice": "nil", "reason": "パターンが一致して値も存在するため nil にはなりません。"}], "takeaway": "パターン内の let は、一致した部分を取り出す。"}}, {"id": "q-swift-032", "difficulty": "Intermediate", "prompt": "where の役割は？", "code": "case let x where x > 10:", "choices": ["型を作る", "一致した値へ追加条件を課す", "Optional化する", "ループ終了"], "answer": 1, "explanation": "pattern一致後に追加条件を適用する。", "detail": {"concept": "where はパターンが一致した後に、さらに条件を重ねるための書き方です。`case let x where x > 10:` は「値を x として受け取り、なおかつ x が 10 より大きいときだけこの case を選ぶ」という意味になります。", "whyCorrect": "パターンだけでは表せない「値の大小」などの条件を追加できます。where が false なら、その case は選ばれず次の case の照合に進みます。", "otherChoices": [{"choice": "型を作る", "reason": "where は条件を書く場所であり、型を定義する機能ではありません。なお generics の宣言では `where T: Equatable` のように型の制約を書く用途もありますが、これも新しい型を作るものではありません。"}, {"choice": "Optional化する", "reason": "Optional にするのは型の後ろの `?` です。where は値の有無を変えません。"}, {"choice": "ループ終了", "reason": "ループを抜けるのは break や return です。where は条件の指定だけを行います。"}], "example": {"code": "let score = 42\nswitch score {\ncase let x where x > 100:\n    print(\"over\")\ncase let x where x > 10:\n    print(\"normal \\(x)\")\ndefault:\n    print(\"low\")\n}", "output": "normal 42", "explanation": "1 つ目の case は where が false なので選ばれず、2 つ目で初めて条件が成立します。同じ `case let x` でも where によって選ばれ方が変わります。"}, "takeaway": "where はパターン一致の後に足す追加条件。"}}]}, {"id": "swift-loops-ranges", "level": "Beginner", "title": "for・while・Range", "summary": "同じ処理を繰り返し、コレクションを順番に処理する。", "mental": "for-in は「要素を1つずつ取り出して名前を付ける」。配列を読む基本動作。", "points": ["`1...3` は 1,2,3 を含む ClosedRange。", "`0..<3` は 0,1,2。配列インデックスと相性が良い。", "for-in は配列や Range の各要素を順番に処理する。", "while は条件が true の間だけ繰り返す。"], "code": "var total = 0\nfor number in 1...3 {\n    total += number\n}\nprint(total)", "why": "map / filter / reduce などの高階関数を理解する前に、for で何をしているのか追えることが重要。", "pitfall": "無条件の while や、条件を更新しない while は無限ループになり得る。", "questions": [{"id": "q-swift-007", "difficulty": "Beginner", "prompt": "出力は？", "code": "var total = 0\nfor i in 1...4 {\n    total += i\n}\nprint(total)", "choices": ["4", "6", "10", "11"], "answer": 2, "explanation": "1 + 2 + 3 + 4 = 10。`...` は終端の 4 を含む。", "detail": {"concept": "`1...4` は閉区間（Closed Range）で、終端の 4 を含む 1, 2, 3, 4 を表します。for-in はその値を先頭から順に取り出し、`total += i` は total にその値を足し込みます。", "steps": ["total は 0 から開始。", "i = 1 → total は 1。", "i = 2 → total は 3。", "i = 3 → total は 6。", "i = 4 → total は 10。ここで範囲が尽きてループ終了。"], "whyCorrect": "1 + 2 + 3 + 4 = 10 です。`...` は終端を含むため 4 まで加算されます。", "otherChoices": [{"choice": "4", "reason": "最後の i の値です。total は各回の合計なので、最後の値だけにはなりません。"}, {"choice": "6", "reason": "`1..<4`（4 を含まない）で 1 + 2 + 3 とした場合の答えです。`...` と `..<` の違いがここに出ます。"}, {"choice": "11", "reason": "0 から数え始めて 5 要素分足した場合などに出る値です。開始は 1 です。"}], "takeaway": "`...` は終端を含む、`..<` は含まない。"}}, {"id": "q-swift-008", "difficulty": "Basic", "prompt": "ループは何回実行される？", "code": "for _ in 0..<5 {\n    print(\"Swift\")\n}", "choices": ["4回", "5回", "6回", "無限"], "answer": 1, "explanation": "`0..<5` は 0,1,2,3,4 の5要素。アンダースコアは値を使わないことを表す。", "detail": {"concept": "`0..<5` は半開区間（Half-Open Range）で、開始の 0 を含み終端の 5 を含みません。つまり 0, 1, 2, 3, 4 の 5 要素です。`_` は「取り出した値を使わない」ことを示すワイルドカードで、回数だけ繰り返したいときに使います。", "whyCorrect": "要素が 5 つあるので、ループの中身は 5 回実行されます。0 から始まるので終端が 5 でも回数は 5 回である点が要注意です。", "otherChoices": [{"choice": "4回", "reason": "`1..<5` のように開始が 1 の場合の回数です。ここは 0 から始まります。"}, {"choice": "6回", "reason": "`0...5` のように終端を含めた場合の回数です。`..<` は終端を含みません。"}, {"choice": "無限", "reason": "範囲の要素数は有限なので、必ず終わります。無限に繰り返すのは `while true` のような書き方です。"}], "takeaway": "`0..<n` はちょうど n 回。"}}]}, {"id": "swift-functions", "level": "Basic", "title": "関数・引数・戻り値", "summary": "処理に名前を付け、入力と出力を明確にする。", "mental": "関数は「入力 → 処理 → 出力」の小さな機械。責務を小さくすると読みやすい。", "points": ["引数ラベルとパラメータ名は別にできる。", "`-> Type` が戻り値の型。", "副作用の少ない関数はテストしやすい。", "関数も型を持つため、変数に代入したり引数として渡せる。"], "code": "func total(price: Int, count: Int) -> Int {\n    price * count\n}\n\nlet result = total(price: 500, count: 3)", "why": "大きな処理を関数に分解すると、名前によって意図を表現でき、テスト単位も作りやすい。", "pitfall": "同じ型の引数が複数ある場合、ラベルを雑にすると呼び出し側で意味が分からなくなる。", "questions": [{"id": "q-swift-013", "difficulty": "Basic", "prompt": "result の値は？", "code": "func double(_ value: Int) -> Int {\n    value * 2\n}\nlet result = double(4)", "choices": ["2", "4", "8", "コンパイルエラー"], "answer": 2, "explanation": "`_` により呼び出し時の引数ラベルを省略できる。4 * 2 = 8。", "detail": {"concept": "関数の引数には呼び出し時に書くラベルを付けられます。`_ value: Int` の `_` は「ラベルを省略する」指定で、呼び出し側は `double(4)` と書けます。また、本体が 1 つの式だけの関数は return を省略でき、その式の値がそのまま戻り値になります。", "steps": ["double(4) の 4 が引数 value に渡る。", "本体は `value * 2` の 1 式だけなので、その結果が暗黙に返される。", "4 * 2 = 8 が result に入る。"], "whyCorrect": "ラベル省略と暗黙 return はどちらも書き方の話で、計算内容は 4 × 2 のままです。", "otherChoices": [{"choice": "2", "reason": "掛ける側の 2 です。戻り値は引数を 2 倍した結果です。"}, {"choice": "4", "reason": "渡した引数そのものです。関数の中で 2 倍されています。"}, {"choice": "コンパイルエラー", "reason": "`_` によるラベル省略も、1 式関数の暗黙 return も正しい Swift の書き方です。"}], "takeaway": "`_` はラベル省略。1 式だけの関数は return を省ける。"}}, {"id": "q-swift-014", "difficulty": "Basic", "prompt": "この関数の型として正しいものは？", "code": "func add(_ a: Int, _ b: Int) -> Int {\n    a + b\n}", "choices": ["Int", "(Int, Int) -> Int", "(Int) -> Int", "Void -> Int"], "answer": 1, "explanation": "Int を2つ受け取り Int を返すので、関数型は `(Int, Int) -> Int`。", "detail": {"concept": "Swift では関数そのものが値であり、型を持ちます。関数型は `(引数の型の並び) -> 戻り値の型` という形で書きます。引数ラベルは型には含まれません。", "whyCorrect": "add は Int を 2 つ受け取り Int を返すので、型は `(Int, Int) -> Int` です。この型の値は変数に入れたり、他の関数に渡したりできます。", "otherChoices": [{"choice": "Int", "reason": "戻り値の型だけを書いたものです。関数型には引数側の情報も必要です。"}, {"choice": "(Int) -> Int", "reason": "引数が 1 つの関数の型です。add は 2 つ受け取ります。"}, {"choice": "Void -> Int", "reason": "Swift で「引数なし」を表すのは `()` で、`() -> Int` と書きます。`Void -> Int` という書き方は使いません。"}], "takeaway": "関数型は (引数) -> 戻り値。ラベルは含まれない。"}}]}, {"id": "swift-function-advanced", "level": "Basic", "title": "引数ラベル・Default・Variadic・inout", "summary": "関数呼び出しを読みやすくし、特殊な入力方法を理解する。", "mental": "関数は処理だけでなくAPI。呼び出し側が自然に読める設計が重要。", "points": ["外部引数ラベルと内部名を分けられる。", "default parameterで省略可能な引数を作れる。", "variadicは可変個数の引数を受け取る。", "inoutは呼び出し元の値そのものを変更する。"], "code": "func greet(_ name: String, prefix: String = \"Hello\") {\n    print(\"\\(prefix), \\(name)\")\n}", "why": "標準ライブラリやApple APIの関数signatureを読む力に直結する。", "pitfall": "inoutは副作用が明確な場面で使う。", "questions": [{"id": "q-swift-033", "difficulty": "Basic", "prompt": "出力は？", "code": "func greet(_ name:String,prefix:String=\"Hi\"){print(\"\\(prefix) \\(name)\")}\ngreet(\"Yuki\")", "choices": ["Yuki", "Hi", "Hi Yuki", "エラー"], "answer": 2, "explanation": "prefixの既定値Hiが使われる。", "detail": {"concept": "引数に `= \"Hi\"` のような既定値を書くと、呼び出し時にその引数を省略できます。省略された場合は既定値が使われます。文字列補間 `\\(...)` は値を文字列に差し込む書き方です。", "steps": ["greet(\"Yuki\") は name にだけ値を渡している。", "prefix は省略されたので既定値の \"Hi\" が使われる。", "print(\"\\(prefix) \\(name)\") が Hi と Yuki を空白区切りで組み立てる。"], "whyCorrect": "既定値があるおかげで、よくある呼び出しは短く書け、必要なときだけ `greet(\"Yuki\", prefix: \"Hello\")` と指定できます。", "otherChoices": [{"choice": "Yuki", "reason": "prefix 側が出力されていない場合の答えです。print には両方が含まれています。"}, {"choice": "Hi", "reason": "name 側が出力されていない場合の答えです。"}, {"choice": "エラー", "reason": "既定値があるため引数を省略した呼び出しは正しく、エラーにはなりません。"}], "takeaway": "既定値付き引数は省略でき、省略時にその値が入る。"}}, {"id": "q-swift-034", "difficulty": "Intermediate", "prompt": "inout引数を渡す記号は？", "code": "func addOne(_ x: inout Int){x+=1}\nvar n=1\naddOne(/* ? */ n)", "choices": ["$", "&", "@", "!"], "answer": 1, "explanation": "inoutへは&nのように渡す。", "detail": {"concept": "inout は「引数として渡した変数そのものを関数内で書き換え、呼び出し元にも反映する」指定です。値がコピーされる通常の引数と区別するため、呼び出し側でも `&` を付けて「これは書き換えられます」と明示します。", "whyCorrect": "`addOne(&n)` の `&` は、渡しているのが値のコピーではなく変数そのものへの参照であることを読み手にもコンパイラにも示します。渡せるのは var で宣言した変数だけです。", "otherChoices": [{"choice": "$", "reason": "`$` は Property Wrapper の projectedValue にアクセスする記号で、SwiftUI の `$value` などで使います。inout とは無関係です。"}, {"choice": "@", "reason": "`@` は属性を書くための記号です（`@escaping` や `@MainActor` など）。引数の受け渡しには使いません。"}, {"choice": "!", "reason": "`!` は Optional の強制アンラップなどに使う記号です。inout の指定ではありません。"}], "example": {"code": "func addOne(_ x: inout Int) { x += 1 }\nvar n = 1\naddOne(&n)\nprint(n)", "output": "2", "explanation": "inout でない普通の引数なら関数内の変更は呼び出し元に伝わりません。`&` が付くことで、n 自体が書き換わることが呼び出し側からも読み取れます。"}, "takeaway": "inout には `&` を付けて渡す。渡せるのは var だけ。"}}]}, {"id": "swift-function-values", "level": "Intermediate", "title": "関数型・Higher-Order Function", "summary": "関数を値として保存・受け渡しできることを理解する。", "mental": "Swiftでは『何をするか』そのものを値として扱える。", "points": ["関数には型がある。", "関数を変数へ代入できる。", "関数を引数/戻り値として扱う関数を高階関数という。", "map/filterは高階関数の代表。"], "code": "func add(_ a:Int,_ b:Int)->Int{a+b}\nlet operation: (Int,Int)->Int = add", "why": "クロージャやコールバック、DIを読む根本になる。", "pitfall": "`add` と `add(1,2)` は関数そのものと実行結果で別。", "questions": [{"id": "q-swift-035", "difficulty": "Basic", "prompt": "operation の型は？", "code": "func add(_ a:Int,_ b:Int)->Int{a+b}\nlet operation=add", "choices": ["Int", "(Int, Int) -> Int", "() -> Void", "String"], "answer": 1, "explanation": "2つのIntを受け取りIntを返す関数型。", "detail": {"concept": "関数名を `()` を付けずに書くと、その関数を「呼び出す」のではなく「関数そのものを値として取り出す」意味になります。取り出した値の型は、その関数の関数型です。", "steps": ["add は Int を 2 つ受け取り Int を返す関数。", "`let operation = add` は呼び出しではなく、関数の値をそのまま代入している。", "operation の型は add の関数型 `(Int, Int) -> Int` になる。", "以降は `operation(2, 3)` のように呼び出せる。"], "whyCorrect": "`add` の後ろに `()` が無いため実行されず、関数値のまま operation に入ります。", "otherChoices": [{"choice": "Int", "reason": "`let operation = add(1, 2)` のように呼び出していれば Int になります。ここでは呼び出していません。"}, {"choice": "() -> Void", "reason": "引数も戻り値も無い関数の型です。add は引数も戻り値も持ちます。"}, {"choice": "String", "reason": "関数値であって文字列ではありません。"}], "takeaway": "`()` を付けなければ、関数は値として渡せる。"}}, {"id": "q-swift-036", "difficulty": "Intermediate", "prompt": "高階関数とは？", "code": "func apply(_ v:Int, operation:(Int)->Int)->Int{operation(v)}", "choices": ["関数を値として受け取る/返す関数", "必ず再帰する関数", "非同期関数だけ", "UIKit専用"], "answer": 0, "explanation": "関数を引数または戻り値として扱う。", "detail": {"concept": "高階関数とは、関数を引数として受け取る、あるいは関数を戻り値として返す関数のことです。処理の一部を呼び出し側から差し替えられるようになり、map や filter、sorted(by:) といった標準の API もこの形で作られています。", "whyCorrect": "apply は `operation: (Int) -> Int` という関数型の引数を受け取っているため、まさに関数を値として受け取る関数です。", "otherChoices": [{"choice": "必ず再帰する関数", "reason": "再帰は関数が自分自身を呼ぶことで、高階関数とは別の概念です。高階関数が再帰する必要はありません。"}, {"choice": "非同期関数だけ", "reason": "同期・非同期とは無関係です。通常の同期関数でも高階関数になれます。"}, {"choice": "UIKit専用", "reason": "Swift 標準ライブラリの map や reduce も高階関数であり、特定のフレームワーク専用の概念ではありません。"}], "example": {"code": "func apply(_ v: Int, operation: (Int) -> Int) -> Int { operation(v) }\nprint(apply(5, operation: { $0 * 2 }))\nprint(apply(5, operation: { $0 + 10 }))", "output": "10\n15", "explanation": "apply 自体は変えずに、渡す処理だけを差し替えて結果を変えられます。これが関数を値として扱う利点です。"}, "takeaway": "関数を受け取る／返す関数が高階関数。"}}]}, {"id": "swift-closures", "level": "Intermediate", "title": "Closure・map / filter / reduce 入門", "summary": "処理そのものを値として扱う。", "mental": "クロージャは「名前のない関数」。map は各要素を変換、filter は残す要素を選別、reduce は1つに畳み込む。", "points": ["クロージャは `{ parameters in expression }` の形。", "map は要素数を保ちながら変換する。", "filter は条件に合う要素だけ残す。", "reduce は複数要素から1つの結果を作る。"], "code": "let numbers = [1, 2, 3, 4]\nlet doubled = numbers.map { $0 * 2 }\nlet evens = doubled.filter { $0.isMultiple(of: 4) }", "why": "Swift / SwiftUI の API ではクロージャが大量に出てくる。ViewBuilder、Button action、非同期処理などの読解にも直結する。", "pitfall": "`map` は元配列を変更しない。新しい配列を返す。", "questions": [{"id": "q-swift-015", "difficulty": "Intermediate", "prompt": "result は？", "code": "let numbers = [1, 2, 3]\nlet result = numbers.map { $0 * 2 }", "choices": ["[1, 2, 3]", "[2, 4, 6]", "[1, 4, 9]", "6"], "answer": 1, "explanation": "map は各要素をクロージャで変換した新しい配列を返す。各要素を2倍して [2,4,6]。", "detail": {"concept": "map は「各要素を変換して、同じ個数の新しい配列を作る」操作です。`{ $0 * 2 }` はクロージャ（名前のない関数）で、`$0` は「渡されてきた 1 つ目の引数」を表す省略記法です。元の配列は変更されず、新しい配列が返ります。", "steps": ["1 が渡され 1 * 2 = 2。", "2 が渡され 2 * 2 = 4。", "3 が渡され 3 * 2 = 6。", "変換結果を順に集めた [2, 4, 6] が返る。"], "whyCorrect": "map は要素数を変えずに中身だけを変換するため、3 要素が 3 要素のまま 2 倍になります。", "otherChoices": [{"choice": "[1, 2, 3]", "reason": "元の配列です。map は元を書き換えず新しい配列を返すので、result には変換後が入ります。"}, {"choice": "[1, 4, 9]", "reason": "各要素を 2 乗した場合の結果です。`$0 * 2` は 2 倍であって 2 乗ではありません。"}, {"choice": "6", "reason": "合計にするのは reduce です。map は配列を返します。"}], "takeaway": "map は個数そのまま、中身を変換。"}}, {"id": "q-swift-016", "difficulty": "Intermediate", "prompt": "result は？", "code": "let values = [1, 2, 3, 4]\nlet result = values.filter { $0 % 2 == 0 }", "choices": ["[1, 3]", "[2, 4]", "[true, false, true, false]", "10"], "answer": 1, "explanation": "filter はクロージャが true を返す要素だけ残す。偶数の 2 と 4 が残る。", "detail": {"concept": "filter は「条件を満たす要素だけを残した新しい配列」を作ります。クロージャは Bool を返す必要があり、true の要素だけが残ります。`$0 % 2 == 0` は「2 で割った余りが 0」つまり偶数判定です。", "steps": ["1 → 1 % 2 は 1 なので false、残らない。", "2 → 0 == 0 で true、残る。", "3 → false、残らない。", "4 → true、残る。結果は [2, 4]。"], "whyCorrect": "偶数だけが条件を満たすため、2 と 4 が順序を保ったまま残ります。", "otherChoices": [{"choice": "[1, 3]", "reason": "条件を反転した場合（奇数）の結果です。`$0 % 2 != 0` ならこちらになります。"}, {"choice": "[true, false, true, false]", "reason": "クロージャが返した Bool の一覧です。filter が返すのは判定結果ではなく、条件を満たした元の要素です。判定結果の配列が欲しい場合は map を使います。"}, {"choice": "10", "reason": "合計値です。合計は reduce の役割です。"}], "takeaway": "filter は個数が減ることがある。中身は変えない。"}}]}, {"id": "swift-closures-advanced", "level": "Intermediate", "title": "@escaping・Capture・Capture List", "summary": "クロージャが外側の値を保持する仕組みとescapingを理解する。", "mental": "クロージャは外側の値を捕まえて後から使える。その保持が参照循環にもつながる。", "points": ["closureは外側の値をcaptureできる。", "@escapingは関数終了後にも保持される可能性があるclosure。", "classのselfを強くcaptureすると循環が起こる場合がある。", "[weak self]などcapture listで保持方法を制御。"], "code": "onFinish = { [weak self] in\n    self?.handleFinish()\n}", "why": "UIKit completion、URLSession、Task、animationなどで頻出。", "pitfall": "weak selfを機械的に付けず、所有関係を考える。", "questions": [{"id": "q-swift-037", "difficulty": "Intermediate", "prompt": "@escaping が必要になる代表例は？", "code": "func load(completion: @escaping ()->Void){ /* 保存して後で呼ぶ */ }", "choices": ["すぐ実行して破棄", "関数終了後に保存して呼ぶ", "Intを返すだけ", "letを使う"], "answer": 1, "explanation": "関数終了後にもclosureが生存する場合。", "detail": {"concept": "クロージャは通常、渡された関数の実行中に使われて終わります。しかし関数が終わった後まで保存して後から呼び出す場合、そのクロージャは関数の外へ「逃げる（escape）」ため、`@escaping` の指定が必要になります。通信の完了時に呼ぶコールバックが典型例です。", "whyCorrect": "プロパティに保存したり、非同期処理の完了後に呼んだりする場合、関数の実行が終わってもクロージャが生き続けます。これを Swift に伝えるのが @escaping です。", "otherChoices": [{"choice": "すぐ実行して破棄", "reason": "関数の中ですぐ実行して捨てるだけなら関数の外へ逃げないため、非エスケープのままで書けます。@escaping は不要です。"}, {"choice": "Intを返すだけ", "reason": "戻り値の型の話であって、クロージャの寿命とは関係ありません。"}, {"choice": "letを使う", "reason": "let / var の選択は値を書き換えるかどうかの話で、@escaping の要否とは別です。"}], "takeaway": "関数終了後も残るクロージャには @escaping。"}}, {"id": "q-swift-038", "difficulty": "Intermediate", "prompt": "[weak self] を使う主な理由は？", "code": "callback = { [weak self] in self?.finish() }", "choices": ["selfを値型にする", "強参照循環を避ける", "同期化する", "Optional禁止"], "answer": 1, "explanation": "closureとselfの循環を避けるために使うことがある。", "detail": {"concept": "クロージャは、その中で使った外の値を掴んで保持します（キャプチャ）。self を使うクロージャを self 自身のプロパティに保存すると、self がクロージャを持ち、クロージャが self を持つ、という相互の強い参照ができます。これが強参照循環（retain cycle）で、どちらも解放されなくなります。`[weak self]` はキャプチャリストと呼ばれ、self を弱い参照で掴むことでこの輪を断ち切ります。", "steps": ["self が callback プロパティにクロージャを保存する（self → クロージャの強い参照）。", "クロージャの中で self を使うと、通常は self を強く掴む（クロージャ → self）。", "この 2 本が揃うと互いに手放せなくなり、メモリが解放されない。", "[weak self] にすると 2 本目が弱い参照になり、self が不要になれば解放できる。"], "whyCorrect": "weak は参照カウントを増やさないため、循環が切れます。弱い参照は対象が解放されると nil になるため、`self?` のように Optional として扱う点も重要です。", "otherChoices": [{"choice": "selfを値型にする", "reason": "weak にしても class のままで、値型に変わることはありません。値型（struct）はそもそも参照カウントを持たないため、この問題自体が起きにくくなります。"}, {"choice": "同期化する", "reason": "weak はメモリ管理の指定であり、複数の処理の順番を整える仕組みではありません。"}, {"choice": "Optional禁止", "reason": "むしろ逆で、weak な参照は Optional になります。Optional を禁止するどころか、Optional として扱う必要が生じます。"}], "takeaway": "[weak self] で循環を断つ。weak な self は Optional になる。"}}]}, {"id": "swift-collections", "level": "Basic", "title": "Collection入門：Array・Set・Dictionary", "summary": "複数の値を目的に合わせてまとめる。", "mental": "Array=順序付き、Set=重複なし、Dictionary=キーから値を引く。", "points": ["Array は順序を持ち、添字でアクセスする。", "Set は順序を前提とせず、一意な要素を保持する。", "Dictionary は Key: Value の対応を保持する。", "存在しない Dictionary キーへのアクセス結果は Optional。"], "code": "var scores = [\"A\": 90, \"B\": 75]\nscores[\"C\"] = 82\n\nif let score = scores[\"C\"] {\n    print(score)\n}", "why": "APIレスポンス、画面一覧、ID検索など、実アプリはコレクションの処理だらけ。型ごとの性質を使い分ける。", "pitfall": "配列の存在しない index にアクセスすると実行時エラー。Dictionary は Optional を返す。", "questions": [{"id": "q-swift-009", "difficulty": "Basic", "prompt": "numbers の最終状態は？", "code": "var numbers = [1, 2]\nnumbers.append(3)\nnumbers.removeFirst()", "choices": ["[1, 2, 3]", "[2, 3]", "[1, 3]", "[3]"], "answer": 1, "explanation": "append で [1,2,3]、removeFirst で先頭の 1 が削除され [2,3]。", "detail": {"concept": "Array は順序を保つ要素の並びです。append は末尾に追加し、removeFirst は先頭を取り除きます。どちらも配列自身を書き換えるので、変数は var である必要があります。", "steps": ["初期状態は [1, 2]。", "append(3) で末尾に 3 が加わり [1, 2, 3]。", "removeFirst() で先頭の 1 が取り除かれ [2, 3]。"], "whyCorrect": "追加は末尾、削除は先頭なので、残るのは [2, 3] です。", "otherChoices": [{"choice": "[1, 2, 3]", "reason": "append までの状態です。removeFirst の効果が反映されていません。"}, {"choice": "[1, 3]", "reason": "真ん中の 2 が削除された場合の結果です。removeFirst が消すのは先頭の 1 です。"}, {"choice": "[3]", "reason": "2 要素が削除された場合の結果です。removeFirst は 1 つだけ取り除きます。"}], "takeaway": "append は末尾へ、removeFirst は先頭から。"}}, {"id": "q-swift-010", "difficulty": "Basic", "prompt": "Dictionary の scores[\"C\"] の型は？", "code": "let scores = [\"A\": 90, \"B\": 75]\nlet value = scores[\"C\"]", "choices": ["Int", "Int?", "String", "Bool"], "answer": 1, "explanation": "キーが存在しない可能性があるため Dictionary の添字アクセスは Optional。ここでは Int?。", "detail": {"concept": "Dictionary はキーと値の対応表です。`scores[\"C\"]` のような添字アクセスは、そのキーが存在しない可能性があるため、値そのものではなく Optional を返します。値が Int なら結果は Int? になります。", "whyCorrect": "\"C\" は登録されていないため実際の結果は nil ですが、型としては「Int が入っているか nil」を表す Int? です。存在しないキーでもクラッシュせず nil で受け取れるのが Swift の設計です。", "otherChoices": [{"choice": "Int", "reason": "必ず値が存在する前提の型です。存在しないキーを扱えないため、Dictionary の添字はこの型を返しません。取り出した後に `?? 0` などで既定値を補うと Int になります。"}, {"choice": "String", "reason": "String はキー側の型です。取り出されるのは値側です。"}, {"choice": "Bool", "reason": "値の型は Int なので Bool にはなりません。"}], "example": {"code": "let scores = [\"A\": 90, \"B\": 75]\nprint(scores[\"C\"] ?? 0)\nif let a = scores[\"A\"] { print(a) }", "output": "0\n90", "explanation": "`?? 0` で「無ければ 0」と既定値を与えられます。if let で取り出せば、存在した場合だけの処理を書けます。"}, "takeaway": "Dictionary の添字アクセスは常に Optional。"}}]}, {"id": "swift-array", "level": "Basic", "title": "Arrayを深く理解する", "summary": "順序付きCollectionの追加・削除・検索・安全な扱いを学ぶ。", "mental": "Arrayは『順序が意味を持つ一覧』。indexは要素のIDではない。", "points": ["append / insert / remove / contains / first(where:)を使う。", "first / lastはOptional。", "indexは並べ替えや削除で変わる。", "操作によって計算量が異なる。"], "code": "var names=[\"A\",\"B\"]\nnames.append(\"C\")\nlet firstB = names.first { $0 == \"B\" }", "why": "List、API response、検索結果など最も頻出するCollection。", "pitfall": "存在確認せずarray[index]へアクセスすると範囲外crashになる。", "questions": [{"id": "q-swift-039", "difficulty": "Basic", "prompt": "安全に最初の要素を取りたい場合は？", "code": "let values=[1,2,3]", "choices": ["values[0]だけ", "values.first", "values[-1]", "values.get(0)!"], "answer": 1, "explanation": "firstは空配列ならnilを返す。", "detail": {"concept": "`values[0]` は指定位置に必ず要素がある前提のアクセスで、空配列に対して行うとプログラムが実行中に停止します（実行時エラー）。`first` は空なら nil を返す Optional なので、事前に個数を確認しなくても安全に扱えます。", "whyCorrect": "first は「取れなかった」という結果を nil として返せるため、空配列でも停止しません。取り出した後に if let などで確認して使います。", "otherChoices": [{"choice": "values[0]だけ", "reason": "値が入っていることが確実なら使えますが、空の可能性がある場面では実行時に停止する危険があります。安全性を問われている場面では first が適切です。"}, {"choice": "values[-1]", "reason": "Swift の配列は負の添字に対応しておらず、実行時に停止します。末尾を取りたい場合は last を使います。"}, {"choice": "values.get(0)!", "reason": "get(_:) という API は Array にありません。仮にあっても末尾の `!` は nil のとき停止するため、安全な書き方にはなりません。"}], "example": {"code": "let values: [Int] = []\nprint(values.first == nil)\nprint(values.first ?? -1)", "output": "true\n-1", "explanation": "空配列でも停止せず nil として扱えます。`??` で既定値を与えれば、そのまま値として使えます。"}, "takeaway": "空かもしれない配列には添字より first / last。"}}, {"id": "q-swift-040", "difficulty": "Basic", "prompt": "removeFirst() 後は？", "code": "var v=[\"A\",\"B\",\"C\"]\nv.removeFirst()", "choices": ["[A,B]", "[B,C]", "[A,C]", "[]"], "answer": 1, "explanation": "先頭Aが削除される。", "detail": {"concept": "removeFirst() は配列の先頭要素を取り除き、残りを 1 つずつ前へ詰めます。配列自身が変化するため、対象は var で宣言されている必要があります。", "steps": ["初期状態は [\"A\", \"B\", \"C\"]。", "removeFirst() が先頭の \"A\" を取り除く。", "残りが前へ詰まり [\"B\", \"C\"] になる。"], "whyCorrect": "取り除かれるのは先頭の 1 要素だけなので、B と C が順序を保ったまま残ります。", "otherChoices": [{"choice": "[A,B]", "reason": "末尾が削除された場合の結果です。それを行うのは removeLast() です。"}, {"choice": "[A,C]", "reason": "真ん中が削除された場合の結果です。位置を指定して消すなら remove(at: 1) です。"}, {"choice": "[]", "reason": "すべて削除した場合の結果です。それを行うのは removeAll() です。"}], "takeaway": "removeFirst は先頭 1 つ。removeLast は末尾 1 つ。"}}]}, {"id": "swift-set", "level": "Basic", "title": "Set・集合演算", "summary": "重複を許さないCollectionと集合演算を理解する。", "mental": "順番ではなく『含まれているか』が重要なデータにSetを使う。", "points": ["Set要素はHashable。", "insert/remove/containsが基本。", "union/intersection/subtractingで集合演算。", "順序を前提にしない。"], "code": "let a:Set=[1,2,3]\nlet b:Set=[3,4]\nlet common=a.intersection(b)", "why": "選択済みID、権限、tag、重複排除に自然に使える。", "pitfall": "表示順が必要ならArrayなど別構造を使う。", "questions": [{"id": "q-swift-041", "difficulty": "Basic", "prompt": "intersection結果は？", "code": "let a:Set=[1,2,3]\nlet b:Set=[3,4]\nlet c=a.intersection(b)", "choices": ["1だけ", "3だけ", "3と4", "1,2,3,4"], "answer": 1, "explanation": "共通要素3だけ。", "detail": {"concept": "Set は重複を持たない集合で、順序を保ちません。intersection は 2 つの集合の「両方に含まれる要素だけ」を取り出す集合演算です。ほかに union（どちらかに含まれる）、subtracting（片方から取り除く）があります。", "steps": ["a は {1, 2, 3}、b は {3, 4}。", "両方に含まれる要素を探すと 3 だけが該当する。", "c は {3} になる。"], "whyCorrect": "1 と 2 は a にしかなく、4 は b にしかありません。共通しているのは 3 だけです。", "otherChoices": [{"choice": "1だけ", "reason": "1 は a にしか存在しないため共通要素ではありません。"}, {"choice": "3と4", "reason": "4 は b にしかありません。両方に含まれる必要があります。"}, {"choice": "1,2,3,4", "reason": "これは union（和集合）の結果です。intersection は共通部分だけを返します。"}], "example": {"code": "let a: Set = [1, 2, 3]\nlet b: Set = [3, 4]\nprint(a.intersection(b).sorted())\nprint(a.union(b).sorted())\nprint(a.subtracting(b).sorted())", "output": "[3]\n[1, 2, 3, 4]\n[1, 2]", "explanation": "Set は順序を持たないため、表示の順を安定させるには sorted() を挟みます。3 つの集合演算の違いがこれで比較できます。"}, "takeaway": "intersection は共通部分、union は全体、subtracting は差。"}}, {"id": "q-swift-042", "difficulty": "Basic", "prompt": "Set要素に必要な代表Protocolは？", "code": "Set<MyType>()", "choices": ["Codable", "Hashable", "Observable", "Sendableだけ"], "answer": 1, "explanation": "Setはhash値で要素を管理する。", "detail": {"concept": "Set は同じ要素を重複して保持しない Collection です。新しい要素を追加するとき「すでに同じ値が存在するか」を毎回調べる必要があり、要素を 1 つずつ全部比較していては効率が悪くなります。Hashable に準拠した型は値から hash 値（値を要約した整数）を作れるため、まず hash 値で候補を絞り込めます。Hashable は Equatable も継承しているので、絞り込んだ候補を == で比較して同一かどうかを確定できます。", "steps": ["要素を追加するとき、まずその値の hash 値を計算して格納先の候補を絞る。", "hash 値が同じだったものだけを == で比較する。", "同じ値が既にあれば追加せず、無ければ追加する。", "この 2 段構えのために、要素型には hash 計算と等価比較の両方が要る。"], "whyCorrect": "Hashable がその 2 つの能力をまとめて要求する契約です。Int や String など標準の型は既に準拠しているため、そのまま Set に入れられます。", "otherChoices": [{"choice": "Codable", "reason": "Encodable と Decodable をまとめた別名で、JSON などの外部表現との相互変換のための契約です。保存や通信で使うものであり、重複判定には関与しません。"}, {"choice": "Observable", "reason": "値の変化を観測して UI を更新するための仕組みで、主に SwiftUI の状態管理で使います。集合の要素条件とは無関係です。"}, {"choice": "Sendableだけ", "reason": "Sendable は「並行処理の境界を越えて安全に受け渡せる」ことを表す契約です。スレッド安全性の話であり、これだけでは重複判定ができないため Set の要素条件は満たしません。"}], "example": {"code": "struct Member: Hashable {\n    let id: Int\n    let name: String\n}\n\nvar members: Set<Member> = []\nmembers.insert(Member(id: 1, name: \"Yuki\"))\nmembers.insert(Member(id: 1, name: \"Yuki\"))\nprint(members.count)", "output": "1", "explanation": "すべての stored property が Hashable なら、struct は Hashable への準拠を自動合成でき、== と hash(into:) が生成されます。同じ内容を 2 回入れても重複と判定されるため要素数は 1 のままです。"}, "takeaway": "Set の要素と Dictionary の Key は Hashable。hash で絞り、== で確定する。"}}]}, {"id": "swift-dictionary", "level": "Basic", "title": "Dictionary・Key / Value", "summary": "KeyからValueへ効率よくアクセスする辞書型を理解する。", "mental": "Dictionaryは『ID→データ』『名前→設定』の検索表。", "points": ["KeyはHashable。", "添字アクセスはOptional。", "default subscriptで初期値付き更新ができる。", "keys / values / mergeなどを使える。"], "code": "var counts:[String:Int]=[:]\ncounts[\"Swift\", default: 0] += 1", "why": "ID検索、集計、cacheなど実務で頻出。", "pitfall": "`dictionary[key] = nil` は通常そのKey削除になる。", "questions": [{"id": "q-swift-043", "difficulty": "Basic", "prompt": "default: 0 の利点は？", "code": "var c:[String:Int]=[:]\nc[\"A\", default:0]+=1", "choices": ["Aが無い場合0から開始", "必ずnil", "Array化", "Key削除"], "answer": 0, "explanation": "Keyが無ければdefault値から更新できる。", "detail": {"concept": "`c[\"A\", default: 0]` は「キーが無ければ 0 があるものとして扱う」という添字の書き方です。これにより Optional を経由せずに読み書きでき、`+= 1` のような更新をそのまま書けます。集計処理で頻出のパターンです。", "steps": ["c は空の Dictionary。\"A\" というキーはまだ無い。", "default: 0 により、無い場合は 0 とみなされる。", "0 + 1 = 1 が計算され、c[\"A\"] に 1 が設定される。"], "whyCorrect": "既定値があるおかげで「最初の 1 回」を特別扱いする分岐が不要になります。default が無ければ Optional のままなので `+= 1` は直接書けません。", "otherChoices": [{"choice": "必ずnil", "reason": "むしろ nil を避けるための書き方です。default 付きの添字は Optional ではない値を返します。"}, {"choice": "Array化", "reason": "Dictionary は Dictionary のままです。配列へ変換するわけではありません。"}, {"choice": "Key削除", "reason": "キーを削除するのは `c[\"A\"] = nil` や removeValue(forKey:) です。default は削除とは無関係です。"}], "example": {"code": "var counts: [String: Int] = [:]\nfor name in [\"A\", \"B\", \"A\"] {\n    counts[name, default: 0] += 1\n}\nprint(counts[\"A\"] ?? 0, counts[\"B\"] ?? 0)", "output": "2 1", "explanation": "初回はキーが無いので 0 から始まり、2 回目以降は既存の値に足されます。出現回数の集計がこれだけで書けます。"}, "takeaway": "`[key, default: 値]` で「無ければこの値」から更新できる。"}}, {"id": "q-swift-044", "difficulty": "Basic", "prompt": "Dictionary Keyに必要なのは？", "code": "var d:[Key:Value]", "choices": ["Hashable", "View", "Actor", "Error"], "answer": 0, "explanation": "Dictionary KeyはHashable。", "detail": {"concept": "Dictionary は「キーから値を素早く探す」ための型です。探す仕組みは Set と同じで、キーの hash 値で候補を絞り、== で一致を確定します。そのため Key の型は Hashable に準拠している必要があります。Value 側には制約がありません。", "whyCorrect": "Hashable が hash 値の生成と等価比較の両方を保証するため、キーの高速な検索が成り立ちます。String や Int が Key によく使われるのは、これらが標準で Hashable だからです。", "otherChoices": [{"choice": "View", "reason": "画面の見た目を表す SwiftUI の契約で、辞書のキー条件とは無関係です。"}, {"choice": "Actor", "reason": "並行処理で状態を保護する型の種類であり、キーの条件ではありません。"}, {"choice": "Error", "reason": "エラーとして投げられる値が満たす契約です。キーの検索とは関係ありません。"}], "takeaway": "Dictionary の Key は Hashable。Value に制約はない。"}}]}, {"id": "swift-sequence-transform", "level": "Intermediate", "title": "map・compactMap・flatMap・filter・reduce・sorted", "summary": "Collection変換を用途ごとに正しく選ぶ。", "mental": "『各要素を変える』『一部を残す』『nilを捨てる』『1つへ集約』を分けて考える。", "points": ["map:全要素を変換。", "compactMap:nilを除きながら変換。", "filter:条件に合う要素を残す。", "reduce:複数要素を1つへ畳み込む。"], "code": "let texts=[\"1\",\"x\",\"3\"]\nlet numbers=texts.compactMap(Int.init)\nlet sum=numbers.reduce(0,+)", "why": "API変換、表示model作成、集計処理で頻出。", "pitfall": "高階関数を1行に連結しすぎて読みにくくしない。", "questions": [{"id": "q-swift-045", "difficulty": "Intermediate", "prompt": "numbers は？", "code": "let v=[\"1\",\"x\",\"3\"]\nlet numbers=v.compactMap(Int.init)", "choices": ["[1,nil,3]", "[1,3]", "[1,0,3]", "[\"1\",\"3\"]"], "answer": 1, "explanation": "変換失敗のnilをcompactMapが除去する。", "detail": {"concept": "`Int.init` は「String から Int を作る初期化」を関数値として渡した書き方で、`{ Int($0) }` と同じ意味です。この変換は数値に見えない文字列では失敗して nil を返します。compactMap は変換結果のうち nil を取り除き、中身だけを取り出した配列を返します。", "steps": ["\"1\" → 変換成功で 1。", "\"x\" → 数値として読めないので nil。", "\"3\" → 変換成功で 3。", "compactMap が nil を除去し、[1, 3] が残る。"], "whyCorrect": "map なら [1, nil, 3]（型は [Int?]）になりますが、compactMap は nil を落として [Int] にします。", "otherChoices": [{"choice": "[1,nil,3]", "reason": "map を使った場合の結果です。compactMap の役割はこの nil を取り除くことです。"}, {"choice": "[1,0,3]", "reason": "失敗を 0 で埋めた場合の結果です。compactMap は既定値を補うのではなく要素ごと取り除きます。0 を入れたいなら `map { Int($0) ?? 0 }` と書きます。"}, {"choice": "[\"1\",\"3\"]", "reason": "変換されず文字列のまま残った場合の結果です。Int.init により中身は Int になります。"}], "takeaway": "compactMap = map してから nil を除去。"}}, {"id": "q-swift-046", "difficulty": "Intermediate", "prompt": "reduce(0,+) の役割は？", "code": "let total=[1,2,3].reduce(0,+)", "choices": ["並べ替え", "合計して1つにする", "nil除去", "重複排除"], "answer": 1, "explanation": "0から+で畳み込み6になる。", "detail": {"concept": "reduce は「初期値から始めて、要素を 1 つずつ取り込みながら 1 つの値にまとめる」操作です。`reduce(0, +)` は初期値 0 に対して要素を順に + で結合していきます。`+` は演算子ですが関数としても渡せます。", "steps": ["初期値 0。", "0 + 1 = 1。", "1 + 2 = 3。", "3 + 3 = 6。最終結果は 6。"], "whyCorrect": "map や filter が配列を返すのに対し、reduce は配列を 1 つの値へ畳み込みます。合計・最大・連結など「まとめる」処理全般に使えます。", "otherChoices": [{"choice": "並べ替え", "reason": "並べ替えは sorted() の役割です。reduce は順に取り込むだけで並べ替えません。"}, {"choice": "nil除去", "reason": "nil の除去は compactMap の役割です。"}, {"choice": "重複排除", "reason": "重複排除は Set への変換などで行います。reduce の役割ではありません。"}], "example": {"code": "let exercises = [\"squat\", \"bench\"]\nlet total = [1, 2, 3].reduce(0, +)\nlet joined = exercises.reduce(\"\") { $0 + $1 + \"/\" }\nprint(total)\nprint(joined)", "output": "6\nsquat/bench/", "explanation": "reduce は数値の合計だけでなく、文字列の連結など「1 つにまとめる」処理全般に使えます。$0 が途中経過、$1 が今回の要素です。"}, "takeaway": "reduce は配列を 1 つの値に畳み込む。"}}]}, {"id": "swift-optionals", "level": "Basic", "title": "Optional・if let・guard let", "summary": "「値がある / ない」を型として安全に扱う。", "mental": "Optional は空っぽになれる箱ではなく、`.some(value)` または `.none` の2状態を持つ型と考える。", "points": ["`String?` は String または nil。", "if let / guard let で安全にアンラップする。", "nil-coalescing `??` で nil のときの既定値を指定できる。", "強制アンラップ `!` は nil ならクラッシュするため慎重に使う。"], "code": "let nickname: String? = nil\nlet displayName = nickname ?? \"Guest\"\nprint(displayName)", "why": "API、ユーザー入力、検索結果など「存在しない可能性」は現実のアプリで必ず発生する。Optional はその可能性を型で表現する。", "pitfall": "`!` を「Optionalを消す記号」と覚えない。nil の可能性を無視して値を強制取得する操作。", "questions": [{"id": "q-swift-011", "difficulty": "Basic", "prompt": "出力は？", "code": "let name: String? = nil\nprint(name ?? \"Guest\")", "choices": ["nil", "Optional(nil)", "Guest", "クラッシュ"], "answer": 2, "explanation": "`??` は左側が nil の場合に右側を返す。したがって Guest。", "detail": {"concept": "String? は「String が入っているか、nil か」を表す Optional 型です。`??` は nil 合体演算子（nil-coalescing operator）で、「左が nil ならば右の既定値を使う」という意味になります。結果は Optional が外れた値になるため、そのまま文字列として扱えます。", "steps": ["name は String? 型で、中身は nil。", "print に渡す前に `name ?? \"Guest\"` が先に評価される。", "`??` は左の name を確認し、nil なので右側の \"Guest\" を採用する。", "結果は Optional ではない String の \"Guest\" になり、そのまま出力される。"], "whyCorrect": "`??` の結果は Optional が外れた String なので Optional(...) の形にはならず、nil だったため既定値の Guest が表示されます。表示名が未設定のときに既定名を出す、といった実務でよく使う形です。", "otherChoices": [{"choice": "nil", "reason": "`??` を書かずに `print(name)` とした場合は nil と出力されます。ここでは既定値に置き換えられるため nil にはなりません。"}, {"choice": "Optional(nil)", "reason": "そのような値は存在しません。Optional をそのまま print すると Optional(\"Yuki\") のように包まれた形で表示されますが、`??` で置き換えた後は包みが外れています。"}, {"choice": "クラッシュ", "reason": "クラッシュするのは `name!` のように強制アンラップした場合です。`??` は nil でも安全に既定値へ切り替わるため停止しません。"}], "example": {"code": "let nickname: String? = \"Yuki\"\nlet missing: String? = nil\nprint(nickname ?? \"Guest\")\nprint(missing ?? \"Guest\")", "output": "Yuki\nGuest", "explanation": "`??` は左に値があればその中身を、nil なら右の既定値を返します。どちらの場合も結果は Optional ではない String になります。"}, "takeaway": "`??` は「無ければこれ」。`!` と違ってクラッシュしない。"}}, {"id": "q-swift-012", "difficulty": "Basic", "prompt": "最も安全な書き方は？", "code": "let text: String? = getText()\n// text を表示したい", "choices": ["print(text!)", "if let text { print(text) }", "print(text as String)", "text = nil"], "answer": 1, "explanation": "if let は値がある場合だけ安全にアンラップする。`!` は nil の場合クラッシュする。", "detail": {"concept": "Optional の中身を使うには、値があるかどうかを確認してから取り出す必要があります。`if let text { ... }` は Optional を取り出し、中身があるときだけブロックを実行する短縮記法（shorthand）で、`if let text = text` と同じ意味です。", "whyCorrect": "if let は nil の場合にブロックを実行しないだけで、プログラムは停止しません。値の有無に関わらず安全に動くため、最も安全な書き方です。", "otherChoices": [{"choice": "print(text!)", "reason": "`!` は強制アンラップで、「必ず値が入っている」と断言する書き方です。実際に nil だった場合、プログラムは実行中に停止します。値の有無が不明な場面では危険です。"}, {"choice": "print(text as String)", "reason": "`as` は型変換の構文で、Optional を外す用途には使えません。String? を String へ無条件に変換することはできず、この書き方はコンパイルエラーになります。"}, {"choice": "text = nil", "reason": "text に nil を代入しているだけで、表示にはなりません。そもそも text は let 宣言なので再代入自体できません。"}], "takeaway": "取り出してから使う。`!` は「絶対にある」と言い切る宣言。"}}]}, {"id": "swift-optional-chaining", "level": "Basic", "title": "Optional Chaining・Optional map / flatMap", "summary": "Optionalの中へ安全にアクセスし、存在しない場合を連鎖的に扱う。", "mental": "途中がnilなら、その先を実行せず連鎖全体がnilになる。", "points": ["user?.profile?.nameのように連鎖できる。", "結果はOptional。", "Optional.mapは値がある時だけ変換。", "flatMapはOptionalの二重化を避ける。"], "code": "struct User{let name:String}\nlet user:User?=User(name:\"Yuki\")\nlet length=user?.name.count", "why": "APIや画面状態でOptionalが連鎖する場面を安全に扱える。", "pitfall": "nilが隠れすぎるならguardで明示的に検証する。", "questions": [{"id": "q-swift-047", "difficulty": "Basic", "prompt": "length の型は？", "code": "struct User{let name:String}\nlet user:User?=nil\nlet length=user?.name.count", "choices": ["Int", "Int?", "String?", "Bool"], "answer": 1, "explanation": "途中がnilかもしれないので結果はInt?。", "detail": {"concept": "`?.` は Optional Chaining で、「左が nil でなければ続きを評価し、nil ならその場で全体を nil にする」という書き方です。途中で打ち切られる可能性があるため、結果は必ず Optional になります。", "steps": ["user は User? で、中身は nil。", "`user?.name` の時点で nil と判明し、以降の `.count` は評価されない。", "全体の結果は nil になる。", "ただし成功時には Int が得られるため、型としては Int? になる。"], "whyCorrect": "name は String、count は Int ですが、途中が nil になり得るので結果は「Int か nil」つまり Int? です。型は実際の値ではなく、起こり得る可能性で決まります。", "otherChoices": [{"choice": "Int", "reason": "途中で nil になる可能性がある限り、結果を非 Optional にはできません。`user?.name.count ?? 0` のように既定値を与えれば Int になります。"}, {"choice": "String?", "reason": "count が返すのは文字数、つまり Int です。String? になるのは `user?.name` までの部分です。"}, {"choice": "Bool", "reason": "文字数は数であり、真偽値ではありません。"}], "takeaway": "`?.` の結果は必ず Optional になる。"}}, {"id": "q-swift-048", "difficulty": "Basic", "prompt": "途中がnilなら？", "code": "a?.b?.c", "choices": ["必ずcrash", "連鎖結果はnil", "0", "空文字"], "answer": 1, "explanation": "以降を評価せずnilになる。", "detail": {"concept": "`a?.b?.c` のように `?.` をつなげると、どこか 1 か所でも nil になった時点で残りの評価が打ち切られ、全体の結果が nil になります。これを短絡評価と呼びます。途中でクラッシュするのではなく、安全に nil を返す点が重要です。", "whyCorrect": "nil になった段階で以降のプロパティやメソッドは呼ばれません。だからこそ深い階層でも安全に書けます。", "otherChoices": [{"choice": "必ずcrash", "reason": "クラッシュするのは `!` を使った強制アンラップです。`?.` は安全側に倒れます。"}, {"choice": "0", "reason": "数値の 0 が補われることはありません。既定値が欲しい場合は `?? 0` を明示的に書きます。"}, {"choice": "空文字", "reason": "空文字列が補われることもありません。結果は nil です。"}], "example": {"code": "struct Gym { let name: String }\nlet gym: Gym? = nil\nlet length = gym?.name.count\nprint(length as Any)\nprint(gym?.name.count ?? 0)", "output": "nil\n0", "explanation": "チェーンの途中が nil なら結果も nil です。`?? 0` を添えれば、そのまま数として扱える値に変換できます。"}, "takeaway": "チェーンの途中が nil なら、以降は評価されず全体が nil。"}}]}, {"id": "swift-struct-enum", "level": "Intermediate", "title": "struct・値セマンティクス入門", "summary": "関連データを独自型にまとめ、値型として扱う基本を理解する。", "mental": "structは『独自の値』を定義する設計図。代入や引数渡しでは値セマンティクスを持つ。", "points": ["structは値型。", "stored propertyとmethodを持てる。", "memberwise initializerが自動生成される場合がある。", "データモデルではstructが自然な場面が多い。"], "code": "enum LoadState {\n    case idle\n    case loading\n    case loaded([String])\n    case failed(Error)\n}", "why": "DTO、View用model、設定値など、多くのSwift型設計で中心になる。", "pitfall": "structはclassの簡易版ではない。共有同一性が不要なら値型が自然なことが多い。", "questions": [{"id": "q-swift-017", "difficulty": "Intermediate", "prompt": "出力は？", "code": "struct User { var score: Int }\nvar a = User(score: 10)\nvar b = a\nb.score = 20\nprint(a.score)", "choices": ["10", "20", "nil", "コンパイルエラー"], "answer": 0, "explanation": "struct は値型。b は a の値を受け取り、b.score の変更は a に影響しない。", "detail": {"concept": "struct は値型です。値型は代入や引数渡しのときに中身がコピーされ、コピー後は互いに独立します。片方を書き換えても、もう片方には影響しません。", "steps": ["a は score = 10 の User。", "`var b = a` で a の中身がコピーされ、b は独立した別の値になる。", "b.score = 20 は b 側だけを書き換える。", "print(a.score) は元のまま 10 を表示する。"], "whyCorrect": "コピーされた時点で 2 つは別物です。値型では「どこかで勝手に書き換わっていた」という事態が起きにくく、状態を追いやすくなります。", "otherChoices": [{"choice": "20", "reason": "b 側の値です。class（参照型）であれば a と b が同じ実体を指すため、こちらが正解になります。struct と class の最も大きな違いがここです。"}, {"choice": "nil", "reason": "score は Int で Optional ではないため、nil にはなりません。"}, {"choice": "コンパイルエラー", "reason": "struct のコピーもプロパティの書き換えも正しい操作です。b が var なので変更もできます。"}], "takeaway": "struct は代入でコピー。書き換えは互いに影響しない。"}}, {"id": "q-swift-018", "difficulty": "Intermediate", "prompt": "enum を使う主な利点は？", "code": "enum NetworkState {\n    case idle, loading, loaded, failed\n}", "choices": ["すべて参照型になる", "取り得る状態を型で限定できる", "必ず rawValue が必要", "継承できる"], "answer": 1, "explanation": "状態の候補を型レベルで限定できる。switch と組み合わせると状態漏れも検出しやすい。", "detail": {"concept": "enum は「取り得る値の候補」を型として列挙する仕組みです。NetworkState を enum にすると、状態は idle / loading / loaded / failed の 4 つだけに限定され、それ以外の値は作れません。", "whyCorrect": "文字列や Int で状態を表すと、想定外の値が入り込む余地が残ります。enum なら候補が型で固定され、switch で分岐したとき case の書き漏れをコンパイル時に指摘してもらえます。", "otherChoices": [{"choice": "すべて参照型になる", "reason": "enum は値型です。参照型になるのは class です。"}, {"choice": "必ず rawValue が必要", "reason": "rawValue は必要なときだけ指定します。`enum NetworkState { case idle }` のように rawValue 無しでも定義できます。"}, {"choice": "継承できる", "reason": "enum は他の型を継承できません。継承ができるのは class です。ただし protocol への準拠は可能です。"}], "takeaway": "enum は状態の候補を型で限定する。"}}]}, {"id": "swift-enum", "level": "Intermediate", "title": "Enum・Raw Value・Associated Value", "summary": "取り得る状態を型で限定し、状態ごとに異なるデータを保持する。", "mental": "enumは『文字列定数の集まり』ではなく、状態を安全に表現する強力な型。", "points": ["raw valueで固定値と対応。", "associated valueでcaseごとに異なる値を持てる。", "switchで全caseを網羅。", "recursive enumも表現可能。"], "code": "enum LoadState {\n case idle\n case loading\n case loaded([String])\n case failed(message:String)\n}", "why": "画面状態、network状態、routing、error種別を不正状態なく表せる。", "pitfall": "複数Boolで状態を表すと矛盾状態を作りやすい。", "questions": [{"id": "q-swift-049", "difficulty": "Intermediate", "prompt": "associated value の利点は？", "code": "enum State{case success(Int);case failure(String)}", "choices": ["caseごとに関連dataを持てる", "必ずrawValue", "継承可能", "参照型"], "answer": 0, "explanation": "caseごとに異なる型の関連dataを保持できる。", "detail": {"concept": "associated value は「case ごとに異なる付随データを持たせる」機能です。`case success(Int)` は成功時に Int を、`case failure(String)` は失敗時に String を一緒に運びます。case ごとに型も個数も変えられる点が特徴です。", "whyCorrect": "状態とそのときだけ必要なデータを 1 つの値にまとめられます。成功のときだけ件数、失敗のときだけメッセージ、というように無関係なデータを持ち回らずに
