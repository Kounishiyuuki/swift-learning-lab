e": "final class Fetcher {\n    var handlers: [() -> Void] = []\n    func register(_ handler: () -> Void) {\n        handlers.append(handler)\n    }\n}", "options": [{"id": "o1", "code": "    func register(_ handler: @escaping () -> Void) {"}, {"id": "o2", "code": "    func register(_ handler: @autoclosure () -> Void) {"}, {"id": "o3", "code": "    func register(_ handler: inout () -> Void) {"}, {"id": "o4", "code": "    func register(_ handler: (() -> Void)?) {"}]}, "solution": {"optionId": "o1", "fixedCode": "final class Fetcher {\n    var handlers: [() -> Void] = []\n    func register(_ handler: @escaping () -> Void) {\n        handlers.append(handler)\n    }\n}"}, "hints": ["関数の引数のクロージャは、既定では「その関数の実行中にしか使わない」約束になっています。", "配列に入れて保存するということは、関数が終わったあとも生き続けるということです。", "その約束を外すための属性を、クロージャの型の前に書きます。Optional にしても保存できるようにはなりません。"], "explanation": "バグは3行目の引数宣言です。Swiftの関数引数のクロージャは既定で非エスケープ（関数を抜けるまでに使い切る）と扱われ、プロパティに保存するとその約束を破るためコンパイラが 'Escaping closure captured...' 系のエラーで止めます。挙動としてはビルドが通らないだけで、実行時の問題ではありません。修正は `@escaping` を付けて「関数の呼び出しより長生きする」ことを宣言することです。@autoclosure は式を自動でクロージャに包む別の機能で保存の可否とは無関係、inout は引数の書き戻し、Optional 化は型の話であり、いずれもエスケープの制約を解きません。", "detail": {"concept": "非エスケープが既定なのは、最適化と安全性のためです。エスケープするクロージャは self を捕捉して長生きするため、循環参照やライフサイクルの問題を呼び込みます。@escaping はその注意喚起も兼ねています。", "steps": ["`handlers.append(handler)` は、関数を抜けたあとも handler を保持する操作。", "既定の非エスケープ引数は、関数の終了までに破棄されることが前提。", "前提と実装が矛盾するため、コンパイル時点で拒否される。", "`@escaping` を付けると、長生きすることを型の一部として明示できる。"], "whyCorrect": "@escaping はまさに「関数のスコープを越えて保持される」という意味の属性です。プロパティへの保存という実装と宣言が一致し、コンパイルが通ります。", "commonMistakes": ["エラーメッセージに Optional の語が出ないのに `(() -> Void)?` に変えて回避しようとする間違いです。Optional にしても保存の制約は変わりません。", "@escaping を付けたあと、呼び出し側で self を捕捉すると循環参照が起きやすくなります。@escaping が必要になった時点で [weak self] の要否を確認します。"], "takeaway": "クロージャを保存するなら @escaping。付けた瞬間に循環参照の検討が必要になる。", "example": {"code": "final class Fetcher {\n    var handlers: [() -> Void] = []\n    func register(_ handler: @escaping () -> Void) { handlers.append(handler) }\n    func fireAll() { handlers.forEach { $0() } }\n}\nlet f = Fetcher()\nf.register { print(\"A\") }\nf.register { print(\"B\") }\nf.fireAll()", "output": "A\nB", "explanation": "登録したクロージャが関数を抜けたあとも保持され、あとからまとめて実行できています。"}}, "seriesId": "swift-closure-capture", "seriesStep": 3}, {"id": "practice-swift-040", "track": "swift", "lessonId": "swift-collections", "type": "matching", "difficulty": 2, "title": "コレクションの性質を対応づける", "prompt": "コレクションの型やメンバーと、その性質を対応させてください。", "skills": ["collections"], "content": {"left": [{"id": "l1", "label": "Array"}, {"id": "l2", "label": "Set"}, {"id": "l3", "label": "Dictionary"}, {"id": "l4", "label": "count"}], "right": [{"id": "r1", "label": "並び順を保ち、同じ値を何度でも持てる"}, {"id": "r2", "label": "並び順を持たず、同じ値は1つだけ。含まれるかの判定が速い"}, {"id": "r3", "label": "キーと値の組を持ち、キーを指定して値を取り出す"}, {"id": "r4", "label": "そのコレクションの要素数を返すプロパティ"}, {"id": "r5", "label": "各要素を変換して新しい配列を作るメソッド"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["3つのコレクション型は「順番があるか」「重複を許すか」で区別できます。", "キーで引くという性質を持つのは1つだけです。", "count はメソッドではなくプロパティなので、かっこを付けずに使います。r5 は map の説明です。"], "explanation": "Array は順序を保ち重複も許すので、履歴や表示順のあるリストに向きます。Set は順序を持たず重複を許さない代わりに、要素の有無の判定が要素数によらず高速です。Dictionary はキーから値を引く対応表です。count はどのコレクションにもあるプロパティで、要素数を返します。r5 は map の説明であり、この中のどれにも対応しません。", "detail": {"concept": "どのコレクションを選ぶかは「順番が意味を持つか」「重複を許すか」「何をキーに取り出すか」の3つで決まります。あとから変えると影響範囲が大きいので、最初に決める価値があります。", "steps": ["表示順やインデックスが意味を持つなら Array。", "重複を排除したい、含まれるかを何度も調べるなら Set。", "IDから対象を引くような対応関係なら Dictionary。", "要素数はどれも count プロパティで取得できる。"], "whyCorrect": "3つの型は目的が重ならないよう設計されており、それぞれの説明文と1対1で対応します。count はコレクション共通のプロパティです。", "commonMistakes": ["何でも Array にしてしまい、`contains` を大量に呼んで遅くなるケースです。含有判定が主目的なら Set が適しています。", "Set や Dictionary の反復順が毎回同じだと期待する間違いです。順序は保証されないため、表示前に sorted() が必要です。"], "takeaway": "順序が要るなら Array、重複排除と高速な判定なら Set、対応表なら Dictionary。", "example": {"code": "let a = [1, 2, 2, 3]\nlet s = Set(a)\nlet d = [\"one\": 1, \"two\": 2]\nprint(a.count, s.count, d.count)", "output": "4 3 2", "explanation": "同じデータでも Set にすると重複が消えるため、要素数が変わります。"}}}, {"id": "practice-swift-041", "track": "swift", "lessonId": "swift-array", "type": "fillBlank", "difficulty": 2, "title": "配列の追加と削除のメソッドを選ぶ", "prompt": "末尾に \"c\" を追加し、先頭の要素を削除します。空欄を埋めてください。", "skills": ["collections"], "content": {"template": "var items = [\"a\", \"b\"]\nitems.{{1}}(\"c\")\nitems.{{2}}(at: 0)\nprint(items)", "blanks": [{"id": "1", "options": ["append", "add", "push", "insert"]}, {"id": "2", "options": ["remove", "delete", "drop", "removeAll"]}]}, "solution": {"answers": {"1": "append", "2": "remove"}}, "hints": ["末尾に1つ足すメソッドの名前を思い出してください。他言語の add や push とは名前が違います。", "2つめは `at:` というラベルを取ります。位置を指定して1つ取り除くメソッドです。", "追加は末尾に付け足す意味の英単語、削除は取り除く意味の英単語です。全消去のメソッドではありません。"], "explanation": "Swift の Array で末尾に追加するのは `append(_:)` です。位置を指定して1つ削除するのは `remove(at:)` で、削除した要素を戻り値として返します。`insert` は `insert(_:at:)` の形で位置指定の挿入に使うため、ここでは末尾追加として `insert(\"c\")` とは書けません。実行すると [\"a\", \"b\", \"c\"] から先頭の \"a\" が消えて [\"b\", \"c\"] が出力されます。", "detail": {"concept": "Swift のコレクション API は「操作名 + ラベル」で意味が読み取れるように設計されています。append は末尾専用、insert は位置指定、remove は位置指定の削除です。", "steps": ["`items.append(\"c\")` で [\"a\", \"b\", \"c\"] になる。", "`items.remove(at: 0)` は先頭の \"a\" を取り除き、その値を返す（ここでは使っていない）。", "配列は [\"b\", \"c\"] になる。", "print すると [\"b\", \"c\"] と表示される。"], "whyCorrect": "append はラベルなしで1つの値を受け取り、remove は at: ラベルで位置を受け取ります。テンプレートの呼び出しの形と、これらのシグネチャがちょうど一致します。", "commonMistakes": ["`add` や `push` は Swift の Array には存在しません。他言語の名前をそのまま使うとコンパイルエラーになります。", "`remove(at:)` は存在しない添字を渡すと実行時にクラッシュします。位置が不確かなときは indices.contains で確認します。", "配列を書き換えるので `var` が必要です。let のままだと 'Cannot use mutating member' エラーになります。"], "takeaway": "末尾追加は append、位置削除は remove(at:)。どちらも var の配列にだけ使える。", "example": {"code": "var items = [\"a\", \"b\"]\nitems.append(\"c\")\nlet removed = items.remove(at: 0)\nprint(removed, items)", "output": "a [\"b\", \"c\"]", "explanation": "remove(at:) が削除した要素を返していることを、戻り値を受け取って確認できます。"}}, "seriesId": "swift-array-safety", "seriesStep": 1}, {"id": "practice-swift-042", "track": "swift", "lessonId": "swift-array", "type": "bugHunt", "difficulty": 3, "title": "空配列でクラッシュする行を見つける", "prompt": "このコードはビルドできますが、実行するとクラッシュします。原因になっている行を選んでください。", "skills": ["collections", "optional", "debugging"], "content": {"lines": [{"id": "l1", "code": "let names: [String] = []"}, {"id": "l2", "code": "let first = names.first!"}, {"id": "l3", "code": "print(first)"}]}, "solution": {"optionId": "l2", "fixedCode": "let names: [String] = []\nif let first = names.first {\n    print(first)\n} else {\n    print(\"名前がありません\")\n}"}, "hints": ["配列が空のとき、first は何を返すでしょうか。", "`!` はOptionalの中身を強制的に取り出す演算子で、中身がなければ実行を止めます。", "空配列の first は nil です。その nil を強制アンラップしている行が原因です。"], "explanation": "バグは2行目です。`names.first` は「要素がないかもしれない」ため String? を返し、空配列では nil になります。そこに `!` を付けると nil の強制アンラップとなり、実行時に 'Fatal error: Unexpectedly found nil while unwrapping an Optional value' でプロセスが停止します。型としては正しいのでコンパイルは通り、テストデータが空でないと発覚しません。修正は if let で安全に取り出し、空のときの動作を明示することです。`names.first ?? \"名前がありません\"` と既定値を与える書き方も同じ意図を表せます。", "detail": {"concept": "Optional は「値がないかもしれない」という状態を型で表す仕組みです。`!` はその検査を飛ばす指示なので、nil が来ないと自分で保証できる場面以外では使いません。", "steps": ["`names` は空配列なので要素が0個。", "`names.first` は Optional の nil を返す。", "`!` が nil を取り出そうとして実行時エラーになる。", "`if let` なら nil のときは else 側に進み、クラッシュしない。"], "whyCorrect": "クラッシュは強制アンラップを書いた行で発生します。1行目の空配列の宣言自体は正当で、空であること自体は誤りではありません。", "commonMistakes": ["print の行が原因だと考える間違いです。print に渡る前に、すでにアンラップで停止しています。", "`names[0]` に書き換えても 'Index out of range' で同じくクラッシュします。空である可能性を扱わない限り解決しません。"], "takeaway": "`!` は「絶対にnilでない」と自分が保証する宣言。保証できないなら if let か ??。", "example": {"code": "let names: [String] = []\nprint(names.first ?? \"名前がありません\")\nprint(names.isEmpty)", "output": "名前がありません\ntrue", "explanation": "?? で既定値を与えると、空配列でもクラッシュせずに動作を続けられます。"}}, "seriesId": "swift-array-safety", "seriesStep": 2}, {"id": "practice-swift-043", "track": "swift", "lessonId": "swift-array", "type": "buildFunction", "difficulty": 3, "title": "安全に添字アクセスする関数を組み立てる", "prompt": "範囲外の添字を渡されても落ちず、nil を返す関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["collections", "optional", "functions"], "content": {"blocks": [{"id": "b1", "code": "func element(_ items: [String], at index: Int) -> String? {"}, {"id": "b2", "code": "    guard items.indices.contains(index) else {"}, {"id": "b3", "code": "        return nil"}, {"id": "b4", "code": "    }"}, {"id": "b5", "code": "    return items[index]"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    return items[index]!"}, {"id": "b8", "code": "    if index < items.count {"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["戻り値が String? なので、見つからないときは nil を返せます。", "有効な添字の集合は配列自身が indices として持っています。負の数のチェックも同時に済みます。", "宣言 → guard で範囲チェック → nilを返す → guardを閉じる → 要素を返す → 関数を閉じる、の6行です。"], "explanation": "`items.indices` はその配列で有効な添字の範囲（0..<count）なので、`contains(index)` だけで下限と上限の両方を検査できます。guard を通過した後は添字が有効だと保証されているため、`items[index]` は安全です。`index < items.count` だけの判定では負の添字を通してしまい、`items[-1]` でクラッシュします。`items[index]!` は非Optionalの要素に `!` を付けているだけで意味がなく、範囲外のクラッシュも防げません。", "detail": {"concept": "「落ちない添字アクセス」は、検査を先に済ませて保証を作ってから本体を書く典型です。guard で異常系を閉じてしまうと、以降のコードは前提が成り立った世界だけを扱えます。", "steps": ["`-> String?` は「見つからない可能性がある」ことを型で表明する。", "`items.indices` は 0..<items.count に相当する範囲。", "`contains(index)` で負の値も count 以上も同時に弾ける。", "guard を抜けた時点で添字は有効なので、`items[index]` がクラッシュしない。"], "whyCorrect": "indices による検査が有効な添字の定義そのものなので、上限・下限の書き間違いが起こりません。検査を通った後だけ添字アクセスするという順序が、安全性を保証します。", "commonMistakes": ["`index < items.count` だけを見て負の数を忘れる間違いです。-1 を渡されると範囲外アクセスでクラッシュします。", "戻り値を String にして「見つからなければ空文字」と決めてしまうと、空文字の要素と区別できなくなります。ないことは nil で表すのが安全です。"], "takeaway": "範囲チェックは indices.contains。検査してから使う順序が安全性を作る。", "example": {"code": "func element(_ items: [String], at index: Int) -> String? {\n    guard items.indices.contains(index) else { return nil }\n    return items[index]\n}\nlet items = [\"a\", \"b\"]\nprint(element(items, at: 1) ?? \"なし\")\nprint(element(items, at: 5) ?? \"なし\")\nprint(element(items, at: -1) ?? \"なし\")", "output": "b\nなし\nなし", "explanation": "範囲外も負の添字も、クラッシュせずに nil として扱えていることが確認できます。"}}, "seriesId": "swift-array-safety", "seriesStep": 3}, {"id": "practice-swift-044", "track": "swift", "lessonId": "swift-array", "type": "reorder", "difficulty": 3, "title": "重複を除いて並べ替える手順を並べる", "prompt": "[3, 1, 3, 2] から重複を除き、小さい順に並べて表示します。ブロックを正しい順に並べ替えてください。", "skills": ["collections"], "content": {"blocks": [{"id": "b1", "code": "let unique = Array(Set(raw))"}, {"id": "b2", "code": "let raw = [3, 1, 3, 2]"}, {"id": "b3", "code": "let sorted = unique.sorted()"}, {"id": "b4", "code": "print(sorted)"}]}, "solution": {"order": ["b2", "b1", "b3", "b4"]}, "hints": ["重複を除くには、重複を許さないコレクションを一度経由します。", "Set は並び順を保証しないので、並べ替えは重複除去のあとに行う必要があります。", "元データ → Set で重複除去 → sorted で並べ替え → 表示、の順です。"], "explanation": "Set は同じ値を1つしか持たないので、`Set(raw)` に通すと重複が消えます。ただし Set は並び順を保証しないため、そのまま表示すると順番が不定になります。そこで Array に戻してから sorted() で昇順に並べ替え、[1, 2, 3] を得ます。順序を先に決めても Set を通した時点で崩れるため、必ず「重複除去 → 並べ替え」の順にする必要があります。", "detail": {"concept": "重複除去と並べ替えは独立した操作ですが、Set が順序を壊すため順番に依存関係が生まれます。データ変換のパイプラインでは、各段が何を保証し何を壊すかを意識します。", "steps": ["`let raw = [3, 1, 3, 2]` … 元データ。3が重複している。", "`Set(raw)` … {1, 2, 3} になり重複が消える。順序は不定。", "`Array(...)` で配列に戻し、`sorted()` で昇順に並べる。", "`print(sorted)` は [1, 2, 3] を出力する。"], "whyCorrect": "重複除去を先に行っても、その後の sorted() が順序を確定させるため結果が安定します。逆順にすると Set 化で順序が失われ、出力が実行ごとに変わり得ます。", "commonMistakes": ["`Array(Set(raw))` の結果をそのまま表示して「たまたま並んでいた」と判断する間違いです。Set の反復順は保証されず、実行やバージョンによって変わります。", "順序を保ったまま重複を除きたい場合、Set 経由では要件を満たしません。既出集合を持ちながら filter する方法が必要です。"], "takeaway": "Set は重複を消すが順序も消す。表示前に必ず sorted() で確定させる。", "example": {"code": "let raw = [3, 1, 3, 2]\nvar seen = Set<Int>()\nlet keepOrder = raw.filter { seen.insert($0).inserted }\nprint(Array(Set(raw)).sorted(), keepOrder)", "output": "[1, 2, 3] [3, 1, 2]", "explanation": "元の順序を保ったまま重複を除きたいときは、Set を判定にだけ使って filter します。"}}, "seriesId": "swift-array-safety", "seriesStep": 4}, {"id": "practice-swift-045", "track": "swift", "lessonId": "swift-set", "type": "fillBlank", "difficulty": 3, "title": "集合演算のメソッドを選ぶ", "prompt": "2つの集合の共通部分と、すべてを合わせた集合を求めます。空欄を埋めてください。", "skills": ["collections"], "content": {"template": "let a: Set = [1, 2, 3]\nlet b: Set = [3, 4]\nprint(a.{{1}}(b).sorted())\nprint(a.{{2}}(b).sorted())", "blanks": [{"id": "1", "options": ["intersection", "union", "subtracting", "symmetricDifference"]}, {"id": "2", "options": ["union", "intersection", "isSubset", "contains"]}]}, "solution": {"answers": {"1": "intersection", "2": "union"}}, "hints": ["1つめは「両方に入っている要素だけ」を集めます。結果は [3] になるはずです。", "2つめは「どちらかに入っている要素すべて」です。結果は4要素になります。", "共通部分は交差、全部を合わせるのは和集合を表す英単語です。isSubset は Bool を返すので sorted() できません。"], "explanation": "`intersection` は両方に含まれる要素だけの集合を返すので、a と b では [3] になります。`union` は少なくとも一方に含まれる要素すべてで、[1, 2, 3, 4] です。Set は順序を持たないため、比較しやすいように sorted() で配列にしてから表示しています。`isSubset(of:)` は Bool を返すので `.sorted()` を続けられず、`contains` は要素1つを取るためコンパイルエラーになります。", "detail": {"concept": "Set は数学の集合演算をそのままメソッドとして持っています。フィルタ条件を自分で書くより、意図が名前で伝わり間違いも減ります。", "steps": ["`a.intersection(b)` … 両方にある3だけが残る。", "`a.union(b)` … 1,2,3,4 のすべてが入る。3は重複しない。", "どちらも Set が返るので、表示前に sorted() で順序を確定させる。", "出力は [3] と [1, 2, 3, 4]。"], "whyCorrect": "共通部分と和集合という要件が、それぞれ intersection と union の定義そのものと一致するためです。名前が意味を表しているので、読む側も検証しやすくなります。", "commonMistakes": ["sorted() を省いて出力すると、順序が保証されないため実行ごとに並びが変わり得ます。テストの比較対象にする場合は必ず並べ替えます。", "`subtracting` は差集合（aにありbにないもの）で、共通部分ではありません。名前が近いので取り違えやすい組み合わせです。"], "takeaway": "集合演算は intersection / union / subtracting / symmetricDifference で表現する。", "example": {"code": "let a: Set = [1, 2, 3]\nlet b: Set = [3, 4]\nprint(a.subtracting(b).sorted())\nprint(a.symmetricDifference(b).sorted())", "output": "[1, 2]\n[1, 2, 4]", "explanation": "差集合は a だけにある要素、対称差はどちらか一方だけにある要素を返します。"}}, "seriesId": "swift-set-basics", "seriesStep": 1}, {"id": "practice-swift-046", "track": "swift", "lessonId": "swift-set", "type": "repair", "difficulty": 3, "title": "Setに要素を追加する書き方に直す", "prompt": "この Set への追加はビルドできません。2行目の修正として正しいものを選んでください。", "skills": ["collections", "debugging"], "content": {"code": "var tags: Set<String> = []\ntags.append(\"swift\")\nprint(tags)", "options": [{"id": "o1", "code": "tags.insert(\"swift\")"}, {"id": "o2", "code": "tags.add(\"swift\")"}, {"id": "o3", "code": "tags += \"swift\""}, {"id": "o4", "code": "tags[0] = \"swift\""}]}, "solution": {"optionId": "o1", "fixedCode": "var tags: Set<String> = []\ntags.insert(\"swift\")\nprint(tags)"}, "hints": ["append は「末尾に付け足す」という意味です。Set に末尾はあるでしょうか。", "Set は順序を持たないので、位置を前提としたAPIは用意されていません。", "順序に依存しない「入れる」という意味のメソッドを選びます。Set には添字アクセスもありません。"], "explanation": "バグは2行目です。`append` は順序のあるコレクション（Array など）が持つ末尾追加のメソッドで、順序を持たない Set には存在しないため 'Value of type Set<String> has no member append' でビルドが止まります。実行時ではなくコンパイル時のエラーです。Set への追加は `insert(_:)` を使います。insert は追加できたかどうかを (inserted:memberAfterInsert:) というタプルで返すため、重複判定にも使えます。`+=` は Set 同士の和集合には使えますが単一要素には使えず、添字代入も Set には存在しません。", "detail": {"concept": "コレクションのAPI名は、その型が保証する性質を反映しています。append が「末尾」を前提にしている以上、順序のない Set には存在し得ません。名前から性質を逆算できます。", "steps": ["Set は順序を持たないため、末尾という概念がない。", "したがって append は定義されておらず、コンパイルエラーになる。", "`insert(\"swift\")` は要素を追加し、すでにあれば何もしない。", "print(tags) は [\"swift\"] のように表示される。"], "whyCorrect": "insert は Set の性質（重複を持たない・順序がない）と矛盾しない唯一の追加操作です。既に存在する場合も安全に無視されます。", "commonMistakes": ["他言語の add をそのまま使う間違いです。Swift の Set のメソッド名は insert です。", "`tags += [\"swift\"]` のように配列を足そうとする間違いです。Set 同士の formUnion は使えますが、配列との += は定義されていません。"], "takeaway": "Set への追加は insert。append は順序のあるコレクション専用。", "example": {"code": "var tags: Set<String> = []\nprint(tags.insert(\"swift\").inserted)\nprint(tags.insert(\"swift\").inserted)\nprint(tags)", "output": "true\nfalse\n[\"swift\"]", "explanation": "insert の戻り値を見ると、2回目は追加されなかったことが分かります。重複チェックとして使えます。"}}, "seriesId": "swift-set-basics", "seriesStep": 2}, {"id": "practice-swift-047", "track": "swift", "lessonId": "swift-set", "type": "trace", "difficulty": 3, "title": "insertの戻り値を追う", "prompt": "次のコードを実行したとき、表示される3行を選んでください。", "skills": ["collections", "debugging"], "content": {"code": "var seen: Set<String> = []\nfor tag in [\"a\", \"b\", \"a\"] {\n    let (inserted, _) = seen.insert(tag)\n    print(tag, inserted)\n}", "options": [{"id": "o1", "label": "a true / b true / a false"}, {"id": "o2", "label": "a true / b true / a true"}, {"id": "o3", "label": "a true / b false / a false"}, {"id": "o4", "label": "a true / b true（2行だけ）"}]}, "solution": {"optionId": "o1"}, "hints": ["ループは3回まわるので、出力も3行です。", "insert は追加が実際に行われたかどうかを返します。", "3回目の \"a\" はすでに集合に入っているため、追加は行われません。"], "explanation": "`insert` は (inserted: Bool, memberAfterInsert: Element) というタプルを返します。1回目の \"a\" は新規なので inserted は true、2回目の \"b\" も新規で true、3回目の \"a\" はすでに含まれているため追加されず false になります。ループは配列の3要素すべてに対して回るので、出力は3行です。この戻り値は「初めて見た要素だけを処理する」フィルタとしてよく使われます。", "detail": {"concept": "Set の insert は副作用（追加）と情報（追加できたか）を同時に返します。この形は「重複を除きつつ元の順序を保つ」といった処理を1行で書けるようにします。", "steps": ["1回目: seen は空。\"a\" が追加され inserted = true。", "2回目: seen は {a}。\"b\" が追加され inserted = true。", "3回目: seen は {a, b}。\"a\" は既存なので追加されず inserted = false。", "各回で print されるので合計3行。"], "whyCorrect": "inserted は「この呼び出しで集合が変化したか」を表します。3回目は集合の内容が変わらないため false になります。", "commonMistakes": ["重複要素はループから除外されると考えて2行だと答える間違いです。ループが回る回数は元の配列の要素数で決まります。", "insert が Bool そのものを返すと思い込む間違いです。実際はタプルで、Bool は inserted ラベル側です。"], "takeaway": "insert の戻り値 inserted は「初めて見たか」の判定に使える。", "example": {"code": "var seen = Set<String>()\nlet raw = [\"a\", \"b\", \"a\", \"c\", \"b\"]\nprint(raw.filter { seen.insert($0).inserted })", "output": "[\"a\", \"b\", \"c\"]", "explanation": "元の順序を保ったまま重複を除く定番の書き方です。insert の戻り値をそのまま条件に使っています。"}}, "seriesId": "swift-set-basics", "seriesStep": 3}, {"id": "practice-swift-048", "track": "swift", "lessonId": "swift-collections", "type": "chooseBlocks", "difficulty": 3, "title": "出現回数を数えるのに必要な行だけ選ぶ", "prompt": "単語ごとの出現回数を辞書に集計し、\"a\" の回数を表示します。必要な行だけを選び、正しい順に並べてください。", "skills": ["collections", "optional"], "content": {"blocks": [{"id": "b1", "code": "let words = [\"a\", \"b\", \"a\"]"}, {"id": "b2", "code": "var counts: [String: Int] = [:]"}, {"id": "b3", "code": "for w in words { counts[w, default: 0] += 1 }"}, {"id": "b4", "code": "print(counts[\"a\"] ?? 0)"}, {"id": "b5", "code": "var counts: [String: Int] = []"}, {"id": "b6", "code": "for w in words { counts[w] += 1 }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["空の辞書リテラルは、空の配列リテラルとは書き方が違います。", "辞書の添字アクセスは Optional を返すため、そのまま += はできません。", "存在しないキーに既定値を与えながら更新する書き方があります。取り出すときも既定値が必要です。"], "explanation": "空の辞書は `[:]` と書きます（`[]` は空配列なので型が合いません）。辞書の添字は「キーがないかもしれない」ため Int? を返し、`counts[w] += 1` は Optional への加算になってコンパイルできません。`counts[w, default: 0] += 1` は、キーがなければ0として扱ってから加算する書き方で、初回の登録と2回目以降の加算を1行で表せます。取り出すときも `counts[\"a\"]` は Int? なので `?? 0` を付けます。結果は2です。", "detail": {"concept": "辞書の添字が Optional を返すのは「そのキーが存在しないかもしれない」からです。default 付き添字は、この Optional を扱う定型処理を言語機能として用意したものです。", "steps": ["`var counts: [String: Int] = [:]` で空の辞書を作る。", "`counts[w, default: 0] += 1` は、キーが未登録なら0から始めて1を足す。", "\"a\" は2回、\"b\" は1回登場するので counts は [\"a\": 2, \"b\": 1] になる。", "`counts[\"a\"] ?? 0` は Int? を Int にして2を出力する。"], "whyCorrect": "default 付き添字が Optional の分岐を吸収するため、if let や ?? を毎回書かずに集計できます。取り出し時の ?? も、キーがない場合の値を明示しています。", "commonMistakes": ["`[]` で辞書を初期化しようとする間違いです。空の辞書リテラルは `[:]` です。", "`counts[w] = counts[w] + 1` と書くと Optional の加算になり失敗します。`(counts[w] ?? 0) + 1` なら通りますが、default 付き添字のほうが簡潔です。"], "takeaway": "辞書の集計は `dict[key, default: 0] += 1`。空辞書リテラルは `[:]`。", "example": {"code": "let words = [\"a\", \"b\", \"a\"]\nvar counts: [String: Int] = [:]\nfor w in words { counts[w, default: 0] += 1 }\nprint(counts.sorted { $0.key < $1.key })", "output": "[(key: \"a\", value: 2), (key: \"b\", value: 1)]", "explanation": "辞書は順序を持たないため、表示前にキーで並べ替えると結果が安定します。"}}, "seriesId": "swift-dictionary-count", "seriesStep": 1}, {"id": "practice-swift-049", "track": "swift", "lessonId": "swift-dictionary", "type": "chooseBlocks", "difficulty": 2, "title": "辞書から安全に取り出す行だけ選ぶ", "prompt": "在庫があればその数を、キーがなければ「取り扱いなし」を表示します。必要な行だけを選び、正しい順に並べてください。", "skills": ["collections", "optional"], "content": {"blocks": [{"id": "b1", "code": "let stock = [\"apple\": 3, \"banana\": 0]"}, {"id": "b2", "code": "if let count = stock[\"apple\"] {"}, {"id": "b3", "code": "    print(\"在庫 \\(count)\")"}, {"id": "b4", "code": "} else {"}, {"id": "b5", "code": "    print(\"取り扱いなし\")"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    print(\"在庫 \\(stock[\"apple\"]!)\")"}, {"id": "b8", "code": "if stock[\"apple\"] != nil {"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5", "b6"], "order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["辞書の添字アクセスは「キーがないかもしれない」ので Optional を返します。", "nil かどうかを調べてから改めて取り出すと、同じ辞書を2回引くことになり、間に値が変わる可能性も残ります。", "取り出しと存在確認を同時に行う構文を使います。取り出せた値はそのままブロックの中で使えます。"], "explanation": "`stock[\"apple\"]` は Int? を返すため、if let で「取り出せたらその値を使う」形にします。取り出した count はブロックの中で非Optionalの Int として使えるので、`!` は不要です。`if stock[\"apple\"] != nil` で確認してから `stock[\"apple\"]!` と取り出す書き方は、辞書を2回引くうえに強制アンラップが残るため、if let に比べて壊れやすくなります。実行すると「在庫 3」が表示されます。", "detail": {"concept": "辞書の添字が Optional を返すのは、キーの不在を型で表しているからです。if let は「取り出せたかどうか」と「取り出した値」を1つの構文で扱えるため、確認と使用がずれません。", "steps": ["`stock[\"apple\"]` は Int? を返す。キーがあれば Optional(3)。", "`if let count = ...` は中身を取り出せた場合だけ true 側に進む。", "count は Int なので、そのまま文字列補間に使える。", "キーがない場合は else 側に進み、「取り扱いなし」が表示される。"], "whyCorrect": "if let は取り出しと分岐を同時に行うため、値が存在するという保証がブロック内で型として保たれます。強制アンラップが不要になり、クラッシュの経路が消えます。", "commonMistakes": ["`!= nil` で確認してから `!` で取り出す書き方は、確認と取り出しが別の式になるため、あとで片方だけ書き換えたときに壊れます。", "値が 0 のキー（banana）を「存在しない」と混同する間違いです。Optional(0) は nil ではないので if let は成功します。"], "takeaway": "辞書の値は if let で取り出す。nil チェック + ! は同じことを危険にやっているだけ。", "example": {"code": "let stock = [\"apple\": 3, \"banana\": 0]\nfor key in [\"apple\", \"banana\", \"melon\"] {\n    if let count = stock[key] { print(key, count) } else { print(key, \"取り扱いなし\") }\n}", "output": "apple 3\nbanana 0\nmelon 取り扱いなし", "explanation": "値が 0 の banana は「存在する」と判定され、存在しない melon だけが else 側に入ります。"}}, "seriesId": "swift-dictionary-count", "seriesStep": 2}, {"id": "practice-swift-050", "track": "swift", "lessonId": "swift-dictionary", "type": "bugHunt", "difficulty": 3, "title": "存在しないキーを強制アンラップしている行を見つける", "prompt": "このコードはビルドできますが、実行するとクラッシュします。原因になっている行を選んでください。", "skills": ["collections", "optional", "debugging"], "content": {"lines": [{"id": "l1", "code": "var stock = [\"apple\": 3]"}, {"id": "l2", "code": "let key = \"banana\""}, {"id": "l3", "code": "stock[key]! += 1"}, {"id": "l4", "code": "print(stock[key] ?? 0)"}]}, "solution": {"optionId": "l3", "fixedCode": "var stock = [\"apple\": 3]\nlet key = \"banana\"\nstock[key, default: 0] += 1\nprint(stock[key] ?? 0)"}, "hints": ["辞書に \"banana\" というキーは登録されているでしょうか。", "`!` は Optional の中身を検査せずに取り出す演算子です。中身がなければ実行を止めます。", "存在しないキーに対して `!` を使って加算している行が原因です。既定値を与える書き方があります。"], "explanation": "バグは3行目です。stock には \"banana\" が登録されていないため `stock[key]` は nil を返し、そこに `!` を付けたことで 'Fatal error: Unexpectedly found nil while unwrapping an Optional value' が発生してプロセスが停止します。型としては正しいのでコンパイルは通り、キーが存在するデータでテストしていると発覚しません。修正は `stock[key, default: 0] += 1` と書くことです。これはキーがなければ0から始めて加算する構文で、初回登録と加算を同じ1行で扱えます。修正後は banana が1になり、4行目は1を表示します。", "detail": {"concept": "辞書は「キーがあるとは限らない」という前提の型です。集計処理では未登録キーが必ず初回に現れるため、既定値付き添字がそのまま定石になります。", "steps": ["`stock` に登録されているキーは \"apple\" だけ。", "`stock[\"banana\"]` は nil を返す。", "`!` が nil を取り出そうとして実行時エラーになる。", "`stock[key, default: 0] += 1` なら、未登録キーを0とみなして1に更新できる。"], "whyCorrect": "クラッシュしているのは強制アンラップを書いた3行目です。4行目は `?? 0` を使っており、nil でも安全に動作するため原因になり得ません。", "commonMistakes": ["`stock[key] = (stock[key] ?? 0) + 1` でも正しく動きますが、同じキーを2回引くぶん冗長です。default 付き添字のほうが意図が明確です。", "クラッシュした行だけを見て「加算が悪い」と考える間違いです。加算自体は正しく、値の取り出し方が問題です。"], "takeaway": "辞書の更新は `dict[key, default: 初期値]`。`!` は未登録キーで必ず落ちる。", "example": {"code": "var stock = [\"apple\": 3]\nfor key in [\"apple\", \"banana\", \"banana\"] {\n    stock[key, default: 0] += 1\n}\nprint(stock[\"apple\"] ?? 0, stock[\"banana\"] ?? 0)", "output": "4 2", "explanation": "登録済みのキーは加算され、未登録のキーは0から始まって正しく数えられます。"}}, "seriesId": "swift-dictionary-count", "seriesStep": 3}, {"id": "practice-swift-051", "track": "swift", "lessonId": "swift-dictionary", "type": "trace", "difficulty": 3, "title": "updateValueの戻り値を追う", "prompt": "次のコードを実行したとき、表示される内容を選んでください。", "skills": ["collections", "optional", "debugging"], "content": {"code": "var scores = [\"a\": 1]\nlet old = scores.updateValue(9, forKey: \"a\")\nlet none = scores.updateValue(5, forKey: \"b\")\nprint(old ?? -1, none ?? -1, scores[\"a\"] ?? -1)", "options": [{"id": "o1", "label": "1 -1 9"}, {"id": "o2", "label": "9 5 9"}, {"id": "o3", "label": "1 5 9"}, {"id": "o4", "label": "9 -1 1"}]}, "solution": {"optionId": "o1"}, "hints": ["updateValue が返すのは、更新後の値ではありません。", "キーが存在しなかった場合、返すべき「前の値」は存在しません。", "\"a\" の前の値は1、\"b\" は新規なので nil、更新後の scores[\"a\"] は9です。"], "explanation": "`updateValue(_:forKey:)` は「そのキーに入っていた古い値」を Optional で返します。\"a\" には1が入っていたので old は Optional(1)、\"b\" は未登録だったので none は nil になり `?? -1` で -1 と表示されます。更新自体は成功しているので scores[\"a\"] は9です。したがって出力は「1 -1 9」です。戻り値が古い値であるおかげで、「上書きしたのか新規追加なのか」を呼び出し側で判定できます。", "detail": {"concept": "更新系APIが古い値を返す設計は、変更の前後を比較したり、初回だけ別処理をしたりするために使われます。添字代入では得られない情報です。", "steps": ["`scores` の初期値は [\"a\": 1]。", "`updateValue(9, forKey: \"a\")` は古い値 1 を返し、辞書は [\"a\": 9] になる。", "`updateValue(5, forKey: \"b\")` は古い値がないので nil を返し、辞書に \"b\": 5 が追加される。", "`scores[\"a\"]` は更新後の 9。出力は「1 -1 9」。"], "whyCorrect": "old と none の違いは、キーが元から存在したかどうかだけで決まります。更新後の値はどちらの場合も辞書に反映されています。", "commonMistakes": ["更新後の値が返ると思い込んで「9 5 9」を選ぶ間違いです。返るのは更新前の値です。", "nil が返ることを失敗と解釈する間違いです。nil は「前の値がなかった＝新規追加だった」という成功の情報です。"], "takeaway": "updateValue は古い値を返す。nil は新規追加を意味する。", "example": {"code": "var scores = [\"a\": 1]\nif scores.updateValue(9, forKey: \"a\") == nil { print(\"新規\") } else { print(\"上書き\") }\nif scores.updateValue(5, forKey: \"b\") == nil { print(\"新規\") } else { print(\"上書き\") }", "output": "上書き\n新規", "explanation": "戻り値が nil かどうかで、新規追加と上書きを判別できます。"}}, "seriesId": "swift-dictionary-count", "seriesStep": 4}, {"id": "practice-swift-052", "track": "swift", "lessonId": "swift-dictionary", "type": "buildFunction", "difficulty": 3, "title": "頭文字でグループ分けする関数を組み立てる", "prompt": "単語を頭文字ごとにまとめた辞書を返す関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["collections", "functions", "optional"], "content": {"blocks": [{"id": "b1", "code": "func groupByFirstLetter(_ words: [String]) -> [Character: [String]] {"}, {"id": "b2", "code": "    var result: [Character: [String]] = [:]"}, {"id": "b3", "code": "    for w in words {"}, {"id": "b4", "code": "        guard let first = w.first else { continue }"}, {"id": "b5", "code": "        result[first, default: []].append(w)"}, {"id": "b6", "code": "    }"}, {"id": "b7", "code": "    return result"}, {"id": "b8", "code": "}"}, {"id": "b9", "code": "        result[first] = w"}, {"id": "b10", "code": "    var result: [Character: [String]] = []"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["空の辞書リテラルは `[:]` です。`[]` は空配列なので型が合いません。", "空文字列には頭文字がありません。first は Optional を返すので、取り出せない場合をどうするか決める必要があります。", "同じ頭文字の単語は複数あり得るので、値は配列です。既定値を空配列にして append します。"], "explanation": "値が配列である辞書に追加していくときは、`result[first, default: []].append(w)` が定石です。キーが未登録なら空配列から始まり、そこに単語が追加されます。`w.first` は空文字列で nil になるため guard で弾き、continue で次の単語へ進みます。`result[first] = w` は型が [String] ではなく String なのでコンパイルできず、仮に配列にしても毎回上書きされて1件しか残りません。空の辞書リテラルは `[:]` であり `[]` ではありません。", "detail": {"concept": "グループ分けは「キーごとに配列を伸ばす」処理です。既定値付き添字を使うと、キーの初回登録と2回目以降の追加を分岐なしで書けます。", "steps": ["戻り値の型 [Character: [String]] は「頭文字 → 単語の配列」を表す。", "`var result: [Character: [String]] = [:]` で空の辞書を用意する。", "各単語について `w.first` で頭文字を取り出す。空文字列なら nil なので continue。", "`result[first, default: []].append(w)` で、その頭文字の配列に単語を足す。", "全単語を処理したら result を返す。"], "whyCorrect": "default: [] があるおかげで、未登録キーでも空配列に対する append として成立します。既存キーの場合は現在の配列に追加されるため、どちらの場合も同じ1行で正しく動きます。", "commonMistakes": ["`result[first] = [w]` と書くと、同じ頭文字の2件目で上書きされ、最後の1件しか残りません。", "`w.first!` と強制アンラップすると、空文字列が混ざった瞬間にクラッシュします。guard で弾くほうが安全です。", "標準ライブラリの `Dictionary(grouping:by:)` を使えば1行で書けます。手で書く場合の構造を理解しておくと、そちらの挙動も読めます。"], "takeaway": "値が配列の辞書は `dict[key, default: []].append(x)` で伸ばす。", "example": {"code": "let words = [\"apple\", \"avocado\", \"banana\"]\nlet grouped = Dictionary(grouping: words) { $0.first! }\nprint(grouped[\"a\"] ?? [], grouped[\"b\"] ?? [])", "output": "[\"apple\", \"avocado\"] [\"banana\"]", "explanation": "標準ライブラリの Dictionary(grouping:by:) は同じ結果を1行で作ります。手書きの実装はこの中身を分解したものです。"}}, "seriesId": "swift-dictionary-count", "seriesStep": 5}, {"id": "practice-swift-053", "track": "swift", "lessonId": "swift-sequence-transform", "type": "fillBlank", "difficulty": 3, "title": "変換に失敗した要素を落とす", "prompt": "文字列の配列から、数値に変換できたものだけを集めて合計します。空欄を埋めてください。", "skills": ["collections", "optional"], "content": {"template": "let raw = [\"1\", \"x\", \"3\"]\nlet numbers = raw.{{1}} { Int($0) }\nlet total = numbers.{{2}}(0, +)\nprint(numbers, total)", "blanks": [{"id": "1", "options": ["compactMap", "map", "filter", "flatMap"]}, {"id": "2", "options": ["reduce", "map", "sorted", "joined"]}]}, "solution": {"answers": {"1": "compactMap", "2": "reduce"}}, "hints": ["`Int($0)` は変換に失敗すると nil を返します。map をそのまま使うと結果は [Int?] になります。", "nil を取り除きつつ変換する専用のメソッドがあります。", "1つめは「変換して nil を落とす」メソッド、2つめは「初期値から畳み込んで1つの値にする」メソッドです。"], "explanation": "`Int($0)` は Int? を返すため、map では [Int?] になってしまい合計できません。`compactMap` は変換結果が nil の要素を取り除き、[Int] を返します。ここでは \"x\" が落ちて [1, 3] になります。合計は `reduce(0, +)` で求め、4になります。出力は「[1, 3] 4」です。filter は要素を変換できず、sorted や joined は合計になりません。", "detail": {"concept": "compactMap は「変換 + nil の除去」を1つにしたメソッドです。パースや検索のように失敗しうる変換を、後続処理から Optional を追い出した状態で扱えます。", "steps": ["`raw.map { Int($0) }` なら [Optional(1), nil, Optional(3)] になる。", "`compactMap` は nil を除きアンラップするので [1, 3] になる。", "`reduce(0, +)` は初期値0から順に足し込み、1 + 3 = 4 を返す。", "print で「[1, 3] 4」が出力される。"], "whyCorrect": "compactMap によって配列の要素型が Int になるため、以降の reduce が Optional を意識せずに書けます。型を早い段階で確定させるのが要点です。", "commonMistakes": ["map の結果に `!` を付けて回避しようとすると、変換できない要素でクラッシュします。落とすなら compactMap です。", "compactMap と flatMap を混同する間違いです。flatMap はネストした配列を平坦化するメソッドで、Optional を落とす用途では非推奨になっています。"], "takeaway": "失敗しうる変換は compactMap。Optional は早めに配列から追い出す。", "example": {"code": "let raw = [\"1\", \"x\", \"3\"]\nprint(raw.map { Int($0) })\nprint(raw.compactMap { Int($0) })", "output": "[Optional(1), nil, Optional(3)]\n[1, 3]", "explanation": "同じクロージャでも、map と compactMap では結果の型と中身が変わります。"}}, "seriesId": "swift-transform-chain", "seriesStep": 1}, {"id": "practice-swift-054", "track": "swift", "lessonId": "swift-sequence-transform", "type": "reorder", "difficulty": 3, "title": "絞る・変える・並べるの順に組み立てる", "prompt": "20歳以上の人の名前を五十音順（文字列の昇順）で表示します。ブロックを正しい順に並べ替えてください。", "skills": ["collections", "functions"], "content": {"blocks": [{"id": "b1", "code": "    .map { $0.name }"}, {"id": "b2", "code": "let names = people"}, {"id": "b3", "code": "    .filter { $0.age >= 20 }"}, {"id": "b4", "code": "    .sorted()"}, {"id": "b5", "code": "print(names)"}, {"id": "b6", "code": "let people = [(name: \"Yuki\", age: 24), (name: \"Ken\", age: 15), (name: \"Aoi\", age: 31)]"}]}, "solution": {"order": ["b6", "b2", "b3", "b1", "b4", "b5"]}, "hints": ["元データを先に用意します。チェーンは上から下へ順に適用されます。", "年齢で絞り込むには、まだ年齢の情報が残っている必要があります。名前だけにしたあとでは age を参照できません。", "データ → 絞る（filter）→ 名前に変える（map）→ 並べる（sorted）→ 表示、の順です。"], "explanation": "メソッドチェーンは書いた順に適用されるため、年齢で絞る filter は名前だけに変換する map より前に置く必要があります。map のあとでは要素が String になっており、`$0.age` は存在しないためコンパイルエラーになります。並べ替えは文字列に変換したあとに行えば `sorted()` を引数なしで使えます。結果は [\"Aoi\", \"Yuki\"] です。絞ってから変換する順序は、無駄な変換を減らすという意味でも自然です。", "detail": {"concept": "変換チェーンは各段で要素の型が変わります。「今この段では何型の要素を扱っているか」を意識すると、使えるメソッドとプロパティが自然に決まります。", "steps": ["`people` の要素は (name: String, age: Int) のタプル。", "`.filter { $0.age >= 20 }` … まだタプルなので age が使える。Yuki と Aoi が残る。", "`.map { $0.name }` … ここで要素が String になる。[\"Yuki\", \"Aoi\"]。", "`.sorted()` … String は Comparable なので引数なしで昇順に並ぶ。[\"Aoi\", \"Yuki\"]。"], "whyCorrect": "各段の入力型と、その段で参照しているプロパティが一致しているためです。filter を map の後ろに置くと型が合わず、コンパイル時点で弾かれます。", "commonMistakes": ["map を先に書いて `$0.age` を参照し、'Value of type String has no member age' になる間違いです。", "sorted() を先頭に置くと、並べ替えたあとに絞り込むことになり、結果は同じでも無駄な比較が増えます。件数が多いときは差が出ます。"], "takeaway": "チェーンは各段の要素型で考える。絞ってから変換すると型も効率も自然になる。", "example": {"code": "let people = [(name: \"Yuki\", age: 24), (name: \"Ken\", age: 15)]\nprint(people.filter { $0.age >= 20 }.map { $0.name })", "output": "[\"Yuki\"]", "explanation": "filter の時点ではタプル、map のあとは String という型の移り変わりが確認できます。"}}, "seriesId": "swift-transform-chain", "seriesStep": 2}, {"id": "practice-swift-055", "track": "swift", "lessonId": "swift-sequence-transform", "type": "repair", "difficulty": 3, "title": "[Int?] になってしまう変換を直す", "prompt": "numbers を [Int] のままビルドできるようにします。2行目の修正として最も適切なものを選んでください。", "skills": ["collections", "optional", "debugging"], "content": {"code": "let raw = [\"1\", \"x\", \"3\"]\nlet numbers: [Int] = raw.map { Int($0) }\nprint(numbers)", "options": [{"id": "o1", "code": "let numbers: [Int] = raw.compactMap { Int($0) }"}, {"id": "o2", "code": "let numbers: [Int] = raw.map { Int($0)! }"}, {"id": "o3", "code": "let numbers: [Int] = raw.filter { Int($0) != nil }"}, {"id": "o4", "code": "let numbers: [Int?] = raw.map { Int($0) }"}]}, "solution": {"optionId": "o1", "fixedCode": "let raw = [\"1\", \"x\", \"3\"]\nlet numbers: [Int] = raw.compactMap { Int($0) }\nprint(numbers)"}, "hints": ["`Int($0)` の戻り値の型は何でしょうか。map はその型をそのまま要素にします。", "変換に失敗する要素が混ざっているので、強制的に取り出す修正は実行時に落ちます。", "変換と同時に nil を取り除くメソッドがあります。型注釈を [Int?] に変えるのは要件に反します。"], "explanation": "バグは2行目で、`Int($0)` が Int? を返すため map の結果は [Int?] となり、[Int] への代入で 'Cannot convert value of type [Int?] to specified type [Int]' になります。コンパイル時に止まるので実行時の問題ではありません。修正は `compactMap` を使い、変換できなかった要素を落として [Int] を得ることです（結果は [1, 3]）。`Int($0)!` はビルドは通りますが \"x\" の変換で nil を強制アンラップして実行時クラッシュします。filter は要素を変換しないので [String] のままで型が合わず、[Int?] への変更は要件の型を満たしません。", "detail": {"concept": "map は「要素数を保ったまま型を変える」操作なので、変換が失敗しうる場合は Optional がそのまま残ります。失敗した要素を捨ててよいなら compactMap が正解になります。", "steps": ["`Int(\"1\")` は Optional(1)、`Int(\"x\")` は nil。", "map の結果は [Optional(1), nil, Optional(3)] で型は [Int?]。", "[Int] への代入は型不一致でコンパイルエラー。", "compactMap にすると nil が除かれ [1, 3]（型は [Int]）になる。"], "whyCorrect": "compactMap は変換とアンラップと除去を1度に行うため、結果の要素型が Int に確定します。要件の [Int] と一致し、実行時の失敗経路もありません。", "commonMistakes": ["`!` で通す修正は、テストデータに変換できない値がないと問題が表面化しません。本番データで初めて落ちる典型です。", "失敗した要素を無視してよいのか、エラーとして扱うべきなのかは仕様の問題です。無視してよい場合だけ compactMap を選びます。"], "takeaway": "map が [T?] を作ったら compactMap を検討する。`!` はクラッシュを先送りするだけ。", "example": {"code": "let raw = [\"1\", \"x\", \"3\"]\nlet numbers = raw.compactMap { Int($0) }\nprint(numbers, numbers.count, raw.count)", "output": "[1, 3] 2 3", "explanation": "compactMap では要素数が減ります。元の位置との対応が必要な場合は、この点に注意が必要です。"}}, "seriesId": "swift-transform-chain", "seriesStep": 3}, {"id": "practice-swift-056", "track": "swift", "lessonId": "swift-sequence-transform", "type": "shortCode", "difficulty": 3, "title": "配列の合計を求める1行を書く", "prompt": "prices の合計を total という名前で求める1行を書いてください。ループは使わず、畳み込みのメソッドを使います。", "skills": ["collections", "functions"], "content": {"context": "let prices = [120, 80, 200]\n// ここに1行書く（total に合計が入るようにする）\nprint(total)", "contextRun": "let prices = [120, 80, 200]\n{{answer}}\nprint(total)", "placeholder": "例: let total = 配列.メソッド(...)"}, "solution": {"accepted": ["let total = prices.reduce(0, +)", "let total = prices.reduce(0) { $0 + $1 }"]}, "hints": ["初期値と、2つの値をまとめる方法の両方を渡すメソッドです。", "合計なら初期値は0、まとめ方は足し算です。演算子はそのまま関数として渡せます。", "`配列.reduce(初期値, 演算子)` の形、またはクロージャで `{ $0 + $1 }` と書く形のどちらでも構いません。"], "explanation": "`let total = prices.reduce(0, +)` と書きます。reduce は初期値と「途中経過と要素をまとめる関数」を受け取り、1つの値に畳み込みます。Swift では `+` などの演算子もそのまま関数として渡せるため、クロージャを書かずに済みます。`prices.reduce(0) { $0 + $1 }` も同じ意味で、こちらも正解として受け付けます。合計は400です。空配列の場合でも初期値の0が返るので、要素数を気にする必要がありません。", "detail": {"concept": "reduce は「集計」の一般形です。合計・最大・連結など、初期値とまとめ方を変えるだけで別の集計になります。ループと違って途中の変数を自分で管理しません。", "steps": ["初期値0から始める。", "$0（途中経過）と $1（要素）を足す操作を各要素に適用する。", "0 → 120 → 200 → 400 と積み上がる。", "最終的な途中経過が結果として返る。"], "whyCorrect": "reduce の定義そのものが「初期値から順に畳み込む」であり、加算を指定すれば合計になります。演算子を関数として渡せるため、記述も最小になります。", "commonMistakes": ["初期値を書き忘れると引数不足でコンパイルエラーになります。", "`reduce(0, +)` の `+` を `\"+\"` と文字列で書く間違いです。渡すのは演算子（関数）そのものです。"], "takeaway": "合計は reduce(0, +)。初期値があるので空配列でも安全。", "example": {"code": "let prices = [120, 80, 200]\nprint(prices.reduce(0, +))\nprint(prices.max() ?? 0)\nprint([Int]().reduce(0, +))", "output": "400\n200\n0", "explanation": "合計と最大の求め方、空配列でも安全に0が返ることを並べて確認できます。"}}, "seriesId": "swift-transform-chain", "seriesStep": 4}, {"id": "practice-swift-057", "track": "swift", "lessonId": "swift-optionals", "type": "fillBlank", "difficulty": 2, "title": "既定値とOptional chainingを書き分ける", "prompt": "nil のときの既定値を与える書き方と、nil なら計算そのものを飛ばす書き方を使い分けます。空欄を埋めてください。", "skills": ["optional", "syntax"], "content": {"template": "let input: String? = nil\nlet name = input {{1}} \"ゲスト\"\nprint(name)\nlet length = input{{2}}.count\nprint(length ?? -1)", "blanks": [{"id": "1", "options": ["??", "!", "?", ":"]}, {"id": "2", "options": ["?", "!", ".", "??"]}]}, "solution": {"answers": {"1": "??", "2": "?"}}, "hints": ["1つめは「中身があればそれ、なければ右の値」を選ぶ演算子です。", "2つめは「nil ならそこで打ち切って nil を返す」記号です。強制的に取り出す記号ではありません。", "1つめは記号を2つ並べたもの、2つめは1文字の疑問符です。どちらもクラッシュしません。"], "explanation": "`??` は nil 合体演算子で、左が nil のときだけ右の既定値を返します。input は nil なので name は \"ゲスト\" になります。`input?.count` は Optional chaining で、input が nil なら count を評価せずに nil を返します。結果は Int? なので `?? -1` を付けて -1 と表示します。どちらも nil で落ちない書き方であり、`!` を使うと両方ともクラッシュします。", "detail": {"concept": "Optional の扱いには「既定値を与える（??）」「安全に辿る（?.）」「取り出して分岐する（if let / guard let）」の3系統があります。目的が違うので、状況に応じて選びます。", "steps": ["`input ?? \"ゲスト\"` … input が nil なので \"ゲスト\" が採用され、型は String。", "`input?.count` … input が nil なので count は呼ばれず、結果は nil（型は Int?）。", "`length ?? -1` … nil なので -1 が表示される。", "input に値があれば、それぞれ元の文字列と文字数が表示される。"], "whyCorrect": "?? は値の欠如を既定値で埋め、?. は値がないときに処理ごと飛ばします。どちらも nil を安全に扱うため、実行時エラーが起きません。", "commonMistakes": ["`input!.count` と書くと nil のときにクラッシュします。既定値を決められるなら ?? か ?. を使います。", "`input?.count ?? -1` の `?? -1` を忘れると、print に Optional(2) のような表示が出て意図とずれます。"], "takeaway": "既定値なら ??、辿るだけなら ?.。どちらも nil で落ちない。", "example": {"code": "let a: String? = \"Yuki\"\nlet b: String? = nil\nprint(a ?? \"ゲスト\", b ?? \"ゲスト\")\nprint(a?.count ?? -1, b?.count ?? -1)", "output": "Yuki ゲスト\n4 -1", "explanation": "値があるときとないときを並べると、?? と ?. の役割の違いがはっきりします。"}}, "seriesId": "swift-optional-handling", "seriesStep": 1}, {"id": "practice-swift-058", "track": "swift", "lessonId": "swift-optionals", "type": "bugHunt", "difficulty": 2, "title": "Optionalをそのまま変換に渡している行を見つける", "prompt": "このコードはビルドできません。原因になっている行を選んでください。", "skills": ["optional", "types", "debugging"], "content": {"lines": [{"id": "l1", "code": "let text: String? = \"12\""}, {"id": "l2", "code": "let n = Int(text)"}, {"id": "l3", "code": "print(n ?? 0)"}]}, "solution": {"optionId": "l2", "fixedCode": "let text: String? = \"12\"\nlet n = text.flatMap { Int($0) }\nprint(n ?? 0)"}, "hints": ["text の型は String ではなく String? です。", "`Int(_:)` は String を受け取る初期化子で、String? は受け取れません。", "Optional のまま渡すのではなく、中身を取り出してから変換するか、中身に対して変換を適用する必要があります。"], "explanation": "バグは2行目です。text は String? なので、String を受け取る `Int(_:)` にそのまま渡すことはできず 'Value of optional type String? must be unwrapped' というコンパイルエラーになります。ビルドが通らないだけで実行時の問題ではありません。修正方法は複数あり、`text.flatMap { Int($0) }` は「値があれば変換し、なければ nil」を1行で表せます（結果は Optional(12)）。`if let text { Int(text) }` のように先に取り出してから変換しても構いません。3行目は `?? 0` で Optional を安全に扱っており問題ありません。", "detail": {"concept": "Optional は「値そのもの」ではなく「値があるかもしれない箱」です。箱のまま関数に渡すことはできず、開けるか、箱の中身に対して操作を適用する必要があります。", "steps": ["`text` は String? の箱。中身は \"12\"。", "`Int(_:)` の引数は String なので、箱のままでは型が合わない。", "`text.flatMap { Int($0) }` は、中身があるときだけクロージャを適用する。", "クロージャ自体が Int? を返すため、flatMap によって Int?? ではなく Int? に平坦化される。"], "whyCorrect": "エラーは Optional を非Optionalの引数に渡した2行目で発生します。1行目の宣言は意図どおりで、3行目は Optional を正しく扱っています。", "commonMistakes": ["`Int(text!)` で回避すると、text が nil のときにクラッシュします。ビルドは通るので危険な回避策です。", "`text.map { Int($0) }` と書くと Int?? という二重の Optional になります。クロージャが Optional を返すときは flatMap です。"], "takeaway": "Optional は箱。関数に渡す前に開けるか、map / flatMap で中身に適用する。", "example": {"code": "let a: String? = \"12\"\nlet b: String? = nil\nprint(a.flatMap { Int($0) } ?? -1)\nprint(b.flatMap { Int($0) } ?? -1)", "output": "12\n-1", "explanation": "値があるときだけ変換が実行され、nil はそのまま nil として流れていきます。"}}, "seriesId": "swift-optional-handling", "seriesStep": 2}, {"id": "practice-swift-059", "track": "swift", "lessonId": "swift-optional-chaining", "type": "repair", "difficulty": 3, "title": "多段のOptionalを安全に辿る形に直す", "prompt": "入れ子になった Optional を辿る4行目がビルドできません。修正として最も適切なものを選んでください。", "skills": ["optional", "debugging"], "content": {"code": "struct Profile { var nickname: String? }\nstruct User { var profile: Profile? }\nlet user: User? = User(profile: Profile(nickname: \"yu\"))\nlet length = user.profile.nickname.count\nprint(length ?? 0)", "options": [{"id": "o1", "code": "let length = user?.profile?.nickname?.count"}, {"id": "o2", "code": "let length = user!.profile!.nickname!.count"}, {"id": "o3", "code": "let length = user?.profile.nickname.count"}, {"id": "o4", "code": "let length = user.profile?.nickname?.count"}]}, "solution": {"optionId": "o1", "fixedCode": "struct Profile { var nickname: String? }\nstruct User { var profile: Profile? }\nlet user: User? = User(profile: Profile(nickname: \"yu\"))\nlet length = user?.profile?.nickname?.count\nprint(length ?? 0)"}, "hints": ["user、profile、nickname のうち、Optional なのはどれでしょうか。", "Optional のプロパティにアクセスするたびに、その場で「nil なら打ち切る」印が必要です。", "3つとも Optional なので、ドットの前すべてに印が要ります。強制アンラップは nil のときに落ちるため、安全な修正ではありません。"], "explanation": "バグは4行目です。user は User?、profile は Profile?、nickname は String? と3段すべてが Optional なので、ドットの前に毎回 `?` が必要です。1つでも欠けると 'Value of optional type must be unwrapped' でビルドできません。修正は `user?.profile?.nickname?.count` で、どこかが nil になった時点で以降の評価を打ち切り、全体として Int? を返します。挙動としては、この例では \"yu\" の文字数2が得られます。`!` を3つ並べる書き方はビルドこそ通りますが、どこかが nil の瞬間にクラッシュし、さらに結果が非Optionalの Int になるため次の行の `?? 0` が無意味になります。", "detail": {"concept": "Optional chaining は「途中で nil に当たったら、そこで打ち切って全体を nil にする」仕組みです。何段辿っても結果は1段の Optional に平坦化されます。", "steps": ["`user?` … user が nil ならここで nil を返して終了。", "`.profile?` … profile が nil ならここで終了。", "`.nickname?` … nickname が nil ならここで終了。", "すべて値があれば `.count` が評価され、Int? として2が返る。"], "whyCorrect": "各段に `?` を置くことで、その段が nil の可能性を型として正しく扱えます。結果が Int?? のように多重にならず Int? になるのは、chaining が平坦化を行うためです。", "commonMistakes": ["`!` で全部通す書き方は、テストデータがそろっているときだけ動きます。1つでも欠けた実データでクラッシュします。", "途中の `?` を書き忘れる間違いです。Optional かどうかは宣言を見て1段ずつ確認します。"], "takeaway": "Optional を辿るたびに `?`。結果は多重にならず1段の Optional になる。", "example": {"code": "struct Profile { var nickname: String? }\nstruct User { var profile: Profile? }\nlet a: User? = User(profile: Profile(nickname: \"yu\"))\nlet b: User? = User(profile: nil)\nprint(a?.profile?.nickname?.count ?? -1, b?.profile?.nickname?.count ?? -1)", "output": "2 -1", "explanation": "途中の profile が nil の場合、以降は評価されずに全体が nil になります。"}}, "seriesId": "swift-optional-handling", "seriesStep": 3}, {"id": "practice-swift-060", "track": "swift", "lessonId": "swift-optional-chaining", "type": "trace", "difficulty": 3, "title": "途中がnilのときの結果を追う", "prompt": "次のコードを実行したとき、表示される内容を選んでください。", "skills": ["optional", "debugging"], "content": {"code": "struct Profile { var nickname: String? }\nstruct User { var profile: Profile? }\nlet a = User(profile: Profile(nickname: \"yu\"))\nlet b = User(profile: nil)\nprint(a.profile?.nickname?.count ?? -1)\nprint(b.profile?.nickname?.count ?? -1)", "options": [{"id": "o1", "label": "2 のあとに -1"}, {"id": "o2", "label": "-1 のあとに -1"}, {"id": "o3", "label": "2 のあとに 0"}, {"id": "o4", "label": "0 のあとに -1"}]}, "solution": {"optionId": "o1"}, "hints": ["a と b の違いは profile が nil かどうかだけです。", "chaining は途中で nil に当たると、その先を評価せずに全体を nil にします。", "a は \"yu\" まで辿れるので文字数、b は profile が nil なので既定値が使われます。"], "explanation": "a では profile も nickname も値を持つため `count` まで評価され、\"yu\" の文字数2が得られます。b は profile が nil なので、そこで chaining が打ち切られ nickname や count は評価されません。結果は nil となり、`?? -1` によって -1 が表示されます。したがって出力は2と-1です。途中が nil でもクラッシュしないことが chaining の要点です。", "detail": {"concept": "Optional chaining の評価は短絡的です。nil に当たった時点で以降の呼び出しは行われないため、副作用のあるメソッドも呼ばれません。", "steps": ["a: profile は Optional(Profile) → nickname は Optional(\"yu\") → count が評価され2。", "`?? -1` は nil でないので、そのまま2が使われる。", "b: profile が nil → その先は評価されず、式全体が nil。", "`?? -1` によって -1 が表示される。"], "whyCorrect": "評価が途中で打ち切られるという規則だけで、両方の結果が決まります。b でクラッシュしないのは `!` を使っていないためです。", "commonMistakes": ["nil のときに 0 が返ると考える間違いです。count の既定値ではなく、式全体が nil になり ?? の右側が使われます。", "chaining が途中の nil で必ずクラッシュすると考える間違いです。クラッシュするのは強制アンラップの場合だけです。"], "takeaway": "chaining は短絡評価。nil に当たったらその先は実行されない。", "example": {"code": "struct Profile { var nickname: String? }\nstruct User { var profile: Profile? }\nlet b = User(profile: nil)\nprint(b.profile?.nickname?.count as Any)", "output": "nil", "explanation": "?? を付けずに見ると、式全体の結果が nil であることが直接確認できます。"}}, "seriesId": "swift-optional-handling", "seriesStep": 4}, {"id": "practice-swift-061", "track": "swift", "lessonId": "swift-struct-enum", "type": "matching", "difficulty": 2, "title": "型定義で使う記法を対応づける", "prompt": "struct や enum の定義に出てくる記法と、その意味を対応させてください。", "skills": ["types", "syntax"], "content": {"left": [{"id": "l1", "label": "mutating func"}, {"id": "l2", "label": "case loading(progress: Double)"}, {"id": "l3", "label": "enum Suit: String"}, {"id": "l4", "label": "var area: Double { width * height }"}], "right": [{"id": "r1", "label": "値型のメソッドが自分のプロパティを書き換えることを宣言する"}, {"id": "r2", "label": "列挙ケースに付随するデータを持たせる（関連値）"}, {"id": "r3", "label": "各ケースに対応する固定の値を持たせる（rawValue）"}, {"id": "r4", "label": "値を保存せず、参照されるたびに計算して返す"}, {"id": "r5", "label": "初期化時に一度だけ計算して保存し、以降は再計算しない"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["値型は既定で自分を書き換えられません。書き換えるメソッドには印が要ります。", "ケースの後ろのかっこは、そのケースが持つ追加データを表します。型名を書くのは rawValue の指定です。", "中かっこの中に式だけが書かれたプロパティは、保存領域を持ちません。r5 は lazy の説明です。"], "explanation": "mutating は値型のメソッドが自身のプロパティを変更することを宣言します。`case loading(progress: Double)` は関連値付きのケースで、ケースごとに異なるデータを持てます。`enum Suit: String` は rawValue の型指定で、各ケースに固定の文字列を対応させます。`var area: Double { ... }` は計算プロパティで、値を保存せずアクセスのたびに評価されます。r5 は lazy var の説明であり、この中には対応するものがありません。", "detail": {"concept": "Swift の型定義は、値の持ち方（保存か計算か）、変更の可否（mutating）、ケースが持つデータ（関連値か rawValue か）という軸で構成されています。記法の違いはそのまま設計の違いです。", "steps": ["mutating … 値型のメソッドで self を書き換えるときに必要。class では不要。", "関連値 … ケースごとに異なるデータを持てる。switch で取り出す。", "rawValue … 全ケースに同じ型の固定値を対応させる。文字列やIDとの相互変換に使う。", "計算プロパティ … 保存領域を持たず、参照のたびに式が評価される。"], "whyCorrect": "4つの記法はそれぞれ別の目的のために存在し、意味が重なりません。関連値と rawValue はどちらも「ケースに値を持たせる」ように見えますが、ケースごとに異なるか全ケース共通の型かという点で明確に違います。", "commonMistakes": ["関連値と rawValue を同時に使うことはできません。`case a(Int) = 1` のような書き方はコンパイルエラーです。", "計算プロパティに毎回重い処理を書くと、参照のたびにコストがかかります。1度だけでよいなら lazy var を検討します。"], "takeaway": "保存か計算か、共通の値か個別のデータか。記法の違いは設計判断の違い。", "example": {"code": "enum Suit: String { case spade = \"♠\", heart = \"♥\" }\nstruct Rect { var w: Double; var h: Double\n    var area: Double { w * h } }\nprint(Suit.heart.rawValue, Rect(w: 2, h: 3).area)", "output": "♥ 6.0", "explanation": "rawValue は固定値の取り出し、計算プロパティは参照時の評価であることが確認できます。"}}, "seriesId": "swift-type-design", "seriesStep": 1}, {"id": "practice-swift-062", "track": "swift", "lessonId": "swift-struct-enum", "type": "buildFunction", "difficulty": 3, "title": "値を書き換えるstructを組み立てる", "prompt": "外部からは読み取り専用で、increment でだけ増える構造体を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["types", "functions"], "content": {"blocks": [{"id": "b1", "code": "struct Counter {"}, {"id": "b2", "code": "    private(set) var value = 0"}, {"id": "b3", "code": "    mutating func increment(by amount: Int = 1) {"}, {"id": "b4", "code": "        value += amount"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    func increment(by amount: Int = 1) {"}, {"id": "b8", "code": "        self = Counter()"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["値型のメソッドが自分のプロパティを変更するには、宣言に印が必要です。", "「外からは読めるが書けない」を表すアクセス指定があります。", "struct の宣言 → private(set) のプロパティ → mutating なメソッド → 加算 → メソッドを閉じる → struct を閉じる、の6行です。"], "explanation": "値型のメソッドで自分のプロパティを書き換えるには `mutating` が必要です。付けずに `value += amount` と書くと 'Cannot assign to property: self is immutable' になります。`private(set)` は「読み取りは公開、書き込みは型の内部だけ」を意味し、外部から直接 value を書き換えられないようにします。これにより値の変更経路が increment に限定され、不正な状態を作りにくくなります。`self = Counter()` は値をまるごと置き換える書き方で、増分の実装としては要件を満たしません。", "detail": {"concept": "値型は既定で不変として扱われ、self を書き換えるメソッドだけが mutating を名乗ります。この明示のおかげで、let で持ったインスタンスがどのメソッドで壊れるかがコンパイル時に分かります。", "steps": ["`private(set) var value = 0` … 読み取りは公開、書き込みは内部限定。", "`mutating func increment(by amount: Int = 1)` … self を書き換える宣言。既定値1で呼び出しを省略できる。", "`value += amount` … mutating の中なので合法。", "呼び出し側では `var counter = Counter()` のように var で保持する必要がある。"], "whyCorrect": "mutating が書き換えを許可し、private(set) が書き換えの入口を1か所に絞ります。2つを組み合わせることで「読める・勝手に書けない・決まった操作でだけ変わる」という設計になります。", "commonMistakes": ["mutating を付け忘れて 'self is immutable' で悩む間違いです。class では不要なので、値型に切り替えたときに出やすいエラーです。", "let で保持したインスタンスに対して mutating メソッドを呼ぶと 'Cannot use mutating member on immutable value' になります。呼び出し側の宣言も var にする必要があります。"], "takeaway": "値型を書き換えるメソッドは mutating。書き込み口を絞るなら private(set)。", "example": {"code": "struct Counter {\n    private(set) var value = 0\n    mutating func increment(by amount: Int = 1) { value += amount }\n}\nvar c = Counter()\nc.increment()\nc.increment(by: 5)\nprint(c.value)", "output": "6", "explanation": "既定値ありの呼び出しと明示的な呼び出しが積み上がり、6になります。"}}, "seriesId": "swift-type-design", "seriesStep": 2}, {"id": "practice-swift-063", "track": "swift", "lessonId": "swift-enum", "type": "fillBlank", "difficulty": 2, "title": "rawValueから列挙型を復元する", "prompt": "文字列から Direction を復元して表示します。空欄を埋めてください。", "skills": ["types", "optional"], "content": {"template": "enum Direction: {{1}} {\n    case north = \"北\"\n    case south = \"南\"\n}\nlet d = Direction(rawValue: \"北\")\nprint(d?.{{2}} ?? \"不明\")", "blanks": [{"id": "1", "options": ["String", "Int", "CaseIterable", "Character"]}, {"id": "2", "options": ["rawValue", "value", "name", "description"]}]}, "solution": {"answers": {"1": "String", "2": "rawValue"}}, "hints": ["各ケースに割り当てているのは \"北\" のような文字列です。その型を継承リストに書きます。", "`Direction(rawValue:)` は失敗するかもしれないので Optional を返します。だから `?.` を使っています。", "固定値を取り出すプロパティの名前は、初期化子のラベルと同じ単語です。"], "explanation": "`enum Direction: String` と書くと各ケースに文字列の rawValue を持たせられます。`Direction(rawValue:)` は対応するケースがなければ nil を返す失敗可能イニシャライザなので、結果は Direction? です。`d?.rawValue` で元の文字列を取り出し、nil の場合は `?? \"不明\"` で既定値を使います。ここでは \"北\" が該当するので「北」が出力されます。CaseIterable は全ケースを列挙するためのプロトコルで、rawValue の型指定ではありません。", "detail": {"concept": "rawValue は列挙型と外部表現（保存された文字列やAPIのコード）との変換窓口です。外から来る値は不正かもしれないため、復元は必ず失敗しうる操作として設計されています。", "steps": ["`: String` により、各ケースが String の rawValue を持つ。", "`Direction(rawValue: \"北\")` は一致するケースを探す。あれば Optional(.north)。", "なければ nil。したがって戻り値の型は Direction?。", "`d?.rawValue ?? \"不明\"` で、取り出せれば文字列、だめなら「不明」になる。"], "whyCorrect": "宣言した rawValue の型と、渡している値の型（String）が一致しているため復元が成立します。失敗の可能性を Optional として扱っているのでクラッシュもしません。", "commonMistakes": ["`Direction(rawValue:)!` と強制アンラップすると、想定外の文字列が来た瞬間にクラッシュします。外部入力では特に危険です。", "rawValue と関連値を混同する間違いです。rawValue は全ケース共通の型の固定値、関連値はケースごとの可変データです。"], "takeaway": "rawValue からの復元は失敗しうる。戻り値は必ず Optional。", "example": {"code": "enum Direction: String { case north = \"北\", south = \"南\" }\nprint(Direction(rawValue: \"北\")?.rawValue ?? \"不明\")\nprint(Direction(rawValue: \"東\")?.rawValue ?? \"不明\")", "output": "北\n不明", "explanation": "定義にない文字列を渡すと nil になり、既定値が使われます。"}}, "seriesId": "swift-enum-basics", "seriesStep": 1}, {"id": "practice-swift-064", "track": "swift", "lessonId": "swift-enum", "type": "chooseBlocks", "difficulty": 3, "title": "全ケースを列挙するのに必要な行だけ選ぶ", "prompt": "Suit のすべてのケースの記号を順に表示します。必要な行だけを選び、正しい順に並べてください。", "skills": ["types", "collections"], "content": {"blocks": [{"id": "b1", "code": "enum Suit: String, CaseIterable {"}, {"id": "b2", "code": "    case spade = \"♠\", heart = \"♥\""}, {"id": "b3", "code": "}"}, {"id": "b4", "code": "for s in Suit.allCases { print(s.rawValue) }"}, {"id": "b5", "code": "enum Suit: String {"}, {"id": "b6", "code": "for s in Suit.all { print(s.rawValue) }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["「全ケースを配列として得る」機能は、あるプロトコルに準拠したときだけ自動で生成されます。", "そのプロトコルに準拠していない宣言では、全ケースを取得するプロパティ自体が存在しません。", "準拠を書いた宣言と、自動生成されるプロパティ名（allCases）を使う行を選びます。"], "explanation": "`CaseIterable` に準拠すると、コンパイラが `allCases` という全ケースの配列を自動生成します。準拠を書かない `enum Suit: String {` のままでは allCases が存在せず 'Type Suit has no member allCases' になります。また、自動生成されるのは `all` ではなく `allCases` です。allCases の並び順は宣言した順序と同じなので、♠ → ♥ の順に出力されます。", "detail": {"concept": "CaseIterable はコンパイラによるコード生成を伴うプロトコルです。手で配列を書くとケース追加時に更新漏れが起きますが、allCases なら常に最新の全ケースが得られます。", "steps": ["`enum Suit: String, CaseIterable` … rawValue の型と CaseIterable 準拠の両方を書く。", "コンパイラが `static var allCases: [Suit]` を生成する。", "`for s in Suit.allCases` で宣言順に全ケースを走査する。", "`s.rawValue` で ♠ と ♥ が順に出力される。"], "whyCorrect": "準拠の宣言があることで allCases が存在し、宣言順の走査によって出力順も決まります。手書きの配列と違い、ケースを増やしても自動的に追随します。", "commonMistakes": ["全ケースの配列を自分で定義してしまい、ケース追加時に更新を忘れる間違いです。CaseIterable なら起きません。", "関連値を持つケースがあると CaseIterable に自動準拠できません。値の組み合わせが無限になり得るためです。"], "takeaway": "全ケース走査は CaseIterable + allCases。順序は宣言順。", "example": {"code": "enum Suit: String, CaseIterable { case spade = \"♠\", heart = \"♥\" }\nprint(Suit.allCases.count)\nprint(Suit.allCases.map(\\.rawValue).joined(separator: \",\"))", "output": "2\n♠,♥", "explanation": "allCases は普通の配列なので、map や joined といったコレクション操作をそのまま使えます。"}}, "seriesId": "swift-enum-basics", "seriesStep": 2}, {"id": "practice-swift-065", "track": "swift", "lessonId": "swift-class-reference", "type": "bugHunt", "difficulty": 3, "title": "コピーしたつもりが共有になっている行を見つける", "prompt": "base の設定は \"light\" のままのはずですが、\"dark\" と表示されます。原因になっている行を選んでください。", "skills": ["types", "debugging", "memory"], "content": {"lines": [{"id": "l1", "code": "final class Settings { var theme = \"light\" }"}, {"id": "l2", "code": "let base = Settings()"}, {"id": "l3", "code": "let copy = base"}, {"id": "l4", "code": "copy.theme = \"dark\""}, {"id": "l5", "code": "print(base.theme)"}]}, "solution": {"optionId": "l3", "fixedCode": "final class Settings { var theme = \"light\" }\nlet base = Settings()\nlet copy = Settings()\ncopy.theme = \"dark\"\nprint(base.theme)"}, "hints": ["Settings は class です。代入したとき、実体はいくつになるでしょうか。", "参照型の代入は中身を複製せず、同じ実体を指す名前を増やすだけです。", "copy という名前に反して、実体が複製されていない行があります。"], "explanation": "バグは3行目です。Settings は class（参照型）なので `let copy = base` は実体を複製せず、base と同じインスタンスを指す名前を作るだけです。そのため4行目の書き換えが base からも見え、5行目で \"dark\" が表示されます。クラッシュもコンパイルエラーも起きず、「なぜか他の場所の値が変わる」という形でだけ現れるため発見が難しいバグです。修正は、独立した実体が必要なら `Settings()` で新しいインスタンスを作ること、あるいは Settings を struct に変えて値型にすることです。名前が copy でも、参照型では複製は起きません。", "detail": {"concept": "参照型の代入は「同じ実体への参照を増やす」操作です。複製が必要なら明示的に作るか、値型を選ぶ必要があります。名前や let は複製の根拠になりません。", "steps": ["`Settings()` で実体が1つ作られ、base がそれを指す。", "`let copy = base` で copy も同じ実体を指す。実体は増えない。", "`copy.theme = \"dark\"` は唯一の実体を書き換える。", "base から読んでも \"dark\" になる。"], "whyCorrect": "問題は書き換えている4行目ではなく、複製したつもりで共有してしまった3行目です。4行目は copy を意図どおり書き換えているだけです。", "commonMistakes": ["`let` で宣言したから安全だと考える間違いです。参照型の let は指し先の付け替えを禁止するだけで、中身の変更は防ぎません。", "設定やモデルのように「持ち回って別々に編集する」データを class にすると、この種の共有バグが起きやすくなります。値型を既定にするのが安全です。"], "takeaway": "参照型の代入は複製ではない。独立が必要なら新しいインスタンスか値型を選ぶ。", "example": {"code": "struct Settings { var theme = \"light\" }\nlet base = Settings()\nvar copy = base\ncopy.theme = \"dark\"\nprint(base.theme, copy.theme)", "output": "light dark", "explanation": "struct に変えるだけで、代入時に複製が起きて base が保護されます。"}}, "seriesId": "swift-reference-semantics", "seriesStep": 1}, {"id": "practice-swift-066", "track": "swift", "lessonId": "swift-class-reference", "type": "trace", "difficulty": 3, "title": "関数に渡した値が書き換わるか追う", "prompt": "class と struct を同じように関数へ渡しました。最後の print の結果を選んでください。", "skills": ["types", "functions", "debugging"], "content": {"code": "final class Box { var n = 0 }\nstruct Bag { var n = 0 }\nfunc bump(_ b: Box) { b.n += 1 }\nfunc bump(_ b: Bag) { var b = b; b.n += 1 }\nlet box = Box()\nlet bag = Bag()\nbump(box)\nbump(bag)\nprint(box.n, bag.n)", "options": [{"id": "o1", "label": "1 0"}, {"id": "o2", "label": "1 1"}, {"id": "o3", "label": "0 0"}, {"id": "o4", "label": "0 1"}]}, "solution": {"optionId": "o1"}, "hints": ["関数に渡されるとき、参照型と値型では渡されるものが違います。", "struct 側の関数は受け取った値をローカルの var にコピーしてから書き換えています。", "Box は同じ実体が渡るので書き換えが外に見えます。Bag はコピーが書き換わるだけです。"], "explanation": "Box は class なので、関数には同じ実体への参照が渡ります。`b.n += 1` は呼び出し元と同じインスタンスを書き換えるため、box.n は1になります。Bag は struct なので引数はコピーであり、さらに関数内で `var b = b` としてもう一度ローカルにコピーしています。書き換わるのはそのローカルコピーだけなので、呼び出し元の bag.n は0のままです。したがって出力は「1 0」です。", "detail": {"concept": "引数の受け渡しでも値型と参照型の違いが現れます。値型を関数の中から書き換えて呼び出し元に反映したい場合は、inout を使うか戻り値で返す必要があります。", "steps": ["`bump(box)` … Box は参照型なので実体が共有される。b.n += 1 が box に反映される。", "`bump(bag)` … Bag は値型なので引数はコピー。", "`var b = b` はさらにローカルの複製を作る（引数は既定で変更不可のため）。", "ローカルの複製を書き換えても、呼び出し元の bag には影響しない。出力は「1 0」。"], "whyCorrect": "参照型は実体の共有、値型はコピーという規則だけで結果が決まります。let で宣言した box の中身が変わるのは、参照型の let が指し先の固定しか意味しないためです。", "commonMistakes": ["どちらも関数に渡したのだから同じ結果になると考える間違いです。渡されるものが違います。", "値型を関数内で書き換えて反映されないことに気づかず、「更新されないバグ」として長く悩む例です。inout か戻り値が必要です。"], "takeaway": "関数に渡すと、class は実体の共有、struct はコピー。反映したいなら inout か戻り値。", "example": {"code": "struct Bag { var n = 0 }\nfunc bump(_ b: inout Bag) { b.n += 1 }\nvar bag = Bag()\nbump(&bag)\nprint(bag.n)", "output": "1", "explanation": "inout を使うと、値型でも呼び出し元に書き戻されます。"}}, "seriesId": "swift-reference-semantics", "seriesStep": 2}, {"id": "practice-swift-067", "track": "swift", "lessonId": "swift-properties", "type": "repair", "difficulty": 3, "title": "他のプロパティを使う定義を直す", "prompt": "この構造体は 'Cannot use instance member within property initializer' でビルドできません。4行目の修正として正しいものを選んでください。", "skills": ["types", "debugging"], "content": {"code": "struct Rect {\n    var width: Double\n    var height: Double\n    var area: Double = width * height\n}", "options": [{"id": "o1", "code": "    var area: Double { width * height }"}, {"id": "o2", "code": "    let area: Double = width * height"}, {"id": "o3", "code": "    static let area: Double = width * height"}, {"id": "o4", "code": "    var area: Double { width }"}]}, "solution": {"optionId": "o1", "fixedCode": "struct Rect {\n    var width: Double\n    var height: Double\n    var area: Double { width * height }\n}\nlet r = Rect(width: 2, height: 3)\nprint(r.area)"}, "hints": ["プロパティの初期値は、インスタンスがまだ存在しない時点で評価されます。", "他のプロパティに依存する値は「保存する」のではなく「参照されたときに計算する」形にできます。", "中かっこの中に式を書くと、保存領域を持たないプロパティになります。"], "explanation": "バグは4行目です。保存プロパティの初期値は、すべてのプロパティが確定する前に評価されるため、他のインスタンスプロパティ（width や height）を参照できません。挙動としてはコンパイル時に停止し、実行には至りません。修正は `var area: Double { width * height }` と計算プロパティにすることです。計算プロパティは値を保存せず、アクセスのたびに width と height から求めるため、初期化順の問題が起きず、辺を変更しても常に正しい面積になります。`let area: Double = width * height` は保存プロパティのままなので同じエラーが残り、static は型のプロパティなのでインスタンスの値を参照できません。`{ width }` はビルドできますが面積を返さず、要件を満たしません。", "detail": {"concept": "保存プロパティは「初期化時に値を決めて持ち続ける」もの、計算プロパティは「参照されるたびに求める」ものです。他のプロパティから導出できる値は、原則として計算プロパティにします。", "steps": ["保存プロパティの初期値式は self がまだ完成していない段階で評価される。", "そのため width や height を参照できず、コンパイルエラーになる。", "`{ width * height }` は getter なので、参照時には self が完成している。", "辺を変更したあとに area を読むと、新しい値で計算し直される。"], "whyCorrect": "計算プロパティは評価のタイミングが「使うとき」なので、初期化順の制約を受けません。さらに元の値と結果が食い違う状態（不整合）も原理的に発生しません。", "commonMistakes": ["保存プロパティのまま lazy を付けて回避しようとする間違いです。lazy は初回参照まで遅延しますが、値は保存されるため辺を変更しても更新されません。", "面積を保存プロパティにして、辺の変更時に手で更新する設計は、更新漏れによる不整合を生みます。"], "takeaway": "他のプロパティから導ける値は計算プロパティにする。保存すると不整合の余地が残る。", "example": {"code": "struct Rect {\n    var width: Double\n    var height: Double\n    var area: Double { width * height }\n}\nvar r = Rect(width: 2, height: 3)\nprint(r.area)\nr.width = 4\nprint(r.area)", "output": "6.0\n12.0", "explanation": "辺を変更したあとも area が自動的に追随します。保存プロパティではこうなりません。"}}, "seriesId": "swift-property-kinds", "seriesStep": 1}, {"id": "practice-swift-068", "track": "swift", "lessonId": "swift-properties", "type": "fillBlank", "difficulty": 3, "title": "プロパティオブザーバで値を補正する", "prompt": "hp が負になったら0に補正し、生存判定を計算プロパティで返します。空欄を埋めてください。", "skills": ["types", "syntax"], "content": {"template": "struct Player {\n    var hp = 100 {\n        {{1}} {\n            if hp < 0 { hp = 0 }\n        }\n    }\n    var isAlive: Bool { hp {{2}} 0 }\n}\nvar p = Player()\np.hp = -5\nprint(p.hp, p.isAlive)", "blanks": [{"id": "1", "options": ["didSet", "willSet", "get", "set"]}, {"id": "2", "options": [">", ">=", "<", "=="]}]}, "solution": {"answers": {"1": "didSet", "2": ">"}}, "hints": ["補正するには、新しい値がすでに入ったあとで自分自身を書き換える必要があります。", "代入前に呼ばれる観察子では、その中で自分に代入しても直後に上書きされてしまいます。", "1つめは「セットされた後」に呼ばれる観察子、2つめは0を生存に含めない比較演算子です。"], "explanation": "`didSet` は値が代入された直後に呼ばれるため、その中で `hp = 0` と補正すると結果が確定します（didSet 内の代入では didSet は再帰的に呼ばれません）。`willSet` は代入前に呼ばれ、その中で自分に代入しても直後に新しい値で上書きされるため補正になりません。生存判定は「0より大きい」なので `hp > 0` です。`>=` にすると hp が0でも生存扱いになってしまいます。実行すると hp は0に補正され、「0 false」が出力されます。", "detail": {"concept": "プロパティオブザーバは、値の変化に対する副作用を型の内部に閉じ込める仕組みです。呼び出し側が補正を忘れる余地をなくせます。", "steps": ["`p.hp = -5` により、まず hp に -5 が入る。", "直後に didSet が呼ばれ、`hp < 0` が真なので hp = 0 に補正される。", "この内部代入では didSet は再帰しないため、無限ループにならない。", "`isAlive` は参照時に `hp > 0` を評価し、0 なので false になる。"], "whyCorrect": "didSet は代入後に呼ばれるため、補正した値がそのまま最終状態になります。比較演算子 > によって、境界値0が非生存として正しく扱われます。", "commonMistakes": ["willSet で補正しようとする間違いです。willSet の中の代入は、その後に入る新しい値で上書きされます。", "`>=` を使って境界を含めてしまう間違いです。hp = 0 が生存扱いになり、ゲームの仕様と矛盾します。", "didSet の中で重い処理や別プロパティの更新を連鎖させると、変更のたびに予期しない副作用が広がります。"], "takeaway": "補正は didSet。境界値は比較演算子1文字で仕様が変わる。", "example": {"code": "struct Player {\n    var hp = 100 { didSet { if hp < 0 { hp = 0 } } }\n    var isAlive: Bool { hp > 0 }\n}\nvar p = Player()\np.hp = -5\nprint(p.hp, p.isAlive)\np.hp = 10\nprint(p.hp, p.isAlive)", "output": "0 false\n10 true", "explanation": "負の値だけが補正され、正常な値はそのまま保持されることが確認できます。"}}, "seriesId": "swift-property-kinds", "seriesStep": 2}, {"id": "practice-swift-069", "track": "swift", "lessonId": "swift-methods-subscripts", "type": "reorder", "difficulty": 3, "title": "安全な添字を持つ型を並べ替える", "prompt": "範囲外の添字でも落ちない subscript を持つ型を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["types", "collections", "optional"], "content": {"blocks": [{"id": "b1", "code": "    subscript(index: Int) -> String? {"}, {"id": "b2", "code": "struct Deck {"}, {"id": "b3", "code": "        cards.indices.contains(index) ? cards[index] : nil"}, {"id": "b4", "code": "    }"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "    var cards: [String]"}, {"id": "b7", "code": "let deck = Deck(cards: [\"A\", \"K\"])"}, {"id": "b8", "code": "print(deck[5] ?? \"なし\")"}]}, "solution": {"order": ["b2", "b6", "b1", "b3", "b4", "b5", "b7", "b8"]}, "hints": ["型の宣言を開いてから、プロパティ、subscript の順に中身を書きます。", "subscript の中では、その型のプロパティ（cards）を使えます。", "型を閉じてからインスタンスを作り、最後に添字アクセスして表示します。"], "explanation": "struct を開き、subscript が参照する cards プロパティを宣言し、そのあとに subscript を定義します。subscript の本体は単一の式なので暗黙のreturnが働き、`indices.contains` で範囲内かを確認したうえで要素または nil を返します。型を閉じてからインスタンスを作り、`deck[5]` は範囲外なので nil となり `?? \"なし\"` で「なし」が表示されます。標準の配列の添字と違ってクラッシュしないのが、この設計の狙いです。", "detail": {"concept": "subscript は「添字アクセスの意味を型が自分で決められる」機能です。戻り値を Optional にすることで、範囲外を異常終了ではなく「値がない」として扱えます。", "steps": ["`struct Deck {` … 型を開く。", "`var cards: [String]` … subscript が参照するデータ。", "`subscript(index: Int) -> String? {` … 戻り値が Optional であることが安全性の要。", "`cards.indices.contains(index) ? cards[index] : nil` … 範囲内なら要素、範囲外なら nil。", "型を閉じ、インスタンスを作り、`deck[5] ?? \"なし\"` で「なし」が出る。"], "whyCorrect": "検査してから添字アクセスしているため、`cards[index]` が評価されるのは必ず範囲内のときだけです。範囲外では nil が返り、呼び出し側が既定値を決められます。", "commonMistakes": ["subscript の戻り値を String にすると、範囲外のときに返す値がなくなり、結局クラッシュか無意味な既定値に頼ることになります。", "標準の Array の添字自体を安全にしようと extension で subscript を追加する例がありますが、標準の挙動と紛らわしくなるため、専用の型やメソッド名にするほうが安全です。"], "takeaway": "subscript の戻り値を Optional にすると、範囲外を落ちずに表現できる。", "example": {"code": "struct Deck {\n    var cards: [String]\n    subscript(index: Int) -> String? {\n        cards.indices.contains(index) ? cards[index] : nil\n    }\n}\nlet deck = Deck(cards: [\"A\", \"K\"])\nprint(deck[0] ?? \"なし\", deck[5] ?? \"なし\")", "output": "A なし", "explanation": "有効な添字と範囲外の添字を並べると、同じ記法でどちらも安全に扱えることが分かります。"}}, "seriesId": "swift-subscript", "seriesStep": 1}, {"id": "practice-swift-070", "track": "swift", "lessonId": "swift-methods-subscripts", "type": "shortCode", "difficulty": 3, "title": "自作subscriptを呼び出す1行を書く", "prompt": "deck の2枚目（添字1）を取り出し、なければ「なし」と表示する1行を書いてください。", "skills": ["types", "optional"], "content": {"context": "struct Deck {\n    var cards: [String]\n    subscript(index: Int) -> String? {\n        cards.indices.contains(index) ? cards[index] : nil\n    }\n}\nlet deck = Deck(cards: [\"A\", \"K\"])\n// ここに1行書く", "contextRun": "struct Deck {\n    var cards: [String]\n    subscript(index: Int) -> String? {\n        cards.indices.contains(index) ? cards[index] : nil\n    }\n}\nlet deck = Deck(cards: [\"A\", \"K\"])\n{{answer}}", "placeholder": "例: print(値 ?? \"なし\")"}, "solution": {"accepted": ["print(deck[1] ?? \"なし\")"]}, "hints": ["自作の subscript も、配列と同じ角かっこの記法で呼び出せます。", "2枚目の添字は1です。添字は0から始まります。", "戻り値は Optional なので、表示する前に既定値を与える演算子が必要です。"], "explanation": "`print(deck[1] ?? \"なし\")` と書きます。subscript は角かっこで呼び出すため、配列と同じ見た目で使えます。添字は0始まりなので2枚目は1です。この subscript の戻り値は String? なので、`?? \"なし\"` で既定値を与えてから print します。既定値を付けずに print すると Optional(\"K\") と表示され、意図した出力になりません。ここでは添字1が有効なので K が表示されます。", "detail": {"concept": "subscript を定義すると、その型のインスタンスに対して角かっこの記法が使えるようになります。呼び出し側から見ると、標準のコレクションと同じ操作感になります。", "steps": ["`deck[1]` が subscript(index:) を呼び出す。", "index = 1 は cards.indices（0..<2）に含まれるので cards[1] が返る。", "戻り値の型は String? なので Optional(\"K\")。", "`?? \"なし\"` により String になり、K が表示される。"], "whyCorrect": "添字が有効な範囲にあるため要素が返り、Optional を既定値で解いてから表示しているので、余計なラベルが付かない出力になります。", "commonMistakes": ["`print(deck[1])` とすると Optional(\"K\") と表示されます。Optional のまま print すると常にこの形式になります。", "`deck[1]!` は動きますが、範囲外を渡した瞬間にクラッシュします。Optional を返す設計の意味がなくなります。"], "takeaway": "自作 subscript も角かっこで呼ぶ。Optional は表示前に ?? で解く。", "example": {"code": "struct Deck {\n    var cards: [String]\n    subscript(index: Int) -> String? { cards.indices.contains(index) ? cards[index] : nil }\n}\nlet deck = Deck(cards: [\"A\", \"K\"])\nprint(deck[1] ?? \"なし\")\nprint(deck[1] as Any)", "output": "K\nOptional(\"K\")", "explanation": "?? を付けた場合と付けない場合の表示の違いが確認できます。"}}, "seriesId": "swift-subscript", "seriesStep": 2}, {"id": "practice-swift-071", "track": "swift", "lessonId": "swift-init-deinit", "type": "bugHunt", "difficulty": 3, "title": "structに書けない定義を見つける", "prompt": "このコードはビルドできません。原因になっている行を選んでください。", "skills": ["types", "memory", "debugging"], "content": {"lines": [{"id": "l1", "code": "struct Session {"}, {"id": "l2", "code": "    var id: Int"}, {"id": "l3", "code": "    deinit { print(\"end\") }"}, {"id": "l4", "code": "}"}]}, "solution": {"optionId": "l3", "fixedCode": "final class Session {\n    var id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"end\") }\n}\ndo { _ = Session(id: 1) }"}, "hints": ["deinit は「実体が破棄される瞬間」に呼ばれる処理です。", "値型はコピーされて広がるため、「唯一の実体が破棄される瞬間」を特定できません。", "deinit を書けるのは参照型だけです。値型に書くとコンパイルエラーになります。"], "explanation": "バグは3行目です。deinit はインスタンスが破棄される直前に呼ばれる処理で、参照カウントによって寿命が管理される class（および actor）にのみ定義できます。struct は値型でコピーによって増減するため「破棄の瞬間」が一意に定まらず、'Deinitializers may only be declared within a class, actor, or noncopyable type' というコンパイルエラーになります。ビルドが通らないだけで実行時の問題ではありません。修正は Session を class にすることです（その場合 id を初期化する init も必要になります）。後始末が値型で必要な場合は、deinit ではなく明示的な close() のようなメソッドを用意します。", "detail": {"concept": "deinit は ARC の寿命管理と一体の機能です。値型はコピーされるたびに実体が増えるため、そもそも「解放」という概念を持ちません。", "steps": ["struct は値型で、代入や引数渡しのたびにコピーされる。", "コピーが複数存在するため、破棄のタイミングが一意に決まらない。", "したがって deinit は言語仕様として値型に書けない。", "class にすれば参照カウントが0になった瞬間に deinit が呼ばれる。"], "whyCorrect": "エラーは deinit を宣言している行そのものに対して出ています。プロパティの宣言や struct の宣言自体には問題がありません。", "commonMistakes": ["リソースの後始末のために安易に class へ変える判断です。値型のままで close() を呼ぶ設計のほうが、共有バグを避けられる場合があります。", "deinit の中で self を別の場所へ渡そうとする間違いです。破棄中のインスタンスを延命させることはできません。"], "takeaway": "deinit は参照型だけの機能。値型の後始末は明示的なメソッドで行う。", "example": {"code": "final class Session {\n    let id: Int\n    init(id: Int) { self.id = id; print(\"start\", id) }\n    deinit { print(\"end\", id) }\n}\ndo { _ = Session(id: 1) }\nprint(\"after\")", "output": "start 1\nend 1\nafter", "explanation": "スコープを抜けて参照が消えた時点で deinit が呼ばれていることが確認できます。"}}, "seriesId": "swift-init-rules", "seriesStep": 1}, {"id": "practice-swift-072", "track": "swift", "lessonId": "swift-init-deinit", "type": "buildFunction", "difficulty": 3, "title": "不正な値を弾く初期化子を組み立てる", "prompt": "0〜150 の範囲外を渡されたら生成に失敗する Age 型を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["types", "optional", "errors"], "content": {"blocks": [{"id": "b1", "code": "struct Age {"}, {"id": "b2", "code": "    let value: Int"}, {"id": "b3", "code": "    init?(_ value: Int) {"}, {"id": "b4", "code": "        guard (0...150).contains(value) else { return nil }"}, {"id": "b5", "code": "        self.value = value"}, {"id": "b6", "code": "    }"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "    init(_ value: Int) {"}, {"id": "b9", "code": "        self.value = max(0, value)"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7"]}, "hints": ["「生成に失敗する」ことを表す初期化子の書き方があります。宣言に記号が1つ付きます。", "失敗したときは値を作らずに nil を返します。範囲チェックは guard で先に済ませます。", "型の宣言 → プロパティ → 失敗可能な init → 範囲チェック → 代入 → init を閉じる → 型を閉じる、の7行です。"], "explanation": "`init?` は失敗可能イニシャライザで、条件を満たさないときに `return nil` を書けます。呼び出し側は Age? を受け取るため、不正な値からはインスタンスが作れないことが型で保証されます。`init` に `max(0, value)` のような補正を入れる設計は、200歳を150に丸めるなど不正な入力を黙って受け入れてしまい、呼び出し側が誤りに気づけません。Age(200) は nil、Age(20) は Optional(Age(value: 20)) になります。", "detail": {"concept": "型の不変条件（この型の値が常に満たすべき条件）は、初期化子で守ります。ここを通れば以降のコードは範囲チェックを繰り返さなくて済みます。", "steps": ["`init?(_ value: Int)` … 失敗しうることを型として宣言する。", "`guard (0...150).contains(value) else { return nil }` … 不変条件を検査する。", "通過した場合だけ `self.value = value` で確定させる。", "呼び出し側は Age? を受け取り、nil のときの扱いを決める必要がある。"], "whyCorrect": "検査を初期化子に集約したことで、Age のインスタンスが存在する時点で値が0〜150であることが保証されます。以降の処理から検査コードを取り除けます。", "commonMistakes": ["補正して受け入れる設計は、入力ミスを隠してしまいます。どこで値が変わったのか追跡できなくなります。", "失敗の理由を呼び出し側に伝えたい場合、init? では nil しか返せません。理由が必要なら throws のイニシャライザを使います。"], "takeaway": "不正な値は作らせない。init? か throws で入口に検査を集める。", "example": {"code": "struct Age {\n    let value: Int\n    init?(_ value: Int) {\n        guard (0...150).contains(value) else { return nil }\n        self.value = value\n    }\n}\nprint(Age(20)?.value ?? -1, Age(200)?.value ?? -1)", "output": "20 -1", "explanation": "範囲内の値だけがインスタンスになり、範囲外は nil として弾かれます。"}}, "seriesId": "swift-init-rules", "seriesStep": 2}, {"id": "practice-swift-073", "track": "swift", "lessonId": "swift-extensions", "type": "repair", "difficulty": 3, "title": "extensionに書けないプロパティを直す", "prompt": "この extension は 'Extensions must not contain stored properties' でビルドできません。2行目の修正として正しいものを選んでください。", "skills": ["types", "debugging"], "content": {"code": "extension String {\n    var isEvenLength: Bool = count % 2 == 0\n}", "options": [{"id": "o1", "code": "    var isEvenLength: Bool { count % 2 == 0 }"}, {"id": "o2", "code": "    let isEvenLength: Bool = count % 2 == 0"}, {"id": "o3", "code": "    lazy var isEvenLength: Bool = count % 2 == 0"}, {"id": "o4", "code": "    var isEvenLength: Int { count % 2 }"}]}, "solution": {"optionId": "o1", "fixedCode": "extension String {\n    var isEvenLength: Bool { count % 2 == 0 }\n}\nprint(\"abcd\".isEvenLength, \"abc\".isEvenLength)"}, "hints": ["extension は既存の型にメモリ領域を追加できません。追加できるのは「計算して返すもの」だけです。", "中かっこの中に式を書く形にすると、保存領域を持たないプロパティになります。", "let や lazy var も保存領域を必要とするため、同じ制限に引っかかります。戻り値の型も要件どおり Bool にします。"], "explanation": "バグは2行目です。extension は既存の型のメモリレイアウトを変更できないため、保存プロパティ（値を持つプロパティ）を追加できず、'Extensions must not contain stored properties' でコンパイルが止まります。実行時ではなくビルド時のエラーです。修正は `var isEvenLength: Bool { count % 2 == 0 }` と計算プロパティにすることです。計算プロパティは保存領域を必要とせず、アクセスのたびに count から求めます。let も lazy var も保存領域を要求するため同じエラーになり、`Int` を返す版は要件（偶数かどうかの真偽）を満たしません。", "detail": {"concept": "extension は「既存の型に振る舞いを足す」機能であり、「データを足す」機能ではありません。データを足すとメモリレイアウトが変わり、すでにコンパイル済みのコードと矛盾するためです。", "steps": ["`var x: T = 式` は保存プロパティの宣言。", "extension では保存プロパティを宣言できないため、その場でエラーになる。", "`var x: T { 式 }` は計算プロパティで、getter だけを持つ。", "計算プロパティなら既存のメモリレイアウトを変えないので extension に書ける。"], "whyCorrect": "計算プロパティは値を保持せず、参照されるたびに count から真偽を導きます。既存の String のメモリ表現に一切影響しないため、extension の制約を満たします。", "commonMistakes": ["「保存したいならメソッドにすればよい」と考えても、状態を持てないことは変わりません。状態が必要なら別の型でラップします。", "static な保存プロパティは extension に書ける場合がありますが、インスタンスごとの値は持てません。用途がまったく異なります。"], "takeaway": "extension に足せるのは振る舞いだけ。状態を足したいなら型そのものを設計し直す。", "example": {"code": "extension String {\n    var isEvenLength: Bool { count % 2 == 0 }\n}\nprint(\"abcd\".isEvenLength, \"abc\".isEvenLength)", "output": "true false", "explanation": "計算プロパティとして定義すると、標準型に対しても自分のプロパティのように使えます。"}}, "seriesId": "swift-extension-design", "seriesStep": 1}, {"id": "practice-swift-074", "track": "swift", "lessonId": "swift-extensions", "type": "buildFunction", "difficulty": 3, "title": "Intに機能を追加するextensionを組み立てる", "prompt": "偶数判定のプロパティと、回数分だけ処理を繰り返すメソッドを Int に追加します。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["types", "functions"], "content": {"blocks": [{"id": "b1", "code": "extension Int {"}, {"id": "b2", "code": "    var isEven: Bool { self % 2 == 0 }"}, {"id": "b3", "code": "    func times(_ body: () -> Void) {"}, {"id": "b4", "code": "        for _ in 0..<Swift.max(0, self) { body() }"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    var isEven: Bool = self % 2 == 0"}, {"id": "b8", "code": "        for _ in 0...self { body() }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["extension に書けるのは計算プロパティだけです。保存の形は使えません。", "3.times { } は3回実行されるべきです。終端を含む範囲を使うと1回多くなります。", "負の数を渡されたときに範囲が壊れないよう、下限を0で抑える必要があります。"], "explanation": "`var isEven: Bool { self % 2 == 0 }` は計算プロパティなので extension に書けます（`= 式` の形は保存プロパティとなり書けません）。`times` は `0..<Swift.max(0, self)` を使うことで、self 回ちょうど繰り返し、かつ負の数を渡されても `0..<0` となって0回で安全に終わります。`0...self` は終端を含むため self + 1 回まわり、さらに self が負のときは 'Range requires lowerBound <= upperBound' で実行時クラッシュします。", "detail": {"concept": "extension で標準型を拡張すると、呼び出し側のコードが読みやすくなります。ただし追加できるのは振る舞いだけで、境界条件は自分で守る必要があります。", "steps": ["`extension Int {` … Int 型そのものを拡張する。self は Int の値。", "`var isEven: Bool { self % 2 == 0 }` … 保存領域を持たない計算プロパティ。", "`func times(_ body: () -> Void)` … クロージャを受け取り、回数分呼ぶ。", "`0..<Swift.max(0, self)` … self 回ちょうど。負の数でも空の範囲になり安全。"], "whyCorrect": "半開区間 `..<` が回数と要素数を一致させ、max(0, self) が負の入力を無害化します。2つの対策により、どんな Int を受け取っても仕様どおりに動きます。", "commonMistakes": ["`0...self` を使って1回多く実行してしまう間違いです。回数指定では半開区間が定石です。", "負の値を考慮せずに範囲を作ると、実行時に範囲の不正でクラッシュします。拡張は誰でも呼べるぶん、入力の想定を広く取る必要があります。", "`extension Int` の中で `max(0, self)` と書くと、Int 型のスコープが優先されて静的プロパティ `Int.max` として解決され、'static member max cannot be used on instance' になります。グローバル関数を呼ぶには `Swift.max(0, self)` と明示します。"], "takeaway": "回数の繰り返しは `0..<n`。標準型の拡張ほど境界条件を厳しく守る。", "example": {"code": "extension Int {\n    var isEven: Bool { self % 2 == 0 }\n    func times(_ body: () -> Void) { for _ in 0..<Swift.max(0, self) { body() } }\n}\nprint(4.isEven, 3.isEven)\n3.times { print(\"hi\") }\n(-1).times { print(\"never\") }", "output": "true false\nhi\nhi\nhi", "explanation": "3回だけ実行され、負の数では一度も実行されずにクラッシュもしないことが確認できます。"}}, "seriesId": "swift-extension-design", "seriesStep": 2}, {"id": "practice-swift-075", "track": "swift", "lessonId": "swift-protocols", "type": "matching", "difficulty": 3, "title": "プロトコル関連の記法を対応づける", "prompt": "プロトコルにまつわる記法と、その意味を対応させてください。", "skills": ["protocols", "types"], "content": {"left": [{"id": "l1", "label": "protocol Named { var name: String { get } }"}, {"id": "l2", "label": "extension Named { func greet() { } }"}, {"id": "l3", "label": ": Equatable"}, {"id": "l4", "label": "some Named"}], "right": [{"id": "r1", "label": "準拠する型が満たすべき要求（読み取り可能な name）を定義する"}, {"id": "r2", "label": "準拠するすべての型が共通で使える既定の実装を与える"}, {"id": "r3", "label": "== による比較ができることを要求する標準プロトコル"}, {"id": "r4", "label": "具体的な型は隠しつつ、常に同じ1つの型であることを保証する"}, {"id": "r5", "label": "実行時に異なる具体型が入り得ることを表す（存在型）"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["プロトコル本体に書けるのは「要求」だけで、実装は書けません。", "extension にプロトコルの実装を書くと、準拠した型すべてがそれを引き継ぎます。", "some と any は対になる概念です。r5 は any の説明なので、some とは対応しません。"], "explanation": "プロトコル本体は「準拠する型が満たすべき要求」の宣言です。プロトコルの extension に実装を書くと、準拠したすべての型が既定の実装として使えます。`: Equatable` は == による比較を要求する標準プロトコルへの準拠です。`some Named` は不透明型で、呼び出し側からは具体的な型が見えないものの、常に同じ1つの型であることが保証されます。r5 は `any Named`（存在型）の説明で、こちらは異なる具体型が入り得ます。", "detail": {"concept": "プロトコルは「要求の宣言」と「既定の実装」に役割が分かれています。さらに、それを型として使うときに some（不透明型）と any（存在型）のどちらを選ぶかで、性能と柔軟性が変わります。", "steps": ["protocol 本体 … 何を満たすべきかだけを書く。実装は書けない。", "protocol の extension … 共通の実装を1か所にまとめられる。準拠側は上書きも可能。", "some T … 具体型は隠れるが1つに固定されるため、実行時の間接参照が不要。", "any T … 異なる具体型を同じ配列に入れられるが、実行時のディスパッチが必要になる。"], "whyCorrect": "4つの記法はそれぞれ要求・既定実装・標準プロトコル・不透明型という別々の役割を持ち、説明と1対1で対応します。some と any の説明が2つ用意されている点だけが引っかけです。", "commonMistakes": ["some と any を「同じものの別表記」と考える間違いです。配列に異なる型を混ぜたいなら any が必要で、some では書けません。", "プロトコルの extension に書いた実装は、静的ディスパッチになる場合があります。準拠側で上書きしても呼ばれないことがあるため、要求として宣言しておくのが安全です。"], "takeaway": "protocol は要求、extension は既定実装。some は1つの型に固定、any は混在可。", "example": {"code": "protocol Named { var name: String { get } }\nextension Named { func greet() -> String { \"Hello, \\(name)\" } }\nstruct User: Named { let name: String }\nprint(User(name: \"Yuki\").greet())", "output": "Hello, Yuki", "explanation": "User は greet を実装していませんが、プロトコルの extension から既定の実装を受け取っています。"}}, "seriesId": "swift-protocol-design", "seriesStep": 1}, {"id": "practice-swift-076", "track": "swift", "lessonId": "swift-protocols", "type": "chooseBlocks", "difficulty": 4, "title": "既定の実装を持つプロトコルに必要な行だけ選ぶ", "prompt": "準拠する型が name を持つだけで greet() が使えるようにします。必要な行だけを選び、正しい順に並べてください。", "skills": ["protocols", "types"], "content": {"blocks": [{"id": "b1", "code": "protocol Greeter {"}, {"id": "b2", "code": "    var name: String { get }"}, {"id": "b3", "code": "}"}, {"id": "b4", "code": "extension Greeter {"}, {"id": "b5", "code": "    func greet() -> String { \"Hello, \\(name)\" }"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "struct User: Greeter { let name: String }"}, {"id": "b8", "code": "print(User(name: \"Yuki\").greet())"}, {"id": "b9", "code": "    func greet() -> String"}, {"id": "b10", "code": "struct User { let name: String }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"], "order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["「準拠するだけで使える」ようにしたいので、greet の実装はプロトコル側に置きます。", "プロトコル本体に `func greet() -> String` と要求だけを書くと、準拠する型ごとに実装が必要になり、要件と逆になります。", "準拠を宣言していない struct では、そもそも既定の実装を受け取れません。"], "explanation": "プロトコル本体には要求（name）だけを書き、共通の振る舞いは extension に既定の実装として書きます。こうすると User は name を持つだけで greet() が使えます。b9 のように本体に `func greet() -> String` と要求を書いてしまうと、準拠するすべての型が greet を実装しなければならなくなり、既定の実装を用意する意味が薄れます。b10 は `: Greeter` の準拠宣言がないため、extension の既定実装を受け取れず 'Value of type User has no member greet' になります。出力は「Hello, Yuki」です。", "detail": {"concept": "プロトコル指向の設計では「最小限の要求」と「そこから導ける共通実装」を分けます。要求が小さいほど準拠しやすく、共通実装が多いほど各型のコードが減ります。", "steps": ["`protocol Greeter { var name: String { get } }` … 要求は name の読み取りだけ。", "`extension Greeter { func greet() ... }` … name があれば書ける処理をここに置く。", "`struct User: Greeter { let name: String }` … 要求だけ満たせば準拠が完了する。", "`User(...).greet()` … extension の既定実装が呼ばれる。"], "whyCorrect": "greet は name だけから導けるため、各型に書かせる必要がありません。要求と既定実装を分けたことで、準拠側の実装負担が name だけに抑えられています。", "commonMistakes": ["要求と既定実装の両方に greet を書くと、準拠側が実装したときに動的ディスパッチになり、書かなかったときは静的ディスパッチになります。挙動の違いが混乱の元です。", "準拠宣言（`: Greeter`）を書き忘れる間違いです。extension の実装は準拠している型にしか届きません。"], "takeaway": "要求は最小限に、導ける処理は protocol extension へ。", "example": {"code": "protocol Gr
