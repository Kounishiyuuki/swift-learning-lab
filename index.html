済みます。", "otherChoices": [{"choice": "必ずrawValue", "reason": "rawValue は「case に対応する固定の生の値」を与える別の機能です。全 case が同じ型の値を 1 つ持つ形で、case ごとに型を変えることはできません。associated value とは用途が異なります。"}, {"choice": "継承可能", "reason": "enum は継承できません。継承は class の機能です。"}, {"choice": "参照型", "reason": "enum は値型です。参照型になるのは class です。"}], "example": {"code": "enum LoadState {\n    case success(Int)\n    case failure(String)\n}\nlet state = LoadState.success(3)\nswitch state {\ncase .success(let count):\n    print(\"loaded \\(count)\")\ncase .failure(let message):\n    print(\"error \\(message)\")\n}", "output": "loaded 3", "explanation": "switch のパターンで `let count` と書くと、その case に付随する値を取り出せます。success のときだけ件数を扱える構造になります。"}, "takeaway": "associated value は case ごとの付随データ。rawValue とは別物。"}}, {"id": "q-swift-050", "difficulty": "Intermediate", "prompt": "状態管理にenumが向く理由は？", "code": "enum State{case idle,loading,loaded,failed}", "choices": ["同時に複数case", "取り得る状態を限定", "必ずDB保存", "UI自動生成"], "answer": 1, "explanation": "不正な組み合わせを作りにくい。", "detail": {"concept": "画面の状態を Bool の組み合わせ（isLoading、hasError など）で表すと、「読み込み中かつエラー」のような、実際には起こり得ない組み合わせも表現できてしまいます。enum は候補を 1 つに絞るため、そうした矛盾した状態を作れなくなります。", "whyCorrect": "enum の値は常にどれか 1 つの case です。ありえない組み合わせが型の時点で排除されるため、分岐の抜けや矛盾を減らせます。", "otherChoices": [{"choice": "同時に複数case", "reason": "むしろ逆で、同時に複数の case にはなれません。1 つに定まることが利点です。"}, {"choice": "必ずDB保存", "reason": "enum は保存とは無関係です。保存するかどうかは別の設計判断です。"}, {"choice": "UI自動生成", "reason": "enum を定義しただけで画面が作られることはありません。UI は別途組み立てます。"}], "takeaway": "enum は「ありえない状態」を作れなくする。"}}]}, {"id": "swift-class-reference", "level": "Intermediate", "title": "class・参照型・継承", "summary": "同じインスタンスを複数箇所から共有する参照セマンティクスを理解する。", "mental": "struct の代入は『値を渡す』、class の代入は『同じ対象を指す参照を渡す』と考える。", "points": ["class は参照型。", "継承、deinit、同一性比較 `===` は class 固有。", "ARC が参照カウントを管理する。", "強参照循環を避けるため weak / unowned を使う場合がある。"], "code": "final class Counter {\n    var value = 0\n}\nlet a = Counter()\nlet b = a\nb.value = 5\nprint(a.value)", "why": "UIKit の UIViewController などは class。Delegate やクロージャで参照循環を作らないためにも必要。", "pitfall": "class を代入しても複製されない。同じインスタンスへの参照が増える。", "questions": [{"id": "q-swift-019", "difficulty": "Intermediate", "prompt": "出力は？", "code": "final class Box { var value = 1 }\nlet a = Box()\nlet b = a\nb.value = 9\nprint(a.value)", "choices": ["1", "9", "nil", "コンパイルエラー"], "answer": 1, "explanation": "class は参照型。a と b は同じ Box インスタンスを参照しているため、変更が共有される。", "detail": {"concept": "class は参照型です。代入しても中身はコピーされず、同じ実体を指す参照が増えるだけです。そのため一方を通じた変更が、もう一方からも見えます。`final` は「これ以上継承させない」という指定です。", "steps": ["`let a = Box()` で Box の実体が 1 つ作られる。", "`let b = a` は実体をコピーせず、同じ実体への参照を b にも持たせる。", "b.value = 9 は共有している実体を書き換える。", "print(a.value) は同じ実体を見るため 9 を表示する。"], "whyCorrect": "a と b は同じ Box を指しているからです。なお a は let ですが、これは「a が別の実体を指し直せない」という意味であり、指している実体のプロパティ（var value）は変更できます。", "otherChoices": [{"choice": "1", "reason": "struct（値型）であればコピーされるため、こちらが正解になります。class と struct の最大の違いです。"}, {"choice": "nil", "reason": "value は Int で Optional ではないため nil にはなりません。"}, {"choice": "コンパイルエラー", "reason": "let で宣言した class の参照でも、参照先のプロパティ変更は許されます。エラーにはなりません。"}], "takeaway": "class は代入しても同じ実体を共有する。"}}, {"id": "q-swift-020", "difficulty": "Intermediate", "prompt": "weak がよく使われる理由は？", "code": "weak var delegate: SomeDelegate?", "choices": ["値型に変換するため", "強参照循環を避けるため", "速度を必ず上げるため", "Optional を禁止するため"], "answer": 1, "explanation": "weak 参照は参照カウントを増やさないため、delegate などの双方向参照で強参照循環を避けやすい。", "detail": {"concept": "Swift は参照カウント（ARC）でメモリを管理し、参照が 0 になった時点で解放します。2 つのオブジェクトが互いを強く参照し合うと、カウントが 0 にならず両方とも解放されません。これが強参照循環です。weak は参照カウントを増やさないため、この輪を断ち切れます。", "whyCorrect": "delegate は「呼び出し元が呼び出し先を持ち、呼び出し先も呼び出し元を delegate として持つ」という双方向の関係になりがちです。片方を weak にすることで循環を防ぎます。", "otherChoices": [{"choice": "値型に変換するため", "reason": "weak にしても class は class のままで、値型にはなりません。"}, {"choice": "速度を必ず上げるため", "reason": "weak はメモリ管理のための指定であり、速度改善を目的とした機能ではありません。"}, {"choice": "Optional を禁止するため", "reason": "むしろ逆です。weak な参照は対象が解放されると自動的に nil になるため、必ず Optional として宣言します。"}], "takeaway": "weak は参照カウントを増やさず、対象が消えると nil になる。"}}]}, {"id": "swift-properties", "level": "Intermediate", "title": "Stored / Computed / lazy / Property Observer", "summary": "型の状態を表すPropertyの種類と、計算・監視の仕組みを理解する。", "mental": "保存する値と、他の値から計算できる値を分ける。", "points": ["stored propertyは値を保存。", "computed propertyはgetter/setterで計算。", "lazyは初回accessまで初期化を遅延。", "willSet/didSetで変更を観測。"], "code": "struct Rect{\n var width:Double\n var height:Double\n var area:Double { width * height }\n}", "why": "状態重複を避け、modelを一貫した状態に保つ。", "pitfall": "計算で導ける値を二重保存すると同期漏れが起きやすい。", "questions": [{"id": "q-swift-051", "difficulty": "Intermediate", "prompt": "area の種類は？", "code": "var area:Double { width * height }", "choices": ["stored", "computed", "lazy stored", "global"], "answer": 1, "explanation": "access時に計算するcomputed property。", "detail": {"concept": "プロパティには、値を実際に保持する stored property と、アクセスされるたびに計算して値を返す computed property があります。`var area: Double { width * height }` のように本体が { } で書かれているものは computed property で、値そのものは保存されません。", "whyCorrect": "area は width と height から毎回計算されます。元になる値が変われば area も自動的に新しい結果になるため、値の食い違いが起きません。", "otherChoices": [{"choice": "stored", "reason": "stored property は `var width: Double` のように値を保持する形で書きます。area は保持していません。"}, {"choice": "lazy stored", "reason": "lazy stored property は `lazy var` と書き、初回アクセス時に一度だけ計算して保存します。area は毎回計算し直す点が異なります。"}, {"choice": "global", "reason": "型の中で宣言されているためグローバルではありません。"}], "takeaway": "{ } で値を返すプロパティは、毎回計算される computed property。"}}, {"id": "q-swift-052", "difficulty": "Intermediate", "prompt": "lazy の特徴は？", "code": "lazy var cache=makeCache()", "choices": ["即作成", "最初のaccessまで初期化を遅らせる", "letだけ", "Optional専用"], "answer": 1, "explanation": "初回access時まで初期化を延期。", "detail": {"concept": "lazy var は「最初にアクセスされるまで初期化を行わない」プロパティです。生成コストの高い値を、実際に使うときまで作らずに済ませられます。一度作られた後はその値が保持されます。", "whyCorrect": "初期化が初回アクセスまで遅延されるため、使われなければ makeCache() は一度も呼ばれません。起動時の負荷を減らす目的でよく使われます。", "otherChoices": [{"choice": "即作成", "reason": "即座に作られるのは通常の stored property です。lazy はそれを避けるための指定です。"}, {"choice": "letだけ", "reason": "lazy は var にしか付けられません。初回アクセス時に値を書き込む必要があるためです。"}, {"choice": "Optional専用", "reason": "Optional 専用の機能ではありません。どの型のプロパティにも使えます。"}], "takeaway": "lazy は初回アクセスまで初期化を先送りする（var 限定）。"}}]}, {"id": "swift-methods-subscripts", "level": "Intermediate", "title": "Method・mutating・Subscript", "summary": "型に紐づく処理と、[]による独自accessを理解する。", "mental": "Methodは『その型にできること』、Subscriptは『[]でaccessする窓口』。", "points": ["instance/type methodがある。", "struct/enumで自身を変更するmethodにはmutating。", "static/classでtype method。", "subscriptで独自[] access。"], "code": "struct Counter{\n var value=0\n mutating func increment(){value+=1}\n}", "why": "標準libraryやframework APIを読むとき、変更性と所有者を理解できる。", "pitfall": "値型のmethodからstored propertyを変える場合はmutatingが必要。", "questions": [{"id": "q-swift-053", "difficulty": "Intermediate", "prompt": "structでselfを変更するmethodに必要なのは？", "code": "struct C{var n=0; /* ? */ func up(){n+=1}}", "choices": ["weak", "mutating", "override", "async"], "answer": 1, "explanation": "値型の自身を変更するmethodはmutating。", "detail": {"concept": "struct は値型で、その中のメソッドは既定では自分自身のプロパティを変更できません。自身を書き換えるメソッドには `mutating` を付けて、「このメソッドは値を変更する」ことを明示します。呼び出せるのは var で保持している場合だけです。", "whyCorrect": "`n += 1` は自身のプロパティの変更にあたるため、mutating が必要です。付けないとコンパイルエラーになります。class は参照型なのでこの指定は不要です。", "otherChoices": [{"choice": "weak", "reason": "weak は参照カウントを増やさない参照の指定で、class の参照に対して使います。メソッドには付けられません。"}, {"choice": "override", "reason": "override は継承したメソッドを上書きする指定で、class で使います。struct は継承できません。"}, {"choice": "async", "reason": "async は非同期メソッドの指定で、値の変更可否とは無関係です。"}], "example": {"code": "struct Counter {\n    var n = 0\n    mutating func up() { n += 1 }\n}\nvar counter = Counter()\ncounter.up()\ncounter.up()\nprint(counter.n)", "output": "2", "explanation": "mutating を付けることで自身を書き換えられます。counter が let だと up() を呼べず、コンパイル時にエラーになります。"}, "takeaway": "struct で自身を変えるメソッドには mutating。"}}, {"id": "q-swift-054", "difficulty": "Intermediate", "prompt": "subscriptの目的は？", "code": "value[index]", "choices": ["[]形式の独自access API", "継承禁止", "非同期化", "ARC停止"], "answer": 0, "explanation": "[]で値へaccessするAPIを定義できる。", "detail": {"concept": "subscript は `value[index]` という角括弧の記法を自分の型にも定義できる仕組みです。Array や Dictionary の `[...]` も subscript として実装されています。引数の型や個数は自由に決められます。", "whyCorrect": "メソッド名を書かずに角括弧でアクセスできるため、コレクションのように「位置やキーで要素を取り出す」型を自然に表現できます。", "otherChoices": [{"choice": "継承禁止", "reason": "継承の可否は final や class の設計で決まります。subscript とは無関係です。"}, {"choice": "非同期化", "reason": "非同期処理は async / await で表します。subscript はアクセスの記法を提供するだけです。"}, {"choice": "ARC停止", "reason": "ARC はメモリ管理の仕組みで、subscript から制御するものではありません。"}], "takeaway": "subscript は `[ ]` でアクセスできる API を自作する仕組み。"}}]}, {"id": "swift-init-deinit", "level": "Intermediate", "title": "Initialization・Failable init・deinit", "summary": "instanceが有効な状態で生成され、必要な後処理が行われる仕組みを理解する。", "mental": "initは有効なinstanceを完成させる責任を持つ。", "points": ["stored propertyは初期化完了までに値を持つ。", "init?は失敗してnilを返せる。", "classではdesignated/convenience initializerがある。", "deinitはclass破棄時のcleanup。"], "code": "struct Age{\n let value:Int\n init?(_ value:Int){guard value>=0 else{return nil}; self.value=value}\n}", "why": "不正状態を生成時点で防ぐ設計に使える。", "pitfall": "class継承時の初期化規則は厳密。", "questions": [{"id": "q-swift-055", "difficulty": "Intermediate", "prompt": "Age(-1) の結果は？", "code": "struct Age{let v:Int;init?(_ v:Int){guard v>=0 else{return nil};self.v=v}}\nlet age=Age(-1)", "choices": ["Age", "Age?のnil", "Int -1", "エラー"], "answer": 1, "explanation": "failable initializerがnilを返す。", "detail": {"concept": "`init?` は failable initializer（失敗しうる初期化）です。条件を満たさない場合に `return nil` を返せます。その結果、`Age(-1)` の型は Age ではなく Age? になります。", "steps": ["Age(-1) が呼ばれ、init? の中に入る。", "guard v >= 0 の条件が -1 で満たされない。", "else の return nil が実行され、初期化が失敗する。", "age には Age? の nil が入る。"], "whyCorrect": "不正な値を弾いて「作れなかった」ことを nil で表せます。呼び出し側は if let などで確認してから使います。", "otherChoices": [{"choice": "Age", "reason": "初期化に成功した場合の型です。init? を使うと戻り値は必ず Optional になります。"}, {"choice": "Int -1", "reason": "Age は struct であって Int ではありません。渡した引数そのものが返ることもありません。"}, {"choice": "エラー", "reason": "init? による nil の返却は正しい仕組みで、コンパイルエラーにも実行時停止にもなりません。"}], "takeaway": "init? の結果は Optional。作れなければ nil。"}}, {"id": "q-swift-056", "difficulty": "Intermediate", "prompt": "deinitを持てる代表型は？", "code": "deinit { }", "choices": ["class", "structだけ", "enumだけ", "Tuple"], "answer": 0, "explanation": "deinitはclass instance破棄時。", "detail": {"concept": "deinit はインスタンスが破棄される直前に呼ばれる後始末の処理です。参照カウントが 0 になった時点で解放される class にのみ存在します。値型はコピーされて使われ、明確な「破棄の瞬間」を持たないため deinit を定義できません。", "whyCorrect": "解放のタイミングが定まるのは参照型である class だけだからです。通知の解除やファイルのクローズなどに使います。", "otherChoices": [{"choice": "structだけ", "reason": "struct は値型で、コピーごとに独立するため deinit を持てません。"}, {"choice": "enumだけ", "reason": "enum も値型なので同様に deinit を定義できません。"}, {"choice": "Tuple", "reason": "Tuple は複数の値の組で、deinit のような機能は持ちません。"}], "takeaway": "deinit は class 専用。"}}]}, {"id": "swift-extensions", "level": "Intermediate", "title": "Extension", "summary": "既存型へ機能やProtocol準拠を追加する。", "mental": "元の型定義を巨大化させず、責務や準拠ごとに分けられる。", "points": ["computed property/method/initializerなどを追加。", "Protocol準拠を分離。", "stored propertyは追加不可。", "標準型にも機能追加できる。"], "code": "extension String{\n var isBlank:Bool{trimmingCharacters(in:.whitespacesAndNewlines).isEmpty}\n}", "why": "UIKit delegate準拠の分離やmodel機能整理で非常によく使う。", "pitfall": "便利Extensionを無制限に増やすとAPIが乱立する。", "questions": [{"id": "q-swift-057", "difficulty": "Intermediate", "prompt": "Extensionで追加できないものは？", "code": "extension User { /* ? */ }", "choices": ["method", "computed property", "Protocol準拠", "新しいstored property"], "answer": 3, "explanation": "stored propertyは追加できない。", "detail": {"concept": "extension は既存の型に後から機能を足す仕組みです。メソッド、computed property、イニシャライザ、protocol への準拠などを追加できます。ただし新しい stored property は追加できません。型のメモリ上の大きさが後から変わってしまうためです。", "whyCorrect": "値を保持する領域を後付けで増やすことはできません。値を持たせたい場合は元の型定義に加えるか、別の型でラップします。computed property なら計算して返すだけなので追加できます。", "otherChoices": [{"choice": "method", "reason": "メソッドは追加できます。既存の型に便利な操作を足す代表的な使い方です。"}, {"choice": "computed property", "reason": "computed property は値を保持しないため追加できます。"}, {"choice": "Protocol準拠", "reason": "protocol への準拠を extension で書くのは一般的な書き方です。"}], "example": {"code": "struct User { let name: String }\nextension User {\n    var greeting: String { \"Hello, \\(name)\" }\n    func shout() -> String { greeting.uppercased() }\n}\nprint(User(name: \"Yuki\").shout())", "output": "HELLO, YUKI", "explanation": "computed property とメソッドは後から足せます。一方 `var age: Int` のような stored property を書くとコンパイルエラーになります。"}, "takeaway": "extension で stored property は足せない。計算とメソッドは足せる。"}}, {"id": "q-swift-058", "difficulty": "Intermediate", "prompt": "準拠をExtensionに分ける利点は？", "code": "extension Screen:UITableViewDelegate { }", "choices": ["責務ごとに整理", "必ず高速", "継承不要確定", "Optional化"], "answer": 0, "explanation": "関連実装をまとまりとして分けられる。", "detail": {"concept": "1 つの型が複数の役割を持つとき、protocol への準拠ごとに extension を分けると、どのメソッドがどの役割のものかが一目で分かります。ファイル内の並びが責務ごとにまとまり、変更時に読む範囲を絞れます。", "whyCorrect": "分割の目的はコードの整理です。準拠に必要なメソッド群が 1 か所に集まるため、後から読む人が役割の境界を追いやすくなります。", "otherChoices": [{"choice": "必ず高速", "reason": "extension に分けても実行時の速度は基本的に変わりません。目的は可読性です。"}, {"choice": "継承不要確定", "reason": "継承の要否は別の設計判断であり、extension の分割とは関係ありません。"}, {"choice": "Optional化", "reason": "Optional 化とは無関係です。"}], "takeaway": "準拠ごとに extension を分けると責務が見える。"}}]}, {"id": "swift-protocols", "level": "Intermediate", "title": "Protocol・Protocol Extension", "summary": "具体型ではなく『満たすべき能力・契約』でコードを組み立てる。", "mental": "Protocolは『何者か』より『何ができるか』を表す契約。", "points": ["property/method要件を定義。", "struct/class/enumが準拠できる。", "Protocol Extensionで共通実装。", "複数Protocolを合成できる。"], "code": "protocol IdentifiableItem{var id:String{get}}\nstruct Item:IdentifiableItem{let id:String}", "why": "DI、Repository、test doubleなど実アプリ設計の基礎。", "pitfall": "何でもProtocol化すると複雑になる。変更境界がある場所で使う。", "questions": [{"id": "q-swift-059", "difficulty": "Intermediate", "prompt": "Protocol準拠できる型は？", "code": "protocol Named{var name:String{get}}", "choices": ["classだけ", "structだけ", "struct/class/enumなど", "Tupleだけ"], "answer": 2, "explanation": "複数種類の型が準拠できる。", "detail": {"concept": "protocol は「この型はこれができる」という要求の一覧です。継承と違い、特定の親型を持つ必要がないため、struct・class・enum のいずれでも準拠できます。1 つの型が複数の protocol に準拠することもできます。", "whyCorrect": "Named は「name という読み取り可能なプロパティを持つこと」だけを要求しています。この条件さえ満たせば型の種類は問いません。値型でも参照型でも共通の扱いができるのが protocol の強みです。", "otherChoices": [{"choice": "classだけ", "reason": "class 限定にしたい場合は `protocol Named: AnyObject` と明示する必要があります。既定では限定されません。"}, {"choice": "structだけ", "reason": "struct 限定という指定は存在しません。"}, {"choice": "Tupleだけ", "reason": "Tuple は protocol に準拠できません。準拠できるのは名前付きの型（struct / class / enum など）です。"}], "takeaway": "protocol は struct / class / enum のどれでも準拠できる。"}}, {"id": "q-swift-060", "difficulty": "Intermediate", "prompt": "Protocolの主目的は？", "code": "protocol Loading{func load()}", "choices": ["必要な能力/要件を定義", "instanceを保存", "JSON化", "UI描画"], "answer": 0, "explanation": "準拠型が満たす契約を表す。", "detail": {"concept": "protocol は実装そのものではなく「満たすべき要件（契約）」を表します。`protocol Loading { func load() }` は「load() を持つこと」だけを定め、どう実装するかは各型に任せます。呼び出す側は具体的な型を知らなくても load() を呼べます。", "whyCorrect": "契約として抽象化することで、本物の通信を行う型とテスト用の型を差し替えられます。依存性注入やテスト容易性の土台になる考え方です。", "otherChoices": [{"choice": "instanceを保存", "reason": "値を保持するのは型のプロパティの役割です。protocol は要件を定めるだけで、自身が値を保存するわけではありません。"}, {"choice": "JSON化", "reason": "JSON 変換は Codable という別の protocol が担当します。protocol 一般の目的ではありません。"}, {"choice": "UI描画", "reason": "画面描画は SwiftUI や UIKit の役割です。"}], "takeaway": "protocol は「何ができるか」の契約。実装は各型に任せる。"}}]}, {"id": "swift-generics", "level": "Intermediate", "title": "Generics・Constraint・where", "summary": "具体型を固定せず、型安全な再利用コードを書く。", "mental": "『何型でも』ではなく『必要条件を満たす型なら』使える設計。", "points": ["型Parameter Tを使う。", "Protocol constraintで必要能力を要求。", "where句で型関係を表現。", "Array/Dictionaryもgeneric型。"], "code": "func maximum<T:Comparable>(_ a:T,_ b:T)->T{a>b ? a:b}", "why": "標準library、SwiftUI、Repository抽象化の型を読むために必須。", "pitfall": "generic化しすぎるとsignatureが難しくなる。", "questions": [{"id": "q-swift-061", "difficulty": "Intermediate", "prompt": "T: Comparable の意味は？", "code": "func maxValue<T:Comparable>(_ a:T,_ b:T)->T", "choices": ["TはInt", "TはComparable準拠", "Tはclass", "TはOptional"], "answer": 1, "explanation": "比較可能な型というconstraint。", "detail": {"concept": "`<T: Comparable>` の T は型を後から当てはめるための placeholder（型引数）です。`: Comparable` の部分は制約で、「T に入れられるのは Comparable に準拠した型だけ」という条件を表します。Comparable は `<` や `>` で大小比較できる能力を意味します。", "whyCorrect": "制約があるおかげで、関数の中で `a > b` のような比較を安全に書けます。制約が無ければ、比較できない型が渡される可能性があるためコンパイルできません。", "otherChoices": [{"choice": "TはInt", "reason": "T は Int に固定されません。Int も String も Double も、Comparable に準拠していれば渡せます。"}, {"choice": "Tはclass", "reason": "class への限定は `T: AnyObject` と書きます。Comparable は class かどうかとは無関係です。"}, {"choice": "TはOptional", "reason": "Optional への限定ではありません。Optional 自体は条件付きでしか Comparable になりません。"}], "example": {"code": "func maxValue<T: Comparable>(_ a: T, _ b: T) -> T { a > b ? a : b }\nprint(maxValue(3, 8))\nprint(maxValue(\"apple\", \"banana\"))", "output": "8\nbanana", "explanation": "同じ関数が Int でも String でも使えます。Comparable に準拠していることが保証されているため、中で大小比較ができます。"}, "takeaway": "T は型の placeholder、`: Protocol` はその型に課す条件。"}}, {"id": "q-swift-062", "difficulty": "Intermediate", "prompt": "Array<Int> の Int は？", "code": "Array<Int>", "choices": ["generic型引数", "Protocol名", "関数名", "access level"], "answer": 0, "explanation": "Arrayへ要素型Intを指定している。", "detail": {"concept": "Array は「何の要素を入れるか」を後から決められる generic な型です。`Array<Int>` の Int はその型引数で、「この配列の要素は Int」という指定になります。普段書く `[Int]` は `Array<Int>` の短縮記法です。", "whyCorrect": "型引数を与えることで、要素の型が決まった具体的な配列型になります。これにより取り出した要素も Int として安全に扱えます。", "otherChoices": [{"choice": "Protocol名", "reason": "Int は protocol ではなく具体的な型（struct）です。"}, {"choice": "関数名", "reason": "関数ではありません。`Int(\"3\")` のように書けば初期化の呼び出しになりますが、ここでは型として使われています。"}, {"choice": "access level", "reason": "アクセス制御は private や internal などのキーワードで指定します。型引数とは別の概念です。"}], "takeaway": "`Array<Int>` の Int は要素の型を決める型引数。`[Int]` と同じ。"}}]}, {"id": "swift-any-some", "level": "Intermediate", "title": "associatedtype・any・some", "summary": "Protocolを値として扱うexistentialと、具体型を隠すopaque typeを区別する。", "mental": "`any P`はP準拠値を入れる箱、`some P`は具体型を1つに固定し外から隠す。", "points": ["associatedtypeで関連型を抽象化。", "any Protocolはexistential。", "some Protocolはopaque result type。", "some Viewは代表例。"], "code": "protocol Store{associatedtype Item;func load()->Item}\nfunc makeView()->some View{Text(\"Hello\")}", "why": "SwiftUIやmodern Swift APIで頻出。", "pitfall": "anyとsomeは型情報の扱いが異なる。", "questions": [{"id": "q-swift-063", "difficulty": "Intermediate", "prompt": "some View の説明は？", "code": "func makeView()->some View{Text(\"A\")}", "choices": ["毎回異なる型可", "具体型を隠しつつ1つの具体型", "Anyと同じ", "Optional"], "answer": 1, "explanation": "opaque typeは実装側で具体型が固定。", "detail": {"concept": "`some View` は opaque type（不透明型）です。「View に準拠した何か 1 つの具体的な型を返すが、その型名は呼び出し側に公開しない」という意味になります。実装側では具体型が 1 つに固定されている点が重要です。", "whyCorrect": "呼び出し側は「View である」ことだけを知り、内部の複雑な型名を意識しなくて済みます。一方コンパイラは具体型を把握しているため、最適化や型チェックが効きます。", "otherChoices": [{"choice": "毎回異なる型可", "reason": "呼び出しごとに違う型を返すことはできません。すべての return が同じ具体型である必要があります。異なる型を返したい場合は `any View` を使います。"}, {"choice": "Anyと同じ", "reason": "Any は何でも入る型で、型情報がほぼ失われます。some は具体型が 1 つに定まっている点で大きく異なります。"}, {"choice": "Optional", "reason": "値の有無を表す Optional とは無関係です。"}], "takeaway": "some は「型名は隠すが、中身は 1 つの具体型」。"}}, {"id": "q-swift-064", "difficulty": "Intermediate", "prompt": "any P の意味は？", "code": "let value:any P", "choices": ["P準拠値を保持できるexistential", "Pを継承するclassだけ", "Macro", "static member"], "answer": 0, "explanation": "準拠する具体型を包んで扱う。", "detail": {"concept": "`any P` は existential type と呼ばれ、「P に準拠した何らかの型の値」を包んで保持できる型です。中身の具体型は実行時まで決まらなくてよいため、異なる型を同じ配列に混ぜて入れるといった使い方ができます。", "whyCorrect": "any は具体型を隠したまま protocol の要件だけを使えるようにします。柔軟な代わりに、包む処理の分だけ some より実行時のコストがかかる場合があります。", "otherChoices": [{"choice": "Pを継承するclassだけ", "reason": "P に準拠していれば struct でも enum でも保持できます。class への限定ではありません。"}, {"choice": "Macro", "reason": "Macro はコンパイル時にコードを生成する別の仕組みです。"}, {"choice": "static member", "reason": "型自身に属するメンバーを指す static とは無関係です。"}], "takeaway": "any は「P に準拠した何か」を包む。some は具体型 1 つに固定。"}}]}, {"id": "swift-type-casting", "level": "Intermediate", "title": "Type Casting・is / as? / as!・Any", "summary": "実行時の型を確認し、より具体的な型へ安全に変換する。", "mental": "静的型だけでは分からない値をruntimeで確認する操作。", "points": ["isで型判定。", "as?は失敗時nil。", "as!は失敗時crash。", "Anyは多様な値を保持するが型安全性が下がる。"], "code": "let value:Any=\"Swift\"\nif let text=value as? String{print(text.count)}", "why": "UIKitやObjective-C連携、汎用dataで遭遇する。", "pitfall": "as!を安易に使わない。", "questions": [{"id": "q-swift-065", "difficulty": "Intermediate", "prompt": "安全なdowncastは？", "code": "let value:Any=\"Swift\"", "choices": ["value as! Int", "value as? String", "value is String!", "value -> String"], "answer": 1, "explanation": "as?は失敗時nil。", "detail": {"concept": "downcast は「より抽象的な型で持っている値を、具体的な型として扱い直す」操作です。`as?` は失敗する可能性を考慮し、成功すれば値、失敗すれば nil を返します。`as!` は失敗した場合に実行時に停止します。", "whyCorrect": "value の中身は実行時にしか分からないため、失敗を nil で受け取れる `as?` が安全です。if let と組み合わせて使うのが定石です。", "otherChoices": [{"choice": "value as! Int", "reason": "中身は String なので Int への変換は失敗し、`as!` では実行時にプログラムが停止します。確実に成功すると分かっている場合以外は避けます。"}, {"choice": "value is String!", "reason": "`is` は型を判定して Bool を返す演算子で、後ろに `!` は付けません。この書き方はコンパイルエラーです。"}, {"choice": "value -> String", "reason": "`->` は関数型を書くための記号で、型変換には使いません。"}], "example": {"code": "let value: Any = \"Swift\"\nif let text = value as? String {\n    print(text.count)\n}\nprint((value as? Int) == nil)", "output": "5\ntrue", "explanation": "成功すれば中身が取り出され、失敗すれば nil になります。停止せずに分岐できるため、型が不確かな値を安全に扱えます。"}, "takeaway": "downcast は `as?` + if let が基本。`as!` は失敗時に停止する。"}}, {"id": "q-swift-066", "difficulty": "Intermediate", "prompt": "is の結果型は？", "code": "let r=value is String", "choices": ["String", "Bool", "String?", "Any"], "answer": 1, "explanation": "型判定結果はBool。", "detail": {"concept": "`is` は「この値はその型か？」を判定する演算子です。判定の結果なので、返るのは値そのものではなく true / false の Bool です。", "whyCorrect": "型を確認するだけで値は取り出しません。値も使いたい場合は `as?` と if let を使うほうが、判定と取り出しを 1 度で済ませられます。", "otherChoices": [{"choice": "String", "reason": "判定の対象になっている型であって、結果の型ではありません。"}, {"choice": "String?", "reason": "Optional を返すのは `as?` です。`is` は判定結果だけを返します。"}, {"choice": "Any", "reason": "Any は「何でも入る型」で、判定結果の型ではありません。"}], "takeaway": "`is` は Bool を返す。値が欲しいなら `as?`。"}}]}, {"id": "swift-access-control", "level": "Intermediate", "title": "Access Control・Module・File", "summary": "型やAPIをどこから見えるようにするか設計する。", "mental": "Access Controlは変更可能な境界を小さくし、安全にする。", "points": ["private/fileprivate/internal/public/open。", "internalが通常の既定。", "publicは他Moduleから利用可能。", "openは他Moduleからsubclass/overrideも許可。"], "code": "public struct APIClient{\n public init(){}\n private let token=\"...\"\n}", "why": "Package分割、SDK、test、アプリ内部境界に重要。", "pitfall": "全部publicにしない。最小限の公開を基本にする。", "questions": [{"id": "q-swift-067", "difficulty": "Intermediate", "prompt": "既定access levelは？", "code": "struct User{}", "choices": ["private", "fileprivate", "internal", "public"], "answer": 2, "explanation": "通常internal。", "detail": {"concept": "アクセスレベルは「どこからその型やメンバーを使えるか」を決めます。指定を省略した場合は internal になり、同じモジュール（アプリ本体やライブラリ 1 つ分）の中からは使えますが、外部のモジュールからは見えません。", "whyCorrect": "アプリを 1 つのモジュールとして作っている限り、既定の internal のままでもアプリ内では自由に使えます。外部に公開したいときだけ public を明示します。", "otherChoices": [{"choice": "private", "reason": "private は同じ宣言と同じファイル内の extension からのみ使える最も狭い範囲です。既定ではありません。"}, {"choice": "fileprivate", "reason": "fileprivate は同じファイル内に限定するレベルです。これも明示的に指定する必要があります。"}, {"choice": "public", "reason": "public は他モジュールからも使えるレベルで、ライブラリを公開するときに明示します。既定ではありません。"}], "takeaway": "書かなければ internal（同じモジュール内で利用可）。"}}, {"id": "q-swift-068", "difficulty": "Intermediate", "prompt": "openとpublicの違いの1つは？", "code": "open class Base{}", "choices": ["openは他Moduleからsubclass/override可能", "openはprivateより狭い", "publicはclass不可", "違いなし"], "answer": 0, "explanation": "openは継承/overrideまで許可。", "detail": {"concept": "public は「他のモジュールから使える」ことを表しますが、class の場合は継承やメソッドの override までは許しません。open はさらに一歩進んで、他モジュールからの継承と override も許可します。ライブラリ設計における拡張ポイントの宣言です。", "whyCorrect": "public と open の差は「外部モジュールが継承・override できるかどうか」です。ライブラリ側が想定していない上書きを防ぐため、既定では public に留めるという設計になっています。", "otherChoices": [{"choice": "openはprivateより狭い", "reason": "open は最も広いアクセスレベルで、private より狭いということはありません。"}, {"choice": "publicはclass不可", "reason": "public は class にも付けられます。制限があるのは他モジュールからの継承だけです。"}, {"choice": "違いなし", "reason": "同じモジュール内では差が見えにくいものの、他モジュールから見たときに明確な違いがあります。"}], "takeaway": "open は他モジュールからの継承・override まで許可する。"}}]}, {"id": "swift-keypath-wrappers-builders", "level": "Intermediate", "title": "KeyPath・Property Wrapper・Result Builder", "summary": "SwiftUI周辺で頻出する高度な言語機能の役割を理解する。", "mental": "繰り返しpatternを型安全に表現する仕組み。", "points": ["KeyPathはpropertyへの参照。", "Property Wrapperは保存/取得ruleを再利用。", "@State等はWrapper構文。", "Result Builderは複数式からDSL構造を作る。"], "code": "let kp=\\User.name\nlet name=user[keyPath:kp]", "why": "SwiftUIの@State/@ViewBuilderを魔法ではなくSwiftの仕組みとして理解できる。", "pitfall": "wrappedValueとprojectedValue($)を混同しない。", "questions": [{"id": "q-swift-069", "difficulty": "Intermediate", "prompt": "\\User.name は？", "code": "let kp=\\User.name", "choices": ["KeyPath", "Closure", "Macro", "Protocol"], "answer": 0, "explanation": "propertyを指すKeyPath。", "detail": {"concept": "`\\User.name` は KeyPath で、「User 型の name というプロパティ」そのものを値として表します。値を読み出した結果ではなく、「どのプロパティか」という情報を持ち運べる点が特徴です。sorted(by:) や map で `\\.name` のように使われます。", "whyCorrect": "`\\型.プロパティ` という記法が KeyPath の書き方です。後から `user[keyPath: kp]` のようにして実際の値を取り出せます。", "otherChoices": [{"choice": "Closure", "reason": "クロージャは処理のかたまりです。KeyPath はプロパティの指定であり、処理は含みません。"}, {"choice": "Macro", "reason": "Macro は `#` や `@` を使ったコード生成の仕組みで、記法が異なります。"}, {"choice": "Protocol", "reason": "protocol は要件の定義であり、プロパティを指す値ではありません。"}], "example": {"code": "struct User { let name: String }\nlet users = [User(name: \"Yuki\"), User(name: \"Aki\")]\nprint(users.map(\\.name).sorted())", "output": "[\"Aki\", \"Yuki\"]", "explanation": "`\\.name` は「name プロパティを取り出す」ことを表す KeyPath です。クロージャを書かずに簡潔に指定できます。"}, "takeaway": "KeyPath は「どのプロパティか」を値として渡す仕組み。"}}, {"id": "q-swift-070", "difficulty": "Intermediate", "prompt": "$value がWrapperで表すことがあるものは？", "code": "@State var value=0", "choices": ["projectedValue", "必ずInt", "deinit", "subscript"], "answer": 0, "explanation": "$はprojectedValueへのaccess。", "detail": {"concept": "Property Wrapper は、プロパティに共通の振る舞いを付け加える仕組みです。`@State` などがこれにあたります。ラッパーは wrappedValue（本来の値）に加えて projectedValue という別の値を公開でき、`$value` と書くとその projectedValue にアクセスできます。", "whyCorrect": "`$` は projectedValue を取り出す記号です。SwiftUI では `@State var value` の `$value` が Binding を返し、子ビューへ読み書き両方の権限を渡す用途で使われます。", "otherChoices": [{"choice": "必ずInt", "reason": "projectedValue の型はラッパーの設計次第で、Int とは限りません。@State の場合は Binding です。"}, {"choice": "deinit", "reason": "deinit はインスタンス破棄時の処理で、`$` とは無関係です。"}, {"choice": "subscript", "reason": "subscript は `[ ]` によるアクセスの仕組みで、`$` とは別です。"}], "takeaway": "`$value` は Property Wrapper の projectedValue。"}}]}, {"id": "swift-macros", "level": "Intermediate", "title": "Macro", "summary": "コンパイル時にSwiftコードを生成するMacroを理解する。", "mental": "Macroはcompile前に展開され、繰り返しcodeを生成する。", "points": ["#で始まるfreestanding Macro。", "@で付けるattached Macro。", "@Modelや#expectで遭遇する。", "展開結果もSwiftとして型check。"], "code": "@Model\nfinal class Item{var name:String;init(name:String){self.name=name}}", "why": "現代のApple開発ではMacroを使うAPIが増えている。", "pitfall": "runtime reflectionではなくcompile-time code generation。", "questions": [{"id": "q-swift-071", "difficulty": "Intermediate", "prompt": "Macroが動作する主なtimingは？", "code": "@Model final class Item{}", "choices": ["compile時", "app終了後", "Git push時だけ", "tap時だけ"], "answer": 0, "explanation": "compile時に展開される。", "detail": {"concept": "Macro はコンパイル時にコードを検査・生成する仕組みです。`@Model` のような attached macro は、コンパイルの過程で必要なプロパティやメソッドを自動的に展開します。生成された結果は通常の Swift コードとして型チェックを受けます。", "whyCorrect": "実行前のコンパイル時に展開が終わるため、実行時の追加コストがほとんどありません。手書きの定型コードを減らしつつ、型安全性も保てます。", "otherChoices": [{"choice": "app終了後", "reason": "アプリ終了後に何かを展開することはありません。展開はビルド時に完了しています。"}, {"choice": "Git push時だけ", "reason": "Git の操作とは無関係です。バージョン管理の外側の話です。"}, {"choice": "tap時だけ", "reason": "ユーザー操作のタイミングではありません。実行時ではなくビルド時の仕組みです。"}], "takeaway": "Macro はコンパイル時に展開される。"}}, {"id": "q-swift-072", "difficulty": "Intermediate", "prompt": "Swift TestingのMacro例は？", "code": "#expect(value == 3)", "choices": ["#expect", "print", "if", "import"], "answer": 0, "explanation": "#expectはMacro。", "detail": {"concept": "Swift Testing では `#expect(...)` を使って条件を検証します。`#` で始まる記法は freestanding macro（式マクロ）で、書いた式そのものをコンパイル時に解析し、失敗時にどの値がどうだったかを report できるコードへ展開します。", "whyCorrect": "`#expect` は macro なので、単に true / false を受け取るだけでなく、式の中身を分解して失敗内容を詳しく示せます。これが従来の assert 系との違いです。", "otherChoices": [{"choice": "print", "reason": "print は標準ライブラリの通常の関数で、macro ではありません。"}, {"choice": "if", "reason": "if は言語の制御構文です。macro ではありません。"}, {"choice": "import", "reason": "import はモジュールを取り込む宣言で、macro ではありません。"}], "takeaway": "`#` で始まる呼び出しは freestanding macro。"}}]}, {"id": "swift-advanced-operators", "level": "Intermediate", "title": "Bitwise・Overflow・Custom Operator", "summary": "低levelやlibraryで出会う演算子機能を理解する。", "mental": "演算子も型に対して定義でき、bit演算では整数の各bitを直接扱う。", "points": ["& | ^ ~ << >>はbitwise。", "&+ &- &*はoverflow演算。", "独自operatorを定義可能。", "precedence groupで優先順位定義。"], "code": "let flags=0b0011\nlet mask=0b0101\nlet result=flags & mask", "why": "flag、binary形式、低level APIで遭遇する。", "pitfall": "独自operatorの乱用は可読性を落とす。", "questions": [{"id": "q-swift-073", "difficulty": "Intermediate", "prompt": "& の役割は？", "code": "let r=0b0011 & 0b0101", "choices": ["論理ANDと同じ", "bitwise AND", "文字列結合", "unwrap"], "answer": 1, "explanation": "bitごとのAND。", "detail": {"concept": "`&` を数値どうしに使うと bitwise AND（ビットごとの論理積）になります。2 進数の各桁を突き合わせ、両方が 1 の桁だけが 1 になります。0b0011 と 0b0101 では最下位の桁だけが両方 1 なので、結果は 0b0001 の 1 です。", "whyCorrect": "Bool どうしの「かつ」ではなく、整数の各ビットに対する演算です。フラグの組み合わせを 1 つの整数で管理する場面などで使われます。", "otherChoices": [{"choice": "論理ANDと同じ", "reason": "Bool の論理積は `&&` です。`&` は整数のビット単位の演算で、対象も結果も異なります。"}, {"choice": "文字列結合", "reason": "文字列の結合は `+` です。"}, {"choice": "unwrap", "reason": "Optional を外すのは `!` や `??` です。なお `&` は inout 引数を渡すときの記号としても使われますが、それは関数呼び出しの文脈での役割です。"}], "example": {"code": "print(0b0011 & 0b0101)\nprint(0b0011 | 0b0101)\nprint(true && false)", "output": "1\n7\nfalse", "explanation": "`&` と `|` は整数のビット演算、`&&` と `||` は Bool の論理演算です。記号が似ていても対象が違います。"}, "takeaway": "`&` はビット演算、`&&` は Bool の論理演算。"}}, {"id": "q-swift-074", "difficulty": "Intermediate", "prompt": "独自operatorで最優先は？", "code": "infix operator <+>", "choices": ["短さ", "意味が明確で読みやすいこと", "必ずpublic", "常に使う"], "answer": 1, "explanation": "標準的な関数より分かりやすい場合に限る。", "detail": {"concept": "Swift では `infix operator <+>` のように独自の演算子を定義できます。ただし記号は名前と違って意味を説明しないため、読み手が推測に頼ることになります。定義するかどうかは可読性を基準に判断します。", "whyCorrect": "独自演算子は、その記号の意味がチーム内で明確に共有され、関数呼び出しより読みやすくなる場合にだけ価値があります。判断基準は「短く書けるか」ではなく「意図が伝わるか」です。", "otherChoices": [{"choice": "短さ", "reason": "短さ自体は目的になりません。短くても意味が伝わらなければ、読み手の負担が増えます。"}, {"choice": "必ずpublic", "reason": "アクセスレベルは公開範囲の設計で決めるもので、独自演算子の必須条件ではありません。"}, {"choice": "常に使う", "reason": "常用すべきものではありません。多用すると、コードを読むのに独自ルールの学習が必要になります。"}], "takeaway": "独自演算子は「読みやすくなるとき」だけ。"}}]}, {"id": "swift-memory-safety", "level": "Intermediate", "title": "Memory Safety・Exclusive Access", "summary": "Swiftが不正なmemory accessや重複変更を防ぐ仕組みを理解する。", "mental": "自動memory管理でも、同じ値を同時にどう触るかには安全ruleがある。", "points": ["未初期化/範囲外/解放後accessを防ぐ。", "inoutは長時間のwrite accessになり得る。", "重複write accessを制限。", "並行data race対策とも関連。"], "code": "func balance(_ x:inout Int,_ y:inout Int){\n let total=x+y\n x=total/2\n y=total-x\n}", "why": "Swiftの安全性の根本。inoutやConcurrency error理解につながる。", "pitfall": "同じ変数を複数inoutへ同時に渡す等は許可されない。", "questions": [{"id": "q-swift-075", "difficulty": "Intermediate", "prompt": "Memory Safetyの目的は？", "code": "var values=[1,2,3]", "choices": ["無効/競合memory accessを防ぐ", "UI自動配置", "通信暗号化", "Git conflict防止"], "answer": 0, "explanation": "Swiftはmemory accessの安全性を保証する。", "detail": {"concept": "Memory Safety とは、解放済みの領域や範囲外の領域にアクセスしたり、同じ領域へ同時に矛盾した書き込みを行ったりすることを防ぐ、という保証です。Swift は ARC や排他的アクセスの規則によって、こうした問題の多くをコンパイル時または実行時に検出します。", "whyCorrect": "無効なアクセスや競合するアクセスは、原因の追いにくい不具合やセキュリティ上の弱点につながります。Swift はこれを言語の仕組みとして防ぐ設計になっています。", "otherChoices": [{"choice": "UI自動配置", "reason": "画面の配置は Auto Layout や SwiftUI のレイアウトの話です。"}, {"choice": "通信暗号化", "reason": "通信の暗号化は TLS など別の領域の話です。"}, {"choice": "Git conflict防止", "reason": "Git の競合はバージョン管理上の話で、メモリとは無関係です。"}], "takeaway": "Memory Safety は無効・競合するメモリアクセスを防ぐ保証。"}}, {"id": "q-swift-076", "difficulty": "Intermediate", "prompt": "swapLike(&x,&x) の問題は？", "code": "swapLike(&x,&x)", "choices": ["重複した排他的accessになり得る", "必ず高速", "Optional化", "問題なし"], "answer": 0, "explanation": "同じmemoryへのoverlapping write accessになる。", "detail": {"concept": "Swift は「同じメモリ領域への書き込みアクセスが重ならないこと」を要求します。これを排他的アクセス（exclusive access）と呼びます。inout 引数は書き込みアクセスにあたるため、同じ変数を 2 か所の inout 引数に同時に渡すと、重複した書き込みアクセスになります。", "steps": ["1 つ目の引数として x への書き込みアクセスが始まる。", "2 つ目の引数としても同じ x への書き込みアクセスが始まる。", "同じ領域への書き込みが重なるため、排他的アクセスの規則に反する。", "Swift はこれを検出して拒否する（同一変数と静的に分かる場合はコンパイル時に指摘される）。"], "whyCorrect": "重なった書き込みは結果が予測できなくなるため、言語仕様として禁止されています。値を入れ替えたい場合は標準の swap(&a, &b) を異なる変数に対して使います。", "otherChoices": [{"choice": "必ず高速", "reason": "速度の話ではありません。安全性の規則の話です。"}, {"choice": "Optional化", "reason": "Optional 化とは無関係です。"}, {"choice": "問題なし", "reason": "問題ないどころか、この書き方は許可されません。"}], "takeaway": "同じ変数を 2 つの inout 引数に同時に渡せない。"}}]}]}, {"id": "foundation", "name": "Foundation & Data", "subtitle": "データを扱い、外部世界と接続する", "description": "Codable、JSON、Date、URL、HTTP、URLSession、File、UserDefaults、Regex、データモデリングなど実アプリのデータ処理を学ぶ。", "lessons": [{"id": "foundation-standard-protocols", "level": "Basic", "title": "Equatable・Hashable・Comparable・Identifiable", "summary": "データ型が『比較できる・Set/Dictionaryで使える・順序比較できる・IDを持つ』能力を表す。", "mental": "標準Protocol準拠は、型が何を保証するかを宣言すること。", "points": ["Equatableで==比較。", "HashableでSet要素やDictionary Key。", "Comparableで大小比較とsorted。", "Identifiableで安定したid。"], "code": "struct User:Identifiable,Hashable{\n let id:UUID\n let name:String\n}", "why": "SwiftUI List、cache、重複排除、sortで頻出。", "pitfall": "Hashableのidentityに関わる値を不適切に変更する設計は避ける。", "questions": [{"id": "q-foundation-001", "difficulty": "Basic", "prompt": "Dictionary Keyに必要な代表Protocolは？", "code": "struct Key: /* ? */ {}", "choices": ["Hashable", "View", "Error", "Actor"], "answer": 0, "explanation": "Dictionary KeyはHashable。", "detail": {"concept": "Dictionary はキーから値を素早く探すための型です。探すときはキーの hash 値（値を要約した整数）で候補を絞り、その後 == で本当に同じキーかを確定します。Hashable はこの 2 つの能力をまとめて要求する契約で、Equatable を継承しているため == も使えます。", "whyCorrect": "hash 値の生成と等価比較の両方が揃って初めて、キーによる検索が成立します。String や Int が Key によく使われるのは、これらが標準で Hashable に準拠しているからです。", "otherChoices": [{"choice": "View", "reason": "SwiftUI で画面の見た目を表す契約です。データ構造のキー条件とは関係がありません。"}, {"choice": "Error", "reason": "throw して投げられる値が満たす契約です。エラー表現のためのもので、検索には使われません。"}, {"choice": "Actor", "reason": "並行処理で可変な状態を保護する型の種類です。キーの条件ではありません。"}], "takeaway": "Dictionary の Key と Set の要素は Hashable。"}}, {"id": "q-foundation-002", "difficulty": "Basic", "prompt": "Identifiableが要求する中心propertyは？", "code": "struct Item:Identifiable{...}", "choices": ["id", "name", "hash", "body"], "answer": 0, "explanation": "安定したidentifier idを提供する。", "detail": {"concept": "Identifiable は「この値を一意に識別できる id を持つ」ことを表す契約です。SwiftUI の List や ForEach は、要素の並びが変わったときに「どれが同じ要素か」を id で判断して差分更新を行います。", "whyCorrect": "要求されるのは id という名前のプロパティ 1 つです。型は Hashable であれば Int でも String でも UUID でも構いません。", "otherChoices": [{"choice": "name", "reason": "name は識別子として使えることもありますが、Identifiable が名前として要求するプロパティではありません。同名の別要素があると識別できません。"}, {"choice": "hash", "reason": "hash は Hashable が扱う概念です。hash 値は衝突しうるため、一意な識別子としては使えません。"}, {"choice": "body", "reason": "body は SwiftUI の View が要求するプロパティで、画面の内容を返します。"}], "takeaway": "Identifiable が求めるのは id ひとつ。"}}]}, {"id": "foundation-codable", "level": "Basic", "title": "Codable・Encodable・Decodable", "summary": "Swift型とJSONなどの外部表現を相互変換する基本を学ぶ。", "mental": "Codableは『保存/通信できる形への変換契約』。", "points": ["Codable=Encodable+Decodable。", "JSONDecoderでData→型。", "JSONEncoderで型→Data。", "propertyがCodableなら自動合成される場合が多い。"], "code": "struct User:Codable{\n let id:Int\n let name:String\n}", "why": "REST API、file保存、cacheの中心。", "pitfall": "JSONの型やkeyがmodelと合わないとdecode失敗する。", "questions": [{"id": "q-foundation-003", "difficulty": "Basic", "prompt": "Codableは何の組み合わせ？", "code": "struct User:Codable{}", "choices": ["Equatable+Hashable", "Encodable+Decodable", "View+Identifiable", "Error+Sendable"], "answer": 1, "explanation": "CodableはEncodableとDecodableのtypealias。", "detail": {"concept": "Foundation は Swift 言語そのものには無い「アプリを作るための土台」を提供します。その 1 つが JSON などの外部表現との変換です。Encodable は「Swift の値を外部表現へ書き出せる」、Decodable は「外部表現から Swift の値を作れる」契約で、Codable はその 2 つをまとめた別名（typealias）です。", "whyCorrect": "`typealias Codable = Encodable & Decodable` と定義されているため、Codable と書けば両方向の変換が可能になります。片方だけでよいなら Encodable か Decodable を個別に書けます。", "otherChoices": [{"choice": "Equatable+Hashable", "reason": "等価比較と hash 値生成の契約です。データ変換とは別の目的です。"}, {"choice": "View+Identifiable", "reason": "SwiftUI の画面表現と識別の契約で、JSON 変換とは無関係です。"}, {"choice": "Error+Sendable", "reason": "エラー表現と並行処理の安全性の契約です。"}], "takeaway": "Codable = Encodable（書き出し）+ Decodable（読み込み）。"}}, {"id": "q-foundation-004", "difficulty": "Basic", "prompt": "JSON Data→Userは？", "code": "let user = try /* ? */", "choices": ["JSONEncoder().encode(User.self)", "JSONDecoder().decode(User.self,from:data)", "String(data)", "User(data)"], "answer": 1, "explanation": "JSONDecoderでDecodable型へdecodeする。", "detail": {"concept": "JSON の byte 列（Data）から Swift の値を作るのは JSONDecoder の役割です。`decode(User.self, from: data)` は「User という型として data を読み解く」という意味で、第 1 引数に型そのもの（`.self`）、第 2 引数に元データを渡します。データの向きは JSON → Swift です。", "steps": ["サーバーなどから受け取った JSON が Data（byte 列）として手元にある。", "JSONDecoder に「どの型として読むか」と「元の Data」を渡す。", "各キーが型のプロパティに対応付けられ、User の値が組み立てられる。", "形が合わない場合は例外が投げられるため、呼び出しに try が必要になる。"], "whyCorrect": "decode は Decodable な型を作る方向の API です。失敗しうるため try と組み合わせて使います。", "otherChoices": [{"choice": "JSONEncoder().encode(User.self)", "reason": "JSONEncoder は Swift の値から JSON を作る逆方向の API です。また encode に渡すのは型ではなく値です。"}, {"choice": "String(data)", "reason": "String(data:encoding:) は byte 列を文字列として解釈するだけで、型のプロパティへの対応付けは行いません。"}, {"choice": "User(data)", "reason": "User に Data を受け取る初期化が自動で用意されることはありません。自分で定義すれば別ですが、標準の手段ではありません。"}], "example": {"code": "import Foundation\n\nstruct User: Codable { let id: Int; let name: String }\n\ndo {\n    let encoder = JSONEncoder()\n    encoder.outputFormatting = .sortedKeys\n    let data = try encoder.encode(User(id: 1, name: \"Yuki\"))\n    print(String(decoding: data, as: UTF8.self))\n    let back = try JSONDecoder().decode(User.self, from: data)\n    print(back.name)\n} catch {\n    print(\"failed\")\n}", "output": "{\"id\":1,\"name\":\"Yuki\"}\nYuki", "explanation": "encode で Swift の値 → JSON、decode で JSON → Swift の値と、両方向を 1 つの型で扱えます。sortedKeys はキーの順を安定させる指定です。"}, "takeaway": "decode は JSON → Swift、encode は Swift → JSON。"}}]}, {"id": "foundation-codable-custom", "level": "Intermediate", "title": "CodingKeys・Custom Codable", "summary": "JSON keyとSwift名が違う場合や特殊変換を制御する。", "mental": "外部APIの形と、内部で読みやすいmodel名を無理に一致させなくてよい。", "points": ["CodingKeysでkey対応。", "decoderのdate strategy等を利用。", "必要ならinit(from:)を自前実装。", "DTOとDomain Modelを分ける設計も有効。"], "code": "struct UserDTO:Decodable{\n let userID:Int\n enum CodingKeys:String,CodingKey{case userID=\"user_id\"}\n}", "why": "snake_case APIや特殊JSONを安全に扱う。", "pitfall": "外部API都合をapp全体のmodelへ漏らさない。", "questions": [{"id": "q-foundation-005", "difficulty": "Intermediate", "prompt": "CodingKeysの役割は？", "code": "case userID=\"user_id\"", "choices": ["Swift名とJSON keyを対応", "暗号化", "Optional化", "HTTP header"], "answer": 0, "explanation": "外部key名とSwift property名を対応付ける。", "detail": {"concept": "JSON のキー名は snake_case（user_id）、Swift のプロパティ名は camelCase（userID）というように、命名規則が食い違うことがよくあります。CodingKeys は「この Swift のプロパティは JSON のこのキーに対応する」という対応表を書くための仕組みです。", "whyCorrect": "`case userID = \"user_id\"` は、内部では userID、外部の JSON では user_id という名前で扱うことを指定します。これにより Swift 側の命名を崩さずに外部仕様へ合わせられます。", "otherChoices": [{"choice": "暗号化", "reason": "CodingKeys は名前の対応付けだけを行い、内容を保護する機能はありません。"}, {"choice": "Optional化", "reason": "値の有無を表す Optional は型の後ろの ng", "reason": "文字として解釈できるとは限りません。文字コードを指定して初めて文字列になります。"}, {"choice": "View", "reason": "画面の表現とは無関係です。"}], "takeaway": "Data は中身を問わない byte 列。解釈は使う側が決める。"}}, {"id": "q-foundation-008", "difficulty": "Basic", "prompt": "UTF-8 Data→Stringの代表例は？", "code": "String(data:data,encoding:.utf8)", "choices": ["正しい", "不可", "JSONDecoder専用", "UIKit専用"], "answer": 0, "explanation": "encodingを指定してStringとして解釈できる。", "detail": {"concept": "byte 列を文字列にするには「どの文字コードで解釈するか」を指定する必要があります。同じ byte 列でも UTF-8 と別の符号化方式では違う文字になるためです。`String(data:encoding:)` は解釈に失敗する可能性があるので String? を返します。", "whyCorrect": "encoding に .utf8 を指定することで、byte 列を UTF-8 の文字列として読み解けます。失敗しうる点を踏まえ、if let などで取り出すか、失敗しない `String(decoding:as:)` を使います。", "otherChoices": [{"choice": "不可", "reason": "文字コードを指定すれば変換できます。不可能ではありません。"}, {"choice": "JSONDecoder専用", "reason": "JSONDecoder を使わずに単なる文字列として読む用途でも使えます。"}, {"choice": "UIKit専用", "reason": "Foundation の API であり、UI フレームワークに限定されません。"}], "example": {"code": "import Foundation\n\nlet data = Data(\"Gym\".utf8)\nprint(data.count)\nif let text = String(data: data, encoding: .utf8) {\n    print(text)\n}\nprint(String(decoding: data, as: UTF8.self))", "output": "3\nGym\nGym", "explanation": "文字列 → Data、Data → 文字列の両方向です。String(data:encoding:) は失敗しうるので Optional、String(decoding:as:) は不正な byte を置換文字に変えて必ず成功します。"}, "takeaway": "byte 列 → 文字列には文字コードの指定が要る。"}}]}, {"id": "foundation-date-calendar", "level": "Basic", "title": "Date・Calendar・TimeZone", "summary": "時刻の一点と、人間のcalendar上の年月日を分けて扱う。", "mental": "Dateは絶対時刻、Calendar/TimeZoneは年月日時分へ解釈する規則。", "points": ["Dateは特定の瞬間。", "Calendarで日付成分の加減算。", "TimeZoneで時差。", "固定秒数で1日を計算しない。"], "code": "let now=Date()\nlet tomorrow=Calendar.current.date(byAdding:.day,value:1,to:now)", "why": "予約、log、締切、calendar UIでdate bugを防ぐ。", "pitfall": "1日は常に86400秒とは限らない。", "questions": [{"id": "q-foundation-009", "difficulty": "Basic", "prompt": "Dateが表すものは？", "code": "let now=Date()", "choices": ["特定の瞬間", "必ず日本時間文字列", "calendar画面", "TimeZoneだけ"], "answer": 0, "explanation": "Dateは時間軸上の一点。", "detail": {"concept": "Date は「時間軸上の一点」、つまり世界共通の特定の瞬間を表す値です。表示用の文字列や、年月日といった暦の情報は含んでいません。同じ Date でも、どの地域・どの暦で見るかによって「何年何月何日何時」は変わります。", "whyCorrect": "Date は瞬間そのもの、Calendar と TimeZone がその瞬間を暦の上でどう読むかを決め、フォーマッタが表示用の文字列を作ります。役割がはっきり分かれています。", "otherChoices": [{"choice": "必ず日本時間文字列", "reason": "表示用の文字列は Date から別途組み立てます。Date 自身は文字列を保持しません。"}, {"choice": "calendar画面", "reason": "画面の部品ではありません。値としての時刻です。"}, {"choice": "TimeZoneだけ", "reason": "TimeZone は瞬間を地域の時刻として読むための情報で、Date とは別の型です。"}], "takeaway": "Date は瞬間の値。表示文字列は別に作る。"}}, {"id": "q-foundation-010", "difficulty": "Intermediate", "prompt": "翌日計算に推奨されるのは？", "code": "Calendar.current.date(byAdding:.day,value:1,to:date)", "choices": ["Calendarで日加算", "86400秒固定", "文字列+1", "計算不可"], "answer": 0, "explanation": "暦ruleを考慮できる。", "detail": {"concept": "暦の上での「翌日」は、必ずしも 24 時間後とは限りません。夏時間の切り替わりがある地域では 23 時間や 25 時間になる日があり、うるう秒や暦の違いも存在します。Calendar はこうした規則を踏まえて日付計算を行います。", "whyCorrect": "`Calendar.current.date(byAdding:.day, value: 1, to:)` は暦の規則に従って翌日を求めます。自分で秒数を足すより安全です。", "otherChoices": [{"choice": "86400秒固定", "reason": "1 日を 86400 秒固定として足す方法は、夏時間のある地域で 1 時間ずれる原因になります。時間の間隔としては正しくても、暦の上の「翌日」とは一致しないことがあります。"}, {"choice": "文字列+1", "reason": "日付を文字列として扱って加算するのは、桁上がりや月末の処理を自前で実装することになり誤りの元です。"}, {"choice": "計算不可", "reason": "Calendar を使えば計算できます。"}], "example": {"code": "import Foundation\n\nvar calendar = Calendar(identifier: .gregorian)\ncalendar.timeZone = TimeZone(secondsFromGMT: 0) ?? calendar.timeZone\nlet base = Date(timeIntervalSince1970: 0)\nif let next = calendar.date(byAdding: .day, value: 1, to: base) {\n    print(Int(next.timeIntervalSince1970))\n}", "output": "86400", "explanation": "UTC では 1 日がちょうど 86400 秒なのでこの値になりますが、夏時間のある地域では同じ計算でも秒数が変わります。だから暦の計算は Calendar に任せます。"}, "takeaway": "日付の加算は Calendar に任せる。86400 秒固定は危険。"}}]}, {"id": "foundation-formatting", "level": "Basic", "title": "Locale・FormatStyle・Measurement", "summary": "内部の値とユーザー向け表示を分離する。", "mental": "同じ数値や日付でも地域で表記が違う。", "points": ["Date.formattedで日付表示。", "数値FormatStyleでcurrency/percent等。", "Localeで地域rule。", "Measurementで単位付き値。"], "code": "let price=1234.5\nlet text=price.formatted(.currency(code:\"JPY\"))", "why": "国際化、通貨、単位、日付表示で必要。", "pitfall": "保存値と表示文字列を同一視しない。", "questions": [{"id": "q-foundation-011", "difficulty": "Basic", "prompt": "FormatStyleの主用途は？", "code": "price.formatted(.currency(code:\"JPY\"))", "choices": ["ユーザー向け整形", "DB作成", "Actor化", "Git管理"], "answer": 0, "explanation": "値を用途/地域に応じて表示形式へ変換。", "detail": {"concept": "FormatStyle は値を「人に見せるための文字列」へ変換する仕組みです。通貨記号の位置、桁区切り、小数点の記号などは国や言語で異なるため、Locale の情報に基づいて整形します。", "whyCorrect": "`price.formatted(.currency(code: \"JPY\"))` は金額を通貨表示に整えます。自前で文字列を組み立てるより、地域ごとの慣習に正しく従えます。", "otherChoices": [{"choice": "DB作成", "reason": "データの保存先を作る機能ではありません。表示のための変換です。"}, {"choice": "Actor化", "reason": "並行処理での状態保護とは無関係です。"}, {"choice": "Git管理", "reason": "バージョン管理とは無関係です。"}], "takeaway": "FormatStyle は表示用の整形。地域差を吸収する。"}}, {"id": "q-foundation-012", "difficulty": "Basic", "prompt": "内部Dateの扱いとして良いのは？", "code": "Date -> formatted String", "choices": ["内部はDate、表示時format", "常にStringだけ", "TimeZone無視", "Locale固定"], "answer": 0, "explanation": "dataとpresentationを分離する。", "detail": {"concept": "同じ時刻でも、表示は地域・言語・画面によって変わります。そこで内部では Date のまま保持し、画面に出す直前だけ文字列へ整形するのが基本方針です。データと表示（presentation）を分ける考え方です。", "whyCorrect": "Date のまま持っていれば、比較・並べ替え・差分計算がそのまま行えます。文字列にしてしまうと、それらの操作のたびに解析し直す必要が生じます。", "otherChoices": [{"choice": "常にStringだけ", "reason": "文字列だけで保持すると、比較や計算のたびに解析が必要になり、地域を変えた表示にも対応できません。"}, {"choice": "TimeZone無視", "reason": "TimeZone を無視すると、日付の境界がずれて別の日として扱われる不具合が起きます。"}, {"choice": "Locale固定", "reason": "特定の Locale に固定すると、他の言語環境の利用者に合わない表示になります。"}], "takeaway": "内部は Date、表示の直前だけ文字列へ。"}}]}, {"id": "foundation-url-components", "level": "Basic", "title": "URL・URLComponents・Percent Encoding", "summary": "URLを文字列連結ではなく構造として安全に組み立てる。", "mental": "URLはscheme/host/path/queryなどの部品を持つ。", "points": ["URLでresource場所を表す。", "URLComponentsでqueryを構築。", "URLQueryItemを使う。", "Percent encodingを手書きしない。"], "code": "var c=URLComponents(string:\"https://example.com/search\")!\nc.queryItems=[URLQueryItem(name:\"q\",value:\"Swift UI\")]", "why": "検索API、deep link、file URLで必須。", "pitfall": "String連結は空白や&などで壊れやすい。", "questions": [{"id": "q-foundation-013", "difficulty": "Basic", "prompt": "Query parameterを安全に作る型は？", "code": "var c=URLComponents(...)", "choices": ["URLComponents", "Calendar", "Set", "Dataだけ"], "answer": 0, "explanation": "URLComponentsとURLQueryItemを使う。", "detail": {"concept": "URL には使える文字が決められており、空白や日本語、`&` `=` などの記号はそのままでは使えません。安全に扱うには percent encoding（%20 のような置き換え）が必要です。URLComponents は URL を「scheme・host・path・query」といった部品に分けて扱い、この変換を自動で行います。", "whyCorrect": "URLQueryItem で名前と値を渡せば、必要な文字だけが適切に変換されます。文字列連結では書き手が変換漏れを起こしがちです。", "otherChoices": [{"choice": "Calendar", "reason": "暦の計算を扱う型で、URL とは無関係です。"}, {"choice": "Set", "reason": "重複のない集合を表す型です。URL の組み立てには使いません。"}, {"choice": "Dataだけ", "reason": "Data は byte 列で、URL の構造は扱いません。"}], "example": {"code": "import Foundation\n\nvar components = URLComponents(string: \"https://example.com/search\")\ncomponents?.queryItems = [URLQueryItem(name: \"q\", value: \"leg day\")]\nif let url = components?.url {\n    print(url.absoluteString)\n}", "output": "https://example.com/search?q=leg%20day", "explanation": "値に含まれる空白が %20 へ自動変換されています。文字列連結ではこの変換を自分で行う必要があり、漏れると壊れた URL になります。"}, "takeaway": "query の組み立ては URLComponents + URLQueryItem。"}}, {"id": "q-foundation-014", "difficulty": "Basic", "prompt": "URLをString連結しない主理由は？", "code": "\"https://x.com?q=\"+query", "choices": ["特殊文字encodingで壊れやすい", "+禁止", "URLはInt", "理由なし"], "answer": 0, "explanation": "構造化APIでencodingを扱う方が安全。", "detail": {"concept": "検索語などの値には、空白・記号・日本語が入り得ます。これらを変換せずに URL へ連結すると、区切り記号として解釈されたり、そもそも URL として無効になったりします。値が外部由来の場合、意図しない書き換えを招く危険もあります。", "whyCorrect": "文字列連結は「値の中身が安全である」という前提に依存します。URLComponents を使えばその前提が不要になり、変換漏れによる不具合を構造的に防げます。", "otherChoices": [{"choice": "+禁止", "reason": "`+` による文字列連結自体は文法として正しく、禁止されているわけではありません。問題は変換の欠落です。"}, {"choice": "URLはInt", "reason": "URL は数値ではありません。"}, {"choice": "理由なし", "reason": "変換漏れという明確な理由があります。"}], "takeaway": "URL を文字列連結で作らない。変換漏れが壊れる原因になる。"}}]}, {"id": "foundation-http-request", "level": "Basic", "title": "URLRequest・HTTP Method・Header・Status Code", "summary": "HTTP通信を構成する基本要素を理解する。", "mental": "通信はURLだけでなくmethod/header/body/statusの契約。", "points": ["GET/POST/PUT/PATCH/DELETE。", "HeaderでContent-Type/Authorization等。", "BodyにJSON Data等。", "HTTP status codeを確認。"], "code": "var request=URLRequest(url:url)\nrequest.httpMethod=\"POST\"\nrequest.setValue(\"application/json\",forHTTPHeaderField:\"Content-Type\")", "why": "API連携の最低限。HTTPの意味が分からないとdebugできない。", "pitfall": "transport成功でも404/500などapplication上の失敗はある。", "questions": [{"id": "q-foundation-015", "difficulty": "Basic", "prompt": "Content-Typeが示すものは？", "code": "Content-Type: application/json", "choices": ["request bodyの形式", "通信速度", "OS", "Git branch"], "answer": 0, "explanation": "bodyのmedia typeを示す。", "detail": {"concept": "HTTP ヘッダは、本体（body）に添える補足情報です。Content-Type はその中でも「body をどの形式として解釈すべきか」を示すもので、`application/json` なら受け取った側は JSON として解析します。", "whyCorrect": "同じ byte 列でも、形式の宣言が違えばサーバー側の解釈が変わります。JSON を送っているのに Content-Type を付け忘れると、正しく解析されず失敗する原因になります。", "otherChoices": [{"choice": "通信速度", "reason": "通信の速さを伝えるヘッダではありません。"}, {"choice": "OS", "reason": "クライアントの環境を伝えるのは User-Agent などの別のヘッダです。"}, {"choice": "Git branch", "reason": "バージョン管理とは無関係です。"}], "takeaway": "Content-Type は body の形式の宣言。"}}, {"id": "q-foundation-016", "difficulty": "Basic", "prompt": "URLSessionがthrowしなければstatusは必ず200？", "code": "let (data,response)=try await URLSession.shared.data(for:request)", "choices": ["必ず200", "HTTP statusを別途確認", "必ず404", "response無し"], "answer": 1, "explanation": "network成功とHTTP成功は別。", "detail": {"concept": "URLSession が例外を投げるのは、接続できない・タイムアウトしたなど「通信そのものが成立しなかった」場合です。サーバーに届いて 404 や 500 が返ってきた場合、通信としては成功しているため例外は投げられません。この 2 つは別の層の話です。", "steps": ["リクエストを送り、レスポンスを受け取る。", "ここで例外が出なければ「サーバーまで届いて返事が来た」ことだけが分かる。", "返事の中身が成功か失敗かは、HTTPURLResponse の statusCode を見て判断する。", "2xx 以外ならアプリ側でエラーとして扱う。"], "whyCorrect": "ネットワークの成功と、HTTP としての成功は別々に確認する必要があります。statusCode の確認を省くと、エラーページの本文を正常なデータとして解析しようとして失敗します。", "otherChoices": [{"choice": "必ず200", "reason": "404 や 500 でも通信自体は成功しているため、例外は投げられません。200 とは限りません。"}, {"choice": "必ず404", "reason": "特定の値に決まることはありません。サーバーの応答次第です。"}, {"choice": "response無し", "reason": "レスポンスは data と一緒に必ず返ります。"}], "takeaway": "例外が出ない ≠ HTTP 成功。statusCode を必ず確認する。"}}]}, {"id": "foundation-urlsession", "level": "Intermediate", "title": "URLSession・async/await Networking", "summary": "URLSessionで非同期通信を行い、response検証とdecodeまでつなげる。", "mental": "通信処理は request → await → status確認 → decode の流れで読む。", "points": ["data(for:)でDataとURLResponse。", "HTTPURLResponseへcastしてstatus確認。", "JSONDecoderでDTOへdecode。", "timeout/retry/cancellationは別途設計。"], "code": "let (data,response)=try await URLSession.shared.data(for:request)\nguard let http=response as? HTTPURLResponse,\n      200..<300 ~= http.statusCode else { throw APIError.invalidResponse }\nlet dto=try JSONDecoder().decode(UserDTO.self,from:data)", "why": "ほぼすべてのnetwork appで必要。", "pitfall": "View内にrequest生成からdecodeまで全部書くとtestしづらい。", "questions": [{"id": "q-foundation-017", "difficulty": "Intermediate", "prompt": "200..<300 ~= statusCode の意味は？", "code": "guard 200..<300 ~= http.statusCode else { ... }", "choices": ["2xx範囲か確認", "300以上だけ", "String化", "URL作成"], "answer": 0, "explanation": "statusが200以上300未満かpattern matchingしている。", "detail": {"concept": "`~=` はパターンマッチ演算子で、左辺のパターンに右辺の値が含まれるかを判定します。`200..<300` は 200 以上 300 未満の範囲なので、`200..<300 ~= statusCode` は「statusCode が 2xx か」の判定になります。switch の case で範囲を書いたときも内部でこの演算子が使われています。", "whyCorrect": "HTTP の成功を表すのは 200 番台全体です。200 だけを見ると、204（成功だが本文なし）や 201（作成成功）を誤ってエラー扱いしてしまいます。", "otherChoices": [{"choice": "300以上だけ", "reason": "`..<` は上限を含まないため、300 以上は範囲外です。判定しているのは 2xx です。"}, {"choice": "String化", "reason": "文字列への変換とは無関係です。"}, {"choice": "URL作成", "reason": "URL の生成とは無関係です。"}], "example": {"code": "let range = 200..<300\nprint(range ~= 204)\nprint(range ~= 404)\nprint(range ~= 300)", "output": "true\nfalse\nfalse", "explanation": "204 は 2xx なので成功、404 は範囲外、300 は上限に含まれないため false です。`..<` が上限を含まない点がここで効いています。"}, "takeaway": "成功判定は 200 だけでなく 200..<300 で行う。"}}, {"id": "q-foundation-018", "difficulty": "Intermediate", "prompt": "JSON Dataを型へ変換するのは？", "code": "let (data,_)=try await URLSession.shared.data(from:url)", "choices": ["JSONDecoder", "Calendar", "FileManager", "Set"], "answer": 0, "explanation": "Decodable型へdecodeする。", "detail": {"concept": "URLSession が返すのは Data、つまり byte 列です。アプリの中で扱うには、その byte 列を Swift の型に対応付ける必要があり、JSON 形式ならその役割を担うのが JSONDecoder です。データの向きは ネットワーク → Data → Swift の型 です。", "whyCorrect": "受け取った Data を decode に渡すことで、キーがプロパティへ対応付けられた型の値になります。以降は型として安全に扱えます。", "otherChoices": [{"choice": "Calendar", "reason": "暦の計算を行う型で、データ変換は行いません。"}, {"choice": "FileManager", "reason": "ファイルの読み書きや管理を行う型です。JSON の解析はしません。"}, {"choice": "Set", "reason": "重複のない集合を表す型で、変換の機能はありません。"}], "takeaway": "受信した Data は JSONDecoder で型へ変換する。"}}]}, {"id": "foundation-filemanager", "level": "Basic", "title": "FileManager・File URL・Sandbox", "summary": "アプリのfile保存場所と読み書きの基本を学ぶ。", "mental": "アプリは好きな場所へ書けず、自分のsandbox内の適切なdirectoryを使う。", "points": ["Documents/Cachesなど用途別directory。", "FileManagerで作成/削除/存在確認。", "URLでpathを組み立てる。", "Data.write / Data(contentsOf:)で簡単なI/O。"], "code": "let dir=FileManager.default.urls(for:.documentDirectory,in:.userDomainMask)[0]\nlet file=dir.appendingPathComponent(\"settings.json\")\ntry data.write(to:file)", "why": "画像、JSON、export、cacheを扱う時に必要。", "pitfall": "cacheとユーザー生成dataの保存先を混同しない。", "questions": [{"id": "q-foundation-019", "difficulty": "Basic", "prompt": "ユーザー生成fileの候補は？", "code": ".documentDirectory", "choices": ["Documents", "必ず/tmpだけ", "任意のsystem folder", "Git repo"], "answer": 0, "explanation": "Documentsは保持すべき文書dataの代表的保存先。", "detail": {"concept": "iOS アプリは sandbox と呼ばれる専用の領域の中でだけファイルを読み書きできます。その中に用途別の場所があり、Documents はユーザーが作った・ユーザーにとって価値のあるデータを置く場所です。バックアップの対象にもなります。", "whyCorrect": "ユーザー生成のデータは失われると困るため、消えては困るものを置く Documents が適切です。", "otherChoices": [{"choice": "必ず/tmpだけ", "reason": "一時領域はシステムの判断で削除されます。保持したいデータの置き場所には向きません。"}, {"choice": "任意のsystem folder", "reason": "sandbox の外にある任意の場所へは書き込めません。"}, {"choice": "Git repo", "reason": "バージョン管理の場所であり、アプリの実行時の保存先ではありません。"}], "takeaway": "残すべきユーザーデータは Documents。"}}, {"id": "q-foundation-020", "difficulty": "Basic", "prompt": "Cachesに置くdataは？", "code": ".cachesDirectory", "choices": ["再生成/再取得可能なdata", "唯一の重要data", "password平文", "signing certificate"], "answer": 0, "explanation": "削除されても再取得できるdata向け。", "detail": {"concept": "Caches は「無くても再び用意できるデータ」を置く場所です。端末の空き容量が少なくなると、システムの判断で中身が削除されることがあります。削除されても再取得や再生成ができる前提で使います。", "whyCorrect": "サムネイル画像やダウンロード済みの一時データのように、消えても再度取得すれば済むものが適しています。消えたら困るデータを置くと復旧できません。", "otherChoices": [{"choice": "唯一の重要data", "reason": "そこにしか無い重要なデータは、削除される可能性のある場所に置くべきではありません。Documents などを使います。"}, {"choice": "password平文", "reason": "認証情報を平文で保存すること自体が不適切です。Keychain のような保護された仕組みを使います。"}, {"choice": "signing certificate", "reason": "証明書は開発・配布の仕組みで扱うもので、アプリのキャッシュ領域に置くものではありません。"}], "takeaway": "Caches は消えてもよいデータ専用。"}}]}, {"id": "foundation-userdefaults", "level": "Basic", "title": "UserDefaults・小さな設定値", "summary": "軽量なユーザー設定をKey-Valueで保存する。", "mental": "UserDefaultsは小さな設定帳。DBでも秘密情報storeでもない。", "points": ["Bool/String/Int等の小さな設定向け。", "再起動後も保持。", "大量data/複雑queryには不向き。", "秘密情報はKeychain等を検討。"], "code": "UserDefaults.standard.set(true,forKey:\"hasOnboarded\")\nlet done=UserDefaults.standard.bool(forKey:\"hasOnboarded\")", "why": "onboarding完了や表示設定に手軽。", "pitfall": "token/passwordをUserDefaultsへ平文保存しない。", "questions": [{"id": "q-foundation-021", "difficulty": "Basic", "prompt": "UserDefaultsが向くものは？", "code": "UserDefaults.standard.set(true,forKey:\"darkMode\")", "choices": ["小さな設定", "大量画像", "password平文", "動画"], "answer": 0, "explanation": "軽量設定値向け。", "detail": {"concept": "UserDefaults は少量の設定値を key と value の組で保存する仕組みです。アプリ起動時に内容が読み込まれる前提の作りなので、大きなデータを入れるとメモリと起動時間を圧迫します。", "whyCorrect": "ダークモードの有無や並び順の選択のような、数値・文字列・真偽値といった小さな値の保存に向いています。", "otherChoices": [{"choice": "大量画像", "reason": "画像のような大きなデータはファイルとして保存し、パスや識別子だけを残すのが適切です。"}, {"choice": "password平文", "reason": "保護されていない領域なので、認証情報の平文保存には使えません。Keychain を使います。"}, {"choice": "動画", "reason": "動画も同様に大きすぎます。ファイルとして扱います。"}], "takeaway": "UserDefaults は小さな設定値だけ。大きなデータと秘密情報は別。"}}, {"id": "q-foundation-022", "difficulty": "Basic", "prompt": "秘密情報の保存候補は？", "code": "let token=\"secret\"", "choices": ["Keychain", "UserDefaults平文", "print log", "README"], "answer": 0, "explanation": "credentialはKeychain等を検討。", "detail": {"concept": "Keychain は OS が提供する保護された保存領域で、暗号化された状態で認証情報を保持します。UserDefaults やファイルに平文で保存した場合と違い、他のアプリや単純な閲覧から保護されます。", "whyCorrect": "トークンやパスワードのような資格情報は Keychain のような保護された仕組みに保存します。なお、アプリに埋め込んだ値はいずれ解析され得るため、「クライアントに置けば秘密が守られる」とは考えないことも重要です。本当に秘匿すべき処理はサーバー側に置きます。", "otherChoices": [{"choice": "UserDefaults平文", "reason": "保護されていないため、認証情報の保存先としては不適切です。"}, {"choice": "print log", "reason": "ログに出力すると、端末やクラッシュレポートに残り、開発者以外の目に触れる可能性があります。"}, {"choice": "README", "reason": "リポジトリに書き込むと、履歴として残り共有されてしまいます。"}], "takeaway": "資格情報は Keychain。そもそも端末側の秘密は完全には守れない。"}}]}, {"id": "foundation-notificationcenter", "level": "Intermediate", "title": "NotificationCenter", "summary": "1対多のevent通知を疎結合に配信する仕組みを理解する。", "mental": "送信者が受信者を直接知らずに『出来事』をbroadcastする。", "points": ["Notification.Nameでevent種別。", "複数observerが受信可能。", "object/userInfoでpayload。", "型安全性はdelegate/closureより弱くなりやすい。"], "code": "NotificationCenter.default.post(name:.didLogout,object:nil)", "why": "app全体eventやlegacy codeで遭遇する。", "pitfall": "何でもNotificationCenterにすると依存関係が見えなくなる。", "questions": [{"id": "q-foundation-023", "difficulty": "Intermediate", "prompt": "NotificationCenterが向く性質は？", "code": "NotificationCenter.default.post(...)", "choices": ["1対多event通知", "型継承", "JSON decode", "Auto Layout"], "answer": 0, "explanation": "broadcast用途。", "detail": {"concept": "NotificationCenter は「送り手が受け手を知らないまま、出来事を broadcast する」仕組みです。1 つの通知に対して受け手が 0 人でも複数人でも成り立ち、送り手側のコードは変わりません。", "whyCorrect": "キーボードの表示やアプリの状態変化など、誰が関心を持つか送り手には分からない出来事の通知に向いています。", "otherChoices": [{"choice": "型継承", "reason": "型の継承関係とは無関係な、実行時の通知の仕組みです。"}, {"choice": "JSON decode", "reason": "JSON の解析は Codable と JSONDecoder の役割です。"}, {"choice": "Auto Layout", "reason": "画面のレイアウトとは関係ありません。"}], "takeaway": "NotificationCenter は 1 対多の broadcast。"}}, {"id": "q-foundation-024", "difficulty": "Intermediate", "prompt": "乱用時の問題は？", "code": "post(name:...,object:nil)", "choices": ["依存関係やdata型が追いづらい", "必ずcompile error", "通信不能", "ARC停止"], "answer": 0, "explanation": "event flowが暗黙的になりやすい。", "detail": {"concept": "NotificationCenter は送り手と受け手が直接つながらない分、コードを読んだだけでは「誰が誰に影響しているか」が見えません。また通知に添える値は型が固定されないことが多く、受け取り側で型を確認する手間が生じます。", "whyCorrect": "依存関係が暗黙的になり、通知を追いかけないと処理の流れが分かりません。関係が固定的なら、delegate や直接の呼び出し、状態の共有といった明示的な手段のほうが追跡しやすくなります。", "otherChoices": [{"choice": "必ずcompile error", "reason": "多用してもコンパイルは通ります。だからこそ問題に気づきにくいと言えます。"}, {"choice": "通信不能", "reason": "通信の可否とは無関係です。"}, {"choice": "ARC停止", "reason": "メモリ管理が止まることはありません。ただし解除し忘れると不要な購読が残ることはあります。"}], "takeaway": "便利だが依存関係が見えなくなる。関係が固定なら明示的な手段を。"}}]}, {"id": "foundation-regex", "level": "Intermediate", "title": "Regex・RegexBuilder", "summary": "文字列patternを検索・検証する。", "mental": "Regexは文字列の規則を表し、単純containsより構造的な検証ができる。", "points": ["Regex literalを利用可能。", "wholeMatch/firstMatch等で判定。", "capture部分を取り出せる。", "複雑なRegexは分解してtest。"], "code": "let regex=/\\d{4}-\\d{2}-\\d{2}/\nlet matched=\"2026-07-24\".wholeMatch(of:regex) != nil", "why": "入力検証、log解析、text抽出で便利。", "pitfall": "仕様全体を巨大な1本のRegexで完全検証しようとしない。", "questions": [{"id": "q-foundation-025", "difficulty": "Intermediate", "prompt": "wholeMatchの特徴は？", "code": "\"2026-07-24\".wholeMatch(of:/\\d{4}-\\d{2}-\\d{2}/)", "choices": ["文字列全体が一致するか", "先頭1文字だけ", "HTTP通信", "Dateへ自動変換"], "answer": 0, "explanation": "入力全体とのmatchを確認する。", "detail": {"concept": "正規表現の照合には範囲の違いがあります。wholeMatch は「入力全体がパターンに一致するか」、firstMatch は「どこかに一致する部分があるか」を調べます。入力の検証には、余計な文字が混ざっていないことを確認できる wholeMatch が向いています。", "whyCorrect": "`\\d{4}-\\d{2}-\\d{2}` に対して wholeMatch を使えば、日付だけで構成された文字列かどうかを判定できます。前後に別の文字があれば一致しません。", "otherChoices": [{"choice": "先頭1文字だけ", "reason": "先頭 1 文字だけを見る API ではありません。全体を対象とします。"}, {"choice": "HTTP通信", "reason": "通信とは無関係です。"}, {"choice": "Dateへ自動変換", "reason": "一致の判定を行うだけで、日付の型へ変換はしません。変換は別途行います。"}], "example": {"code": "import Foundation\n\ndo {\n    let pattern = try Regex(#\"\\d{4}-\\d{2}-\\d{2}\"#)\n    print(\"2026-07-24\".wholeMatch(of: pattern) != nil)\n    print(\"x2026-07-24\".wholeMatch(of: pattern) != nil)\n    print(\"x2026-07-24\".firstMatch(of: pattern) != nil)\n} catch {\n    print(\"invalid pattern\")\n}", "output": "true\nfalse\ntrue", "explanation": "余計な文字が付くと wholeMatch は一致しませんが、firstMatch は部分一致するため true になります。ここでは文字列からパターンを作っていますが、新しい言語モードでは設問のような /.../ というリテラル記法も使えます。"}, "takeaway": "検証は wholeMatch、抽出は firstMatch。"}}, {"id": "q-foundation-026", "difficulty": "Intermediate", "prompt": "複雑なRegexで重要なのは？", "code": "/.../", "choices": ["具体例/反例をtest", "1行へ詰める", "force unwrap", "UI限定"], "answer": 0, "explanation": "境界条件をtestする。", "detail": {"concept": "正規表現は短く書けても、境界の挙動が直感と食い違いやすい記法です。「一致してほしい例」だけでなく「一致してほしくない例（反例）」も含めて確認しないと、通しすぎ・弾きすぎに気づけません。", "whyCorrect": "具体例と反例を並べて検証することで、意図した範囲だけを受け付けているかを確認できます。テストとして残せば、後から式を変えたときの崩れにも気づけます。", "otherChoices": [{"choice": "1行へ詰める", "reason": "1 行に詰めても読みやすくはなりません。複雑なものは RegexBuilder で分解するほうが保守しやすくなります。"}, {"choice": "force unwrap", "reason": "Optional を無理に外す書き方は、一致しなかった場合に停止する原因になります。"}, {"choice": "UI限定", "reason": "正規表現は入力検証やログ解析など、画面以外でも広く使われます。"}], "takeaway": "正規表現は「通る例」と「通らない例」の両方で確認する。"}}]}, {"id": "foundation-sequence-collection", "level": "Intermediate", "title": "Sequence・Collection・Lazy", "summary": "Arrayの下にある抽象化と遅延評価を理解する。", "mental": "Sequenceは順番に値を取り出せ、Collectionはindex等のより強い保証を持つ。", "points": ["Sequenceはfor-in可能。", "Collectionはindex等を追加保証。", "lazyで変換を必要時まで遅延。", "巨大dataで中間配列を減らせる場合。"], "code": "let result=(1...1_000_000).lazy.map{$0*2}.first{$0>100}", "why": "標準library APIとperformance理解につながる。", "pitfall": "lazyを付ければ常に高速ではない。", "questions": [{"id": "q-foundation-027", "difficulty": "Intermediate", "prompt": "lazyの主特徴は？", "code": "(1...100).lazy.map{$0*2}", "choices": ["必要まで変換を遅延", "必ず並列化", "DB保存", "Optional化"], "answer": 0, "explanation": "要素要求まで評価を遅らせる。", "detail": {"concept": "通常の map は、その場ですべての要素を変換した新しい配列を作ります。lazy を挟むと変換は即座に行われず、実際に要素が必要になった時点で 1 つずつ計算されます。先頭数件しか使わない場合や、途中で打ち切る場合に無駄な計算を避けられます。", "whyCorrect": "評価が必要になるまで遅らせるのが lazy の本質です。並列に実行されるわけではなく、あくまで「いつ計算するか」を変える最適化です。", "otherChoices": [{"choice": "必ず並列化", "reason": "実行を並列化する機能ではありません。処理の順番は変わらず、タイミングだけが遅れます。"}, {"choice": "DB保存", "reason": "保存とは無関係です。"}, {"choice": "Optional化", "reason": "値の有無を表す Optional とは関係ありません。"}], "example": {"code": "var evaluated = 0\nlet doubled = (1...100).lazy.map { (value: Int) -> Int in\n    evaluated += 1\n    return value * 2\n}\nprint(doubled.first ?? 0)\nprint(evaluated)", "output": "2\n1", "explanation": "100 要素あっても、先頭 1 件しか使わなければ変換は 1 回しか実行されません。lazy を外すと 100 回実行されます。"}, "takeaway": "lazy は「必要になるまで計算しない」。並列化ではない。"}}, {"id": "q-foundation-028", "difficulty": "Intermediate", "prompt": "CollectionがSequenceより追加する代表能力は？", "code": "Collection", "choices": ["index access等", "必ずSet", "必ず参照型", "HTTP通信"], "answer": 0, "explanation": "より強い走査/indexの保証を持つ。", "detail": {"concept": "Sequence は「先頭から順に 1 回ずつ取り出せる」ことだけを保証します。Collection はそれに加えて、何度でも走査できること、位置を表す index があること、count を有限時間で得られることなどを保証します。", "whyCorrect": "index による位置指定のアクセスは Collection 以降で使える能力です。Sequence だけでは一度きりの走査しか保証されないため、添字アクセスができません。", "otherChoices": [{"choice": "必ずSet", "reason": "Set は Collection の 1 つですが、Collection が Set になるわけではありません。Array も Collection です。"}, {"choice": "必ず参照型", "reason": "Array は struct であり値型です。参照型である必要はありません。"}, {"choice": "HTTP通信", "reason": "通信の機能とは無関係です。"}], "takeaway": "Collection は Sequence に index と再走査を足したもの。"}}]}, {"id": "foundation-data-modeling", "level": "Intermediate", "title": "DTO・Domain Model・Value Object・ID", "summary": "データを外部形式・アプリの意味・表示へ分けて設計する。", "mental": "data型は単なる入れ物ではなく、不正状態を作らせない設計手段。", "points": ["DTOはAPI/保存形式の境界。", "Domain Modelはapp内の意味。", "Value Objectで単位/制約を型に閉じ込める。", "安定IDと表示indexを区別。"], "code": "struct UserDTO:Decodable{let user_id:Int}\nstruct User:Identifiable{let id:Int}\nfunc map(_ dto:UserDTO)->User{User(id:dto.user_id)}", "why": "中規模以上で変更影響を小さくしtestしやすくする。", "pitfall": "何でも巨大な1 Modelへまとめない。", "questions": [{"id": "q-foundation-029", "difficulty": "Intermediate", "prompt": "DTOを分ける主目的は？", "code": "API JSON -> UserDTO -> User", "choices": ["外部形式変更を内部から分離", "必ずcode量削減", "UI自動生成", "ARC無効"], "answer": 0, "explanation": "外部仕様との境界を作れる。", "detail": {"concept": "API のレスポンス形式は、こちらの都合とは無関係に変わることがあります。DTO を挟むと、その変化を受け止める層が 1 か所に定まり、アプリ内部のモデルはそのままで済みます。", "whyCorrect": "変換処理という明確な境界を置くことで、外部仕様の変更が内部へ波及しにくくなります。テストのときも、DTO の解析と内部ロジックを別々に検証できます。", "otherChoices": [{"choice": "必ずcode量削減", "reason": "型が増えるため、コード量はむしろ増えることが多いです。得られるのは変更に強い構造です。"}, {"choice": "UI自動生成", "reason": "UI が自動生成されることはありません。"}, {"choice": "ARC無効", "reason": "メモリ管理とは無関係です。"}], "takeaway": "DTO は外部変更の受け止め役。内部モデルを守る。"}}, {"id": "q-foundation-030", "difficulty": "Intermediate", "prompt": "indexとIDの違いは？", "code": "items[index].id", "choices": ["indexは位置、IDは同一性", "常に同じ", "IDは表示位置", "indexはUUID"], "answer": 0, "explanation": "並べ替えでindexは変わる。", "detail": {"concept": "index は「今この並びの中で何番目にあるか」という位置の情報で、並べ替えや削除で簡単に変わります。ID は「それがどの要素なのか」を表す同一性の情報で、並び順が変わっても要素に付いて回ります。", "whyCorrect": "位置と同一性は別の概念です。選択中の要素を index で覚えていると、並べ替えた瞬間に別の要素を指してしまいます。ID で覚えていれば正しく追随します。", "otherChoices": [{"choice": "常に同じ", "reason": "並べ替えを行えば一致しなくなります。常に同じではありません。"}, {"choice": "IDは表示位置", "reason": "ID は表示上の位置を表しません。位置を表すのは index です。"}, {"choice": "indexはUUID", "reason": "index は整数の位置であり、UUID のような識別子ではありません。"}], "example": {"code": "struct Exercise: Identifiable { let id: Int; let name: String }\nvar exercises = [Exercise(id: 10, name: \"squat\"), Exercise(id: 20, name: \"bench\")]\nprint(exercises[0].id)\nexercises.reverse()\nprint(exercises[0].id)", "output": "10\n20", "explanation": "同じ index 0 でも、並べ替えの前後で別の要素を指しています。要素を特定したいときは index ではなく id を使います。"}, "takeaway": "index は位置、ID は同一性。並べ替えで差が出る。"}}]}, {"id": "foundation-copy-value", "level": "Intermediate", "title": "Copy-on-Write・Value Semantics", "summary": "Array/String/Dictionary等が値型として振る舞いつつ効率よくcopyされる考え方を知る。", "mental": "見た目はcopyでも内部共有し、変更時に実copyする最適化がある。", "points": ["標準Collectionは値semantics。", "片方変更が他方へ影響しない。", "Copy-on-Writeで不要copyを避ける。", "値semanticsと内部memory共有は別。"], "code": "var a=[1,2,3]\nvar b=a\nb.append(4)\nprint(a)", "why": "struct/Arrayのperformanceと意味を正しく理解する。", "pitfall": "値型=毎回即フルcopyと単純化しない。", "questions": [{"id": "q-foundation-031", "difficulty": "Intermediate", "prompt": "b.append後のaは？", "code": "var a=[1,2]\nvar b=a\nb.append(3)", "choices": ["[1,2]", "[1,2,3]", "nil", "未定義"], "answer": 0, "explanation": "Arrayは値semantics。", "detail": {"concept": "Array は struct であり値型です。代入すると論理的には中身がコピーされ、以降は互いに独立します。片方に要素を追加しても、もう片方の要素数は変わりません。", "steps": ["a は [1, 2]。", "`var b = a` で b は a と独立した値になる。", "b.append(3) は b 側だけを変更する。", "a は [1, 2] のまま。"], "whyCorrect": "値型のコピーは独立しているため、意図しない共有による書き換えが起きません。", "otherChoices": [{"choice": "[1,2,3]", "reason": "b 側の結果です。参照型であればこうなりますが、Array は値型です。"}, {"choice": "nil", "reason": "配列が nil になることはありません。"}, {"choice": "未定義", "reason": "動作は仕様として明確に定まっています。"}], "example": {"code": "var a = [1, 2]\nvar b = a\nb.append(3)\nprint(a)\nprint(b)", "output": "[1, 2]\n[1, 2, 3]", "explanation": "代入した時点では中身を共有していますが、b を変更した瞬間に実際のコピーが作られ、a は影響を受けません。"}, "takeaway": "Array の代入は独立したコピーとして振る舞う。"}}, {"id": "q-foundation-032", "difficulty": "Intermediate", "prompt": "Copy-on-Writeとは？", "code": "var b=a", "choices": ["変更時まで実copyを遅らせる最適化", "必ず参照型化", "非同期化", "JSON化"], "answer": 0, "explanation": "値semanticsを保ちつつcopy costを抑える。", "detail": {"concept": "Copy-on-Write（COW）は、代入のたびに実際のコピーを作るのではなく、内部の記憶領域を共有しておき、どちらかが変更された瞬間に初めて本物のコピーを作る最適化です。利用者から見た振る舞いは値型のコピーそのままで、コストだけが下がります。", "steps": ["`var b = a` の時点では、a と b が同じ記憶領域を共有している（コピーはまだ発生しない）。", "b に変更が加わる直前に、共有されているかどうかが確認される。", "共有されていれば、その時点で b 用の複製が作られる。", "以降 b への変更は a に影響しない。"], "whyCorrect": "大きな配列を代入しただけで毎回全要素を複製していては非効率です。COW により、読み取るだけなら複製せず、変更するときだけ複製します。", "otherChoices": [{"choice": "必ず参照型化", "reason": "参照型に変わるわけではありません。値型の振る舞いを保ったままコストを下げる仕組みです。"}, {"choice": "非同期化", "reason": "非同期処理とは無関係です。"}, {"choice": "JSON化", "reason": "データ変換とは無関係です。"}], "takeaway": "COW は「変更するまでコピーしない」。値型の意味は変わらない。"}}]}]}, {"id": "concurrency", "name": "Concurrency & Memory", "subtitle": "失敗・非同期・共有状態を安全に扱う", "description": "Error Handling、ARC、weak/unowned、async/await、Task、Actor、MainActor、SendableまでSwift Concurrencyとメモリ管理を学ぶ。", "lessons": [{"id": "concurrency-errors", "level": "Basic", "title": "Error Handling・throws / do-catch / defer", "summary": "失敗する処理を型と制御フローで明示的に扱う。", "mental": "Errorは『想定外でcrash』ではなく『この操作は失敗し得る』ことをAPIに表す。", "points": ["Error準拠型で失敗理由。", "throws関数をtryで呼ぶ。", "do-catchで回復。", "deferでscope終了時の後処理。"], "code": "enum LoadError:Error{case invalid}\nfunc load() throws -> String { throw LoadError.invalid }\ndo { _=try load() } catch { print(error) }", "why": "network、file、decode、永続化など失敗するI/Oで必須。", "pitfall": "try?で何でもnil化するとerror理由が消える。", "questions": [{"id": "q-concurrency-001", "difficulty": "Basic", "prompt": "throws関数の通常呼び出しに必要なのは？", "code": "func load() throws -> String{\"OK\"}\nlet x=/* ? */ load()", "choices": ["try", "await", "weak", "mutating"], "answer": 0, "explanation": "throws関数はtryで呼ぶ。", "detail": {"concept": "`throws` は「この関数は失敗してエラーを投げることがある」という宣言です。呼ぶ側はその可能性を無視できず、`try` を書いて「失敗しうる呼び出しである」ことを明示します。実際にエラーを受け止めるには do-catch で囲むか、自分も throws を付けて呼び出し元へ伝播させます。", "whyCorrect": "try は「ここで失敗するかもしれない」という目印です。コードを読むだけで失敗しうる箇所が分かるため、エラー処理の漏れに気づきやすくなります。", "otherChoices": [{"choice": "await", "reason": "await は非同期関数の呼び出しに使う記号で、処理が一時中断されうる地点を示します。エラーとは別の話で、両方必要なら `try await` と書きます。"}, {"choice": "weak", "reason": "weak は参照カウントを増やさない参照の指定で、メモリ管理のためのものです。"}, {"choice": "mutating", "reason": "mutating は struct のメソッドが自身を書き換えることを示す指定です。"}], "takeaway": "throws には try、async には await。両方なら `try await`。"}}, {"id": "q-concurrency-002", "difficulty": "Basic", "prompt": "deferはいつ実行？", "code": "func f(){defer{print(\"end\")};print(\"body\")}", "choices": ["scopeを抜ける直前", "最初", "compile時", "実行されない"], "answer": 0, "explanation": "scope終了時に実行。", "detail": {"concept": "defer は「このスコープを抜ける直前に必ず実行する処理」を登録する仕組みです。正常に最後まで進んだ場合も、途中で return した場合も、エラーを投げて抜けた場合も実行されます。ファイルを閉じる、フラグを戻すといった後始末をまとめて書けます。", "steps": ["関数に入り、defer ブロックが「後で実行する処理」として登録される（この時点では実行されない）。", "print(\"body\") が実行される。", "関数を抜ける直前に、登録された defer の中身が実行され end が出力される。"], "whyCorrect": "登録の順ではなく、スコープを抜けるタイミングで実行される点が defer の要点です。書く場所と実行される場所がずれます。", "otherChoices": [{"choice": "最初", "reason": "登録は最初に行われますが、実行は最後です。この順序の違いが defer の特徴です。"}, {"choice": "compile時", "reason": "実行時の仕組みであり、ビルド時に何かが起きるわけではありません。"}, {"choice": "実行されない", "reason": "スコープを抜ければ必ず実行されます。途中で return しても実行されます。"}], "example": {"code": "func run() {\n    defer { print(\"end\") }\n    print(\"body\")\n}\nrun()", "output": "body\nend", "explanation": "defer は先に書かれていても、実行されるのはスコープを抜ける直前です。後始末を処理の近くに書けるのが利点です。"}, "takeaway": "defer は「抜ける直前に必ず実行」。"}}]}, {"id": "concurrency-result", "level": "Basic", "title": "Result<Success, Failure>", "summary": "成功/失敗を値として持ち運ぶResult型を理解する。", "mental": "throwsが制御フローなら、Resultは成功/失敗をdataとして保持する。", "points": [".success(value) / .failure(error)。", "completion APIで頻出。", "get()で成功値取得またはthrow。", "async throwsへ移行できる場合も多い。"], "code": "func load(completion:(Result<Data,Error>)->Void){ }", "why": "legacy callback APIやlibraryで頻出。", "pitfall": "throwsとResultは用途が違う。失敗を値として保持したいかで考える。", "questions": [{"id": "q-concurrency-003", "difficulty": "Basic", "prompt": "Resultの主要caseは？", "code": "Result<Int,Error>", "choices": ["success/failure", "some/none", "on/off", "left/right"], "answer": 0, "explanation": "成功と失敗をenum caseで表す。", "detail": {"concept": "Result は「成功したときの値」と「失敗したときのエラー」を 1 つの値として表す enum です。`.success(値)` と `.failure(エラー)` の 2 つの case を持ち、結果をその場で処理せずに保持したり、あとから受け渡したりできます。", "whyCorrect": "成功と失敗を型で表すため、呼び出し側は switch で両方の場合を扱うことを強制されます。処理し忘れが起きにくくなります。", "otherChoices": [{"choice": "some/none", "reason": "Optional の内部表現の case 名です。値の有無を表すもので、失敗の理由は持てません。"}, {"choice": "on/off", "reason": "Result の case 名ではありません。"}, {"choice": "left/right", "reason": "Either 型を持つ他の言語での命名です。Swift の Result は success / failure です。"}], "takeaway": "Result は成功値と失敗理由を 1 つの値にまとめる。"}}, {"id": "q-concurrency-004", "difficulty": "Intermediate", "prompt": "result.get() がfailure時どうなる？", "code": "try result.get()", "choices": ["Errorをthrow", "nil固定", "0", "compile error"], "answer": 0, "explanation": "保持Errorをthrowする。", "detail": {"concept": "`get()` は Result から成功値を取り出すメソッドです。`.success` なら中の値を返し、`.failure` なら保持しているエラーを throw します。そのため呼び出しには try が必要で、do-catch と組み合わせて使います。", "steps": ["result が .success(値) なら、get() はその値をそのまま返す。", "result が .failure(エラー) なら、get() はそのエラーを throw する。", "呼び出し側は try で受け、catch でエラーを処理する。"], "whyCorrect": "Result を throws の世界へ橋渡しするのが get() の役割です。switch で分岐する代わりに、do-catch で扱えるようになります。", "otherChoices": [{"choice": "nil固定", "reason": "nil を返す API ではありません。nil で表すなら Optional を使います。Result は失敗の理由まで保持します。"}, {"choice": "0", "reason": "既定値で埋めることはありません。既定値が欲しい場合は自分で `?? 0` 相当の処理を書きます。"}, {"choice": "compile error", "reason": "try を付ければ正しくコンパイルできます。"}], "example": {"code": "enum LoadError: Error { case notFound }\nlet ok: Result<Int, Error> = .success(3)\nlet ng: Result<Int, Error> = .failure(LoadError.notFound)\ndo {\n    print(try ok.get())\n    print(try ng.get())\n} catch {\n    print(\"caught \\(error)\")\n}", "output": "3\ncaught notFound", "explanation": "成功なら値が返り、失敗なら保持していたエラーが投げられて catch に入ります。1 つ目の print は実行され、2 つ目は中断されます。"}, "takeaway": "get() は成功なら値、失敗なら throw。"}}]}, {"id": "concurrency-arc", "level": "Intermediate", "title": "ARC・Object Lifetime", "summary": "class instanceの寿命をreference countで管理する仕組みを理解する。", "mental": "ARCは『誰かが強く必要としている間だけclassを生かす』仕組み。", "points": ["strong reference中は保持。", "referenceがなくなるとdeinit。", "structの値semanticsとは別。", "循環参照は自動解消できない。"], "code": "final class User{deinit{print(\"deinit\")}}\nvar user:User?=User()\nuser=nil", "why": "UIKit、delegate、closure、service lifetime理解に必須。", "pitfall": "ARCはGCのように循環を自動検出して回収しない。", "questions": [{"id": "q-concurrency-005", "difficulty": "Intermediate", "prompt": "class instanceが通常解放される条件は？", "code": "var obj:MyClass?=MyClass()\nobj=nil", "choices": ["strong referenceがなくなる", "1秒経つ", "GCが必ず検出", "let使用"], "answer": 0, "explanation": "ARCはstrong reference countに基づく。", "detail": {"concept": "Swift は ARC（Automatic Reference Counting）でクラスのインスタンスを管理します。そのインスタンスを強く参照している変数の数が数えられていて、0 になった時点で解放されます。定期的に走査して回収する方式ではなく、参照が切れたその場で解放される点が特徴です。", "steps": ["MyClass() が作られ、obj が強く参照するので参照数は 1。", "`obj = nil` で obj からの参照が外れ、参照数が 0 になる。", "参照数が 0 になった時点で解放され、deinit があれば呼ばれる。"], "whyCorrect": "解放の条件は「強い参照が 1 つも残っていないこと」です。weak や unowned の参照は数に含まれないため、それだけが残っていても解放されます。", "otherChoices": [{"choice": "1秒経つ", "reason": "時間経過では解放されません。参照が残っていれば残り続けます。"}, {"choice": "GCが必ず検出", "reason": "Swift は走査型のガベージコレクタを使いません。参照数が 0 になった時点で決まったタイミングで解放されます。"}, {"choice": "let使用", "reason": "let か var かは、その変数を後から差し替えられるかどうかの違いであり、解放の条件ではありません。"}], "example": {"code": "final class Session {\n    deinit { print(\"released\") }\n}\nvar session: Session? = Session()\nprint(\"before\")\nsession = nil\nprint(\"after\")", "output": "before\nreleased\nafter", "explanation": "nil を代入した瞬間に参照数が 0 になり、その場で deinit が呼ばれます。解放のタイミングが確定している点が ARC の特徴です。"}, "takeaway": "強い参照が 0 になった瞬間に解放される。"}}, {"id": "q-concurrency-006", "difficulty": "Intermediate", "prompt": "ARCが自動解決できない代表問題は？", "code": "a.b=b; b.a=a", "choices": ["strong reference cycle", "Int加算", "Array sort", "URL encoding"], "answer": 0, "explanation": "相互strong参照で解放されない。", "detail": {"concept": "2 つのインスタンスが互いを強く参照し合うと、どちらの参照数も 0 になりません。外部からの参照をすべて外しても両方が生き残り、メモリが解放されないままになります。これが強参照循環（strong reference cycle）です。", "steps": ["a が b を強く参照する。", "b も a を強く参照する。", "外部の変数を nil にしても、互いの参照が残るため参照数は 0 にならない。", "どちらも解放されず、メモリ上に残り続ける。"], "whyCorrect": "ARC は参照数だけを見るため、この輪を自動では検出できません。設計者が weak や unowned でどちらか一方の参照を弱めて断ち切る必要があります。", "otherChoices": [{"choice": "Int加算", "reason": "数値の計算はメモリ管理と関係ありません。"}, {"choice": "Array sort", "reason": "並べ替えは値の操作であり、参照の循環とは無関係です。"}, {"choice": "URL encoding", "reason": "文字列の変換処理であり、メモリ管理の問題ではありません。"}], "takeaway": "互いに強参照すると解放されない。片方を weak にして断つ。"}}]}, {"id": "concurrency-weak-unowned", "level": "Intermediate", "title": "weak・unowned・Closure Capture", "summary": "参照循環を避ける非所有参照とcapture listを理解する。", "mental": "所有関係を『強く持つ』『存在する間だけ弱く見る』に分ける。", "points": ["weakは通常Optionalで対象解放時nil。", "unownedは対象生存を前提。", "delegateをweakにする設計が多い。", "capture listでself保持方法を指定。"], "code": "final class Child{weak var parent:Parent?}", "why": "delegate、completion、Coordinatorなどでmemory leakを防ぐ。", "pitfall": "weak/unownedはlifetime保証で使い分ける。", "questions": [{"id": "q-concurrency-007", "difficulty": "Intermediate", "prompt": "weak対象が解放されると？", "code": "weak var owner:Owner?", "choices": ["nilになる", "必ずcrash", "strongへ変化", "copy"], "answer": 0, "explanation": "zeroing weak referenceでnilになる。", "detail": {"concept": "weak 参照は対象の参照数を増やしません。そのため対象が解放されうるので、weak な変数は必ず Optional になります。対象が解放されると、その変数は自動的に nil になります（zeroing weak reference）。解放済みの領域を指したままにならないため安全です。", "whyCorrect": "自動的に nil になるので、使う前に if let などで確認すれば、すでに無くなった対象へアクセスする事故を防げます。", "otherChoices": [{"choice": "必ずcrash", "reason": "解放済みの領域を指したままにならないため、停止しません。unowned の場合は逆に、解放後にアクセスすると停止します。"}, {"choice": "strongへ変化", "reason": "弱い参照が自動的に強い参照へ変わることはありません。"}, {"choice": "copy", "reason": "参照であって複製ではありません。対象がコピーされることはありません。"}], "example": {"code": "final class Owner {\n    deinit { print(\"released\") }\n}\nvar owner: Owner? = Owner()\nweak var weakOwner = owner\nprint(weakOwner == nil)\nowner = nil\nprint(weakOwner == nil)", "output": "false\nreleased\ntrue", "explanation": "強い参照が外れた時点で対象が解放され、weak 側は自動的に nil になります。だから weak は必ず Optional として宣言します。"}, "takeaway": "weak は Optional。対象が消えると自動で nil。"}}, {"id": "q-concurrency-008", "difficulty": "Intermediate", "prompt": "unownedの前提は？", "code": "unowned let owner:Owner", "choices": ["参照中は対象が生存保証", "いつでもnil", "値型だけ", "MainActor必須"], "answer": 0, "explanation": "対象lifetimeがより長いと保証できる場合。", "detail": {"concept": "unowned も参照数を増やしませんが、weak と違って Optional にはならず、自動的に nil にもなりません。「自分が生きている間、相手は必ず生きている」と保証できる場合にだけ使います。保証が崩れて解放済みの対象にアクセスすると、その時点でプログラムが停止します。", "whyCorrect": "unowned は「相手のほうが自分より長生きする」という前提に依存します。子が親を参照するような、寿命の関係がはっきりしている場合に使います。", "otherChoices": [{"choice": "いつでもnil", "reason": "nil になり得るのは weak です。unowned は Optional ではないため nil を代入できません。"}, {"choice": "値型だけ", "reason": "参照の話なので対象は参照型です。値型には参照カウントがありません。"}, {"choice": "MainActor必須", "reason": "並行処理の指定とは無関係です。"}], "takeaway": "unowned は「相手が必ず生きている」前提。崩れると停止する。"}}]}, {"id": "concurrency-async-await", "level": "Basic", "title": "async / await", "summary": "非同期処理を直線的なcodeとして書く基本を理解する。", "mental": "awaitは『Taskが一時中断され後で再開する可能性』を示す。", "points": ["async関数は非同期完了。", "awaitはsuspension point。", "async throwsならtry await。", "async=必ず別threadではない。"], "code": "func load() async throws -> User{\n try await api.fetchUser()\n}", "why": "URLSessionなどmodern Swift開発の中心。", "pitfall": "await前後で同じthreadとは限らない。", "questions": [{"id": "q-concurrency-009", "difficulty": "Basic", "prompt": "awaitが示すものは？", "code": "let user=try await load()", "choices": ["Taskが中断され得る地点", "必ずnew thread", "Error無視", "同期化"], "answer": 0, "explanation": "suspension point。", "detail": {"concept": "await は「ここで待つかもしれない」ことを示す目印です。その地点で今の処理はいったん中断され（suspension point）、実行していたスレッドは解放されて他の作業に使われます。結果が用意できたら処理が再開されます。新しいスレッドが作られるわけではありません。", "steps": ["await の地点まで通常どおり実行される。", "結果がまだ無ければ、この処理は中断され、スレッドは他の作業へ回される。", "結果が用意できると、続きから再開される。", "再開後のスレッドは、中断前と同じとは限らない。"], "whyCorrect": "await は中断されうる地点の宣言です。中断中もスレッドが塞がらないため、少ないスレッドで多くの処理を並行に進められます。", "otherChoices": [{"choice": "必ずnew thread", "reason": "スレッドを新しく作る指示ではありません。むしろ待っている間はスレッドを手放します。"}, {"choice": "Error無視", "reason": "エラーとは無関係です。エラーを扱うのは try です。"}, {"choice": "同期化", "reason": "同期処理に変えるものではありません。非同期であることを明示する記号です。"}], "takeaway": "aw
