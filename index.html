ルの先頭に置きます。", "属性は、それが修飾する宣言の直前に書きます。", "import → @Test → func → 実行 → 検証 → 閉じかっこ、の順です。"], "explanation": "属性（@Test）は修飾する宣言（func）の直前に置きます。テスト本体は「実行して結果を得る → 期待値と比較する」という順序で、この2段構えが読みやすさの基本形です。`#expect(result == 1100)` は失敗時に result の実際の値を表示してくれるため、比較結果だけを別に組み立てるより調査が早くなります。", "detail": {"concept": "テストは「準備・実行・検証」の3段構成（Arrange / Act / Assert）で書くと、何を確かめているかが読み取りやすくなります。", "steps": ["`import Testing` … フレームワークを読み込む。", "`@Test(\"...\")` … 直後の func をテストとして登録する。", "`let result = ...` … 実行して結果を取り出す（Act）。", "`#expect(result == 1100)` … 期待値と比較する（Assert）。"], "whyCorrect": "属性が宣言の直前にあり、実行が検証より前にあるという2つの順序制約が守られています。この形なら、失敗時にどの値が想定と違ったかがすぐ分かります。", "commonMistakes": ["`#expect(priceWithTax(1000, rate: 0.1) == 1100)` と1行にまとめると、失敗時の表示は読めますが、複数回検証したいときに毎回計算し直すことになります。", "1つのテスト関数に多くの検証を詰め込むと、最初の失敗以降の状況が分かりにくくなります。観点ごとに分けます。"], "takeaway": "属性は宣言の直前。テスト本体は実行してから検証する。", "example": {"code": "func priceWithTax(_ price: Int, rate: Double) -> Int {\n    price + Int(Double(price) * rate)\n}\nlet result = priceWithTax(1000, rate: 0.1)\nprint(result == 1100, result)", "output": "true 1100", "explanation": "テストが検証している内容を、通常のコードとして確認したものです。"}}, "seriesId": "development-testing", "seriesStep": 3}, {"id": "practice-development-022", "track": "development", "lessonId": "dev-swift-testing", "type": "testReasoning", "difficulty": 3, "title": "常に成功するテストの問題点を読む", "prompt": "このテストは成功していますが、結果を信頼してよいか判断してください。問題点として最も妥当なものを選んでください。", "skills": ["testing", "debugging"], "noRunSolution": true, "content": {"requirement": "applyDiscount(price:percent:) が割引後の正しい価格を返すことを検証する。", "code": "@Test func discount() {\n    let result = applyDiscount(price: 1000, percent: 20)\n    #expect(result == result)\n}", "tests": [{"name": "通常実行", "input": "price: 1000, percent: 20", "expected": "成功すること", "result": "成功"}, {"name": "実装をわざと壊して実行", "input": "常に 0 を返す実装に差し替え", "expected": "失敗すること", "result": "失敗（壊しても成功してしまう）"}], "options": [{"id": "o1", "label": "期待値が実際の値自身と比較されているため、実装が何を返しても必ず成功する"}, {"id": "o2", "label": "#expect を2つ以上書かないとテストとして成立しない"}, {"id": "o3", "label": "テスト関数に @Test が付いていないため実行されていない"}, {"id": "o4", "label": "割引率が20%では小さすぎて差が出ないため検証にならない"}]}, "solution": {"optionId": "o1"}, "hints": ["2件目のテストは「実装を壊したら失敗するか」を確かめる観点です。", "壊しても成功するということは、実装の結果を実質的に見ていないということです。", "#expect の中身をよく読んでください。左辺と右辺は何と何を比べているでしょうか。"], "explanation": "2件目のテストが表しているのは「このテストが本当に不具合を検出できるか」という観点（変異テスト）です。検証している条件は、実装をわざと壊しても失敗するかどうかです。実装は `#expect(result == result)` と、取得した値を自分自身と比較しているため、result が何であっても常に true になります。つまり applyDiscount が 0 を返しても -1 を返しても成功してしまい、要件である「正しい価格を返すこと」を一切検証していません。1件目が成功しているのは当然で、成功していること自体が問題の徴候です。修正は `#expect(result == 800)` のように、実装から独立した期待値と比較することです。", "detail": {"concept": "テストの価値は「壊れたときに失敗すること」にあります。実装から導いた値を期待値にすると、実装が間違っていても一致してしまい、検出力がゼロになります。", "steps": ["要件は「正しい価格を返すこと」。", "期待値は要件から人が計算した値（1000 の 20% 引きで 800）であるべき。", "実装の戻り値を両辺に置くと、恒真な比較になる。", "実装を壊しても失敗しないため、テストとして機能していない。"], "whyCorrect": "実装を壊しても成功したという事実が、検証が実装に依存していることを直接示しています。@Test は付いており実行もされているため、実行の問題ではありません。", "commonMistakes": ["期待値を `price - price * percent / 100` のように実装と同じ式で書く間違いです。式ごと間違っていた場合に検出できません。", "テストが成功していることだけを確認して満足する間違いです。落ちることを一度確認しておくと、検出力を確かめられます。"], "takeaway": "期待値は実装から導かない。壊したら落ちることを一度確かめる。", "example": {"code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    price - price * percent / 100\n}\nlet result = applyDiscount(price: 1000, percent: 20)\nprint(result == result, result == 800)", "output": "true true", "explanation": "左の比較は常に true です。右のように独立した期待値と比べて初めて検証になります。"}}, "seriesId": "development-testing", "seriesStep": 4}, {"id": "practice-development-023", "track": "development", "lessonId": "dev-testing-parameterized", "type": "buildFunction", "difficulty": 3, "title": "境界値をまとめて検証するテストを組み立てる", "prompt": "割引率の境界値（0% と 100%）をまとめて検証するテストを作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["testing"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "import Testing"}, {"id": "b2", "code": "@Test(\"割引率の境界値\", arguments: [0, 100])"}, {"id": "b3", "code": "func discountBoundary(percent: Int) {"}, {"id": "b4", "code": "    let result = applyDiscount(price: 1000, percent: percent)"}, {"id": "b5", "code": "    #expect(result == (percent == 0 ? 1000 : 0))"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "func discountBoundary() {"}, {"id": "b8", "code": "    for percent in [0, 100] { }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["パラメータ化テストでは、値の一覧を属性側に書きます。", "属性に値を渡すなら、テスト関数はその値を引数として受け取る必要があります。", "ループで回すと、1件のテストとして扱われて失敗箇所が分かりにくくなります。"], "explanation": "`@Test(arguments:)` に値の一覧を渡すと、各値ごとに独立したテストケースとして実行されます。テスト関数はその値を引数で受け取るため、`func discountBoundary(percent: Int)` という形になります。ループで回す書き方（b8）でも検証はできますが、全体が1件のテストとして扱われるため、どの値で失敗したかが分かりにくく、途中で止まると残りが検証されません。引数を受け取らない宣言（b7）は、arguments を渡す属性と噛み合いません。", "detail": {"concept": "パラメータ化テストは「同じ観点を複数の入力で検証する」ための仕組みです。ケースごとに独立して実行・報告されるため、失敗の切り分けが速くなります。", "steps": ["`@Test(..., arguments: [0, 100])` … 入力の一覧を宣言する。", "`func discountBoundary(percent: Int)` … 各入力が引数として渡される。", "テスト本体は1つの入力だけを扱えばよい。", "実行時には入力ごとに別々のテストケースとして報告される。"], "whyCorrect": "arguments の要素の型と、テスト関数の引数の型が一致しているため成立します。ケースが分かれることで、失敗した入力が一目で分かります。", "commonMistakes": ["ループで回して1件のテストにまとめる書き方です。最初の失敗で止まると、残りの入力が検証されません。", "arguments に渡す値の個数と、関数の引数の個数を取り違える間違いです。2つの一覧を渡すと全組み合わせが実行されます。"], "takeaway": "同じ観点で入力が複数あるならパラメータ化。ループで束ねない。", "example": {"code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    guard percent >= 0, percent <= 100 else { return price }\n    return price - price * percent / 100\n}\nfor percent in [0, 100] {\n    print(percent, applyDiscount(price: 1000, percent: percent))\n}", "output": "0 1000\n100 0", "explanation": "パラメータ化テストが検証している内容を、通常のコードで確認したものです。"}}, "seriesId": "development-parameterized", "seriesStep": 1}, {"id": "practice-development-024", "track": "development", "lessonId": "dev-testing-parameterized", "type": "testReasoning", "difficulty": 3, "title": "3件中1件だけ失敗する入力を読む", "prompt": "パラメータ化テストの一部のケースだけが失敗しています。どの性質が検出されたのかを読み取ってください。", "skills": ["testing", "debugging"], "content": {"requirement": "pageCount(items:perPage:) は、端数が出る場合に切り上げたページ数を返す（1ページ2件の場合、7件なら4ページ）。", "code": "func pageCount(items: Int, perPage: Int) -> Int {\n    items / perPage\n}", "tests": [{"name": "割り切れる件数", "input": "items: 6, perPage: 2", "expected": "3", "result": "成功"}, {"name": "端数が出る件数", "input": "items: 7, perPage: 2", "expected": "4", "result": "失敗（3 が返った）"}, {"name": "割り切れる件数", "input": "items: 8, perPage: 2", "expected": "4", "result": "成功"}], "options": [{"id": "o1", "label": "整数除算が切り捨てになるため、割り切れない件数のときだけ1ページ不足する"}, {"id": "o2", "label": "perPage が 0 のときに 0 除算でクラッシュしている"}, {"id": "o3", "label": "items が負の値のときに符号を誤っている"}, {"id": "o4", "label": "7 件なら 3 ページが正しく、テストの期待値のほうが誤っている"}]}, "solution": {"optionId": "o1"}, "hints": ["成功した2件と失敗した1件で、入力の何が違うかを比べてください。", "6 と 8 は 2 で割り切れますが、7 は割り切れません。", "Int 同士の割り算は、小数点以下をどう扱うでしょうか。"], "explanation": "失敗したテストが表しているのは「端数が出たら切り上げる」という要件です。検証している入力 7 件は、perPage で割り切れない唯一のケースで、切り上げの有無が結果に現れる境界にあたります。実装は `items / perPage` という整数除算だけなので、7 / 2 は 3 に切り捨てられ、余った1件分のページが数えられません。6 件と 8 件のテストが成功しているのは、割り切れて切り上げが不要だからで、実装の正しさを示すものではありません。0 除算や負の値は今回の入力に含まれておらず、失敗の説明になりません。修正は `(items + perPage - 1) / perPage` のような切り上げ除算にすることです。", "detail": {"concept": "パラメータ化テストでは「どの入力が失敗したか」が直接ヒントになります。成功した入力と失敗した入力の差分が、原因の性質を指し示します。", "steps": ["6 と 8 は perPage で割り切れる → 切り捨てが起きない → 成功。", "7 は割り切れない → 切り捨てで1ページ不足 → 失敗。", "したがって原因は端数処理の欠落。", "切り上げ除算にすると3件とも通る。"], "whyCorrect": "失敗が「割り切れない入力」に限定されており、割り切れる入力はすべて成功しています。この分かれ方は、整数除算の切り捨て以外では説明できません。", "commonMistakes": ["テストデータを割り切れる値だけで用意すると、この不具合は永久に見つかりません。境界は「割り切れない値」です。", "`Int(ceil(Double(items) / Double(perPage)))` でも切り上げできますが、浮動小数点の丸め誤差が入る可能性があり、整数演算のほうが安全です。"], "takeaway": "失敗した入力と成功した入力の差分が原因を指す。端数は必ずテストする。", "example": {"code": "func pageCount(items: Int, perPage: Int) -> Int {\n    (items + perPage - 1) / perPage\n}\nfor items in [6, 7, 8] { print(items, pageCount(items: items, perPage: 2)) }", "output": "6 3\n7 4\n8 4", "explanation": "切り上げ除算にすると、割り切れる場合も端数がある場合も要件どおりになります。"}}, "seriesId": "development-parameterized", "seriesStep": 2}, {"id": "practice-development-025", "track": "development", "lessonId": "dev-swift-testing", "type": "shortCode", "difficulty": 2, "title": "検証の1行を書く", "prompt": "Swift Testing で、result が 1100 であることを検証する1行を書いてください。失敗しても後続の検証を続けたい場合のマクロを使います。", "skills": ["testing"], "content": {"context": "import Testing\n\n@Test func tax() {\n    let result = priceWithTax(1000, rate: 0.1)\n    // ここに1行書く\n}", "placeholder": "例: #マクロ(条件)"}, "solution": {"accepted": ["#expect(result == 1100)"]}, "hints": ["Swift Testing の検証はマクロなので、# で始まります。", "失敗しても続行するほうのマクロを使います。中断するほうではありません。", "かっこの中には、result と期待値を比較する条件式をそのまま書きます。"], "explanation": "`#expect(result == 1100)` と書きます。`#expect` は条件が false ならテストを失敗として記録しますが、その後の行も実行を続けます。失敗した時点で中断したい場合（それ以降の検証が意味をなさない前提条件など）は `#require` を使います。XCTest の XCTAssertEqual と違い、比較演算子をそのまま書けるうえ、失敗時には result の実際の値が自動的に表示されます。", "detail": {"concept": "検証マクロは式そのものを受け取り、失敗時に式の各部分の値を展開して表示します。そのため専用の比較関数を覚える必要がなく、通常の条件式の書き方がそのまま使えます。", "steps": ["`#expect(条件)` … 条件が false なら失敗として記録する。", "失敗しても関数の実行は続くため、複数の観点をまとめて確認できる。", "失敗時には result の実際の値が出力される。", "前提条件の検証には #require を使い、失敗時に中断する。"], "whyCorrect": "要件が「失敗しても後続を続けたい」なので、中断しない #expect が該当します。比較は通常の == で書けます。", "commonMistakes": ["XCTAssertEqual(result, 1100) と書く間違いです。Swift Testing では使えません。", "すべてを #require にすると、最初の失敗以降の情報が得られなくなります。前提条件だけに使います。"], "takeaway": "続行するなら #expect、中断するなら #require。条件式はそのまま書ける。", "example": {"code": "func priceWithTax(_ price: Int, rate: Double) -> Int {\n    price + Int(Double(price) * rate)\n}\nlet result = priceWithTax(1000, rate: 0.1)\nprint(result == 1100)", "output": "true", "explanation": "#expect が評価している条件式そのものを、通常のコードとして確認したものです。"}}, "seriesId": "development-testing", "seriesStep": 5}, {"id": "practice-development-026", "track": "development", "lessonId": "dev-xctest-ui", "type": "testReasoning", "difficulty": 4, "title": "CIでだけ不安定になるUIテストを読む", "prompt": "手元では常に通る UI テストが、CI ではときどき失敗します。原因の説明として最も妥当なものを選んでください。", "skills": ["testing", "debugging"], "noRunSolution": true, "content": {"requirement": "「追加」ボタンを押したあと、一覧に現れた最初の項目をタップする。", "code": "app.buttons[\"追加\"].tap()\nsleep(1)\napp.cells.firstMatch.tap()", "tests": [{"name": "手元の実機・シミュレータ", "input": "通常の実行", "expected": "全件成功", "result": "成功"}, {"name": "CI のシミュレータ", "input": "負荷の高い環境で実行", "expected": "全件成功", "result": "失敗（ときどき要素が見つからない）"}], "options": [{"id": "o1", "label": "固定時間の sleep で待っているため、描画が遅い環境では要素が現れる前にタップしてしまう"}, {"id": "o2", "label": "tap() を2回呼んでいるため、二重に反応して状態がずれている"}, {"id": "o3", "label": "firstMatch は常に nil を返すため、そもそも要素を取得できていない"}, {"id": "o4", "label": "UI テストは CI 環境では実行できない仕組みになっている"}]}, "solution": {"optionId": "o1"}, "hints": ["手元と CI の違いは、マシンの速度と負荷です。", "1秒という待ち時間は、何を根拠に決められているでしょうか。", "「要素が現れるまで待つ」ことを表現できる API があります。"], "explanation": "失敗したテストが表しているのは「項目が現れてからタップする」という前提条件です。検証している環境は負荷の高い CI で、描画完了までの時間が手元より延びる状況にあたります。実装は `sleep(1)` という固定時間で待っているため、1秒以内に描画が終わる環境では通り、遅れた環境では要素が存在しない状態で tap を呼んで失敗します。ときどき失敗する（flaky）という現れ方は、待ち時間と実際の所要時間が近いことを示しています。修正は `waitForExistence(timeout:)` を使い、「要素が現れるまで最大N秒待つ」という条件で待つことです。これなら速い環境では即座に進み、遅い環境でも取りこぼしません。", "detail": {"concept": "非同期な UI を待つときは「時間」ではなく「状態」を条件にします。時間で待つと、速い環境では無駄に遅く、遅い環境では失敗するという両方の欠点を抱えます。", "steps": ["tap のあと、画面の更新は非同期に行われる。", "sleep(1) は状態と無関係に1秒だけ待つ。", "CI では描画が1秒を超えることがあり、その場合に要素が未出現のままタップされる。", "waitForExistence(timeout:) なら、出現した時点で先へ進む。"], "whyCorrect": "手元と CI の唯一の違いが実行速度であり、待ち方が時間ベースであることがその差を吸収できていません。tap の回数や API の存在自体は問題ではありません。", "commonMistakes": ["sleep の秒数を増やして対処する間違いです。テスト全体が遅くなるうえ、閾値を超えれば同じ失敗が再発します。", "失敗を「CI が不安定だから」と片付ける間違いです。flaky テストは実装かテストのどちらかに、時間依存の前提が残っている徴候です。"], "takeaway": "UI の待機は時間ではなく状態で。sleep は flaky テストの主要因。", "example": {"code": "// XCTest の書き方\n// XCTAssertTrue(app.cells.firstMatch.waitForExistence(timeout: 5))\n// app.cells.firstMatch.tap()\nlet strategies = [\"sleep(1): 時間で待つ（環境依存）\", \"waitForExistence: 状態で待つ（環境非依存）\"]\nfor s in strategies { print(s) }", "output": "sleep(1): 時間で待つ（環境依存）\nwaitForExistence: 状態で待つ（環境非依存）", "explanation": "待ち方の違いが、環境差に耐えられるかどうかを決めます。"}}, "seriesId": "development-uitest", "seriesStep": 1}, {"id": "practice-development-027", "track": "development", "lessonId": "dev-xctest-ui", "type": "repair", "difficulty": 3, "title": "時間で待つUIテストを直す", "prompt": "描画を待つのに固定時間を使っているため、環境によって失敗します。修正として最も適切なものを選んでください。", "skills": ["testing", "debugging"], "noRunSolution": true, "content": {"code": "app.buttons[\"追加\"].tap()\nsleep(1)\napp.cells.firstMatch.tap()", "options": [{"id": "o1", "code": "app.buttons[\"追加\"].tap()\nXCTAssertTrue(app.cells.firstMatch.waitForExistence(timeout: 5))\napp.cells.firstMatch.tap()"}, {"id": "o2", "code": "app.buttons[\"追加\"].tap()\nsleep(5)\napp.cells.firstMatch.tap()"}, {"id": "o3", "code": "app.buttons[\"追加\"].tap()\napp.cells.firstMatch.tap()"}, {"id": "o4", "code": "app.buttons[\"追加\"].tap()\nwhile app.cells.count == 0 { }\napp.cells.firstMatch.tap()"}]}, "solution": {"optionId": "o1", "fixedCode": "app.buttons[\"追加\"].tap()\nXCTAssertTrue(app.cells.firstMatch.waitForExistence(timeout: 5))\napp.cells.firstMatch.tap()"}, "hints": ["待ち時間を延ばしても、閾値を超える環境では同じ失敗が起きます。", "待つべきなのは「時間」ではなく「要素が現れたという状態」です。", "現れなかった場合にテストとして失敗させる形にすると、原因も明確になります。"], "explanation": "問題は `sleep(1)` が状態と無関係に固定時間だけ待っていることです。修正は `waitForExistence(timeout:)` を使い、要素が現れるまで待ち、現れなければタイムアウトさせることです。XCTAssertTrue で包むと、現れなかった場合に「待機に失敗した」という明確な失敗として報告されるため、tap の行で分かりにくいエラーになるのを防げます。sleep を5秒に延ばす修正はテスト全体を遅くするだけで根本解決にならず、待機をなくす修正は速い環境でも失敗しやすくなります。空のループで待つ方法は CPU を占有し続け、UI の更新自体を妨げる可能性があります。", "detail": {"concept": "UI テストの安定性は「待ち方」でほぼ決まります。状態を条件に待ち、待てなかったことを失敗として報告するのが基本形です。", "steps": ["tap 後の描画は非同期に行われる。", "`waitForExistence(timeout: 5)` … 現れたら即座に true、5秒経っても現れなければ false。", "XCTAssertTrue で包み、待機失敗をテスト失敗として明示する。", "現れたあとに tap するので、環境の速度に依存しない。"], "whyCorrect": "出現という状態を条件にしているため、速い環境では待たず、遅い環境では必要なだけ待ちます。失敗時の原因も「待機のタイムアウト」として明確になります。", "commonMistakes": ["sleep の秒数を調整して「安定した」と判断する間違いです。負荷が変われば再発します。", "ビジーループで待つ方法は、CPU を占有してメインスレッドの描画を妨げ、かえって出現を遅らせることがあります。"], "takeaway": "UI テストは状態で待つ。待てなかったことを失敗として報告する。", "example": {"code": "// 修正後の意図\n// 1. 操作する\n// 2. 期待する状態が現れるまで待つ（最大5秒）\n// 3. 現れたら次の操作へ、現れなければ失敗\nlet steps = [\"操作\", \"状態の待機\", \"次の操作\"]\nprint(steps.joined(separator: \" → \"))", "output": "操作 → 状態の待機 → 次の操作", "explanation": "この3段構えを守ると、環境差に強い UI テストになります。"}}, "seriesId": "development-uitest", "seriesStep": 2}, {"id": "practice-development-028", "track": "development", "lessonId": "dev-testing-parameterized", "type": "testReasoning", "difficulty": 4, "title": "全件通ったのに不具合が出た理由を読む", "prompt": "テストは全件成功していますが、リリース後に不具合が報告されました。テスト設計のどこに穴がありますか。", "skills": ["testing", "debugging"], "content": {"requirement": "splitName(_:) は氏名を空白で姓と名に分ける。空白が連続していても2要素に分ける。", "code": "import Foundation\nfunc splitName(_ s: String) -> [String] {\n    s.components(separatedBy: \" \")\n}", "tests": [{"name": "通常の氏名", "input": "\"Yuki Ko\"", "expected": "2要素", "result": "成功"}, {"name": "別の氏名", "input": "\"Taro Yamada\"", "expected": "2要素", "result": "成功"}, {"name": "報告された不具合", "input": "\"Yuki  Ko\"（空白2つ）", "expected": "2要素", "result": "テストが存在しない（実際は3要素になる）"}], "options": [{"id": "o1", "label": "テストの入力がすべて空白1つの正常系で、要件に書かれた「空白が連続する場合」を1件も検証していない"}, {"id": "o2", "label": "components(separatedBy:) は存在しないメソッドなので、そもそもビルドできない"}, {"id": "o3", "label": "テストの件数が2件では少なすぎるため、件数を100件に増やすべきである"}, {"id": "o4", "label": "姓と名の順序が逆になっていることが不具合の原因である"}]}, "solution": {"optionId": "o1"}, "hints": ["要件に明記されている条件のうち、テストで確かめられていないものはどれでしょうか。", "2件のテストはどちらも同じ形の入力です。観点としては1つしかありません。", "件数の問題ではなく、検証している入力の種類の問題です。"], "explanation": "不具合が表しているのは「空白が連続していても2要素に分ける」という要件です。報告された入力は空白が2つ連続した氏名で、区切り文字の扱いが結果に現れる境界にあたります。`components(separatedBy: \" \")` は連続した区切りの間に空文字列を作るため、\"Yuki  Ko\" は [\"Yuki\", \"\", \"Ko\"] の3要素になります。既存の2件のテストはどちらも空白1つの正常系で、観点としては同一のケースを2回確かめているにすぎません。件数を増やしても、同じ形の入力ばかりでは検出できません。修正は `split(separator: \" \", omittingEmptySubsequences: true)` を使うか、空要素を除去することです。", "detail": {"concept": "テストの網羅性は件数ではなく観点の数で決まります。要件に条件が書かれているなら、その条件ごとにテストが必要です。", "steps": ["要件には「空白が連続していても」という条件が明記されている。", "既存のテストはどちらも空白1つの入力。", "連続空白という観点が一度も検証されていない。", "components は空文字列を残すため、その入力で3要素になる。"], "whyCorrect": "2件のテストが同じ観点しか見ていないことが、要件の一部が未検証のまま残った理由です。ビルドは通っており、順序も正しいため、他の選択肢は現象を説明できません。", "commonMistakes": ["テストの件数を増やすことで安心する間違いです。同じ観点を繰り返しても網羅性は上がりません。", "split と components の違いを把握していないと、同じ関数だと思って置き換えて挙動が変わります。split は既定で空の部分を除きます。"], "takeaway": "網羅性は件数ではなく観点の数。要件に書かれた条件ごとにテストする。", "example": {"code": "import Foundation\nlet s = \"Yuki  Ko\"\nprint(s.components(separatedBy: \" \"))\nprint(s.split(separator: \" \").map(String.init))", "output": "[\"Yuki\", \"\", \"Ko\"]\n[\"Yuki\", \"Ko\"]", "explanation": "components は空文字列を残し、split は既定で除きます。この違いが不具合の原因でした。"}}, "seriesId": "development-parameterized", "seriesStep": 3}, {"id": "practice-development-029", "track": "development", "lessonId": "dev-di", "type": "repair", "difficulty": 3, "title": "テストできない依存関係を直す", "prompt": "ProfileLoader が内部で本番用の APIClient を直接生成しているため、テストからネットワークを差し替えられません。修正として最も適切なものを選んでください。", "skills": ["architecture", "testing"], "noRunSolution": true, "content": {"code": "final class ProfileLoader {\n    private let client = APIClient(baseURL: URL(string: \"https://api.example.com\")!)\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}", "options": [{"id": "o1", "code": "protocol ProfileFetching {\n    func get(_ path: String) async throws -> Profile\n}\n\nfinal class ProfileLoader {\n    private let client: ProfileFetching\n\n    init(client: ProfileFetching) {\n        self.client = client\n    }\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}"}, {"id": "o2", "code": "final class ProfileLoader {\n    static let shared = ProfileLoader()\n    private let client = APIClient(baseURL: URL(string: \"https://api.example.com\")!)\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}"}, {"id": "o3", "code": "final class ProfileLoader {\n    private var client = APIClient(baseURL: URL(string: \"https://api.example.com\")!)\n\n    func replaceClientForTesting(_ new: APIClient) {\n        client = new\n    }\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}"}, {"id": "o4", "code": "final class ProfileLoader {\n    private let client = APIClient(baseURL: URL(string: ProcessInfo.processInfo.environment[\"BASE_URL\"] ?? \"https://api.example.com\")!)\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}"}]}, "solution": {"optionId": "o1", "fixedCode": "protocol ProfileFetching {\n    func get(_ path: String) async throws -> Profile\n}\n\nfinal class ProfileLoader {\n    private let client: ProfileFetching\n\n    init(client: ProfileFetching) {\n        self.client = client\n    }\n\n    func load(id: Int) async throws -> Profile {\n        try await client.get(\"/profiles/\\(id)\")\n    }\n}"}, "hints": ["「誰が依存を用意するか」を、使う側から呼び出し側へ移すのが出発点です。", "具体的な型ではなく、必要な機能だけを表す抽象に依存させると差し替えられます。", "テスト用の抜け道を追加するのではなく、生成の責任そのものを外に出します。"], "explanation": "問題は ProfileLoader が `APIClient(baseURL:)` を自分の中で生成していることです。生成をクラス内部に閉じ込めると、外から別の実装に置き換える手段が存在しなくなり、テストのたびに実際のネットワーク通信が発生します。修正は、必要な機能だけを表すプロトコル `ProfileFetching` を定義し、それをイニシャライザで受け取る形（イニシャライザ注入）にすることです。本番では APIClient を、テストでは固定値を返すスタブを渡せます。シングルトン化する案は生成場所を変えていないため問題は残り、むしろグローバル状態が増えます。テスト用の差し替えメソッドを足す案は本番コードにテスト専用の穴を開けるうえ、型が APIClient のままなので結局本物のクラスが必要です。環境変数で URL を変える案は接続先を変えるだけで、通信そのものは実行されます。", "detail": {"concept": "Dependency Injection は「使う側が依存を作らない」という設計です。依存を作る責任を呼び出し側（コンポジションルート）に集めると、同じクラスを本番とテストで別の部品と組み合わせられます。", "steps": ["現状は client の生成が ProfileLoader の内部にあり、外部から観測も置換もできない。", "ProfileLoader が実際に必要としているのは「path を渡すと Profile が返る」ことだけ。", "その最小限をプロトコル ProfileFetching として切り出す。", "init(client:) で受け取ると、本番は APIClient、テストはスタブを渡せる。"], "whyCorrect": "依存が抽象型のプロパティになり、生成が呼び出し側に移ったため、ProfileLoader のコードを一切変えずに実装を差し替えられます。テストではネットワークもタイムアウトも発生しません。", "commonMistakes": ["テスト専用の setter を本番クラスに追加する対応です。本番コードから誤って呼べる穴が残り、実行順によって状態が壊れます。", "シングルトンにすれば共有できると考える間違いです。共有はできても差し替えはできず、テスト間で状態が持ち越されます。", "プロトコルを APIClient の全機能をそのまま写した巨大なものにする間違いです。スタブ側で不要なメソッドまで実装させられます。"], "takeaway": "依存は内部で作らず、抽象として外から受け取る。", "example": {"code": "protocol Greeting { func text() -> String }\nstruct RealGreeting: Greeting { func text() -> String { \"real\" } }\nstruct StubGreeting: Greeting { func text() -> String { \"stub\" } }\nstruct Screen {\n    let source: Greeting\n    func show() -> String { source.text() }\n}\nprint(Screen(source: RealGreeting()).show())\nprint(Screen(source: StubGreeting()).show())", "output": "real\nstub", "explanation": "Screen のコードは1行も変わらないまま、渡す部品だけで振る舞いが切り替わります。これが注入の効果です。"}}, "seriesId": "development-di", "seriesStep": 1}, {"id": "practice-development-030", "track": "development", "lessonId": "dev-di", "type": "matching", "difficulty": 2, "title": "テストダブルの種類を対応づける", "prompt": "テストで本物の代わりに置く部品（テストダブル）の名前と、その役割を対応づけてください。", "skills": ["testing", "architecture"], "content": {"left": [{"id": "l1", "label": "Stub"}, {"id": "l2", "label": "Spy"}, {"id": "l3", "label": "Fake"}, {"id": "l4", "label": "Dummy"}], "right": [{"id": "r1", "label": "決められた値をそのまま返し、テストの入力条件を固定する"}, {"id": "r2", "label": "呼ばれた回数や引数を記録し、あとから検証できるようにする"}, {"id": "r3", "label": "本物より簡略だが実際に動く実装（例：メモリ上の保存）を提供する"}, {"id": "r4", "label": "引数を埋めるためだけに渡され、中身は一度も使われない"}, {"id": "r5", "label": "本番のサーバに接続して実際の応答を取得する"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["「値を返すだけ」なのか「呼ばれ方を覚えている」のかで、まず2つに分かれます。", "実際に動くロジックを持つものが1つだけあります。保存や検索が本当に行われる種類です。", "1つは中身をまったく使われない、型を満たすためだけの存在です。"], "explanation": "Stub は「入力を固定する」ための部品で、決められた値を返すだけです。Spy は「出力を検証する」ための部品で、呼ばれた回数や渡された引数を記録し、テスト側で確認します。Fake は本物と同じ役割を果たす簡略実装で、例えばディスクではなくメモリ上に保存する Repository が該当します。Dummy は引数の型を満たすためだけに渡され、中身が呼ばれることはありません。残る選択肢の「本番のサーバに接続する」はテストダブルではなく本物そのもので、テストが外部環境に依存してしまうため、これを使うと単体テストではなくなります。使い分けの基準は「何を確かめたいか」で、戻り値の扱いを確かめたいなら Stub、副作用が起きたことを確かめたいなら Spy です。", "detail": {"concept": "テストダブルは本物の代役の総称です。名前が分かれているのは、それぞれ「テストの何を制御・観測したいか」が違うためで、目的に合わないものを選ぶとテストが壊れやすくなります。", "steps": ["テストは「入力を固定し、出力を確認する」構造を持つ。", "入力側を固定したい → 決められた値を返す Stub。", "出力側（副作用）を確認したい → 呼ばれ方を記録する Spy。", "処理そのものが必要だが本物は重い → 簡略実装の Fake。", "型を満たすだけで使わない → Dummy。"], "whyCorrect": "4つの役割は「値を返す／記録する／動く／使わない」で互いに重ならないため、それぞれの説明文と1対1で対応します。本番サーバへの接続だけはどの役割にも当てはまりません。", "commonMistakes": ["Stub と Spy を同じものとして扱う間違いです。検証したい対象が入力側か副作用側かで、必要な部品が変わります。", "何でも Fake で用意しようとする間違いです。Fake は自前のロジックを持つぶんバグを含み得るので、Fake 自体のテストが必要になります。", "Dummy に本物のインスタンスを渡す間違いです。使われないつもりでも実際には初期化コストや副作用が走ることがあります。"], "takeaway": "入力を固定するなら Stub、呼ばれ方を確かめるなら Spy。", "example": {"code": "protocol Notifier { func send(_ text: String) }\nfinal class SpyNotifier: Notifier {\n    private(set) var sent: [String] = []\n    func send(_ text: String) { sent.append(text) }\n}\nlet spy = SpyNotifier()\nspy.send(\"done\")\nprint(spy.sent.count, spy.sent.first ?? \"-\")", "output": "1 done", "explanation": "Spy は呼ばれた事実と引数を残すので、戻り値を持たない処理でも「起きたこと」を検証できます。"}}, "seriesId": "development-di", "seriesStep": 2}, {"id": "practice-development-031", "track": "development", "lessonId": "dev-network-architecture", "type": "reorder", "difficulty": 3, "title": "APIクライアントの1回分の処理を並べ替える", "prompt": "1件のリクエストを送って、DTOにデコードして返すメソッドです。ブロックを正しい順に並べ替えてください。", "skills": ["architecture", "foundation", "concurrency"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "    let (data, response) = try await session.data(for: request)"}, {"id": "b2", "code": "func fetch<T: Decodable>(_ path: String) async throws -> T {"}, {"id": "b3", "code": "    return try decoder.decode(T.self, from: data)"}, {"id": "b4", "code": "    guard let http = response as? HTTPURLResponse, 200..<300 ~= http.statusCode else {"}, {"id": "b5", "code": "    var request = URLRequest(url: baseURL.appendingPathComponent(path))"}, {"id": "b6", "code": "        throw APIError.badStatus(response)"}, {"id": "b7", "code": "    }"}, {"id": "b8", "code": "    request.httpMethod = \"GET\""}, {"id": "b9", "code": "}"}]}, "solution": {"order": ["b2", "b5", "b8", "b1", "b4", "b6", "b7", "b3", "b9"]}, "hints": ["リクエストは「組み立てる → 送る → 応答を検査する → 中身を解釈する」の順で扱います。", "デコードは、ステータスコードの検査を通過したあとでなければ意味がありません。", "guard の本体（throw）と閉じかっこは、guard 行の直後にひとまとまりで置きます。"], "explanation": "正しい順は「関数宣言 → URLRequest を組み立てる → HTTPメソッドを設定する → 送信して応答を受け取る → ステータスコードを検査する → 不正なら throw → guard を閉じる → デコードして返す → 関数を閉じる」です。この順序には理由があります。まず `request.httpMethod` は URLRequest が存在してからでないと設定できません。次に、ステータス検査をデコードより前に置くのが重要で、サーバがエラーを返したときの本文はエラーメッセージのJSONであることが多く、先にデコードしようとすると「デコード失敗」という実際の原因とは違うエラーが表面化します。ステータスを先に見れば `APIError.badStatus` として正確に伝わります。guard は条件を満たさない場合に脱出する構文なので、throw と閉じかっこは guard 行の直後にひとまとまりで置きます。", "detail": {"concept": "ネットワーク層は「組み立て・送信・検査・変換」という4段階に分けて考えると、どこで失敗したかを区別できるエラーが返せるようになります。", "steps": ["`URLRequest(url:)` … 送り先を決めて、リクエストの入れ物を作る。", "`request.httpMethod = \"GET\"` … 入れ物に対して設定を加える（順序上、生成のあと）。", "`try await session.data(for:)` … 送信し、本文と応答メタ情報を受け取る。", "`guard ... 200..<300 ~= http.statusCode` … 通信は成功しても、サーバがエラーを返している場合を弾く。", "`decoder.decode(T.self, from: data)` … 正常応答であることが分かってから、本文を型に変換する。"], "whyCorrect": "各段階が、前段階の結果を必要とする順に並んでいます。特にステータス検査がデコードより前にあるため、サーバエラーが「デコード失敗」に化けず、呼び出し側が原因を正しく判別できます。", "commonMistakes": ["デコードを先に書いてしまう間違いです。500応答のエラーJSONを T にデコードしようとして失敗し、根本原因が分からなくなります。", "`response as? HTTPURLResponse` の判定を省く間違いです。statusCode は HTTPURLResponse にしかないため、キャストなしでは検査できません。", "エラーを throw せずに空の値を返す間違いです。呼び出し側が「データがない」のか「失敗した」のか区別できなくなります。"], "takeaway": "検査してからデコードする。順序を逆にすると原因が別のエラーに化ける。", "example": {"code": "let codes = [200, 204, 404, 500]\nfor code in codes {\n    let ok = 200..<300 ~= code\n    print(code, ok ? \"decode へ進む\" : \"badStatus を throw\")\n}", "output": "200 decode へ進む\n204 decode へ進む\n404 badStatus を throw\n500 badStatus を throw", "explanation": "検査を先に置くと、デコードに到達するのは正常応答だけになります。"}}, "seriesId": "development-network", "seriesStep": 1}, {"id": "practice-development-032", "track": "development", "lessonId": "dev-network-architecture", "type": "chooseBlocks", "difficulty": 3, "title": "Repository が返すべきものを選ぶ", "prompt": "Repository は APIClient から受け取った DTO を、画面が使うドメインモデルに変換して返します。この関数に必要なブロックだけを、正しい順に選んでください。不要なブロックが混ざっています。", "skills": ["architecture", "foundation"], "noRunSolution": true, "content": {"requireOrder": true, "blocks": [{"id": "b1", "code": "func loadUser(id: Int) async throws -> User {"}, {"id": "b2", "code": "    let dto: UserDTO = try await client.fetch(\"/users/\\(id)\")"}, {"id": "b3", "code": "    return User(id: dto.id, name: dto.name, joinedAt: dto.joined_at)"}, {"id": "b4", "code": "}"}, {"id": "b5", "code": "    return dto"}, {"id": "b6", "code": "func loadUser(id: Int) async throws -> UserDTO {"}, {"id": "b7", "code": "    print(\"response: \\(dto)\")"}]}, "solution": {"order": ["b1", "b2", "b3", "b4"], "selected": ["b1", "b2", "b3", "b4"]}, "hints": ["戻り値の型が、この層の役割を決めています。画面側が知るべき型はどちらでしょうか。", "DTO は通信の都合（キー名や日付の形式）を持ち込む型で、画面に渡すには向きません。", "受け取った値をそのまま返すブロックと、変換して返すブロックのどちらか一方だけが必要です。"], "explanation": "必要なのは「User を返す宣言」「DTOを取得する」「User に変換して返す」「閉じかっこ」の4ブロックです。Repository の役割は、通信層の表現（DTO）とアプリ内部の表現（ドメインモデル）の境界になることです。DTO はサーバのJSONに合わせた型で、`joined_at` のようなスネークケースのキー名やAPI側の都合がそのまま現れます。これを画面まで持ち回ると、サーバのキー名が変わっただけで画面のコードまで修正が必要になります。`UserDTO` を返す宣言と `return dto` はこの境界を壊すため不要です。`print(\"response: ...\")` はデバッグの名残で、本番コードに残すと応答内容がコンソールに出続け、個人情報がログに漏れる危険があります。", "detail": {"concept": "DTO（Data Transfer Object）は外部との受け渡し専用の型、ドメインモデルはアプリが扱いたい概念を表す型です。Repository はこの2つを変換する場所で、変換を行う層が1つに決まっていることが重要です。", "steps": ["戻り値を User にすると、呼び出し側は DTO の存在を知らずに済む。", "`client.fetch` で DTO を受け取る（ここまでが通信の都合）。", "`User(id:name:joinedAt:)` に詰め替える（ここから先はアプリの都合）。", "変換が1箇所に集まるため、APIのキー名変更の影響がこの関数の中で止まる。"], "whyCorrect": "DTO が Repository の外へ出ないため、通信仕様の変更が画面に波及しません。呼び出し側は User だけを知ればよく、テストでも User を作って渡せます。", "commonMistakes": ["DTO をそのまま画面まで渡す間違いです。サーバのキー名変更が画面のコード修正に直結します。", "変換を画面側で毎回書く間違いです。同じ変換が複数箇所に散らばり、片方だけ直し忘れます。", "デバッグ用の print を残す間違いです。応答本文には氏名やメールが含まれることがあり、ログに残り続けます。"], "takeaway": "DTO は Repository の外に出さない。変換は1箇所に集める。", "example": {"code": "struct UserDTO { let id: Int; let name: String; let joined_at: String }\nstruct User { let id: Int; let name: String; let joinedAt: String }\nlet dto = UserDTO(id: 1, name: \"Yuki\", joined_at: \"2026-01-01\")\nlet user = User(id: dto.id, name: dto.name, joinedAt: dto.joined_at)\nprint(user.joinedAt)", "output": "2026-01-01", "explanation": "詰め替えを1回行うだけで、スネークケースというAPI側の都合がここから先に出ていかなくなります。"}}, "seriesId": "development-network", "seriesStep": 2}, {"id": "practice-development-033", "track": "development", "lessonId": "dev-persistence-choice", "type": "matching", "difficulty": 2, "title": "保存先の選び方を対応づける", "prompt": "保存したいデータと、iOSで使うべき保存先を対応づけてください。", "skills": ["foundation", "architecture"], "content": {"left": [{"id": "l1", "label": "ログイン用のアクセストークン"}, {"id": "l2", "label": "「ダークモードを使う」というユーザー設定"}, {"id": "l3", "label": "検索と絞り込みを行う大量のトレーニング記録"}, {"id": "l4", "label": "ユーザーが選んだプロフィール画像の原本"}], "right": [{"id": "r1", "label": "Keychain"}, {"id": "r2", "label": "UserDefaults"}, {"id": "r3", "label": "SwiftData（永続ストア）"}, {"id": "r4", "label": "ファイル（Documents ディレクトリ）"}, {"id": "r5", "label": "ソースコード内の定数"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["秘密として扱うべきものは1つだけです。暗号化された保管場所が必要になります。", "小さな設定値と、検索が必要な大量データは、同じ場所に置くべきではありません。", "画像のようなバイナリは、キーと値の保存には向きません。"], "explanation": "アクセストークンは秘密情報なので Keychain に保存します。Keychain は暗号化されたうえ、端末のロック状態に応じたアクセス制御も指定できます。ダークモード設定のような小さな設定値は UserDefaults が適切で、plist として保存されるため大量データや秘密情報には向きません。検索・絞り込みを行う大量の記録は SwiftData のような永続ストアを使い、Predicate で必要な分だけ取り出します。全件をメモリに読み込んで filter するとデータ量に比例して遅くなります。画像の原本はファイルとして Documents に置き、参照するパスやIDだけをデータベース側に持たせます。ソースコード内の定数はビルド成果物から容易に取り出せるため、どのケースでも保存先にはなりません。", "detail": {"concept": "保存先の選択は「秘密かどうか」「量と検索の必要性」「形（小さな値かバイナリか）」の3点で決まります。iOSはこの3点に対応する仕組みを別々に用意しています。", "steps": ["秘密か？ → はいなら Keychain（暗号化・アクセス制御あり）。", "小さな設定値か？ → はいなら UserDefaults（起動時に読み込まれる plist）。", "検索・関連づけが必要な構造化データか？ → はいなら SwiftData。", "画像・動画などのバイナリか？ → はいならファイル。DBにはパスだけを持たせる。"], "whyCorrect": "4つの用途が上の判断軸で互いに重ならないため、それぞれ1つの保存先に決まります。秘密・設定・構造化データ・バイナリという分類が、そのまま仕組みの分かれ方に対応しています。", "commonMistakes": ["トークンを UserDefaults に保存する間違いです。plist は暗号化されておらず、バックアップ経由でも読み出せます。", "画像そのものを UserDefaults や DB のカラムに入れる間違いです。起動時の読み込みが重くなり、メモリを圧迫します。", "大量データを1つのJSONファイルにまとめて保存する間違いです。1件更新するたびに全件の書き込みが発生します。"], "takeaway": "秘密は Keychain、設定は UserDefaults、構造化データは DB、バイナリはファイル。", "example": {"code": "let choices = [\n    (\"token\", \"Keychain\"),\n    (\"isDarkMode\", \"UserDefaults\"),\n    (\"workoutLogs\", \"SwiftData\"),\n    (\"avatar.png\", \"File\")\n]\nfor (data, store) in choices { print(\"\\(data) -> \\(store)\") }", "output": "token -> Keychain\nisDarkMode -> UserDefaults\nworkoutLogs -> SwiftData\navatar.png -> File", "explanation": "保存先の判断は、データの性質を先に言葉にすれば機械的に決まります。"}}, "seriesId": "development-persistence", "seriesStep": 1}, {"id": "practice-development-034", "track": "development", "lessonId": "dev-persistence-choice", "type": "bugHunt", "difficulty": 2, "title": "保存処理の中の危険な1行を見つける", "prompt": "ログイン成功後の保存処理です。セキュリティ上、問題のある行を1つ選んでください。", "skills": ["foundation", "architecture", "debugging"], "noRunSolution": true, "content": {"lines": [{"id": "l1", "code": "let session = try await auth.login(email: email, password: password)"}, {"id": "l2", "code": "UserDefaults.standard.set(session.accessToken, forKey: \"accessToken\")"}, {"id": "l3", "code": "UserDefaults.standard.set(session.user.displayName, forKey: \"displayName\")"}, {"id": "l4", "code": "UserDefaults.standard.set(true, forKey: \"isLoggedIn\")"}]}, "solution": {"optionId": "l2", "fixedCode": "let session = try await auth.login(email: email, password: password)\ntry keychain.set(session.accessToken, forKey: \"accessToken\")\nUserDefaults.standard.set(session.user.displayName, forKey: \"displayName\")\nUserDefaults.standard.set(true, forKey: \"isLoggedIn\")"}, "hints": ["4行のうち、盗まれた場合に他人がアカウントを操作できてしまう値は1つだけです。", "UserDefaults がどこにどんな形で保存されるかを思い出してください。暗号化はされません。", "表示名やログイン状態のフラグは、漏れても直接の悪用にはつながりません。"], "explanation": "問題は2行目で、アクセストークンを UserDefaults に保存していることです。UserDefaults の中身はアプリのコンテナ内に平文の plist として書き出されます。暗号化されないため、端末のバックアップやファイルシステムへアクセスできる状況では、そのまま読み取れます。アクセストークンは「その人として API を呼べる鍵」なので、盗まれた時点でアカウントを操作されます。修正は Keychain に保存することで、Keychain は暗号化されたうえ `kSecAttrAccessible` で端末ロック中の読み出しを禁止するなどの制御もできます。3行目の表示名と4行目のログイン状態フラグは、漏れても直接の悪用につながらない情報であり、起動時に即座に読みたい小さな値なので UserDefaults のままで問題ありません。1行目はログイン処理そのもので、保存は行っていません。", "detail": {"concept": "「暗号化されているか」と「アクセス制御があるか」は別の性質です。UserDefaults はどちらも持たない代わりに軽量で、Keychain は両方を持つ代わりに読み書きに失敗し得る API です。", "steps": ["UserDefaults の実体はアプリコンテナ内の plist ファイル。", "plist は平文なので、ファイルを取り出せれば内容は読める。", "アクセストークンは認証を通過した証明そのもので、パスワードと同等に扱う必要がある。", "Keychain へ移すと、暗号化とアクセス制御の両方がかかる。"], "whyCorrect": "漏洩したときの被害の大きさで比べると、トークンだけが「他人になりすませる」という質の違う被害を生みます。他の3行は表示や分岐に使う情報にすぎません。", "commonMistakes": ["トークンを Base64 でエンコードして UserDefaults に入れる対応です。符号化は暗号化ではないため、簡単に元に戻せます。", "「シミュレータでは見えないから大丈夫」と判断する間違いです。実機のバックアップからも取り出され得ます。", "Keychain の書き込みエラーを無視する間違いです。保存に失敗しても気づかず、次回起動でログアウト状態になります。"], "takeaway": "トークンやパスワードは UserDefaults に置かない。Keychain を使う。", "example": {"code": "let stored: [String: String] = [\"displayName\": \"Yuki\", \"isLoggedIn\": \"true\"]\nfor (key, value) in stored.sorted(by: { $0.key < $1.key }) {\n    print(\"\\(key)=\\(value) （平文で読めても被害は限定的）\")\n}", "output": "displayName=Yuki （平文で読めても被害は限定的）\nisLoggedIn=true （平文で読めても被害は限定的）", "explanation": "UserDefaults に残してよいのは、このように読まれても悪用できない情報だけです。"}}, "seriesId": "development-persistence", "seriesStep": 2}, {"id": "practice-development-035", "track": "development", "lessonId": "dev-swiftdata-basics", "type": "fillBlank", "difficulty": 2, "title": "SwiftDataのモデル定義を完成させる", "prompt": "SwiftData で保存するモデルの定義です。空欄を埋めてください。", "skills": ["foundation", "types"], "content": {"template": "import SwiftData\n\n{{a}}\nfinal class Workout {\n    var name: String\n    var minutes: Int\n    {{b}}\n    var id: UUID\n\n    init(name: String, minutes: Int, id: UUID = UUID()) {\n        self.name = name\n        self.minutes = minutes\n        self.id = id\n    }\n}", "blanks": [{"id": "a", "options": ["@Model", "@Observable", "@Query", "@Entity"]}, {"id": "b", "options": ["@Attribute(.unique)", "@Transient", "@Relationship", "@Published"]}]}, "solution": {"answers": {"a": "@Model", "b": "@Attribute(.unique)"}}, "hints": ["クラスに付けるほうの属性は、この型を永続化の対象として登録する役割を持ちます。", "id は同じ値が2件存在してはいけないプロパティです。その制約を宣言する属性を選びます。", "画面の状態監視やデータ取得のための属性は、モデル定義そのものには使いません。"], "explanation": "クラスには `@Model` を付けます。これは SwiftData に「この型を永続化の対象として扱う」と伝えるマクロで、付けるとスキーマが生成され、プロパティの変更が自動で追跡されるようになります。id には `@Attribute(.unique)` を付けます。これは「このプロパティの値はストア内で一意でなければならない」という制約で、同じ id の Workout を2件保存しようとすると、あとから保存したものが既存のレコードと統合されます（upsert）。`@Observable` は SwiftData ではなく Observation の機能で、`@Model` を付けた時点で監視は有効になるため不要です。`@Query` はモデル定義ではなく View 側でデータを取り出すときに使います。`@Transient` は逆に「保存しない」という指定なので、一意にしたい id には不適切です。", "detail": {"concept": "SwiftData のモデルは「クラスに @Model を付けるだけで永続化対象になる」設計です。プロパティごとの細かい制約は @Attribute や @Relationship で、必要なものにだけ追加します。", "steps": ["`@Model` … クラスをスキーマに登録し、変更追跡と保存の仕組みを組み込む。", "通常のプロパティ（name, minutes）は指定なしでそのまま保存される。", "`@Attribute(.unique)` … このプロパティの値がストア内で重複しないことを保証する。", "重複する id を保存すると、新規追加ではなく既存レコードの更新として扱われる。"], "whyCorrect": "@Model がなければ ModelContainer に登録できず保存自体が成立しません。@Attribute(.unique) を id に付けることで、同期や再取得のたびに同じレコードが増殖するのを防げます。", "commonMistakes": ["@Model と @Observable を両方付ける間違いです。@Model が監視も担うため、重複した指定になります。", "struct に @Model を付けようとする間違いです。SwiftData のモデルは参照型である必要があり、class にしか付けられません。", "一意制約を付けずに同期処理を書く間違いです。再取得のたびに同じデータが重複して増えていきます。"], "takeaway": "@Model はクラスに、一意制約は @Attribute(.unique) で。", "example": {"code": "struct Workout { let id: String; let name: String }\nlet incoming = [Workout(id: \"a\", name: \"Run\"), Workout(id: \"a\", name: \"Run（再取得）\")]\nvar store: [String: Workout] = [:]\nfor w in incoming { store[w.id] = w }\nprint(store.count, store[\"a\"]!.name)", "output": "1 Run（再取得）", "explanation": "一意制約があると、同じidの2件目は追加ではなく更新になります。この辞書の挙動と同じ考え方です。"}}, "seriesId": "development-swiftdata", "seriesStep": 1}, {"id": "practice-development-036", "track": "development", "lessonId": "dev-swiftdata-basics", "type": "reorder", "difficulty": 2, "title": "SwiftDataに1件保存する手順を並べ替える", "prompt": "新しい Workout を1件保存します。ブロックを正しい順に並べ替えてください。", "skills": ["foundation"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "    try context.save()"}, {"id": "b2", "code": "func add(name: String, minutes: Int) throws {"}, {"id": "b3", "code": "    context.insert(workout)"}, {"id": "b4", "code": "    let workout = Workout(name: name, minutes: minutes)"}, {"id": "b5", "code": "}"}]}, "solution": {"order": ["b2", "b4", "b3", "b1", "b5"]}, "hints": ["挿入する対象がなければ挿入できません。まず何を作る必要がありますか。", "insert はコンテキストに登録するだけで、まだディスクには書かれていません。", "ディスクへの書き出しを行う呼び出しは、登録のあとに1回だけ置きます。"], "explanation": "正しい順は「関数宣言 → インスタンスを作る → context.insert で登録する → context.save でディスクへ書き出す → 関数を閉じる」です。`insert` と `save` の役割の違いが要点です。`insert(_:)` は ModelContext というメモリ上の作業領域にオブジェクトを登録するだけで、この時点ではまだ永続ストアには書かれていません。`save()` を呼んで初めて、コンテキストに溜まっている変更がまとめてディスクに書き出されます。この2段構えのおかげで、複数の変更を1回の書き込みにまとめられ、途中で問題が起きたときは save を呼ばずに破棄することもできます。save は throws なので、呼び出し元へエラーを伝えられるよう関数側にも throws を付けています。", "detail": {"concept": "ModelContext は「下書き」の役割を持つ作業領域です。insert / delete / プロパティ変更はすべて下書きに溜まり、save で確定します。", "steps": ["`Workout(name:minutes:)` … 保存したいオブジェクトを作る。この時点ではただのインスタンス。", "`context.insert(workout)` … コンテキストの管理下に置く。以後、変更が追跡される。", "`try context.save()` … 溜まっている変更を永続ストアへ書き出す。", "save が失敗した場合は throws で呼び出し元へ伝わる。"], "whyCorrect": "insert の対象は先に生成されている必要があり、save は書き出す対象が登録されたあとでなければ意味を持ちません。依存関係がそのまま実行順になっています。", "commonMistakes": ["insert だけ呼んで save を忘れる間違いです。画面上は追加されたように見えても、アプリを再起動すると消えます。", "1件ごとに save を呼ぶ間違いです。100件追加すると100回の書き込みが発生し、目に見えて遅くなります。", "`try?` で save のエラーを握りつぶす間違いです。ディスク容量不足などの失敗に気づけません。"], "takeaway": "insert は下書き、save で確定。まとめて save すると速い。", "example": {"code": "var draft: [String] = []\nvar disk: [String] = []\ndraft.append(\"Run\")\ndraft.append(\"Swim\")\nprint(\"save前 disk:\", disk)\ndisk.append(contentsOf: draft)\nprint(\"save後 disk:\", disk)", "output": "save前 disk: []\nsave後 disk: [\"Run\", \"Swim\"]", "explanation": "insert が draft への追加、save が disk への反映にあたります。save まで到達しなければ何も残りません。"}}, "seriesId": "development-swiftdata", "seriesStep": 2}, {"id": "practice-development-037", "track": "development", "lessonId": "dev-swiftdata-query", "type": "fillBlank", "difficulty": 3, "title": "条件つきの取得クエリを完成させる", "prompt": "30分以上のワークアウトを、新しい順に取り出す @Query です。空欄を埋めてください。", "skills": ["foundation", "collections"], "content": {"template": "@Query(\n    filter: {{a}} { $0.minutes >= 30 },\n    sort: \\Workout.date,\n    order: {{b}}\n)\nprivate var workouts: [Workout]", "blanks": [{"id": "a", "options": ["#Predicate<Workout>", "NSPredicate", "{ (w: Workout) in }", "Filter<Workout>"]}, {"id": "b", "options": [".reverse", ".forward", ".descending", ".ascending"]}]}, "solution": {"answers": {"a": "#Predicate<Workout>", "b": ".reverse"}}, "hints": ["SwiftData の絞り込み条件はマクロで書きます。文字列ベースの古い仕組みではありません。", "「新しい順」とは、日付が大きいものから並べるということです。", "SortOrder が持つケースの名前は、昇順・降順という言葉そのものではありません。"], "explanation": "絞り込みには `#Predicate<Workout>` を使います。これはコンパイル時にクロージャを解析して、ストア側で実行できる条件式に変換するマクロです。文字列でキーパスを書く NSPredicate と違い、プロパティ名の打ち間違いがコンパイルエラーになります。並び順は `order: .reverse` です。SortOrder の2つのケースは `.forward`（小さい順）と `.reverse`（大きい順）で、日付を新しい順に並べたい場合は値が大きいほうを先にするため `.reverse` を選びます。`.ascending` / `.descending` は SortOrder には存在しない名前です。この形で書くと絞り込みと並び替えがストア側で行われるため、全件をメモリに読み込んでから filter / sorted する場合と違い、件数が増えても性能が落ちにくくなります。", "detail": {"concept": "@Query は「どう取り出すか」を宣言する仕組みです。filter と sort をクエリとして渡すと、その処理は永続ストア側で実行され、必要な分だけがメモリに載ります。", "steps": ["`#Predicate<Workout> { $0.minutes >= 30 }` … 条件をマクロで記述し、ストアが解釈できる形に変換する。", "`sort: \\Workout.date` … キーパスで並び替えの基準を指定する。", "`order: .reverse` … 大きい値が先。日付なら新しい順になる。", "結果は View のプロパティに入り、データが変わると自動で再描画される。"], "whyCorrect": "条件と並び順がクエリとして渡されるため、ストア側で絞り込みと並び替えが完了した結果だけを受け取れます。プロパティ名はキーパスとして検査されるので、タイプミスは実行時ではなくコンパイル時に見つかります。", "commonMistakes": ["全件を @Query で取得してから `workouts.filter { ... }` する間違いです。件数が増えるほど読み込みとメモリ使用量が増えます。", "`.forward` を選んで古い順になる間違いです。日付の並び順は、値の大小と表示上の「新しい/古い」を対応づけて考えます。", "#Predicate の中で自作の関数を呼ぶ間違いです。ストア側で解釈できない式はコンパイルエラーになります。"], "takeaway": "絞り込みと並び替えはクエリに渡す。取り出してから filter しない。", "example": {"code": "struct W { let name: String; let minutes: Int; let day: Int }\nlet all = [W(name: \"A\", minutes: 20, day: 1), W(name: \"B\", minutes: 45, day: 3), W(name: \"C\", minutes: 30, day: 2)]\nlet result = all.filter { $0.minutes >= 30 }.sorted { $0.day > $1.day }\nprint(result.map(\\.name))", "output": "[\"B\", \"C\"]", "explanation": "同じ結果をメモリ上で書くとこうなります。@Query はこれをストア側で実行するため、全件を読み込まずに済みます。"}}, "seriesId": "development-swiftdata", "seriesStep": 3}, {"id": "practice-development-038", "track": "development", "lessonId": "dev-swiftdata-query", "type": "repair", "difficulty": 3, "title": "全件取得してから絞り込むコードを直す", "prompt": "1件のワークアウトを id で取り出す関数です。データが増えると急激に遅くなります。修正として最も適切なものを選んでください。", "skills": ["foundation", "debugging", "collections"], "noRunSolution": true, "content": {"code": "func workout(id: UUID) throws -> Workout? {\n    let all = try context.fetch(FetchDescriptor<Workout>())\n    return all.first { $0.id == id }\n}", "options": [{"id": "o1", "code": "func workout(id: UUID) throws -> Workout? {\n    var descriptor = FetchDescriptor<Workout>(\n        predicate: #Predicate { $0.id == id }\n    )\n    descriptor.fetchLimit = 1\n    return try context.fetch(descriptor).first\n}"}, {"id": "o2", "code": "func workout(id: UUID) throws -> Workout? {\n    let all = try context.fetch(FetchDescriptor<Workout>())\n    return all.filter { $0.id == id }.first\n}"}, {"id": "o3", "code": "func workout(id: UUID) throws -> Workout? {\n    var descriptor = FetchDescriptor<Workout>()\n    descriptor.fetchLimit = 1\n    return try context.fetch(descriptor).first { $0.id == id }\n}"}, {"id": "o4", "code": "func workout(id: UUID) throws -> Workout? {\n    let all = try context.fetch(FetchDescriptor<Workout>())\n    return all.sorted { $0.id.uuidString < $1.id.uuidString }.first { $0.id == id }\n}"}]}, "solution": {"optionId": "o1", "fixedCode": "func workout(id: UUID) throws -> Workout? {\n    var descriptor = FetchDescriptor<Workout>(\n        predicate: #Predicate { $0.id == id }\n    )\n    descriptor.fetchLimit = 1\n    return try context.fetch(descriptor).first\n}"}, "hints": ["遅さの原因は探し方ではなく、探す前に何件メモリへ読み込んでいるかです。", "条件をストア側へ渡す手段が FetchDescriptor にあります。", "1件しか必要ないことも、取得の時点で伝えられます。"], "explanation": "問題は `FetchDescriptor<Workout>()` を条件なしで実行し、全件をメモリに読み込んでから Swift 側で探していることです。1万件あれば1万件分のオブジェクトが生成されるため、実行時間もメモリ使用量も件数に比例して増えます。修正は `predicate: #Predicate { $0.id == id }` を FetchDescriptor に渡し、絞り込みをストア側で行わせることです。さらに `fetchLimit = 1` を指定すると、条件に合う最初の1件が見つかった時点で取得が終わります。`filter` に変える案（o2）は探し方を変えただけで、全件読み込みはそのまま残ります。`fetchLimit = 1` だけを付ける案（o3）は、条件なしで取れた「先頭の1件」に対して id を照合するため、目的のレコードがそれ以外だと必ず nil を返す明確なバグになります。`sorted` を挟む案（o4）は全件読み込みに加えて並び替えのコストまで増やしており、いちばん遅くなります。", "detail": {"concept": "永続ストアへの問い合わせは「どこで絞り込むか」で性能が決まります。ストア側で絞り込めばインデックスを使えますが、読み込んだあとに絞り込むと全件の生成コストが必ず発生します。", "steps": ["現状は fetch が全件を返し、その全件が Workout オブジェクトとして生成される。", "`predicate:` を渡すと、条件がストア側の問い合わせに変換される。", "`fetchLimit = 1` … 該当が見つかった時点で打ち切る。", "結果として、メモリに載るのは最大1件になる。"], "whyCorrect": "絞り込みが読み込みより前に移動したため、件数が増えても取得コストがほぼ変わりません。取り出す件数の上限も明示されているので、意図しない大量取得も起きません。", "commonMistakes": ["fetchLimit だけを設定して predicate を省く間違いです。条件と無関係な先頭1件を取ってくるため、結果が誤ります。", "first を filter に置き換えて「効率化した」と考える間違いです。どちらもメモリ上の探索で、支配的なコストである全件読み込みは減りません。", "開発中は数十件しかなく速いため問題に気づかない間違いです。性能の問題は本番のデータ量で初めて現れます。"], "takeaway": "絞り込みは fetch の前に渡す。取ってから絞ると件数分のコストが必ずかかる。", "example": {"code": "let total = 10000\nlet fetchedAll = total\nlet fetchedWithPredicate = 1\nprint(\"全件読み込み:\", fetchedAll, \"件を生成\")\nprint(\"predicate + limit:\", fetchedWithPredicate, \"件を生成\")", "output": "全件読み込み: 10000 件を生成\npredicate + limit: 1 件を生成", "explanation": "同じ結果を得るのに生成されるオブジェクト数が1万倍違います。これが体感速度の差になります。"}}, "seriesId": "development-swiftdata", "seriesStep": 4}, {"id": "practice-development-039", "track": "development", "lessonId": "dev-swiftdata-migration", "type": "chooseBlocks", "difficulty": 4, "title": "スキーマ移行に必要な要素を選ぶ", "prompt": "Workout に必須プロパティ `category` を追加したため、既存データを壊さない移行が必要です。移行の定義に必要なブロックだけを、正しい順に選んでください。不要なブロックが混ざっています。", "skills": ["foundation", "architecture"], "noRunSolution": true, "content": {"requireOrder": true, "blocks": [{"id": "b1", "code": "enum WorkoutMigrationPlan: SchemaMigrationPlan {"}, {"id": "b2", "code": "    static var schemas: [any VersionedSchema.Type] { [SchemaV1.self, SchemaV2.self] }"}, {"id": "b3", "code": "    static var stages: [MigrationStage] { [migrateV1toV2] }"}, {"id": "b4", "code": "    static let migrateV1toV2 = MigrationStage.custom(\n        fromVersion: SchemaV1.self,\n        toVersion: SchemaV2.self,\n        willMigrate: nil,\n        didMigrate: { context in\n            for workout in try context.fetch(FetchDescriptor<SchemaV2.Workout>()) {\n                if workout.category.isEmpty { workout.category = \"other\" }\n            }\n            try context.save()\n        }\n    )"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "    static func deleteAllExistingData() { try? FileManager.default.removeItem(at: storeURL) }"}, {"id": "b7", "code": "    static var stages: [MigrationStage] { [] }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5"], "selected": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["移行計画は「どのバージョンが存在するか」と「どう移るか」の2つを宣言します。", "既定値を持たない必須プロパティの追加は、自動的には移行できません。", "既存データを消す解決策は、ユーザーのデータを失うため移行とは呼べません。"], "explanation": "必要なのは、SchemaMigrationPlan の宣言、`schemas`（存在するバージョンの一覧）、`stages`（適用する移行段階）、移行段階の実体である `migrateV1toV2`、そして閉じかっこの5ブロックです。`schemas` はどのバージョンが存在するかを古い順に並べ、SwiftData はこの一覧を使って現在のストアがどのバージョンかを判定します。`stages` は実際に適用する移行を並べます。今回は既定値を持たない必須プロパティの追加なので、SwiftData が自動で埋める値を決められません。そのため `MigrationStage.custom` を使い、`didMigrate` で既存レコードの `category` に \"other\" を入れています。空の `stages` を返すブロックは移行を何も行わないため、既存ストアを開いた時点で失敗します。既存データを削除するブロックは、確かにエラーは出なくなりますが、ユーザーの記録をすべて失うため解決策になりません。", "detail": {"concept": "スキーマ移行は「バージョンを定義する」ことと「バージョン間の橋を架ける」ことの2段階です。橋が自動で架けられるかどうかは、変更が既存データから一意に導けるかで決まります。", "steps": ["`schemas` … V1, V2 を古い順に列挙し、SwiftData に選択肢を教える。", "`stages` … 適用する移行段階を並べる。ここが空だと橋が存在しない。", "`MigrationStage.custom` … 自動では決められない値を、コードで埋める。", "`didMigrate` … 新スキーマ適用後に呼ばれ、既存レコードに既定値を設定する。", "`try context.save()` … 埋めた値をストアへ確定させる。"], "whyCorrect": "バージョンの一覧と、その間を埋める処理が両方そろっているため、既存データを保持したまま新しいスキーマへ移れます。既定値の決定という自動化できない部分だけをコードで補っています。", "commonMistakes": ["`stages` を空のままにする間違いです。schemas だけ増やしても橋がないため、既存ストアを開けずにクラッシュします。", "移行できないときにストアを削除する対応です。開発中は動いたように見えますが、リリース後に実行するとユーザーのデータが消えます。", "didMigrate で save を呼び忘れる間違いです。埋めた既定値が確定せず、次回起動時に同じ状態に戻ります。"], "takeaway": "自動移行できない変更には custom stage を用意する。データ削除は移行ではない。", "example": {"code": "struct Row { var name: String; var category: String }\nvar rows = [Row(name: \"Run\", category: \"\"), Row(name: \"Swim\", category: \"cardio\")]\nfor i in rows.indices where rows[i].category.isEmpty { rows[i].category = \"other\" }\nprint(rows.map { \"\\($0.name):\\($0.category)\" })", "output": "[\"Run:other\", \"Swim:cardio\"]", "explanation": "didMigrate が行っているのはこの処理です。既存の値がある行はそのまま、空の行だけ既定値で埋めます。"}}, "seriesId": "development-swiftdata", "seriesStep": 5}, {"id": "practice-development-040", "track": "development", "lessonId": "dev-lifecycle-config", "type": "trace", "difficulty": 1, "title": "権限を尋ねる前に使うとどうなるか", "prompt": "写真ライブラリへのアクセス権限をまだ求めていない状態で、このコードを実行しました。何が起きますか。", "skills": ["debugging", "architecture"], "noRunSolution": true, "content": {"code": "// Info.plist に NSPhotoLibraryUsageDescription を書いていない\nlet status = PHPhotoLibrary.authorizationStatus(for: .readWrite)\nprint(status == .authorized ? \"読み込み開始\" : \"権限なし\")\nPHPhotoLibrary.requestAuthorization(for: .readWrite) { _ in }", "options": [{"id": "o1", "label": "「権限なし」と表示されたあと、権限を要求した時点でアプリがクラッシュする"}, {"id": "o2", "label": "「権限なし」と表示され、そのあと権限を尋ねるダイアログが正常に出る"}, {"id": "o3", "label": "1行目の authorizationStatus の時点でクラッシュする"}, {"id": "o4", "label": "何も起きず、自動的に権限が許可された状態になる"}]}, "solution": {"optionId": "o1"}, "hints": ["コメントに書かれている「Info.plist に説明文がない」ことが鍵です。", "状態を問い合わせるだけの処理と、実際にダイアログを出す処理は扱いが違います。", "説明文が必要になるのは、ユーザーに表示する瞬間です。"], "explanation": "まず1行目の `authorizationStatus(for:)` は現在の状態を返すだけで、ユーザーへの表示を伴わないため問題なく実行され、未許可なので `.notDetermined` が返り「権限なし」と表示されます。問題は3行目の `requestAuthorization(for:)` です。これは実際に許可を求めるダイアログを表示しますが、ダイアログには「なぜこのアプリが写真を使うのか」という説明文を必ず出す決まりになっています。その文言は Info.plist の `NSPhotoLibraryUsageDescription` から読み込まれ、キーが存在しないとダイアログを構成できないため、OS はその場でアプリを強制終了させます。これは実行時のクラッシュであり、ビルドは通ってしまうため、権限まわりのバグは実機で初めて気づくことが多い種類の問題です。修正は Info.plist に用途を説明する文字列を追加することです。", "detail": {"concept": "iOS のプライバシー権限は「状態を問い合わせる」「ユーザーに求める」の2段階です。説明文が必須になるのは後者で、ユーザーが判断するために必要な情報だからです。", "steps": ["`authorizationStatus(for:)` … 現在の状態を返すだけ。UI は出ないので説明文は不要。", "未許可なので `.notDetermined` が返り、比較は false になって「権限なし」が表示される。", "`requestAuthorization(for:)` … システムのダイアログを表示しようとする。", "ダイアログに載せる説明文が Info.plist にないため、OS がアプリを終了させる。"], "whyCorrect": "1行目は表示を伴わないので通過し、3行目で初めて説明文が必要になります。したがって表示が1回行われたあとにクラッシュする、という順序になります。", "commonMistakes": ["「Info.plist の設定漏れはビルドエラーになる」と考える間違いです。ビルドは成功し、実行時にだけ落ちます。", "説明文を「写真を使います」のような内容のない文にする間違いです。審査で却下される理由になります。", "権限を求める前に機能を実行してしまう間違いです。状態を確認して分岐する設計にします。"], "takeaway": "権限ダイアログには Info.plist の説明文が必須。ないと実行時に落ちる。", "example": {"code": "let plistKeys: [String] = []\nlet needed = \"NSPhotoLibraryUsageDescription\"\nprint(\"状態の問い合わせ: OK\")\nprint(\"ダイアログ表示:\", plistKeys.contains(needed) ? \"OK\" : \"クラッシュ\")", "output": "状態の問い合わせ: OK\nダイアログ表示: クラッシュ", "explanation": "2つの処理で必要な条件が違うことが、このコードの挙動をそのまま説明しています。"}}}, {"id": "practice-development-041", "track": "development", "lessonId": "dev-capabilities-release", "type": "testReasoning", "difficulty": 3, "title": "実機ビルドだけ失敗する原因を読み取る", "prompt": "CI のジョブ結果です。シミュレータ向けは成功し、実機向けアーカイブだけ失敗しています。失敗の原因として最も適切な説明を選んでください。", "skills": ["architecture", "debugging"], "noRunSolution": true, "content": {"requirement": "Push通知を使うアプリを、CIから実機向けにアーカイブしてTestFlightへ配布できること。", "code": "xcodebuild -scheme App -destination 'generic/platform=iOS' archive\n# error: Provisioning profile \"App Distribution\" doesn't include the aps-environment entitlement", "tests": [{"name": "シミュレータ向けビルド", "input": "-destination 'platform=iOS Simulator,name=iPhone 16'", "expected": "成功", "result": "成功"}, {"name": "実機向けアーカイブ", "input": "-destination 'generic/platform=iOS'", "expected": "成功", "result": "失敗（aps-environment entitlement がない）"}, {"name": "ユニットテスト", "input": "swift test", "expected": "全件成功", "result": "全件成功"}], "options": [{"id": "o1", "label": "Push通知のCapabilityを有効にしたことで entitlement が要求されるようになったが、配布用プロビジョニングプロファイルがその権限を含んでいない"}, {"id": "o2", "label": "Push通知のコードにコンパイルエラーがあり、実機向けの最適化ビルドでだけ検出された"}, {"id": "o3", "label": "ユニットテストが Push通知の処理を検証していないため、アーカイブ時に検証が実行された"}, {"id": "o4", "label": "シミュレータには通知機能がないため、実機向けビルドでのみ通知のコードが型チェックされた"}]}, "solution": {"optionId": "o1"}, "hints": ["3つの結果のうち、失敗しているのは署名を必要とする工程だけです。", "エラーメッセージが指しているのは、コードではなくプロファイルの内容です。", "entitlement は「アプリが使ってよい機能」の一覧で、署名時に照合されます。"], "explanation": "テスト結果が示しているのは、コードそのものは問題ないということです。シミュレータ向けビルドとユニットテストが成功しているため、コンパイルも型チェックも通っています。失敗しているのは実機向けアーカイブだけで、これは3つのうち唯一コード署名を伴う工程です。エラーメッセージも `Provisioning profile ... doesn't include the aps-environment entitlement` と、コードではなくプロファイルの内容を指しています。Push通知の Capability を有効にすると、アプリの entitlements に `aps-environment` が追加され、署名時にプロビジョニングプロファイルが同じ権限を含んでいるかが照合されます。プロファイル側が古いままだとこの照合に失敗します。修正は、Developer Portal で App ID に Push Notifications を有効化し、プロファイルを再生成して CI に配置し直すことです。コンパイルエラーやテスト不足を原因とする説明は、成功しているジョブの結果と矛盾します。", "detail": {"concept": "entitlement は「このアプリはこの機能を使ってよい」という宣言で、プロビジョニングプロファイルに含まれる権限と署名時に照合されます。コードの正しさとは独立した検証です。", "steps": ["要件は「実機向けにアーカイブして配布できること」。つまり署名の成立が要件に含まれる。", "シミュレータ向けは署名を必要としないため成功する。", "ユニットテストも署名を伴わないため成功する。", "実機向けアーカイブだけが署名を行い、entitlements とプロファイルを照合する。", "Capability を有効にした側だけ更新され、プロファイル側が追随していないため照合に失敗する。"], "whyCorrect": "成功と失敗の差が「署名を行うかどうか」という1点に集約されており、エラーメッセージもプロファイルの内容を名指ししています。コードに原因があるなら、シミュレータ向けビルドも失敗するはずです。", "commonMistakes": ["Xcode の Capability を有効にすれば Developer Portal 側も自動で揃うと考える間違いです。CI が使う配布用プロファイルは手動更新が必要な場合があります。", "entitlements ファイルから該当の行を削除して通す対応です。ビルドは通りますが、Push通知が実機で動きません。", "ローカルで自動署名を使って成功するため CI でも通ると考える間違いです。自動署名と配布用プロファイルは別の仕組みです。"], "takeaway": "Capability を追加したらプロファイルも再生成する。署名エラーはコードの問題ではない。", "example": {"code": "let entitlements = [\"aps-environment\"]\nlet profileIncludes = [\"application-identifier\", \"get-task-allow\"]\nlet missing = entitlements.filter { !profileIncludes.contains($0) }\nprint(missing.isEmpty ? \"署名OK\" : \"不足: \\(missing)\")", "output": "不足: [\"aps-environment\"]", "explanation": "署名時の照合はこの差分計算と同じで、片方にしかない権限があると失敗します。"}}, "seriesId": "development-release", "seriesStep": 1}, {"id": "practice-development-042", "track": "development", "lessonId": "dev-architecture-security-git", "type": "shortCode", "difficulty": 4, "title": "APIキーを読み込む1行を書く", "prompt": "APIキーをソースコードに直接書かず、実行時に環境変数 API_KEY から読み込みます。値がない場合は nil になる1行を書いてください（変数名は apiKey）。", "skills": ["foundation", "architecture"], "content": {"context": "import Foundation\n\n// APIキーはリポジトリに含めず、実行環境から渡す\n// ここに1行書く\nprint(apiKey ?? \"（未設定）\")", "placeholder": "例: let 変数名 = ..."}, "solution": {"accepted": ["let apiKey = ProcessInfo.processInfo.environment[\"API_KEY\"]", "let apiKey: String? = ProcessInfo.processInfo.environment[\"API_KEY\"]"]}, "hints": ["実行中のプロセスの情報を取り出す型が Foundation にあります。", "環境変数の一覧は辞書として取り出せます。辞書の添字アクセスは Optional を返します。", "キーが存在しないときに nil になる性質を、そのまま利用します。"], "explanation": "`let apiKey = ProcessInfo.processInfo.environment[\"API_KEY\"]` と書きます。`ProcessInfo.processInfo` は実行中のプロセス情報を表す共有インスタンスで、その `environment` プロパティは環境変数を `[String: String]` の辞書として返します。辞書の添字アクセスはキーが存在しないとき nil を返すため、`apiKey` の型は自動的に `String?` になり、要件の「値がない場合は nil」がそのまま満たされます。この書き方が重要なのは、APIキーをソースコードに書くとリポジトリの履歴に永久に残るためです。コミットから削除しても過去のコミットには残り続けるので、鍵の無効化と再発行が必要になります。環境変数から読む形にしておけば、鍵は CI の秘密変数や実行環境側にだけ存在し、リポジトリには一切現れません。", "detail": {"concept": "秘密情報は「コードに書かない」ことが原則です。実行時に外部から渡す仕組みにすると、コードと秘密情報のライフサイクルを分離でき、鍵の入れ替えにビルドが不要になります。", "steps": ["`ProcessInfo.processInfo` … 実行中のプロセスを表す共有インスタンスを取得する。", "`.environment` … 環境変数を [String: String] の辞書として返す。", "`[\"API_KEY\"]` … 辞書の添字アクセスなので戻り値は String?。", "未設定なら nil が入り、呼び出し側が `??` などで扱える。"], "whyCorrect": "辞書の添字アクセスが Optional を返すという Swift の標準的な挙動が、そのまま「値がなければ nil」という要件に一致します。追加の分岐や強制アンラップは不要です。", "commonMistakes": ["`environment[\"API_KEY\"]!` と強制アンラップする間違いです。環境変数を設定し忘れた環境でクラッシュします。", "キーをソースに直書きして .gitignore で隠そうとする間違いです。ソースファイル自体は追跡対象なので隠せません。", "誤ってコミットした鍵をあとから削除して安心する間違いです。過去のコミットに残るため、鍵の再発行が必要です。"], "takeaway": "鍵はコードに書かず環境から読む。履歴に入った鍵は無効化して作り直す。", "example": {"code": "import Foundation\nlet apiKey = ProcessInfo.processInfo.environment[\"SLL_DEMO_KEY_UNSET\"]\nprint(apiKey ?? \"（未設定）\")", "output": "（未設定）", "explanation": "設定されていない環境変数を読むと nil が返るため、?? による既定値の指定がそのまま使えます。"}}, "seriesId": "development-release", "seriesStep": 2}, {"id": "practice-swiftui-001", "track": "swiftui", "lessonId": "swiftui-view-declarative", "type": "reorder", "difficulty": 1, "title": "いちばん小さいViewを並べ替える", "prompt": "文字を1つ表示するだけの View です。ブロックを正しい順に並べ替えてください。", "skills": ["swiftui", "syntax"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "        Text(\"こんにちは\")"}, {"id": "b2", "code": "struct GreetingView: View {"}, {"id": "b3", "code": "    }"}, {"id": "b4", "code": "    var body: some View {"}, {"id": "b5", "code": "}"}]}, "solution": {"order": ["b2", "b4", "b1", "b3", "b5"]}, "hints": ["いちばん外側は「この型は View である」と宣言している行です。", "body は View の中に置かれるプロパティです。表示内容はさらにその中に書きます。", "閉じかっこは、内側で開いたものから順に閉じていきます。"], "explanation": "正しい順は「struct 宣言 → body プロパティ → Text → body を閉じる → struct を閉じる」です。SwiftUI の View は、`View` プロトコルに準拠した struct として書きます。準拠するために必ず必要なのが `body` プロパティで、ここに「何を表示するか」を書きます。`some View` は「View プロトコルに準拠した何らかの具体的な型」という意味で、Text なのか VStack なのかを毎回書かなくて済むようにするための記法です。かっこは内側から順に閉じるため、body を閉じる `}` が先、struct を閉じる `}` が後になります。この入れ子構造が SwiftUI のすべての View の土台です。", "detail": {"concept": "SwiftUI の View は「画面の状態を表す値」です。命令を並べて画面を作るのではなく、`body` に「今どう見えるべきか」を書くと、SwiftUI がその通りに描画します。", "steps": ["`struct GreetingView: View {` … View プロトコルに準拠した型を宣言する。", "`var body: some View {` … 準拠に必要なプロパティ。表示内容を返す。", "`Text(\"こんにちは\")` … body が返す View 本体。", "`}` … body を閉じる。", "`}` … struct を閉じる。"], "whyCorrect": "型の宣言の中に body があり、body の中に表示内容があるという入れ子が守られています。かっこも内側から順に閉じているため、構文として成立します。", "commonMistakes": ["body を書き忘れる間違いです。View プロトコルの要求を満たさないため、コンパイルエラーになります。", "class で View を作ろうとする間違いです。SwiftUI の View は値として扱われるため struct にします。", "閉じかっこの順序を入れ替える間違いです。body より先に struct を閉じると構造が壊れます。"], "takeaway": "View は struct + body。表示内容は body の中に書く。", "example": {"code": "protocol Renderable { var body: String { get } }\nstruct GreetingView: Renderable {\n    var body: String { \"こんにちは\" }\n}\nprint(GreetingView().body)", "output": "こんにちは", "explanation": "SwiftUI の View も構造はこれと同じで、body が「表示すべき内容」を返します。"}}, "seriesId": "swiftui-view", "seriesStep": 1}, {"id": "practice-swiftui-002", "track": "swiftui", "lessonId": "swiftui-view-declarative", "type": "fillBlank", "difficulty": 1, "title": "Viewの宣言を完成させる", "prompt": "名前を表示する View の定義です。空欄を埋めてください。", "skills": ["swiftui", "syntax", "protocols"], "content": {"template": "struct NameLabel: {{a}} {\n    let name: String\n\n    var body: {{b}} {\n        Text(name)\n    }\n}", "blanks": [{"id": "a", "options": ["View", "UIView", "Renderable", "Body"]}, {"id": "b", "options": ["some View", "View", "any View", "Text"]}]}, "solution": {"answers": {"a": "View", "b": "some View"}}, "hints": ["1つ目は、SwiftUI が「これは画面部品だ」と判断するためのプロトコル名です。", "2つ目は戻り値の型で、具体的な型名を書かずに済ませる書き方を使います。", "UIKit の型名は SwiftUI の View 宣言には登場しません。"], "explanation": "1つ目は `View` です。SwiftUI の画面部品は View プロトコルに準拠することで初めて画面に置けるようになります。2つ目は `some View` です。これは opaque return type（不透明な戻り値型）という機能で、「View に準拠した何か1つの具体的な型を返す」という意味になります。実際の body の型は Text や `ModifiedContent<Text, ...>` のように modifier を足すたびに変化する複雑な型ですが、`some View` と書けばその型名を人が書く必要がありません。`any View` でもコンパイルは通りますが、こちらは実行時に型を包む仕組み（existential）になるため、SwiftUI が型情報を使って行う差分更新の最適化が効きにくくなります。`Text` と具体的に書いてしまうと、あとから `.padding()` を足しただけで型が変わり、宣言を書き直す必要が出ます。", "detail": {"concept": "`some View` は「型は1つに決まっているが、その名前をここには書かない」という宣言です。呼び出し側からは具体的な型が隠れ、実装側は自由に型を変えられます。", "steps": ["`: View` … このstructがSwiftUIの画面部品であることを宣言する。", "`var body: some View` … View に準拠した具体的な型を1つ返すと宣言する。", "body の実装が Text を返すので、実際の型は Text に決まる。", "`.padding()` を足すと実際の型は変わるが、宣言は some View のままでよい。"], "whyCorrect": "View プロトコルへの準拠と、body の戻り値を some View にする組み合わせが、SwiftUI の View 定義の標準形です。型名を書かずに済むため、modifier の追加で宣言を壊しません。", "commonMistakes": ["`var body: Text` と具体的に書く間違いです。modifier を1つ足しただけで型が変わり、コンパイルエラーになります。", "`any View` を常用する間違いです。動きはしますが、型情報が失われて更新の最適化が働きにくくなります。", "View プロトコルへの準拠を書き忘れる間違いです。body があっても画面には置けません。"], "takeaway": "View に準拠し、body は some View で返す。", "example": {"code": "protocol Shape { func area() -> Double }\nstruct Circle: Shape { let r: Double; func area() -> Double { 3.14 * r * r } }\nfunc makeShape() -> some Shape { Circle(r: 2) }\nprint(makeShape().area())", "output": "12.56", "explanation": "some Shape は「Shape に準拠した具体的な型を1つ返す」意味です。呼び出し側は Circle という名前を知らずに使えます。"}}, "seriesId": "swiftui-view", "seriesStep": 2}, {"id": "practice-swiftui-003", "track": "swiftui", "lessonId": "swiftui-view-declarative", "type": "matching", "difficulty": 2, "title": "SwiftUIの用語を対応づける", "prompt": "SwiftUI でよく出てくる用語と、その役割を対応づけてください。", "skills": ["swiftui", "syntax"], "content": {"left": [{"id": "l1", "label": "body"}, {"id": "l2", "label": "modifier（.padding など）"}, {"id": "l3", "label": "ViewBuilder"}, {"id": "l4", "label": "@State"}], "right": [{"id": "r1", "label": "この View が今どう見えるべきかを返すプロパティ"}, {"id": "r2", "label": "既存の View を包んで、見た目や配置を変えた新しい View を返す"}, {"id": "r3", "label": "かっこの中に並べた複数の View を1つにまとめる仕組み"}, {"id": "r4", "label": "View 自身が持つ、変化すると再描画のきっかけになる値"}, {"id": "r5", "label": "画面遷移のたびにViewを破棄して作り直すための命令"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["「返すもの」に注目すると、body と modifier の違いがはっきりします。", "VStack の中に Text を2つ並べただけで動くのは、ある仕組みのおかげです。", "再描画のきっかけになるのは、値を持つものだけです。"], "explanation": "`body` は「今どう見えるべきか」を返すプロパティで、View プロトコルが要求する唯一のメンバーです。modifier は `.padding()` のように既存の View に対して呼ぶメソッドで、元の View を変更するのではなく、それを包んだ新しい View を返します。だから呼ぶ順番によって結果が変わります。ViewBuilder は、VStack のかっこの中に Text を複数並べただけで動く仕組みで、並べた View を1つにまとめて返す result builder です。`@State` は View 自身が持つ値で、変化すると SwiftUI が body を呼び直して画面を更新します。「画面遷移のたびに View を破棄して作り直す命令」というものは SwiftUI には存在しません。View は必要に応じて何度も作り直される軽い値なので、破棄を明示する仕組み自体が不要です。", "detail": {"concept": "SwiftUI の中心にあるのは「View は状態から計算される値である」という考え方です。body が計算、@State が入力、modifier が変換、ViewBuilder が組み立てを担当します。", "steps": ["@State が変化する → SwiftUI が変化を検知する。", "body が呼び直され、新しい View の構造が計算される。", "ViewBuilder が並べた View をまとめ、modifier が包んだ結果を含めて確定する。", "SwiftUI が前回との差分だけを実際の描画に反映する。"], "whyCorrect": "4つの用語は「値を持つ／計算する／変換する／まとめる」という役割で互いに重ならないため、それぞれ1つの説明に対応します。破棄の命令だけはSwiftUIの考え方に存在しません。", "commonMistakes": ["modifier が元の View を書き換えると考える間違いです。新しい View を返すため、呼ぶ順番が結果に影響します。", "body を「一度だけ実行される初期化処理」と考える間違いです。状態が変わるたびに何度でも呼ばれます。", "body の中に重い計算を書く間違いです。何度も呼ばれる前提なので、計算はモデル側に置きます。"], "takeaway": "body は計算、modifier は変換、@State は入力。View は何度でも作り直される。", "example": {"code": "struct Box { let text: String; let padded: Bool }\nfunc padding(_ b: Box) -> Box { Box(text: b.text, padded: true) }\nlet original = Box(text: \"Hi\", padded: false)\nlet modified = padding(original)\nprint(original.padded, modified.padded)", "output": "false true", "explanation": "modifier は元の値を変えず、新しい値を返します。original が false のままである点が重要です。"}}}, {"id": "practice-swiftui-004", "track": "swiftui", "lessonId": "swiftui-layout-modifiers", "type": "reorder", "difficulty": 2, "title": "余白の内側に色を敷く順番に並べ替える", "prompt": "文字の周囲に余白をとり、その余白の内側までを黄色く塗り、さらに全体の外側に余白をとります。ブロックを正しい順に並べ替えてください。", "skills": ["swiftui"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "    .background(Color.yellow)"}, {"id": "b2", "code": "Text(\"合計\")"}, {"id": "b3", "code": "    .padding(16)"}, {"id": "b4", "code": "    .padding(8)"}]}, "solution": {"order": ["b2", "b3", "b1", "b4"]}, "hints": ["modifier は上から順に、直前までの結果を包んでいきます。", "背景色は、その時点で確定しているサイズに対して敷かれます。", "同じ padding が2つあります。塗りたい範囲に含まれるのはどちらでしょうか。"], "explanation": "正しい順は「Text → .padding(16) → .background(Color.yellow) → .padding(8)」です。modifier は書いた順に、それまでの結果を包んだ新しい View を作ります。まず Text の周囲に16ポイントの余白を足すと、その余白を含んだ大きさの View になります。次に `.background` を呼ぶと、その時点で確定しているサイズ、つまり文字＋16ポイントの余白の範囲が黄色く塗られます。最後の `.padding(8)` は塗られた矩形のさらに外側に余白を作るため、この8ポイント分は塗られません。順番を入れ替えて `.background` を先に書くと、文字の大きさぴったりにだけ色が付き、余白部分は塗られない別の見た目になります。「どこまで塗るか」を決めているのは色の指定ではなく、その直前までに適用された modifier だという点が要点です。", "detail": {"concept": "SwiftUI の modifier は、元の View を書き換えるのではなく「包む」操作です。そのため適用順が、そのまま入れ子の内側から外側への順序になります。", "steps": ["`Text(\"合計\")` … 文字の大きさぴったりの View。", "`.padding(16)` … 周囲に16の余白を加えた、ひとまわり大きい View になる。", "`.background(Color.yellow)` … その時点の大きさ（文字＋16）を黄色で塗る。", "`.padding(8)` … 黄色い矩形の外側に8の余白を置く。ここは塗られない。"], "whyCorrect": "要件が「余白の内側まで塗る」なので、padding を background より前に置く必要があります。外側の余白は塗られてはいけないので、background のあとに置きます。", "commonMistakes": ["`.background` を先に書く間違いです。文字の大きさにだけ色が付き、余白は背景色になりません。", "modifier の順序を「どれも見た目の指定だから同じ」と考える間違いです。包む順序が結果を決めます。", "余白を空の Spacer や改行で作ろうとする間違いです。サイズが文字数に依存して崩れます。"], "takeaway": "modifier は書いた順に包む。background は直前までのサイズを塗る。", "example": {"code": "var width = 40.0\nprint(\"Text:\", width)\nwidth += 16 * 2\nprint(\"padding(16)後:\", width, \"→ この幅が塗られる\")\nwidth += 8 * 2\nprint(\"padding(8)後:\", width, \"→ 外側8は塗られない\")", "output": "Text: 40.0\npadding(16)後: 72.0 → この幅が塗られる\npadding(8)後: 88.0 → 外側8は塗られない", "explanation": "background が塗る範囲は、それが呼ばれた時点の幅で決まります。あとから足した padding は含まれません。"}}, "seriesId": "swiftui-layout", "seriesStep": 1}, {"id": "practice-swiftui-005", "track": "swiftui", "lessonId": "swiftui-layout-modifiers", "type": "trace", "difficulty": 2, "title": "modifierの順序による見た目の違いを追う", "prompt": "2つの View を並べました。見た目はどう違いますか。", "skills": ["swiftui"], "noRunSolution": true, "content": {"code": "// A\nText(\"OK\")\n    .frame(width: 120, height: 44)\n    .background(Color.blue)\n\n// B\nText(\"OK\")\n    .background(Color.blue)\n    .frame(width: 120, height: 44)", "options": [{"id": "o1", "label": "A は 120×44 全体が青くなり、B は文字の大きさぶんだけ青くなって、その青い部分が 120×44 の領域の中央に置かれる"}, {"id": "o2", "label": "A も B も 120×44 全体が青くなり、見た目に違いはない"}, {"id": "o3", "label": "A は文字の大きさぶんだけ青くなり、B は 120×44 全体が青くなる"}, {"id": "o4", "label": "B は frame が background のあとにあるため無視され、文字の大きさのままになる"}]}, "solution": {"optionId": "o1"}, "hints": ["background が塗るのは「その時点で確定しているサイズ」です。", "frame は View に希望のサイズを与えて、その領域の中に元の内容を配置します。", "順番が違えば、background が見ているサイズも違います。"], "explanation": "A では `.frame(width:height:)` が先に適用されるため、その時点で View のサイズが 120×44 に確定します。続く `.background` はそのサイズを塗るので、120×44 の矩形全体が青くなります。B では `.background` が先に呼ばれ、このとき確定しているのは文字の大きさだけなので、\"OK\" の文字にぴったりの範囲だけが青くなります。そのあとの `.frame` は、青くなった小さな View を 120×44 の領域の中に配置します。frame は既定で中央に配置するため、120×44 の透明な領域の真ん中に、小さな青い矩形が置かれた見た目になります。frame が無視されるわけではなく、B でも View 全体の大きさは 120×44 になります。違うのは「青い範囲」だけです。", "detail": {"concept": "SwiftUI のレイアウトは、内側の View が自分の必要なサイズを提案し、外側の modifier がそれを加工していく流れで決まります。modifier の位置は、この流れのどの段階に割り込むかを意味します。", "steps": ["A: Text が「文字ぶんの大きさ」を提案する。", "A: frame がサイズを 120×44 に上書きする。", "A: background が 120×44 を塗る。", "B: Text が「文字ぶんの大きさ」を提案する。", "B: background が文字ぶんのサイズを塗る。", "B: frame が、塗られた小さい View を 120×44 の領域に中央配置する。"], "whyCorrect": "background が塗る対象は常に「直前までに確定したサイズ」です。A では frame 適用後、B では Text のままなので、塗られる範囲だけが異なります。どちらも最終的な View の大きさは 120×44 です。", "commonMistakes": ["frame と background の順序は結果に影響しないと考える間違いです。ボタンの当たり判定や見た目が意図と変わります。", "B の見た目を直すのに文字を長くして調整する間違いです。文言が変わるたびに崩れます。", "背景を敷きたい範囲を frame ではなく Spacer で作ろうとする間違いです。親のレイアウトによって結果が変わります。"], "takeaway": "サイズを決めてから塗る。frame → background の順が「全体を塗る」形。", "example": {"code": "let textSize = (w: 28.0, h: 20.0)\nlet frameSize = (w: 120.0, h: 44.0)\nprint(\"A の青い範囲:\", frameSize)\nprint(\"B の青い範囲:\", textSize)\nprint(\"A も B も View 全体の大きさ:\", frameSize)", "output": "A の青い範囲: (w: 120.0, h: 44.0)\nB の青い範囲: (w: 28.0, h: 20.0)\nA も B も View 全体の大きさ: (w: 120.0, h: 44.0)", "explanation": "全体の大きさは同じで、塗られる範囲だけが違う、という関係が整理できます。"}}, "seriesId": "swiftui-layout", "seriesStep": 2}, {"id": "practice-swiftui-006", "track": "swiftui", "lessonId": "swiftui-layout-modifiers", "type": "chooseBlocks", "difficulty": 2, "title": "左右に寄せる行レイアウトを組む", "prompt": "1行の中で、ラベルを左端に、金額を右端に配置します。必要なブロックだけを正しい順に選んでください。不要なブロックが混ざっています。", "skills": ["swiftui"], "noRunSolution": true, "content": {"requireOrder": true, "blocks": [{"id": "b1", "code": "HStack {"}, {"id": "b2", "code": "    Text(\"合計\")"}, {"id": "b3", "code": "    Spacer()"}, {"id": "b4", "code": "    Text(\"¥1,200\")"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "VStack {"}, {"id": "b7", "code": "    Text(\"          \")"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5"], "selected": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["「1行の中で左右に」と言っているので、要素を横に並べるコンテナを選びます。", "余った幅を吸収して2つを押し広げる部品が1つあります。", "空白文字で位置を調整する方法は、文字数や画面幅が変わると崩れます。"], "explanation": "必要なのは HStack、ラベルの Text、Spacer、金額の Text、閉じかっこの5つです。`HStack` は子を横一列に並べるコンテナで、「1行の中で」という要件に合致します。`Spacer()` は「使える限りの幅を占有する」という性質を持つ View で、2つの Text の間に置くと余った幅をすべて吸収し、結果として左右の要素が両端まで押し広げられます。画面幅が変わっても、金額の桁数が変わっても、Spacer が吸収する量が自動的に変わるだけなので配置が崩れません。`VStack` は子を縦に並べるため、この要件では使いません。空白だけの `Text(\"          \")` で位置を調整する方法は、フォントや文字幅、画面サイズが変わるたびにずれるうえ、読み上げにも空の要素として現れるためアクセシビリティ上も好ましくありません。", "detail": {"concept": "SwiftUI のレイアウトは「余った空間を誰が取るか」で決まります。Spacer は余白を数値で指定する代わりに、余りをすべて引き受ける役割を担う View です。", "steps": ["`HStack { }` … 子を横一列に並べる。", "`Text(\"合計\")` … 必要な幅だけを主張する。", "`Spacer()` … 残りの幅をすべて取る。", "`Text(\"¥1,200\")` … 必要な幅だけを主張する。", "結果として、2つの Text が両端に押し出される。"], "whyCorrect": "固定値ではなく「余りを取る」という相対的な指定なので、画面幅や文字数が変わっても両端揃えという意図が保たれます。", "commonMistakes": ["空白文字や固定 padding で位置を合わせる間違いです。端末サイズや文字数が変わると崩れます。", "Spacer を両端にも置いてしまう間違いです。左右にも余白が入り、両端揃えになりません。", "VStack を使ってしまう間違いです。縦に並ぶため、1行に収まりません。"], "takeaway": "両端揃えは HStack + Spacer。空白文字で位置を作らない。", "example": {"code": "let total = 200.0\nlet left = 40.0\nlet right = 60.0\nlet spacer = total - left - right\nprint(\"左:\", left, \"Spacer:\", spacer, \"右:\", right)", "output": "左: 40.0 Spacer: 100.0 右: 60.0", "explanation": "Spacer の幅は指定するものではなく、全体から他の要素を引いた残りとして決まります。"}}}, {"id": "practice-swiftui-007", "track": "swiftui", "lessonId": "swiftui-layout-modifiers", "type": "bugHunt", "difficulty": 3, "title": "タップできる範囲が狭いボタンの原因を見つける", "prompt": "行全体をタップできるようにしたつもりですが、実際には文字の上しか反応しません。原因となっている行を1つ選んでください。", "skills": ["swiftui", "debugging"], "noRunSolution": true, "content": {"lines": [{"id": "l1", "code": "HStack {"}, {"id": "l2", "code": "    Text(\"設定を開く\")"}, {"id": "l3", "code": "    Spacer()"}, {"id": "l4", "code": "}"}, {"id": "l5", "code": ".frame(maxWidth: .infinity)"}, {"id": "l6", "code": ".onTapGesture { openSettings() }"}]}, "solution": {"optionId": "l6", "fixedCode": "HStack {\n    Text(\"設定を開く\")\n    Spacer()\n}\n.frame(maxWidth: .infinity)\n.contentShape(Rectangle())\n.onTapGesture { openSettings() }"}, "hints": ["幅は広がっているのに反応しないので、原因は幅の指定ではありません。", "SwiftUI が当たり判定に使う形は、描画されている中身から決まります。", "Spacer や透明な領域は、既定では当たり判定を持ちません。"], "explanation": "問題は6行目の `.onTapGesture` で、当たり判定の形を指定しないままジェスチャーを付けていることです。`.frame(maxWidth: .infinity)` によって View の幅は行いっぱいに広がりますが、SwiftUI がタップ判定に使う形（contentShape）は既定では「実際に描画されている中身」から作られます。HStack の中で描画されているのは Text だけで、Spacer が占める領域は透明なため判定に含まれません。その結果、幅は広いのに反応するのは文字の上だけ、という状態になります。修正は `.contentShape(Rectangle())` を onTapGesture の直前に挟むことです。これは「この View の当たり判定は、この矩形全体とみなす」という指定で、frame で広げた領域全体がタップに反応するようになります。1〜5行目は配置としては正しく、幅も意図どおり広がっているため、原因ではありません。", "detail": {"concept": "SwiftUI では「描画される形」と「タップ判定に使う形」が別々に扱われます。既定では描画内容から判定形状が導かれるため、透明な領域は反応しません。", "steps": ["`.frame(maxWidth: .infinity)` … View の占める領域は行いっぱいに広がる。", "しかし描画されているのは Text の部分だけ。", "既定の contentShape は描画内容から作られるため、透明部分は判定外。", "`.contentShape(Rectangle())` … 判定形状を矩形全体に置き換える。", "以後、`.onTapGesture` は広がった領域全体で反応する。"], "whyCorrect": "幅は既に広がっているので、不足しているのは判定形状の指定だけです。contentShape を挟むと、レイアウトを変えずに反応範囲だけを意図どおりにできます。", "commonMistakes": ["背景に `.background(Color.clear)` を敷いて解決しようとする間違いです。clear は描画されないため判定は広がりません。", "Spacer を Color.white に置き換える対応です。判定は広がりますが、ダークモードで背景が白く残ります。", "Text 側に padding を足して当たり判定を広げる間違いです。行幅に追従せず、端末サイズによって隙間が残ります。"], "takeaway": "透明な領域はタップに反応しない。contentShape(Rectangle()) で判定形状を指定する。", "example": {"code": "let frameWidth = 375.0\nlet drawnWidth = 90.0\nprint(\"レイアウト上の幅:\", frameWidth)\nprint(\"既定の当たり判定:\", drawnWidth)\nprint(\"contentShape(Rectangle())後:\", frameWidth)", "output": "レイアウト上の幅: 375.0\n既定の当たり判定: 90.0\ncontentShape(Rectangle())後: 375.0", "explanation": "レイアウト幅と判定幅が別々の数値である、という点がこのバグの本質です。"}}}, {"id": "practice-swiftui-008", "track": "swiftui", "lessonId": "swiftui-state-binding", "type": "fillBlank", "difficulty": 1, "title": "カウンターの状態宣言を完成させる", "prompt": "ボタンを押すと数が増えるカウンターです。空欄を埋めてください。", "skills": ["swiftui", "syntax"], "content": {"template": "struct CounterView: View {\n    {{a}} private var count = 0\n\n    var body: some View {\n        VStack {\n            Text(\"\\(count)\")\n            Button(\"+1\") {\n                {{b}} += 1\n            }\n        }\n    }\n}", "blanks": [{"id": "a", "options": ["@State", "@Binding", "@Observable", "let"]}, {"id": "b", "options": ["count", "$count", "self.$count", "_count"]}]}, "solution": {"answers": {"a": "@State", "b": "count"}}, "hints": ["この View 自身が持ち、変化したら再描画したい値です。親から渡される値ではありません。", "値そのものを読み書きするときは、記号を付けない書き方を使います。", "$ を付けた形が必要になるのは、別の場所へ「書き換える権利」を渡すときです。"], "explanation": "1つ目は `@State` です。View は struct なので、通常のプロパティは変更できません。`@State` を付けると値の保管場所が View の外側（SwiftUI が管理する領域）に移り、struct が作り直されても値が保持され、変化すると body が呼び直されて再描画が起きます。2つ目は `count` です。`@State private var count` と宣言した場合、`count` は値そのもの（Int）を指し、`$count` はその値への Binding を指します。ここでやりたいのは値を1増やすことなので、値そのものを扱う `count` を使います。`$count` は `Binding<Int>` なので `+= 1` はできません。`$` が必要になるのは、TextField や Toggle、あるいは子 View に「この値を書き換えてよい」という権利を渡すときです。", "detail": {"concept": "@State は「この View が所有する、変化したら再描画する値」です。View 自体は何度も作り直される使い捨ての値なので、状態はその外側に置かれます。", "steps": ["`@State private var count = 0` … 値を SwiftUI 管理下に置き、初期値0で開始する。", "`Text(\"\\(count)\")` … 値そのものを読み取って表示する。", "`count += 1` … 値を書き換える。", "SwiftUI が変化を検知し、body を呼び直して表示を更新する。"], "whyCorrect": "この View だけが持つ値なので @State が適切で、更新は値そのものへの代入なので $ は不要です。private を付けているのは、外部から直接触らせないためです。", "commonMistakes": ["`@State` を付けずに `var count = 0` とする間違いです。struct のプロパティは body の中から変更できず、コンパイルエラーになります。", "`$count += 1` と書く間違いです。$count は Binding なので、そのまま数値演算はできません。", "@State を親子で共有しようとする間違いです。共有したい場合は @Binding で渡します。"], "takeaway": "自分が持つ値は @State。値そのものは count、書き換え権を渡すときだけ $count。", "example": {"code": "final class Storage { var value = 0 }\nlet storage = Storage()\nstruct View1 { let box: Storage; func tap() { box.value += 1 } }\nlet v = View1(box: storage)\nv.tap(); v.tap()\nprint(storage.value)", "output": "2", "explanation": "@State の仕組みはこれに近く、値の実体は struct の外にあるため、struct が作り直されても保持されます。"}}, "seriesId": "swiftui-state", "seriesStep": 1}, {"id": "practice-swiftui-009", "track": "swiftui", "lessonId": "swiftui-state-binding", "type": "reorder", "difficulty": 2, "title": "子Viewへ書き換え権を渡す形に並べ替える", "prompt": "親が持つ isOn を、子の Toggle から書き換えられるようにします。ブロックを正しい順に並べ替えてください。", "skills": ["swiftui"], "noRunSolution": true, "content": {"blocks": [{"id": "b3", "code": "    var body: some View {"}, {"id": "b1", "code": "struct SwitchRow: View {"}, {"id": "b5", "code": "    }"}, {"id": "b2", "code": "    @Binding var isOn: Bool"}, {"id": "b6", "code": "}"}, {"id": "b4", "code": "        Toggle(\"通知\", isOn: $isOn)"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["型の宣言、プロパティ、body、中身、という並びが基本形です。", "@Binding のプロパティは body より前に宣言します。", "並べ替えの結果、かっこが内側から順に閉じられている必要があります。"], "explanation": "正しい順は「struct 宣言 → @Binding プロパティ → body → Toggle → body を閉じる → struct を閉じる」です。プロパティ宣言を body より前に置くのは Swift の慣習で、その型が何を必要としているかが最初に読めるようにするためです。`@Binding var isOn: Bool` は「値そのものは持たず、他の場所にある値への読み書きの通り道を持つ」という宣言です。親側は `SwitchRow(isOn: $notificationEnabled)` のように `$` を付けて渡し、子はそれを `isOn` として通常の Bool のように読み書きできます。Toggle に渡すときに `$isOn` と書いているのは、Toggle 自身も値を書き換えるため Binding を必要とするからです。この連鎖によって、子の Toggle を操作すると親の状態が更新され、親の body が呼び直されます。", "detail": {"concept": "@Binding は「値の所有権は持たず、参照だけを持つ」プロパティラッパーです。所有者は @State を持つ親で、子は借りて読み書きします。", "steps": ["親: `@State private var notificationEnabled = false` … 値を所有する。", "親: `SwitchRow(isOn: $notificationEnabled)` … $ で Binding を渡す。", "子: `@Binding var isOn: Bool` … 通り道を受け取る。", "子: `Toggle(\"通知\", isOn: $isOn)` … Toggle にさらに Binding を渡す。", "操作すると親の @State が更新され、親子とも再描画される。"], "whyCorrect": "プロパティが body より前にあり、かっこが内側から順に閉じられているため構文として成立します。@Binding によって、子は値を所有せずに親の状態を書き換えられます。", "commonMistakes": ["子でも @State を使う間違いです。子が独自の値を持つため、操作しても親に反映されません。", "`Toggle(\"通知\", isOn: isOn)` と $ を付け忘れる間違いです。Toggle は Binding を要求するためコンパイルエラーになります。", "親から値のコピー（let isOn: Bool）だけを渡す間違いです。表示はできますが書き換えられません。"], "takeaway": "所有は @State、借用は @Binding。渡すときに $ を付ける。", "example": {"code": "final class Box { var value = false }\nstruct Child { let box: Box; func toggle() { box.value.toggle() } }\nlet box = Box()\nChild(box: box).toggle()\nprint(box.value)", "output": "true", "explanation": "子が親の値を書き換えられるのは、値のコピーではなく到達手段を渡しているからです。@Binding も同じ考え方です。"}}, "seriesId": "swiftui-state", "seriesStep": 2}, {"id": "practice-swiftui-010", "track": "swiftui", "lessonId": "swiftui-state-binding", "type": "bugHunt", "difficulty": 2, "title": "子で操作しても親に反映されない原因を見つける", "prompt": "子の Toggle を操作しても、親の表示が変わりません。原因となっている行を1つ選んでください。", "skills": ["swiftui", "debugging"], "noRunSolution": true, "content": {"lines": [{"id": "l1", "code": "@State private var isOn = false   // 親"}, {"id": "l2", "code": "SwitchRow(isOn: isOn)              // 親のbody"}, {"id": "l3", "code": "@Binding var isOn: Bool            // 子"}, {"id": "l4", "code": "Toggle(\"通知\", isOn: $isOn)         // 子のbody"}]}, "solution": {"optionId": "l2", "fixedCode": "@State private var isOn = false   // 親\nSwitchRow(isOn: $isOn)             // 親のbody\n@Binding var isOn: Bool            // 子\nToggle(\"通知\", isOn: $isOn)         // 子のbody"}, "hints": ["子側の宣言は @Binding になっていて、受け取る準備はできています。", "問題は「何を渡しているか」です。値そのものと通り道は別のものです。", "$ を付けるべき場所が1つ抜けています。"], "explanation": "問題は2行目で、親が `SwitchRow(isOn: isOn)` と値そのものを渡していることです。子は `@Binding var isOn: Bool` として通り道を要求しているので、親は `$isOn` を渡す必要があります。`$` を付けると `Binding<Bool>` が得られ、これは「読むこともできるし、書き込めば親の @State が更新される」通り道です。値そのもの（Bool）を渡すと、子は現在の値のコピーだけを受け取ることになり、書き換えても親には届きません。実際にはこの書き方は型が合わないためコンパイルエラーになるはずですが、`.constant(isOn)` を渡すなどして無理に通すと、まさに「操作しても何も起きない」症状になります。1行目の @State、3行目の @Binding、4行目の Toggle への `$isOn` はいずれも正しく、修正が必要なのは受け渡しの1箇所だけです。", "detail": {"concept": "SwiftUI では「値」と「値への通り道（Binding）」が別の型です。親子で状態を共有するには、値ではなく通り道を渡す必要があります。", "steps": ["親が @State で値を所有している。", "子は @Binding を宣言し、Binding<Bool> を要求している。", "しかし親は Bool を渡している。型も意味も一致していない。", "`$isOn` に直すと Binding<Bool> が渡り、子の書き込みが親に届く。"], "whyCorrect": "子側の宣言と Toggle への受け渡しは既に正しいため、残る不一致は親からの受け渡しだけです。ここを $ 付きに直せば、状態は1箇所（親の @State）に保たれたまま共有されます。", "commonMistakes": ["`.constant(isOn)` を渡して型エラーを消す対応です。ビルドは通りますが、書き込みが捨てられるため永久に反映されません。", "子を @State に変えて型を合わせる間違いです。子が独自の値を持つので、親とは別々に動きます。", "親子それぞれで値を持ち、手動で同期させる間違いです。同期漏れが起き、片方だけ古い値になります。"], "takeaway": "@Binding には $ を付けて渡す。値を渡すと書き込みが届かない。", "example": {"code": "var parent = false\nfunc passByValue(_ v: Bool) { var copy = v; copy.toggle() }\nfunc passByReference(_ v: inout Bool) { v.toggle() }\npassByValue(parent)\nprint(\"値渡し後:\", parent)\npassByReference(&parent)\nprint(\"参照渡し後:\", parent)", "output": "値渡し後: false\n参照渡し後: true", "explanation": "$ を付けるかどうかの違いは、この inout の有無に近い関係です。値のコピーには書き戻す先がありません。"}}, "seriesId": "swiftui-state", "seriesStep": 3}, {"id": "practice-swiftui-011", "track": "swiftui", "lessonId": "swiftui-state-binding", "type": "buildFunction", "difficulty": 3, "title": "お気に入りを切り替えるメソッドを組み立てる", "prompt": "お気に入りの状態を反転し、上限（10件）を超える場合は追加せずに警告フラグを立てるメソッドを作ります。必要なブロックだけを正しい順に選んでください。", "skills": ["swiftui", "controlFlow", "collections"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "private func toggleFavorite(_ id: Int) {"}, {"id": "b2", "code": "    if favorites.contains(id) {"}, {"id": "b3", "code": "        favorites.remove(id)"}, {"id": "b4", "code": "    } else if favorites.count >= 10 {"}, {"id": "b5", "code": "        showsLimitAlert = true"}, {"id": "b6", "code": "    } else {"}, {"id": "b7", "code": "        favorites.insert(id)"}, {"id": "b8", "code": "    }"}, {"id": "b9", "code": "}"}, {"id": "b10", "code": "    favorites.insert(id)"}, {"id": "b11", "code": "    showsLimitAlert = false"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8", "b9"]}, "hints": ["3つの場合分けがあります。すでに入っている／上限に達している／それ以外です。", "上限の判定は、追加しようとしている場合にだけ必要です。解除には上限は関係ありません。", "条件分岐の外で無条件に追加や代入を行うブロックは、分岐の意味を壊します。"], "explanation": "必要なのは、メソッド宣言、`if favorites.contains(id)` による解除の分岐、`remove`、`else if favorites.count >= 10` による上限判定、警告フラグ、`else`、`insert`、閉じかっこ2つの9ブロックです。順序の要点は、解除の判定を最初に置くことです。すでにお気に入りに入っている項目を解除する操作は、件数が上限に達していても実行できなければなりません。上限チェックを先に書くと、10件登録した状態で解除すらできなくなります。次に、追加しようとしている場合にだけ上限を確認し、超えていれば警告フラグを立てて追加しません。どちらでもない場合だけ insert します。分岐の外にある `favorites.insert(id)` は、どの経路を通っても必ず追加されてしまうため、解除も上限判定も無意味になります。`showsLimitAlert = false` を無条件に置くと、直前に立てた警告フラグをその場で消してしまいます。", "detail": {"concept": "状態を切り替える処理は「今どの状態か」を先に判定し、状態ごとに1つの結果だけを起こす形にすると、後から条件が増えても壊れにくくなります。", "steps": ["`favorites.contains(id)` … すでに入っているか。入っていれば解除して終わり。", "`favorites.count >= 10` … 追加しようとしている場合だけ上限を確認する。", "上限超過なら `showsLimitAlert = true` にして、追加はしない。", "どちらでもなければ `favorites.insert(id)` で追加する。", "3つの経路が排他なので、1回の呼び出しで起きることは必ず1つ。"], "whyCorrect": "解除の判定が最初にあるため、上限に達していても解除できます。上限判定が else if の位置にあるため、追加の場合にだけ効きます。3つの経路が重ならないので、状態が二重に変化することもありません。", "commonMistakes": ["上限チェックを関数の先頭に置く間違いです。10件登録済みの状態で解除操作までブロックされます。", "`showsLimitAlert = false` を無条件に先頭へ置く間違いです。前回の警告は消えますが、同じ呼び出しで立てたフラグまで消す位置に置くと警告が一切出なくなります。", "配列で favorites を持ち、重複チェックを忘れる間違いです。同じidが複数入り、件数が実態と合わなくなります。"], "takeaway": "解除は上限に関係なく通す。状態ごとに経路を排他にする。", "e
