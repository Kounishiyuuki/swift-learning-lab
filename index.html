eter { var name: String { get } }\nextension Greeter { func greet() -> String { \"Hello, \\(name)\" } }\nstruct User: Greeter { let name: String }\nstruct Robot: Greeter { let name: String }\nprint(User(name: \"Yuki\").greet(), Robot(name: \"R2\").greet())", "output": "Hello, Yuki Hello, R2", "explanation": "2つの型がどちらも name を持つだけで、同じ greet を共有できています。"}}, "seriesId": "swift-protocol-design", "seriesStep": 2}, {"id": "practice-swift-077", "track": "swift", "lessonId": "swift-generics", "type": "reorder", "difficulty": 4, "title": "ジェネリック関数を並べ替える", "prompt": "どんな型の配列でも先頭2件を返す関数を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["protocols", "collections", "functions"], "content": {"blocks": [{"id": "b1", "code": "    var result: [T] = []"}, {"id": "b2", "code": "func firstTwo<T>(_ items: [T]) -> [T] {"}, {"id": "b3", "code": "    for item in items.prefix(2) {"}, {"id": "b4", "code": "        result.append(item)"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "    return result"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "print(firstTwo([1, 2, 3]))"}]}, "solution": {"order": ["b2", "b1", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["型パラメータ T は関数の宣言行で導入します。それより前に T は使えません。", "結果を入れる配列は、ループの前に用意します。", "宣言 → 結果の初期化 → ループ → 追加 → ループを閉じる → return → 関数を閉じる → 呼び出し、の順です。"], "explanation": "`<T>` は関数の宣言行で型パラメータを導入する記法で、それ以降の引数・戻り値・本体で T を使えます。結果を入れる `var result: [T] = []` は T が導入されたあと、かつループの前に置きます。`prefix(2)` は要素が2件未満でも安全に動き、その場合はあるだけを返します。呼び出し `firstTwo([1, 2, 3])` では T が Int と推論され、[1, 2] が出力されます。", "detail": {"concept": "ジェネリクスは「型を後から決める」仕組みです。呼び出し側の引数から型が推論されるため、Int でも String でも同じ実装を使い回せます。", "steps": ["`func firstTwo<T>(_ items: [T]) -> [T] {` … T を導入し、引数と戻り値の型に使う。", "`var result: [T] = []` … T の配列として初期化する。", "`items.prefix(2)` … 先頭2件（足りなければあるだけ）を返す。", "`result.append(item)` で詰め、ループの外で return する。", "呼び出し時に T = Int と推論され、[1, 2] が返る。"], "whyCorrect": "T の導入が宣言行にあり、以降の行だけが T を参照しているため、スコープの前後関係が正しく成立します。prefix によって件数不足でも安全です。", "commonMistakes": ["`items[0]` と `items[1]` で直接取り出す実装は、要素が1件のときにクラッシュします。prefix なら件数を気にせずに済みます。", "T に制約を付けずに `>` などの演算子を使おうとするとコンパイルエラーになります。比較が必要なら `<T: Comparable>` の制約が要ります。"], "takeaway": "型パラメータは宣言行で導入。件数に依存する処理は prefix / dropFirst で安全に書く。", "example": {"code": "func firstTwo<T>(_ items: [T]) -> [T] { Array(items.prefix(2)) }\nprint(firstTwo([1, 2, 3]), firstTwo([\"a\"]), firstTwo([Int]()))", "output": "[1, 2] [\"a\"] []", "explanation": "同じ関数が Int でも String でも動き、要素数が足りない場合も落ちません。"}}, "seriesId": "swift-generic-basics", "seriesStep": 1}, {"id": "practice-swift-078", "track": "swift", "lessonId": "swift-generics", "type": "buildFunction", "difficulty": 4, "title": "比較できる型に限定した関数を組み立てる", "prompt": "配列の最大値を返す関数を作ります。空配列では nil を返します。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["protocols", "collections", "optional"], "content": {"blocks": [{"id": "b1", "code": "func maxValue<T: Comparable>(_ items: [T]) -> T? {"}, {"id": "b2", "code": "    guard var best = items.first else { return nil }"}, {"id": "b3", "code": "    for item in items.dropFirst() where item > best {"}, {"id": "b4", "code": "        best = item"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "    return best"}, {"id": "b7", "code": "}"}, {"id": "b8", "code": "func maxValue<T>(_ items: [T]) -> T? {"}, {"id": "b9", "code": "    return items.first"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7"]}, "hints": ["`>` で比較するには、その型が比較可能であるという制約が必要です。制約のない T では書けません。", "空配列のときに返す値がないので、戻り値は Optional です。最初の要素を取り出せるかで判定できます。", "宣言（制約付き）→ 最初の要素を取り出す guard → 残りを比較するループ → 更新 → ループを閉じる → return → 関数を閉じる、の7行です。"], "explanation": "`<T: Comparable>` は「T は比較可能な型に限る」という制約で、これがないと `item > best` が 'Binary operator > cannot be applied to two T operands' になります。空配列では first が nil なので guard で早期に nil を返し、そうでなければ最初の要素を暫定の最大値として残りと比較します。`items.first` をそのまま返す実装は最大値ではなく先頭要素を返すだけで、要件を満たしません。", "detail": {"concept": "ジェネリクスの制約は「この型に何ができるか」をコンパイラに伝えるものです。制約がなければ、その型に対してできることは代入と受け渡しだけになります。", "steps": ["`<T: Comparable>` … T に比較演算子が使えることを保証する。", "`guard var best = items.first else { return nil }` … 空配列を先に処理し、以降は要素があると保証される。", "`items.dropFirst()` … 先頭は既に best なので、2件目以降だけを見る。", "`where item > best` … 条件を満たすときだけ本体が実行される。", "ループ後に best を返す。"], "whyCorrect": "制約により比較が可能になり、guard により空配列が除外されるため、ループ内では常に有効な best が存在します。境界（空配列・1要素）でも破綻しません。", "commonMistakes": ["制約を付け忘れて比較演算子が使えず、原因が分からないまま実装を変えてしまう間違いです。エラーメッセージは型パラメータ名で出るため読みにくく感じます。", "空配列で `items[0]` にアクセスする実装はクラッシュします。Optional を返す設計にすると、呼び出し側に判断を委ねられます。"], "takeaway": "型パラメータにできることは制約で決まる。比較したいなら Comparable。", "example": {"code": "func maxValue<T: Comparable>(_ items: [T]) -> T? {\n    guard var best = items.first else { return nil }\n    for item in items.dropFirst() where item > best { best = item }\n    return best\n}\nprint(maxValue([3, 9, 1]) ?? -1, maxValue([\"a\", \"z\"]) ?? \"-\", maxValue([Int]()) ?? -1)", "output": "9 z -1", "explanation": "数値でも文字列でも動き、空配列では nil が返って既定値が使われます。"}}, "seriesId": "swift-generic-basics", "seriesStep": 2}, {"id": "practice-swift-079", "track": "swift", "lessonId": "swift-any-some", "type": "chooseBlocks", "difficulty": 4, "title": "異なる型を1つの配列に入れる行だけ選ぶ", "prompt": "Circle と Square を同じ配列に入れて面積を並べます。必要な行だけを選び、正しい順に並べてください。", "skills": ["protocols", "types", "collections"], "content": {"blocks": [{"id": "b1", "code": "protocol Shape { var area: Double { get } }"}, {"id": "b2", "code": "struct Circle: Shape { let r: Double; var area: Double { 3.14 * r * r } }"}, {"id": "b3", "code": "struct Square: Shape { let s: Double; var area: Double { s * s } }"}, {"id": "b4", "code": "let shapes: [any Shape] = [Circle(r: 1), Square(s: 2)]"}, {"id": "b5", "code": "print(shapes.map(\\.area))"}, {"id": "b6", "code": "let shapes: [some Shape] = [Circle(r: 1), Square(s: 2)]"}, {"id": "b7", "code": "let shapes: [Shape.Type] = [Circle.self, Square.self]"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5"], "order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["配列の要素は Circle と Square という異なる具体型です。1つの型に固定できません。", "some は「隠れているが常に同じ1つの型」を意味するので、異なる型を混ぜられません。", "実行時に異なる具体型を保持できるほうの記法を選びます。型そのものを並べる書き方では面積を取れません。"], "explanation": "`[any Shape]` は存在型の配列で、Shape に準拠していれば異なる具体型を混ぜて保持できます。`[some Shape]` は不透明型で「1つの具体型に固定される」という意味なので、Circle と Square を同じ配列に入れることはできずコンパイルエラーになります。`[Shape.Type]` は型そのもの（メタタイプ）の配列で、インスタンスではないため area を参照できません。`shapes.map(\\.area)` は keyPath を使った書き方で、出力は [3.14, 4.0] です。", "detail": {"concept": "any（存在型）は「実行時に具体型が変わりうる箱」、some（不透明型）は「呼び出し側からは隠れているが1つに決まっている型」です。混在させたいのか、隠したいだけなのかで選びます。", "steps": ["Circle と Square はどちらも Shape に準拠している。", "配列に混ぜるということは、要素の具体型が一意に決まらないということ。", "したがって要素の型は `any Shape` になる。", "`map(\\.area)` は各要素の area を取り出し、[3.14, 4.0] を作る。"], "whyCorrect": "any Shape は具体型を実行時に保持できるため、異なる型の混在が成立します。プロトコルの要求である area は、どの具体型でも呼び出せることが保証されています。", "commonMistakes": ["some を「any の新しい書き方」と誤解して混在させようとする間違いです。some は同一性の保証がある分、混在ができません。", "any は実行時のボックス化と動的ディスパッチを伴うため、性能が重要な場面では some やジェネリクスを検討します。混ぜる必要がないなら any は不要です。"], "takeaway": "混ぜたいなら any、隠したいだけなら some。目的が違う。", "example": {"code": "protocol Shape { var area: Double { get } }\nstruct Circle: Shape { let r: Double; var area: Double { 3.14 * r * r } }\nstruct Square: Shape { let s: Double; var area: Double { s * s } }\nlet shapes: [any Shape] = [Circle(r: 1), Square(s: 2)]\nprint(shapes.map(\\.area))", "output": "[3.14, 4.0]", "explanation": "異なる具体型が1つの配列に入り、共通の要求である area を通して扱えています。"}}}, {"id": "practice-swift-080", "track": "swift", "lessonId": "swift-type-casting", "type": "repair", "difficulty": 4, "title": "[Any]から数値だけを安全に取り出す", "prompt": "[Any] から Int だけを合計したいのですが、3行目がビルドできません。2行目の修正として最も適切なものを選んでください。", "skills": ["types", "collections", "debugging"], "content": {"code": "let values: [Any] = [1, \"two\", 3]\nlet numbers = values.filter { $0 is Int }\nlet total = numbers.reduce(0, +)\nprint(total)", "options": [{"id": "o1", "code": "let numbers = values.compactMap { $0 as? Int }"}, {"id": "o2", "code": "let numbers = values.map { $0 as! Int }"}, {"id": "o3", "code": "let numbers = values as? [Int]"}, {"id": "o4", "code": "let numbers = values.filter { $0 as? Int != nil }"}]}, "solution": {"optionId": "o1", "fixedCode": "let values: [Any] = [1, \"two\", 3]\nlet numbers = values.compactMap { $0 as? Int }\nlet total = numbers.reduce(0, +)\nprint(total)"}, "hints": ["filter は要素を絞るだけで、型は変えません。絞ったあとも要素の型は Any のままです。", "型を変えるには変換が必要です。失敗しうる変換なので、結果は Optional になります。", "変換と nil の除去を同時に行うメソッドがあります。強制キャストは文字列要素でクラッシュします。"], "explanation": "バグは2行目です。`filter { $0 is Int }` は条件に合う要素を残すだけで型は [Any] のままなので、3行目の `reduce(0, +)` が Any に対する加算となりコンパイルエラーになります。修正は `compactMap { $0 as? Int }` で、条件付きキャストに成功した要素だけを Int として取り出します（結果は [1, 3]、合計4）。`as!` を使う版はビルドが通っても \"two\" のキャストで実行時クラッシュし、`values as? [Int]` は配列全体のキャストなので Int 以外が混じる時点で nil になり、さらに Optional のまま reduce できません。filter を条件式だけ変えても型は Any のままです。", "detail": {"concept": "`is` は判定、`as?` は失敗しうる変換、`as!` は失敗したら停止する変換です。コレクションから特定の型だけを取り出す場面では、判定ではなく変換が必要になります。", "steps": ["`values` の要素の静的な型は Any。", "filter は述語で絞るだけなので、結果も [Any]。", "`compactMap { $0 as? Int }` は各要素を Int? に変換し、nil を除いて [Int] を返す。", "[Int] になったので reduce(0, +) が使え、1 + 3 = 4 になる。"], "whyCorrect": "compactMap が判定と変換と除去を一度に行うため、後続の処理が静的に Int として扱えます。実行時の失敗経路も残りません。", "commonMistakes": ["`is` で確認したあとに `as!` で取り出す2段構えは、確認と変換が離れるほど壊れやすくなります。`as?` + compactMap のほうが安全です。", "配列全体を `as? [Int]` でキャストしようとする間違いです。1つでも型が違えば全体が nil になります。"], "takeaway": "特定の型だけ集めるなら compactMap + as?。filter は型を変えない。", "example": {"code": "let values: [Any] = [1, \"two\", 3]\nprint(values.compactMap { $0 as? Int })\nprint(values.compactMap { $0 as? String })", "output": "[1, 3]\n[\"two\"]", "explanation": "同じ配列から、キャスト先の型を変えるだけで別の要素群を取り出せます。"}}}, {"id": "practice-swift-081", "track": "swift", "lessonId": "swift-access-control", "type": "shortCode", "difficulty": 4, "title": "外から読めて書けないプロパティを宣言する", "prompt": "Token の value を「外からは読めるが、書き換えは型の内部だけ」にしたいです。宣言の1行を書いてください。型は String、初期値は空文字です。", "skills": ["architecture", "types"], "content": {"context": "struct Token {\n    // ここに1行書く（外からは読み取り専用にする）\n    mutating func set(_ v: String) { value = v }\n}", "contextRun": "struct Token {\n{{answer}}\n    mutating func set(_ v: String) { value = v }\n}\nvar t = Token()\nt.set(\"abc\")\nprint(t.value)", "placeholder": "例: 修飾子 var 名前 = 初期値"}, "solution": {"accepted": ["private(set) var value = \"\"", "private(set) var value: String = \"\""]}, "hints": ["読み取りと書き込みで別々のアクセスレベルを指定できる書き方があります。", "書き込み側だけを制限するので、修飾子のあとにかっこで対象を指定します。", "内部限定を表すキーワードのあとに (set) を続け、通常どおり var の宣言を書きます。"], "explanation": "`private(set) var value = \"\"` と書きます。`private(set)` は「取得は既定のアクセスレベル、設定は private」という指定で、外部からは読めても代入できません。型の内部にある set(_:) からは書き換えられるため、値の変更経路をメソッドに限定できます。`private var value` にすると外部から読むこともできなくなり、要件を満たしません。型注釈を明示した `private(set) var value: String = \"\"` も同じ意味で、こちらも正解として受け付けます。", "detail": {"concept": "アクセス制御は「どこから触れるか」を型の設計として宣言する仕組みです。読み取りと書き込みを別々に制御できるため、外部に見せつつ不変条件を守れます。", "steps": ["`private(set)` の (set) は、設定側だけにアクセスレベルを適用する指定。", "取得側は宣言の既定（この場合 internal）のままなので、外部から読める。", "設定側は private なので、同じファイル内の型の実装からしか書けない。", "`t.value = \"x\"` は 'Cannot assign to property: value setter is inaccessible' になる。"], "whyCorrect": "要件が「読める・書けない・内部からは書ける」の3点であり、private(set) はまさにその組み合わせを1つの修飾子で表現します。", "commonMistakes": ["`let` にすると内部からも書き換えられなくなり、set(_:) が成立しません。", "`private var` にすると外部から読めなくなるため、別途 getter を書く羽目になります。private(set) ならその手間が不要です。"], "takeaway": "読めるが書けない、は private(set)。値の変更経路をメソッドに絞れる。", "example": {"code": "struct Token {\n    private(set) var value = \"\"\n    mutating func set(_ v: String) { value = v }\n}\nvar t = Token()\nt.set(\"abc\")\nprint(t.value)", "output": "abc", "explanation": "外部からは読み取りだけができ、変更は set(_:) を通してのみ行えます。"}}}, {"id": "practice-swift-082", "track": "swift", "lessonId": "swift-keypath-wrappers-builders", "type": "reorder", "difficulty": 4, "title": "キーパスで取り出す手順を並べる", "prompt": "Person の配列から名前の配列と年齢の配列を作って表示します。ブロックを正しい順に並べ替えてください。", "skills": ["collections", "types"], "content": {"blocks": [{"id": "b1", "code": "let names = people.map(\\.name)"}, {"id": "b2", "code": "struct Person { let name: String; let age: Int }"}, {"id": "b3", "code": "let people = [Person(name: \"Yuki\", age: 24), Person(name: \"Ken\", age: 15)]"}, {"id": "b4", "code": "let ages = people.map(\\.age)"}, {"id": "b5", "code": "print(names, ages)"}]}, "solution": {"order": ["b2", "b3", "b1", "b4", "b5"]}, "hints": ["型の定義がなければインスタンスは作れません。", "配列がなければ map は書けません。", "型 → 配列 → names → ages → 表示、の順です。"], "explanation": "`\\.name` はキーパス式で、`{ $0.name }` と同じ意味を短く書けます。map がキーパスを直接受け取れるため、単純なプロパティの取り出しではクロージャを書かずに済みます。実行順としては型の定義、配列の生成、2つの map、表示の順になります。出力は [\"Yuki\", \"Ken\"] と [24, 15] です。", "detail": {"concept": "キーパスは「どのプロパティを指すか」を値として表したものです。実行時に取り出す処理を渡せるため、map やソートの条件指定を簡潔に書けます。", "steps": ["`struct Person` … name と age を持つ型を定義する。", "`let people = [...]` … インスタンスの配列を作る。", "`people.map(\\.name)` … 各要素の name を取り出して [String] を作る。", "`people.map(\\.age)` … 同様に [Int] を作る。", "print で両方を表示する。"], "whyCorrect": "各行が必要とする定義がその前に存在するためです。キーパスは Person 型に対して解決されるので、型の定義が先にある必要があります。", "commonMistakes": ["`\\.name` の先頭のバックスラッシュを忘れると、単なるメンバーアクセスと解釈されてコンパイルエラーになります。", "キーパスは単純なプロパティ取得にだけ使えます。`\\.name.count` のような連結は書けますが、計算や条件分岐を含む処理はクロージャが必要です。"], "takeaway": "プロパティを取り出すだけの map はキーパスで書ける。", "example": {"code": "struct Person { let name: String; let age: Int }\nlet people = [Person(name: \"Yuki\", age: 24), Person(name: \"Ken\", age: 15)]\nprint(people.map(\\.name))\nprint(people.sorted { $0.age < $1.age }.map(\\.age))", "output": "[\"Yuki\", \"Ken\"]\n[15, 24]", "explanation": "取り出しはキーパス、比較を伴う並べ替えはクロージャ、という使い分けが確認できます。"}}}, {"id": "practice-swift-083", "track": "swift", "lessonId": "swift-advanced-operators", "type": "testReasoning", "difficulty": 4, "title": "境界値のテストが落ちた原因を読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "debugging", "controlFlow"], "content": {"requirement": "applyDiscount(price:percent:) は percent が 0〜100 のとき割引後の価格を返し、範囲外のときは元の価格をそのまま返す。percent が 100 のときは 0 円になる。", "code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    guard percent >= 0, percent < 100 else { return price }\n    return price - price * percent / 100\n}", "tests": [{"name": "通常の割引", "input": "price: 1000, percent: 20", "expected": "800", "result": "成功"}, {"name": "上限の境界", "input": "price: 1000, percent: 100", "expected": "0", "result": "失敗（1000が返った）"}, {"name": "範囲外の負値", "input": "price: 1000, percent: -10", "expected": "1000", "result": "成功"}], "options": [{"id": "o1", "label": "上限の判定に < を使っているため、percent が 100 のときだけ範囲外と見なされて割引が適用されない"}, {"id": "o2", "label": "整数除算によって端数が切り捨てられ、割引額が1円ずれている"}, {"id": "o3", "label": "負の割引率を弾いていないため、価格が増えてしまっている"}, {"id": "o4", "label": "price が 0 のときに 0 除算が発生する"}]}, "solution": {"optionId": "o1"}, "hints": ["成功したテストと失敗したテストの入力の違いを見てください。違いは percent の値だけです。", "要件は「100 のとき 0 円」なので、100 は有効な範囲に含まれます。実装の条件はどうなっているでしょうか。", "guard の2つめの条件が percent < 100 なので、percent = 100 は else に落ちて元の価格がそのまま返ります。"], "explanation": "失敗したテストが表しているのは「percent が上限の 100 のとき、割引後の価格は 0 円になる」という要件です。入力は境界値そのもの（percent = 100）で、境界を含むかどうかだけを検証しています。実装の guard は `percent < 100` と上限を含めていないため、percent = 100 は条件を満たさず else 側の `return price` が実行され、1000 が返ります。これが期待値 0 と食い違うため失敗します。通常の割引（20%）と負値（-10）は条件の内側・外側として正しく扱われるので成功しており、失敗が上限の境界に限定されていること自体が原因の位置を示しています。修正は `percent <= 100` とすることです。", "detail": {"concept": "境界値テストは「仕様の端」を狙って書きます。1つの比較演算子の違いはコード上ほとんど見えませんが、境界の入力だけが落ちるという形で明確に現れます。", "steps": ["要件は 0〜100 を有効とし、100 のときは 0 円。つまり上限は範囲に含まれる。", "実装は `percent >= 0, percent < 100` なので、有効範囲は 0〜99。", "percent = 100 は guard を満たさず、else の return price が実行される。", "期待値 0 に対して 1000 が返るため、このテストだけが失敗する。"], "whyCorrect": "失敗しているのは上限の境界だけであり、他の入力はすべて期待どおりです。範囲の下限や除算の丸めが原因なら、20% や負値のテストにも影響が出るはずですが、そうなっていません。", "commonMistakes": ["整数除算の丸めを疑う間違いです。1000 * 20 / 100 は 200 で割り切れており、20% のテストが成功していることからも丸めは無関係と分かります。", "「1件だけ失敗しているのだから軽微」と判断して境界を直さないまま進める間違いです。境界の誤りは仕様の誤りそのものです。", "テストの期待値のほうを 1000 に書き換えて通す対応です。仕様に反する実装を固定してしまいます。"], "takeaway": "境界だけが落ちるなら、疑うのは比較演算子の等号の有無。", "example": {"code": "func applyDiscount(price: Int, percent: Int) -> Int {\n    guard percent const state = {
  mode: "learn",
  trackId: "swift",
  quizTrackId: "swift",
  lessonId: "swift-values-types",
  quizIndex: 0,
  quizPool: [],
  answeredCurrent: false,
  difficulty: "All",
  search: "",
  stats: JSON.parse(localStorage.getItem("swiftLearningStats") || '{"answers":{},"lessonRead":{}}')
};

function saveStats(){
  localStorage.setItem("swiftLearningStats", JSON.stringify(state.stats));
  updateChrome();
}
function currentTrack(){ return DATA.find(t => t.id === state.trackId) || DATA[0]; }
function currentLesson(){ return currentTrack().lessons.find(l => l.id === state.lessonId) || currentTrack().lessons[0]; }
function allQuestions(){
  return DATA.flatMap(track => track.lessons.flatMap(lesson =>
    lesson.questions.map(q => ({...q, trackId:track.id, trackName:track.name, lessonId:lesson.id, lessonTitle:lesson.title}))
  ));
}
function wrongQuestions(){
  return allQuestions().filter(q => state.stats.answers[q.id] && state.stats.answers[q.id].lastCorrect === false);
}
function statsSummary(){
  const answers = Object.values(state.stats.answers);
  const attempts = answers.reduce((n,a)=>n+a.attempts,0);
  const correct = answers.reduce((n,a)=>n+a.correct,0);
  return {attempts, correct, accuracy:attempts ? Math.round(correct/attempts*100) : 0, unique:answers.length};
}
function updateChrome(){
  const s=statsSummary();
  document.getElementById("topProgressText").textContent = `${s.attempts}問回答`;
  document.getElementById("topAccuracy").textContent = s.attempts ? `${s.accuracy}%` : "—";
  document.getElementById("wrongBadge").textContent = wrongQuestions().length;
  document.getElementById("quizCountBadge").textContent = allQuestions().length;
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function codeBlock(code){
  return `<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>${escapeHtml(code)}</code></pre>`;
}
async function copyCode(btn){
  const text=btn.nextElementSibling.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent="Copied"; setTimeout(()=>btn.textContent="Copy",900); }
  catch{ btn.textContent="Select"; }
}
function renderNav(){
  const trackNav=document.getElementById("trackNav");
  const icons={starter:"✦",swift:"◆",foundation:"▤",concurrency:"⇄",development:"⌘",swiftui:"◈",uikit:"◇"};
  trackNav.innerHTML=DATA.map(t=>`<button class="track-btn ${t.id===state.trackId?'active':''}" data-track="${t.id}"><span>${icons[t.id]||"◇"}</span><span>${t.name}</span><span class="badge">${t.lessons.length}</span></button>`).join("");

  const lessonNav=document.getElementById("lessonNav");
  lessonNav.innerHTML=currentTrack().lessons.map((l,i)=>`<button class="lesson-btn ${l.id===state.lessonId?'active':''}" data-lesson="${l.id}"><span>${String(i+1).padStart(2,'0')}</span><span>${l.title}</span></button>`).join("");

  document.querySelectorAll("[data-track]").forEach(btn=>btn.onclick=()=>{
    state.trackId=btn.dataset.track;
    state.quizTrackId=state.trackId;
    state.lessonId=currentTrack().lessons[0].id;
    state.quizIndex=0;
    render();
  });
  document.querySelectorAll("[data-lesson]").forEach(btn=>btn.onclick=()=>{
    state.lessonId=btn.dataset.lesson;
    state.mode="learn";
    syncModeButtons();
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}
function syncModeButtons(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
}
function setMode(mode){
  state.mode=mode;
  state.quizIndex=0;
  state.answeredCurrent=false;
  if(mode==="practice") practiceState.view="home";
  syncModeButtons();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("[data-mode]").forEach(btn=>btn.onclick=()=>setMode(btn.dataset.mode));

function renderLearn(){

  content.innerHTML=`
    <div class="mobile-learn-nav">
      <select class="select" onchange="changeLearnTrack(this.value)">

    </div>

    <article class="card">

      </div>

function changeLearnTrack(id){
  state.trackId=id;
  state.quizTrackId=id;
  state.lessonId=currentTrack().lessons[0].id;
  render();
}
function changeLearnLesson(id){
  state.lessonId=id;
  render();
}
function goLesson(delta){
  const t=currentTrack(), idx=t.lessons.findIndex(l=>l.id===state.lessonId);
  const next=t.lessons[idx+delta];
  if(next){ state.lessonId=next.id; render(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function startLessonQuiz(){
  const l=currentLesson();
  state.quizTrackId=state.trackId;
  state.quizPool=l.questions.map(q=>({...q,trackId:state.trackId,trackName:currentTrack().name,lessonId:l.id,lessonTitle:l.title}));
  state.quizIndex=0; state.mode="quiz"; state.answeredCurrent=false; syncModeButtons(); renderQuiz(true);
}
function buildQuizPool(review=false){
  let pool=review?wrongQuestions():allQuestions().filter(q=>state.quizTrackId==="all" || q.trackId===state.quizTrackId);
  if(state.difficulty!=="All") pool=pool.filter(q=>q.difficulty===state.difficulty);
  if(state.search){
    const s=state.search.toLowerCase();
    pool=pool.filter(q=>(q.prompt+" "+q.code+" "+q.lessonTitle).toLowerCase().includes(s));
  }
  state.quizPool=pool;
  if(state.quizIndex>=pool.length) state.quizIndex=0;
}
function renderQuiz(prebuilt=false, review=false){
  if(!prebuilt) buildQuizPool(review);

  const q=state.quizPool[state.quizIndex];
  const title=review?"間違い復習":"コード読解";
  if(!q){
    content.innerHTML=`
      ${quizToolbar(review)}
      <div class="card empty">
        <h2>${review?"復習する問題はありません":"条件に合う問題がありません"}</h2>
        <p>${review?"間違えた問題がここに自動で集まります。":"フィルターを変更してください。"}</p>
        ${review?'<button class="btn primary" onclick="setMode(\'quiz\')">問題を解く</button>':''}
      </div>`;

    ${quizToolbar(review)}
    <section class="quiz-card">
      <div class="quiz-meta">
        <span class="level">${q.difficulty}</span>
        <span>${q.trackName} › ${q.lessonTitle}</span>
        <span>·</span><span>${state.quizIndex+1}/${state.quizPool.length}</span>
      </div>
      <div class="progressbar"><div style="width:${progress}%"></div></div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow">${title}</div>
        <h2>${escapeHtml(q.prompt)}</h2>
        <div class="quiz-code">${codeBlock(q.code)}</div>
        <div class="choices">
          ${q.choices.map((c,i)=>`<button class="choice" data-choice="${i}" onclick="answerQuiz(${i})"><span class="choice-key">${i+1}</span><span>${escapeHtml(c)}</span></button>`).join("")}
        </div>
        <div id="feedback" class="feedback"></div>
        <div id="detailHost"></div>
        <div class="quiz-footer">
          <span class="muted"><span class="kbd">1–4</span> 回答　<span class="kbd">N</span> 次へ</span>
          <button id="nextBtn" class="btn primary" onclick="nextQuestion()" disabled>次の問題 →</button>
        </div>
      </div>
    </section>`;
  state.answeredCurrent=false;
}
function quizToolbar(review){

    <select class="select" id="trackSelect" onchange="changeQuizTrack(this.value)" ${review?'disabled':''}>
      <option value="all" ${state.quizTrackId==="all"?'selected':''}>全トラック</option>${DATA.map(t=>`<option value="${t.id}" ${t.id===state.quizTrackId?'selected':''}>${t.name}</option>`).join("")}

function changeQuizTrack(v){ state.quizTrackId=v; state.quizIndex=0; renderQuiz(false,state.mode==="review");}

function shuffleQuiz(){
  buildQuizPool(state.mode==="review");
  for(let i=state.quizPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.quizPool[i],state.quizPool[j]]=[state.quizPool[j],state.quizPool[i]];}
  state.quizIndex=0; renderQuiz(true,state.mode==="review");
}
function answerQuiz(index){
  if(state.answeredCurrent) return;
  const q=state.quizPool[state.quizIndex];
  if(!q) return;
  state.answeredCurrent=true;
  const correct=index===q.answer;
  const prev=state.stats.answers[q.id]||{attempts:0,correct:0,lastCorrect:false};
  prev.attempts++; if(correct) prev.correct++; prev.lastCorrect=correct; state.stats.answers[q.id]=prev; saveStats();

  document.querySelectorAll(".choice").forEach((el,i)=>{
    if(i===q.answer) el.classList.add("correct");
    else if(i===index) el.classList.add("wrong");
    else el.classList.add("dim");
    el.disabled=true;
  });
  const fb=document.getElementById("feedback");
  fb.className=`feedback show ${correct?'correct':'wrong'}`;
  fb.innerHTML=`<strong>${correct?'正解 ✓':'不正解 — 正解は '+String.fromCharCode(65+q.answer)}</strong>${escapeHtml(q.explanation)}`;
  renderDetail(q);
  document.getElementById("nextBtn").disabled=false;
}
// detail は任意。存在するセクションだけを描画し、文字列は必ず escape する。
function detailSections(d){
  const s=[];
  if(d.concept) s.push(`<h4>用語・考え方</h4><p>${escapeHtml(d.concept)}</p>`);
  if(d.steps?.length) s.push(`<h4>コードの流れ</h4><ol>${d.steps.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ol>`);
  if(d.whyCorrect) s.push(`<h4>正解になる理由</h4><p>${escapeHtml(d.whyCorrect)}</p>`);
  if(d.otherChoices?.length) s.push(`<h4>他の選択肢</h4>${d.otherChoices.map(o=>`<div class="detail-choice"><strong>${escapeHtml(o.choice||"")}</strong>${escapeHtml(o.reason||"")}</div>`).join("")}`);
  if(d.example?.code||d.example?.explanation){
    s.push(`<h4>関連例</h4>`);
    if(d.example.code) s.push(codeBlock(d.example.code));
    if(d.example.output) s.push(`<div class="detail-output">出力: ${escapeHtml(d.example.output)}</div>`);
    if(d.example.explanation) s.push(`<p style="margin-top:10px">${escapeHtml(d.example.explanation)}</p>`);
  }
  if(d.takeaway) s.push(`<div class="detail-takeaway"><strong>覚えておくこと</strong>${escapeHtml(d.takeaway)}</div>`);
  return s.join("");
}
function renderDetail(q){
  const host=document.getElementById("detailHost");
  if(!host) return;
  const body=q.detail?detailSections(q.detail):"";
  host.innerHTML=body
    ? `<button class="detail-toggle" id="detailToggle" aria-expanded="false" aria-controls="detailPanel" onclick="toggleDetail()">詳しい解説を見る</button>
       <div class="detail-panel" id="detailPanel">${body}</div>`
    : "";
}
function toggleDetail(){
  const panel=document.getElementById("detailPanel"), btn=document.getElementById("detailToggle");
  if(!panel||!btn) return;
  const open=panel.classList.toggle("show");
  btn.textContent=open?"詳しい解説を閉じる":"詳しい解説を見る";
  btn.setAttribute("aria-expanded",String(open));
}
function nextQuestion(){
  if(!state.answeredCurrent) return;
  if(state.quizPool.length===0) return;
  state.quizIndex=(state.quizIndex+1)%state.quizPool.length;

}

function renderDashboard(){

// 100=ヒントなし / 85=ヒント1 / 65=ヒント2 / 45=ヒント3 / 0=解答を見た
function practiceScore(hintLevel, solutionShown){
  if(solutionShown) return 0;
  return [100,85,65,45][Math.min(hintLevel,3)];
}
function practiceSummary(){
  let solved=0, review=0, mastered=0, noHint=0, attempted=0;
  CHALLENGES.forEach(c=>{
    const r=practiceRecord(c.id);
    if(!r || !r.attempts) return;
    attempted++;
    if(r.solved) solved++;
    if(r.needsReview) review++;
    if(r.bestScore>=MASTERY_SCORE) mastered++;
    if(r.bestScore===100) noHint++;
  });
  return {
    total:CHALLENGES.length, solved, review, mastered, attempted, noHint,
    masteryPct: CHALLENGES.length ? Math.round(mastered/CHALLENGES.length*100) : 0,
    noHintPct: solved ? Math.round(noHint/solved*100) : 0
  };
}

    if(f.track!=="all" && c.track!==f.track) return false;
    if(f.type!=="all" && c.type!==f.type) return false;
    if(f.group!=="all" && (TYPE_INFO[c.type]||{}).group!==f.group) return false;
    if(f.level!=="all" && String(c.difficulty)!==f.level) return false;
    if(f.skill!=="all" && !(c.skills||[]).includes(f.skill)) return false;

/* ---------- 挑戦画面 ---------- */
function openChallenge(id){
  const ch=challengeById(id);
  if(!ch) return;
  practiceState.view="challenge";
  practiceState.challengeId=id;
  resetAttempt(ch);
  renderPracticeChallenge();
  window.scrollTo({top:0,behavior:"smooth"});
}
function resetAttempt(ch){
  practiceState.work=initWork(ch);
  practiceState.hintLevel=0;
  practiceState.solutionShown=false;
  practiceState.result=null;
  practiceState.checked=false;
  practiceState.picked=null;
}
function initWork(ch){
  const c=ch.content||{};
  switch(ch.type){
    case "reorder":
      return {order:(c.blocks||[]).map(b=>b.id), pool:[]};
    case "trace":
      return c.mode==="sequence" ? {order:(c.blocks||[]).map(b=>b.id), pool:[]} : {choice:null};
    case "chooseBlocks":
    case "buildFunction":
      return {order:[], pool:(c.blocks||[]).map(b=>b.id)};
    case "fillBlank":
      return {blanks:{}};
    case "matching":
      return {pairs:{}};
    case "shortCode":
      return {text:""};
    default:
      return {choice:null};
  }
}
function usesOrdering(ch){
  return ch.type==="reorder" || ch.type==="chooseBlocks" || ch.type==="buildFunction" ||
    (ch.type==="trace" && (ch.content||{}).mode==="sequence");
}
function usesPool(ch){ return ch.type==="chooseBlocks" || ch.type==="buildFunction"; }

function arraysEqual(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  return a.every((x,i)=>x===b[i]);
}
function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  const sa=[...a].sort(), sb=[...b].sort();
  return sa.every((x,i)=>x===sb[i]);
}
// コンパイラを持たないため、空白・改行・インデントの差だけを吸収する保守的な正規化にとどめる
function normalizeCode(text){
  return String(text==null?"":text)
    .replace(/\r\n/g,"\n")
    .split("\n").map(line=>line.trim()).filter(line=>line.length>0)
    .join("\n").replace(/[ \t]+/g," ");
}
function evaluateChallenge(ch, work){
  const s=ch.solution||{};
  const w=work||{};
  switch(ch.type){
    case "reorder": return arraysEqual(w.order, s.order);
    case "buildFunction": return arraysEqual(w.order, s.order);
    case "chooseBlocks":
      return (ch.content||{}).requireOrder ? arraysEqual(w.order, s.order) : sameSet(w.order, s.selected||s.order);
    case "trace":
      return (ch.content||{}).mode==="sequence" ? arraysEqual(w.order, s.order) : w.choice===s.optionId;
    case "fillBlank":
      return Object.keys(s.answers||{}).every(k=>(w.blanks||{})[k]===s.answers[k]);
    case "matching":
      return Object.keys(s.pairs||{}).every(k=>(w.pairs||{})[k]===s.pairs[k]);
    case "shortCode":
      return (s.accepted||[]).some(a=>normalizeCode(a)===normalizeCode(w.text));
    default:
      return w.choice===s.optionId;
  }
}
function answerReady(ch, work){
  const w=work||{};
  switch(ch.type){
    case "reorder": return true;
    case "trace": return (ch.content||{}).mode==="sequence" ? true : w.choice!=null;
    case "chooseBlocks":
    case "buildFunction": return (w.order||[]).length>0;
    case "fillBlank": return ((ch.content||{}).blanks||[]).every(b=>(w.blanks||{})[b.id]);
    case "matching": return ((ch.content||{}).left||[]).every(l=>(w.pairs||{})[l.id]);
    case "shortCode": return normalizeCode(w.text).length>0;
    default: return w.choice!=null;
  }
}

/* ---------- ワークスペースの描画 ---------- */
function blockRow(ch, id, idx, total, opts){
  const b=blockById(ch,id) || {id, code:""};
  const inPool=opts.pool;
  const label=inPool?"候補":"解答";
  const pos=inPool?"":`（現在 ${idx+1} / ${total} 番目）`;
  const actions = inPool
    ? `<button class="picon" data-act="add" data-id="${escapeHtml(id)}" aria-label="このブロックを解答に追加${pos}" ${opts.locked?"disabled":""}>＋</button>`
    : `<button class="picon" data-act="up" data-id="${escapeHtml(id)}" aria-label="上へ移動 ${pos}" ${opts.locked||idx===0?"disabled":""}>↑</button>
       <button class="picon" data-act="down" data-id="${escapeHtml(id)}" aria-label="下へ移動 ${pos}" ${opts.locked||idx===total-1?"disabled":""}>↓</button>
       ${opts.removable?`<button class="picon" data-act="remove" data-id="${escapeHtml(id)}" aria-label="このブロックを候補に戻す" ${opts.locked?"disabled":""}>×</button>`:""}`;
  const picked=practiceState.picked===id;
  return `<div class="pblock ${picked?"picked":""}" data-block="${escapeHtml(id)}" data-zone="${inPool?"pool":"order"}" ${opts.locked?"":'draggable="true"'} role="listitem" aria-label="${escapeHtml(label)} ${inPool?"":String(idx+1)+"番目"}: ${escapeHtml(b.code)}">
    <span class="pblock-index" aria-hidden="true">${inPool?"·":idx+1}</span>
    <button class="pblock-code" data-act="${inPool?"add":"pick"}" data-id="${escapeHtml(id)}" style="border:0;background:transparent;color:inherit;text-align:left;padding:0" aria-pressed="${picked?"true":"false"}" ${opts.locked?"disabled":""}>${escapeHtml(b.code)}</button>
    <span class="pblock-actions">${actions}</span>
  </div>`;
}
function orderingHtml(ch){
  const w=practiceState.work;
  const locked=practiceState.checked||practiceState.solutionShown;
  const pool=usesPool(ch);
  const orderRows=(w.order||[]).map((id,i)=>blockRow(ch,id,i,(w.order||[]).length,{pool:false,removable:pool,locked})).join("");
  const poolRows=(w.pool||[]).map(id=>blockRow(ch,id,0,0,{pool:true,locked})).join("");
  return `
    ${pool?`<div class="pslot-label">候補ブロック（不要なものが混ざっています）</div>
      <div class="pblock-list" role="list" aria-label="候補ブロック">${poolRows || `<div class="pempty-slot">候補は残っていません</div>`}</div>`:""}
    <div class="pslot-label">${pool?"解答（上から順に実行されます）":"この順番で実行されるように並べ替えます"}</div>
    <div class="pblock-list" role="list" aria-label="解答ブロック">${orderRows || `<div class="pempty-slot">候補から必要なブロックを ＋ で追加してください</div>`}</div>
    <p class="pnote">ドラッグでも、↑↓ボタンでも並べ替えられます。コードをタップして選び、別のブロックをタップすると入れ替わります。</p>`;
}
function choiceOptions(ch){
  const c=ch.content||{};
  if(ch.type==="bugHunt") return (c.lines||[]).map((l,i)=>({id:l.id, code:l.code, line:i+1}));
  return (c.options||[]).map(o=>({id:o.id, code:o.code, label:o.label}));
}
function choiceHtml(ch){
  const w=practiceState.work;
  const locked=practiceState.checked||practiceState.solutionShown;
  const sol=(ch.solution||{}).optionId;
  if(ch.type==="bugHunt"){
    const rows=choiceOptions(ch).map(o=>{
      let cls="";
      if(practiceState.checked){
        if(o.id===sol) cls="correct";
        else if(o.id===w.choice) cls="wrong";
      }else if(o.id===w.choice) cls="picked";
      return `<button class="pline ${cls}" data-act="choose" data-id="${escapeHtml(o.id)}" aria-pressed="${o.id===w.choice?"true":"false"}" ${locked?"disabled":""}>
        <span class="pline-no" aria-hidden="true">${o.line}</span><span class="pline-code">${escapeHtml(o.code)}</span></button>`;
    }).join("");
    return `<div class="pcode-frame" role="group" aria-label="問題のあるコード。行を選択してください">${rows}</div>
      <p class="pnote">おかしいと思う行を1つ選んでください。行番号ボタンはキーボードでも選択できます。</p>`;
  }
  const rows=choiceOptions(ch).map((o,i)=>{
    let cls="";
    if(practiceState.checked){
      if(o.id===sol) cls="correct";
      else if(o.id===w.choice) cls="wrong";
    }else if(o.id===w.choice) cls="picked";
    const body=o.code!=null
      ? `<span class="pchoice-code">${escapeHtml(o.code)}</span>`
      : `<span>${escapeHtml(o.label||"")}</span>`;
    return `<button class="pchoice ${cls}" data-act="choose" data-id="${escapeHtml(o.id)}" aria-pressed="${o.id===w.choice?"true":"false"}" ${locked?"disabled":""}>
      <span class="pchoice-key" aria-hidden="true">${String.fromCharCode(65+i)}</span>
      <span class="pchoice-body">${body}</span></button>`;

}
function fillBlankHtml(ch){
  const c=ch.content||{};
  const w=practiceState.work;
  const locked=practiceState.checked||practiceState.solutionShown;
  const blanks={};
  (c.blanks||[]).forEach(b=>{ blanks[b.id]=b; });
  const parts=String(c.template||"").split(/(\{\{[^}]+\}\})/g);
  const html=parts.map(part=>{
    const m=part.match(/^\{\{([^}]+)\}\}$/);
    if(!m) return escapeHtml(part);
    const b=blanks[m[1]] || {id:m[1], options:[]};
    const value=(w.blanks||{})[b.id]||"";
    return `<select class="blank-select ${value?"filled":""}" data-blank="${escapeHtml(b.id)}" aria-label="空欄 ${escapeHtml(b.id)}" ${locked?"disabled":""}>

      ${(b.options||[]).map(o=>`<option value="${escapeHtml(o)}" ${o===value?"selected":""}>${escapeHtml(o)}</option>`).join("")}

  }).join("");

}
function matchingHtml(ch){

function shortCodeHtml(ch){

function testTableHtml(ch){
  const c=ch.content||{};
  if(!(c.tests||[]).length) return "";
  return `<table class="ptests"><thead><tr><th>テスト</th><th>入力</th><th>期待値</th><th>結果</th></tr></thead><tbody>
    ${c.tests.map(t=>`<tr><td>${escapeHtml(t.name||"")}</td><td>${escapeHtml(t.input||"")}</td><td>${escapeHtml(t.expected||"")}</td><td>${escapeHtml(t.result||"—")}</td></tr>`).join("")}
  </tbody></table>`;
}
function workspaceHtml(ch){
  const c=ch.content||{};
  let head="";
  if(c.requirement) head+=`<div class="mental"><strong>要件</strong><br>${escapeHtml(c.requirement)}</div>`;
  if(c.code) head+=codeBlock(c.code);
  if((c.tests||[]).length) head+=testTableHtml(ch);
  let body="";
  if(usesOrdering(ch)) body=orderingHtml(ch);
  else if(ch.type==="fillBlank") body=fillBlankHtml(ch);
  else if(ch.type==="matching") body=matchingHtml(ch);
  else if(ch.type==="shortCode") body=shortCodeHtml(ch);
  else body=choiceHtml(ch);
  return head+body;
}

/* ---------- 解説・ヒント ---------- */
function practiceDetailHtml(ch){
  const d=ch.detail||{};
  const s=[];
  if(d.concept) s.push(`<h4>使っている考え方</h4><p>${escapeHtml(d.concept)}</p>`);
  if((d.steps||[]).length) s.push(`<h4>順を追って考える</h4><ol>${d.steps.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ol>`);
  if(d.whyCorrect) s.push(`<h4>この解答で動く理由</h4><p>${escapeHtml(d.whyCorrect)}</p>`);
  if((d.commonMistakes||[]).length) s.push(`<h4>よくある間違いと、その結果おきること</h4><ul>${d.commonMistakes.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>`);
  const ex=d.example||{};
  if(ex.code||ex.explanation){
    s.push(`<h4>関連例</h4>`);
    if(ex.code) s.push(codeBlock(ex.code));
    if(ex.output) s.push(`<div class="detail-output">出力: ${escapeHtml(ex.output)}</div>`);
    if(ex.explanation) s.push(`<p style="margin-top:10px">${escapeHtml(ex.explanation)}</p>`);
  }
  if(d.takeaway) s.push(`<div class="detail-takeaway"><strong>覚えておくこと</strong>${escapeHtml(d.takeaway)}</div>`);
  return s.join("");
}
function solutionHtml(ch){
  const s=ch.solution||{};
  let out="";
  if(usesOrdering(ch)){
    const code=(s.order||[]).map(id=>(blockById(ch,id)||{}).code||"").join("\n");
    out+=`<h4>正しい並び</h4>${codeBlock(code)}`;
  }else if(ch.type==="fillBlank"){
    const filled=String((ch.content||{}).template||"").replace(/\{\{([^}]+)\}\}/g,(m,k)=>(s.answers||{})[k]||m);
    out+=`<h4>埋めたあとのコード</h4>${codeBlock(filled)}`;
  }else if(ch.type==="matching"){
    const right={};
    ((ch.content||{}).right||[]).forEach(r=>{ right[r.id]=r.label; });
    out+=`<h4>正しい対応</h4><ul>${((ch.content||{}).left||[]).map(l=>`<li>${escapeHtml(l.label)} → ${escapeHtml(right[(s.pairs||{})[l.id]]||"")}</li>`).join("")}</ul>`;
  }else if(ch.type==="shortCode"){
    out+=`<h4>想定している書き方</h4>${codeBlock((s.accepted||[""])[0])}`;
    if((s.accepted||[]).length>1) out+=`<p class="pnote">これ以外に ${s.accepted.length-1} 通りの書き方も正解として受け付けます。</p>`;
  }else{
    const opt=choiceOptions(ch).find(o=>o.id===s.optionId);
    if(opt) out+=`<h4>正解</h4>${opt.code!=null?codeBlock(opt.code):`<p>${escapeHtml(opt.label||"")}</p>`}`;
  }
  if(s.fixedCode) out+=`<h4>修正後のコード</h4>${codeBlock(s.fixedCode)}`;
  return out;
}
function hintsHtml(ch){
  const shown=(ch.hints||[]).slice(0,practiceState.hintLevel);

  return `<div class="phints">${shown.map((h,i)=>`<div class="phint"><strong>ヒント${i+1}</strong>${escapeHtml(h)}</div>`).join("")}</div>`;

function feedbackHtml(ch){

}

function updateWorkspace(){
  const ch=currentChallenge();
  const host=document.getElementById("pWork");
  if(!ch||!host) return;
  host.innerHTML=workspaceHtml(ch);
  bindWorkspace();
}
function bindChallenge(){
  document.querySelectorAll("[data-pact]").forEach(el=>{
    el.addEventListener("click",()=>{
      const act=el.dataset.pact;
      if(act==="back"){ practiceState.view="home"; renderPracticeHome(); window.scrollTo({top:0,behavior:"smooth"}); }
      else if(act==="open") openChallenge(el.dataset.id);
      else if(act==="check") practiceCheck();
      else if(act==="hint") practiceHint();
      else if(act==="retry") practiceRetry();
      else if(act==="reveal") practiceReveal();
    });
  });
  bindWorkspace();
}
function bindWorkspace(){
  const root=document.getElementById("pWork");
  if(!root) return;
  const ch=currentChallenge();
  root.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click",()=>handleWorkAct(ch, el.dataset.act, el.dataset.id));
  });
  root.querySelectorAll("[data-blank]").forEach(sel=>{
    sel.addEventListener("change",()=>{
      practiceState.work.blanks[sel.dataset.blank]=sel.value;
      sel.classList.toggle("filled", !!sel.value);
    });
  });
  root.querySelectorAll("[data-match]").forEach(sel=>{
    sel.addEventListener("change",()=>{ practiceState.work.pairs[sel.dataset.match]=sel.value; });
  });
  const ta=document.getElementById("pShortInput");
  if(ta) ta.addEventListener("input",()=>{ practiceState.work.text=ta.value; });
  bindDragAndDrop(root, ch);
}
function bindDragAndDrop(root, ch){
  if(!ch||!usesOrdering(ch)) return;
  let dragId=null;
  root.querySelectorAll("[data-block]").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      dragId=el.dataset.block;
      el.classList.add("dragging");
      if(e.dataTransfer){ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragId); }
    });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); dragId=null; });
    el.addEventListener("dragover",e=>{ e.preventDefault(); el.classList.add("dropover"); });
    el.addEventListener("dragleave",()=>el.classList.remove("dropover"));
    el.addEventListener("drop",e=>{
      e.preventDefault();
      el.classList.remove("dropover");
      const from=dragId || (e.dataTransfer?e.dataTransfer.getData("text/plain"):null);
      const to=el.dataset.block;
      if(from && to && from!==to) dropBlock(from, to, el.dataset.zone);
    });
  });
}
function dropBlock(fromId, toId, zone){
  const w=practiceState.work;
  if(zone==="pool"){
    if((w.order||[]).includes(fromId)){ removeFromOrder(fromId); updateWorkspace(); }
    return;
  }
  if(!(w.order||[]).includes(fromId)){
    addToOrderAt(fromId, w.order.indexOf(toId));
    updateWorkspace();
    return;
  }
  const from=w.order.indexOf(fromId), to=w.order.indexOf(toId);
  if(from<0||to<0) return;
  w.order.splice(from,1);
  w.order.splice(to,0,fromId);
  updateWorkspace();
}
function addToOrderAt(id, index){
  const w=practiceState.work;
  w.pool=(w.pool||[]).filter(x=>x!==id);
  const at=index<0?w.order.length:index;
  w.order.splice(at,0,id);
}
function removeFromOrder(id){
  const w=practiceState.work;
  w.order=(w.order||[]).filter(x=>x!==id);
  if(!(w.pool||[]).includes(id)) w.pool.push(id);
}
function handleWorkAct(ch, act, id){
  if(practiceState.checked||practiceState.solutionShown) return;
  const w=practiceState.work;
  if(act==="choose"){ w.choice=id; updateWorkspace(); return; }
  if(act==="add"){ addToOrderAt(id,-1); practiceState.picked=null; updateWorkspace(); return; }
  if(act==="remove"){ removeFromOrder(id); practiceState.picked=null; updateWorkspace(); return; }
  if(act==="up"||act==="down"){
    const i=w.order.indexOf(id);
    const j=act==="up"?i-1:i+1;
    if(i<0||j<0||j>=w.order.length) return;
    [w.order[i],w.order[j]]=[w.order[j],w.order[i]];
    updateWorkspace();
    setTimeout(()=>{
      const el=document.querySelector(`[data-block="${CSS.escape(id)}"] [data-act="${act}"]`);
      if(el && !el.disabled) el.focus();
    },0);
    return;
  }
  if(act==="pick"){
    if(practiceState.picked===id){ practiceState.picked=null; }
    else if(practiceState.picked){
      const a=w.order.indexOf(practiceState.picked), b=w.order.indexOf(id);
      if(a>=0&&b>=0){ [w.order[a],w.order[b]]=[w.order[b],w.order[a]]; }
      practiceState.picked=null;
    }else{
      practiceState.picked=id;
    }
    updateWorkspace();
  }
}
function practiceHint(){
  const ch=currentChallenge();
  if(!ch) return;
  if(practiceState.hintLevel>=(ch.hints||[]).length) return;
  practiceState.hintLevel++;
  renderPracticeChallenge();
}
function practiceRetry(){
  const ch=currentChallenge();
  if(!ch) return;
  resetAttempt(ch);
  renderPracticeChallenge();
  window.scrollTo({top:0,behavior:"smooth"});
}
function practiceReveal(){
  const ch=currentChallenge();
  if(!ch) return;
  if(!confirm("解答と解説を表示します。この回はスコアに数えません。表示しますか？")) return;
  practiceState.solutionShown=true;
  const rec=recordFor(ch.id);
  rec.solutionViewed=true;
  rec.lastResult="revealed";
  rec.needsReview=true;
  practiceStats.challenges[ch.id]=rec;
  savePracticeStats();
  renderPracticeChallenge();
}
function recordFor(id){
  return practiceStats.challenges[id] ||
    {attempts:0, solved:false, bestScore:0, hintsUsed:0, solutionViewed:false, lastResult:null, needsReview:true};
}
function practiceCheck(){
  const ch=currentChallenge();
  if(!ch || practiceState.checked || practiceState.solutionShown) return;
  if(!answerReady(ch, practiceState.work)){
    alert("まだ回答が入力されていません。すべての選択を終えてから答え合わせしてください。");
    return;
  }
  const ok=evaluateChallenge(ch, practiceState.work);
  const score=ok?practiceScore(practiceState.hintLevel, practiceState.solutionShown):0;
  const rec=recordFor(ch.id);
  rec.attempts++;
  rec.hintsUsed=practiceState.hintLevel;
  if(ok){
    rec.solved=true;
    rec.bestScore=Math.max(rec.bestScore||0, score);
    rec.lastResult="correct";
  }else{
    rec.lastResult="wrong";
  }
  rec.needsReview=!(rec.lastResult==="correct" && (rec.bestScore||0)>=MASTERY_SCORE);
  practiceStats.challenges[ch.id]=rec;
  savePracticeStats();
  practiceState.checked=true;
  practiceState.result=ok?"correct":"wrong";
  renderPracticeChallenge();
}
/* ---------- 次に解く問題の推薦（決定的。乱数も外部APIも使わない） ---------- */
function recommendNext(){
  const unsolved=c=>practiceStatus(c.id)==="unsolved";
  // 1) 途中まで進んでいるシリーズの続き
  const seriesIds=[];
  CHALLENGES.forEach(c=>{ if(c.seriesId && !seriesIds.includes(c.seriesId)) seriesIds.push(c.seriesId); });
  for(const sid of seriesIds){
    const items=seriesOf(sid);
    const done=items.filter(x=>practiceStatus(x.id)==="solved").length;
    if(done>0 && done<items.length){
      const next=items.find(unsolved);
      if(next) return {challenge:next, reason:"進行中のシリーズの続きです"};
    }
  }
  // 2) 要復習
  const review=CHALLENGES.find(c=>practiceStatus(c.id)==="review");
  if(review) return {challenge:review, reason:"前回クリアできていないため復習しましょう"};
  // 3) 学習中トラックの、いちばんやさしい未挑戦問題
  const order=[state.trackId, ...DATA.map(t=>t.id)];
  for(const tid of order){
    const pool=CHALLENGES.filter(c=>c.track===tid && unsolved(c));
    if(pool.length){
      const next=pool.reduce((a,b)=>b.difficulty<a.difficulty?b:a);
      return {challenge:next, reason:`${trackNameOf(tid)}の次のステップです`};
    }
  }
  return null;
}
function recommendationCard(){
  const rec=recommendNext();
  if(!rec) return `<div class="pnext"><strong>300問すべてクリアしました</strong><span class="muted">要復習も残っていません。</span></div>`;
  const c=rec.challenge;
  return `<div class="pnext">
    <div class="eyebrow">次におすすめ</div>
    <div class="pcard-title">${escapeHtml(c.title)}</div>
    <div class="pcard-meta">
      <span class="ptag lv${c.difficulty}">${escapeHtml(LEVEL_LABELS[c.difficulty]||"")}</span>
      <span class="ptag">${escapeHtml((TYPE_INFO[c.type]||{}).label||c.type)}</span>
      <span class="ptag">${escapeHtml(trackNameOf(c.track))}</span>
    </div>
    <div class="muted" style="font-size:13px">${escapeHtml(rec.reason)}</div>
    <div><button class="btn primary" data-pact="open" data-id="${escapeHtml(c.id)}">この問題を解く →</button></div>
  </div>`;
}
function renderPractice(){
  if(practiceState.view==="challenge" && currentChallenge()) renderPracticeChallenge();
  else renderPracticeHome();
}

function render(){
  renderNav();
  document.getElementById("lessonNav").style.display=state.mode==="learn"?"block":"none";
  document.getElementById("lessonLabel").style.display=state.mode==="learn"?"block":"none";
  if(state.mode==="learn") renderLearn();
  else if(state.mode==="quiz") renderQuiz();
  else if(state.mode==="practice") renderPractice();
  else if(state.mode==="review") renderReview();
  else renderDashboard();
  updateChrome();
  updatePracticeChrome();
}
document.addEventListener("keydown",e=>{
  if((state.mode==="quiz"||state.mode==="review") && !["INPUT","SELECT"].includes(document.activeElement.tagName)){
    if(["1","2","3","4"].includes(e.key)) answerQuiz(Number(e.key)-1);
    if((e.key==="n"||e.key==="N") && state.answeredCurrent) nextQuestion();
  }
});
const themeBtn=document.getElementById("themeBtn");
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  localStorage.setItem("swiftLearningTheme",theme);
}
const savedTheme=localStorage.getItem("swiftLearningTheme");
applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

render();
</script>
