led フラグを true にする。", "ループは計算だけで中断点を持たないため、フラグを確認する機会がない。", "結果として100万回まわり切り、「完了」が出力される。", "ループ内で `Task.isCancelled` を見れば、次の周回で抜けられる。"], "whyCorrect": "止まらない原因は、長時間まわる処理に確認がないことです。cancel() の呼び出し（7行目）自体は正しく、確認を追加すべきなのはループ側です。", "commonMistakes": ["await を含む処理ならキャンセルが自動的に効くと考える間違いです。標準ライブラリの一部（Task.sleep など）はキャンセルを検知しますが、自分の計算ループは対象外です。", "毎周回の確認がコストになると心配する間違いです。isCancelled の読み取りは十分に軽く、1000回に1回に間引く必要は通常ありません。"], "takeaway": "cancel() はフラグを立てるだけ。長い処理は自分で isCancelled を見る。", "example": {"code": "let task = Task { () -> String in\n    for _ in 1...1_000_000 {\n        if Task.isCancelled { return \"中断\" }\n    }\n    return \"完了\"\n}\ntask.cancel()\nprint(await task.value)", "output": "中断", "explanation": "ループ内で確認を入れると、キャンセルに反応して途中で抜けられます。"}}, "seriesId": "concurrency-cancel", "seriesStep": 2}, {"id": "practice-concurrency-021", "track": "concurrency", "lessonId": "concurrency-task-cancel", "type": "chooseBlocks", "difficulty": 3, "title": "中断を呼び出し元に伝える行を選ぶ", "prompt": "キャンセルされたら、そのことをエラーとして呼び出し元に伝えたいです。必要な行だけを選び、正しい順に並べてください。", "skills": ["concurrency", "errors"], "content": {"blocks": [{"id": "b1", "code": "let task = Task {"}, {"id": "b2", "code": "    for i in 1...5 {"}, {"id": "b3", "code": "        try Task.checkCancellation()"}, {"id": "b4", "code": "        print(i)"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "        if Task.isCancelled { break }"}, {"id": "b8", "code": "    while true {"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5", "b6"], "order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["「エラーとして伝える」ので、Bool を見て break する形では要件を満たしません。", "キャンセル済みならエラーを投げるメソッドがあります。", "回数の決まったループなので、無限ループにする必要はありません。"], "explanation": "`try Task.checkCancellation()` はキャンセル済みなら CancellationError を投げるため、呼び出し元は `task.value` を await したときにエラーとして受け取れます。`if Task.isCancelled { break }` はループを抜けるだけで、呼び出し元からは正常終了と区別がつきません。中断されたことを上位に伝えて処理を分岐させたいなら、エラーとして投げるほうが適切です。`while true` は回数が決まっているこの場面では不要です。", "detail": {"concept": "中断の伝え方には「静かに終わる」と「エラーとして伝える」の2通りがあります。呼び出し元が中断を区別して扱う必要があるなら、後者を選びます。", "steps": ["`Task { ... }` の中は throws なクロージャとして扱える。", "`try Task.checkCancellation()` … キャンセル済みなら CancellationError を投げる。", "投げられたエラーはタスクの結果として保持される。", "呼び出し元は `try await task.value` で受け取り、catch で中断を判別できる。"], "whyCorrect": "checkCancellation はエラーを通じて中断を伝えるため、正常完了との区別が呼び出し元で可能になります。要件が「伝える」である以上、break では不足です。", "commonMistakes": ["break で抜けたあと、正常終了として結果を返してしまう実装です。呼び出し元は中断に気づけません。", "CancellationError を catch して握りつぶす実装も同じ問題を招きます。中断は失敗ではないため、上位で明示的に扱います。"], "takeaway": "中断を伝えるなら checkCancellation。静かに終えるだけなら isCancelled。", "example": {"code": "let task = Task {\n    for i in 1...5 { try Task.checkCancellation(); print(i) }\n}\ntask.cancel()\ndo { try await task.value; print(\"完了\") }\ncatch is CancellationError { print(\"中断された\") }\ncatch { print(\"その他\") }", "output": "中断された", "explanation": "呼び出し元が CancellationError として中断を判別できています。"}}, "seriesId": "concurrency-cancel", "seriesStep": 3}, {"id": "practice-concurrency-022", "track": "concurrency", "lessonId": "concurrency-taskgroup", "type": "reorder", "difficulty": 4, "title": "件数が可変の並行処理を並べる", "prompt": "任意の件数を同時に取得して集める関数を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["concurrency", "collections"], "content": {"blocks": [{"id": "b1", "code": "    return await withTaskGroup(of: String.self) { group in"}, {"id": "b2", "code": "func fetchAll(_ ids: [Int]) async -> [String] {"}, {"id": "b3", "code": "        for id in ids { group.addTask { await fetch(id) } }"}, {"id": "b4", "code": "        var results: [String] = []"}, {"id": "b5", "code": "        for await value in group { results.append(value) }"}, {"id": "b6", "code": "        return results"}, {"id": "b7", "code": "    }"}, {"id": "b8", "code": "}"}, {"id": "b9", "code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }"}]}, "solution": {"order": ["b9", "b2", "b1", "b4", "b3", "b5", "b6", "b7", "b8"]}, "hints": ["fetch の定義が最初に必要です。", "結果を入れる配列は、集め始める前に用意します。", "タスクを登録してから、for await で完了したものを受け取ります。"], "explanation": "`withTaskGroup(of:)` は子タスクをまとめて管理する仕組みで、件数が実行時に決まる場合に使います。`addTask` で登録した子タスクは登録した時点で走り始め、`for await value in group` で完了したものから順に受け取れます。結果を入れる配列は受け取り始める前に用意します。グループを抜けるときに全子タスクの完了が保証されるため、途中で処理が残ることはありません。", "detail": {"concept": "TaskGroup は「動的な数の子タスク」を安全に扱う構造化並行性の仕組みです。グループのスコープを抜ける時点で全子タスクの完了（またはキャンセル）が保証されます。", "steps": ["`withTaskGroup(of: String.self)` … 子タスクの戻り値の型を指定する。", "`var results: [String] = []` … 集める先を用意する。", "`group.addTask { ... }` … 子タスクを登録。登録時点で実行が始まる。", "`for await value in group` … 完了した順に結果を受け取る。", "`return results` … グループの結果として返す。"], "whyCorrect": "定義・関数宣言・グループ生成・受け皿・登録・収集・返却という依存順序が守られています。addTask より前に受け皿を用意しておくことで、収集ループがそのまま書けます。", "commonMistakes": ["for await の結果順が addTask の順と一致すると考える間違いです。完了順なので順序は保証されません。", "グループの外に子タスクの結果を持ち出そうとする間違いです。構造化並行性ではスコープ内で完結させます。"], "takeaway": "件数が可変なら TaskGroup。addTask で開始、for await で完了順に収集。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc fetchAll(_ ids: [Int]) async -> [String] {\n    return await withTaskGroup(of: String.self) { group in\n        var results: [String] = []\n        for id in ids { group.addTask { await fetch(id) } }\n        for await value in group { results.append(value) }\n        return results\n    }\n}\nprint(await fetchAll([1, 2, 3]).count)", "output": "3", "explanation": "件数は必ず一致しますが、並び順は完了順になるため count で確認しています。"}}, "seriesId": "concurrency-taskgroup", "seriesStep": 1}, {"id": "practice-concurrency-023", "track": "concurrency", "lessonId": "concurrency-taskgroup", "type": "buildFunction", "difficulty": 4, "title": "順序を保つ並行取得を組み立てる", "prompt": "並行に取得しつつ、結果を入力の順序どおりに返す関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["concurrency", "collections"], "content": {"blocks": [{"id": "b1", "code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }"}, {"id": "b2", "code": "func fetchAll(_ ids: [Int]) async -> [String] {"}, {"id": "b3", "code": "    await withTaskGroup(of: (Int, String).self) { group in"}, {"id": "b4", "code": "        var pairs: [(Int, String)] = []"}, {"id": "b5", "code": "        for id in ids { group.addTask { (id, await fetch(id)) } }"}, {"id": "b6", "code": "        for await pair in group { pairs.append(pair) }"}, {"id": "b7", "code": "        return pairs.sorted { $0.0 < $1.0 }.map(\\.1)"}, {"id": "b8", "code": "    }"}, {"id": "b9", "code": "}"}, {"id": "b10", "code": "        return pairs.map(\\.1)"}, {"id": "b11", "code": "        for id in ids { group.addTask { await fetch(id) } }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8", "b9"]}, "hints": ["完了順に届くので、あとから並べ直すための情報が必要です。", "子タスクの戻り値に、元の位置が分かるものを含めます。", "集めたあとに並べ替えてから、必要な値だけを取り出します。"], "explanation": "TaskGroup は完了した順に結果を返すため、入力の順序を保ちたい場合は子タスクの戻り値に元のID（や添字）を含めます。`(Int, String)` のタプルで返し、集めたあとに `sorted { $0.0 < $1.0 }` で並べ直してから `map(\\.1)` で値だけを取り出します。`pairs.map(\\.1)` だけでは完了順のままなので、実行のたびに順序が変わります。IDを含めない `group.addTask { await fetch(id) }` では、そもそも並べ直す手がかりがありません。", "detail": {"concept": "並行処理では順序が保証されません。順序が必要なら「順序の情報を結果に持たせて、あとで復元する」のが定石です。", "steps": ["`withTaskGroup(of: (Int, String).self)` … 戻り値の型にIDを含める。", "`group.addTask { (id, await fetch(id)) }` … 各子タスクが自分のIDを返す。", "`for await pair in group` … 完了順に受け取る（順序は不定）。", "`sorted { $0.0 < $1.0 }` … IDで並べ直す。", "`map(\\.1)` … 値だけを取り出して返す。"], "whyCorrect": "順序の情報を結果に埋め込んだため、完了順がどうであっても復元できます。並べ替えは全件そろったあとに行うので、確定した順序が得られます。", "commonMistakes": ["テストで偶然順序が合っていたために「順序は保たれる」と判断する間違いです。負荷や件数が変わると崩れます。", "共有配列に直接添字で書き込む実装は、データ競合の危険があります。結果を集めてから並べ替えるほうが安全です。"], "takeaway": "並行処理は完了順。順序が要るなら情報を持たせて後で並べ直す。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc fetchAll(_ ids: [Int]) async -> [String] {\n    await withTaskGroup(of: (Int, String).self) { group in\n        var pairs: [(Int, String)] = []\n        for id in ids { group.addTask { (id, await fetch(id)) } }\n        for await pair in group { pairs.append(pair) }\n        return pairs.sorted { $0.0 < $1.0 }.map(\\.1)\n    }\n}\nprint(await fetchAll([1, 2, 3]))", "output": "[\"item1\", \"item2\", \"item3\"]", "explanation": "並行に取得しても、並べ直しによって入力どおりの順序で返っています。"}}, "seriesId": "concurrency-taskgroup", "seriesStep": 2}, {"id": "practice-concurrency-024", "track": "concurrency", "lessonId": "concurrency-taskgroup", "type": "testReasoning", "difficulty": 4, "title": "順序のテストが不安定になる理由を読む", "prompt": "件数のテストは通るのに、順序のテストだけが実行のたびに結果が変わります。実装のどの点が要件に反していますか。", "skills": ["testing", "concurrency", "debugging"], "noRunSolution": true, "content": {"requirement": "fetchAll(ids) は、渡した ids と同じ順序で結果を返す。", "code": "func fetchAll(_ ids: [Int]) async -> [String] {\n    await withTaskGroup(of: String.self) { group in\n        for id in ids { group.addTask { await fetch(id) } }\n        var results: [String] = []\n        for await value in group { results.append(value) }\n        return results\n    }\n}", "tests": [{"name": "件数が一致する", "input": "[1, 2, 3]", "expected": "3件", "result": "成功"}, {"name": "順序が入力と一致する", "input": "[1, 2, 3]", "expected": "[item1, item2, item3]", "result": "失敗（実行のたびに並びが変わる）"}], "options": [{"id": "o1", "label": "TaskGroup は完了した順に結果を返すため、入力の順序は保証されない"}, {"id": "o2", "label": "addTask がループの外にあるため、子タスクが1件しか登録されていない"}, {"id": "o3", "label": "for await が結果を取りこぼしているため、件数が足りていない"}, {"id": "o4", "label": "async 関数は必ず直列に実行されるため、順序は常に一致するはずである"}]}, "solution": {"optionId": "o1"}, "hints": ["件数のテストは通っているので、子タスクの登録も収集も正しく行われています。", "失敗しているのは順序だけで、しかも毎回結果が違います。", "for await が値を受け取る順番は、何で決まるのかを考えてください。"], "explanation": "失敗したテストが表しているのは「入力と同じ順序で返す」という要件です。入力は普通の3件で、境界的な値ではなく、順序という性質だけを検証しています。実装では `for await value in group` が完了した子タスクから順に値を受け取るため、各 fetch の所要時間の違いによって並びが変わります。件数のテストが通っているのは、すべての子タスクが登録され、すべての結果が収集されているためで、欠落や重複は起きていません。結果が実行のたびに変わるのは並行処理の本質であり、実装のたまたまの不安定さではありません。修正は、子タスクの戻り値にIDや添字を含めて、収集後に並べ替えることです。", "detail": {"concept": "並行処理のテストでは「毎回同じ結果になるか」が重要な観点になります。たまたま通ることがあるため、1回の成功は保証になりません。", "steps": ["要件は「入力の ids と同じ順序で返すこと」。", "TaskGroup は完了順に値を返す仕様。", "所要時間はネットワークやスケジューリングで変動するため、完了順も変動する。", "結果として順序のテストだけが不安定になる。"], "whyCorrect": "件数のテストが安定して通っていることが、登録漏れや取りこぼしがないことを示しています。差が出ているのは順序だけであり、それは TaskGroup の仕様どおりの挙動です。", "commonMistakes": ["テストを何度か実行して通ったことをもって修正済みと判断する間違いです。並行処理では再現しないだけで、原因は残っています。", "テストの期待値を「順序不問」に変えて通す対応です。要件が順序を求めているなら、仕様のほうを壊しています。", "sleep を入れて順序を安定させる対応も同様です。タイミングに依存した見せかけの安定であり、本番環境では崩れます。"], "takeaway": "並行処理の順序は保証されない。順序が要件なら実装で復元する。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc fetchAllOrdered(_ ids: [Int]) async -> [String] {\n    await withTaskGroup(of: (Int, String).self) { group in\n        var pairs: [(Int, String)] = []\n        for id in ids { group.addTask { (id, await fetch(id)) } }\n        for await p in group { pairs.append(p) }\n        return pairs.sorted { $0.0 < $1.0 }.map(\\.1)\n    }\n}\nprint(await fetchAllOrdered([3, 1, 2]))", "output": "[\"item1\", \"item2\", \"item3\"]", "explanation": "IDで並べ替える実装では、何度実行しても同じ順序になります（ここではID順に整列されます）。"}}, "seriesId": "concurrency-taskgroup", "seriesStep": 3}, {"id": "practice-concurrency-025", "track": "concurrency", "lessonId": "concurrency-actor", "type": "matching", "difficulty": 2, "title": "actorまわりの記法を対応づける", "prompt": "並行処理の安全性に関する記法と、その意味を対応させてください。", "skills": ["concurrency", "types"], "content": {"left": [{"id": "l1", "label": "actor"}, {"id": "l2", "label": "await someActor.value"}, {"id": "l3", "label": "nonisolated"}, {"id": "l4", "label": "@MainActor"}], "right": [{"id": "r1", "label": "内部状態へのアクセスを1つずつに直列化する参照型"}, {"id": "r2", "label": "外から状態を読むには中断点が必要になることを表す"}, {"id": "r3", "label": "隔離を必要としないメンバーであることを示す指定"}, {"id": "r4", "label": "その処理をメインアクター上で実行することを保証する指定"}, {"id": "r5", "label": "複数スレッドから同時に扱っても安全な型であることを表すプロトコル"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["actor は class と同じ参照型ですが、状態へのアクセスに制約が加わります。", "外から actor の状態に触るときに await が必要なのは、順番待ちが発生しうるからです。", "r5 は Sendable の説明なので、この4つとは対応しません。"], "explanation": "actor は内部状態へのアクセスを直列化する参照型で、データ競合を型レベルで防ぎます。外部から状態を読むときは順番待ちが起こりうるため await が必要になります。nonisolated は隔離を必要としないメンバー（不変の値を返すだけのメソッドなど）に付ける指定で、await なしで呼べるようになります。@MainActor はメインアクター上での実行を保証する指定です。r5 は Sendable の説明で、この中には対応するものがありません。", "detail": {"concept": "Swift の並行性は「どのアクターに隔離されているか」で安全性を保証します。actor は隔離の単位、await はその境界を越える印、nonisolated は境界の外に出す指定です。", "steps": ["actor … 内部状態へのアクセスが自動的に直列化される。", "外からのアクセス … 順番待ちが起きうるため await が必要。", "nonisolated … 状態に触らないメンバーは隔離から外せる。", "@MainActor … UI 更新など、メインスレッドで行うべき処理に付ける。"], "whyCorrect": "4つはそれぞれ隔離の単位・境界の越え方・隔離の除外・特定アクターへの固定という別の役割を持ち、説明と1対1で対応します。Sendable だけは「型が安全に渡せるか」という別の軸の話です。", "commonMistakes": ["actor にすればすべてのデータ競合が消えると考える間違いです。actor の外に可変の参照型を渡してしまえば競合は起きます。", "nonisolated を「速くするための指定」と考える間違いです。状態に触るメンバーに付けるとコンパイルエラーになります。"], "takeaway": "actor は隔離の単位、await は境界を越える印。Sendable は別の軸。", "example": {"code": "actor Counter {\n    private(set) var value = 0\n    func increment() { value += 1 }\n    nonisolated let id = \"counter-1\"\n}\nlet c = Counter()\nawait c.increment()\nprint(c.id, await c.value)", "output": "counter-1 1", "explanation": "nonisolated なメンバーは await なしで読め、隔離された状態には await が必要です。"}}, "seriesId": "concurrency-actor-basics", "seriesStep": 1}, {"id": "practice-concurrency-026", "track": "concurrency", "lessonId": "concurrency-actor", "type": "fillBlank", "difficulty": 3, "title": "状態を安全に持つ型を宣言する", "prompt": "複数のタスクから同時に更新されても壊れないカウンタを作ります。空欄を埋めてください。", "skills": ["concurrency", "types"], "content": {"template": "{{1}} Counter {\n    private(set) var value = 0\n    func increment() { value += 1 }\n}\nlet c = Counter()\nawait c.increment()\nprint({{2}} c.value)", "blanks": [{"id": "1", "options": ["actor", "class", "struct", "enum"]}, {"id": "2", "options": ["await", "async", "try", "nonisolated"]}]}, "solution": {"answers": {"1": "actor", "2": "await"}}, "hints": ["class では複数タスクからの同時更新を防げません。状態を直列化する種類の型が必要です。", "その型の状態を外から読むときには、順番待ちが起こりえます。", "1つめは並行安全な参照型のキーワード、2つめは中断しうる箇所に付ける印です。"], "explanation": "`actor` は内部状態へのアクセスを自動的に直列化するため、複数のタスクから同時に increment を呼んでも値が壊れません。class では同じコードがデータ競合を起こします。actor の状態を外部から読むときは順番待ちが発生しうるため `await c.value` と書きます。struct は値型なのでコピーされ、そもそも共有された状態になりません。実行すると 1 が表示されます。", "detail": {"concept": "データ競合は「複数のスレッドが同時に同じメモリを読み書きする」ことで起きます。actor はアクセスを1つずつに直列化することで、この状況を構造的に排除します。", "steps": ["`actor Counter` … 内部状態が隔離される。", "`func increment()` … actor 内部のメソッドなので、状態に直接触れる。", "`await c.increment()` … 外部からの呼び出しは順番待ちが起きうる。", "`await c.value` … 状態の読み取りも同様に await が必要。"], "whyCorrect": "actor による直列化が同時更新を防ぎ、await によって境界を越えるアクセスが明示されます。両方そろってコンパイルが通り、かつ安全になります。", "commonMistakes": ["class に対してロックを自前で書く方法もありますが、書き忘れや順序ミスが起きやすく、actor のほうが安全です。", "actor の状態を外から `c.value` と await なしで読もうとするとコンパイルエラーになります。読み取りも境界を越える操作です。"], "takeaway": "共有される可変状態は actor に入れる。外からのアクセスには await。", "example": {"code": "actor Counter {\n    private(set) var value = 0\n    func increment() { value += 1 }\n}\nlet c = Counter()\nawait withTaskGroup(of: Void.self) { group in\n    for _ in 1...100 { group.addTask { await c.increment() } }\n}\nprint(await c.value)", "output": "100", "explanation": "100件を並行に実行しても、actor によって値が正確に100になります。"}}, "seriesId": "concurrency-actor-basics", "seriesStep": 2}, {"id": "practice-concurrency-027", "track": "concurrency", "lessonId": "concurrency-actor", "type": "bugHunt", "difficulty": 4, "title": "確認と実行が分かれている行を見つける", "prompt": "残高を確認してから引き出していますが、同時に呼ばれると残高がマイナスになることがあります。原因になっている行を選んでください。", "skills": ["concurrency", "debugging"], "content": {"lines": [{"id": "l1", "code": "actor Bank {"}, {"id": "l2", "code": "    private(set) var balance = 100"}, {"id": "l3", "code": "    func withdraw(_ n: Int) { balance -= n }"}, {"id": "l4", "code": "}"}, {"id": "l5", "code": "let bank = Bank()"}, {"id": "l6", "code": "if await bank.balance >= 100 { await bank.withdraw(100) }"}]}, "solution": {"optionId": "l6", "fixedCode": "actor Bank {\n    private(set) var balance = 100\n    func withdraw(_ n: Int) -> Bool {\n        guard balance >= n else { return false }\n        balance -= n\n        return true\n    }\n}\nlet bank = Bank()\nprint(await bank.withdraw(100), await bank.balance)"}, "hints": ["await はそこで中断しうる箇所です。中断中に他のタスクが動けます。", "この行には await が2つあります。その間に何が起こりうるでしょうか。", "残高の確認と引き出しが別々のアクセスになっているため、間に他の引き出しが割り込めます。"], "explanation": "バグは6行目です。`await bank.balance` で残高を読んだあと、`await bank.withdraw(100)` を呼ぶまでの間に中断点があり、その隙に別のタスクが同じ判定を通って引き出しを実行できます。結果として2つのタスクが両方とも「残高は100ある」と判断し、合計200を引き出して残高がマイナスになります。actor は1回のアクセスを直列化しますが、複数のアクセスにまたがる不変条件までは守れません。挙動としてはクラッシュせず、同時実行が重なったときだけ値が壊れるため再現が難しいバグです。修正は判定と更新を actor 内の1つのメソッドにまとめ、その中で guard することです。", "detail": {"concept": "actor が保証するのは「1つのメソッド呼び出しの中は他から割り込まれない」ことです。複数の呼び出しをまたぐ処理は、外から見れば分割されており、その隙間に他のタスクが入り得ます。", "steps": ["`await bank.balance` … ここで1回目の隔離境界を越える。読み取り後に中断しうる。", "if の判定が真になる。", "`await bank.withdraw(100)` … ここで2回目の境界を越える。この間に他タスクが同じ経路を通れる。", "判定と更新を1メソッドにまとめると、その内部は割り込まれない。"], "whyCorrect": "問題は actor の定義側ではなく、確認と実行を2回のアクセスに分けている呼び出し側です。1〜3行目は単体では正しく、複数アクセスの組み合わせ方だけが誤っています。", "commonMistakes": ["actor にしたのだから安全だと考える間違いです。この「確認してから実行する」パターン（check-then-act）は actor でも壊れます。", "withdraw の中でさらに balance を await しようとする間違いです。actor 内部からは await 不要で、そのまま触れます。"], "takeaway": "actor が守るのは1呼び出し内だけ。不変条件はメソッド内に閉じ込める。", "example": {"code": "actor Bank {\n    private(set) var balance = 100\n    func withdraw(_ n: Int) -> Bool {\n        guard balance >= n else { return false }\n        balance -= n\n        return true\n    }\n}\nlet bank = Bank()\nasync let a = bank.withdraw(100)\nasync let b = bank.withdraw(100)\nprint(await a, await b, await bank.balance)", "output": "true false 0", "explanation": "判定と更新をまとめたことで、同時に2件を試しても片方だけが成功し、残高がマイナスになりません。"}}, "seriesId": "concurrency-actor-basics", "seriesStep": 3}, {"id": "practice-concurrency-028", "track": "concurrency", "lessonId": "concurrency-actor", "type": "repair", "difficulty": 4, "title": "actorの状態を外から書き換えるコードを直す", "prompt": "最終行がビルドできません。修正として正しいものを選んでください。", "skills": ["concurrency", "debugging"], "content": {"code": "actor Cache {\n    private(set) var items: [String: String] = [:]\n    func set(_ v: String, for k: String) { items[k] = v }\n}\nlet cache = Cache()\nawait cache.items[\"a\"] = \"1\"", "options": [{"id": "o1", "code": "await cache.set(\"1\", for: \"a\")"}, {"id": "o2", "code": "cache.items[\"a\"] = \"1\""}, {"id": "o3", "code": "await cache.items.updateValue(\"1\", forKey: \"a\")"}, {"id": "o4", "code": "Task { cache.items[\"a\"] = \"1\" }"}]}, "solution": {"optionId": "o1", "fixedCode": "actor Cache {\n    private(set) var items: [String: String] = [:]\n    func set(_ v: String, for k: String) { items[k] = v }\n}\nlet cache = Cache()\nawait cache.set(\"1\", for: \"a\")\nprint(await cache.items[\"a\"] ?? \"なし\")"}, "hints": ["actor の状態は、外から直接書き換えることができません。", "await を付けても、書き換えができるようになるわけではありません。", "状態を変更する手段は、actor が公開しているメソッドを通すことです。"], "explanation": "バグは最終行です。actor の隔離された状態は外部から直接変更できず、'Actor-isolated property items can not be mutated from a nonisolated context' というコンパイルエラーになります（この例ではさらに private(set) による制限もあります）。await を付けても書き換えが許可されるわけではありません。修正は actor が用意したメソッド `set(_:for:)` を await 付きで呼ぶことです。メソッドの内部は隔離されているため、そこでの更新は安全に直列化されます。Task で包んでも隔離の制約は変わらず、updateValue も外部からの変更である点は同じです。", "detail": {"concept": "actor は「状態を変更できるのは自分自身のメソッドだけ」という制約を課します。この一方通行の設計により、変更経路が actor の内部に限定され、レビューすべき箇所も限られます。", "steps": ["`items` は actor に隔離された可変状態。", "外部（nonisolated な文脈）からの直接変更はコンパイルエラー。", "`set(_:for:)` は actor のメソッドなので、内部で自由に変更できる。", "外からは `await cache.set(...)` として呼ぶ。"], "whyCorrect": "変更を actor のメソッドに集約することで、隔離の保証がそのまま働きます。呼び出し側は await で境界を越えるだけで済みます。", "commonMistakes": ["await を付ければ何でもできると考える間違いです。await は中断点の印であって、権限を与えるものではありません。", "Task で包めば隔離を回避できると考える間違いです。Task の中も nonisolated な文脈なので、制約は同じです。"], "takeaway": "actor の状態変更はメソッド経由。await は権限ではなく中断点の印。", "example": {"code": "actor Cache {\n    private(set) var items: [String: String] = [:]\n    func set(_ v: String, for k: String) { items[k] = v }\n}\nlet cache = Cache()\nawait cache.set(\"1\", for: \"a\")\nprint(await cache.items[\"a\"] ?? \"なし\")", "output": "1", "explanation": "メソッド経由なら、外部からでも安全に状態を更新できます。"}}, "seriesId": "concurrency-actor-basics", "seriesStep": 4}, {"id": "practice-concurrency-029", "track": "concurrency", "lessonId": "concurrency-mainactor", "type": "trace", "difficulty": 3, "title": "@MainActorの関数がどこで動くか追う", "prompt": "次のコードを実行したとき、表示される内容を選んでください。", "skills": ["concurrency", "debugging"], "content": {"code": "import Foundation\n@MainActor func label() -> String { \"main: \\(Thread.isMainThread)\" }\nfunc work() async -> String {\n    let a = await label()\n    return a\n}\nprint(await work())", "options": [{"id": "o1", "label": "main: true"}, {"id": "o2", "label": "main: false"}, {"id": "o3", "label": "実行するたびに true と false が入れ替わる"}, {"id": "o4", "label": "ビルドできない"}]}, "solution": {"optionId": "o1"}, "hints": ["@MainActor が付いた関数は、どこで実行されることが保証されているでしょうか。", "work は @MainActor が付いていないため、別の場所で動いている可能性があります。", "await によってメインアクターへ移動してから label が実行されます。"], "explanation": "`@MainActor` が付いた関数は、必ずメインアクター（メインスレッド）上で実行されることが保証されます。呼び出し側の work にはその指定がないため、label を呼ぶには境界を越える必要があり、そこで await が要求されます。await の時点でメインアクターへ移動してから実行されるため、Thread.isMainThread は必ず true になり「main: true」が表示されます。実行のたびに変わることはありません。", "detail": {"concept": "@MainActor は「この処理はメインで動く」という保証をコンパイラに検査させる仕組みです。UI 更新をメインスレッド以外から行うバグを、実行前に防げます。", "steps": ["`@MainActor func label()` … メインアクターに隔離された関数。", "`func work() async` … 隔離指定がないので、メインアクター以外で動きうる。", "`await label()` … 境界を越えるため、メインアクターへ移動する。", "移動後に実行されるので Thread.isMainThread は true。"], "whyCorrect": "隔離の保証は言語仕様レベルのもので、スケジューリングの運任せではありません。そのため結果は決定的に true になります。", "commonMistakes": ["await を書いたら別スレッドで動くと考える間違いです。await は中断点であって、実行場所は隔離指定で決まります。", "DispatchQueue.main.async で包む昔ながらの書き方と混同する間違いです。@MainActor なら、書き忘れをコンパイラが検出します。"], "takeaway": "@MainActor は実行場所の保証。await は境界を越える印。", "example": {"code": "import Foundation\n@MainActor func label() -> String { \"main: \\(Thread.isMainThread)\" }\nfunc work() async -> String { await label() }\nprint(await work())", "output": "main: true", "explanation": "呼び出し元がどこであっても、@MainActor の関数はメインで実行されます。"}}, "seriesId": "concurrency-mainactor", "seriesStep": 1}, {"id": "practice-concurrency-030", "track": "concurrency", "lessonId": "concurrency-mainactor", "type": "reorder", "difficulty": 2, "title": "MainActorに隔離した型を扱う順に並べる", "prompt": "@MainActor の ViewModel を更新して表示します。ブロックを正しい順に並べ替えてください。", "skills": ["concurrency", "types"], "content": {"blocks": [{"id": "b1", "code": "    var title = \"\""}, {"id": "b2", "code": "@MainActor final class ViewModel {"}, {"id": "b3", "code": "    func update(_ t: String) { title = t }"}, {"id": "b4", "code": "}"}, {"id": "b5", "code": "func run(_ vm: ViewModel) async {"}, {"id": "b6", "code": "    await vm.update(\"新しい題名\")"}, {"id": "b7", "code": "    print(await vm.title)"}, {"id": "b8", "code": "}"}]}, "solution": {"order": ["b2", "b1", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["クラスの宣言を開いてから、プロパティ、メソッドの順に書きます。", "run は @MainActor が付いていないため、ViewModel に触るたびに境界を越えます。", "クラス定義（宣言・プロパティ・メソッド・閉じかっこ）→ run（宣言・更新・表示・閉じかっこ）の順です。"], "explanation": "`@MainActor` をクラスに付けると、そのすべてのメンバーがメインアクターに隔離されます。run には隔離指定がないため、update の呼び出しにも title の読み取りにも await が必要です。await が付くことで「ここでメインアクターへ移動する」ことがコード上に現れ、UI 更新の場所が読み取れるようになります。クラス定義を先に書き、そのあとで利用する関数を書くのが正しい順序です。", "detail": {"concept": "型全体に @MainActor を付けると、その型を触るすべての箇所で隔離が検査されます。ViewModel のように UI と結びつく型では、この指定が事故を防ぎます。", "steps": ["`@MainActor final class ViewModel` … 型全体をメインアクターに隔離する。", "`var title` と `func update` … どちらもメインアクター隔離になる。", "`func run(_ vm: ViewModel) async` … 隔離指定がない関数。", "`await vm.update(...)` と `await vm.title` … 境界を越えるので await が必要。"], "whyCorrect": "定義が利用より前にあり、隔離境界を越える箇所すべてに await が付いています。この形なら、どこでメインへ移動するかがコードから読み取れます。", "commonMistakes": ["await を付け忘れて 'Main actor-isolated property can not be referenced from a nonisolated context' になる間違いです。境界を越える箇所すべてに必要です。", "run にも @MainActor を付ければ await は不要になりますが、その関数全体がメイン上で動くことになります。重い処理を含むなら分けるべきです。"], "takeaway": "型に @MainActor を付けると全メンバーが隔離される。境界を越える箇所には await。", "example": {"code": "@MainActor final class ViewModel {\n    var title = \"\"\n    func update(_ t: String) { title = t }\n}\nfunc run(_ vm: ViewModel) async {\n    await vm.update(\"新しい題名\")\n    print(await vm.title)\n}\nawait run(ViewModel())", "output": "新しい題名", "explanation": "隔離された型でも、await を通せば別の文脈から安全に扱えます。"}}, "seriesId": "concurrency-mainactor", "seriesStep": 2}, {"id": "practice-concurrency-031", "track": "concurrency", "lessonId": "concurrency-mainactor", "type": "chooseBlocks", "difficulty": 3, "title": "非同期取得の結果をUI用の型へ反映する", "prompt": "非同期に取得した結果を @MainActor の ViewModel に反映します。必要な行だけを選び、正しい順に並べてください。", "skills": ["concurrency", "architecture"], "content": {"blocks": [{"id": "b1", "code": "func fetchItems() async -> [String] { [\"a\"] }"}, {"id": "b2", "code": "@MainActor final class ViewModel {"}, {"id": "b3", "code": "    var items: [String] = []"}, {"id": "b4", "code": "    func load() async { items = await fetchItems() }"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "    nonisolated func load() async { items = await fetchItems() }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5"], "order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["fetchItems の定義は、使う行より前に必要です。", "items は @MainActor に隔離されたプロパティです。どこからなら書き換えられるでしょうか。", "nonisolated を付けると隔離の外に出てしまい、隔離されたプロパティへ代入できなくなります。"], "explanation": "`load()` は @MainActor のクラスのメソッドなので、それ自体がメインアクターに隔離されています。そのため `items = ...` の代入は隔離の内側で行われ、安全です。`await fetchItems()` の間はメインアクターを手放すため、UI をブロックしません。b6 のように `nonisolated` を付けると隔離の外に出てしまい、隔離されたプロパティ items への代入が 'Main actor-isolated property can not be mutated from a nonisolated context' になります。", "detail": {"concept": "「重い処理は隔離の外、状態の更新は隔離の内」という分担が基本形です。async メソッドを隔離された型に置くと、この分担が自然に実現します。", "steps": ["`func load() async` はメインアクターに隔離されたメソッド。", "`await fetchItems()` の間は中断し、メインアクターを他の処理に譲る。", "結果が返ると再びメインアクター上で再開する。", "`items = ...` の代入は隔離の内側なので安全。"], "whyCorrect": "隔離されたメソッドの中では、そのアクターの状態に自由に触れます。await による中断があっても、再開時には同じアクターへ戻るため、代入は常にメイン上で行われます。", "commonMistakes": ["nonisolated を「非同期にするための指定」と誤解する間違いです。隔離を外す指定であり、状態に触れなくなります。", "取得処理まで @MainActor で行うと、重い処理がメインを占有します。await を挟むことで手放せる点が重要です。"], "takeaway": "隔離された async メソッドなら、待っている間だけアクターを手放せる。", "example": {"code": "func fetchItems() async -> [String] { [\"a\"] }\n@MainActor final class ViewModel {\n    var items: [String] = []\n    func load() async { items = await fetchItems() }\n}\nlet vm = ViewModel()\nawait vm.load()\nprint(await vm.items)", "output": "[\"a\"]", "explanation": "取得は隔離の外で行われ、代入はメインアクター上で行われています。"}}, "seriesId": "concurrency-mainactor", "seriesStep": 3}, {"id": "practice-concurrency-032", "track": "concurrency", "lessonId": "concurrency-sendable", "type": "shortCode", "difficulty": 3, "title": "安全に受け渡せる型の宣言行を書く", "prompt": "複数のタスク間で受け渡しても安全な設定値の型を作ります。型名は Config、値型で、安全に渡せることを表すプロトコルに準拠させる宣言行（struct から始まる1行）を書いてください。", "skills": ["concurrency", "types"], "content": {"context": "// ここに1行書く\n    let retries: Int\n}", "contextRun": "{{answer}}\n    let retries: Int\n}\nprint(Config(retries: 3).retries)", "placeholder": "例: struct 型名: プロトコル {"}, "solution": {"accepted": ["struct Config: Sendable {"]}, "hints": ["「並行に受け渡しても安全」であることを表す標準のプロトコルがあります。", "そのプロトコルは要求メンバーを持たず、準拠を宣言するだけで検査が働きます。", "struct のあとに型名、コロン、プロトコル名、中かっこを続けます。"], "explanation": "`struct Config: Sendable {` と書きます。Sendable は「この型の値は並行実行の境界を越えて安全に渡せる」ことを表すマーカープロトコルで、実装すべきメンバーはありません。準拠を宣言すると、コンパイラがその型の中身（全プロパティが Sendable か、可変な参照を持っていないか）を検査します。let のみを持つ値型は条件を満たすため、宣言するだけで準拠できます。実際には、すべてのプロパティが Sendable な struct は暗黙的に Sendable になりますが、公開する型では明示しておくと意図が伝わります。", "detail": {"concept": "Sendable は「型が並行境界を越えられるか」を表す軸です。actor が「状態をどう守るか」であるのに対し、Sendable は「値を渡してよいか」を扱います。", "steps": ["`struct Config: Sendable` … 値型として宣言し、Sendable に準拠する。", "`let retries: Int` … Int は Sendable なので条件を満たす。", "コンパイラが全プロパティを検査し、問題なければ準拠が認められる。", "以降、この型はタスク間で自由に渡せる。"], "whyCorrect": "値型はコピーされて渡るため、共有された可変状態が生まれません。プロパティも不変かつ Sendable なので、検査を通ります。", "commonMistakes": ["可変プロパティを持つ class に Sendable を付ける間違いです。同時に書き換えられる可能性が残るため、コンパイルエラーになります。", "@unchecked Sendable で検査を黙らせる間違いです。安全性の保証を自分で負うことになるため、根拠がないなら使いません。"], "takeaway": "Sendable は「渡してよい型」の宣言。値型 + 不変なら自然に満たせる。", "example": {"code": "struct Config: Sendable { let retries: Int }\nlet config = Config(retries: 3)\nlet t = Task { config.retries }\nprint(await t.value)", "output": "3", "explanation": "Sendable な値は、別のタスクへそのまま捕捉させても安全です。"}}, "seriesId": "concurrency-sendable", "seriesStep": 1}, {"id": "practice-concurrency-033", "track": "concurrency", "lessonId": "concurrency-sendable", "type": "repair", "difficulty": 4, "title": "タスク間で渡せない型を直す", "prompt": "この Settings は、メインスレッドに限定せず任意のタスクへ値として渡したいものです。厳格な並行性チェックでは 'Non-sendable type' として拒否されます。1〜3行目の修正として最も適切なものを選んでください。", "skills": ["concurrency", "types", "debugging"], "content": {"code": "final class Settings {\n    var theme = \"light\"\n}\nfunc apply(_ s: Settings) async { print(s.theme) }", "options": [{"id": "o1", "code": "struct Settings: Sendable {\n    var theme = \"light\"\n}"}, {"id": "o2", "code": "final class Settings: Sendable {\n    var theme = \"light\"\n}"}, {"id": "o3", "code": "final class Settings {\n    nonisolated(unsafe) var theme = \"light\"\n}"}, {"id": "o4", "code": "@MainActor final class Settings {\n    var theme = \"light\"\n}"}]}, "solution": {"optionId": "o1", "fixedCode": "struct Settings: Sendable {\n    var theme = \"light\"\n}\nfunc apply(_ s: Settings) async { print(s.theme) }\nawait apply(Settings())"}, "hints": ["参照型は複数の場所から同じ実体を触れるため、可変なままでは安全に渡せません。", "値型ならコピーされて渡るので、共有された可変状態が生まれません。", "検査を黙らせる指定や、特定のアクターに固定する指定は、要件（任意のタスクへ値として渡す）とは合いません。"], "explanation": "問題は、可変プロパティを持つ class を並行境界を越えて渡そうとしていることです。参照型は渡した先と元が同じ実体を共有するため、両方から theme を書き換えるとデータ競合になります。修正は struct にして Sendable に準拠させることです。値型はコピーされて渡るので、渡した先での変更が元に影響せず、競合が原理的に起きません。可変プロパティを持つ class に Sendable を付ける o2 はコンパイラに拒否され、`nonisolated(unsafe)` を使う o3 は検査を黙らせるだけで危険性は残ります。@MainActor を付ける o4 は Sendable にはなりますが、触るたびにメインアクターへの移動が必要になり「任意のタスクへ値として渡す」という要件に合いません。", "detail": {"concept": "「並行境界を越えて渡せるか」は、その型が可変状態を共有しうるかで決まります。共有をなくす最も簡単な方法が、値型にすることです。", "steps": ["class は参照型なので、渡した先と元が同じ実体を指す。", "`var theme` が可変なため、両側から同時に書き換えられる可能性がある。", "struct にすると渡すたびにコピーされ、共有が消える。", "全プロパティが Sendable なので、Sendable 準拠が認められる。"], "whyCorrect": "値型にすることで共有そのものをなくしており、検査を回避するのではなく前提を満たしています。要件である「任意のタスクへ渡す」もそのまま実現できます。", "commonMistakes": ["`@unchecked Sendable` や `nonisolated(unsafe)` で警告を消す対応です。コンパイラの検査を無効化するだけで、競合の可能性は残ります。", "共有された可変状態が本当に必要な場合は、struct 化ではなく actor に持たせるのが正しい設計です。要件によって答えが変わります。"], "takeaway": "渡したいだけなら値型にする。共有が必要なら actor。検査を黙らせる指定は最後の手段。", "example": {"code": "struct Settings: Sendable { var theme = \"light\" }\nfunc apply(_ s: Settings) async { print(s.theme) }\nvar s = Settings()\nlet t = Task { [s] in await apply(s) }\ns.theme = \"dark\"\nawait t.value\nprint(s.theme)", "output": "light\ndark", "explanation": "捕捉リスト [s] を書くと、その時点の値がコピーされてタスクへ渡ります。捕捉リストを書かずに var をそのまま捕捉すると変数を共有してしまい、あとの変更（dark）が見えてしまいます。"}}, "seriesId": "concurrency-sendable", "seriesStep": 2}, {"id": "practice-concurrency-034", "track": "concurrency", "lessonId": "concurrency-continuation", "type": "buildFunction", "difficulty": 4, "title": "コールバックAPIをasyncに橋渡しする", "prompt": "完了ハンドラ形式の古いAPIを、async/await から使える関数に変換します。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["concurrency", "functions"], "content": {"blocks": [{"id": "b1", "code": "func legacyLoad(completion: @escaping (String) -> Void) { completion(\"done\") }"}, {"id": "b2", "code": "func load() async -> String {"}, {"id": "b3", "code": "    await withCheckedContinuation { continuation in"}, {"id": "b4", "code": "        legacyLoad { value in"}, {"id": "b5", "code": "            continuation.resume(returning: value)"}, {"id": "b6", "code": "        }"}, {"id": "b7", "code": "    }"}, {"id": "b8", "code": "}"}, {"id": "b9", "code": "        legacyLoad { value in return value }"}, {"id": "b10", "code": "    return await legacyLoad()"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["コールバックの中で return しても、外側の関数の戻り値にはなりません。", "非同期の完了を async の世界へ伝えるための橋渡し役が必要です。", "その橋渡し役に対して「この値で再開してください」と伝えるメソッドを呼びます。"], "explanation": "`withCheckedContinuation` は、コールバック形式のAPIを async/await に橋渡しする仕組みです。渡されたクロージャの中でコールバックを呼び出し、結果が届いたら `continuation.resume(returning:)` を呼ぶことで、中断していた async 関数が再開されます。コールバックの中で `return value` と書いても、それはコールバック自身の戻り値であって外側の関数の結果にはなりません。`await legacyLoad()` は legacyLoad が async ではないため呼べません。", "detail": {"concept": "continuation は「中断した処理の続き」を表す値です。これを保持しておき、結果が届いたタイミングで resume することで、コールバックの世界と await の世界がつながります。", "steps": ["`withCheckedContinuation { continuation in ... }` … ここで async 関数が中断する。", "クロージャの中で従来のAPIを呼ぶ。", "コールバックが呼ばれたら `continuation.resume(returning: value)` を実行する。", "中断していた load() が再開し、その値を返す。"], "whyCorrect": "resume が呼ばれるまで await 側は中断したままで、resume の引数がそのまま async 関数の戻り値になります。コールバックと戻り値の橋渡しがこの1行で成立します。", "commonMistakes": ["resume を1度も呼ばないと、その処理は永久に再開されません。checked 版なら実行時に警告が出ますが、処理は止まったままです。", "resume を2回以上呼ぶとクラッシュします。エラー経路と成功経路の両方で呼んでいないか確認が必要です。", "エラーも扱いたい場合は withCheckedThrowingContinuation を使い、`resume(throwing:)` を呼びます。"], "takeaway": "continuation は必ず1回だけ resume する。0回は停止、2回はクラッシュ。", "example": {"code": "func legacyLoad(completion: @escaping (String) -> Void) { completion(\"done\") }\nfunc load() async -> String {\n    await withCheckedContinuation { continuation in\n        legacyLoad { value in continuation.resume(returning: value) }\n    }\n}\nprint(await load())", "output": "done", "explanation": "コールバックで受け取った値が、そのまま async 関数の戻り値になっています。"}}, "seriesId": "concurrency-continuation", "seriesStep": 1}, {"id": "practice-concurrency-035", "track": "concurrency", "lessonId": "concurrency-continuation", "type": "trace", "difficulty": 3, "title": "continuationの再開順を追う", "prompt": "次のコードを実行したとき、出力される順番を選んでください。", "skills": ["concurrency", "debugging"], "content": {"code": "func legacyLoad(completion: @escaping (String) -> Void) {\n    print(\"開始\")\n    completion(\"done\")\n}\nfunc load() async -> String {\n    await withCheckedContinuation { c in\n        legacyLoad { v in\n            print(\"コールバック\")\n            c.resume(returning: v)\n        }\n    }\n}\nprint(await load())\nprint(\"終了\")", "options": [{"id": "o1", "label": "開始 → コールバック → done → 終了"}, {"id": "o2", "label": "開始 → done → コールバック → 終了"}, {"id": "o3", "label": "コールバック → 開始 → done → 終了"}, {"id": "o4", "label": "開始 → コールバック → 終了 → done"}]}, "solution": {"optionId": "o1"}, "hints": ["legacyLoad は呼ばれた時点で「開始」を表示し、その場でコールバックを呼びます。", "resume が呼ばれるまで、load() は中断したままです。", "print(await load()) は、値が返ってきてから実行されます。"], "explanation": "load() を呼ぶと withCheckedContinuation の中で legacyLoad が実行され、まず「開始」が表示されます。legacyLoad はその場でコールバックを呼ぶため「コールバック」が続き、そこで resume が呼ばれて load() が再開します。再開後に返った値が print されて「done」が表示され、最後に「終了」が出ます。resume が呼ばれるまで await 側は止まっているため、「done」が「コールバック」より先に出ることはありません。", "detail": {"concept": "continuation を使うと、コールバックが呼ばれるまで async 関数は中断したままになります。出力順を追うと、中断と再開の関係がはっきり見えます。", "steps": ["`await load()` … withCheckedContinuation に入り、legacyLoad が呼ばれる。", "「開始」が出力される。", "コールバックが即座に呼ばれ「コールバック」が出力される。", "`resume(returning:)` で load() が再開し、戻り値が print されて「done」。", "最後に「終了」が出力される。"], "whyCorrect": "resume より前に await 側の処理は進めないため、「done」は必ず「コールバック」より後になります。legacyLoad が同期的にコールバックを呼ぶので、「開始」と「コールバック」も連続します。", "commonMistakes": ["コールバックが必ず非同期に呼ばれると考える間違いです。同期的に呼ぶ実装もあり、その場合は出力が連続します。", "await の行で先に「終了」まで進むと考える間違いです。await は中断であり、その行より下は再開後に実行されます。"], "takeaway": "resume されるまで await 側は進まない。出力順が中断と再開を可視化する。", "example": {"code": "func legacyLoad(completion: @escaping (String) -> Void) { print(\"開始\"); completion(\"done\") }\nfunc load() async -> String {\n    await withCheckedContinuation { c in\n        legacyLoad { v in print(\"コールバック\"); c.resume(returning: v) }\n    }\n}\nprint(await load())\nprint(\"終了\")", "output": "開始\nコールバック\ndone\n終了", "explanation": "中断と再開の順序が、そのまま出力の順序として観察できます。"}}, "seriesId": "concurrency-continuation", "seriesStep": 2}, {"id": "practice-concurrency-036", "track": "concurrency", "lessonId": "concurrency-sendable", "type": "testReasoning", "difficulty": 4, "title": "同時実行のテストだけが不安定な理由を読む", "prompt": "単一タスクのテストは通るのに、同時実行のテストだけ結果が毎回変わります。実装のどの点が要件に反していますか。", "skills": ["testing", "concurrency", "memory"], "noRunSolution": true, "content": {"requirement": "Counter は複数のタスクから同時に increment を呼ばれても、最終的な value が呼び出し回数と一致する。", "code": "final class Counter {\n    var value = 0\n    func increment() { value += 1 }\n}", "tests": [{"name": "単一タスクから1000回", "input": "increment を1000回", "expected": "1000", "result": "成功"}, {"name": "10タスクから各100回", "input": "並行に合計1000回", "expected": "1000", "result": "失敗（毎回1000未満の異なる値になる）"}], "options": [{"id": "o1", "label": "可変状態がクラスに置かれ同期されていないため、同時更新でデータ競合が起きて更新が失われている"}, {"id": "o2", "label": "value が Int なので1000回でオーバーフローしている"}, {"id": "o3", "label": "increment が async でないため、並行実行では呼び出しが無視されている"}, {"id": "o4", "label": "並行実行では合計が減るのが正しく、テストの期待値のほうが誤っている"}]}, "solution": {"optionId": "o1"}, "hints": ["単一タスクのテストが通っていることから、加算のロジック自体は正しいと分かります。", "失敗するのは同時に呼んだときだけで、しかも毎回値が違います。", "`value += 1` は読み取り・加算・書き込みの3段階です。途中で他のスレッドが割り込むとどうなるでしょうか。"], "explanation": "失敗したテストが表しているのは「同時更新でも合計が正確である」という要件です。検証している入力は並行に合計1000回という条件で、単一タスクでは現れない競合状態を狙っています。実装は class の可変プロパティを何の同期もなく更新しており、`value += 1` は「現在値を読む → 1を足す → 書き戻す」の3段階に分かれます。2つのスレッドが同じ値を読んでから書き戻すと、片方の加算が失われるため、合計は1000より小さくなります。失われる回数はタイミング次第なので、結果は毎回変わります。単一タスクのテストが通るのは、割り込みが起こらず3段階が常に完結するためで、ロジックの正しさとは別の話です。修正は Counter を actor にして更新を直列化することです。", "detail": {"concept": "データ競合は「同時に同じメモリを読み書きする」ことで起きます。1行に見える演算でも複数の機械語命令に分かれるため、途中で割り込まれる余地があります。", "steps": ["要件は「同時に呼ばれても合計が一致すること」。", "`value += 1` は読み取り・加算・書き込みの3段階。", "2つのタスクが同じ値を読むと、片方の加算が上書きで失われる。", "失われる回数はタイミング依存なので、結果が毎回変わる。"], "whyCorrect": "単一タスクのテストが安定して通ることが、加算そのものやオーバーフローが原因でないことを示しています。差が出ているのは同時実行の有無だけで、それはまさにデータ競合の条件です。", "commonMistakes": ["何度か実行して1000になったことをもって直ったと判断する間違いです。競合は再現しないことがあるだけで、消えてはいません。", "テストの期待値を緩める対応です。要件が正確な合計を求めている以上、仕様のほうを壊しています。", "increment に async を付けるだけでは競合は解決しません。直列化するのは actor の隔離であって、async という指定ではありません。"], "takeaway": "同時実行のときだけ壊れるならデータ競合。共有される可変状態は actor に移す。", "example": {"code": "actor Counter {\n    private(set) var value = 0\n    func increment() { value += 1 }\n}\nlet c = Counter()\nawait withTaskGroup(of: Void.self) { group in\n    for _ in 1...1000 { group.addTask { await c.increment() } }\n}\nprint(await c.value)", "output": "1000", "explanation": "actor にすると、1000件を並行に実行しても合計が常に正確になります。"}}, "seriesId": "concurrency-sendable", "seriesStep": 3}, {"id": "practice-development-001", "track": "development", "lessonId": "dev-xcode-structure", "type": "matching", "difficulty": 1, "title": "Xcodeプロジェクトの構成要素を対応づける", "prompt": "Xcode のプロジェクト構成に出てくる用語と、その役割を対応させてください。", "skills": ["architecture"], "content": {"left": [{"id": "l1", "label": "Target"}, {"id": "l2", "label": "Scheme"}, {"id": "l3", "label": "Build Configuration"}, {"id": "l4", "label": "Info.plist"}], "right": [{"id": "r1", "label": "ビルドして作られる成果物の単位（アプリ本体・テストなど）"}, {"id": "r2", "label": "どの成果物をどの設定でビルド・実行するかの組み合わせ"}, {"id": "r3", "label": "Debug / Release など、ビルド設定の切り替え単位"}, {"id": "r4", "label": "表示名や必要な権限など、アプリの情報を宣言する設定ファイル"}, {"id": "r5", "label": "依存ライブラリの解決済みバージョンを固定して記録するファイル"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["「作られるもの」と「どう作るかの選択」を分けて考えてください。", "Debug と Release の切り替えは、実行の組み合わせではなく設定の種類です。", "r5 は Package.resolved の説明なので、この4つとは対応しません。"], "explanation": "Target はビルドの成果物の単位で、アプリ本体・テスト・ウィジェットなどがそれぞれ Target になります。Scheme は「どの Target を、どの Build Configuration で、どのアクション（実行・テストなど）に使うか」の組み合わせです。Build Configuration は Debug / Release といった設定の切り替え単位で、最適化やフラグが変わります。Info.plist はアプリの表示名や必要な権限を宣言する設定ファイルです。r5 は Package.resolved の説明です。", "detail": {"concept": "Xcode の設定は階層になっています。Target が「何を作るか」、Build Configuration が「どんな設定で作るか」、Scheme が「その組み合わせをどう実行するか」を担当します。", "steps": ["Target … アプリ、テスト、拡張などの成果物ごとに1つ。", "Build Configuration … Debug は最適化なし＋デバッグ情報、Release は最適化あり。", "Scheme … Run は Debug、Archive は Release、のように行為ごとに構成を指定する。", "Info.plist … 実行時に OS が読む宣言情報（権限、表示名、対応バージョンなど）。"], "whyCorrect": "4つはそれぞれ成果物・実行の組み合わせ・設定の種類・宣言情報という別の階層を担当しており、説明と1対1で対応します。", "commonMistakes": ["Scheme と Target を同じものと考える間違いです。1つの Scheme が複数の Target（アプリとテスト）をまとめて扱います。", "Debug でだけ動く不具合を調べるとき、Build Configuration の違い（最適化やアサーションの有無）を見落とすと原因にたどり着けません。"], "takeaway": "Target は成果物、Configuration は設定、Scheme はその組み合わせ。", "example": {"code": "// 概念の対応関係\n// Scheme \"MyApp\" = Target(MyApp) + Configuration(Debug) + Action(Run)\n// Scheme \"MyApp\" = Target(MyAppTests) + Configuration(Debug) + Action(Test)\nlet actions = [\"Run\", \"Test\", \"Archive\"]\nprint(actions.count)", "output": "3", "explanation": "1つの Scheme に、アクションごとの構成がぶら下がる形になっています。"}}}, {"id": "practice-development-002", "track": "development", "lessonId": "dev-build-errors", "type": "fillBlank", "difficulty": 2, "title": "自動生成される初期化子の呼び方", "prompt": "struct を初期化して値を表示します。空欄を埋めてください。", "skills": ["types", "debugging"], "content": {"template": "struct User {\n    let name: String\n}\nlet u = User({{1}} \"Yuki\")\nprint(u.{{2}})", "blanks": [{"id": "1", "options": ["name:", "user:", "value:", "text:"]}, {"id": "2", "options": ["name", "Name", "value", "text"]}]}, "solution": {"answers": {"1": "name:", "2": "name"}}, "hints": ["struct には初期化子を書いていませんが、自動的に用意されています。", "その初期化子の引数ラベルは、宣言したプロパティから決まります。", "ラベルもプロパティ名も、宣言した綴りとまったく同じでなければなりません。"], "explanation": "struct は初期化子を書かなくても、全プロパティを引数に取るメンバーワイズイニシャライザが自動生成されます。その引数ラベルはプロパティ名そのままなので `User(name: \"Yuki\")` と書きます。プロパティへのアクセスも宣言どおり `u.name` です。大文字小文字が違うだけでも 'Value of type User has no member Name' というエラーになります。実行すると Yuki が表示されます。", "detail": {"concept": "コンパイルエラーの多くは「名前が一致していない」ことが原因です。自動生成される初期化子は宣言をそのまま反映するため、エラーメッセージを読めば期待されている名前がわかります。", "steps": ["`struct User { let name: String }` … メンバーワイズイニシャライザが自動生成される。", "生成されるのは `init(name: String)`。ラベルはプロパティ名。", "`User(name: \"Yuki\")` で初期化する。", "`u.name` でプロパティにアクセスする。"], "whyCorrect": "自動生成の規則が「プロパティ名 = 引数ラベル」であるため、宣言と呼び出しが一致します。名前が一致していることがコンパイルの条件です。", "commonMistakes": ["自分で init を書くと、メンバーワイズイニシャライザは生成されなくなります（extension に書けば両方使えます）。", "'Missing argument for parameter' が出たら、プロパティを増やしたのに呼び出し側を直していない可能性が高いです。"], "takeaway": "struct の初期化子は自動生成される。ラベルはプロパティ名そのまま。", "example": {"code": "struct User { let name: String; let age: Int }\nlet u = User(name: \"Yuki\", age: 24)\nprint(u.name, u.age)", "output": "Yuki 24", "explanation": "プロパティを増やすと、初期化子の引数も自動的に増えます。"}}, "seriesId": "development-build-errors", "seriesStep": 1}, {"id": "practice-development-003", "track": "development", "lessonId": "dev-build-errors", "type": "bugHunt", "difficulty": 2, "title": "引数が足りない呼び出しを見つける", "prompt": "このコードは 'Missing argument for parameter age in call' でビルドできません。原因になっている行を選んでください。", "skills": ["types", "debugging"], "content": {"lines": [{"id": "l1", "code": "struct User {"}, {"id": "l2", "code": "    let name: String"}, {"id": "l3", "code": "    let age: Int"}, {"id": "l4", "code": "}"}, {"id": "l5", "code": "let u = User(name: \"Yuki\")"}]}, "solution": {"optionId": "l5", "fixedCode": "struct User {\n    let name: String\n    let age: Int\n}\nlet u = User(name: \"Yuki\", age: 24)\nprint(u.name, u.age)"}, "hints": ["エラーメッセージに書かれている引数名を、宣言と見比べてください。", "自動生成される初期化子は、すべてのプロパティを引数に取ります。", "プロパティは2つあるのに、呼び出しでは1つしか渡されていません。"], "explanation": "バグは5行目の呼び出しです。User には name と age の2つのプロパティがあるため、自動生成される初期化子は `init(name:age:)` になります。呼び出し側で age を渡していないため 'Missing argument for parameter age in call' というコンパイルエラーになります。ビルドが止まるだけで実行時の問題ではありません。修正は `User(name: \"Yuki\", age: 24)` と両方を渡すことです。age に既定値を持たせたい場合は、`var age: Int = 0` のように宣言するか、自分で初期化子を書きます。", "detail": {"concept": "エラーメッセージは「何が足りないか」を具体的な名前で教えてくれます。パラメータ名が書かれているときは、その名前で宣言側を検索するのが最短の調査手順です。", "steps": ["プロパティは name と age の2つ。", "自動生成される初期化子は init(name:age:)。", "呼び出しは name だけなので、age が不足している。", "age を渡すか、既定値を持たせる。"], "whyCorrect": "エラーは呼び出し側の引数不足に対して出ています。宣言（1〜4行目）自体は正しく、2つのプロパティを持つ型として矛盾がありません。", "commonMistakes": ["`let age: Int = 0` としても、let の場合は既定値があってもメンバーワイズイニシャライザの引数に含まれ続けます。省略したいなら var にします。", "プロパティを追加したときに呼び出し側の修正を忘れる典型例です。コンパイラが全箇所を教えてくれるので、順に直します。"], "takeaway": "エラーメッセージのパラメータ名で宣言を検索する。それが最短経路。", "example": {"code": "struct User {\n    let name: String\n    var age: Int = 0\n}\nprint(User(name: \"Yuki\").age, User(name: \"Ko\", age: 30).age)", "output": "0 30", "explanation": "var に既定値を持たせると、その引数を省略した呼び出しもできるようになります。"}}, "seriesId": "development-build-errors", "seriesStep": 2}, {"id": "practice-development-004", "track": "development", "lessonId": "dev-build-errors", "type": "repair", "difficulty": 2, "title": "型注釈が合っていない宣言を直す", "prompt": "合計を数値のまま使いたいのですが、2行目がビルドできません。修正として正しいものを選んでください。", "skills": ["types", "debugging"], "content": {"code": "let numbers = [1, 2, 3]\nlet total: String = numbers.reduce(0, +)\nprint(total)", "options": [{"id": "o1", "code": "let total = numbers.reduce(0, +)"}, {"id": "o2", "code": "let total: String = String(numbers.reduce(0, +))"}, {"id": "o3", "code": "let total: String = numbers.reduce(\"0\", +)"}, {"id": "o4", "code": "let total: Int = numbers.reduce(0, +).description"}]}, "solution": {"optionId": "o1", "fixedCode": "let numbers = [1, 2, 3]\nlet total = numbers.reduce(0, +)\nprint(total)"}, "hints": ["reduce(0, +) が返す型は何でしょうか。宣言した型と一致しているか確認してください。", "要件は「数値のまま使いたい」です。文字列に変換する修正は要件に反します。", "型注釈を外せば、右辺から正しい型が推論されます。"], "explanation": "バグは2行目の型注釈です。`numbers.reduce(0, +)` は Int を返すのに String と宣言しているため 'Cannot convert value of type Int to specified type String' になります。要件は「数値のまま使いたい」なので、修正は型注釈を外して推論に任せることです（`let total: Int = ...` と明示しても構いません）。String() で包む o2 はビルドは通りますが型が String になり、以降の計算ができなくなるため要件に反します。o3 は Int 配列に String の初期値を渡しており、o4 は description が String を返すため、どちらも型が合いません。", "detail": {"concept": "型注釈は「この値はこの型であるべき」という宣言です。エラーが出たときは、注釈と右辺のどちらが正しいのかを要件に照らして判断します。", "steps": ["`numbers` は [Int]。reduce(0, +) の結果も Int。", "型注釈が String なので不一致になる。", "要件は数値なので、正しいのは右辺のほう。", "注釈を外すと Int と推論され、そのまま計算に使える。"], "whyCorrect": "右辺の型が要件と一致しているため、注釈を外すのが最小の修正です。値の意味を変えずにエラーだけを解消できます。", "commonMistakes": ["エラーを消すために右辺を変換する対応です。ビルドは通っても、意図した型でなくなり後続の処理が壊れます。", "型注釈をすべて省くのも極端です。公開APIや意図が伝わりにくい場面では明示したほうが読みやすくなります。"], "takeaway": "型不一致は「注釈と右辺のどちらが正しいか」を要件で決める。", "example": {"code": "let numbers = [1, 2, 3]\nlet total = numbers.reduce(0, +)\nlet label: String = \"合計: \\(total)\"\nprint(total + 1, label)", "output": "7 合計: 6", "explanation": "数値として保持しておけば計算に使え、表示が必要なときだけ文字列にできます。"}}, "seriesId": "development-build-errors", "seriesStep": 3}, {"id": "practice-development-005", "track": "development", "lessonId": "dev-build-errors", "type": "testReasoning", "difficulty": 3, "title": "小文字の入力でだけ落ちるテストを読む", "prompt": "ビルドは通りますが、テストが1件失敗しています。実装のどこが要件と食い違っていますか。", "skills": ["testing", "debugging"], "content": {"requirement": "initials(_:) は氏名を空白で区切り、各語の頭文字を大文字にして連結して返す（\"yuki ko\" なら \"YK\"）。", "code": "func initials(_ name: String) -> String {\n    name.split(separator: \" \").map { String($0.first!) }.joined()\n}", "tests": [{"name": "先頭が大文字の入力", "input": "\"Yuki Ko\"", "expected": "\"YK\"", "result": "成功"}, {"name": "すべて小文字の入力", "input": "\"yuki ko\"", "expected": "\"YK\"", "result": "失敗（\"yk\" が返った）"}], "options": [{"id": "o1", "label": "頭文字を大文字に変換する処理がないため、入力が小文字のときにそのまま小文字で返る"}, {"id": "o2", "label": "split の区切り文字が誤っているため、語の分割ができていない"}, {"id": "o3", "label": "first! が空文字に対してクラッシュしている"}, {"id": "o4", "label": "joined の区切り文字が指定されていないため連結されていない"}]}, "solution": {"optionId": "o1"}, "hints": ["2つのテストの違いは、入力の大文字小文字だけです。", "実装のどこにも大文字へ変換する処理はありません。", "1件目が通ったのは、入力がもともと大文字だったからです。"], "explanation": "失敗したテストが表しているのは「頭文字を大文字にして返す」という要件です。検証している入力はすべて小文字の氏名で、変換処理の有無が結果に現れるケースを狙っています。実装は先頭の文字を取り出して連結しているだけで、大文字化を一切行っていません。そのため入力が小文字なら出力も小文字になります。1件目が成功したのは入力がもともと大文字だったためで、実装が要件を満たしている証拠にはなりません。分割も連結も正しく動いており、クラッシュも起きていないため、原因は大文字化の欠落だけです。修正は `String($0.first!).uppercased()` とするか、`$0.prefix(1).uppercased()` を使うことです。", "detail": {"concept": "「たまたま通るテスト」は、実装の正しさを保証しません。入力の性質が要件の分岐点と一致していないと、欠落した処理を検出できません。", "steps": ["要件は「頭文字を大文字にして連結」。", "実装は頭文字の取り出しと連結しか行っていない。", "大文字の入力ではそのまま通ってしまう。", "小文字の入力で初めて欠落が表面化する。"], "whyCorrect": "失敗しているのが小文字入力のときだけであり、件数や連結の形は期待どおりです。この分かれ方は、変換処理の欠落を正確に指しています。", "commonMistakes": ["大文字の入力だけでテストを書いてしまう間違いです。要件に変換が含まれるなら、変換が必要な入力を必ず含めます。", "`first!` は空の語があるとクラッシュしますが、split は空の要素を作らないため、この実装では発生しません。ただし入力の前提が変われば危険になります。"], "takeaway": "変換が要件なら、変換が必要な入力でテストする。通ったことは保証ではない。", "example": {"code": "func initials(_ name: String) -> String {\n    name.split(separator: \" \").map { $0.prefix(1).uppercased() }.joined()\n}\nprint(initials(\"Yuki Ko\"), initials(\"yuki ko\"))", "output": "YK YK", "explanation": "大文字化を加えると、どちらの入力でも同じ結果になります。"}}, "seriesId": "development-build-errors", "seriesStep": 4}, {"id": "practice-development-006", "track": "development", "lessonId": "dev-modules-files", "type": "chooseBlocks", "difficulty": 2, "title": "同じモジュールの別ファイルから使える形を選ぶ", "prompt": "同じモジュール内の別ファイルから Config を使いたいです。必要な行だけを選び、正しい順に並べてください。", "skills": ["architecture", "types"], "content": {"blocks": [{"id": "b1", "code": "struct Config {"}, {"id": "b2", "code": "    let retries: Int"}, {"id": "b3", "code": "    init(retries: Int) { self.retries = retries }"}, {"id": "b4", "code": "}"}, {"id": "b5", "code": "private struct Config {"}, {"id": "b6", "code": "    fileprivate let retries: Int"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["アクセス修飾子を書かなかった場合、既定はどの範囲でしょうか。", "private や fileprivate は、そのファイルの外からは見えなくなります。", "モジュール内で共有したいだけなら、修飾子を書かないのがちょうどよい範囲です。"], "explanation": "Swift の既定のアクセスレベルは internal で、「同じモジュール内なら別ファイルからも使える」という範囲です。要件がまさにこれなので、修飾子を書かないのが正解です。`private struct Config` にすると宣言したファイルの外からは見えず、`fileprivate let retries` にすると型は見えてもプロパティが読めません。必要以上に広げず（public にしない）、必要以上に狭めない（private にしない）のがアクセス制御の基本方針です。", "detail": {"concept": "アクセスレベルは「どこまで見せるか」の宣言です。狭すぎれば使えず、広すぎれば変更の影響範囲が広がります。要件にちょうど合う範囲を選びます。", "steps": ["既定は internal（モジュール内で公開）。", "要件は「同じモジュールの別ファイルから使う」なので internal が一致する。", "private は宣言したスコープ内（トップレベルならファイル内）だけ。", "public はモジュール外にも公開するため、今回は広すぎる。"], "whyCorrect": "internal の定義が要件そのものと一致しているため、修飾子を書かない形が最も素直です。明示したい場合に `internal` と書いても意味は同じです。", "commonMistakes": ["とりあえず public を付ける習慣です。ライブラリでは公開APIが増え、変更が破壊的になりやすくなります。", "型は internal なのにプロパティだけ fileprivate にすると、別ファイルから初期化も参照もできず、原因が分かりにくいエラーになります。"], "takeaway": "既定の internal はモジュール内公開。広げるのも狭めるのも理由があるときだけ。", "example": {"code": "struct Config {\n    let retries: Int\n    init(retries: Int) { self.retries = retries }\n}\nprint(Config(retries: 3).retries)", "output": "3", "explanation": "修飾子なしの宣言が、モジュール内で共有する既定の形です。"}}, "seriesId": "development-access", "seriesStep": 1}, {"id": "practice-development-007", "track": "development", "lessonId": "dev-modules-files", "type": "fillBlank", "difficulty": 3, "title": "モジュール外に読み取りだけ公開する", "prompt": "Token をモジュール外からも使えるようにしつつ、value の書き換えは型の内部だけに制限します。空欄を埋めてください。", "skills": ["architecture", "types"], "content": {"template": "{{1}} struct Token {\n    {{2}} var value: String = \"\"\n    mutating func set(_ v: String) { value = v }\n}", "blanks": [{"id": "1", "options": ["public", "private", "fileprivate", "internal"]}, {"id": "2", "options": ["private(set)", "private", "public", "let"]}]}, "solution": {"answers": {"1": "public", "2": "private(set)"}}, "hints": ["「モジュール外からも使える」ためには、既定の internal では足りません。", "読み取りと書き込みで別々のアクセスレベルを指定できる書き方があります。", "1つめはモジュール外への公開を表す修飾子、2つめは設定側だけを制限する修飾子です。"], "explanation": "モジュール外に公開するには `public` が必要です（既定の internal はモジュール内限定）。`private(set)` は「取得は宣言どおりのレベル、設定は private」という指定なので、外部から読めても書き換えられません。型の内部にある `set(_:)` からは変更できるため、値の変更経路をメソッドに限定できます。`private` にすると外部から読めなくなり、`let` にすると内部からも変更できなくなって set(_:) がコンパイルエラーになります。", "detail": {"concept": "公開APIの設計では「見せる」と「触らせる」を分けて考えます。読み取りだけ公開すれば、利用側は状態を参照できるが不正な状態を作れない、という関係になります。", "steps": ["`public struct Token` … モジュール外から型を使えるようにする。", "`private(set) var value` … 取得は public、設定は private。", "外部からは `token.value` が読めるが、`token.value = ...` は書けない。", "内部の `set(_:)` からは変更できるため、検証や整形を挟める。"], "whyCorrect": "public が可視性を、private(set) が変更経路を制御しており、要件の2点をそれぞれ満たします。片方だけでは要件が成立しません。", "commonMistakes": ["public にすると、その型が参照する他の型も public でなければならない場合があります。公開範囲は連鎖します。", "public struct のメンバーワイズイニシャライザは自動的には public になりません。ライブラリでは public な init を自分で書く必要があります。"], "takeaway": "見せる範囲は public、触らせる範囲は private(set)。2つは別の軸。", "example": {"code": "public struct Token {\n    public private(set) var value: String = \"\"\n    public init() {}\n    public mutating func set(_ v: String) { value = v }\n}\nvar t = Token()\nt.set(\"abc\")\nprint(t.value)", "output": "abc", "explanation": "ライブラリとして公開する場合は、init も明示的に public にする必要があります。"}}, "seriesId": "development-access", "seriesStep": 2}, {"id": "practice-development-008", "track": "development", "lessonId": "dev-spm", "type": "reorder", "difficulty": 3, "title": "Package.swiftの構成を並べ替える", "prompt": "ライブラリを1つ提供する Package.swift を作ります。ブロックを正しい順に並べ替えてください。", "skills": ["architecture"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "let package = Package("}, {"id": "b2", "code": "// swift-tools-version: 6.0"}, {"id": "b3", "code": "import PackageDescription"}, {"id": "b4", "code": "    name: \"MyLib\","}, {"id": "b5", "code": "    products: [.library(name: \"MyLib\", targets: [\"MyLib\"])],"}, {"id": "b6", "code": "    targets: [.target(name: \"MyLib\")]"}, {"id": "b7", "code": ")"}]}, "solution": {"order": ["b2", "b3", "b1", "b4", "b5", "b6", "b7"]}, "hints": ["ツールのバージョン宣言は、コメントの形をしていますが必ず最初の行でなければなりません。", "Package 型を使うには、先にモジュールを import する必要があります。", "バージョン宣言 → import → Package( → name → products → targets → ) の順です。"], "explanation": "`// swift-tools-version:` は単なるコメントではなく、SwiftPM が読み取る宣言なので必ずファイルの先頭行に置きます。次に PackageDescription を import し、Package のインスタンスを組み立てます。name はパッケージ名、products は外部に提供する成果物、targets はビルドの単位です。products で参照している target 名（\"MyLib\"）は、targets 側に存在していなければ解決に失敗します。", "detail": {"concept": "Package.swift は設定ファイルであると同時に Swift のコードです。マニフェストとして実行され、その結果の Package の値が構成として使われます。", "steps": ["1行目の swift-tools-version が、使えるマニフェスト機能とSwiftのバージョンを決める。", "`import PackageDescription` で Package や Target の型を使えるようにする。", "`name` … パッケージ名。", "`products` … 他のパッケージから参照できる成果物。", "`targets` … 実際にビルドされるソースの単位。"], "whyCorrect": "バージョン宣言が先頭にあり、import が型の使用より前にあるため、マニフェストとして正しく解釈されます。products が参照する target も定義済みです。", "commonMistakes": ["swift-tools-version を2行目以降に書く間違いです。コメントとして無視され、古い既定のバージョンで解釈されます。", "products の targets に存在しない名前を書くと、解決時にエラーになります。名前は文字列なのでコンパイラが検出できません。", "ソースの配置は規約で決まっています（Sources/MyLib/）。target 名とディレクトリ名が一致していないと見つかりません。"], "takeaway": "swift-tools-version は必ず1行目。products と targets の名前は一致させる。", "example": {"code": "// swift-tools-version: 6.0\n// import PackageDescription\n// let package = Package(\n//     name: \"MyLib\",\n//     products: [.library(name: \"MyLib\", targets: [\"MyLib\"])],\n//     targets: [.target(name: \"MyLib\")]\n// )\nlet layout = [\"Package.swift\", \"Sources/MyLib/MyLib.swift\", \"Tests/MyLibTests/MyLibTests.swift\"]\nprint(layout.count)", "output": "3", "explanation": "マニフェストと規約どおりのディレクトリ構成がそろって、はじめてビルドできます。"}}, "seriesId": "development-spm", "seriesStep": 1}, {"id": "practice-development-009", "track": "development", "lessonId": "dev-spm", "type": "matching", "difficulty": 1, "title": "SwiftPMの要素を対応づける", "prompt": "Swift Package Manager に関する用語と、その役割を対応させてください。", "skills": ["architecture"], "content": {"left": [{"id": "l1", "label": "Package.swift"}, {"id": "l2", "label": "Package.resolved"}, {"id": "l3", "label": ".target"}, {"id": "l4", "label": ".product"}], "right": [{"id": "r1", "label": "パッケージの構成を記述する定義ファイル"}, {"id": "r2", "label": "解決された依存のバージョンを固定して記録するファイル"}, {"id": "r3", "label": "ソースコードをビルドする単位"}, {"id": "r4", "label": "他のパッケージが提供する成果物への参照"}, {"id": "r5", "label": "テストを実行するためのスキーム設定"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["人が書くファイルと、ツールが書き出すファイルを区別してください。", "ビルドの単位と、外部から使う参照は別の概念です。", "r5 は Xcode の Scheme の説明なので、SwiftPM の要素とは対応しません。"], "explanation": "Package.swift は人が書く構成の定義で、Package.resolved は依存解決の結果をツールが書き出す記録です。`.target` はソースをビルドする単位、`.product` は他のパッケージが公開している成果物への参照で、依存先のライブラリを使うときに指定します。r5 は Xcode の Scheme の説明で、SwiftPM の要素ではありません。", "detail": {"concept": "SwiftPM は「宣言（Package.swift）」と「解決結果（Package.resolved）」を分けています。前者は許容範囲を、後者は実際に使う具体的なバージョンを表します。", "steps": ["Package.swift に `from: \"1.5.0\"` のような許容範囲を書く。", "解決時に、その範囲を満たす具体的なバージョンが決まる。", "決まったバージョンが Package.resolved に記録される。", "resolved をコミットしておくと、他の環境でも同じバージョンが使われる。"], "whyCorrect": "4つは宣言・記録・ビルド単位・外部参照という別の役割を持ち、説明と1対1で対応します。ファイル2つと構成要素2つという分かれ方も理解の助けになります。", "commonMistakes": ["Package.resolved を .gitignore に入れる間違いです。環境ごとに違うバージョンが解決され、再現性が失われます。", "target と product を混同する間違いです。自分のソースは target、依存先から使うものは product です。"], "takeaway": "Package.swift は許容範囲、Package.resolved は確定したバージョン。両方コミットする。", "example": {"code": "let manifest = \"Package.swift\"\nlet lockfile = \"Package.resolved\"\nprint(\"\\(manifest): 人が書く / \\(lockfile): ツールが書く\")", "output": "Package.swift: 人が書く / Package.resolved: ツールが書く", "explanation": "どちらもコミット対象ですが、編集するのは前者だけです。"}}, "seriesId": "development-spm", "seriesStep": 2}, {"id": "practice-development-010", "track": "development", "lessonId": "dev-dependencies", "type": "shortCode", "difficulty": 2, "title": "依存を追加する1行を書く", "prompt": "Package.swift の dependencies に、https://github.com/apple/swift-log を「1.5.0 以上（メジャーバージョンは 1 のまま）」で追加する1行を書いてください。末尾のカンマは不要です。", "skills": ["architecture"], "content": {"context": "dependencies: [\n    // ここに1行書く\n],", "placeholder": "例: .package(url: \"...\", from: \"...\")"}, "solution": {"accepted": [".package(url: \"https://github.com/apple/swift-log\", from: \"1.5.0\")"]}, "hints": ["依存の指定は Package 型の静的メソッドとして書きます。先頭はドットで始まります。", "「その版以上で、メジャーバージョンは上げない」を表す指定方法が用意されています。", "url ラベルにリポジトリのURL、from ラベルに最低バージョンを文字列で渡します。"], "explanation": "`.package(url: \"https://github.com/apple/swift-log\", from: \"1.5.0\")` と書きます。`from:` は「そのバージョン以上で、次のメジャーバージョン未満」という意味（ここでは 1.5.0 以上 2.0.0 未満）で、セマンティックバージョニングに従う多くのライブラリで既定の選び方になります。厳密に固定したい場合は `exact:` を、範囲を明示したい場合は `\"1.5.0\"..<\"1.7.0\"` のような指定を使います。", "detail": {"concept": "依存の指定は「どこまでの更新を自動で受け入れるか」の宣言です。広すぎると予期しない破壊的変更を拾い、狭すぎると修正版を取り込めません。", "steps": ["`.package(url:from:)` … 最も一般的な指定方法。", "`from: \"1.5.0\"` … 1.5.0 以上 2.0.0 未満を許容する。", "実際に解決されたバージョンは Package.resolved に記録される。", "target 側の dependencies にも `.product(name:package:)` を書いて、使う宣言をする。"], "whyCorrect": "from はセマンティックバージョニングの前提（メジャーが同じなら互換性が保たれる）に沿った指定です。要件の「1.5.0 以上、メジャーは 1 のまま」とちょうど一致します。", "commonMistakes": ["dependencies に書いただけでは使えません。target の dependencies にも product を追加する必要があります。", "`branch: \"main\"` で依存する間違いです。いつビルドが壊れるか分からなくなるため、リリース版を指定します。"], "takeaway": "依存は from で範囲を宣言し、確定版は Package.resolved に残す。", "example": {"code": "// dependencies: [\n//     .package(url: \"https://github.com/apple/swift-log\", from: \"1.5.0\")\n// ],\n// targets: [\n//     .target(name: \"MyLib\", dependencies: [.product(name: \"Logging\", package: \"swift-log\")])\n// ]\nlet steps = [\"パッケージを追加\", \"targetのdependenciesに追加\", \"importして使う\"]\nprint(steps.count)", "output": "3", "explanation": "依存を使えるようにするには、パッケージ追加と target への追加の2段階が必要です。"}}, "seriesId": "development-spm", "seriesStep": 3}, {"id": "practice-development-011", "track": "development", "lessonId": "dev-debugger", "type": "trace", "difficulty": 3, "title": "ループを途中で抜ける条件を追う", "prompt": "ブレークポイントを置いて total を観察するつもりで、まず手で追ってみます。最後に表示される値を選んでください。", "skills": ["debugging", "controlFlow"], "content": {"code": "var total = 0\nfor i in 1...3 {\n    total += i\n    if total > 3 { break }\n}\nprint(total)", "options": [{"id": "o1", "label": "6"}, {"id": "o2", "label": "3"}, {"id": "o3", "label": "1"}, {"id": "o4", "label": "10"}]}, "solution": {"optionId": "o1"}, "hints": ["判定は加算のあとに行われます。加算前の値ではありません。", "2周目が終わった時点で total はいくつでしょうか。", "1周目が1、2周目が3、3周目で6になり、そこで初めて条件を満たします。"], "explanation": "各周回で先に加算し、そのあとで判定します。1周目は total = 1（1 > 3 は偽）、2周目は total = 3（3 > 3 は偽、等しいだけでは真になりません）、3周目は total = 6 となりここで条件を満たして break します。break は「そこで抜ける」だけで値を戻さないため、最後の加算は反映されたままです。したがって表示は6です。境界値の3で抜けなかった点が、この問題の要です。", "detail": {"concept": "デバッガで変数を観察するとき、「その行を実行する前か後か」で値が変わります。加算と判定の順序を意識しないと、観察した値を誤って解釈します。", "steps": ["i=1: total = 0 + 1 = 1。1 > 3 は偽。", "i=2: total = 1 + 2 = 3。3 > 3 は偽（等号を含まない）。", "i=3: total = 3 + 3 = 6。6 > 3 は真なので break。", "ループを抜けて print(total) が 6 を表示する。"], "whyCorrect": "break は値を巻き戻さないため、条件を満たした時点の値がそのまま残ります。判定が加算のあとにあるので、閾値を超えた値が最終値になります。", "commonMistakes": ["`>` を `>=` と読み違えて、2周目で抜けると考える間違いです。境界値は1文字で変わります。", "break が「その周回の変更を取り消す」と考える間違いです。break はループを抜けるだけです。"], "takeaway": "判定の位置と境界の等号を確認する。break は値を戻さない。", "example": {"code": "var total = 0\nfor i in 1...3 {\n    total += i\n    print(\"i=\\(i) total=\\(total)\")\n    if total > 3 { break }\n}", "output": "i=1 total=1\ni=2 total=3\ni=3 total=6", "explanation": "各周回の値を出力すると、デバッガで1行ずつ止めたのと同じ情報が得られます。"}}, "seriesId": "development-debugging", "seriesStep": 1}, {"id": "practice-development-012", "track": "development", "lessonId": "dev-debugger", "type": "bugHunt", "difficulty": 3, "title": "リリースに残してはいけない行を見つける", "prompt": "この関数はリリースビルドに含めるべきでない出力を行っています。取り除くべき行を選んでください。", "skills": ["debugging", "architecture"], "content": {"lines": [{"id": "l1", "code": "func price(_ n: Int) -> Int {"}, {"id": "l2", "code": "    print(\"DEBUG price called with \\(n)\")"}, {"id": "l3", "code": "    return n * 110 / 100"}, {"id": "l4", "code": "}"}, {"id": "l5", "code": "print(price(1000))"}]}, "solution": {"optionId": "l2", "fixedCode": "func price(_ n: Int) -> Int {\n    return n * 110 / 100\n}\nprint(price(1000))"}, "hints": ["調査のために一時的に入れた出力と、本来の出力を見分けてください。", "print はビルド構成に関係なく常に実行されます。", "関数の戻り値を表示している行は、この関数の利用側の正当な出力です。"], "explanation": "取り除くべきは2行目のデバッグ用 print です。print はビルド構成に関わらず常に実行されるため、リリースビルドでも標準出力に流れ続けます。呼び出しごとに文字列を組み立てるコストがかかるうえ、引数の値がログに残るため、金額やユーザー情報が意図せず露出する危険もあります。挙動としてはクラッシュせず、余計な出力と性能低下という形で現れます。恒久的なログが必要なら、os の Logger を使ってレベルとプライバシー指定を明示し、デバッグ時だけ必要なら `#if DEBUG` で囲みます。5行目の print は呼び出し側が結果を表示しているだけなので、この関数の責務としては問題ありません。", "detail": {"concept": "デバッグ出力は「一時的な足場」です。恒久的に必要な情報はログ基盤に載せ、一時的なものは消す、という区別を付けないとノイズが蓄積します。", "steps": ["print はビルド構成による除去が行われず、常に実行される。", "引数を文字列に補間するコストが、呼び出しのたびに発生する。", "出力先が標準出力なので、フィルタリングやプライバシー指定ができない。", "残す必要があるなら Logger、不要なら削除か #if DEBUG。"], "whyCorrect": "取り除く対象は、調査目的で追加された行です。関数の戻り値を表示している呼び出し側の print は、その場の要件として正当な出力です。", "commonMistakes": ["`#if DEBUG` で囲めば安全だと考えて、機密情報の出力を続ける間違いです。デバッグビルドのログも共有端末では見られます。", "print を Logger に置き換えるだけで、プライバシー指定を省く間違いです。os.Logger では既定で値が伏せられますが、明示的に public を指定すると露出します。"], "takeaway": "print は常に実行される。残すなら Logger、消すなら消し切る。", "example": {"code": "func price(_ n: Int) -> Int {\n    #if DEBUG\n    print(\"DEBUG price called\")\n    #endif\n    return n * 110 / 100\n}\nprint(price(1000))", "output": "1100", "explanation": "DEBUG が定義されていないビルド（リリース相当）で実行した結果です。print の行はコンパイル対象から丸ごと外れるため、実行時のコストもゼロになります。DEBUG が定義されたビルドでは、この前に「DEBUG price called」が出力されます。"}}, "seriesId": "development-debugging", "seriesStep": 2}, {"id": "practice-development-013", "track": "development", "lessonId": "dev-dependencies", "type": "testReasoning", "difficulty": 3, "title": "手元では通るのにCIで落ちる原因を読む", "prompt": "同じコードなのに、手元では通るテストが CI でだけ失敗します。設定のどこが要件に反していますか。", "skills": ["testing", "architecture"], "noRunSolution": true, "content": {"requirement": "CI と手元で、依存ライブラリのまったく同じバージョンを使ってテストする。", "code": "# .gitignore\nPackage.resolved\n\n# Package.swift\n.package(url: \"https://github.com/example/lib\", from: \"1.5.0\")", "tests": [{"name": "手元でのテスト", "input": "解決済みの依存を使用", "expected": "全件成功", "result": "成功"}, {"name": "CI でのテスト", "input": "クリーンな環境で依存を解決", "expected": "全件成功", "result": "失敗（一部のAPIの挙動が変わっている）"}], "options": [{"id": "o1", "label": "Package.resolved を除外しているため、CI では from: の範囲内で別のバージョンが解決され、環境が一致しない"}, {"id": "o2", "label": "CI のマシンが遅いため、テストがタイムアウトしている"}, {"id": "o3", "label": "Package.swift の記述が壊れており、依存をまったく取得できていない"}, {"id": "o4", "label": "テストコードがリポジトリに含まれていないため、CI では実行されていない"}]}, "solution": {"optionId": "o1"}, "hints": ["手元では以前に解決した依存がそのまま残っています。CI は毎回まっさらな状態から始まります。", "from: はバージョンの範囲を指定するもので、1つに固定するものではありません。", "解決した結果を記録するファイルが、リポジトリから除外されています。"], "explanation": "失敗したテストが表しているのは「CI と手元で同じ依存バージョンを使う」という再現性の要件です。検証している条件は、クリーンな環境で依存を解決し直す CI 実行で、これは新しいバージョンが選ばれうる唯一のタイミングです。Package.swift の `from: \"1.5.0\"` は「1.5.0 以上 2.0.0 未満」という範囲指定なので、その後に 1.6.0 が公開されていれば CI ではそちらが解決されます。手元は以前に解決した 1.5.0 が Package.resolved と依存キャッシュに残っているため通り続けます。この差を埋めるのが Package.resolved で、それを .gitignore に入れているため CI と共有されていません。修正は Package.resolved を .gitignore から外してコミットすることです。", "detail": {"concept": "ビルドの再現性は「宣言（許容範囲）」と「確定（実際に使うバージョン）」の両方を共有することで得られます。片方だけでは環境ごとに結果が変わります。", "steps": ["`from: \"1.5.0\"` は範囲であって固定ではない。", "手元には過去に解決した Package.resolved と依存キャッシュが残っている。", "CI はクリーンな状態から解決するため、範囲内の最新版を選ぶ。", "Package.resolved を共有すれば、CI も同じバージョンを使う。"], "whyCorrect": "手元と CI の唯一の違いが「依存を解決し直すかどうか」であり、その結果を固定するファイルが共有されていません。マシン性能やマニフェストの破損なら、手元のテストにも影響が出るはずです。", "commonMistakes": ["`exact:` ですべての依存を固定する対応です。再現性は上がりますが、脆弱性修正の取り込みが手作業になります。範囲指定＋resolved の共有が標準的な折衷案です。", "Package.resolved を lockfile ではなく生成物とみなして無視する間違いです。アプリケーションでは必ずコミットします（ライブラリでは扱いが異なります）。"], "takeaway": "アプリでは Package.resolved をコミットする。from: は固定ではなく範囲。", "example": {"code": "let declared = \"from: 1.5.0（1.5.0以上2.0.0未満）\"\nlet resolvedLocal = \"1.5.0\"\nlet resolvedCI = \"1.6.0\"\nprint(declared)\nprint(\"手元:\", resolvedLocal, \"/ CI:\", resolvedCI, \"→ 一致しない\")", "output": "from: 1.5.0（1.5.0以上2.0.0未満）\n手元: 1.5.0 / CI: 1.6.0 → 一致しない", "explanation": "同じ宣言から別のバージョンが解決されうることが、不一致の原因です。"}}, "seriesId": "development-spm", "seriesStep": 4}, {"id": "practice-development-014", "track": "development", "lessonId": "dev-modules-files", "type": "repair", "difficulty": 3, "title": "公開範囲が食い違う宣言を直す", "prompt": "Client のプロパティが private な型を使っているためビルドできません。Config はモジュール外には公開したくありません。1行目の修正として正しいものを選んでください。", "skills": ["architecture", "debugging"], "content": {"code": "private struct Config {\n    let retries: Int\n}\nstruct Client {\n    let config: Config\n}", "options": [{"id": "o1", "code": "struct Config {"}, {"id": "o2", "code": "public struct Config {"}, {"id": "o3", "code": "fileprivate struct Config {"}, {"id": "o4", "code": "private struct Config: Sendable {"}]}, "solution": {"optionId": "o1", "fixedCode": "struct Config {\n    let retries: Int\n}\nstruct Client {\n    let config: Config\n}\nprint(Client(config: Config(retries: 3)).config.retries)"}, "hints": ["公開されている型のプロパティに、それより狭い型を使うことはできません。", "Client は既定の internal です。プロパティの型も同じ範囲まで見えている必要があります。", "モジュール外には出したくないので、public にする必要はありません。"], "explanation": "バグは1行目のアクセスレベルです。Client は既定の internal（モジュール内で公開）なのに、そのプロパティの型 Config が private（このファイル内のみ）なので、'Property must be declared private because its type uses a private type' というコンパイルエラーになります。公開されている宣言は、それより狭い型を露出できません。要件は「モジュール外には公開しない」なので、Config を internal（修飾子なし）にするのが正解です。public にすると要件を超えて外部にも公開してしまい、fileprivate はファイル内限定のままなので同じエラーが残ります。Sendable を足しても可視性は変わりません。", "detail": {"concept": "アクセスレベルには「露出の整合性」という規則があります。ある宣言は、自分より狭いアクセスレベルの型をシグネチャに使えません。使えてしまうと、参照できない型を参照させることになるためです。", "steps": ["Client は internal。つまりモジュール内のどこからでも見える。", "その `config` プロパティの型は Config。", "Config が private だと、Client を見られる場所から Config が見えない矛盾が生じる。", "Config を internal にすると、両者の範囲が一致する。"], "whyCorrect": "Client と同じ internal にそろえることで、露出の整合性が満たされます。要件が「モジュール内で使う」ことなので、この範囲がちょうど必要十分です。", "commonMistakes": ["エラーを消すために public にする対応です。ビルドは通りますが、モジュール外のAPIが増えて後戻りしにくくなります。", "逆に Client 側を private にする対応もありえますが、Client を他のファイルから使えなくなるため、要件次第です。エラーは2通りの直し方があることを意識します。"], "takeaway": "公開する宣言は、それより狭い型を露出できない。範囲は要件でそろえる。", "example": {"code": "struct Config { let retries: Int }\nstruct Client { let config: Config }\nprint(Client(config: Config(retries: 3)).config.retries)", "output": "3", "explanation": "両方を internal にそろえることで、露出の整合性が満たされます。"}}, "seriesId": "development-access", "seriesStep": 3}, {"id": "practice-development-015", "track": "development", "lessonId": "dev-logging", "type": "fillBlank", "difficulty": 2, "title": "構造化ログを出す準備をする", "prompt": "OSLog を使ってログを出します。空欄を埋めてください。", "skills": ["architecture", "debugging"], "content": {"template": "import OSLog\nlet logger = {{1}}(subsystem: \"com.example.app\", category: \"network\")\nlogger.{{2}}(\"リクエスト開始\")", "blanks": [{"id": "1", "options": ["Logger", "OSLog", "NSLog", "Printer"]}, {"id": "2", "options": ["info", "print", "write", "emit"]}]}, "solution": {"answers": {"1": "Logger", "2": "info"}}, "hints": ["subsystem と category を受け取って作る型があります。フレームワーク名と型名は別です。", "ログにはレベル（重要度）があります。debug / info / error などです。", "1つめは Logger、2つめは通常の記録に使うレベル名です。print ではありません。"], "explanation": "`Logger(subsystem:category:)` で用意すると、subsystem（アプリの識別子）と category（機能単位）でログを分類できます。出力にはレベルごとのメソッドを使い、通常の記録なら `info`、詳細な調査用は `debug`、異常時は `error` を使い分けます。print と違い、レベルやカテゴリでフィルタでき、リリースビルドでも Console.app や log コマンドから追跡できます。", "detail": {"concept": "ログは「あとから絞り込めること」が価値です。subsystem と category で場所を、レベルで重要度を表すことで、必要な情報だけを取り出せます。", "steps": ["`import OSLog` … Logger は OSLog フレームワークにある。", "`Logger(subsystem:category:)` … 分類のための2つの識別子を渡す。", "`logger.info(...)` … 通常の記録レベル。", "出力先は標準出力ではなく、システムのログストア。"], "whyCorrect": "Logger は型名、info はレベル名で、どちらも標準の API 名です。print はログ基盤を経由しないため、フィルタも保存も行われません。", "commonMistakes": ["debug レベルは既定でストアに残らない設定のことがあります。あとから調査したい情報は info 以上にします。", "ログメッセージを文字列連結で組み立てると、補間による最適化やプライバシー指定が効きません。補間はそのまま書きます。"], "takeaway": "ログは Logger + レベル + カテゴリ。print はフィルタも保存もできない。", "example": {"code": "import OSLog\nlet logger = Logger(subsystem: \"com.example.app\", category: \"network\")\nlogger.info(\"リクエスト開始\")\nlogger.error(\"リクエスト失敗\")\nprint(\"ログはシステムのログストアに記録され、標準出力には出ません\")", "output": "ログはシステムのログストアに記録され、標準出力には出ません", "explanation": "Logger の出力は標準出力に現れません。Console.app や log コマンドで確認します。"}}, "seriesId": "development-logging", "seriesStep": 1}, {"id": "practice-development-016", "track": "development", "lessonId": "dev-logging", "type": "bugHunt", "difficulty": 3, "title": "機密情報を露出しているログ行を見つける", "prompt": "このログはリリースビルドで問題になります。原因になっている行を選んでください。", "skills": ["architecture", "debugging"], "content": {"lines": [{"id": "l1", "code": "import OSLog"}, {"id": "l2", "code": "let logger = Logger(subsystem: \"com.example.app\", category: \"auth\")"}, {"id": "l3", "code": "let token = \"secret-abc\""}, {"id": "l4", "code": "logger.info(\"token=\\(token, privacy: .public)\")"}]}, "solution": {"optionId": "l4", "fixedCode": "import OSLog\nlet logger = Logger(subsystem: \"com.example.app\", category: \"auth\")\nlet token = \"secret-abc\"\nlogger.info(\"token=\\(token, privacy: .private)\")\nprint(\"トークンはログに残らない\")"}, "hints": ["OSLog では、補間した値をログに残すかどうかを指定できます。", "既定では動的な値は伏せ字になります。それを上書きしている箇所があります。", "認証トークンのような値を、明示的に公開扱いにしている行があります。"], "explanation": "バグは4行目です。OSLog は補間された動的な値を既定で伏せ字（&lt;private&gt;）にしますが、`privacy: .public` を指定するとその保護を解除して値をそのまま記録します。認証トークンをこの指定で出すと、端末のログストアに平文で残り、デバイスのログを取得できる人が読めてしまいます。クラッシュもエラーも起きず、動作としては正常に見えるのが危険な点です。修正は `.private` を指定する（または指定を省いて既定に任せる）ことです。どうしても関連付けが必要なら `.private(mask: .hash)` でハッシュ化した値を残せます。", "detail": {"concept": "ログのプライバシー指定は「その値を端末に残してよいか」の判断です。静的な文字列は常に残り、補間された値だけが既定で保護されます。", "steps": ["静的な文字列部分（token=）は常にログに残る。", "補間された値は既定で伏せ字になる。", "`privacy: .public` はその保護を明示的に解除する指定。", "トークンや個人情報には `.private` を使い、必要なら hash マスクを使う。"], "whyCorrect": "問題は値そのものではなく、保護を解除している指定です。3行目でトークンを持つこと自体は必要な処理であり、ログに出す方法だけが誤っています。", "commonMistakes": ["デバッグ時に .public を付けて、そのままコミットしてしまう典型例です。レビューで検索すべきキーワードのひとつです。", "「開発ビルドだけだから安全」と考える間違いです。ログストアはビルド構成に関わらず端末に残ります。"], "takeaway": "OSLog の補間値は既定で保護される。.public は保護の解除であって既定ではない。", "example": {"code": "import OSLog\nlet logger = Logger(subsystem: \"com.example.app\", category: \"auth\")\nlet token = \"secret-abc\"\nlogger.info(\"token=\\(token)\")\nlogger.info(\"token=\\(token, privacy: .private(mask: .hash))\")\nprint(\"既定は伏せ字、hash なら同一性だけ追える\")", "output": "既定は伏せ字、hash なら同一性だけ追える", "explanation": "同じトークンかどうかを追跡したいだけなら、hash マスクで値を残さずに済みます。"}}, "seriesId": "development-logging", "seriesStep": 2}, {"id": "practice-development-017", "track": "development", "lessonId": "dev-logging", "type": "chooseBlocks", "difficulty": 3, "title": "失敗時だけ記録する行を選ぶ", "prompt": "ログイン失敗のときだけログに残します。必要な行だけを選び、正しい順に並べてください。", "skills": ["architecture", "debugging"], "content": {"blocks": [{"id": "b1", "code": "import OSLog"}, {"id": "b2", "code": "let logger = Logger(subsystem: \"com.example.app\", category: \"auth\")"}, {"id": "b3", "code": "func login(_ user: String) -> Bool { user == \"yuki\" }"}, {"id": "b4", "code": "if !login(\"taro\") { logger.error(\"ログイン失敗 user=\\(\"taro\")\") }"}, {"id": "b5", "code": "print(\"ログイン失敗 user=taro\")"}, {"id": "b6", "code": "logger.debug(\"ログイン成功も含めてすべて記録\")"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["print はログ基盤を通らないため、レベルもフィルタも使えません。", "要件は「失敗のときだけ」です。成功も含めて記録する行は不要です。", "異常を表すレベルのメソッドを、条件付きで呼ぶ形にします。"], "explanation": "失敗時のみ記録するので、`if !login(...)` の条件付きで `logger.error(...)` を呼びます。error レベルにしておくと、あとから重要度で絞り込めます。print はログストアに残らずフィルタもできないため、リリース後の調査に使えません。成功も含めてすべてを記録する行は、ログ量を増やして必要な情報を埋もれさせるだけで、要件にも反します。", "detail": {"concept": "ログ設計は「あとで何を知りたいか」から逆算します。すべてを記録すると探せなくなり、記録しなさすぎると調査できません。異常系を優先的に残すのが基本です。", "steps": ["`login(...)` の結果が false のときだけ分岐に入る。", "`logger.error(...)` … 異常を表すレベルで記録する。", "レベルとカテゴリが付くので、あとから絞り込める。", "成功時は記録しないため、ログ量が抑えられる。"], "whyCorrect": "条件付きの error 呼び出しが「失敗のときだけ」という要件をそのまま表しています。レベル指定によって、調査時の絞り込みも可能になります。", "commonMistakes": ["すべてを debug で記録して、あとから探せなくなる例です。件数が多いログは既定で保持されないこともあります。", "失敗の記録にユーザー識別子を含める場合、プライバシー指定を忘れないようにします。既定では伏せ字になります。"], "takeaway": "異常系を error で残す。print はリリース後の調査に使えない。", "example": {"code": "import OSLog\nlet logger = Logger(subsystem: \"com.example.app\", category: \"auth\")\nfunc login(_ user: String) -> Bool { user == \"yuki\" }\nfor user in [\"yuki\", \"taro\"] {\n    if !login(user) { logger.error(\"ログイン失敗\") }\n    print(user, login(user))\n}", "output": "yuki true\ntaro false", "explanation": "失敗した taro のときだけ error が記録されます（ログ自体は標準出力には出ません）。"}}, "seriesId": "development-logging", "seriesStep": 3}, {"id": "practice-development-018", "track": "development", "lessonId": "dev-instruments", "type": "trace", "difficulty": 3, "title": "重複判定のループを追う", "prompt": "Instruments で遅さの原因を探す前に、まず動作を手で追います。最後に表示される値を選んでください。", "skills": ["debugging", "collections"], "content": {"code": "var seen: [String] = []\nvar dupes = 0\nfor w in [\"a\", \"b\", \"a\", \"c\", \"b\"] {\n    if seen.contains(w) { dupes += 1 } else { seen.append(w) }\n}\nprint(seen.count, dupes)", "options": [{"id": "o1", "label": "3 2"}, {"id": "o2", "label": "5 0"}, {"id": "o3", "label": "3 5"}, {"id": "o4", "label": "2 3"}]}, "solution": {"optionId": "o1"}, "hints": ["seen に追加されるのは、まだ見ていない語だけです。", "重複としてカウントされるのは、すでに seen にある語が現れたときです。", "登場する語の種類は a・b・c の3つ、そのうち重複して現れたのは2回です。"], "explanation": "初出の語だけが seen に追加されるため、seen には a・b・c の3件が入ります。すでに seen にある語（3番目の a と5番目の b）が現れたときに dupes が増えるので、dupes は2になります。したがって「3 2」が表示されます。なお、この実装は `seen.contains` が配列の線形探索（要素数に比例した時間）なので、語彙が増えると急激に遅くなります。Instruments で計測すると contains に時間が集中していることが見えるはずで、Set に置き換えるのが定石です。", "detail": {"concept": "性能の問題は、まず動作の正しさを確認してから計測します。正しく動いているコードのどこに時間がかかっているかを、推測ではなく計測で特定するのが Instruments の役割です。", "steps": ["a: 未登録なので seen に追加（seen=[a]）。", "b: 未登録なので追加（seen=[a,b]）。", "a: 既にあるので dupes=1。", "c: 追加（seen=[a,b,c]）。", "b: 既にあるので dupes=2。結果は「3 2」。"], "whyCorrect": "初出かどうかで追加と加算が排他的に分岐するため、種類数と重複数の合計が入力件数（5）に一致します。3 + 2 = 5 という関係が検算になります。", "commonMistakes": ["dupes を「重複した種類の数」と読み違える間違いです。ここでは重複して現れた回数を数えています。", "配列の contains を頻繁に呼ぶ実装は、件数が増えると計算量が二乗に近づきます。Set なら要素数によらず高速です。"], "takeaway": "動作を確認してから計測する。配列の contains はループ内で使うと重い。", "example": {"code": "var seen = Set<String>()\nvar dupes = 0\nfor w in [\"a\", \"b\", \"a\", \"c\", \"b\"] {\n    if !seen.insert(w).inserted { dupes += 1 }\n}\nprint(seen.count, dupes)", "output": "3 2", "explanation": "Set に置き換えても結果は同じで、件数が増えたときの速度だけが変わります。"}}}, {"id": "practice-development-019", "track": "development", "lessonId": "dev-swift-testing", "type": "testReasoning", "difficulty": 2, "title": "0を渡したときだけ落ちるテストを読む", "prompt": "新しく追加した1件のテストだけが失敗します。実装と要件のどこがずれていますか。", "skills": ["testing", "debugging"], "content": {"requirement": "isEven(_:) は偶数なら true を返す。0 は偶数として扱う。", "code": "func isEven(_ n: Int) -> Bool { n > 0 && n % 2 == 0 }", "tests": [{"name": "正の偶数", "input": "4", "expected": "true", "result": "成功"}, {"name": "ゼロ", "input": "0", "expected": "true", "result": "失敗（false が返った）"}], "options": [{"id": "o1", "label": "n > 0 という条件が余分にあるため、要件どおり 0 を偶数として扱えていない"}, {"id": "o2", "label": "% 演算子は 0 に対して使えないため、実行時エラーになっている"}, {"id": "o3", "label": "戻り値が Optional のため、期待値と比較できていない"}, {"id": "o4", "label": "0 は偶数ではないので、テストの期待値のほうが誤っている"}]}, "solution": {"optionId": "o1"}, "hints": ["要件に「0 は偶数として扱う」と明記されています。", "実装の条件式は2つの条件を && でつないでいます。それぞれが 0 に対してどうなるか確かめてください。", "0 % 2 == 0 は真ですが、もう片方の条件が偽になっています。"], "explanation": "失敗したテストが表しているのは「0 を偶数として扱う」という要件です。検証している入力は 0 そのもので、正負の境界にあたる代表的な値です。実装は `n > 0 && n % 2 == 0` となっており、0 では前半の条件が偽になるため全体が false になります。偶数判定に必要なのは剰余の条件だけで、正の数に限る条件は要件のどこにも書かれていません。4 のテストが通っているのは、たまたま両方の条件を満たすためです。修正は `n % 2 == 0` だけにすることで、0 も負の偶数も正しく判定できます。", "detail": {"concept": "実装に「要件に書かれていない条件」が紛れ込むと、特定の入力でだけ結果がずれます。境界値のテストは、この種の余分な条件を露出させます。", "steps": ["要件は「偶数なら true、0 も偶数」。", "実装は正の数であることも要求している。", "0 は 0 > 0 が偽なので false になる。", "`n % 2 == 0` だけにすると、0 も -2 も true になる。"], "whyCorrect": "失敗しているのが 0 のときだけであり、正の偶数は通っています。この分かれ方は、正負を判定する余分な条件の存在を正確に指しています。", "commonMistakes": ["負の数のテストがないため、-2 でも同じ問題が起きることに気づけません。境界は 0 の前後で考えます。", "Swift の % は負の数にも使えます（-3 % 2 は -1）。偶数判定では結果が 0 かどうかを見るので問題ありません。"], "takeaway": "要件にない条件を足さない。境界値のテストがそれを暴く。", "example": {"code": "func isEven(_ n: Int) -> Bool { n % 2 == 0 }\nprint(isEven(4), isEven(0), isEven(-2), isEven(3))", "output": "true true true false", "explanation": "剰余の条件だけにすると、0 と負の偶数も要件どおりに判定されます。"}}, "seriesId": "development-testing", "seriesStep": 1}, {"id": "practice-development-020", "track": "development", "lessonId": "dev-swift-testing", "type": "fillBlank", "difficulty": 2, "title": "Swift Testingのテストを書く", "prompt": "Swift Testing でテストを1件書きます。空欄を埋めてください。", "skills": ["testing"], "noRunSolution": true, "content": {"template": "import Testing\n\n@{{1}}(\"偶数の判定\")\nfunc evenNumbers() {\n    #{{2}}(isEven(4))\n}", "blanks": [{"id": "1", "options": ["Test", "Suite", "XCTest", "Check"]}, {"id": "2", "options": ["expect", "assert", "require", "verify"]}]}, "solution": {"answers": {"1": "Test", "2": "expect"}}, "hints": ["テスト関数であることを示す属性は、@ で始まる1語です。", "検証は関数ではなくマクロで、# で始まります。", "1つめはテスト1件を表す属性、2つめは「失敗しても続行する」検証マクロです。"], "explanation": "Swift Testing では `@Test` 属性でテスト関数を宣言し、`#expect(...)` マクロで条件を検証します。関数名がそのままテスト名になりますが、`@Test(\"表示名\")` で読みやすい名前を付けられます。`#expect` は失敗しても以降の行を続行し、`#require` は失敗した時点でそのテストを中断します（Optional のアンラップにも使えます）。XCTest とは別のフレームワークなので、XCTAssert 系の関数は使いません。", "detail": {"concept": "Swift Testing はマクロを使って、失敗時に式の中身（左辺と右辺の実際の値）を自動的に表示します。XCTest のように専用の比較関数を覚える必要がありません。", "steps": ["`import Testing` … フレームワークを読み込む。", "`@Test(\"表示名\")` … この関数がテストであることを宣言する。", "`#expect(条件)` … 条件が false ならテストが失敗する。", "失敗時には条件式の中の実際の値が出力される。"], "whyCorrect": "@Test と #expect は Swift Testing の中心的な API です。属性とマクロという記法の違いが、そのまま @ と # の使い分けに対応します。", "commonMistakes": ["XCTest の XCTAssertEqual をそのまま使おうとする間違いです。フレームワークが違うため、import も記法も異なります。", "#expect と #require の使い分けを誤る間違いです。それ以降の検証が意味をなさない前提条件には #require を使います。"], "takeaway": "Swift Testing は @Test と #expect。前提が崩れたら止めたいときは #require。", "example": {"code": "func isEven(_ n: Int) -> Bool { n % 2 == 0 }\n// import Testing\n// @Test(\"偶数の判定\")\n// func evenNumbers() {\n//     #expect(isEven(4))\n//     #expect(!isEven(3))\n// }\nprint(isEven(4), !isEven(3))", "output": "true true", "explanation": "テストが検証している条件そのものを、通常のコードとして確認したものです。"}}, "seriesId": "development-testing", "seriesStep": 2}, {"id": "practice-development-021", "track": "development", "lessonId": "dev-swift-testing", "type": "reorder", "difficulty": 3, "title": "テスト1件の構成を並べ替える", "prompt": "税込み価格のテストを1件書きます。ブロックを正しい順に並べ替えてください。", "skills": ["testing"], "noRunSolution": true, "content": {"blocks": [{"id": "b1", "code": "func taxCalculation() {"}, {"id": "b2", "code": "import Testing"}, {"id": "b3", "code": "    let result = priceWithTax(1000, rate: 0.1)"}, {"id": "b4", "code": "@Test(\"税込み価格を計算する\")"}, {"id": "b5", "code": "    #expect(result == 1100)"}, {"id": "b6", "code": "}"}]}, "solution": {"order": ["b2", "b4", "b1", "b3", "b5", "b6"]}, "hints": ["import はファイ
