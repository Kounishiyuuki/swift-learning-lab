"HTTP では「通信の成否」と「業務上の成否」が別レイヤーです。URLSession が扱うのは前者だけなので、後者の判定はアプリ側の責任になります。", "steps": ["`data(from:)` は接続できて応答が返れば成功として返る。", "404 のときも body（エラーページ）と response が返る。", "response のステータスコードを見ないと、成功と区別できない。", "200..<300 の範囲外なら throw して、呼び出し側にエラーとして伝える。"], "whyCorrect": "ステータスコードは HTTP が定めた成否の表明そのものです。ここで弾くことで、後続のデコード処理は「成功応答の本文」だけを扱えばよくなります。", "commonMistakes": ["デコードエラーを見て JSON の構造を疑い続ける間違いです。実際にはエラーページのHTMLをデコードしようとしていることがあります。", "204 No Content のように本文がない成功応答もあります。空チェックを成否判定に使うと、正常系を誤って弾きます。"], "takeaway": "URLSession は 404 を投げない。ステータス検査はアプリの責任。", "example": {"code": "import Foundation\nfunc describe(_ code: Int) -> String {\n    (200..<300).contains(code) ? \"成功\" : \"失敗として扱う\"\n}\nprint(describe(200), describe(204), describe(404), describe(500))", "output": "成功 成功 失敗として扱う 失敗として扱う", "explanation": "成功とみなす範囲を明示しておくと、判定の基準がコードとして残ります。"}}, "seriesId": "foundation-network-safety", "seriesStep": 2}, {"id": "practice-foundation-027", "track": "foundation", "lessonId": "foundation-url-components", "type": "trace", "difficulty": 3, "title": "URLの各部品が何を返すか追う", "prompt": "次のコードを実行したとき、表示される3行を選んでください。", "skills": ["foundation", "debugging"], "content": {"code": "import Foundation\nlet url = URL(string: \"https://example.com/a/b?q=1\")!\nprint(url.path)\nprint(url.query ?? \"-\")\nprint(url.host ?? \"-\")", "options": [{"id": "o1", "label": "/a/b、q=1、example.com"}, {"id": "o2", "label": "a/b、?q=1、https://example.com"}, {"id": "o3", "label": "/a/b?q=1、q=1、example.com"}, {"id": "o4", "label": "/a/b、-、example.com"}]}, "solution": {"optionId": "o1"}, "hints": ["path にクエリは含まれるでしょうか。URL の構造を思い出してください。", "query は ? を含むのか、含まないのかを考えてください。", "host はスキーム（https://）を含まないホスト名だけです。"], "explanation": "URL は「スキーム://ホスト/パス?クエリ」という構造に分解されます。`path` は先頭のスラッシュを含むパス部分だけで、クエリは含みません（/a/b）。`query` は ? より後ろの文字列で、? 自体は含みません（q=1）。`host` はホスト名だけでスキームを含みません（example.com）。それぞれが独立した部品を返すため、結合したい場合は absoluteString を使います。", "detail": {"concept": "URL の各プロパティは構造上の1部品だけを返します。どこまでが含まれるかを正確に把握しておくと、パスの結合やクエリの解析で余計な文字列処理をせずに済みます。", "steps": ["`url.path` … /a/b。クエリもフラグメントも含まない。", "`url.query` … q=1。区切りの ? は含まない。クエリがなければ nil。", "`url.host` … example.com。スキームやポートは含まない。", "全体が必要なら `url.absoluteString` を使う。"], "whyCorrect": "各プロパティの定義が構造上の役割と一致しているためです。区切り文字（? や //）は部品そのものではないので、値には含まれません。", "commonMistakes": ["path にクエリが含まれると考えて、文字列を自分で切り出す間違いです。分解済みのプロパティを使えば不要です。", "query を自分で分割してパラメータを取り出す間違いです。URLComponents の queryItems を使うとデコード済みの値が得られます。"], "takeaway": "URLの各プロパティは1部品だけを返す。区切り文字は含まれない。", "example": {"code": "import Foundation\nlet url = URL(string: \"https://example.com/a/b?q=1\")!\nlet items = URLComponents(url: url, resolvingAgainstBaseURL: false)!.queryItems ?? []\nprint(items.first!.name, items.first!.value ?? \"-\")", "output": "q 1", "explanation": "クエリの解析は自分で文字列を分割せず、queryItems から取り出せます。"}}, "seriesId": "foundation-url-build", "seriesStep": 4}, {"id": "practice-foundation-028", "track": "foundation", "lessonId": "foundation-http-request", "type": "testReasoning", "difficulty": 4, "title": "URL組み立てのテストが落ちた原因を読む", "prompt": "テストが1件失敗しています。実装のどの点が要件に反しているかを選んでください。", "skills": ["testing", "foundation", "debugging"], "noRunSolution": true, "content": {"requirement": "buildURL(query:) は検索語を q という1つのクエリ値として載せる。& や = を含む語でもクエリ構造が壊れないこと。", "code": "func buildURL(query: String) -> URL? {\n    URL(string: \"https://example.com/search?q=\\(query)\")\n}", "tests": [{"name": "単純な語", "input": "swift", "expected": "q の値が swift（項目は1つ）", "result": "成功"}, {"name": "& を含む語", "input": "a&b", "expected": "q の値が a&b（項目は1つ）", "result": "失敗（q の値が a になり、b が別の項目として現れた）"}], "options": [{"id": "o1", "label": "文字列補間でURLを組み立てているため、& が項目の区切りとして解釈され、値が途中で切れている"}, {"id": "o2", "label": "URL(string:) は https スキームを扱えないため組み立てに失敗している"}, {"id": "o3", "label": "query が空文字のときにだけ失敗する境界の問題である"}, {"id": "o4", "label": "戻り値が Optional であるため、テスト側の期待値の書き方が誤っている"}]}, "solution": {"optionId": "o1"}, "hints": ["2つのテストの入力の違いは、記号を含むかどうかだけです。", "& はクエリ文字列の中で特別な意味を持ちます。値の一部として送るには変換が必要です。", "補間はただ文字を並べるだけで、URLとしての意味を考慮しません。"], "explanation": "失敗したテストが表しているのは「検索語をそのまま1つの値として送る」という要件です。検証している入力 a&b は、クエリ文字列で区切りとして使われる予約文字を含む代表的な境界ケースです。実装は文字列補間でURLを組み立てているため、生成される文字列は `?q=a&b` となり、URLとしては「q=a」と「b」という2つの項目として解釈されます。その結果 q の値が a に切り詰められ、期待値と食い違います。URL自体は文字列として有効なので nil にはならず、エラーも起きないまま値だけが静かに欠ける点が、このバグの発見を難しくしています。修正は URLComponents と URLQueryItem を使って組み立てることで、& が %26 にエンコードされ、1つの値として保たれます。", "detail": {"concept": "「構文としては有効だが意味が違う」バグは、テストで境界文字を入れないと発見できません。URL・SQL・HTML など、文字列に構造を持たせる領域に共通する問題です。", "steps": ["要件は「1つのクエリ値として載せる」。", "補間は文字を並べるだけで、予約文字の変換をしない。", "`?q=a&b` は q=a と b の2項目として解釈される。", "URLComponents 経由なら %26 にエンコードされ、1項目として保たれる。"], "whyCorrect": "単純な語では成功し、予約文字を含む語だけが失敗しています。この分かれ方は、エンコードの欠如という原因を正確に指しています。スキームや Optional の問題であれば、単純な語のテストも失敗するはずです。", "commonMistakes": ["手元の検索語で動いたことをもって完成とみなす間違いです。ユーザー入力には記号や日本語が普通に含まれます。", "& だけを replacingOccurrences で置換する対応です。他の予約文字（= # + %）が残り、同じ問題が別の入力で再発します。"], "takeaway": "URLに外部入力を載せるときは必ず構造として組み立てる。補間は意味を保証しない。", "example": {"code": "import Foundation\nfunc buildURL(query: String) -> URL? {\n    var c = URLComponents(string: \"https://example.com/search\")\n    c?.queryItems = [URLQueryItem(name: \"q\", value: query)]\n    return c?.url\n}\nlet url = buildURL(query: \"a&b\")!\nprint(URLComponents(url: url, resolvingAgainstBaseURL: false)!.queryItems!)", "output": "[q=a&b]", "explanation": "クエリ項目が1つだけで、値が a&b のまま保たれていることが確認できます。"}}, "seriesId": "foundation-request", "seriesStep": 3}, {"id": "practice-foundation-029", "track": "foundation", "lessonId": "foundation-filemanager", "type": "chooseBlocks", "difficulty": 3, "title": "ファイルを書き出すのに必要な行だけ選ぶ", "prompt": "一時ディレクトリに note.txt を書き出し、存在を確認します。必要な行だけを選び、正しい順に並べてください。", "skills": ["foundation"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "let dir = FileManager.default.temporaryDirectory"}, {"id": "b3", "code": "let url = dir.appendingPathComponent(\"note.txt\")"}, {"id": "b4", "code": "try? Data(\"hello\".utf8).write(to: url)"}, {"id": "b5", "code": "print(FileManager.default.fileExists(atPath: url.path))"}, {"id": "b6", "code": "let url = URL(string: dir.path + \"/note.txt\")!"}, {"id": "b7", "code": "let dir = URL(fileURLWithPath: \"/Documents\")"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5"], "order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["ディレクトリの場所は自分で文字列として書かず、FileManager から取得します。", "パスの結合は文字列連結ではなく、URL のメソッドで行います。", "`/Documents` のような絶対パスは、アプリのサンドボックス内には存在しません。"], "explanation": "書き出し先のディレクトリは FileManager から取得します（アプリのサンドボックス内の実際の場所は実行環境によって変わるため、固定文字列で書けません）。パスの結合は `appendingPathComponent` を使い、区切り文字の重複や欠落を自分で管理しないようにします。`URL(string:)` にファイルパス文字列を渡すと file スキームが付かない不完全な URL になり、書き込みに失敗します。書き込みは失敗しうるので try? か do-catch が必要です。", "detail": {"concept": "ファイルの場所は環境ごとに異なります。FileManager が返す URL を起点にして相対的に組み立てることで、実行環境に依存しないコードになります。", "steps": ["`FileManager.default.temporaryDirectory` … 一時ファイル用のディレクトリURL。", "`appendingPathComponent(\"note.txt\")` … 区切り文字を意識せずにファイルURLを作る。", "`Data(...).write(to:)` … 失敗しうるので try が必要。", "`fileExists(atPath:)` … URL ではなくパス文字列を取るAPIなので `.path` を渡す。"], "whyCorrect": "起点のディレクトリを実行時に取得し、結合を URL のメソッドに任せているため、環境やファイル名に依存せず正しいURLが得られます。", "commonMistakes": ["パスを文字列連結で組み立てる間違いです。スラッシュの重複や、名前に含まれる特殊文字で壊れます。", "`/Documents` のような絶対パスを書く間違いです。アプリはサンドボックス内でしかファイルを扱えません。", "write の失敗を無視すると、保存できていないのに成功したように見えます。実際のアプリでは do-catch でエラーを扱います。"], "takeaway": "場所は FileManager から取得し、結合は appendingPathComponent。文字列連結は使わない。", "example": {"code": "import Foundation\nlet dir = FileManager.default.temporaryDirectory\nlet url = dir.appendingPathComponent(\"practice-note.txt\")\ntry? Data(\"hello\".utf8).write(to: url)\nprint(FileManager.default.fileExists(atPath: url.path))\ntry? FileManager.default.removeItem(at: url)\nprint(FileManager.default.fileExists(atPath: url.path))", "output": "true\nfalse", "explanation": "書き出し・存在確認・削除まで通すと、ファイル操作の一巡が確認できます。"}}, "seriesId": "foundation-file-io", "seriesStep": 1}, {"id": "practice-foundation-030", "track": "foundation", "lessonId": "foundation-filemanager", "type": "repair", "difficulty": 3, "title": "ファイルパスからURLを作る書き方に直す", "prompt": "file スキームを持つ URL を作りたいのに「なし」と表示されます。3行目の修正として正しいものを選んでください。", "skills": ["foundation", "debugging"], "content": {"code": "import Foundation\nlet path = FileManager.default.temporaryDirectory.path\nlet url = URL(string: path)!\nprint(url.scheme ?? \"なし\")", "options": [{"id": "o1", "code": "let url = URL(fileURLWithPath: path)"}, {"id": "o2", "code": "let url = URL(string: path)!.absoluteURL"}, {"id": "o3", "code": "let url = URL(string: path.replacingOccurrences(of: \" \", with: \"%20\"))!"}, {"id": "o4", "code": "let url = URL(string: path)?.standardized ?? URL(string: \"/\")!"}]}, "solution": {"optionId": "o1", "fixedCode": "import Foundation\nlet path = FileManager.default.temporaryDirectory.path\nlet url = URL(fileURLWithPath: path)\nprint(url.scheme ?? \"なし\")"}, "hints": ["URL(string:) は「URL文字列」を解釈します。渡しているのは何でしょうか。", "ファイルパスは file:// で始まる形ではないため、スキームのない相対URLとして解釈されます。", "ファイルパスからURLを作る専用の初期化子があります。エンコードやスキーム付与を自動で行います。"], "explanation": "バグは3行目です。`URL(string:)` はURL文字列を解釈する初期化子なので、`/var/folders/...` のようなファイルパスを渡すとスキームのない相対URLになり、scheme は nil になります。この URL をファイル操作に使うと、パスが解決できず失敗します。クラッシュしないぶん、「なぜかファイルが読めない」という形で現れます。修正は `URL(fileURLWithPath:)` を使うことで、file スキームが付与され、パス中の特殊文字も適切に扱われます。絶対URL化や部分的な置換では、スキームがない問題そのものは解決しません。", "detail": {"concept": "URL には「ネットワークのURL」と「ファイルURL」の2種類があり、作り方が異なります。ファイルパスは URL 文字列ではないため、専用の初期化子が必要です。", "steps": ["`temporaryDirectory.path` は /var/folders/... のようなパス文字列。", "`URL(string:)` はこれをスキームなしの相対URLとして解釈する。", "そのため scheme は nil になり、ファイルURLとして機能しない。", "`URL(fileURLWithPath:)` なら file:///var/folders/... という完全なファイルURLになる。"], "whyCorrect": "fileURLWithPath はファイルシステムのパスを前提とした初期化子で、スキームの付与とエンコードを引き受けます。目的（ファイルURLを作る）と手段が一致しています。", "commonMistakes": ["`URL(string: \"file://\" + path)` と自分で組み立てる間違いです。パスに空白や日本語が含まれるとエンコードが必要になり、壊れます。", "URL と パス文字列を混ぜて扱う間違いです。API によって URL を取るものと String のパスを取るものがあるため、変換の向きを意識します。"], "takeaway": "ファイルパス → URL は fileURLWithPath。URL(string:) はネットワークURL用。", "example": {"code": "import Foundation\nlet path = FileManager.default.temporaryDirectory.path\nprint(URL(string: path)?.scheme ?? \"なし\")\nprint(URL(fileURLWithPath: path).scheme ?? \"なし\")", "output": "なし\nfile", "explanation": "同じパス文字列でも、初期化子を変えるだけでスキームの有無が変わります。"}}, "seriesId": "foundation-file-io", "seriesStep": 2}, {"id": "practice-foundation-031", "track": "foundation", "lessonId": "foundation-userdefaults", "type": "matching", "difficulty": 1, "title": "UserDefaultsのAPIを対応づける", "prompt": "UserDefaults の要素と、その役割を対応させてください。", "skills": ["foundation"], "content": {"left": [{"id": "l1", "label": "UserDefaults.standard"}, {"id": "l2", "label": "set(_:forKey:)"}, {"id": "l3", "label": "object(forKey:)"}, {"id": "l4", "label": "register(defaults:)"}], "right": [{"id": "r1", "label": "アプリの設定を保存する共有のストア"}, {"id": "r2", "label": "キーを指定して値を保存する"}, {"id": "r3", "label": "キーを指定して値を取り出す。未登録なら nil が返る"}, {"id": "r4", "label": "起動時に既定値を用意する。ディスクには保存されない"}, {"id": "r5", "label": "保存されている値をすべて削除する"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["standard はインスタンスであってメソッドではありません。", "object(forKey:) は型を決めずに取り出すため、戻り値が Optional です。", "register は「保存」ではなく「未設定のときの既定値」を用意する仕組みです。"], "explanation": "`UserDefaults.standard` はアプリ全体で共有される設定ストアです。`set(_:forKey:)` で保存し、`object(forKey:)` で取り出します（未登録なら nil）。`register(defaults:)` は「まだ保存されていないときに使う既定値」を登録するもので、ディスクには書き込まれず、アプリの起動ごとに設定し直します。r5 は該当するAPIがなく、実際には removePersistentDomain などを使います。", "detail": {"concept": "UserDefaults は「小さな設定値のための辞書」です。保存された値と、コード上で用意した既定値は別のレイヤーにあり、読み出し時に重ね合わされます。", "steps": ["`register(defaults:)` で既定値を登録する（保存はされない）。", "`set(_:forKey:)` で実際の値を保存する。", "読み出し時は、保存値があればそれ、なければ既定値が返る。", "`object(forKey:)` は型を問わず取り出すため Optional を返す。"], "whyCorrect": "4つはストア本体・書き込み・読み出し・既定値という異なる役割を持ち、説明と1対1で対応します。register だけが「保存しない」点が区別のポイントです。", "commonMistakes": ["UserDefaults を大量のデータや機密情報の保存に使う間違いです。plist として平文で保存されるため、トークンなどは Keychain を使います。", "register を毎回呼ぶことを忘れる間違いです。保存されないため、起動のたびに登録が必要です。"], "takeaway": "UserDefaultsは小さな設定用。register は既定値であって保存ではない。", "example": {"code": "import Foundation\nlet d = UserDefaults.standard\nd.register(defaults: [\"fontSize\": 14])\nprint(d.integer(forKey: \"fontSize\"))\nprint(d.object(forKey: \"notSaved\") == nil)", "output": "14\ntrue", "explanation": "register した既定値は読み出せますが、object(forKey:) では未保存のキーは nil になります。"}}, "seriesId": "foundation-defaults", "seriesStep": 1}, {"id": "practice-foundation-032", "track": "foundation", "lessonId": "foundation-userdefaults", "type": "bugHunt", "difficulty": 2, "title": "未設定と false を区別できない行を見つける", "prompt": "「まだ一度も設定していないときだけ表示したい」のに、明示的に false を保存したあとも表示されてしまいます。原因になっている行を選んでください。", "skills": ["foundation", "debugging", "optional"], "content": {"lines": [{"id": "l1", "code": "import Foundation"}, {"id": "l2", "code": "let d = UserDefaults.standard"}, {"id": "l3", "code": "if d.bool(forKey: \"didOnboard\") == false {"}, {"id": "l4", "code": "    print(\"オンボーディングを表示\")"}, {"id": "l5", "code": "}"}]}, "solution": {"optionId": "l3", "fixedCode": "import Foundation\nlet d = UserDefaults.standard\nif d.object(forKey: \"didOnboard\") == nil {\n    print(\"オンボーディングを表示\")\n}"}, "hints": ["bool(forKey:) は、キーが存在しないときに何を返すでしょうか。", "戻り値が Bool である以上、「未設定」を表す値がありません。", "未設定かどうかを知るには、Optional を返すAPIで判定する必要があります。"], "explanation": "バグは3行目です。`bool(forKey:)` は戻り値が非Optionalの Bool なので、キーが未登録のときも false を返します。つまり「まだ設定していない」と「false を保存した」を区別できません。挙動としては、意図した初回だけでなく、明示的に false を保存した場合にも条件が成立してしまいます。修正は `object(forKey:)` を使い、nil かどうかで未設定を判定することです。値としての true/false が必要な場面と、設定済みかどうかを知りたい場面では、使うAPIが変わります。", "detail": {"concept": "「値がない」と「既定値と同じ値である」は別の状態です。非Optionalを返すAPIはこの2つを潰してしまうため、区別が必要なときは Optional を返すAPIを選びます。", "steps": ["`bool(forKey:)` の戻り値は Bool。未登録でも false。", "したがって条件 `== false` は未登録でも保存済みfalseでも真になる。", "`object(forKey:)` は Any? を返すため、未登録なら nil。", "nil 判定にすれば「一度も設定されていない」だけを検出できる。"], "whyCorrect": "問題は判定に使っているAPIの戻り値の型です。4行目の処理自体は正しく、条件の作り方だけが要件と食い違っています。", "commonMistakes": ["integer(forKey:) も未登録で 0 を返すため、同じ取り違えが起きます。0 が正当な値である場合は特に危険です。", "register(defaults:) で既定値を登録した場合、object(forKey:) は既定値を返すため nil になりません。判定方法と既定値の設計はセットで考えます。"], "takeaway": "未設定を知りたいなら object(forKey:) の nil 判定。bool/integer は既定値に潰す。", "example": {"code": "import Foundation\nlet d = UserDefaults.standard\nlet key = \"practice-unset-key-xyz\"\nprint(d.bool(forKey: key))\nprint(d.object(forKey: key) == nil)", "output": "false\ntrue", "explanation": "同じ未登録キーに対して、bool は false を、object は nil を返します。この差が判定の分かれ目です。"}}, "seriesId": "foundation-defaults", "seriesStep": 2}, {"id": "practice-foundation-033", "track": "foundation", "lessonId": "foundation-userdefaults", "type": "fillBlank", "difficulty": 1, "title": "設定を保存して読み出す", "prompt": "名前を保存して、そのまま読み出して表示します。空欄を埋めてください。", "skills": ["foundation"], "content": {"template": "import Foundation\nlet d = UserDefaults.standard\nd.{{1}}(\"Yuki\", forKey: \"practice-name\")\nprint(d.{{2}}(forKey: \"practice-name\") ?? \"未設定\")", "blanks": [{"id": "1", "options": ["set", "save", "put", "write"]}, {"id": "2", "options": ["string", "text", "value", "get"]}]}, "solution": {"answers": {"1": "set", "2": "string"}}, "hints": ["保存のメソッド名は、辞書に値を入れるときと同じ動詞です。", "読み出しは型ごとに専用のメソッドがあります。保存したのは文字列です。", "1つめは値を設定する動詞、2つめは型名をそのまま小文字にしたメソッド名です。"], "explanation": "`set(_:forKey:)` で値を保存し、`string(forKey:)` で文字列として読み出します。型ごとの読み出しメソッド（string / integer / bool / data など）があり、string は保存されていない場合や型が違う場合に nil を返すため `?? \"未設定\"` で既定値を与えています。実行すると「Yuki」が表示されます。", "detail": {"concept": "UserDefaults は内部的には Any を保存する辞書なので、読み出し側で期待する型を指定します。型ごとのメソッドは、その変換を安全に行うための入口です。", "steps": ["`set(\"Yuki\", forKey: \"practice-name\")` … 値とキーを渡して保存する。", "保存はアプリの設定ファイルに書き込まれ、次回起動時にも残る。", "`string(forKey:)` … String? を返す。型が違えば nil。", "`?? \"未設定\"` で nil の場合の表示を決めている。"], "whyCorrect": "保存した型（String）と読み出しメソッド（string）が一致しているため、値がそのまま取得できます。型が食い違うと nil になり、既定値が表示されます。", "commonMistakes": ["保存した型と違うメソッドで読み出す間違いです。integer(forKey:) で文字列を読むと 0 が返り、原因が分かりにくくなります。", "独自の struct をそのまま set しようとする間違いです。保存できるのはプロパティリスト対応の型だけなので、Codable で Data に変換してから保存します。"], "takeaway": "保存は set、読み出しは型ごとのメソッド。型がずれると静かに失敗する。", "example": {"code": "import Foundation\nlet d = UserDefaults.standard\nd.set(\"Yuki\", forKey: \"practice-name\")\nprint(d.string(forKey: \"practice-name\") ?? \"未設定\")\nprint(d.integer(forKey: \"practice-name\"))", "output": "Yuki\n0", "explanation": "同じキーでも型の違うメソッドで読むと、エラーにならず 0 が返ってしまいます。"}}, "seriesId": "foundation-defaults", "seriesStep": 3}, {"id": "practice-foundation-034", "track": "foundation", "lessonId": "foundation-notificationcenter", "type": "reorder", "difficulty": 3, "title": "通知の登録と送信の順に並べる", "prompt": "通知を受け取れるようにしてから送信し、最後に登録を解除します。ブロックを正しい順に並べ替えてください。", "skills": ["foundation", "architecture"], "content": {"blocks": [{"id": "b1", "code": "NotificationCenter.default.post(name: .didUpdate, object: nil)"}, {"id": "b2", "code": "import Foundation"}, {"id": "b3", "code": "extension Notification.Name { static let didUpdate = Notification.Name(\"didUpdate\") }"}, {"id": "b4", "code": "let token = NotificationCenter.default.addObserver(forName: .didUpdate, object: nil, queue: nil) { _ in print(\"更新を受け取った\") }"}, {"id": "b5", "code": "NotificationCenter.default.removeObserver(token)"}]}, "solution": {"order": ["b2", "b3", "b4", "b1", "b5"]}, "hints": ["通知名の定義は、使う行より前に必要です。", "送信より先に受け取る準備ができていなければ、通知は誰にも届きません。", "import → 通知名の定義 → 登録 → 送信 → 解除、の順です。"], "explanation": "NotificationCenter は通知を保存しないため、post の時点で登録されている購読者にしか届きません。したがって addObserver は post より前に実行する必要があります。通知名は Notification.Name の extension として定義しておくと、文字列の打ち間違いをコンパイル時に防げます。最後に removeObserver で登録を解除し、不要になった購読を残さないようにします。", "detail": {"concept": "NotificationCenter は「今聞いている人にだけ届く放送」です。あとから登録しても過去の通知は受け取れないため、登録と送信の順序がそのまま動作を決めます。", "steps": ["`extension Notification.Name` … 通知名を定数として定義する。", "`addObserver(forName:object:queue:)` … 購読を開始し、解除用のトークンを受け取る。", "`post(name:object:)` … 登録済みの購読者にクロージャが実行される。", "`removeObserver(token)` … 購読を解除する。"], "whyCorrect": "登録が送信より前にあるため、post の時点で購読者が存在します。この順序が逆だと、エラーにはならず単に何も起きません。", "commonMistakes": ["登録より前に post してしまい「通知が届かない」と悩む間違いです。エラーが出ないため原因に気づきにくい典型です。", "ブロック形式の addObserver は登録解除を忘れるとクロージャが保持され続けます。トークンを保持して deinit で解除します。", "通知名を文字列リテラルで直接書くと、送信側と受信側で1文字違っても気づけません。"], "takeaway": "NotificationCenter は登録が先。過去の通知は受け取れない。", "example": {"code": "import Foundation\nextension Notification.Name { static let didUpdate = Notification.Name(\"didUpdate\") }\nNotificationCenter.default.post(name: .didUpdate, object: nil)\nlet token = NotificationCenter.default.addObserver(forName: .didUpdate, object: nil, queue: nil) { _ in print(\"受け取った\") }\nprint(\"登録完了\")\nNotificationCenter.default.removeObserver(token)", "output": "登録完了", "explanation": "登録より前に post したため、通知は誰にも届かず「受け取った」は出力されません。"}}, "seriesId": "foundation-notification", "seriesStep": 1}, {"id": "practice-foundation-035", "track": "foundation", "lessonId": "foundation-notificationcenter", "type": "buildFunction", "difficulty": 4, "title": "購読を安全に管理するクラスを組み立てる", "prompt": "通知を購読し、破棄時に必ず解除するクラスを作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["foundation", "memory", "architecture"], "content": {"blocks": [{"id": "b1", "code": "import Foundation"}, {"id": "b2", "code": "extension Notification.Name { static let didUpdate = Notification.Name(\"didUpdate\") }"}, {"id": "b3", "code": "final class Watcher {"}, {"id": "b4", "code": "    private var token: NSObjectProtocol?"}, {"id": "b5", "code": "    func start() {"}, {"id": "b6", "code": "        token = NotificationCenter.default.addObserver(forName: .didUpdate, object: nil, queue: nil) { [weak self] _ in self?.handle() }"}, {"id": "b7", "code": "    }"}, {"id": "b8", "code": "    func handle() { print(\"更新\") }"}, {"id": "b9", "code": "    deinit { if let token { NotificationCenter.default.removeObserver(token) } }"}, {"id": "b10", "code": "}"}, {"id": "b11", "code": "        token = NotificationCenter.default.addObserver(forName: .didUpdate, object: nil, queue: nil) { _ in self.handle() }"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8", "b9", "b10"]}, "hints": ["クロージャがそのまま self を強く捕捉すると、解除するまでインスタンスが解放されません。", "解除に必要なトークンは、あとで使えるようにプロパティとして保持します。", "import → 通知名 → クラス宣言 → トークン → start → 登録 → start を閉じる → handle → deinit → クラスを閉じる、の10行です。"], "explanation": "ブロック形式の addObserver は、渡したクロージャを NotificationCenter が保持し続けます。そのクロージャが self を強参照すると、removeObserver するまでインスタンスが解放されず、deinit も呼ばれないため解除の機会が永久に来ません。`[weak self]` にすることでこの循環が切れ、インスタンスが解放されるときに deinit が実行されて登録も解除されます。トークンをプロパティに保持しているのは、解除時に必要だからです。", "detail": {"concept": "購読の登録は「解除まで含めて1組」です。解除のタイミングを deinit に置くなら、deinit が確実に呼ばれるように参照の強さを設計する必要があります。", "steps": ["`private var token: NSObjectProtocol?` … 解除に使うトークンを保持する。", "`addObserver(...) { [weak self] _ in self?.handle() }` … 弱参照で self を捕捉する。", "NotificationCenter はクロージャを保持するが、self は弱参照なので解放を妨げない。", "インスタンスが解放されると deinit が呼ばれ、removeObserver が実行される。"], "whyCorrect": "weak によって NotificationCenter → self の強参照が切れ、参照カウントが正しく0になります。その結果 deinit が呼ばれ、登録解除まで自動的に完了します。", "commonMistakes": ["`{ _ in self.handle() }` と強参照で書く間違いです。deinit が呼ばれなくなり、解除もされず、通知のたびに古いインスタンスが動き続けます。", "トークンを保持せずに登録する間違いです。解除のしようがなくなります。", "セレクタ形式の addObserver は解除を忘れても比較的安全ですが、こちらのブロック形式では明示的な解除が必要です。"], "takeaway": "ブロック形式の購読は [weak self] + トークン保持 + deinit で解除、の3点セット。", "example": {"code": "import Foundation\nextension Notification.Name { static let didUpdate = Notification.Name(\"didUpdate\") }\nfinal class Watcher {\n    private var token: NSObjectProtocol?\n    func start() { token = NotificationCenter.default.addObserver(forName: .didUpdate, object: nil, queue: nil) { [weak self] _ in self?.handle() } }\n    func handle() { print(\"更新\") }\n    deinit { print(\"deinit\"); if let token { NotificationCenter.default.removeObserver(token) } }\n}\nvar w: Watcher? = Watcher()\nw?.start()\nNotificationCenter.default.post(name: .didUpdate, object: nil)\nw = nil", "output": "更新\ndeinit", "explanation": "通知を受け取ったあと、参照を切ると deinit が呼ばれて解除まで完了しています。"}}, "seriesId": "foundation-notification", "seriesStep": 2}, {"id": "practice-foundation-036", "track": "foundation", "lessonId": "foundation-regex", "type": "shortCode", "difficulty": 3, "title": "数字が含まれるか判定する1行を書く", "prompt": "text に数字が1文字でも含まれるかを true / false で表示する1行を書いてください。正規表現リテラル `#/\\d/#` を使います。", "skills": ["foundation", "syntax"], "content": {"context": "import Foundation\nlet text = \"abc123\"\n// ここに1行書く（true と表示されるようにする）", "contextRun": "import Foundation\nlet text = \"abc123\"\n{{answer}}", "placeholder": "例: print(値.contains(正規表現))"}, "solution": {"accepted": ["print(text.contains(#/\\d/#))"]}, "hints": ["「含まれるか」を判定するメソッドは、文字列でも正規表現でも同じ名前です。", "正規表現を渡すと、パターンに一致する部分があるかを調べてくれます。", "print のかっこの中に、text に対する contains 呼び出しを書きます。パターンは問題文のリテラルをそのまま使います。"], "explanation": "`print(text.contains(#/\\d/#))` と書きます。String の contains は正規表現も受け取れるため、`\\d`（数字1文字）に一致する部分があるかを判定できます。ここでは \"abc123\" に数字があるので true が表示されます。`#/.../#` は拡張区切りの正規表現リテラルで、Swift 5 言語モードのままでも使えます（区切りなしの `/.../` は言語モードの設定によっては割り算と解釈されてしまいます）。", "detail": {"concept": "Swift の正規表現リテラルは、パターンがコンパイル時に検証されます。文字列としてパターンを書く場合と違い、書き間違いを実行前に見つけられます。", "steps": ["`#/\\d/#` は「数字1文字」を表す正規表現。", "`text.contains(_:)` に正規表現を渡すと、一致する部分の有無を Bool で返す。", "\"abc123\" には 1 があるので true。", "一致する場所や内容が必要なら firstMatch(of:) や matches(of:) を使う。"], "whyCorrect": "contains は一致の有無だけを返すため、判定用途にはこれで十分です。正規表現リテラルなのでエスケープを二重にする必要もありません。", "commonMistakes": ["文字列で `\"\\\\d\"` と書いてから NSRegularExpression を組み立てる古い書き方は、エスケープが二重になり読みにくくなります。", "区切りなしの `/\\d/` は、言語モードによっては演算子として解釈されコンパイルエラーになります。迷ったら `#/.../#` を使います。"], "takeaway": "有無の判定は contains(正規表現)。リテラルは `#/.../#` が安全。", "example": {"code": "import Foundation\nprint(\"abc123\".contains(#/\\d/#))\nprint(\"abcdef\".contains(#/\\d/#))\nprint(\"abc123\".firstMatch(of: #/\\d+/#).map { String($0.output) } ?? \"なし\")", "output": "true\nfalse\n123", "explanation": "有無の判定と、一致した部分の取り出しを比べると、使うAPIの違いが分かります。"}}, "seriesId": "foundation-regex-basics", "seriesStep": 1}, {"id": "practice-foundation-037", "track": "foundation", "lessonId": "foundation-regex", "type": "trace", "difficulty": 3, "title": "正規表現の一致結果を追う", "prompt": "次のコードを実行したとき、表示される2行を選んでください。", "skills": ["foundation", "debugging"], "content": {"code": "import Foundation\nlet text = \"a1b22c\"\nlet matches = text.matches(of: #/\\d+/#)\nprint(matches.count)\nprint(matches.map { String($0.output) })", "options": [{"id": "o1", "label": "2 と [\"1\", \"22\"]"}, {"id": "o2", "label": "3 と [\"1\", \"2\", \"2\"]"}, {"id": "o3", "label": "1 と [\"122\"]"}, {"id": "o4", "label": "2 と [\"a1\", \"b22\"]"}]}, "solution": {"optionId": "o1"}, "hints": ["`+` は「直前のパターンの1回以上の繰り返し」を意味します。", "連続した数字はまとめて1つの一致になります。", "\"a1b22c\" の中で連続した数字の並びは 1 と 22 の2か所です。"], "explanation": "`\\d+` は「数字が1文字以上続く部分」に一致し、可能な限り長く一致します（貪欲マッチ）。\"a1b22c\" では \"1\" と \"22\" の2か所が該当するため count は2、取り出した文字列は [\"1\", \"22\"] です。`\\d` だけなら1文字ずつ3か所に一致して [\"1\", \"2\", \"2\"] になります。matches(of:) は一致した箇所すべてを返し、$0.output で一致部分を取り出せます。", "detail": {"concept": "正規表現の繰り返し指定は、既定で「できるだけ長く一致する」貪欲な動作をします。この性質を知らないと、区切りをまたいで一致してしまうバグの原因になります。", "steps": ["`\\d+` は数字1文字以上の連続。", "文字列を左から走査し、\"1\" で1つ目の一致。", "続いて \"22\" が連続した数字なので、まとめて2つ目の一致になる。", "一致は2件、内容は \"1\" と \"22\"。"], "whyCorrect": "隣り合う数字は1つの一致にまとめられるため、22 が2件に分かれることはありません。また文字 a・b・c は数字ではないので一致に含まれません。", "commonMistakes": ["`+` を忘れて `\\d` と書くと、1文字ずつ別々の一致になり件数が変わります。", "貪欲マッチを知らずに `<.+>` のようなパターンを書くと、最初のタグから最後のタグまでを1つとして一致させてしまいます。最短一致には `+?` を使います。"], "takeaway": "`+` は1回以上の繰り返しで、既定は最長一致。", "example": {"code": "import Foundation\nlet text = \"a1b22c\"\nprint(text.matches(of: #/\\d/#).map { String($0.output) })\nprint(text.matches(of: #/\\d+/#).map { String($0.output) })", "output": "[\"1\", \"2\", \"2\"]\n[\"1\", \"22\"]", "explanation": "`+` の有無だけで、一致の単位がまったく変わることが確認できます。"}}, "seriesId": "foundation-regex-basics", "seriesStep": 2}, {"id": "practice-foundation-038", "track": "foundation", "lessonId": "foundation-sequence-collection", "type": "chooseBlocks", "difficulty": 3, "title": "全件変換せずに最初の1件を得る", "prompt": "100万件を変換した結果のうち、6より大きい最初の値がほしいです。全件を変換せずに済む行だけを選び、正しい順に並べてください。", "skills": ["collections", "foundation"], "content": {"blocks": [{"id": "b1", "code": "func doubled(_ n: Int) -> Int { n * 2 }"}, {"id": "b2", "code": "let numbers = Array(1...1_000_000)"}, {"id": "b3", "code": "let firstBig = numbers.lazy.map { doubled($0) }.first { $0 > 6 }"}, {"id": "b4", "code": "print(firstBig ?? -1)"}, {"id": "b5", "code": "let firstBig = numbers.map { doubled($0) }.first { $0 > 6 }"}, {"id": "b6", "code": "let firstBig = numbers.first { doubled($0) > 6 }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4"], "order": ["b1", "b2", "b3", "b4"]}, "hints": ["通常の map は、その場で全要素を変換して新しい配列を作ります。", "変換を「必要になった要素だけ」に遅らせる仕組みがあります。", "求めているのは変換後の値です。変換前の要素を返す書き方では答えが変わってしまいます。"], "explanation": "`numbers.map { ... }.first { ... }` は100万件すべてを変換してから先頭を探します。`numbers.lazy.map { ... }.first { ... }` は遅延評価なので、条件を満たす値が見つかった時点で変換が止まり、この例では4件目までしか評価されません。`numbers.first { doubled($0) > 6 }` も全件は評価しませんが、返るのは変換前の要素（4）なので、求めている変換後の値（8）になりません。結果として正しいのは lazy を挟んだ書き方です。", "detail": {"concept": "lazy は「変換の手順だけを覚えておき、値が要求されたときに1件ずつ流す」仕組みです。途中で打ち切る操作（first、contains など）と組み合わせたときに効果があります。", "steps": ["`numbers.lazy` … 以降の変換を遅延評価にする。", "`.map { doubled($0) }` … この時点では1件も変換されない。", "`.first { $0 > 6 }` … 先頭から1件ずつ変換し、条件を満たした時点で停止する。", "1→2、2→4、3→6、4→8 と評価し、4件目で 8 が見つかって終了する。"], "whyCorrect": "first は条件を満たす最初の要素で走査を打ち切ります。lazy によって map の適用がその走査に同期するため、必要な件数しか変換されません。", "commonMistakes": ["lazy を付ければ常に速くなると考える間違いです。遅延評価には間接呼び出しのコストがあり、全件必要な処理では通常の map より遅くなります。", "配列（Collection）に対する `lazy.filter { }.prefix(3)` は、実測すると評価回数がむしろ増えることがあります（1〜10の配列で16回、通常の filter なら10回）。lazy が効くのは first のように途中で打ち切る操作と組み合わせたときです。", "変換後の値がほしいのに `first(where:)` だけで済ませると、返るのは変換前の要素になります。"], "takeaway": "lazy が効くのは「途中で打ち切る操作」との組み合わせ。付ければ速くなる魔法ではない。", "example": {"code": "let numbers = Array(1...10)\nvar lazyCount = 0\nlet a = numbers.lazy.map { lazyCount += 1; return $0 * 2 }.first { $0 > 6 }\nvar eagerCount = 0\nlet b = numbers.map { eagerCount += 1; return $0 * 2 }.first { $0 > 6 }\nprint(a ?? -1, lazyCount)\nprint(b ?? -1, eagerCount)", "output": "8 4\n8 10", "explanation": "結果は同じ8ですが、変換の実行回数は4回と10回で大きく違います。"}}, "seriesId": "foundation-sequence", "seriesStep": 1}, {"id": "practice-foundation-039", "track": "foundation", "lessonId": "foundation-sequence-collection", "type": "buildFunction", "difficulty": 4, "title": "配列を一定サイズに分割する拡張を組み立てる", "prompt": "配列を指定サイズごとに区切る chunked(into:) を作ります。最後の塊は端数でも構いません。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["collections", "functions"], "content": {"blocks": [{"id": "b1", "code": "extension Array {"}, {"id": "b2", "code": "    func chunked(into size: Int) -> [[Element]] {"}, {"id": "b3", "code": "        guard size > 0 else { return [] }"}, {"id": "b4", "code": "        return stride(from: 0, to: count, by: size).map {"}, {"id": "b5", "code": "            Array(self[$0..<Swift.min($0 + size, count)])"}, {"id": "b6", "code": "        }"}, {"id": "b7", "code": "    }"}, {"id": "b8", "code": "}"}, {"id": "b9", "code": "        return stride(from: 0, through: count, by: size).map {"}, {"id": "b10", "code": "            Array(self[$0..<($0 + size)])"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8"]}, "hints": ["size が 0 以下だと無限ループや不正な範囲になります。先に弾く必要があります。", "最後の塊は size に満たないことがあります。上限をそのまま足すと範囲外になります。", "終端を含まない stride と、上限を count で抑えた範囲を使います。"], "explanation": "`stride(from: 0, to: count, by: size)` は 0, size, 2*size... を count 未満まで生成するので、各塊の開始位置になります。終端は `Swift.min($0 + size, count)` で抑えることで、最後の端数の塊でも範囲外にならずに済みます。`through: count` を使うと開始位置が count と等しくなる場合があり、空の塊が混ざります。上限を抑えない `$0..<($0 + size)` は、最後の塊で 'Range requires lowerBound <= upperBound' や範囲外アクセスになります。size が 0 以下のときの guard も、範囲の不正を防ぐために必要です。", "detail": {"concept": "分割処理は「開始位置の列」と「各区間の終端の抑え込み」の2つで決まります。端数の扱いを最初から式に組み込むと、条件分岐なしで安全に書けます。", "steps": ["`guard size > 0` … 0 や負の size を弾く。stride の by に 0 を渡すとクラッシュする。", "`stride(from: 0, to: count, by: size)` … 各塊の開始位置。count 自身は含まない。", "`$0..<Swift.min($0 + size, count)` … 終端を配列の長さで抑える。", "`Array(self[...])` … ArraySlice を独立した配列に変換する。"], "whyCorrect": "min による抑え込みが端数の塊を正しく扱い、to による排他的な上限が空の塊の発生を防ぎます。extension 内で `Swift.min` と書いているのは、Array のスコープでの名前解決の曖昧さを避けるためです。", "commonMistakes": ["端数を考えずに `$0..<($0 + size)` と書く間違いです。要素数が size の倍数のときだけ動き、そうでないと落ちます。", "ArraySlice をそのまま返す設計は、元の配列を保持し続けます。長く持つなら Array に変換します。"], "takeaway": "分割は「開始位置の列 + 終端の min 抑え」。端数は式で吸収する。", "example": {"code": "extension Array {\n    func chunked(into size: Int) -> [[Element]] {\n        guard size > 0 else { return [] }\n        return stride(from: 0, to: count, by: size).map { Array(self[$0..<Swift.min($0 + size, count)]) }\n    }\n}\nprint([1, 2, 3, 4, 5].chunked(into: 2))\nprint([Int]().chunked(into: 2))", "output": "[[1, 2], [3, 4], [5]]\n[]", "explanation": "端数のある配列と空配列の両方で、例外なく動作することが確認できます。"}}, "seriesId": "foundation-sequence", "seriesStep": 2}, {"id": "practice-foundation-040", "track": "foundation", "lessonId": "foundation-data-modeling", "type": "shortCode", "difficulty": 2, "title": "IDを表す型の宣言行を書く", "prompt": "ユーザーIDを表す UserID 型を作ります。JSONとの変換と、辞書のキーとしての利用の両方ができるようにする宣言行（struct から始まる1行）を書いてください。", "skills": ["types", "protocols", "foundation"], "content": {"context": "// ここに1行書く\n    let value: Int\n}", "contextRun": "{{answer}}\n    let value: Int\n}\nprint(UserID(value: 1) == UserID(value: 1))", "placeholder": "例: struct 型名: プロトコル, プロトコル {"}, "solution": {"accepted": ["struct UserID: Codable, Hashable {", "struct UserID: Hashable, Codable {"]}, "hints": ["必要な能力は2つあります。JSONとの相互変換と、ハッシュ値を持つことです。", "準拠はカンマで並べて書けます。順序はどちらでも構いません。", "型名のあとにコロンを書き、2つのプロトコル名を並べ、中かっこを開きます。"], "explanation": "`struct UserID: Codable, Hashable {` と書きます。Codable によって JSON との相互変換が自動生成され、Hashable によって Set の要素や辞書のキーとして使えるようになります。Hashable は Equatable を含むため == も使えます。Int をそのまま ID として持ち回るのではなく専用の型にすると、ユーザーIDと投稿IDを取り違えるようなバグをコンパイル時に防げます。準拠の順序は任意なので `Hashable, Codable` も正解です。", "detail": {"concept": "「意味のある値」を素の Int や String のまま扱うと、型が同じであるがゆえに取り違えても気づけません。専用の型で包むと、コンパイラが取り違えを検出してくれます。", "steps": ["`struct UserID` … Int を包む専用の型を作る。", "`Codable` … サーバとのやり取りでそのまま使えるようにする。", "`Hashable` … 辞書のキーや Set の要素にできるようにする。", "`let value: Int` … 実際の値を保持する。"], "whyCorrect": "要求されている2つの能力がちょうど2つのプロトコルに対応し、どちらも自動生成が効くため実装を書く必要がありません。", "commonMistakes": ["Equatable だけを書いて辞書のキーにしようとする間違いです。ハッシュ値が必要なので Hashable が要ります。", "IDを素の Int のまま扱う設計です。userID と postID を取り違えても型が同じなのでコンパイルが通ってしまいます。"], "takeaway": "意味のあるIDは専用の型にする。Codable + Hashable が定番の組み合わせ。", "example": {"code": "struct UserID: Codable, Hashable { let value: Int }\nvar names: [UserID: String] = [:]\nnames[UserID(value: 1)] = \"Yuki\"\nprint(names[UserID(value: 1)] ?? \"なし\")", "output": "Yuki", "explanation": "Hashable に準拠しているため、そのまま辞書のキーとして使えます。"}}}, {"id": "practice-foundation-041", "track": "foundation", "lessonId": "foundation-copy-value", "type": "trace", "difficulty": 4, "title": "値型の中に参照型がある場合を追う", "prompt": "struct の中に class のプロパティがあります。最後の print の結果を選んでください。", "skills": ["types", "memory", "debugging"], "content": {"code": "final class Box { var n = 0 }\nstruct Holder { var box = Box(); var count = 0 }\nvar h1 = Holder()\nvar h2 = h1\nh2.count = 5\nh2.box.n = 9\nprint(h1.count, h1.box.n)", "options": [{"id": "o1", "label": "0 9"}, {"id": "o2", "label": "0 0"}, {"id": "o3", "label": "5 9"}, {"id": "o4", "label": "5 0"}]}, "solution": {"optionId": "o1"}, "hints": ["Holder は struct なので、代入時にコピーされます。何がコピーされるのでしょうか。", "count は Int（値型）ですが、box は class への参照です。", "コピーされるのは「参照そのもの」であって、参照先のインスタンスは複製されません。"], "explanation": "Holder は値型なので `var h2 = h1` でコピーが作られますが、コピーされるのは各プロパティの値です。count は Int なので独立した値としてコピーされ、h2.count の変更は h1 に影響しません（h1.count は0のまま）。一方 box は Box への参照であり、コピーされるのは参照だけなので h1.box と h2.box は同じインスタンスを指します。そのため h2.box.n = 9 は h1 からも見え、出力は「0 9」になります。これは値型に見えて一部だけ共有されるという、発見しにくいバグの典型です。", "detail": {"concept": "値型のコピーは「浅いコピー」です。プロパティが参照型なら、参照がコピーされるだけで参照先は共有されます。値型だから安全、とは限りません。", "steps": ["`var h2 = h1` … Holder の全プロパティがコピーされる。", "count（Int）は値そのものがコピーされ、以降は独立。", "box（Box への参照）は参照がコピーされ、指す先は同一。", "`h2.box.n = 9` は共有されたインスタンスを書き換えるため、h1 からも 9 に見える。"], "whyCorrect": "コピーの深さがプロパティの種類で変わるためです。値型のプロパティは独立し、参照型のプロパティは共有される、という規則だけで結果が決まります。", "commonMistakes": ["struct にしておけば値の独立が保証されると考える間違いです。参照型のプロパティを持つ時点で保証は崩れます。", "独立させたい場合は、コピー時に新しいインスタンスを作る仕組み（明示的なコピーや、参照型を使わない設計）が必要です。"], "takeaway": "値型のコピーは浅い。参照型のプロパティは共有されたまま。", "example": {"code": "final class Box { var n = 0 }\nstruct Holder { var box = Box() }\nvar a = Holder()\nvar b = a\nb.box = Box()\nb.box.n = 9\nprint(a.box.n, b.box.n)", "output": "0 9", "explanation": "box に新しいインスタンスを代入し直せば共有は切れます。書き換える前に差し替えるかどうかが分かれ目です。"}}, "seriesId": "foundation-value-copy", "seriesStep": 1}, {"id": "practice-foundation-042", "track": "foundation", "lessonId": "foundation-copy-value", "type": "reorder", "difficulty": 3, "title": "共有を避ける初期化の順に並べる", "prompt": "2つの Holder がそれぞれ別の Box を持つようにして、片方だけを書き換えます。ブロックを正しい順に並べ替えてください。", "skills": ["types", "memory"], "content": {"blocks": [{"id": "b1", "code": "print(h1.box.n, h2.box.n)"}, {"id": "b2", "code": "final class Box { var n = 0 }"}, {"id": "b3", "code": "struct Holder { var box: Box }"}, {"id": "b4", "code": "var h1 = Holder(box: Box())"}, {"id": "b5", "code": "var h2 = Holder(box: Box())"}, {"id": "b6", "code": "h2.box.n = 9"}]}, "solution": {"order": ["b2", "b3", "b4", "b5", "b6", "b1"]}, "hints": ["型の定義がなければインスタンスは作れません。Box が先です。", "それぞれが別のインスタンスを持つには、Box() を2回呼ぶ必要があります。", "Box → Holder → h1 → h2 → 書き換え → 表示、の順です。"], "explanation": "Box() を2回呼ぶことで、h1 と h2 はそれぞれ別のインスタンスを持ちます。そのため h2.box.n の書き換えは h1 に影響せず、出力は「0 9」になります。`var h2 = h1` のようにコピーで作ると参照が共有され、両方とも9になってしまいます。プロパティに既定値を持たせて `Holder()` を2回呼んでも、初期化のたびに Box() が評価されるため同じく独立します。", "detail": {"concept": "参照型のプロパティを独立させたいなら、インスタンスを別々に生成するしかありません。値型のコピーでは参照が複製されるだけです。", "steps": ["`final class Box` と `struct Holder` を定義する。", "`Holder(box: Box())` を2回呼ぶと、Box のインスタンスが2つ作られる。", "h1.box と h2.box は別の実体を指す。", "`h2.box.n = 9` は h2 側だけを書き換え、出力は「0 9」。"], "whyCorrect": "Box() の呼び出しが2回あるため実体が2つ存在し、参照の共有が起きません。書き換えの影響範囲が片方に限定されます。", "commonMistakes": ["`var h2 = h1` で作ってしまう間違いです。box の参照が共有され、両方が9になります。", "Box のインスタンスを定数にまとめて両方に渡す間違いも同じ結果になります。共有したいのか独立させたいのかを設計時に決めます。"], "takeaway": "参照型を独立させたいなら、インスタンスを別々に作る。コピーでは足りない。", "example": {"code": "final class Box { var n = 0 }\nstruct Holder { var box: Box }\nvar h1 = Holder(box: Box())\nvar h2 = Holder(box: Box())\nh2.box.n = 9\nprint(h1.box.n, h2.box.n)\nvar h3 = h1\nh3.box.n = 7\nprint(h1.box.n, h3.box.n)", "output": "0 9\n7 7", "explanation": "別々に作った場合は独立し、コピーで作った場合は共有されることが同時に確認できます。"}}, "seriesId": "foundation-value-copy", "seriesStep": 2}, {"id": "practice-concurrency-001", "track": "concurrency", "lessonId": "concurrency-errors", "type": "matching", "difficulty": 1, "title": "エラー処理の記法を対応づける", "prompt": "エラー処理に使う記法と、その意味を対応させてください。", "skills": ["errors"], "content": {"left": [{"id": "l1", "label": "throws"}, {"id": "l2", "label": "try"}, {"id": "l3", "label": "do-catch"}, {"id": "l4", "label": "Result"}], "right": [{"id": "r1", "label": "その関数がエラーを投げる可能性があることを宣言する"}, {"id": "r2", "label": "エラーを投げうる呼び出しであることを示す印"}, {"id": "r3", "label": "投げられたエラーを捕まえて処理する構文"}, {"id": "r4", "label": "成功と失敗のどちらかを1つの値として表す型"}, {"id": "r5", "label": "失敗したら実行を止めることを明示する指定"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["宣言側に書くものと、呼び出し側に書くものを分けて考えてください。", "Result は構文ではなく型です。値として持ち回れます。", "r5 は try! の説明なので、この4つとは対応しません。"], "explanation": "throws は関数の宣言に書き、エラーを投げうることを型の一部として表明します。try は呼び出し側に書く印で、「この行でエラーが発生しうる」ことを読み手に示します。do-catch は投げられたエラーを受け止める構文です。Result は成功値と失敗を1つの値として扱う型で、非同期のコールバックなど throws が使えない場面で活躍します。r5 は try! の説明です。", "detail": {"concept": "Swift のエラー処理は「宣言（throws）」「呼び出しの印（try）」「捕捉（do-catch）」の3点で構成されます。どこでエラーが起きうるかがコードを読むだけで分かるのが特徴です。", "steps": ["throws … 関数の型の一部。呼び出し側に対処を強制する。", "try … 呼び出し行に付ける。付け忘れるとコンパイルエラーになる。", "do-catch … エラーを捕まえる。catch は網羅的でなければならない。", "Result … エラーを値として持ち回りたいときに使う。"], "whyCorrect": "4つは宣言・印・構文・型という別のカテゴリに属し、役割が重なりません。try! だけは「対処しない」という別の選択肢です。", "commonMistakes": ["try を「試す」という意味だと解釈する間違いです。実際には「ここでエラーが出るかもしれない」という目印にすぎず、実行を保護する働きはありません。", "throws を付けたのに呼び出し側で try を書き忘れる間違いです。コンパイルエラーになるので気づけます。"], "takeaway": "throws は宣言、try は目印、do-catch は捕捉、Result は値。", "example": {"code": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) throws -> String {\n    guard id >= 0 else { throw LoadError.notFound }\n    return \"item\\(id)\"\n}\ndo { print(try load(1)); print(try load(-1)) } catch { print(\"失敗: \\(error)\") }", "output": "item1\n失敗: notFound", "explanation": "成功する呼び出しと失敗する呼び出しを並べると、3つの記法の役割が一度に確認できます。"}}, "seriesId": "concurrency-error-basics", "seriesStep": 1}, {"id": "practice-concurrency-002", "track": "concurrency", "lessonId": "concurrency-errors", "type": "fillBlank", "difficulty": 2, "title": "エラーを投げる関数を宣言する", "prompt": "独自のエラー型を定義し、投げる関数を作ります。空欄を埋めてください。", "skills": ["errors", "types"], "content": {"template": "enum LoadError: {{1}} {\n    case notFound\n}\nfunc load(_ id: Int) {{2}} -> String {\n    if id < 0 { throw LoadError.notFound }\n    return \"item\\(id)\"\n}\ndo {\n    print(try load(1))\n    print(try load(-1))\n} catch {\n    print(\"失敗: \\(error)\")\n}", "blanks": [{"id": "1", "options": ["Error", "Exception", "Failure", "Throwable"]}, {"id": "2", "options": ["throws", "throw", "rethrows", "async"]}]}, "solution": {"answers": {"1": "Error", "2": "throws"}}, "hints": ["投げられる型は、あるプロトコルに準拠している必要があります。Swiftでの名前は1語です。", "宣言に書くキーワードと、実際に投げるときのキーワードは形が違います。", "1つめはプロトコル名、2つめは戻り値の矢印の前に置く宣言用のキーワードです（複数形の形をしています）。"], "explanation": "Swift で投げられるのは `Error` プロトコルに準拠した型だけです。enum は関連値を持てるため、エラーの種類と付随情報を表現するのに適しています。関数の宣言には `throws` を書き、実際に投げるときは `throw` を使います（宣言は複数形、実行は単数形）。load(-1) が投げたエラーは catch で受け止められ、「失敗: notFound」と表示されます。", "detail": {"concept": "エラーを型として定義すると、呼び出し側が switch で網羅的に扱えます。文字列やコード番号で表すより、追加や変更に強くなります。", "steps": ["`enum LoadError: Error` … 投げられる型として宣言する。", "`func load(_ id: Int) throws -> String` … エラーを投げうることを型に含める。", "`throw LoadError.notFound` … 実際に投げる。以降の行は実行されない。", "呼び出し側は try を付け、do-catch で受け止める。"], "whyCorrect": "Error 準拠によって throw の対象になり、throws 宣言によって呼び出し側に対処が強制されます。この2つがそろって初めてコンパイルが通ります。", "commonMistakes": ["`throws` と `throw` を取り違える間違いです。宣言に throw を書くと構文エラーになります。", "Error に準拠していない型を投げようとすると 'Thrown expression type does not conform to Error' になります。", "rethrows は「引数のクロージャが投げたときだけ投げる」宣言で、自分でエラーを投げる関数には使えません。"], "takeaway": "投げられるのは Error 準拠の型だけ。宣言は throws、実行は throw。", "example": {"code": "enum LoadError: Error { case notFound(id: Int) }\nfunc load(_ id: Int) throws -> String {\n    guard id >= 0 else { throw LoadError.notFound(id: id) }\n    return \"item\\(id)\"\n}\ndo { _ = try load(-5) } catch LoadError.notFound(let id) { print(\"見つかりません id=\\(id)\") } catch { print(\"その他\") }", "output": "見つかりません id=-5", "explanation": "enum に関連値を持たせると、catch でパターンマッチして詳細を取り出せます。"}}, "seriesId": "concurrency-error-basics", "seriesStep": 2}, {"id": "practice-concurrency-003", "track": "concurrency", "lessonId": "concurrency-errors", "type": "bugHunt", "difficulty": 2, "title": "throws宣言が抜けている行を見つける", "prompt": "このコードはビルドできません。原因になっている行を選んでください。", "skills": ["errors", "debugging"], "content": {"lines": [{"id": "l1", "code": "enum LoadError: Error { case notFound }"}, {"id": "l2", "code": "func load(_ id: Int) -> String {"}, {"id": "l3", "code": "    if id < 0 { throw LoadError.notFound }"}, {"id": "l4", "code": "    return \"item\""}, {"id": "l5", "code": "}"}]}, "solution": {"optionId": "l2", "fixedCode": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) throws -> String {\n    if id < 0 { throw LoadError.notFound }\n    return \"item\"\n}\ndo { print(try load(1)) } catch { print(\"失敗\") }"}, "hints": ["エラーを投げている関数の宣言を確認してください。", "Swift ではエラーを投げうることを、関数の型として宣言する必要があります。", "投げる行そのものは正しく書かれています。それを許可する宣言が欠けています。"], "explanation": "バグは2行目の関数宣言です。関数の中で throw を使うには、宣言に `throws` を含めて「この関数はエラーを投げうる」ことを型として表明しなければなりません。宣言がないため、コンパイラは 'Error is not handled because the enclosing function is not declared throws' と指摘してビルドを止めます。実行時ではなくコンパイル時のエラーです。修正は `func load(_ id: Int) throws -> String` とすることで、呼び出し側にも try と do-catch が必要になります。この連鎖こそが、エラーの扱い忘れを防ぐ仕組みです。", "detail": {"concept": "throws は関数の型の一部です。宣言に含まれることで、呼び出し側に対処が強制され、エラーが黙って握りつぶされる経路がなくなります。", "steps": ["3行目の throw は、エラーを投げる正しい構文。", "しかし2行目の宣言に throws がないため、投げる先がない。", "コンパイラは関数宣言と本体の矛盾として報告する。", "throws を足すと、呼び出し側にも try が必要になる。"], "whyCorrect": "エラーは「投げる場所」と「投げうると宣言する場所」の両方が必要です。宣言だけが欠けているため、原因は2行目にあります。", "commonMistakes": ["try! や try? を呼び出し側に足して回避しようとする間違いです。宣言がない以上、そもそもコンパイルできません。", "throws を足したあと呼び出し側の修正を忘れ、別のエラーが出て混乱する例です。エラーの伝播は連鎖するのが正常な動作です。"], "takeaway": "throw する関数には throws。宣言と本体は型として一致していなければならない。", "example": {"code": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) throws -> String {\n    if id < 0 { throw LoadError.notFound }\n    return \"item\"\n}\nprint((try? load(-1)) ?? \"エラーだった\")", "output": "エラーだった", "explanation": "throws を宣言すると、呼び出し側で try? や do-catch を選べるようになります。"}}, "seriesId": "concurrency-error-basics", "seriesStep": 3}, {"id": "practice-concurrency-004", "track": "concurrency", "lessonId": "concurrency-errors", "type": "repair", "difficulty": 3, "title": "どのエラーか分かるcatchに直す", "prompt": "どんな失敗でも「エラー」としか出ません。catch 節を書き換えて、失敗の種類が分かるようにします。適切なものを選んでください。", "skills": ["errors", "debugging"], "content": {"code": "enum LoadError: Error { case notFound, network }\nfunc load() throws -> String { throw LoadError.network }\ndo {\n    print(try load())\n} catch {\n    print(\"エラー\")\n}", "options": [{"id": "o1", "code": "} catch let error as LoadError {\n    print(\"読み込み失敗: \\(error)\")\n} catch {\n    print(\"その他: \\(error)\")\n}"}, {"id": "o2", "code": "} catch {\n    print(\"エラー: \\(type(of: error))\")\n}"}, {"id": "o3", "code": "} catch LoadError.notFound {\n    print(\"見つかりません\")\n}"}, {"id": "o4", "code": "} catch {\n    print(\"エラー\")\n    throw error\n}"}]}, "solution": {"optionId": "o1", "fixedCode": "enum LoadError: Error { case notFound, network }\nfunc load() throws -> String { throw LoadError.network }\ndo {\n    print(try load())\n} catch let error as LoadError {\n    print(\"読み込み失敗: \\(error)\")\n} catch {\n    print(\"その他: \\(error)\")\n}"}, "hints": ["catch は型やパターンで絞り込めます。絞り込んだうえで、値そのものを表示する必要があります。", "型の名前だけを出しても、notFound と network の区別はつきません。", "特定のケースだけを catch すると、それ以外のエラーが捕まえられず網羅性を満たせません。"], "explanation": "問題は catch 節が固定文字列しか出力していないことです。`catch let error as LoadError` とすると、エラーを LoadError として受け取れ、`\\(error)` で network や notFound といったケース名まで表示できます。最後に型を限定しない catch を置くことで、想定外のエラーも取りこぼしません。`type(of: error)` は型名（LoadError）しか分からずケースを区別できず、`catch LoadError.notFound` だけでは network が捕まえられないため 'Errors thrown from here are not handled' になります。o4 は再送出するだけで情報が増えません。", "detail": {"concept": "catch はパターンマッチができます。型で絞る、ケースで絞る、条件を付ける、といった段階を組み合わせて、必要な粒度で処理を分けられます。", "steps": ["`catch let error as LoadError` … LoadError に該当する場合だけこの節に入る。", "`\\(error)` は enum のケース名を含む文字列を返す。", "最後の `catch` は型を限定しないため、それ以外のすべてを受け止める。", "結果として network が投げられた場合「読み込み失敗: network」と表示される。"], "whyCorrect": "型で絞ったうえで値を表示しているため、同じ型の中のどのケースかまで分かります。網羅性も最後の catch で担保されています。", "commonMistakes": ["catch 節でエラーを表示せずに固定文字列を出す実装は、調査に必要な情報を捨てています。ログには必ず error を含めます。", "特定のケースだけを catch して他を書き忘れると、do-catch が網羅的でないためコンパイルエラーになります（トップレベルや非throws関数の場合）。"], "takeaway": "catch は型やケースで絞れる。表示には必ず error 自体を含める。", "example": {"code": "enum LoadError: Error { case notFound, network }\nfunc load(_ fail: LoadError) throws -> String { throw fail }\nfor e in [LoadError.notFound, .network] {\n    do { _ = try load(e) }\n    catch LoadError.notFound { print(\"見つかりません\") }\n    catch { print(\"その他: \\(error)\") }\n}", "output": "見つかりません\nその他: network", "explanation": "ケースごとに catch を分けると、種類に応じた処理を書き分けられます。"}}, "seriesId": "concurrency-error-basics", "seriesStep": 4}, {"id": "practice-concurrency-005", "track": "concurrency", "lessonId": "concurrency-errors", "type": "reorder", "difficulty": 3, "title": "エラーを投げて捕まえる流れを並べる", "prompt": "エラーを投げる関数を定義し、失敗する呼び出しを捕まえて表示します。ブロックを正しい順に並べ替えてください。", "skills": ["errors", "controlFlow"], "content": {"blocks": [{"id": "b1", "code": "do {"}, {"id": "b2", "code": "enum LoadError: Error { case notFound }"}, {"id": "b3", "code": "func load(_ id: Int) throws -> String {"}, {"id": "b4", "code": "    guard id >= 0 else { throw LoadError.notFound }"}, {"id": "b5", "code": "    return \"item\\(id)\""}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    print(try load(-1))"}, {"id": "b8", "code": "} catch {"}, {"id": "b9", "code": "    print(\"失敗: \\(error)\")"}, {"id": "b10", "code": "}"}]}, "solution": {"order": ["b2", "b3", "b4", "b5", "b6", "b1", "b7", "b8", "b9", "b10"]}, "hints": ["エラー型の定義が最初です。関数の中で使われています。", "関数を定義してから、それを呼ぶ do ブロックを書きます。", "エラー型 → 関数（guard・return・閉じかっこ）→ do → 呼び出し → catch → 表示 → 閉じかっこ、の順です。"], "explanation": "定義（エラー型・関数）を先に置き、そのあとで do-catch による呼び出しを書きます。guard で早期に throw することで、以降の行は正常系だけを扱えます。load(-1) は必ず throw するため、print には到達せず catch 節が実行されて「失敗: notFound」が表示されます。throw が実行された時点で、その関数の残りの処理も do ブロックの残りの行も飛ばされる点が重要です。", "detail": {"concept": "エラーは戻り値とは別の経路で呼び出し元へ伝わります。throw された瞬間に通常の実行フローは中断し、最も近い catch まで一気に巻き戻ります。", "steps": ["`enum LoadError: Error` … 投げる型を定義する。", "`func load(_:) throws` … guard で不正な入力を弾き、throw する。", "`do { print(try load(-1)) }` … throw されるので print は実行されない。", "`catch` … エラーを受け取り、内容を表示する。"], "whyCorrect": "定義が使用より前にあり、do-catch が構文として正しく閉じているためです。throw による中断で print が飛ばされることも、この並びから読み取れます。", "commonMistakes": ["do ブロックの中に関数定義を入れてしまう並びです。動作はしますが、スコープが do の中に閉じて再利用できません。", "throw のあとに書いた処理が実行されると考える間違いです。throw は return と同じく、その場で関数を抜けます。"], "takeaway": "throw は実行を中断して最も近い catch へ飛ぶ。以降の行は実行されない。", "example": {"code": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) throws -> String {\n    guard id >= 0 else { throw LoadError.notFound }\n    return \"item\\(id)\"\n}\ndo {\n    print(try load(-1))\n    print(\"ここは実行されない\")\n} catch {\n    print(\"失敗: \\(error)\")\n}", "output": "失敗: notFound", "explanation": "throw によって do ブロックの残りが飛ばされ、2つ目の print が実行されていないことが分かります。"}}, "seriesId": "concurrency-error-basics", "seriesStep": 5}, {"id": "practice-concurrency-006", "track": "concurrency", "lessonId": "concurrency-result", "type": "fillBlank", "difficulty": 3, "title": "成功と失敗を1つの値で表す", "prompt": "エラーを投げる代わりに、成功か失敗かを値として返します。空欄を埋めてください。", "skills": ["errors", "types"], "content": {"template": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) -> {{1}}<String, LoadError> {\n    id >= 0 ? .success(\"item\\(id)\") : .{{2}}(.notFound)\n}\nswitch load(-1) {\ncase .success(let v): print(v)\ncase .failure(let e): print(\"失敗: \\(e)\")\n}", "blanks": [{"id": "1", "options": ["Result", "Optional", "Either", "Outcome"]}, {"id": "2", "options": ["failure", "error", "fail", "throw"]}]}, "solution": {"answers": {"1": "Result", "2": "failure"}}, "hints": ["成功値の型とエラーの型の2つを型引数に取る標準の型があります。", "switch の case を見ると、2つのケース名が分かります。", "1つめは標準ライブラリの列挙型、2つめは switch の2つめの case と同じ名前です。"], "explanation": "`Result<Success, Failure>` は成功値と失敗を1つの値として表す標準の列挙型で、ケースは `.success` と `.failure` です。throws と違って値なので、配列に入れたり、あとから処理したり、コールバックで渡したりできます。switch のケース名と一致させる必要があるため、`.failure(.notFound)` と書きます。実行すると「失敗: notFound」が表示されます。", "detail": {"concept": "throws は「その場で対処させる」仕組み、Result は「結果を値として持ち回る」仕組みです。非同期のコールバックや、複数の結果をまとめて集計する場面では Result が適します。", "steps": ["`Result<String, LoadError>` … 成功なら String、失敗なら LoadError。", "`.success(\"item\\(id)\")` … 成功のケースに値を包む。", "`.failure(.notFound)` … 失敗のケースにエラーを包む。", "switch で両方のケースを網羅して処理する。"], "whyCorrect": "Result のケース名は success と failure に決まっており、switch 側の記述と一致します。型引数の順序（成功、失敗）も宣言と一致しています。", "commonMistakes": ["`.error(...)` と書く間違いです。ケース名は failure です。", "Result を返す関数の中でさらに throws を使うと、2つのエラー経路が混在して呼び出し側が混乱します。どちらかに統一します。", "Result から値を取り出すには switch か `get()` が必要です。`get()` は throws なので try が要ります。"], "takeaway": "Result は成功と失敗を値にする。ケース名は success / failure。", "example": {"code": "enum LoadError: Error { case notFound }\nfunc load(_ id: Int) -> Result<String, LoadError> {\n    id >= 0 ? .success(\"item\\(id)\") : .failure(.notFound)\n}\nlet results = [load(1), load(-1)]\nprint(results.compactMap { try? $0.get() })", "output": "[\"item1\"]", "explanation": "Result は値なので配列に入れられ、成功したものだけを取り出すといった後処理ができます。"}}, "seriesId": "concurrency-result", "seriesStep": 1}, {"id": "practice-concurrency-007", "track": "concurrency", "lessonId": "concurrency-result", "type": "buildFunction", "difficulty": 3, "title": "Resultを返す関数を組み立てる", "prompt": "エラーを投げずに、成功か失敗かを Result で返す関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["errors", "functions"], "content": {"blocks": [{"id": "b1", "code": "enum LoadError: Error { case notFound }"}, {"id": "b2", "code": "func loadResult(_ id: Int) -> Result<String, LoadError> {"}, {"id": "b3", "code": "    guard id >= 0 else { return .failure(.notFound) }"}, {"id": "b4", "code": "    return .success(\"item\\(id)\")"}, {"id": "b5", "code": "}"}, {"id": "b6", "code": "    guard id >= 0 else { throw LoadError.notFound }"}, {"id": "b7", "code": "    return \"item\\(id)\""}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5"]}, "hints": ["戻り値は Result なので、失敗のときも throw ではなく return です。", "成功値も .success で包んでから返す必要があります。", "エラー型 → 関数宣言 → 失敗時の early return → 成功時の return → 関数を閉じる、の5行です。"], "explanation": "Result を返す関数では、失敗も return で返します。`throw` を使うと Result という戻り値の設計と矛盾し、そもそも throws 宣言がないためコンパイルできません。成功値も `.success(...)` で包む必要があり、素の String をそのまま返すことはできません。この形にすると、呼び出し側は必ず成功と失敗の両方を意識することになります。", "detail": {"concept": "エラーの伝え方を throws にするか Result にするかは設計判断です。Result を選んだなら、その関数の中では throw を混ぜず、すべて return で表現します。", "steps": ["`-> Result<String, LoadError>` … 戻り値の型で成功・失敗の両方を表す。", "`guard ... else { return .failure(.notFound) }` … 失敗も return。", "`return .success(\"item\\(id)\")` … 成功値を包んで返す。", "呼び出し側は switch か get() で中身を取り出す。"], "whyCorrect": "戻り値の型と、すべての return 文の型が一致しているためコンパイルが通ります。失敗の経路も戻り値として表現されるので、呼び出し側が見落とせません。", "commonMistakes": ["`throw` と `return .failure` を混在させる間違いです。呼び出し側が2種類の失敗経路を扱わされます。", "成功値を包み忘れて `return \"item\"` と書く間違いです。型が Result ではないためコンパイルエラーになります。"], "takeaway": "Result を返すなら失敗も return。throw と混ぜない。", "example": {"code": "enum LoadError: Error { case notFound }\nfunc loadResult(_ id: Int) -> Result<String, LoadError> {\n    guard id >= 0 else { return .failure(.notFound) }\n    return .success(\"item\\(id)\")\n}\nswitch loadResult(-1) {\ncase .success(let v): print(v)\ncase .failure(let e): print(\"失敗: \\(e)\")\n}", "output": "失敗: notFound", "explanation": "呼び出し側は switch で両方のケースを扱うことになり、失敗の見落としが起きません。"}}, "seriesId": "concurrency-result", "seriesStep": 2}, {"id": "practice-concurrency-008", "track": "concurrency", "lessonId": "concurrency-arc", "type": "trace", "difficulty": 3, "title": "参照カウントと解放のタイミングを追う", "prompt": "次のコードを実行したとき、出力される順番を選んでください。", "skills": ["memory", "debugging"], "content": {"code": "final class Node {\n    let name: String\n    init(_ name: String) { self.name = name; print(\"init \\(name)\") }\n    deinit { print(\"deinit \\(name)\") }\n}\nvar a: Node? = Node(\"A\")\nvar b = a\na = nil\nprint(\"after a = nil\")\nb = nil\nprint(\"end\")", "options": [{"id": "o1", "label": "init A → after a = nil → deinit A → end"}, {"id": "o2", "label": "init A → deinit A → after a = nil → end"}, {"id": "o3", "label": "init A → after a = nil → end → deinit A"}, {"id": "o4", "label": "init A → after a = nil → end（deinit は出ない）"}]}, "solution": {"optionId": "o1"}, "hints": ["`var b = a` のあと、そのインスタンスを指している名前はいくつあるでしょうか。", "参照カウントが0になった瞬間に deinit が呼ばれます。", "a を nil にしても b がまだ指しているため、解放されるのは b を nil にしたときです。"], "explanation": "`Node(\"A\")` の生成で「init A」が出力され、a と b の2つが同じインスタンスを指すため参照カウントは2になります。`a = nil` では1に減るだけなので解放されず、「after a = nil」が先に表示されます。続く `b = nil` で0になり、その時点で deinit が呼ばれて「deinit A」が出力され、最後に「end」が表示されます。参照が1つでも残っていれば解放されない、というのが ARC の基本規則です。", "detail": {"concept": "ARC は参照の数を数え、0になった瞬間にインスタンスを解放します。解放のタイミングは「最後の参照が消えた行」であり、スコープの終わりとは限りません。", "steps": ["`Node(\"A\")` … 生成時に init が実行され、参照カウントは1。", "`var b = a` … 参照カウントが2になる。", "`a = nil` … 1に減るだけ。deinit は呼ばれない。", "`b = nil` … 0になり、その場で deinit が実行される。", "その後 `print(\"end\")` が実行される。"], "whyCorrect": "deinit の出力位置が「b = nil」と「end」の間にあることが、参照カウントが0になった瞬間に解放されたことを示しています。", "commonMistakes": ["変数に nil を入れたら必ず解放されると考える間違いです。他に参照が残っていれば解放されません。", "解放がプログラム終了時にまとめて行われると考える間違いです。ARC は決定的で、最後の参照が消えた時点で実行されます。"], "takeaway": "deinit は参照カウントが0になった瞬間に呼ばれる。1つでも残れば解放されない。", "example": {"code": "final class Node {\n    let name: String\n    init(_ name: String) { self.name = name }\n    deinit { print(\"deinit \\(name)\") }\n}\ndo {\n    let n = Node(\"A\")\n    print(\"スコープ内\", n.name)\n}\nprint(\"スコープ外\")", "output": "スコープ内 A\ndeinit A\nスコープ外", "explanation": "ローカル変数の場合、スコープを抜けた時点で参照が消え、その場で deinit が呼ばれます。"}}, "seriesId": "concurrency-arc", "seriesStep": 1}, {"id": "practice-concurrency-009", "track": "concurrency", "lessonId": "concurrency-arc", "type": "bugHunt", "difficulty": 3, "title": "参照の輪を切るべき宣言を見つける", "prompt": "親子で互いに参照し合っているため、どちらも解放されません。weak にすべき宣言を選んでください。", "skills": ["memory", "debugging"], "content": {"lines": [{"id": "l1", "code": "final class Parent { var child: Child? }"}, {"id": "l2", "code": "final class Child { var parent: Parent? }"}, {"id": "l3", "code": "let p = Parent()"}, {"id": "l4", "code": "let c = Child()"}, {"id": "l5", "code": "p.child = c"}, {"id": "l6", "code": "c.parent = p"}]}, "solution": {"optionId": "l2", "fixedCode": "final class Parent { var child: Child? }\nfinal class Child { weak var parent: Parent? }\nlet p = Parent()\nlet c = Child()\np.child = c\nc.parent = p\nprint(c.parent != nil)"}, "hints": ["親が子を持ち、子が親を持つと、参照が輪になります。", "輪を切るには、どちらか一方を弱い参照にします。どちらを弱くすべきかは所有関係で決めます。", "一般に、所有しているのは親のほうです。子から親への参照を弱くします。"], "explanation": "バグは2行目の `var parent: Parent?` が強参照であることです。親が子を、子が親を強参照すると参照カウントが互いに1以上のまま残り、外部からの参照が消えても両方とも解放されません（deinit が呼ばれず、メモリが増え続けます）。クラッシュしないため、Instruments などで測るまで気づけないのが特徴です。修正は所有関係の弱いほう、つまり子から親への参照を `weak var parent: Parent?` にすることです。親が解放されれば parent は自動的に nil になり、輪が切れます。", "detail": {"concept": "参照の強弱は所有関係の表現です。「どちらがどちらの寿命を支配するか」を決め、支配される側から支配する側への参照を弱くします。", "steps": ["Parent → Child は強参照（親が子を所有する）。", "Child → Parent も強参照だと、輪が閉じて双方が解放されない。", "Child → Parent を weak にすると、輪が切れる。", "weak は Optional でなければならず、親の解放時に自動で nil になる。"], "whyCorrect": "所有しているのは親なので、親から子への強参照は残す必要があります。弱くしてよいのは子から親への逆方向の参照だけです。", "commonMistakes": ["親から子への参照を weak にしてしまうと、親だけが生きている状態で子が解放され、意図せず nil になります。", "weak を非Optionalに付けようとするとコンパイルエラーです。解放時に nil になる必要があるためです。", "unowned を使うと Optional にせずに済みますが、親が先に解放された場合にアクセスするとクラッシュします。"], "takeaway": "輪を切るのは所有されている側から。子→親を weak にする。", "example": {"code": "final class Parent { var child: Child?\n    deinit { print(\"parent deinit\") } }\nfinal class Child { weak var parent: Parent?\n    deinit { print(\"child deinit\") } }\ndo {\n    let p = Parent(); let c = Child()\n    p.child = c; c.parent = p\n}\nprint(\"スコープ外\")", "output": "parent deinit\nchild deinit\nスコープ外", "explanation": "weak にしたことで両方が正しく解放されています。強参照のままだと deinit は一切出力されません。"}}, "seriesId": "concurrency-arc", "seriesStep": 2}, {"id": "practice-concurrency-010", "track": "concurrency", "lessonId": "concurrency-weak-unowned", "type": "matching", "difficulty": 1, "title": "参照の強さを対応づける", "prompt": "参照の種類と、その性質を対応させてください。", "skills": ["memory"], "content": {"left": [{"id": "l1", "label": "strong（既定）"}, {"id": "l2", "label": "weak"}, {"id": "l3", "label": "unowned"}, {"id": "l4", "label": "[weak self]"}], "right": [{"id": "r1", "label": "参照している間、対象は解放されない"}, {"id": "r2", "label": "対象が解放されると自動で nil になる。Optional でなければならない"}, {"id": "r3", "label": "対象のほうが長生きすると分かっている場合に使う。解放後に触るとクラッシュする"}, {"id": "r4", "label": "クロージャの捕捉リストで self を弱参照にする指定"}, {"id": "r5", "label": "対象の参照カウントを2倍にする指定"}]}, "solution": {"pairs": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, "hints": ["既定の参照は、対象の寿命を延ばします。", "自動で nil になるほうと、解放後に触るとクラッシュするほうを区別してください。", "r5 のような仕組みは存在しません。参照カウントは自動で管理されます。"], "explanation": "既定の strong 参照は対象の寿命を延ばします。weak は寿命を延ばさず、対象が解放されると自動的に nil になるため Optional でなければなりません。unowned も寿命を延ばしませんが nil にはならず、解放後にアクセスするとクラッシュします。`[weak self]` はクロージャの捕捉リストで self を弱参照にする書き方です。r5 のような仕組みは存在しません。", "detail": {"concept": "参照の種類は「寿命を延ばすか」「解放後どうなるか」の2軸で整理できます。weak は安全側、unowned は速度と簡潔さを取る代わりに前提が崩れると落ちます。", "steps": ["strong … 参照カウントを増やす。既定。", "weak … 増やさない。解放時に nil になるので Optional。", "unowned … 増やさない。nil にならないので、解放後のアクセスは未定義動作（実質クラッシュ）。", "[weak self] … クロージャ内での self の捕捉を弱くする指定。"], "whyCorrect": "4つはそれぞれ異なる寿命の扱いを表しており、説明と1対1で対応します。weak と unowned の差は「解放後に nil になるか、落ちるか」です。", "commonMistakes": ["unowned を「weak の短い書き方」と考える間違いです。前提が崩れたときの挙動がまったく違います。", "迷ったときに unowned を選ぶ間違いです。寿命の前提を証明できないなら weak が安全です。"], "takeaway": "迷ったら weak。unowned は寿命の前提を証明できるときだけ。", "example": {"code": "final class Owner { var name = \"O\"\n    deinit { print(\"owner deinit\") } }\nvar owner: Owner? = Owner()\nweak var weakRef = owner\nprint(weakRef?.name ?? \"nil\")\nowner = nil\nprint(weakRef?.name ?? \"nil\")", "output": "O\nowner deinit\nnil", "explanation": "対象が解放された瞬間に weak 参照が自動的に nil になっていることが確認できます。"}}, "seriesId": "concurrency-reference-strength", "seriesStep": 1}, {"id": "practice-concurrency-011", "track": "concurrency", "lessonId": "concurrency-weak-unowned", "type": "repair", "difficulty": 4, "title": "長生きするクロージャの捕捉を直す", "prompt": "Registry に登録したクロージャは Owner より長く残ります。Owner が解放されたあとに呼ばれても落ちないようにします。5行目の修正として正しいものを選んでください。", "skills": ["memory", "debugging", "functions"], "content": {"code": "final class Registry { static var handlers: [() -> Void] = [] }\nfinal class Owner {\n    func setup() {\n        Registry.handlers.append { self.finish() }\n    }\n    func finish() { print(\"done\") }\n}", "options": [{"id": "o1", "code": "Registry.handlers.append { [weak self] in self?.finish() }"}, {"id": "o2", "code": "Registry.handlers.append { [unowned self] in self.finish() }"}, {"id": "o3", "code": "Registry.handlers.append { [self] in self.finish() }"}, {"id": "o4", "code": "Registry.handlers.append { Registry.handlers.removeAll() }"}]}, "solution": {"optionId": "o1", "fixedCode": "final class Registry { static var handlers: [() -> Void] = [] }\nfinal class Owner {\n    func setup() {\n        Registry.handlers.append { [weak self] in self?.finish() }\n    }\n    func finish() { print(\"done\") }\n}"}, "hints": ["Registry は static なので、アプリが動いている間ずっとクロージャを保持し続けます。", "Owner が解放されたあとに呼ばれる可能性があるなら、解放後も安全な参照が必要です。", "解放後に nil になる参照を使い、nil のときは何もしない形にします。"], "explanation": "問題は、static な配列に保持されるクロージャが self を強参照していることです。この状態では Owner の参照カウントが0にならず、画面を閉じても解放されません（メモリリーク）。挙動としてはクラッシュせず、メモリ使用量が増え続けます。修正は `[weak self]` で弱参照にし、`self?.finish()` として Owner が既に解放されていれば何もしない形にすることです。`[unowned self]` は寿命を延ばさない点は同じですが、Owner が解放されたあとに呼ばれると 'Attempted to read an unowned reference but object was already deallocated' でクラッシュします。今回はクロージャのほうが長生きすると分かっているため使えません。`[self]` は明示的な強参照でリークが残り、o4 は要件と無関係です。", "detail": {"concept": "weak と unowned の選択は「どちらが先に解放されうるか」で決まります。クロージャの保持先が self より長生きするなら、unowned の前提は成立しません。", "steps": ["`Registry.handlers` は static なので、プロセスが終わるまで生き続ける。", "そこに追加されたクロージャも同じだけ生き続ける。", "クロージャが self を強参照すると、Owner も同じだけ生き続ける（リーク）。", "[weak self] にすると Owner は正しく解放され、その後の呼び出しは何もしない。"], "whyCorrect": "weak は解放後に nil になるため、クロージャがいつ呼ばれても安全です。Optional chaining により、解放後の呼び出しは静かに無視されます。", "commonMistakes": ["unowned のほうが速いという理由で選ぶ間違いです。差はごくわずかで、クラッシュのリスクに見合いません。", "weak にしたあと `self!.finish()` と書く間違いです。解放後にクラッシュし、weak にした意味がなくなります。", "解放後に処理を実行したい場合、weak では何も起きません。その場合は self に依存しない形に設計し直します。"], "takeaway": "クロージャの保持先が self より長生きするなら unowned は使えない。weak 一択。", "example": {"code": "final class Registry { static var handlers: [() -> Void] = [] }\nfinal class Owner {\n    func setup() { Registry.handlers.append { [weak self] in self?.finish() } }\n    func finish() { print(\"done\") }\n    deinit { print(\"owner deinit\") }\n}\nvar o: Owner? = Owner()\no?.setup()\nRegistry.handlers[0]()\no = nil\nRegistry.handlers[0]()\nprint(\"end\")", "output": "done\nowner deinit\nend", "explanation": "解放後の呼び出しでは self が nil のため何も起きず、クラッシュもしていません。"}}, "seriesId": "concurrency-reference-strength", "seriesStep": 2}, {"id": "practice-concurrency-012", "track": "concurrency", "lessonId": "concurrency-weak-unowned", "type": "chooseBlocks", "difficulty": 3, "title": "解放されるクラスに必要な行だけ選ぶ", "prompt": "クロージャをプロパティに保持しても、正しく解放される（deinit が呼ばれる）クラスを作ります。必要な行だけを選び、正しい順に並べてください。", "skills": ["memory", "functions"], "content": {"blocks": [{"id": "b1", "code": "final class Owner {"}, {"id": "b2", "code": "    var onDone: (() -> Void)?"}, {"id": "b3", "code": "    func setup() { onDone = { [weak self] in self?.finish() } }"}, {"id": "b4", "code": "    func finish() { print(\"done\") }"}, {"id": "b5", "code": "    deinit { print(\"deinit\") }"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    func setup() { onDone = { self.finish() } }"}], "requireOrder": true}, "solution": {"selected": ["b1", "b2", "b3", "b4", "b5", "b6"], "order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["プロパティに保持したクロージャは、self が保持しています。", "そのクロージャが self を強参照すると、輪ができて解放されません。", "捕捉リストで self を弱参照にした setup を選びます。"], "explanation": "self が onDone を保持し、onDone が self を強参照すると輪が閉じて deinit が呼ばれなくなります。`[weak self]` を付けた setup を使うことで輪が切れ、参照がなくなった時点で deinit が実行されます。b7 の強参照版はビルドは通りますが、Owner が永久に解放されなくなるため要件を満たしません。deinit を書いておくと、解放されているかどうかを出力で確認できます。", "detail": {"concept": "「プロパティに保持したクロージャが self を捕捉する」形は、循環参照の最も一般的なパターンです。この形を見たら反射的に捕捉リストを確認します。", "steps": ["`var onDone: (() -> Void)?` … self → クロージャ の強参照。", "クロージャが self を強参照すると、クロージャ → self の強参照ができる。", "この2本で輪が閉じ、参照カウントが0にならない。", "`[weak self]` により後者が弱参照になり、輪が切れる。"], "whyCorrect": "循環の片側を弱くすれば輪は成立しません。onDone の保持自体は必要なので、切るのはクロージャ側の捕捉です。", "commonMistakes": ["map や forEach に渡すだけのクロージャにまで [weak self] を付ける間違いです。保持されないクロージャでは輪ができません。", "deinit が呼ばれているかを確認せずに「たぶん大丈夫」と判断する間違いです。print を1行入れれば確実に検証できます。"], "takeaway": "プロパティに保持するクロージャで self を使うなら [weak self]。deinit で検証する。", "example": {"code": "final class Owner {\n    var onDone: (() -> Void)?\n    func setup() { onDone = { [weak self] in self?.finish() } }\n    func finish() { print(\"done\") }\n    deinit { print(\"deinit\") }\n}\nvar o: Owner? = Owner()\no?.setup()\no?.onDone?()\no = nil\nprint(\"end\")", "output": "done\ndeinit\nend", "explanation": "deinit が出力されているため、循環参照が起きていないことを実際に確認できます。"}}, "seriesId": "concurrency-reference-strength", "seriesStep": 3}, {"id": "practice-concurrency-013", "track": "concurrency", "lessonId": "concurrency-async-await", "type": "fillBlank", "difficulty": 2, "title": "非同期関数を宣言して呼び出す", "prompt": "非同期関数を定義し、結果を受け取って表示します。空欄を埋めてください。", "skills": ["concurrency", "syntax"], "content": {"template": "func fetch(_ id: Int) {{1}} -> String {\n    \"item\\(id)\"\n}\nlet a = {{2}} fetch(1)\nprint(a)", "blanks": [{"id": "1", "options": ["async", "await", "throws", "actor"]}, {"id": "2", "options": ["await", "async", "try", "yield"]}]}, "solution": {"answers": {"1": "async", "2": "await"}}, "hints": ["宣言側に書くキーワードと、呼び出し側に書くキーワードは別々です。", "throws / try の関係と同じ構造になっています。", "1つめは「この関数は途中で中断しうる」という宣言、2つめは「ここで中断しうる」という呼び出し側の印です。"], "explanation": "`async` は関数の宣言に書き、「この関数は実行の途中で中断（suspend）しうる」ことを型として表明します。呼び出し側では `await` を書き、その行で中断が起こりうることを示します。throws と try がペアであるのとまったく同じ構造で、宣言と呼び出しの両方に印が必要です。この例では中断が実際には起きませんが、宣言が async である以上 await は必須です。", "detail": {"concept": "async/await は「中断しうる場所」をコード上で見えるようにする仕組みです。await の付いた行では他の処理に実行が移りうるため、その前後で状態が変わっている可能性を意識できます。", "steps": ["`func fetch(_ id: Int) async -> String` … 中断しうる関数として宣言する。", "呼び出しは `await fetch(1)` と書く。await がないとコンパイルエラー。", "await の時点でスレッドは解放され、結果が用意できたら続きが再開される。", "結果の String が a に入り、print される。"], "whyCorrect": "async が宣言、await が呼び出しの印という役割分担があり、両方そろって初めてコンパイルが通ります。片方だけでは 'Expression is async but is not marked with await' などになります。", "commonMistakes": ["await を「待つ」だけの意味と捉える間違いです。実際にはスレッドをブロックせず解放するため、その間に他の処理が進みます。", "async 関数を同期関数から呼ぼうとする間違いです。Task で包むか、呼び出し側も async にする必要があります。"], "takeaway": "async は宣言、await は呼び出しの印。throws / try と同じ構造。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nlet a = await fetch(1)\nlet b = await fetch(2)\nprint(a, b)", "output": "item1 item2", "explanation": "await を並べると、上から順に1つずつ実行されます（直列）。"}}, "seriesId": "concurrency-async-basics", "seriesStep": 1}, {"id": "practice-concurrency-014", "track": "concurrency", "lessonId": "concurrency-async-await", "type": "reorder", "difficulty": 3, "title": "非同期処理を順に呼び出す", "prompt": "2件を順番に取得して表示します。ブロックを正しい順に並べ替えてください。", "skills": ["concurrency"], "content": {"blocks": [{"id": "b1", "code": "let first = await fetch(1)"}, {"id": "b2", "code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }"}, {"id": "b3", "code": "let second = await fetch(2)"}, {"id": "b4", "code": "print(first, second)"}]}, "solution": {"order": ["b2", "b1", "b3", "b4"]}, "hints": ["関数の定義は、呼び出しより前に必要です。", "await を並べると、上の行が終わってから次の行が始まります。", "定義 → 1件目 → 2件目 → 表示、の順です。"], "explanation": "await を続けて書くと処理は直列になります。1件目が完了してから2件目が始まるため、それぞれが1秒かかるなら合計2秒かかります。両方を同時に走らせたい場合は async let や TaskGroup を使います。ここでは順序どおりに first と second が得られ、「item1 item2」が表示されます。", "detail": {"concept": "await は中断点であって並行実行の指示ではありません。並行にしたいときは明示的に別の構文（async let、TaskGroup、Task）を使う必要があります。", "steps": ["`func fetch(_:) async` … 定義を先に置く。", "`await fetch(1)` … ここで中断し、結果が返ってから次へ進む。", "`await fetch(2)` … 1件目の完了後に開始される。", "両方そろってから print される。"], "whyCorrect": "各行が必要とする値が前の行で用意されており、await の直列性によって順序も保証されます。", "commonMistakes": ["await を書けば自動的に並行実行されると考える間違いです。直列のまま遅くなっているコードは非常によく見かけます。", "並行にすべきかどうかは依存関係で決まります。2件目が1件目の結果を使うなら、直列が正しい選択です。"], "takeaway": "await を並べると直列。並行にしたいなら async let か TaskGroup。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nlet first = await fetch(1)\nlet second = await fetch(2)\nprint(first, second)", "output": "item1 item2", "explanation": "結果は並行実行と同じですが、実行のされ方（直列）が異なります。"}}, "seriesId": "concurrency-async-basics", "seriesStep": 2}, {"id": "practice-concurrency-015", "track": "concurrency", "lessonId": "concurrency-async-await", "type": "bugHunt", "difficulty": 3, "title": "awaitが抜けている行を見つける", "prompt": "このコードはビルドできません。原因になっている行を選んでください。", "skills": ["concurrency", "debugging"], "content": {"lines": [{"id": "l1", "code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }"}, {"id": "l2", "code": "func show() async {"}, {"id": "l3", "code": "    let a = fetch(1)"}, {"id": "l4", "code": "    print(a)"}, {"id": "l5", "code": "}"}]}, "solution": {"optionId": "l3", "fixedCode": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc show() async {\n    let a = await fetch(1)\n    print(a)\n}\nawait show()"}, "hints": ["fetch は async 宣言された関数です。呼び出し側に必要な印は書かれているでしょうか。", "show 自体は async なので、await を書ける場所ではあります。", "非同期関数を呼んでいる行に、中断しうることを示す印がありません。"], "explanation": "バグは3行目です。fetch は async なので、呼び出しには await が必要ですが書かれていません。コンパイラは 'Expression is async but is not marked with await' と指摘してビルドを止めます。実行時ではなくコンパイル時のエラーです。囲んでいる show 自体は async 宣言されているため、await を書ける場所であり、修正は3行目に await を足すだけです。もし show が async でなければ、show の宣言も変えるか Task で包む必要が出てきます。", "detail": {"concept": "await は「ここで中断しうる」という印であり、書けるのは async な文脈の中だけです。コンパイラが強制するため、非同期処理を同期処理と誤読することがありません。", "steps": ["`fetch` の型は `(Int) async -> String`。", "非同期関数の呼び出しには await が必要。", "3行目には await がないためコンパイルエラー。", "`let a = await fetch(1)` に直すと通る。"], "whyCorrect": "エラーは呼び出し側の印の欠落なので、原因は呼び出しを書いている3行目です。宣言（1行目）も囲む関数（2行目）も正しく書かれています。", "commonMistakes": ["エラーを見て fetch の宣言から async を外そうとする間違いです。非同期であること自体は仕様なので、直すのは呼び出し側です。", "同期関数の中から呼びたい場合、await を足すだけでは解決しません。Task { } で包むか、呼び出し側も async にします。"], "takeaway": "async 関数の呼び出しには必ず await。書けるのは async な文脈の中だけ。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc show() async { print(await fetch(1)) }\nawait show()", "output": "item1", "explanation": "await を足すことで、非同期関数の結果を受け取って表示できます。"}}, "seriesId": "concurrency-async-basics", "seriesStep": 3}, {"id": "practice-concurrency-016", "track": "concurrency", "lessonId": "concurrency-async-let", "type": "trace", "difficulty": 3, "title": "async letで同時に走らせた結果を追う", "prompt": "処理時間の違う2つを async let で走らせます。出力される順番を選んでください。", "skills": ["concurrency", "debugging"], "content": {"code": "func fetch(_ id: Int) async -> Int {\n    try? await Task.sleep(nanoseconds: UInt64(id) * 30_000_000)\n    print(\"done \\(id)\")\n    return id\n}\nasync let a = fetch(2)\nasync let b = fetch(1)\nlet sum = await a + b\nprint(\"sum \\(sum)\")", "options": [{"id": "o1", "label": "done 1 → done 2 → sum 3"}, {"id": "o2", "label": "done 2 → done 1 → sum 3"}, {"id": "o3", "label": "done 2 → sum 3 → done 1"}, {"id": "o4", "label": "sum 3 → done 1 → done 2"}]}, "solution": {"optionId": "o1"}, "hints": ["async let は、その行に到達した時点で処理を開始します。await を待ちません。", "fetch(2) は約60ミリ秒、fetch(1) は約30ミリ秒かかります。", "2つは同時に走っているので、先に終わるのは待ち時間の短いほうです。"], "explanation": "`async let` は宣言した時点で子タスクを開始し、`await` で値を使うときに完了を待ちます。したがって fetch(2)（約60ms）と fetch(1)（約30ms）は同時に走り始め、先に終わるのは待ち時間の短い fetch(1) です。そのため「done 1」が先、「done 2」が後になります。両方の値がそろってから合計が計算され、最後に「sum 3」が表示されます。書いた順ではなく、完了した順に出力される点が直列実行との違いです。", "detail": {"concept": "async let は「先に走らせておいて、必要になったときに受け取る」構文です。開始は宣言時、待機は await 時と、2つのタイミングが分かれているのが特徴です。", "steps": ["`async let a = fetch(2)` … この行で fetch(2) が開始される。", "`async let b = fetch(1)` … 続けて fetch(1) も開始される。2つは同時に進む。", "約30ms後に fetch(1) が完了し「done 1」。", "約60ms後に fetch(2) が完了し「done 2」。", "`await a + b` で両方の値がそろい、「sum 3」が出力される。"], "whyCorrect": "同時に開始されている以上、完了順は処理時間の短い順になります。宣言の順序は開始の順序であって、完了の順序ではありません。", "commonMistakes": ["宣言した順に完了すると考えて「done 2 → done 1」を選ぶ間違いです。並行実行では完了順は所要時間で決まります。", "async let を宣言だけして await しないと、スコープを抜けるときに暗黙的にキャンセルされます。値を使わないなら宣言する意味がありません。"], "takeaway": "async let は宣言時に開始、await 時に待機。完了順は所要時間で決まる。", "example": {"code": "func fetch(_ id: Int) async -> Int {\n    try? await Task.sleep(nanoseconds: UInt64(id) * 30_000_000)\n    print(\"done \\(id)\")\n    return id\n}\nasync let a = fetch(2)\nasync let b = fetch(1)\nprint(\"sum \\(await a + b)\")", "output": "done 1\ndone 2\nsum 3", "explanation": "後から宣言した fetch(1) のほうが先に完了していることが、出力順から確認できます。"}}, "seriesId": "concurrency-parallel", "seriesStep": 1}, {"id": "practice-concurrency-017", "track": "concurrency", "lessonId": "concurrency-async-let", "type": "buildFunction", "difficulty": 3, "title": "2件を同時に取得する関数を組み立てる", "prompt": "2件の取得を同時に走らせて、両方そろってから配列で返す関数を作ります。必要なブロックだけを選んで正しい順に並べてください。", "skills": ["concurrency", "functions"], "content": {"blocks": [{"id": "b1", "code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }"}, {"id": "b2", "code": "func fetchAll() async -> [String] {"}, {"id": "b3", "code": "    async let a = fetch(1)"}, {"id": "b4", "code": "    async let b = fetch(2)"}, {"id": "b5", "code": "    return await [a, b]"}, {"id": "b6", "code": "}"}, {"id": "b7", "code": "    let a = await fetch(1)"}, {"id": "b8", "code": "    let b = await fetch(2)"}]}, "solution": {"order": ["b1", "b2", "b3", "b4", "b5", "b6"]}, "hints": ["await を並べると直列になります。同時に走らせる構文が必要です。", "async let は宣言した時点で開始され、値を使うときに待ちます。", "定義 → 関数宣言 → async let を2つ → まとめて await して返す → 関数を閉じる、の6行です。"], "explanation": "`async let` は宣言した時点で子タスクを開始するため、2つ並べると同時に走ります。値を使う `return await [a, b]` の時点で両方の完了を待つので、所要時間は「2件の合計」ではなく「遅いほう」になります。`let a = await fetch(1)` の形では1件目の完了を待ってから2件目が始まるため直列になり、要件を満たしません。await は配列リテラル全体の前に1つ書けば、両方の待機をまとめられます。", "detail": {"concept": "並行化の判断基準は依存関係です。2件が互いに独立しているなら同時に走らせられます。依存があるなら直列にせざるを得ません。", "steps": ["`async let a = fetch(1)` … この時点で1件目が開始。", "`async let b = fetch(2)` … 続けて2件目も開始。2つが同時に進む。", "`await [a, b]` … 両方の完了を待って配列にする。", "合計時間は2件の合計ではなく、遅いほうの時間になる。"], "whyCorrect": "async let によって開始と待機が分離され、待機が最後にまとめられているためです。この形が並行化の最小の書き方になります。", "commonMistakes": ["`async let` の値を1つずつ await すると、結果的に直列に近い待ち方になることがあります。まとめて待つほうが意図が明確です。", "件数が可変の場合、async let は使えません（変数の数を動的に決められないため）。その場合は TaskGroup を使います。"], "takeaway": "独立した2〜3件の並行化は async let。件数が可変なら TaskGroup。", "example": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc fetchAll() async -> [String] {\n    async let a = fetch(1)\n    async let b = fetch(2)\n    return await [a, b]\n}\nprint(await fetchAll())", "output": "[\"item1\", \"item2\"]", "explanation": "同時に走らせても、配列に入れる順序は書いた順のままです。"}}, "seriesId": "concurrency-parallel", "seriesStep": 2}, {"id": "practice-concurrency-018", "track": "concurrency", "lessonId": "concurrency-async-let", "type": "repair", "difficulty": 4, "title": "直列になっている取得を並行にする", "prompt": "2件の取得は互いに独立していますが、直列に実行されるため2倍の時間がかかります。関数の中身（3〜5行目）の修正として正しいものを選んでください。", "skills": ["concurrency", "debugging"], "content": {"code": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc loadBoth() async -> [String] {\n    let a = await fetch(1)\n    let b = await fetch(2)\n    return [a, b]\n}", "options": [{"id": "o1", "code": "    async let a = fetch(1)\n    async let b = fetch(2)\n    return await [a, b]"}, {"id": "o2", "code": "    let a = fetch(1)\n    let b = fetch(2)\n    return await [a, b]"}, {"id": "o3", "code": "    Task { _ = await fetch(1) }\n    Task { _ = await fetch(2) }\n    return []"}, {"id": "o4", "code": "    let a = await fetch(1)\n    let b = await fetch(2)\n    return await [a, b]"}]}, "solution": {"optionId": "o1", "fixedCode": "func fetch(_ id: Int) async -> String { \"item\\(id)\" }\nfunc loadBoth() async -> [String] {\n    async let a = fetch(1)\n    async let b = fetch(2)\n    return await [a, b]\n}"}, "hints": ["await を並べると、上の行が終わるまで下の行は始まりません。", "開始と待機を分ける構文を使うと、2つを同時に走らせられます。", "別タスクに投げっぱなしにすると結果を受け取れません。結果は必ず返す必要があります。"], "explanation": "問題は3〜4行目で、`await` を続けて書いているため1件目の完了を待ってから2件目が始まります（直列）。修正は `async let` に変えることで、宣言した時点で両方が走り始め、`return await [a, b]` でまとめて待てるようになります。所要時間は合計から「遅いほう」に短縮されます。o2 は async let なしで await を省いているためコンパイルできず、o3 は Task に投げて結果を捨てているので空配列しか返らず要件を満たしません。o4 は await の位置を変えただけで直列のままです。", "detail": {"concept": "パフォーマンスの問題は、正しさの問題と違ってテストでは見つかりません。「独立した処理を直列に待っていないか」は、コードの形から判断する必要があります。", "steps": ["`let a = await fetch(1)` … ここで完全に待つ。", "待ち終わってから `fetch(2)` が開始される。合計時間は2件分。", "`async let` に変えると、2行目に到達した時点で1件目はすでに走っている。", "`await [a, b]` で両方を待つ。合計時間は遅いほうの1件分。"], "whyCorrect": "async let は開始と待機を分離するため、独立した処理を重ねられます。結果は配列として正しく返るので、呼び出し側の変更も不要です。", "commonMistakes": ["Task { } で投げて結果を捨てる修正です。並行にはなりますが、結果を受け取れず、エラーも握りつぶされます。", "依存関係がある処理まで並行化しようとする間違いです。2件目が1件目の結果を使うなら、直列が正しい実装です。"], "takeaway": "独立した await が並んでいたら並行化の余地。async let で開始と待機を分ける。", "example": {"code": "func fetch(_ id: Int) async -> Int {\n    try? await Task.sleep(nanoseconds: 30_000_000)\n    return id\n}\nlet start = ContinuousClock().now\nasync let a = fetch(1)\nasync let b = fetch(2)\n_ = await [a, b]\nprint(ContinuousClock().now - start < .milliseconds(50))", "output": "true", "explanation": "30ms の処理を2件並行に走らせても、合計は50ms未満に収まっていることが確認できます。直列なら60ms以上かかります。"}}, "seriesId": "concurrency-parallel", "seriesStep": 3}, {"id": "practice-concurrency-019", "track": "concurrency", "lessonId": "concurrency-task-cancel", "type": "fillBlank", "difficulty": 3, "title": "キャンセルを確認しながら進める", "prompt": "各ステップの前にキャンセルを確認し、結果を受け取ります。空欄を埋めてください。", "skills": ["concurrency", "errors"], "content": {"template": "func work() async throws -> Int {\n    for i in 1...3 {\n        try {{1}}.checkCancellation()\n        print(\"step \\(i)\")\n    }\n    return 3\n}\nlet t = Task { try await work() }\nprint((try? await t.{{2}}) ?? -1)", "blanks": [{"id": "1", "options": ["Task", "Thread", "Job", "Actor"]}, {"id": "2", "options": ["value", "result", "output", "get()"]}]}, "solution": {"answers": {"1": "Task", "2": "value"}}, "hints": ["キャンセル状態を問い合わせる先は、いま実行中の単位そのものです。", "Task から結果を取り出すプロパティは1語です。throws な処理なら try が必要になります。", "1つめは型名、2つめは「完了した値」を表すプロパティ名です。result という別のプロパティもありますが、こちらは Result を返します。"], "explanation": "`Task.checkCancellation()` は現在のタスクがキャンセルされていれば CancellationError を投げる静的メソッドです。ループの各回で呼ぶことで、キャンセル要求に速やかに反応できます。`Task.value` は完了した結果を受け取るプロパティで、内部が throws ならこちらも throws になるため `try` が必要です（ここでは try? で受けて既定値 -1 を用意しています）。キャンセルされなければ step 1〜3 が表示され、3が返ります。", "detail": {"concept": "Swift のキャンセルは協調的です。cancel() はフラグを立てるだけで処理を強制停止しないため、実行側が自分で確認しなければ止まりません。", "steps": ["`Task.checkCancellation()` … キャンセル済みなら CancellationError を throw する。", "ループの各回で呼ぶことで、長い処理でも途中で抜けられる。", "`Task { ... }` で非同期処理を開始する。", "`await t.value` で完了を待ち、結果またはエラーを受け取る。"], "whyCorrect": "checkCancellation はエラーとして中断を伝えるため、呼び出し側が正常終了と区別できます。value は結果を受け取る標準的な手段で、エラーもそのまま伝播します。", "commonMistakes": ["cancel() を呼べば処理が止まると考える間違いです。確認しない処理は最後まで走り切ります。", "`Task.isCancelled` と `checkCancellation()` の使い分けを誤る間違いです。前者は Bool を返すだけ、後者はエラーを投げます。呼び出し元に中断を伝えたいなら後者です。"], "takeaway": "キャンセルは協調的。自分で checkCancellation か isCancelled を確認する。", "example": {"code": "func work() async throws -> Int {\n    for i in 1...3 { try Task.checkCancellation(); print(\"step \\(i)\") }\n    return 3\n}\nlet t = Task { try await work() }\nt.cancel()\nprint((try? await t.value) ?? -1)", "output": "-1", "explanation": "開始直後にキャンセルしたため、最初の checkCancellation で中断され、既定値の -1 が表示されます。"}}, "seriesId": "concurrency-cancel", "seriesStep": 1}, {"id": "practice-concurrency-020", "track": "concurrency", "lessonId": "concurrency-task-cancel", "type": "bugHunt", "difficulty": 4, "title": "キャンセルに反応しない箇所を見つける", "prompt": "cancel() を呼んでいるのに最後まで走り切って「完了」が表示されます。キャンセルの確認を入れるべき箇所を選んでください。", "skills": ["concurrency", "debugging"], "content": {"lines": [{"id": "l1", "code": "let task = Task {"}, {"id": "l2", "code": "    for i in 1...1_000_000 {"}, {"id": "l3", "code": "        _ = i * i"}, {"id": "l4", "code": "    }"}, {"id": "l5", "code": "    print(\"完了\")"}, {"id": "l6", "code": "}"}, {"id": "l7", "code": "task.cancel()"}]}, "solution": {"optionId": "l2", "fixedCode": "let task = Task {\n    for i in 1...1_000_000 {\n        if Task.isCancelled { print(\"中断\"); return }\n        _ = i * i\n    }\n    print(\"完了\")\n}\ntask.cancel()\n_ = await task.value"}, "hints": ["cancel() は処理を強制的に止めるのでしょうか。", "キャンセルはフラグが立つだけで、実行中の処理はそれを見に行かない限り気づけません。", "長時間まわり続ける箇所に、確認を入れる必要があります。"], "explanation": "問題はループ（2行目）がキャンセル状態をまったく確認していないことです。Swift のキャンセルは協調的で、`cancel()` はタスクにフラグを立てるだけです。await のような中断点も含まれない純粋な計算ループでは、フラグが立ったことに気づく機会がないため、最後まで走り切って「完了」が表示されます。挙動としてはクラッシュもエラーも起きず、単にキャンセルが効かないという形で現れます。修正はループの各回で `Task.isCancelled` を確認し、立っていれば早期に return することです。中断を呼び出し元にエラーとして伝えたい場合は `try Task.checkCancellation()` を使います。", "detail": {"concept": "協調的キャンセルは、実行中の処理を安全な位置で止めるための設計です。強制停止は途中状態を壊す危険があるため、言語としては提供されていません。", "steps": ["`task.cancel()` … タスクの isCancel
